<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI互动课件效果测评平台</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./assets/styles.css?v=20260704-ant">
</head>
<body>
  <div id="app" class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">AI</div>
        <div>
          <div class="brand-title">互动课件测评</div>
          <div class="brand-subtitle">Experiment Review</div>
        </div>
      </div>
      <nav class="nav">
        <button class="nav-item active" data-route="overview">总览</button>
        <button class="nav-item" data-route="style">画面风格测评</button>
        <button class="nav-item" data-route="template">一键同款 vs 套用玩法</button>
        <button class="nav-item" data-route="generation">生成模型测评</button>
        <a class="nav-item nav-link" href="./legacy.html">旧版竞品测评</a>
      </nav>
      <div class="sidebar-foot">
        <button class="utility-button" id="export-state">导出当前记录</button>
        <button class="utility-button danger" id="reset-state">清空本机改动</button>
      </div>
    </aside>

    <main class="workspace">
      <header class="topbar">
        <div>
          <div class="eyebrow">AI COURSEWARE EVALUATION</div>
          <h1 id="page-title">总览</h1>
        </div>
        <div class="topbar-actions">
          <div class="sync-pill" id="storage-state">本机记录</div>
          <a class="primary-link" href="https://coursewareeval.chenjialing.cn/" target="_blank" rel="noreferrer">线上站点</a>
        </div>
      </header>

      <section id="content" class="content"></section>
    </main>
  </div>

  <template id="image-preview-template">
    <div class="image-preview">
      <img alt="测评截图">
      <button type="button" class="ghost-button remove-image">移除截图</button>
    </div>
  </template>

  <script type="module" src="./src/app.js"></script>
</body>
</html>

<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CSS功能按钮样式预览</title><style>*{box-sizing:border-box}body{margin:0;padding:28px;background:#f4f7fb;color:#1e293b;font:15px/1.6 system-ui}main{max-width:1280px;margin:auto}h1{font-size:25px;margin:0 0 6px}p{margin:0 0 18px;color:#607087}nav{display:flex;gap:8px;margin:20px 0}nav button{padding:8px 16px;border:1px solid #cbd5e1;background:white;border-radius:8px;cursor:pointer}nav button[aria-pressed=true]{background:#234b70;color:white}.wrap{position:relative;overflow:hidden;border-radius:14px;box-shadow:0 8px 28px #1232}.stage{position:absolute;width:1920px;height:720px;transform-origin:0 0;background:#eae0d1 url('积木背景.png') center/cover;--accent:#986229;--ink:#334155;--surface:#fffcf6}.stage:not([data-theme=blocks]){background-image:linear-gradient(135deg,var(--wash),#f9fcff)}.stage[data-theme=ocean]{--accent:#086b9b;--wash:#a9d8ef}.stage[data-theme=candy]{--accent:#a82364;--wash:#f9deed}.stage[data-theme=space]{--accent:#4259b8;--wash:#cbd5f4}.stage[data-theme=forest]{--accent:#287b4a;--wash:#d2e8d4}.title{position:absolute;left:60px;top:52px;font-size:40px;font-weight:750;color:#263b4a;background:#fffdf7;padding:10px 24px;border-radius:20px}.tools{position:absolute;right:50px;top:50px;display:flex;gap:24px}.func{display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;width:96px;height:96px;background:var(--surface);color:var(--ink);border:3px solid var(--accent);border-radius:22px;box-shadow:0 5px 0 #362f2333;cursor:pointer;transition:background .12s,transform .12s}.func svg{display:block;width:64px;height:64px;pointer-events:none}.func:hover{background:#fff;outline:4px solid #fff9}.func:active{transform:translateY(3px);box-shadow:none}.func:focus-visible{outline:5px solid #1263c3;outline-offset:5px}.func[aria-pressed=true]{background:#e7eef6}.readout{position:absolute;left:60px;top:250px;background:#fffefa;padding:24px 32px;border-radius:18px;font-size:34px}.results{position:absolute;right:50px;bottom:50px;display:flex;gap:24px}.label{width:240px;height:96px;gap:14px;font-size:34px;font-weight:700}.label svg{width:44px;height:44px}.primary{background:var(--accent);color:white}.primary:hover{background:var(--accent)}.dimensions{position:absolute;left:60px;bottom:50px;background:#fffdf7;color:#445367;padding:14px 22px;border-radius:12px;font-size:25px}.notes{margin-top:20px;padding:18px 22px;background:white;border:1px solid #dce4ef;border-radius:12px}.notes p{margin:5px 0}a{color:#245de8}</style><main><h1>CSS功能按钮样式预览</h1><p>这是手工CSS样式验证，尚非Box生成结果。看右上角重置、声音按钮：独立实色底座＋标准SVG，不再生成功能图标图片。</p><nav><button data-set="blocks" aria-pressed="true">积木教具</button><button data-set="ocean">海洋探索</button><button data-set="candy">糖果乐园</button><button data-set="space">太空探索</button><button data-set="forest">森林冒险</button></nav><div class="wrap"><div class="stage" data-theme="blocks"><div class="title">功能按钮统一，主题只改变配色</div><div class="tools"><button class="func" id="reset" aria-label="重置"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10a9 9 0 1 1 2 8M3 3v7h7"/></svg></button><button class="func" id="sound" aria-label="关闭声音" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m11 4-6 5H2v6h3l6 5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg></button></div><div class="readout" id="status" aria-live="polite">可点击右上角按钮，检查图标、反馈与状态切换</div><div class="dimensions">逻辑画布1920宽 · 图标按钮96×96 / SVG64×64 · 间距24</div><div class="results"><button class="func label" id="retry"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10a9 9 0 1 1 2 8M3 3v7h7"/></svg><span>重试</span></button><button class="func label primary" id="next"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h16m-6-6 6 6-6 6"/></svg><span>下一步</span></button></div></div></div><div class="notes"><p>主题保留：配色、圆角、描边、轻阴影。按钮形状及图标语义保持标准。</p><p>功能保护：保留原节点、事件和静音逻辑；不缩小教学图片，不给所有图片统一加padding或box-sizing。</p><p><a href="V2.6标准CSS按钮_逐项对照.html">查看19种风格逐行修改</a> · <a href="CSS功能按钮_完整通用规则.txt">下载通用按钮规则</a></p></div></main><script>const stage=document.querySelector('.stage'),wrap=document.querySelector('.wrap');function fit(){let scale=wrap.clientWidth/1920;stage.style.transform=`scale(${scale})`;wrap.style.height=720*scale+'px'}new ResizeObserver(fit).observe(wrap);fit();const status=document.getElementById('status'),sound=document.getElementById('sound');let muted=false;sound.onclick=()=>{muted=!muted;sound.innerHTML=muted?"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m11 4-6 5H2v6h3l6 5z\"/><path d=\"m17 9 5 6m0-6-5 6\"/></svg>":"<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m11 4-6 5H2v6h3l6 5z\"/><path d=\"M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14\"/></svg>";sound.setAttribute('aria-pressed',String(muted));sound.setAttribute('aria-label',muted?'开启声音':'关闭声音');status.textContent=muted?'已切换静音图标（样式演示，无真实音频）':'已恢复声音图标（样式演示，无真实音频）'};const reset=()=>{status.textContent='已重置演示状态；按钮位置和尺寸保持不变'};document.getElementById('reset').onclick=reset;document.getElementById('retry').onclick=reset;document.getElementById('next').onclick=()=>status.textContent='下一步按钮反馈正常（样式演示）';document.querySelectorAll('[data-set]').forEach(b=>b.onclick=()=>{stage.dataset.theme=b.dataset.set;document.querySelectorAll('[data-set]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))});</script></html>

体明亮、温润、启蒙友好。材质可用轻纸张、字卡、浅木、印章、描红纸和磨砂白板，不使用英语单词卡、随机字母、霓虹科技、糖果宇宙或过度春日绘本元素。\n色彩只作为视觉方向，不在图片中显示任何色号、色卡编号、代码、CSS 文本或设计参数。装饰密度必须低于学习内容，书卷、毛笔、印章、竹叶、字卡盒和课堂道具只放边缘或卡片角落，不能穿过题目、汉字、拼音、槽位、选项、按钮和反馈区域。\n\n6. UI层级与反馈\n底层是温润国文启蒙课堂或学习桌背景；中层是中央字卡练习台和内部纸面功能卡，盖在背景图上，由html/CSS/JS 绘制适合本风格的题板区域；上层是偏旁块、笔画卡、选项、按钮、反馈条和当前选中态；弹窗层用于结果、时间到或完成反馈，必须有遮罩或清楚独立卡片。\n正确反馈使用浅绿描边、印章盖章、小星光或字卡轻弹；错误反馈使用柔和红橙边框和轻微回弹；选中态使用朱砂红或温暖黄描边；拖拽落位使用田字格或字卡槽轻亮。所有反馈只强化原交互，不新增新玩法，不改变原题目判断逻辑。\n\n7. 音效反馈规范\n音效是 UI 反馈的一部分，必须优先匹配当前风格的专属音效；只用于强化点击、选中、拖拽、落位、提交、答对、答错、提示、完成和重置状态，不改变原课件玩法、题型、节奏和按钮功能。音效需短促、低音量、低干扰，不能循环播放，不能盖过教学语音；需遵守原课件已有静音和音量设置。若没有真实音频素材，可用平台素材库、安全音效或 WebAudio 近似实现，但仍要尽量贴近本风格音效意图。\n本风格音效：点击使用白板笔或木质字卡轻点声，拖拽落位使用纸卡吸附声，答对使用轻印章和星星奖励音，答错使用柔和纸卡回弹声，不能新增与原学科冲突的朗读音。\n\n8. 禁止项\n禁止生成无关实体、无关玩法、无关学科内容、伪文字、乱码、伪汉字、书页假字、随机英文、品牌名、公司名、水印、二维码、角标、设计参数、色值、代码、CSS 标注、软件界面说明、宣传语和不可编辑的题目内容。禁止遮挡、重绘、扭曲或弱化原题目、题板、格线、槽位、按钮和反馈状态。尤其禁止把英语启蒙风的单词卡、随机字母、听音拼写 UI 误混入汉字启蒙风。", "new": "请严格按“汉字启蒙风 UI规范”重新生成同一课件界面。\n\n0. 原课件保留规则\n本风格只用于 UI 视觉换肤，不得改变原课件的学科、题型、题目内容、答案、素材数量、槽位数量、组件数量、布局关系、按钮功能、计分逻辑和交互流程。原来是英语看图拼词、填空、拖拽、选择、分类、连线、逻辑推理或其他玩法，换风格后仍保持原玩法和原题目结构。主互动题页中的题干、选项、答案、字母、单词、汉字、拼音、数字、公式、倒计时、得分、按钮文案、反馈文案和关卡信息等可变教学内容，必须由 HTML/CSS/JS 渲染，不要烘焙进背景图或题板底图。尤其禁止因为选择汉字启蒙风，把英语、数学或其他原课件改成语文识字题。\n\n1. 整体视觉与布局\n风格识别锚点：第一眼应像高饱和明亮的低龄汉字学习课。使用橙色、天空蓝、活力红、清新绿、温暖黄、白色大圆角内容卡片、字卡练习台、印章奖励和生活化启蒙场景；只有原课件本来是语文识字任务时，才可使用拟人汉字角色、大汉字、象形演变、听音辨字和笔画描红结构。\n采用“低龄汉字认知课堂 + 字卡练习台”的 UI，而不是通用春日白板。画面第一眼应能看出是汉字启蒙学习：可使用描红纸、田字格样式空槽、偏旁积木、笔画卡、字卡收纳盒、印章奖励、毛笔或白板笔、书卷边框、课堂小桌和温和国文启蒙道具。所有这些元素只作为 UI 结构和视觉锚点，不生成随机汉字、伪字、古文、标语或无关标题。\n主学习区集中在中央大号字卡练习台内。顶部承载原课件标题、关卡、进度、奖励、倒计时或得分；中央按原课件结构放置题干、图片、田字格样式槽位、偏旁/笔画/字卡素材池、选项区、连线区或分类区；底部或右侧放主要操作按钮。若原课件本来是汉字、偏旁、拼音或识字任务，推荐形成“目标字卡 + 田字格/结构槽 + 部件素材池”的清晰结构；若原课件不是语文题，只使用汉字启蒙风的纸张、字卡、印章和课堂道具，不改变原内容。\n\n2. 封面图规范与生图提示词逻辑\n【本节适用范围】第2节是完整封面设计，第3节是进入后的主互动页背景，两者必须分别生成、分别使用。封面继续执行本节第3项的原有美术描述，包括艺术字、角色、场景、材质、副标题载体和按钮设计；不得把它改成“空背景＋普通HTML标题按钮”。第3节的无文字、无按钮、中央留白要求，以及第4—6节的题板、标准正文字体、学习区低干扰规则，只约束主互动页，不得用来删减封面。除用户在本次调整中明确要求不要封面外，仍按原版规范生成完整图片式首页。\n\n1）封面图用于儿童互动课件首页。封面图本身必须生成主标题、副标题和进入按钮；副标题不得超过15个字，图上不生成任何额外文字、包括风格名、品牌名、logo、水印、二维码、角标、色值、尺寸标记、伪文字或无关宣传语都不允许生成。封面图中的主标题、副标题、按钮造型和按钮文字是最终可见内容，必须保留。HTML 不得在这张封面图上再次叠加可见标题、副标题、按钮、按钮文字或底座；只配置覆盖封面的透明点击层，点击封面任意位置进入原课件。这里禁止的是 HTML 重复叠加，不是禁止图片生成标题或按钮。\n2）主标题、副标题和按钮文案都是可变元素，必须根据当前课件真实内容替换；若为英语课件则尽量用英文，若非英语课件则一律用中文。标题、短副标题和进入按钮需要沿同一视觉主轴组织，层级清楚、可读性强，适合课堂投屏。\n3）本视觉风格封面的生图提示词：\n高饱和明亮的低龄汉字启蒙封面，天空蓝、草地、温暖黄、活力红和清新绿配色，儿童学习村庄、树木、小屋和彩虹。左侧可有拟人汉字角色，右侧可有小朋友、兔子学习伙伴、铅笔、字卡和田字格道具。中心上方生成圆润彩色大标题“{标题内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，标题像儿童识字 App，厚白描边、带星星和铅笔装饰。标题下方生成红色或蓝色丝带副标题“{副标题内容根据课件真实内容填充，副标题不超过15个字，若为英语课件则尽量用英文，若非英文课件则一律用中文}”。中下方生成黄色或橙色圆角按钮，按钮文字为“{开始学习，按钮内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，按钮带白色高光和小箭头。\n\n4）封面接入顺序：先根据真实课件确认主标题、短副标题和进入文案，再依照上面的原版美术描述生成一张完整封面图；将它完整适配课件舞台，不裁掉文字、角色或按钮，也不把整张封面当作中间的小插图套进另一张封面。仅在封面容器内移除或隐藏源 HTML 的标题、副标题、示例插画和可见开始按钮，清理伪元素及 CSS 背景中重复的文字/按钮；主互动页的题干、选项、答案、控件和逻辑全部保留。不要因源课件原来使用 HTML 标题而继续保留第二套可见封面。\n5）透明点击层只承接进入事件，不绘制文字、图标、背景、边框、阴影或底座；可保留不可见的无障碍名称和键盘进入能力，不能将整张封面图设成透明。一次完整点击/触控只进入一次，不在 pointerdown 时提前撤掉封面；隔离本次手势，禁止继续触发下一页答案、拖拽或提交。进入第一题时仍为未作答状态。\n6）交付前同时核对封面原图与浏览器实际首屏：图中艺术标题、短副标题和设计按钮齐全且各一套，浏览器没有额外的可见 DOM/CSS 文字或按钮，点击任意位置可进入第一题。若有重复，修正 HTML 接入层；若图中文字错误，单独修正封面素材。不得用删掉艺术字、角色、按钮设计，换成空场景，或直接跳过封面的办法通过去重检查。\n\n3. 背景图规范与生图提示词逻辑\n1）背景图只用于提供风格氛围，不强行生成题目承载区域。题目白板、任务板、卡片、槽位、按钮和状态栏应由 HTML/CSS/JS 根据当前课件内容绘制，并覆盖在背景图上。背景图中不要生成框、白板、题板、任务板、玻璃板、卡片、按钮、标题、题目文字、选项文字、数字、字母、汉字、格线、槽位、logo、水印或二维码。\n2）背景图可以参考该风格 bg 图和 cover 图的视觉感觉自由延展，但只保留场景、色彩、材质、角色气质和边缘装饰；画面中心应保持开阔、低干扰，方便前端绘制适配当前题型的题板。\n3）本视觉风格背景图的生图提示词：\n明亮低龄汉字启蒙背景，蓝天、草地、儿童学习村庄、树木、小屋、铅笔、字卡、拟人汉字角色和兔子/小朋友学习伙伴靠边放置。画面中心保持开阔、干净、低纹理，方便 HTML/CSS/JS 绘制汉字学习题板。不要生成白板框、田字格框、按钮、标题、汉字、拼音、伪汉字、logo、水印或二维码。\n\n4. 按钮、字体与触控规范\n按钮使用印章按钮、纸艺胶囊按钮、字卡按钮和温暖圆角确认按钮。开始、下一题、提交、重置等按钮保持原功能，不因为汉字风格新增描红、朗读或笔顺教学玩法。\n汉字、偏旁、拼音和笔画内容必须使用标准清晰字形，适合课堂投屏；汉字学习内容可使用清楚楷体、宋体或教学黑体，但不能装饰化变形。英语字母、单词、数学数字或其他学科内容跟随原课件保持标准字体。所有核心文字、字卡、选项卡、拖拽块和按钮都要触碰面积充足、间距舒适、边界清楚。\n\n5. 色彩、材质与装饰密度\n色彩以奶油宣纸白、浅米黄、朱砂红、竹青、浅木色、天空蓝、温暖黄和清新绿为主，整体明亮、温润、启蒙友好。材质可用轻纸张、字卡、浅木、印章、描红纸和磨砂白板，不使用英语单词卡、随机字母、霓虹科技、糖果宇宙或过度春日绘本元素。\n色彩只作为视觉方向，不在图片中显示任何色号、色卡编号、代码、CSS 文本或设计参数。装饰密度必须低于学习内容，书卷、毛笔、印章、竹叶、字卡盒和课堂道具只放边缘或卡片角落，不能穿过题目、汉字、拼音、槽位、选项、按钮和反馈区域。\n\n6. UI层级与反馈\n底层是温润国文启蒙课堂或学习桌背景；中层是中央字卡练习台和内部纸面功能卡，盖在背景图上，由html/CSS/JS 绘制适合本风格的题板区域；上层是偏旁块、笔画卡、选项、按钮、反馈条和当前选中态；弹窗层用于结果、时间到或完成反馈，必须有遮罩或清楚独立卡片。\n正确反馈使用浅绿描边、印章盖章、小星光或字卡轻弹；错误反馈使用柔和红橙边框和轻微回弹；选中态使用朱砂红或温暖黄描边；拖拽落位使用田字格或字卡槽轻亮。所有反馈只强化原交互，不新增新玩法，不改变原题目判断逻辑。\n\n7. 音效反馈规范\n音效是 UI 反馈的一部分，必须优先匹配当前风格的专属音效；只用于强化点击、选中、拖拽、落位、提交、答对、答错、提示、完成和重置状态，不改变原课件玩法、题型、节奏和按钮功能。音效需短促、低音量、低干扰，不能循环播放，不能盖过教学语音；需遵守原课件已有静音和音量设置。若没有真实音频素材，可用平台素材库、安全音效或 WebAudio 近似实现，但仍要尽量贴近本风格音效意图。\n本风格音效：点击使用白板笔或木质字卡轻点声，拖拽落位使用纸卡吸附声，答对使用轻印章和星星奖励音，答错使用柔和纸卡回弹声，不能新增与原学科冲突的朗读音。\n\n8. 禁止项\n禁止生成无关实体、无关玩法、无关学科内容、伪文字、乱码、伪汉字、书页假字、随机英文、品牌名、公司名、水印、二维码、角标、设计参数、色值、代码、CSS 标注、软件界面说明、宣传语和不可编辑的题目内容。禁止遮挡、重绘、扭曲或弱化原题目、题板、格线、槽位、按钮和反馈状态。尤其禁止把英语启蒙风的单词卡、随机字母、听音拼写 UI 误混入汉字启蒙风。", "sectionsOld": ["请严格按“汉字启蒙风 UI规范”重新生成同一课件界面。\n\n", "0. 原课件保留规则\n本风格只用于 UI 视觉换肤，不得改变原课件的学科、题型、题目内容、答案、素材数量、槽位数量、组件数量、布局关系、按钮功能、计分逻辑和交互流程。原来是英语看图拼词、填空、拖拽、选择、分类、连线、逻辑推理或其他玩法，换风格后仍保持原玩法和原题目结构。主互动题页中的题干、选项、答案、字母、单词、汉字、拼音、数字、公式、倒计时、得分、按钮文案、反馈文案和关卡信息等可变教学内容，必须由 HTML/CSS/JS 渲染，不要烘焙进背景图或题板底图。尤其禁止因为选择汉字启蒙风，把英语、数学或其他原课件改成语文识字题。\n\n", "1. 整体视觉与布局\n风格识别锚点：第一眼应像高饱和明亮的低龄汉字学习课。使用橙色、天空蓝、活力红、清新绿、温暖黄、白色大圆角内容卡片、字卡练习台、印章奖励和生活化启蒙场景；只有原课件本来是语文识字任务时，才可使用拟人汉字角色、大汉字、象形演变、听音辨字和笔画描红结构。\n采用“低龄汉字认知课堂 + 字卡练习台”的 UI，而不是通用春日白板。画面第一眼应能看出是汉字启蒙学习：可使用描红纸、田字格样式空槽、偏旁积木、笔画卡、字卡收纳盒、印章奖励、毛笔或白板笔、书卷边框、课堂小桌和温和国文启蒙道具。所有这些元素只作为 UI 结构和视觉锚点，不生成随机汉字、伪字、古文、标语或无关标题。\n主学习区集中在中央大号字卡练习台内。顶部承载原课件标题、关卡、进度、奖励、倒计时或得分；中央按原课件结构放置题干、图片、田字格样式槽位、偏旁/笔画/字卡素材池、选项区、连线区或分类区；底部或右侧放主要操作按钮。若原课件本来是汉字、偏旁、拼音或识字任务，推荐形成“目标字卡 + 田字格/结构槽 + 部件素材池”的清晰结构；若原课件不是语文题，只使用汉字启蒙风的纸张、字卡、印章和课堂道具，不改变原内容。\n\n", "2. 封面图规范与生图提示词逻辑\n1）封面图用于儿童互动课件首页。封面图本身必须生成主标题、副标题和进入按钮；副标题不得超过15个字，图上不生成任何额外文字、包括风格名、品牌名、logo、水印、二维码、角标、色值、尺寸标记、伪文字或无关宣传语都不允许生成。逻辑上，从封面图任意位置点击即可进入，禁止在封面图上再生成任何文字/按钮，只需要配置点击事件。\n2）主标题、副标题和按钮文案都是可变元素，必须根据当前课件真实内容替换；若为英语课件则尽量用英文，若非英语课件则一律用中文。标题、短副标题和进入按钮需要沿同一视觉主轴组织，层级清楚、可读性强，适合课堂投屏。\n3）本视觉风格封面的生图提示词：\n高饱和明亮的低龄汉字启蒙封面，天空蓝、草地、温暖黄、活力红和清新绿配色，儿童学习村庄、树木、小屋和彩虹。左侧可有拟人汉字角色，右侧可有小朋友、兔子学习伙伴、铅笔、字卡和田字格道具。中心上方生成圆润彩色大标题“{标题内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，标题像儿童识字 App，厚白描边、带星星和铅笔装饰。标题下方生成红色或蓝色丝带副标题“{副标题内容根据课件真实内容填充，副标题不超过15个字，若为英语课件则尽量用英文，若非英文课件则一律用中文}”。中下方生成黄色或橙色圆角按钮，按钮文字为“{开始学习，按钮内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，按钮带白色高光和小箭头。\n\n", "3. 背景图规范与生图提示词逻辑\n1）背景图只用于提供风格氛围，不强行生成题目承载区域。题目白板、任务板、卡片、槽位、按钮和状态栏应由 HTML/CSS/JS 根据当前课件内容绘制，并覆盖在背景图上。背景图中不要生成框、白板、题板、任务板、玻璃板、卡片、按钮、标题、题目文字、选项文字、数字、字母、汉字、格线、槽位、logo、水印或二维码。\n2）背景图可以参考该风格 bg 图和 cover 图的视觉感觉自由延展，但只保留场景、色彩、材质、角色气质和边缘装饰；画面中心应保持开阔、低干扰，方便前端绘制适配当前题型的题板。\n3）本视觉风格背景图的生图提示词：\n明亮低龄汉字启蒙背景，蓝天、草地、儿童学习村庄、树木、小屋、铅笔、字卡、拟人汉字角色和兔子/小朋友学习伙伴靠边放置。画面中心保持开阔、干净、低纹理，方便 HTML/CSS/JS 绘制汉字学习题板。不要生成白板框、田字格框、按钮、标题、汉字、拼音、伪汉字、logo、水印或二维码。\n\n", "4. 按钮、字体与触控规范\n按钮使用印章按钮、纸艺胶囊按钮、字卡按钮和温暖圆角确认按钮。开始、下一题、提交、重置等按钮保持原功能，不因为汉字风格新增描红、朗读或笔顺教学玩法。\n汉字、偏旁、拼音和笔画内容必须使用标准清晰字形，适合课堂投屏；汉字学习内容可使用清楚楷体、宋体或教学黑体，但不能装饰化变形。英语字母、单词、数学数字或其他学科内容跟随原课件保持标准字体。所有核心文字、字卡、选项卡、拖拽块和按钮都要触碰面积充足、间距舒适、边界清楚。\n\n", "5. 色彩、材质与装饰密度\n色彩以奶油宣纸白、浅米黄、朱砂红、竹青、浅木色、天空蓝、温暖黄和清新绿为主，整体明亮、温润、启蒙友好。材质可用轻纸张、字卡、浅木、印章、描红纸和磨砂白板，不使用英语单词卡、随机字母、霓虹科技、糖果宇宙或过度春日绘本元素。\n色彩只作为视觉方向，不在图片中显示任何色号、色卡编号、代码、CSS 文本或设计参数。装饰密度必须低于学习内容，书卷、毛笔、印章、竹叶、字卡盒和课堂道具只放边缘或卡片角落，不能穿过题目、汉字、拼音、槽位、选项、按钮和反馈区域。\n\n", "6. UI层级与反馈\n底层是温润国文启蒙课堂或学习桌背景；中层是中央字卡练习台和内部纸面功能卡，盖在背景图上，由html/CSS/JS 绘制适合本风格的题板区域；上层是偏旁块、笔画卡、选项、按钮、反馈条和当前选中态；弹窗层用于结果、时间到或完成反馈，必须有遮罩或清楚独立卡片。\n正确反馈使用浅绿描边、印章盖章、小星光或字卡轻弹；错误反馈使用柔和红橙边框和轻微回弹；选中态使用朱砂红或温暖黄描边；拖拽落位使用田字格或字卡槽轻亮。所有反馈只强化原交互，不新增新玩法，不改变原题目判断逻辑。\n\n", "7. 音效反馈规范\n音效是 UI 反馈的一部分，必须优先匹配当前风格的专属音效；只用于强化点击、选中、拖拽、落位、提交、答对、答错、提示、完成和重置状态，不改变原课件玩法、题型、节奏和按钮功能。音效需短促、低音量、低干扰，不能循环播放，不能盖过教学语音；需遵守原课件已有静音和音量设置。若没有真实音频素材，可用平台素材库、安全音效或 WebAudio 近似实现，但仍要尽量贴近本风格音效意图。\n本风格音效：点击使用白板笔或木质字卡轻点声，拖拽落位使用纸卡吸附声，答对使用轻印章和星星奖励音，答错使用柔和纸卡回弹声，不能新增与原学科冲突的朗读音。\n\n", "8. 禁止项\n禁止生成无关实体、无关玩法、无关学科内容、伪文字、乱码、伪汉字、书页假字、随机英文、品牌名、公司名、水印、二维码、角标、设计参数、色值、代码、CSS 标注、软件界面说明、宣传语和不可编辑的题目内容。禁止遮挡、重绘、扭曲或弱化原题目、题板、格线、槽位、按钮和反馈状态。尤其禁止把英语启蒙风的单词卡、随机字母、听音拼写 UI 误混入汉字启蒙风。"], "sectionsNew": ["请严格按“汉字启蒙风 UI规范”重新生成同一课件界面。\n\n", "0. 原课件保留规则\n本风格只用于 UI 视觉换肤，不得改变原课件的学科、题型、题目内容、答案、素材数量、槽位数量、组件数量、布局关系、按钮功能、计分逻辑和交互流程。原来是英语看图拼词、填空、拖拽、选择、分类、连线、逻辑推理或其他玩法，换风格后仍保持原玩法和原题目结构。主互动题页中的题干、选项、答案、字母、单词、汉字、拼音、数字、公式、倒计时、得分、按钮文案、反馈文案和关卡信息等可变教学内容，必须由 HTML/CSS/JS 渲染，不要烘焙进背景图或题板底图。尤其禁止因为选择汉字启蒙风，把英语、数学或其他原课件改成语文识字题。\n\n", "1. 整体视觉与布局\n风格识别锚点：第一眼应像高饱和明亮的低龄汉字学习课。使用橙色、天空蓝、活力红、清新绿、温暖黄、白色大圆角内容卡片、字卡练习台、印章奖励和生活化启蒙场景；只有原课件本来是语文识字任务时，才可使用拟人汉字角色、大汉字、象形演变、听音辨字和笔画描红结构。\n采用“低龄汉字认知课堂 + 字卡练习台”的 UI，而不是通用春日白板。画面第一眼应能看出是汉字启蒙学习：可使用描红纸、田字格样式空槽、偏旁积木、笔画卡、字卡收纳盒、印章奖励、毛笔或白板笔、书卷边框、课堂小桌和温和国文启蒙道具。所有这些元素只作为 UI 结构和视觉锚点，不生成随机汉字、伪字、古文、标语或无关标题。\n主学习区集中在中央大号字卡练习台内。顶部承载原课件标题、关卡、进度、奖励、倒计时或得分；中央按原课件结构放置题干、图片、田字格样式槽位、偏旁/笔画/字卡素材池、选项区、连线区或分类区；底部或右侧放主要操作按钮。若原课件本来是汉字、偏旁、拼音或识字任务，推荐形成“目标字卡 + 田字格/结构槽 + 部件素材池”的清晰结构；若原课件不是语文题，只使用汉字启蒙风的纸张、字卡、印章和课堂道具，不改变原内容。\n\n", "2. 封面图规范与生图提示词逻辑\n【本节适用范围】第2节是完整封面设计，第3节是进入后的主互动页背景，两者必须分别生成、分别使用。封面继续执行本节第3项的原有美术描述，包括艺术字、角色、场景、材质、副标题载体和按钮设计；不得把它改成“空背景＋普通HTML标题按钮”。第3节的无文字、无按钮、中央留白要求，以及第4—6节的题板、标准正文字体、学习区低干扰规则，只约束主互动页，不得用来删减封面。除用户在本次调整中明确要求不要封面外，仍按原版规范生成完整图片式首页。\n\n1）封面图用于儿童互动课件首页。封面图本身必须生成主标题、副标题和进入按钮；副标题不得超过15个字，图上不生成任何额外文字、包括风格名、品牌名、logo、水印、二维码、角标、色值、尺寸标记、伪文字或无关宣传语都不允许生成。封面图中的主标题、副标题、按钮造型和按钮文字是最终可见内容，必须保留。HTML 不得在这张封面图上再次叠加可见标题、副标题、按钮、按钮文字或底座；只配置覆盖封面的透明点击层，点击封面任意位置进入原课件。这里禁止的是 HTML 重复叠加，不是禁止图片生成标题或按钮。\n2）主标题、副标题和按钮文案都是可变元素，必须根据当前课件真实内容替换；若为英语课件则尽量用英文，若非英语课件则一律用中文。标题、短副标题和进入按钮需要沿同一视觉主轴组织，层级清楚、可读性强，适合课堂投屏。\n3）本视觉风格封面的生图提示词：\n高饱和明亮的低龄汉字启蒙封面，天空蓝、草地、温暖黄、活力红和清新绿配色，儿童学习村庄、树木、小屋和彩虹。左侧可有拟人汉字角色，右侧可有小朋友、兔子学习伙伴、铅笔、字卡和田字格道具。中心上方生成圆润彩色大标题“{标题内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，标题像儿童识字 App，厚白描边、带星星和铅笔装饰。标题下方生成红色或蓝色丝带副标题“{副标题内容根据课件真实内容填充，副标题不超过15个字，若为英语课件则尽量用英文，若非英文课件则一律用中文}”。中下方生成黄色或橙色圆角按钮，按钮文字为“{开始学习，按钮内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，按钮带白色高光和小箭头。\n\n4）封面接入顺序：先根据真实课件确认主标题、短副标题和进入文案，再依照上面的原版美术描述生成一张完整封面图；将它完整适配课件舞台，不裁掉文字、角色或按钮，也不把整张封面当作中间的小插图套进另一张封面。仅在封面容器内移除或隐藏源 HTML 的标题、副标题、示例插画和可见开始按钮，清理伪元素及 CSS 背景中重复的文字/按钮；主互动页的题干、选项、答案、控件和逻辑全部保留。不要因源课件原来使用 HTML 标题而继续保留第二套可见封面。\n5）透明点击层只承接进入事件，不绘制文字、图标、背景、边框、阴影或底座；可保留不可见的无障碍名称和键盘进入能力，不能将整张封面图设成透明。一次完整点击/触控只进入一次，不在 pointerdown 时提前撤掉封面；隔离本次手势，禁止继续触发下一页答案、拖拽或提交。进入第一题时仍为未作答状态。\n6）交付前同时核对封面原图与浏览器实际首屏：图中艺术标题、短副标题和设计按钮齐全且各一套，浏览器没有额外的可见 DOM/CSS 文字或按钮，点击任意位置可进入第一题。若有重复，修正 HTML 接入层；若图中文字错误，单独修正封面素材。不得用删掉艺术字、角色、按钮设计，换成空场景，或直接跳过封面的办法通过去重检查。\n\n", "3. 背景图规范与生图提示词逻辑\n1）背景图只用于提供风格氛围，不强行生成题目承载区域。题目白板、任务板、卡片、槽位、按钮和状态栏应由 HTML/CSS/JS 根据当前课件内容绘制，并覆盖在背景图上。背景图中不要生成框、白板、题板、任务板、玻璃板、卡片、按钮、标题、题目文字、选项文字、数字、字母、汉字、格线、槽位、logo、水印或二维码。\n2）背景图可以参考该风格 bg 图和 cover 图的视觉感觉自由延展，但只保留场景、色彩、材质、角色气质和边缘装饰；画面中心应保持开阔、低干扰，方便前端绘制适配当前题型的题板。\n3）本视觉风格背景图的生图提示词：\n明亮低龄汉字启蒙背景，蓝天、草地、儿童学习村庄、树木、小屋、铅笔、字卡、拟人汉字角色和兔子/小朋友学习伙伴靠边放置。画面中心保持开阔、干净、低纹理，方便 HTML/CSS/JS 绘制汉字学习题板。不要生成白板框、田字格框、按钮、标题、汉字、拼音、伪汉字、logo、水印或二维码。\n\n", "4. 按钮、字体与触控规范\n按钮使用印章按钮、纸艺胶囊按钮、字卡按钮和温暖圆角确认按钮。开始、下一题、提交、重置等按钮保持原功能，不因为汉字风格新增描红、朗读或笔顺教学玩法。\n汉字、偏旁、拼音和笔画内容必须使用标准清晰字形，适合课堂投屏；汉字学习内容可使用清楚楷体、宋体或教学黑体，但不能装饰化变形。英语字母、单词、数学数字或其他学科内容跟随原课件保持标准字体。所有核心文字、字卡、选项卡、拖拽块和按钮都要触碰面积充足、间距舒适、边界清楚。\n\n", "5. 色彩、材质与装饰密度\n色彩以奶油宣纸白、浅米黄、朱砂红、竹青、浅木色、天空蓝、温暖黄和清新绿为主，整体明亮、温润、启蒙友好。材质可用轻纸张、字卡、浅木、印章、描红纸和磨砂白板，不使用英语单词卡、随机字母、霓虹科技、糖果宇宙或过度春日绘本元素。\n色彩只作为视觉方向，不在图片中显示任何色号、色卡编号、代码、CSS 文本或设计参数。装饰密度必须低于学习内容，书卷、毛笔、印章、竹叶、字卡盒和课堂道具只放边缘或卡片角落，不能穿过题目、汉字、拼音、槽位、选项、按钮和反馈区域。\n\n", "6. UI层级与反馈\n底层是温润国文启蒙课堂或学习桌背景；中层是中央字卡练习台和内部纸面功能卡，盖在背景图上，由html/CSS/JS 绘制适合本风格的题板区域；上层是偏旁块、笔画卡、选项、按钮、反馈条和当前选中态；弹窗层用于结果、时间到或完成反馈，必须有遮罩或清楚独立卡片。\n正确反馈使用浅绿描边、印章盖章、小星光或字卡轻弹；错误反馈使用柔和红橙边框和轻微回弹；选中态使用朱砂红或温暖黄描边；拖拽落位使用田字格或字卡槽轻亮。所有反馈只强化原交互，不新增新玩法，不改变原题目判断逻辑。\n\n", "7. 音效反馈规范\n音效是 UI 反馈的一部分，必须优先匹配当前风格的专属音效；只用于强化点击、选中、拖拽、落位、提交、答对、答错、提示、完成和重置状态，不改变原课件玩法、题型、节奏和按钮功能。音效需短促、低音量、低干扰，不能循环播放，不能盖过教学语音；需遵守原课件已有静音和音量设置。若没有真实音频素材，可用平台素材库、安全音效或 WebAudio 近似实现，但仍要尽量贴近本风格音效意图。\n本风格音效：点击使用白板笔或木质字卡轻点声，拖拽落位使用纸卡吸附声，答对使用轻印章和星星奖励音，答错使用柔和纸卡回弹声，不能新增与原学科冲突的朗读音。\n\n", "8. 禁止项\n禁止生成无关实体、无关玩法、无关学科内容、伪文字、乱码、伪汉字、书页假字、随机英文、品牌名、公司名、水印、二维码、角标、设计参数、色值、代码、CSS 标注、软件界面说明、宣传语和不可编辑的题目内容。禁止遮挡、重绘、扭曲或弱化原题目、题板、格线、槽位、按钮和反馈状态。尤其禁止把英语启蒙风的单词卡、随机字母、听音拼写 UI 误混入汉字启蒙风。"], "section2": 3, "blocks": [{"kind": "equal", "old": "2. 封面图规范与生图提示词逻辑\n", "new": "2. 封面图规范与生图提示词逻辑\n"}, {"kind": "insert", "old": "", "new": "【本节适用范围】第2节是完整封面设计，第3节是进入后的主互动页背景，两者必须分别生成、分别使用。封面继续执行本节第3项的原有美术描述，包括艺术字、角 是英语看图拼词、填空、拖拽、选择、分类、连线、逻辑推理或其他玩法，换风格后仍保持原玩法和原题目结构。主互动题页中的题干、选项、答案、字母、汉字、拼音、数字、公式、倒计时、得分、按钮文案、反馈文案和关卡信息等可变教学内容，必须由 HTML/CSS/JS 渲染，不要烘焙进背景图或题板底图。\n\n1. 整体视觉与布局\n风格识别锚点：第一眼应像软萌童话宇宙和果冻闯关 UI。使用圆润蛋形角色、大眼睛、无硬棱角、暖色高饱和糖果色、软云、彩虹桥、圆润山丘、糖果屋、甜甜圈道具、糖果渐变大圆角按钮和白描边；动效观感要像果冻 Q 弹，明亮、弹跳、轻竞技。\n采用软萌童话宇宙和果冻 Q 弹 UI。画面可以有圆润蛋形角色、大眼睛、软云、彩虹桥、圆润山丘、糖果屋、甜甜圈和软糖道具。整体明亮、高饱和、圆润、有弹性，不能变成暗黑科技、硬质金属或普通卡片风。\n使用横版课件画布，画布主体集中在中央学习区，四周保留安全边距。顶部保留原课件已有标题、关卡、进度、奖励、倒计时或得分信息；中央按原课件布局放置题目、图片区、网格、线索、选项、素材池、槽位或操作区；底部或右侧保留原有按钮和工具按钮。背景只提供氛围，不承担学习信息。\n\n2. 封面图规范与生图提示词逻辑\n【本节适用范围】第2节是完整封面设计，第3节是进入后的主互动页背景，两者必须分别生成、分别使用。封面继续执行本节第3项的原有美术描述，包括艺术字、角色、场景、材质、副标题载体和按钮设计；不得把它改成“空背景＋普通HTML标题按钮”。第3节的无文字、无按钮、中央留白要求，以及第4—6节的题板、标准正文字体、学习区低干扰规则，只约束主互动页，不得用来删减封面。除用户在本次调整中明确要求不要封面外，仍按原版规范生成完整图片式首页。\n\n1）封面图用于儿童互动课件首页。封面图本身必须生成主标题、副标题和进入按钮；副标题不得超过15个字，图上不生成任何额外文字、包括风格名、品牌名、logo、水印、二维码、角标、色值、尺寸标记、伪文字或无关宣传语都不允许生成。封面图中的主标题、副标题、按钮造型和按钮文字是最终可见内容，必须保留。HTML 不得在这张封面图上再次叠加可见标题、副标题、按钮、按钮文字或底座；只配置覆盖封面的透明点击层，点击封面任意位置进入原课件。这里禁止的是 HTML 重复叠加，不是禁止图片生成标题或按钮。\n2）主标题、副标题和按钮文案都是可变元素，必须根据当前课件真实内容替换；若为英语课件则尽量用英文，若非英语课件则一律用中文。标题、短副标题和进入按钮需要沿同一视觉主轴组织，层级清楚、可读性强，适合课堂投屏。\n3）本视觉风格封面的生图提示词：\n软萌童话宇宙儿童封面，暖色调高饱和糖果色，云端彩虹桥、圆润山丘、糖果屋、甜甜圈、星星和果冻角色。画面两侧放圆润蛋形角色、大眼睛、无硬棱角，像会弹跳的果冻伙伴。中心上方生成粉紫色果冻质感大标题“{标题内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，标题Q弹、厚白描边、带糖霜高光和小星星。标题下方生成短副标题“{副标题内容根据课件真实内容填充，副标题不超过15个字，若为英语课件则尽量用英文，若非英文课件则一律用中文}”。中下方生成黄色或粉色果冻胶囊按钮，按钮文字为“{进入游戏，按钮内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，按钮带白描边和Q弹高光。\n\n4）封面接入顺序：先根据真实课件确认主标题、短副标题和进入文案，再依照上面的原版美术描述生成一张完整封面图；将它完整适配课件舞台，不裁掉文字、角色或按钮，也不把整张封面当作中间的小插图套进另一张封面。仅在封面容器内移除或隐藏源 HTML 的标题、副标题、示例插画和可见开始按钮，清理伪元素及 CSS 背景中重复的文字/按钮；主互动页的题干、选项、答案、控件和逻辑全部保留。不要因源课件原来使用 HTML 标题而继续保留第二套可见封面。\n5）透明点击层只承接进入事件，不绘制文字、图标、背景、边框、阴影或底座；可保留不可见的无障碍名称和键盘进入能力，不能将整张封面图设成透明。一次完整点击/触控只进入一次，不在 pointerdown 时提前撤掉封面；隔离本次手势，禁止继续触发下一页答案、拖拽或提交。进入第一题时仍为未作答状态。\n6）交付前同时核对封面原图与浏览器实际首屏：图中艺术标题、短副标题和设计按钮齐全且各一套，浏览器没有额外的可见 DOM/CSS 文字或按钮，点击任意位置可进入第一题。若有重复，修正 HTML 接入层；若图中文字错误，单独修正封面素材。不得用删掉艺术字、角色、按钮设计，换成空场景，或直接跳过封面的办法通过去重检查。\n\n3. 背景图规范与生图提示词逻辑\n1）背景图只用于提供风格氛围，不强行生成题目承载区域。题目白板、任务板、卡片、槽位、按钮和状态栏应由 HTML/CSS/JS 根据当前课件内容绘制，并覆盖在背景图上。背景图中不要生成框、白板、题板、任务板、玻璃板、卡片、按钮、标题、题目文字、选项文字、数字、字母、汉字、格线、槽位、logo、水印或二维码。\n2）背景图可以参考该风格 bg 图和 cover 图的视觉感觉自由延展，但只保留场景、色彩、材质、角色气质和边缘装饰；画面中心应保持开阔、低干扰，方便前端绘制适配当前题型的题板。\n3）本视觉风格背景图的生图提示词：\n软萌童话宇宙背景，暖色高饱和糖果色，软云、彩虹桥、圆润山丘、糖果屋、甜甜圈、星星和果冻角色放在边缘，整体像果冻 Q 弹动作闯关世界。画面中心保持开阔柔和的云端空间，方便 HTML/CSS/JS 绘制互动题板。不要生成糖果框、任务板、按钮、标题、文字、数字、logo、水印或二维码。\n\n4. 按钮、字体与触控规范\n按钮使用果冻、软糖、云朵或弹力胶囊按钮，白描边、柔和高光、轻微上浮和按压回弹明显。字体圆润饱满，不能过细。\n本课件面向小学低中高年级儿童，所有核心文字和可点击区域必须适合课堂投屏、互动屏和平板触控。题干、核心选项、按钮文字和状态数字要使用明显偏大的字号，普通提示文字也要清楚可读；主按钮、选项卡、拖拽块和槽位要有足够大的触碰面积和间距，儿童手指点击不容易误触。按钮必须有清楚边界、高对比文字、按压反馈和禁用态；不要把关键文字做得过小、过细、过浅或压在复杂纹理上。\n\n5. 色彩、材质与装饰密度\n色彩以高明度糖果色、樱花粉、天空蓝、薄荷绿、柠檬黄、薰衣草紫、奶油白和柔和红为主。\n色彩只作为视觉方向，不在图片中显示任何色号、色卡编号、代码、CSS 文本或设计参数。整体保持明亮、干净、护眼，避免大面积深色、强霓虹、复杂渐变和高压迫背景。装饰密度必须低于学习内容，角色、花草、糖果、气泡、电话线、科技光线或海图道具只放在边缘、角落或低层背景，不得穿过题目、选项、槽位、网格、按钮和反馈区域。\n\n6. UI层级与反馈\n底层是风格化背景，只提供氛围；中层是主主题板和内部功能卡片，盖在背景图上，由html/CSS/JS 绘制适合本风格的题板区域，是最高信息承载层；上层是可拖拽对象、选项、按钮、反馈条和当前选中态；弹窗层用于结果、时间到或完成反馈，必须有遮罩或清楚的独立卡片，不能遮挡关键学习内容。\n正确反馈使用果冻弹起、彩纸、星光和绿色描边；错误反馈使用柔软回弹和浅红边框；选中态使用 Q 弹上浮和白描边。\n所有反馈只强化原交互，不新增新玩法，不改变原题目判断逻辑。\n\n7. 音效反馈规范\n音效是 UI 反馈的一部分，必须优先匹配当前风格的专属音效；只用于强化点击、选中、拖拽、落位、提交、答对、答错、提示、完成和重置状态，不改变原课件玩法、题型、节奏和按钮功能。音效需短促、低音量、低干扰，不能循环播放，不能盖过教学语音；需遵守原课件已有静音和音量设置。若没有真实音频素材，可用平台素材库、安全音效或 WebAudio 近似实现，但仍要尽量贴近本风格音效意图。\n本风格音效：按钮使用果冻按钮弹跳声、Q 弹 boing、软胶吸附和软糖落位声，答对使用轻快完成铃，声音短、圆润、有弹性。\n\n8. 禁止项\n禁止生成无关实体、无关玩法、无关学科内容、伪文字、乱码、品牌名、公司名、水印、二维码、角标、设计参数、色值、代码、CSS 标注、软件界面说明、宣传语和不可编辑的题目内容。禁止遮挡、重绘、扭曲或弱化原题目、题板、格线、槽位、按钮和反馈状态。", "basePromptSHA256": "bb08a0b7d14ac501991df325936a577e124a5db072039cfc9c47a0c8d5806339", "promptSHA256": "e31d349555859108a822fa8f2329a462a45ef3ea65f9f7aefbe23c20709d5113", "status": "候选待生成验证", "changeScope": "仅第2节：图片封面与HTML职责分离；原有封面美术描述逐字保留", "kind": "base", "old": "请严格按“弹跳萌趣风 UI规范”重新生成同一课件界面。\n\n0. 原课件保留规则\n本风格只用于 UI 视觉换肤，不得改变原课件的学科、题型、题目内容、答案、素材数量、槽位数量、组件数量、布局关系、按钮功能、计分逻辑和交互流程。原来是英语看图拼词、填空、拖拽、选择、分类、连线、逻辑推理或其他玩法，换风格后仍保持原玩法和原题目结构。主互动题页中的题干、选项、答案、字母、汉字、拼音、数字、公式、倒计时、得分、按钮文案、反馈文案和关卡信息等可变教学内容，必须由 HTML/CSS/JS 渲染，不要烘焙 钮文字为“{进入游戏，按钮内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，按钮带白描边和Q弹高光。\n\n4）封面接入顺序：先根据真实课件确认主标题、短副标题和进入文案，再依照上面的原版美术描述生成一张完整封面图；将它完整适配课件舞台，不裁掉文字、角色或按钮，也不把整张封面当作中间的小插图套进另一张封面。仅在封面容器内移除或隐藏源 HTML 的标题、副标题、示例插画和可见开始按钮，清理伪元素及 CSS 背景中重复的文字/按钮；主互动页的题干、选项、答案、控件和逻辑全部保留。不要因源课件原来使用 HTML 标题而继续保留第二套可见封面。\n5）透明点击层只承接进入事件，不绘制文字、图标、背景、边框、阴影或底座；可保留不可见的无障碍名称和键盘进入能力，不能将整张封面图设成透明。一次完整点击/触控只进入一次，不在 pointerdown 时提前撤掉封面；隔离本次手势，禁止继续触发下一页答案、拖拽或提交。进入第一题时仍为未作答状态。\n6）交付前同时核对封面原图与浏览器实际首屏：图中艺术标题、短副标题和设计按钮齐全且各一套，浏览器没有额外的可见 DOM/CSS 文字或按钮，点击任意位置可进入第一题。若有重复，修正 HTML 接入层；若图中文字错误，单独修正封面素材。不得用删掉艺术字、角色、按钮设计，换成空场景，或直接跳过封面的办法通过去重检查。\n\n3. 背景图规范与生图提示词逻辑\n1）背景图只用于提供风格氛围，不强行生成题目承载区域。题目白板、任务板、卡片、槽位、按钮和状态栏应由 HTML/CSS/JS 根据当前课件内容绘制，并覆盖在背景图上。背景图中不要生成框、白板、题板、任务板、玻璃板、卡片、按钮、标题、题目文字、选项文字、数字、字母、汉字、格线、槽位、logo、水印或二维码。\n2）背景图可以参考该风格 bg 图和 cover 图的视觉感觉自由延展，但只保留场景、色彩、材质、角色气质和边缘装饰；画面中心应保持开阔、低干扰，方便前端绘制适配当前题型的题板。\n3）本视觉风格背景图的生图提示词：\n软萌童话宇宙背景，暖色高饱和糖果色，软云、彩虹桥、圆润山丘、糖果屋、甜甜圈、星星和果冻角色放在边缘，整体像果冻 Q 弹动作闯关世界。画面中心保持开阔柔和的云端空间，方便 HTML/CSS/JS 绘制互动题板。不要生成糖果框、任务板、按钮、标题、文字、数字、logo、水印或二维码。\n\n4. 按钮、字体与触控规范\n按钮使用果冻、软糖、云朵或弹力胶囊按钮，白描边、柔和高光、轻微上浮和按压回弹明显。字体圆润饱满，不能过细。\n本课件面向小学低中高年级儿童，所有核心文字和可点击区域必须适合课堂投屏、互动屏和平板触控。题干、核心选项、按钮文字和状态数字要使用明显偏大的字号，普通提示文字也要清楚可读；主按钮、选项卡、拖拽块和槽位要有足够大的触碰面积和间距，儿童手指点击不容易误触。按钮必须有清楚边界、高对比文字、按压反馈和禁用态；不要把关键文字做得过小、过细、过浅或压在复杂纹理上。\n\n5. 色彩、材质与装饰密度\n色彩以高明度糖果色、樱花粉、天空蓝、薄荷绿、柠檬黄、薰衣草紫、奶油白和柔和红为主。\n色彩只作为视觉方向，不在图片中显示任何色号、色卡编号、代码、CSS 文本或设计参数。整体保持明亮、干净、护眼，避免大面积深色、强霓虹、复杂渐变和高压迫背景。装饰密度必须低于学习内容，角色、花草、糖果、气泡、电话线、科技光线或海图道具只放在边缘、角落或低层背景，不得穿过题目、选项、槽位、网格、按钮和反馈区域。\n\n6. UI层级与反馈\n底层是风格化背景，只提供氛围；中层是主主题板和内部功能卡片，盖在背景图上，由html/CSS/JS 绘制适合本风格的题板区域，是最高信息承载层；上层是可拖拽对象、选项、按钮、反馈条和当前选中态；弹窗层用于结果、时间到或完成反馈，必须有遮罩或清楚的独立卡片，不能遮挡关键学习内容。\n正确反馈使用果冻弹起、彩纸、星光和绿色描边；错误反馈使用柔软回弹和浅红边框；选中态使用 Q 弹上浮和白描边。\n所有反馈只强化原交互，不新增新玩法，不改变原题目判断逻辑。\n\n7. 音效反馈规范\n音效是 UI 反馈的一部分，必须优先匹配当前风格的专属音效；只用于强化点击、选中、拖拽、落位、提交、答对、答错、提示、完成和重置状态，不改变原课件玩法、题型、节奏和按钮功能。音效需短促、低音量、低干扰，不能循环播放，不能盖过教学语音；需遵守原课件已有静音和音量设置。若没有真实音频素材，可用平台素材库、安全音效或 WebAudio 近似实现，但仍要尽量贴近本风格音效意图。\n本风格音效：按钮使用果冻按钮弹跳声、Q 弹 boing、软胶吸附和软糖落位声，答对使用轻快完成铃，声音短、圆润、有弹性。\n\n8. 禁止项\n禁止生成无关实体、无关玩法、无关学科内容、伪文字、乱码、品牌名、公司名、水印、二维码、角标、设计参数、色值、代码、CSS 标注、软件界面说明、宣传语和不可编辑的题目内容。禁止遮挡、重绘、扭曲或弱化原题目、题板、格线、槽位、按钮和反馈状态。", "sectionsOld": ["请严格按“弹跳萌趣风 UI规范”重新生成同一课件界面。\n\n", "0. 原课件保留规则\n本风格只用于 UI 视觉换肤，不得改变原课件的学科、题型、题目内容、答案、素材数量、槽位数量、组件数量、布局关系、按钮功能、计分逻辑和交互流程。原来是英语看图拼词、填空、拖拽、选择、分类、连线、逻辑推理或其他玩法，换风格后仍保持原玩法和原题目结构。主互动题页中的题干、选项、答案、字母、汉字、拼音、数字、公式、倒计时、得分、按钮文案、反馈文案和关卡信息等可变教学内容，必须由 HTML/CSS/JS 渲染，不要烘焙进背景图或题板底图。\n\n", "1. 整体视觉与布局\n风格识别锚点：第一眼应像软萌童话宇宙和果冻闯关 UI。使用圆润蛋形角色、大眼睛、无硬棱角、暖色高饱和糖果色、软云、彩虹桥、圆润山丘、糖果屋、甜甜圈道具、糖果渐变大圆角按钮和白描边；动效观感要像果冻 Q 弹，明亮、弹跳、轻竞技。\n采用软萌童话宇宙和果冻 Q 弹 UI。画面可以有圆润蛋形角色、大眼睛、软云、彩虹桥、圆润山丘、糖果屋、甜甜圈和软糖道具。整体明亮、高饱和、圆润、有弹性，不能变成暗黑科技、硬质金属或普通卡片风。\n使用横版课件画布，画布主体集中在中央学习区，四周保留安全边距。顶部保留原课件已有标题、关卡、进度、奖励、倒计时或得分信息；中央按原课件布局放置题目、图片区、网格、线索、选项、素材池、槽位或操作区；底部或右侧保留原有按钮和工具按钮。背景只提供氛围，不承担学习信息。\n\n", "2. 封面图规范与生图提示词逻辑\n1）封面图用于儿童互动课件首页。封面图本身必须生成主标题、副标题和进入按钮；副标题不得超过15个字，图上不生成任何额外文字、包括风格名、品牌名、logo、水印、二维码、角标、色值、尺寸标记、伪文字或无关宣传语都不允许生成。逻辑上，从封面图任意位置点击即可进入，禁止在封面图上再生成任何文字/按钮，只需要配置点击事件。\n2）主标题、副标题和按钮文案都是可变元素，必须根据当前课件真实内容替换；若为英语课件则尽量用英文，若非英语课件则一律用中文。标题、短副标题和进入按钮需要沿同一视觉主轴组织，层级清楚、可读性强，适合课堂投屏。\n3）本视觉风格封面的生图提示词：\n软萌童话宇宙儿童封面，暖色调高饱和糖果色，云端彩虹桥、圆润山丘、糖果屋、甜甜圈、星星和果冻角色。画面两侧放圆润蛋形角色、大眼睛、无硬棱角，像会弹跳的果冻伙伴。中心上方生成粉紫色果冻质感大标题“{标题内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，标题Q弹、厚白描边、带糖霜高光和小星星。标题下方生成短副标题“{副标题内容根据课件真实内容填充，副标题不超过15个字，若为英语课件则尽量用英文，若非英文课件则一律用中文}”。中下方生成黄色或粉色果冻胶囊按钮，按钮文字为“{进入游戏，按钮内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，按钮带白描边和Q弹高光。\n\n", "3. 背景图规范与生图提示词逻辑\n1）背景图只用于提供风格氛围，不强行生成题目承载区域。题目白板、任务板、卡片、槽位、按钮和状态栏应由 HTML/CSS/JS 根据当前课件内容绘制，并覆盖在背景图上。背景图中不要生成框、白板、题板、任务板、玻璃板、卡片、按钮、标题、题目文字、选项文字、数字、字母、汉字、格线、槽位、logo、水印或二维码。\n2）背景图可以参考该风格 bg 图和 cover 图的视觉感觉自由延展，但只保留场景、色彩、材质、角色气质和边缘装饰；画面中心应保持开阔、低干扰，方便前端绘制适配当前题型的题板。\n3）本视觉风格背景图的生图提示词：\n软萌童话宇宙背景，暖色高饱和糖果色，软云、彩虹桥、圆润山丘、糖果屋、甜甜圈、星星和果冻角色放在边缘，整体像果冻 Q 弹动作闯关世界。画面中心保持开阔柔和的云端空间，方便 HTML/CSS/JS 绘制互动题板。不要生成糖果框、任务板、按钮、标题、文字、数字、logo、水印或二维码。\n\n", "4. 按钮、字体与触控规范\n按钮使用果冻、软糖、云朵或弹力胶囊按钮，白描边、柔和高光、轻微上浮和按压回弹明显。字体圆润饱满，不能过细。\n本课件面向小学低中高年级儿童，所有核心文字和可点击区域必须适合课堂投屏、互动屏和平板触控。题干、核心选项、按钮文字和状态数字要使用明显偏大的字号，普通提示文字也要清楚可读；主按钮、选项卡、拖拽块和槽位要有足够大的触碰面积和间距，儿童手指点击不容易误触。按钮必须有清楚边界、高对比文字、按压反馈和禁用态；不要把关键文字做得过小、过细、过浅或压在复杂纹理上。\n\n", "5. 色彩、材质与装饰密度\n色彩以高明度糖果色、樱花粉、天空蓝、薄荷绿、柠檬黄、薰衣草紫、奶油白和柔和红为主。\n色彩只作为视觉方向，不在图片中显示任何色号、色卡编号、代码、CSS 文本或设计参数。整体保持明亮、干净、护眼，避免大面积深色、强霓虹、复杂渐变和高压迫背景。装饰密度必须低于学习内容，角色、花草、糖果、气泡、电话线、科技光线或海图道具只放在边缘、角落或低层背景，不得穿过题目、选项、槽位、网格、按钮和反馈区域。\n\n", "6. UI层级与反馈\n底层是风格化背景，只提供氛围；中层是主主题板和内部功能卡片，盖在背景图上，由html/CSS/JS 绘制适合本风格的题板区域，是最高信息承载层；上层是可拖拽对象、选项、按钮、反馈条和当前选中态；弹窗层用于结果、时间到或完成反馈，必须有遮罩或清楚的独立卡片，不能遮挡关键学习内容。\n正确反馈使用果冻弹起、彩纸、星光和绿色描边；错误反馈使用柔软回弹和浅红边框；选中态使用 Q 弹上浮和白描边。\n所有反馈只强化原交互，不新增新玩法，不改变原题目判断逻辑。\n\n", "7. 音效反馈规范\n音效是 UI 反馈的一部分，必须优先匹配当前风格的专属音效；只用于强化点击、选中、拖拽、落位、提交、答对、答错、提示、完成和重置状态，不改变原课件玩法、题型、节奏和按钮功能。音效需短促、低音量、低干扰，不能循环播放，不能盖过教学语音；需遵守原课件已有静音和音量设置。若没有真实音频素材，可用平台素材库、安全音效或 WebAudio 近似实现，但仍要尽量贴近本风格音效意图。\n本风格音效：按钮使用果冻按钮弹跳声、Q 弹 boing、软胶吸附和软糖落位声，答对使用轻快完成铃，声音短、圆润、有弹性。\n\n", "8. 禁止项\n禁止生成无关实体、无关玩法、无关学科内容、伪文字、乱码、品牌名、公司名、水印、二维码、角标、设计参数、色值、代码、CSS 标注、软件界面说明、宣传语和不可编辑的题目内容。禁止遮挡、重绘、扭曲或弱化原题目、题板、格线、槽位、按钮和反馈状态。"], "sectionsNew": ["请严格按“弹跳萌趣风 UI规范”重新生成同一课件界面。\n\n", "0. 原课件保留规则\n本风格只用于 UI 视觉换肤，不得改变原课件的学科、题型、题目内容、答案、素材数量、槽位数量、组件数量、布局关系、按钮功能、计分逻辑和交互流程。原来是英语看图拼词、填空、拖拽、选择、分类、连线、逻辑推理或其他玩法，换风格后仍保持原玩法和原题目结构。主互动题页中的题干、选项、答案、字母、汉字、拼音、数字、公式、倒计时、得分、按钮文案、反馈文案和关卡信息等可变教学内容，必须由 HTML/CSS/JS 渲染，不要烘焙进背景图或题板底图。\n\n", "1. 整体视觉与布局\n风格识别锚点：第一眼应像软萌童话宇宙和果冻闯关 UI。使用圆润蛋形角色、大眼睛、无硬棱角、暖色高饱和糖果色、软云、彩虹桥、圆润山丘、糖果屋、甜甜圈道具、糖果渐变大圆角按钮和白描边；动效观感要像果冻 Q 弹，明亮、弹跳、轻竞技。\n采用软萌童话宇宙和果冻 Q 弹 UI。画面可以有圆润蛋形角色、大眼睛、软云、彩虹桥、圆润山丘、糖果屋、甜甜圈和软糖道具。整体明亮、高饱和、圆润、有弹性，不能变成暗黑科技、硬质金属或普通卡片风。\n使用横版课件画布，画布主体集中在中央学习区，四周保留安全边距。顶部保留原课件已有标题、关卡、进度、奖励、倒计时或得分信息；中央按原课件布局放置题目、图片区、网格、线索、选项、素材池、槽位或操作区；底部或右侧保留原有按钮和工具按钮。背景只提供氛围，不承担学习信息。\n\n", "2. 封面图规范与生图提示词逻辑\n【本节适用范围】第2节是完整封面设计，第3节是进入后的主互动页背景，两者必须分别生成、分别使用。封面继续执行本节第3项的原有美术描述，包括艺术字、角色、场景、材质、副标题载体和按钮设计；不得把它改成“空背景＋普通HTML标题按钮”。第3节的无文字、无按钮、中央留白要求，以及第4—6节的题板、标准正文字体、学习区低干扰规则，只约束主互动页，不得用来删减封面。除用户在本次调整中明确要求不要封面外，仍按原版规范生成完整图片式首页。\n\n1）封面图用于儿童互动课件首页。封面图本身必须生成主标题、副标题和进入按钮；副标题不得超过15个字，图上不生成任何额外文字、包括风格名、品牌名、logo、水印、二维码、角标、色值、尺寸标记、伪文字或无关宣传语都不允许生成。封面图中的主标题、副标题、按钮造型和按钮文字是最终可见内容，必须保留。HTML 不得在这张封面图上再次叠加可见标题、副标题、按钮、按钮文字或底座；只配置覆盖封面的透明点击层，点击封面任意位置进入原课件。这里禁止的是 HTML 重复叠加，不是禁止图片生成标题或按钮。\n2）主标题、副标题和按钮文案都是可变元素，必须根据当前课件真实内容替换；若为英语课件则尽量用英文，若非英语课件则一律用中文。标题、短副标题和进入按钮需要沿同一视觉主轴组织，层级清楚、可读性强，适合课堂投屏。\n3）本视觉风格封面的生图提示词：\n软萌童话宇宙儿童封面，暖色调高饱和糖果色，云端彩虹桥、圆润山丘、糖果屋、甜甜圈、星星和果冻角色。画面两侧放圆润蛋形角色、大眼睛、无硬棱角，像会弹跳的果冻伙伴。中心上方生成粉紫色果冻质感大标题“{标题内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，标题Q弹、厚白描边、带糖霜高光和小星星。标题下方生成短副标题“{副标题内容根据课件真实内容填充，副标题不超过15个字，若为英语课件则尽量用英文，若非英文课件则一律用中文}”。中下方生成黄色或粉色果冻胶囊按钮，按钮文字为“{进入游戏，按钮内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，按钮带白描边和Q弹高光。\n\n4）封面接入顺序：先根据真实课件确认主标题、短副标题和进入文案，再依照上面的原版美术描述生成一张完整封面图；将它完整适配课件舞台，不裁掉文字、角色或按钮，也不把整张封面当作中间的小插图套进另一张封面。仅在封面容器内移除或隐藏源 HTML 的标题、副标题、示例插画和可见开始按钮，清理伪元素及 CSS 背景中重复的文字/按钮；主互动页的题干、选项、答案、控件和逻辑全部保留。不要因源课件原来使用 HTML 标题而继续保留第二套可见封面。\n5）透明点击层只承接进入事件，不绘制文字、图标、背景、边框、阴影或底座；可保留不可见的无障碍名称和键盘进入能力，不能将整张封面图设成透明。一次完整点击/触控只进入一次，不在 pointerdown 时提前撤掉封面；隔离本次手势，禁止继续触发下一页答案、拖拽或提交。进入第一题时仍为未作答状态。\n6）交付前同时核对封面原图与浏览器实际首屏：图中艺术标题、短副标题和设计按钮齐全且各一套，浏览器没有额外的可见 DOM/CSS 文字或按钮，点击任意位置可进入第一题。若有重复，修正 HTML 接入层；若图中文字错误，单独修正封面素材。不得用删掉艺术字、角色、按钮设计，换成空场景，或直接跳过封面的办法通过去重检查。\n\n", "3. 背景图规范与生图提示词逻辑\n1）背景图只用于提供风格氛围，不强行生成题目承载区域。题目白板、任务板、卡片、槽位、按钮和状态栏应由 HTML/CSS/JS 根据当前课件内容绘制，并覆盖在背景图上。背景图中不要生成框、白板、题板、任务板、玻璃板、卡片、按钮、标题、题目文字、选项文字、数字、字母、汉字、格线、槽位、logo、水印或二维码。\n2）背景图可以参考该风格 bg 图和 cover 图的视觉感觉自由延展，但只保留场景、色彩、材质、角色气质和边缘装饰；画面中心应保持开阔、低干扰，方便前端绘制适配当前题型的题板。\n3）本视觉风格背景图的生图提示词：\n软萌童话宇宙背景，暖色高饱和糖果色，软云、彩虹桥、圆润山丘、糖果屋、甜甜圈、星星和果冻角色放在边缘，整体像果冻 Q 弹动作闯关世界。画面中心保持开阔柔和的云端空间，方便 HTML/CSS/JS 绘制互动题板。不要生成糖果框、任务板、按钮、标题、文字、数字、logo、水印或二维码。\n\n", "4. 按钮、字体与触控规范\n按钮使用果冻、软糖、云朵或弹力胶囊按钮，白描边、柔和高光、轻微上浮和按压回弹明显。字体圆润饱满，不能过细。\n本课件面向小学低中高年级儿童，所有核心文字和可点击区域必须适合课堂投屏、互动屏和平板触控。题干、核心选项、按钮文字和状态数字要使用明显偏大的字号，普通提示文字也要清楚可读；主按钮、选项卡、拖拽块和槽位要有足够大的触碰面积和间距，儿童手指点击不容易误触。按钮必须有清楚边界、高对比文字、按压反馈和禁用态；不要把关键文字做得过小、过细、过浅或压在复杂纹理上。\n\n", "5. 色彩、材质与装饰密度\n色彩以高明度糖果色、樱花粉、天空蓝、薄荷绿、柠檬黄、薰衣草紫、奶油白和柔和红为主。\n色彩只作为视觉方向，不在图片中显示任何色号、色卡编号、代码、CSS 文本或设计参数。整体保持明亮、干净、护眼，避免大面积深色、强霓虹、复杂渐变和高压迫背景。装饰密度必须低于学习内容，角色、花草、糖果、气泡、电话线、科技光线或海图道具只放在边缘、角落或低层背景，不得穿过题目、选项、槽位、网格、按钮和反馈区域。\n\n", "6. UI层级与反馈\n底层是风格化背景，只提供氛围；中层是主主题板和内部功能卡片，盖在背景图上，由html/CSS/JS 绘制适合本风格的题板区域，是最高信息承载层；上层是可拖拽对象、选项、按钮、反馈条和当前选中态；弹窗层用于结果、时间到或完成反馈，必须有遮罩或清楚的独立卡片，不能遮挡关键学习内容。\n正确反馈使用果冻弹起、彩纸、星光和绿色描边；错误反馈使用柔软回弹和浅红边框；选中态使用 Q 弹上浮和白描边。\n所有反馈只强化原交互，不新增新玩法，不改变原题目判断逻辑。\n\n", "7. 音效反馈规范\n音效是 UI 反馈的一部分，必须优先匹配当前风格的专属音效；只用于强化点击、选中、拖拽、落位、提交、答对、答错、提示、完成和重置状态，不改变原课件玩法、题型、节奏和按钮功能。音效需短促、低音量、低干扰，不能循环播放，不能盖过教学语音；需遵守原课件已有静音和音量设置。若没有真实音频素材，可用平台素材库、安全音效或 WebAudio 近似实现，但仍要尽量贴近本风格音效意图。\n本风格音效：按钮使用果冻按钮弹跳声、Q 弹 boing、软胶吸附和软糖落位声，答对使用轻快完成铃，声音短、圆润、有弹性。\n\n", "8. 禁止项\n禁止生成无关实体、无关玩法、无关学科内容、伪文字、乱码、品牌名、公司名、水印、二维码、角标、设计参数、色值、代码、CSS 标注、软件界面说明、宣传语和不可编辑的题目内容。禁止遮挡、重绘、扭曲或弱化原题目、题板、格线、槽位、按钮和反馈状态。"], "section2": 3, "blocks": [{"kind": "equal", "old": "2. 封面图规范与生图提示词逻辑\n", "new": "2. 封面图规范与生图提示词逻辑\n"}, {"kind": "insert", "old": "", "new": "【本节适用范围】第2节是完整封面设计，第3节是进入后的主互动页背景，两者必须分别生成、分别使用。封面继续执行本节第3项的原有美术描述，包括艺术字、角色、场景、材质、副标题载体和按钮设计；不得把它改成“空背景＋普通HTML标题按钮”。第3节的无文字、无按钮、中央留白要求，以及第4—6节的题板、标准正文字体、学习区低干扰规则，只约束主互动页，不得用来删减封面。除用户在本次调整中明确要求不要封面外，仍按原版规范生成完整图片式首页。\n\n", "change": 0, "left": [], "right": [{"text": "【本节适用范围】第2节是完整封面设计，第3节是进入后的主互动页背景，两者必须分别生成、分别使用。封面继续执行本节第3项的原有美术描述，包括艺术字、角色、场景、材质、副标题载体和按钮设计；不得把它改成“空背景＋普通HTML标题按钮”。第3节的无文字、无按钮、中央留白要求，以及第4—6节的题板、标准正文字体、学习区低干扰规则，只约束主互动页，不得用来删减封面。除用户在本次调整中明确要求不要封面外，仍按原版规范生成完整图片式首页。\n\n", "changed": true}]}, {"kind": "replace", "old": "1）封面图用于儿童互动课件首页。封面图本身必须生成主标题、副标题和进入按钮；副标题不得超过15个字，图上不生成任何额外文字、包括风格名、品牌名、logo、水印、二维码、角标、色值、尺寸标记、伪文字或无关宣传语都不允许生成。逻辑上，从封面图任意位置点击即可进入，禁止在封面图上再生成任何文字/按钮，只需要配置点击事件。\n", "new": "1）封面图用于儿童互动课件首页。封面图本身必须生成主标题、副标题和进入按钮；副标题不得超过15个字，图上不生成任何额外文字、包括风格名、品牌名、logo、水印、二维码、角标、色值、尺寸标记、伪文字或无关宣传语都不允许生成。封面图中的主标题、副标题、按钮造型和按钮文字是最终可见内容，必须保留。HTML 不得在这张封面图上再次叠加可见标题、副标题、按钮、按钮文字或底座；只配置覆盖封面的透明点击层，点击封面任意位置进入原课件。这里禁止的是 HTML 重复叠加，不是禁止图片生成标题或按钮。\n", "change": 1, "left": [{"text": "1）封面图用于儿童互动课件首页。封面图本身必须生成主标题、副标题和进入按钮；副标题不得超过15个字，图上不生成任何额外文字、包括风格名、品牌名、logo、水印、二维码、角标、色值、尺寸标记、伪文字或无关宣传语都不允许生成。", "changed": false}, {"text": "逻辑上，从封面图任意位置点击即可进入，禁止在封面图上再生成任何文字/按钮，只需要配置点击事件。\n", "changed": true}], "right": [{"text": "1）封面图用于儿童互动课件首页。封面图本身必须生成主标题、副标题和进入 保留不可见的无障碍名称和键盘进入能力，不能将整张封面图设成透明。一次完整点击/触控只进入一次，不在 pointerdown 时提前撤掉封面；隔离本次手势，禁止继续触发下一页答案、拖拽或提交。进入第一题时仍为未作答状态。\n", "changed": true}]}, {"kind": "insert", "old": "", "new": "6）交付前同时核对封面原图与浏览器实际首屏：图中艺术标题、短副标题和设计按钮齐全且各一套，浏览器没有额外的可见 DOM/CSS 文字或按钮，点击任意位置可进入第一题。若有重复，修正 HTML 接入层；若图中文字错误，单独修正封面素材。不得用删掉艺术字、角色、按钮设计，换成空场景，或直接跳过封面的办法通过去重检查。\n\n", "change": 4, "left": [], "right": [{"text": "6）交付前同时核对封面原图与浏览器实际首屏：图中艺术标题、短副标题和设计按钮齐全且各一套，浏览器没有额外的可见 DOM/CSS 文字或按钮，点击任意位置可进入第一题。若有重复，修正 HTML 接入层；若图中文字错误，单独修正封面素材。不得用删掉艺术字、角色、按钮设计，换成空场景，或直接跳过封面的办法通过去重检查。\n\n", "changed": true}]}], "delta": 825}, {"styleCode": "tech_competition", "displayName": "科技竞技风", "caseId": "S21", "promptText": "请严格按“科技竞技风 UI规范”重新生成同一课件界面。\n\n0. 原课件保留规则\n本风格只用于 UI 视觉换肤，不得改变原课件的学科、题型、题目内容、答案、素材数量、槽位数量、组件数量、布局关系、按钮功能、计分逻辑和交互流程。原来是英语看图拼词、填空、拖拽、选择、分类、连线、逻辑推理或其他玩法，换风格后仍保持原玩法和原题目结构。主互动题页中的题干、选项、答案、字母、汉字、拼音、数字、公式、倒计时、得分、按钮文案、反馈文案和关卡信息等可变教学内容，必须由 HTML/CSS/JS 渲染，不要烘焙进背景图或题板底图。\n\n1. 整体视觉与布局\n风格识别锚点：第一眼应像儿童科技梦幻竞技场，而不是成人电竞或暗黑科幻。使用电光蓝、星云紫、极光绿、星光金、少量热烈红、半透明科技面板、发光边框、动态光影和中央挑战任务卡片；竞技感清晰但要儿童友好、干净、可读。\n采用亮版科技竞技课堂 UI，而不是暗黑电竞海报。画面可以有未来竞技场、透明屏、能量线、状态条、数据面板和科技胶囊按钮，但主题板必须明亮、高对比、清楚可读。减少大面积黑紫、强霓虹、烟雾和压迫感。\n使用横版课件画布，画布主体集中在中央学习区，四周保留安全边距。顶部保留原课件已有标题、关卡、进度、奖励、倒计时或得分信息；中央按原课件布局放置题目、图片区、网格、线索、选项、素材池、槽位或操作区；底部或右侧保留原有按钮和工具按钮。背景只提供氛围，不承担学习信息。\n\n2. 封面图规范与生图提示词逻辑\n【本节适用范围】第2节是完整封面设计，第3节是进入后的主互动页背景，两者必须分别生成、分别使用。封面继续执行本节第3项的原有美术描述，包括艺术字、角色、场景、材质、副标题载体和按钮设计；不得把它改成“空背景＋普通HTML标题按钮”。第3节的无文字、无按钮、中央留白要求，以及第4—6节的题板、标准正文字体、学习区低干扰规则，只约束主互动页，不得用来删减封面。除用户在本次调整中明确要求不要封面外，仍按原版规范生成完整图片式首页。\n\n1）封面图用于儿童互动课件首页。封面图本身必须生成主标题、副标题和进入按钮；副标题不得超过15个字，图上不生成任何额外文字、包括风格名、品牌名、logo、水印、二维码、角标、色值、尺寸标记、伪文字或无关宣传语都不允许生成。封面图中的主标题、副标题、按钮造型和按钮文字是最终可见内容，必须保留。HTML 不得在这张封面图上再次叠加可见标题、副标题、按钮、按钮文字或底座；只配置覆盖封面的透明点击层，点击封面任意位置进入原课件。这里禁止的是 HTML 重复叠加，不是禁止图片生成标题或按钮。\n2）主标题、副标题和按钮文案都是可变元素，必须根据当前课件真实内容替换；若为英语课件则尽量用英文，若非英语课件则一律用中文。标题、短副标题和进入按钮需要沿同一视觉主轴组织，层级清楚、可读性强，适合课堂投屏。\n3）本视觉风格封面的生图提示词：\n科技梦幻游乐场封面，电光蓝、星云紫、极光绿、星光金和少量烈焰红，半透明科技舞台、动态光线、全息轨道和未来竞技场。左右两侧放卡通少年少女、机器人和小型飞行器，表情积极。中心上方生成蓝紫霓虹立体标题“{标题内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，标题有发光描边、金色星点和科技 HUD 装饰。标题下方生成短副标题“{副标题内容根据课件真实内容填充，副标题不超过15个字，若为英语课件则尽量用英文，若非英文课件则一律用中文}”。中下方生成蓝紫发光圆角按钮，按钮文字为“{进入挑战，按钮内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，按钮带电光边框和轻微能量光。\n\n4）封面接入顺序：先根据真实课件确认主标题、短副标题和进入文案，再依照上面的原版美术描述生成一张完整封面图；将它完整适配课件舞台，不裁掉文字、角色或按钮，也不把整张封面当作中间的小插图套进另一张封面。仅在封面容器内移除或隐藏源 HTML 的标题、副标题、示例插画和可见开始按钮，清理伪元素及 CSS 背景中重复的文字/按钮；主互动页的题干、选项、答案、控件和逻辑全部保留。不要因源课件原来使用 HTML 标题而继续保留第二套可见封面。\n5）透明点击层只承接进入事件，不绘制文字、图标、背景、边框、阴影或底座；可保留不可见的无障碍名称和键盘进入能力，不能将整张封面图设成透明。一次完整点击/触控只进入一次，不在 pointerdown 时提前撤掉封面；隔离本次手势，禁止继续触发下一页答案、拖拽或提交。进入第一题时仍为未作答状态。\n6）交付前同时核对封面原图与浏览器实际首屏：图中艺术标题、短副标题和设计按钮齐全且各一套，浏览器没有额外的可见 DOM/CSS 文字或按钮，点击任意位置可进入第一题。若有重复，修正 HTML 接入层；若图中文字错误，单独修正封面素材。不得用删掉艺术字、角色、按钮设计，换成空场景，或直接跳过封面的办法通过去重检查。\n\n3. 背景图规范与生图提示词逻辑\n1）背景图只用于提供风格氛围，不强行生成题目承载区域。题目白板、任务板、卡片、槽位、按钮和状态栏应由 HTML/CSS/JS 根据当前课件内容绘制，并覆盖在背景图上。背景图中不要生成框、白板、题板、任务板、玻璃板、卡片、按钮、标题、题目文字、选项文字、数字、字母、汉字、格线、槽位、logo、水印或二维码。\n2）背景图可以参考该风格 bg 图和 cover 图的视觉感觉自由延展，但只保留场景、色彩、材质、角色气质和边缘装饰；画面中心应保持开阔、低干扰，方便前端绘制适配当前题型的题板。\n3）本视觉风格背景图的生图提示词：\n儿童友好的科技竞技场背景，深蓝紫星云、电光蓝舞台、极光绿光线、全息轨道、机器人和少年角色靠边出现，整体有未来感但不压迫。画面中心保持开阔的发光舞台空间，方便 HTML/CSS/JS 绘制科技任务面板。不要生成科技面板框、按钮、标题、文字、HUD 字符、伪代码、logo、水印或二维码。\n\n4. 按钮、字体与触控规范\n按钮使用亮版科技胶囊、能量边框按钮或竞技确认键。字体高对比、清楚、偏现代，但不使用过度霓虹描边。\n本课件面向小学低中高年级儿童，所有核心文字和可点击区域必须适合课堂投屏、互动屏和平板触控。题干、核心选项、按钮文字和状态数字要使用明显偏大的字号，普通提示文字也要清楚可读；主按钮、选项卡、拖拽块和槽位要有足够大的触碰面积和间距，儿童手指点击不容易误触。按钮必须有清楚边界、高对比文字、按压反馈和禁用态；不要把关键文字做得过小、过细、过浅或压在复杂纹理上。\n\n5. 色彩、材质与装饰密度\n色彩以亮蓝、能量青、银白、清爽紫、深蓝灰和绿色反馈为主，深色只做边缘衬托。\n色彩只作为视觉方向，不在图片中显示任何色号、色卡编号、代码、CSS 文本或设计参数。整体保持明亮、干净、护眼，避免大面积深色、强霓虹、复杂渐变和高压迫背景。装饰密度必须低于学习内容，角色、花草、糖果、气泡、电话线、科技光线或海图道具只放在边缘、角落或低层背景，不得穿过题目、选项、槽位、网格、按钮和反馈区域。\n\n6. UI层级与反馈\n底层是风格化背景，只提供氛围；中层是主主题板和内部功能卡片，盖在背景图上，由html/CSS/JS 绘制适合本风格的题板区域，是最高信息承载层；上层是可拖拽对象、选项、按钮、反馈条和当前选中态；弹窗层用于结果、时间到或完成反馈，必须有遮罩或清楚的独立卡片，不能遮挡关键学习内容。\n正确反馈使用能量条点亮、绿色边框和确认锁定；错误反馈使用柔和红边框和短促提醒；选中态使用亮蓝能量线。\n所有反馈只强化原交互，不新增新玩法，不改变原题目判断逻辑。\n\n7. 音效反馈规范\n音效是 UI 反馈的一部分，必须优先匹配当前风格的专属音效；只用于强化点击、选中、拖拽、落位、提交、答对、答错、提示、完成和重置状态，不改变原课件玩法、题型、节奏和按钮功能。音效需短促、低音量、低干扰，不能循环播放，不能盖过教学语音；需遵守原课件已有静音 节是完整封面设计，第3节是进入后的主互动页背景，两者必须分别生成、分别使用。封面继续执行本节第3项的原有美术描述，包括艺术字、角色、场景、材质、副标题载体和按钮设计；不得把它改成“空背景＋普通HTML标题按钮”。第3节的无文字、无按钮、中央留白要求，以及第4—6节的题板、标准正文字体、学习区低干扰规则，只约束主互动页，不得用来删减封面。除用户在本次调整中明确要求不要封面外，仍按原版规范生成完整图片式首页。\n\n1）封面图用于儿童互动课件首页。封面图本身必须生成主标题、副标题和进入按钮；副标题不得超过15个字，图上不生成任何额外文字、包括风格名、品牌名、logo、水印、二维码、角标、色值、尺寸标记、伪文字或无关宣传语都不允许生成。封面图中的主标题、副标题、按钮造型和按钮文字是最终可见内容，必须保留。HTML 不得在这张封面图上再次叠加可见标题、副标题、按钮、按钮文字或底座；只配置覆盖封面的透明点击层，点击封面任意位置进入原课件。这里禁止的是 HTML 重复叠加，不是禁止图片生成标题或按钮。\n2）主标题、副标题和按钮文案都是可变元素，必须根据当前课件真实内容替换；若为英语课件则尽量用英文，若非英语课件则一律用中文。标题、短副标题和进入按钮需要沿同一视觉主轴组织，层级清楚、可读性强，适合课堂投屏。\n3）本视觉风格封面的生图提示词：\n科技梦幻游乐场封面，电光蓝、星云紫、极光绿、星光金和少量烈焰红，半透明科技舞台、动态光线、全息轨道和未来竞技场。左右两侧放卡通少年少女、机器人和小型飞行器，表情积极。中心上方生成蓝紫霓虹立体标题“{标题内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，标题有发光描边、金色星点和科技 HUD 装饰。标题下方生成短副标题“{副标题内容根据课件真实内容填充，副标题不超过15个字，若为英语课件则尽量用英文，若非英文课件则一律用中文}”。中下方生成蓝紫发光圆角按钮，按钮文字为“{进入挑战，按钮内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，按钮带电光边框和轻微能量光。\n\n4）封面接入顺序：先根据真实课件确认主标题、短副标题和进入文案，再依照上面的原版美术描述生成一张完整封面图；将它完整适配课件舞台，不裁掉文字、角色或按钮，也不把整张封面当作中间的小插图套进另一张封面。仅在封面容器内移除或隐藏源 HTML 的标题、副标题、示例插画和可见开始按钮，清理伪元素及 CSS 背景中重复的文字/按钮；主互动页的题干、选项、答案、控件和逻辑全部保留。不要因源课件原来使用 HTML 标题而继续保留第二套可见封面。\n5）透明点击层只承接进入事件，不绘制文字、图标、背景、边框、阴影或底座；可保留不可见的无障碍名称和键盘进入能力，不能将整张封面图设成透明。一次完整点击/触控只进入一次，不在 pointerdown 时提前撤掉封面；隔离本次手势，禁止继续触发下一页答案、拖拽或提交。进入第一题时仍为未作答状态。\n6）交付前同时核对封面原图与浏览器实际首屏：图中艺术标题、短副标题和设计按钮齐全且各一套，浏览器没有额外的可见 DOM/CSS 文字或按钮，点击任意位置可进入第一题。若有重复，修正 HTML 接入层；若图中文字错误，单独修正封面素材。不得用删掉艺术字、角色、按钮设计，换成空场景，或直接跳过封面的办法通过去重检查。\n\n3. 背景图规范与生图提示词逻辑\n1）背景图只用于提供风格氛围，不强行生成题目承载区域。题目白板、任务板、卡片、槽位、按钮和状态栏应由 HTML/CSS/JS 根据当前课件内容绘制，并覆盖在背景图上。背景图中不要生成框、白板、题板、任务板、玻璃板、卡片、按钮、标题、题目文字、选项文字、数字、字母、汉字、格线、槽位、logo、水印或二维码。\n2）背景图可以参考该风格 bg 图和 cover 图的视觉感觉自由延展，但只保留场景、色彩、材质、角色气质和边缘装饰；画面中心应保持开阔、低干扰，方便前端绘制适配当前题型的题板。\n3）本视觉风格背景图的生图提示词：\n儿童友好的科技竞技场背景，深蓝紫星云、电光蓝舞台、极光绿光线、全息轨道、机器人和少年角色靠边出现，整体有未来感但不压迫。画面中心保持开阔的发光舞台空间，方便 HTML/CSS/JS 绘制科技任务面板。不要生成科技面板框、按钮、标题、文字、HUD 字符、伪代码、logo、水印或二维码。\n\n4. 按钮、字体与触控规范\n按钮使用亮版科技胶囊、能量边框按钮或竞技确认键。字体高对比、清楚、偏现代，但不使用过度霓虹描边。\n本课件面向小学低中高年级儿童，所有核心文字和可点击区域必须适合课堂投屏、互动屏和平板触控。题干、核心选项、按钮文字和状态数字要使用明显偏大的字号，普通提示文字也要清楚可读；主按钮、选项卡、拖拽块和槽位要有足够大的触碰面积和间距，儿童手指点击不容易误触。按钮必须有清楚边界、高对比文字、按压反馈和禁用态；不要把关键文字做得过小、过细、过浅或压在复杂纹理上。\n\n5. 色彩、材质与装饰密度\n色彩以亮蓝、能量青、银白、清爽紫、深蓝灰和绿色反馈为主，深色只做边缘衬托。\n色彩只作为视觉方向，不在图片中显示任何色号、色卡编号、代码、CSS 文本或设计参数。整体保持明亮、干净、护眼，避免大面积深色、强霓虹、复杂渐变和高压迫背景。装饰密度必须低于学习内容，角色、花草、糖果、气泡、电话线、科技光线或海图道具只放在边缘、角落或低层背景，不得穿过题目、选项、槽位、网格、按钮和反馈区域。\n\n6. UI层级与反馈\n底层是风格化背景，只提供氛围；中层是主主题板和内部功能卡片，盖在背景图上，由html/CSS/JS 绘制适合本风格的题板区域，是最高信息承载层；上层是可拖拽对象、选项、按钮、反馈条和当前选中态；弹窗层用于结果、时间到或完成反馈，必须有遮罩或清楚的独立卡片，不能遮挡关键学习内容。\n正确反馈使用能量条点亮、绿色边框和确认锁定；错误反馈使用柔和红边框和短促提醒；选中态使用亮蓝能量线。\n所有反馈只强化原交互，不新增新玩法，不改变原题目判断逻辑。\n\n7. 音效反馈规范\n音效是 UI 反馈的一部分，必须优先匹配当前风格的专属音效；只用于强化点击、选中、拖拽、落位、提交、答对、答错、提示、完成和重置状态，不改变原课件玩法、题型、节奏和按钮功能。音效需短促、低音量、低干扰，不能循环播放，不能盖过教学语音；需遵守原课件已有静音和音量设置。若没有真实音频素材，可用平台素材库、安全音效或 WebAudio 近似实现，但仍要尽量贴近本风格音效意图。\n本风格音效：点击使用轻量电子音，选中使用能量条点亮声，提交使用确认锁定声，答对使用短促完成提示，禁止枪炮、爆炸和压迫感警报。\n\n8. 禁止项\n禁止生成无关实体、无关玩法、无关学科内容、伪文字、乱码、品牌名、公司名、水印、二维码、角标、设计参数、色值、代码、CSS 标注、软件界面说明、宣传语和不可编辑的题目内容。禁止遮挡、重绘、扭曲或弱化原题目、题板、格线、槽位、按钮和反馈状态。尤其禁止生成暗黑电竞海报、枪械、战斗场景、强压迫警报和大面积黑紫霓虹。", "sectionsOld": ["请严格按“科技竞技风 UI规范”重新生成同一课件界面。\n\n", "0. 原课件保留规则\n本风格只用于 UI 视觉换肤，不得改变原课件的学科、题型、题目内容、答案、素材数量、槽位数量、组件数量、布局关系、按钮功能、计分逻辑和交互流程。原来是英语看图拼词、填空、拖拽、选择、分类、连线、逻辑推理或其他玩法，换风格后仍保持原玩法和原题目结构。主互动题页中的题干、选项、答案、字母、汉字、拼音、数字、公式、倒计时、得分、按钮文案、反馈文案和关卡信息等可变教学内容，必须由 HTML/CSS/JS 渲染，不要烘焙进背景图或题板底图。\n\n", "1. 整体视觉与布局\n风格识别锚点：第一眼应像儿童科技梦幻竞技场，而不是成人电竞或暗黑科幻。使用电光蓝、星云紫、极光绿、星光金、少量热烈红、半透明科技面板、发光边框、动态光影和中央挑战任务卡片；竞技感清晰但要儿童友好、干净、可读。\n采用亮版科技竞技课堂 UI，而不是暗黑电竞海报。画面可以有未来竞技场、透明屏、能量线、状态条、数据面板和科技胶囊按钮，但主题板必须明亮、高对比、清楚可读。减少大面积黑紫、强霓虹、烟雾和压迫感。\n使用横版课件画布，画布主体集中在中央学习区，四周保留安全边距。顶部保留原课件已有标题、关卡、进度、奖励、倒计时或得分信息；中央按原课件布局放置题目、图片区、网格、线索、选项、素材池、槽位或操作区；底部或右侧保留原有按钮和工具按钮。背景只提供氛围，不承担学习信息。\n\n", "2. 封面图规范与生图提示词逻辑\n1）封面图用于儿童互动课件首页。封面图本身必须生成主标题、副标题和进入按钮；副标题不得超过15个字，图上不生成任何额外文字、包括风格名、品牌名、logo、水印、二维码、角标、色值、尺寸标记、伪文字或无关宣传语都不允许生成。逻辑上，从封面图任意位置点击即可进入，禁止在封面图上再生成任何文字/按钮，只需要配置点击事件。\n2）主标题、副标题和按钮文案都是可变元素，必须根据当前课件真实内容替换；若为英语课件则尽量用英文，若非英语课件则一律用中文。标题、短副标题和进入按钮需要沿同一视觉主轴组织，层级清楚、可读性强，适合课堂投屏。\n3）本视觉风格封面的生图提示词：\n科技梦幻游乐场封面，电光蓝、星云紫、极光绿、星光金和少量烈焰红，半透明科技舞台、动态光线、全息轨道和未来竞技场。左右两侧放卡通少年少女、机器人和小型飞行器，表情积极。中心上方生成蓝紫霓虹立体标题“{标题内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，标题有发光描边、金色星点和科技 HUD 装饰。标题下方生成短副标题“{副标题内容根据课件真实内容填充，副标题不超过15个字，若为英语课件则尽量用英文，若非英文课件则一律用中文}”。中下方生成蓝紫发光圆角按钮，按钮文字为“{进入挑战，按钮内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，按钮带电光边框和轻微能量光。\n\n", "3. 背景图规范与生图提示词逻辑\n1）背景图只用于提供风格氛围，不强行生成题目承载区域。题目白板、任务板、卡片、槽位、按钮和状态栏应由 HTML/CSS/JS 根据当前课件内容绘制，并覆盖在背景图上。背景图中不要生成框、白板、题板、任务板、玻璃板、卡片、按钮、标题、题目文字、选项文字、数字、字母、汉字、格线、槽位、logo、水印或二维码。\n2）背景图可以参考该风格 bg 图和 cover 图的视觉感觉自由延展，但只保留场景、色彩、材质、角色气质和边缘装饰；画面中心应保持开阔、低干扰，方便前端绘制适配当前题型的题板。\n3）本视觉风格背景图的生图提示词：\n儿童友好的科技竞技场背景，深蓝紫星云、电光蓝舞台、极光绿光线、全息轨道、机器人和少年角色靠边出现，整体有未来感但不压迫。画面中心保持开阔的发光舞台空间，方便 HTML/CSS/JS 绘制科技任务面板。不要生成科技面板框、按钮、标题、文字、HUD 字符、伪代码、logo、水印或二维码。\n\n", "4. 按钮、字体与触控规范\n按钮使用亮版科技胶囊、能量边框按钮或竞技确认键。字体高对比、清楚、偏现代，但不使用过度霓虹描边。\n本课件面向小学低中高年级儿童，所有核心文字和可点击区域必须适合课堂投屏、互动屏和平板触控。题干、核心选项、按钮文字和状态数字要使用明显偏大的字号，普通提示文字也要清楚可读；主按钮、选项卡、拖拽块和槽位要有足够大的触碰面积和间距，儿童手指点击不容易误触。按钮必须有清楚边界、高对比文字、按压反馈和禁用态；不要把关键文字做得过小、过细、过浅或压在复杂纹理上。\n\n", "5. 色彩、材质与装饰密度\n色彩以亮蓝、能量青、银白、清爽紫、深蓝灰和绿色反馈为主，深色只做边缘衬托。\n色彩只作为视觉方向，不在图片中显示任何色号、色卡编号、代码、CSS 文本或设计参数。整体保持明亮、干净、护眼，避免大面积深色、强霓虹、复杂渐变和高压迫背景。装饰密度必须低于学习内容，角色、花草、糖果、气泡、电话线、科技光线或海图道具只放在边缘、角落或低层背景，不得穿过题目、选项、槽位、网格、按钮和反馈区域。\n\n", "6. UI层级与反馈\n底层是风格化背景，只提供氛围；中层是主主题板和内部功能卡片，盖在背景图上，由html/CSS/JS 绘制适合本风格的题板区域，是最高信息承载层；上层是可拖拽对象、选项、按钮、反馈条和当前选中态；弹窗层用于结果、时间到或完成反馈，必须有遮罩或清楚的独立卡片，不能遮挡关键学习内容。\n正确反馈使用能量条点亮、绿色边框和确认锁定；错误反馈使用柔和红边框和短促提醒；选中态使用亮蓝能量线。\n所有反馈只强化原交互，不新增新玩法，不改变原题目判断逻辑。\n\n", "7. 音效反馈规范\n音效是 UI 反馈的一部分，必须优先匹配当前风格的专属音效；只用于强化点击、选中、拖拽、落位、提交、答对、答错、提示、完成和重置状态，不改变原课件玩法、题型、节奏和按钮功能。音效需短促、低音量、低干扰，不能循环播放，不能盖过教学语音；需遵守原课件已有静音和音量设置。若没有真实音频素材，可用平台素材库、安全音效或 WebAudio 近似实现，但仍要尽量贴近本风格音效意图。\n本风格音效：点击使用轻量电子音，选中使用能量条点亮声，提交使用确认锁定声，答对使用短促完成提示，禁止枪炮、爆炸和压迫感警报。\n\n", "8. 禁止项\n禁止生成无关实体、无关玩法、无关学科内容、伪文字、乱码、品牌名、公司名、水印、二维码、角标、设计参数、色值、代码、CSS 标注、软件界面说明、宣传语和不可编辑的题目内容。禁止遮挡、重绘、扭曲或弱化原题目、题板、格线、槽位、按钮和反馈状态。尤其禁止生成暗黑电竞海报、枪械、战斗场景、强压迫警报和大面积黑紫霓虹。"], "sectionsNew": ["请严格按“科技竞技风 UI规范”重新生成同一课件界面。\n\n", "0. 原课件保留规则\n本风格只用于 UI 视觉换肤，不得改变原课件的学科、题型、题目内容、答案、素材数量、槽位数量、组件数量、布局关系、按钮功能、计分逻辑和交互流程。原来是英语看图拼词、填空、拖拽、选择、分类、连线、逻辑推理或其他玩法，换风格后仍保持原玩法和原题目结构。主互动题页中的题干、选项、答案、字母、汉字、拼音、数字、公式、倒计时、得分、按钮文案、反馈文案和关卡信息等可变教学内容，必须由 HTML/CSS/JS 渲染，不要烘焙进背景图或题板底图。\n\n", "1. 整体视觉与布局\n风格识别锚点：第一眼应像儿童科技梦幻竞技场，而不是成人电竞或暗黑科幻。使用电光蓝、星云紫、极光绿、星光金、少量热烈红、半透明科技面板、发光边框、动态光影和中央挑战任务卡片；竞技感清晰但要儿童友好、干净、可读。\n采用亮版科技竞技课堂 UI，而不是暗黑电竞海报。画面可以有未来竞技场、透明屏、能量线、状态条、数据面板和科技胶囊按钮，但主题板必须明亮、高对比、清楚可读。减少大面积黑紫、强霓虹、烟雾和压迫感。\n使用横版课件画布，画布主体集中在中央学习区，四周保留安全边距。顶部保留原课件已有标题、关卡、进度、奖励、倒计时或得分信息；中央按原课件布局放置题目、图片区、网格、线索、选项、素材池、槽位或操作区；底部或右侧保留原有按钮和工具按钮。背景只提供氛围，不承担学习信息。\n\n", "2. 封面图规范与生图提示词逻辑\n【本节适用范围】第2节是完整封面设计，第3节是进入后的主互动页背景，两者必须分别生成、分别使用。封面继续执行本节第3项的原有美术描述，包括艺术字、角色、场景、材质、副标题载体和按钮设计；不得把它改成“空背景＋普通HTML标题按钮”。第3节的无文字、无按钮、中央留白要求，以及第4—6节的题板、标准正文字体、学习区低干扰规则，只约束主互动页，不得用来删减封面。除用户在本次调整中明确要求不要封面外，仍按原版规范生成完整图片式首页。\n\n1）封面图用于儿童互动课件首页。封面图本身必须生成主标题、副标题和进入按钮；副标题不得超过15个字，图上不生成任何额外文字、包括风格名、品牌名、logo、水印、二维码、角标、色值、尺寸标记、伪文字或无关宣传语都不允许生成。封面图中的主标题、副标题、按钮造型和按钮文字是最终可见内容，必须保留。HTML 不得在这张封面图上再次叠加可见标题、副标题、按钮、按钮文字或底座；只配置覆盖封面的透明点击层，点击封面任意位置进入原课件。这里禁止的是 HTML 重复叠加，不是禁止图片生成标题或按钮。\n2）主标题、副标题和按钮文案都是可变元素，必须根据当前课件真实内容替换；若为英语课件则尽量用英文，若非英语课件则一律用中文。标题、短副标题和进入按钮需要沿同一视觉主轴组织，层级清楚、可读性强，适合课堂投屏。\n3）本视觉风格封面的生图提示词：\n科技梦幻游乐场封面，电光蓝、星云紫、极光绿、星光金和少量烈焰红，半透明科技舞台、动态光线、全息轨道和未来竞技场。左右两侧放卡通少年少女、机器人和小型飞行器，表情积极。中心上方生成蓝紫霓虹立体标题“{标题内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，标题有发光描边、金色星点和科技 HUD 装饰。标题下方生成短副标题“{副标题内容根据课件真实内容填充，副标题不超过15个字，若为英语课件则尽量用英文，若非英文课件则一律用中文}”。中下方生成蓝紫发光圆角按钮，按钮文字为“{进入挑战，按钮内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，按钮带电光边框和轻微能量光。\n\n4）封面接入顺序：先根据真实课件确认主标题、短副标题和进入文案，再依照上面的原版美术描述生成一张完整封面图；将它完整适配课件舞台，不裁掉文字、角色或按钮，也不把整张封面当作中间的小插图套进另一张封面。仅在封面容器内移除或隐藏源 HTML 的标题、副标题、示例插画和可见开始按钮，清理伪元素及 CSS 背景中重复的文字/按钮；主互动页的题干、选项、答案、控件和逻辑全部保留。不要因源课件原来使用 HTML 标题而继续保留第二套可见封面。\n5）透明点击层只承接进入事件，不绘制文字、图标、背景、边框、阴影或底座；可保留不可见的无障碍名称和键盘进入能力，不能将整张封面图设成透明。一次完整点击/触控只进入一次，不在 pointerdown 时提前撤掉封面；隔离本次手势，禁止继续触发下一页答案、拖拽或提交。进入第一题时仍为未作答状态。\n6）交付前同时核对封面原图与浏览器实际首屏：图中艺术标题、短副标题和设计按钮齐全且各一套，浏览器没有额外的可见 DOM/CSS 文字或按钮，点击任意位置可进入第一题。若有重复，修正 HTML 接入层；若图中文字错误，单独修正封面素材。不得用删掉艺术字、角色、按钮设计，换成空场景，或直接跳过封面的办法通过去重检查。\n\n", "3. 背景图规范与生图提示词逻辑\n1）背景图只用于提供风格氛围，不强行生成题目承载区域。题目白板、任务板、卡片、槽位、按钮和状态栏应由 HTML/CSS/JS 根据当前课件内容绘制，并覆盖在背景图上。背景图中不要生成框、白板、题板、任务板、玻璃板、卡片、按钮、标题、题目文字、选项文字、数字、字母、汉字、格线、槽位、logo、水印或二维码。\n2）背景图可以参考该风格 bg 图和 cover 图的视觉感觉自由延展，但只保留场景、色彩、材质、角色气质和边缘装饰；画面中心应保持开阔、低干扰，方便前端绘制适配当前题型的题板。\n3）本视觉风格背景图的生图提示词：\n儿童友好的科技竞技场背景，深蓝紫星云、电光蓝舞台、极光绿光线、全息轨道、机器人和少年角色靠边出现，整体有未来感但不压迫。画面中心保持开阔的发光舞台空间，方便 HTML/CSS/JS 绘制科技任务面板。不要生成科技面板框、按钮、标题、文字、HUD 字符、伪代码、logo、水印或二维码。\n\n", "4. 按钮、字体与触控规范\n按钮使用亮版科技胶囊、能量边框按钮或竞技确认键。字体高对比、清楚、偏现代，但不使用过度霓虹描边。\n本课件面向小学低中高年级儿童，所有核心文字和可点击区域必须适合课堂投屏、互动屏和平板触控。题干、核心选项、按钮文字和状态数字要使用明显偏大的字号，普通提示文字也要清楚可读；主按钮、选项卡、拖拽块和槽位要有足够大的触碰面积和间距，儿童手指点击不容易误触。按钮必须有清楚边界、高对比文字、按压反馈和禁用态；不要把关键文字做得过小、过细、过浅或压在复杂纹理上。\n\n", "5. 色彩、材质与装饰密度\n色彩以亮蓝、能量青、银白、清爽紫、深蓝灰和绿色反馈为主，深色只做边缘衬托。\n色彩只作为视觉方向，不在图片中显示任何色号、色卡编号、代码、CSS 文本或设计参数。整体保持明亮、干净、护眼，避免大面积深色、强霓虹、复杂渐变和高压迫背景。装饰密度必须低于学习内容，角色、花草、糖果、气泡、电话线、科技光线或海图道具只放在边缘、角落或低层背景，不得穿过题目、选项、槽位、网格、按钮和反馈区域。\n\n", "6. UI层级与反馈\n底层是风格化背景，只提供氛围；中层是主主题板和内部功能卡片，盖在背景图上，由html/CSS/JS 绘制适合本风格的题板区域，是最高信息承载层；上层是可拖拽对象、选项、按钮、反馈条和当前选中态；弹窗层用于结果、时间到或完成反馈，必须有遮罩或清楚的独立卡片，不能遮挡关键学习内容。\n正确反馈使用能量条点亮、绿色边框和确认锁定；错误反馈使用柔和红边框和短促提醒；选中态使用亮蓝能量线。\n所有反馈只强化原交互，不新增新玩法，不改变原题目判断逻辑。\n\n", "7. 音效反馈规范\n音效是 UI 反馈的一部分，必须优先匹配当前风格的专属音效；只用于强化点击、选中、拖拽、落位、提交、答对、答错、提示、完成和重置状态，不改变原课件玩法、题型、节奏和按钮功能。音效需短促、低音量、低干扰，不能循环播放，不能盖过教学语音；需遵守原课件已有静音和音量设置。若没有真实音频素材，可用平台素材库、安全音效或 WebAudio 近似实现，但仍要尽量贴近本风格音效意图。\n本风格音效：点击使用轻量电子音，选中使用能量条点亮声，提交使用确认锁定声，答对使用短促完成提示，禁止枪炮、爆炸和压迫感警报。\n\n", "8. 禁止项\n禁止生成无关实体、无关玩法、无关学科内容、伪文字、乱码、品牌名、公司名、水印、二维码、角标、设计参数、色值、代码、CSS 标注、软件界面说明、宣传语和不可编辑的题目内容。禁止遮挡、重绘、扭曲或弱化原题目、题板、格线、槽位、按钮和反馈状态。尤其禁止生成暗黑电竞海报、枪械、战斗场景、强压迫警报和大面积黑紫霓虹。"], "section2": 3, "blocks": [{"kind": "equal", "old": "2. 封面图规范与生图提示词逻辑\n", "new": "2. 封面图规范与生图提示词逻辑\n"}, {"kind": "insert", "old": "", "new": "【本节适用范围】第2节是完整封面设计，第3节是进入后的主互动页背景，两者必须分别生成、分别使用。封面继续执行本节第3项的原有美术描述，包括艺术字、角色、场景、材质、副标题载体和按钮设计；不得把它改成“空背景＋普通HTML标题按钮”。第3节的无文字、无按钮、中央留白要求，以及第4—6节的题板、标准正文字体、学习区低干扰规则，只约束主互动页，不得用来删减封面。除用户在本次调整中明确要求不要封面外，仍按原版规范生成完整图片式首页。\n\n", "change": 0, "left": [], "right": [{"text": "【本节适用范围】第2节是完整封面设计，第3节是进入后的主互动页背景，两者必须分别生成、分别使用。封面继续执行本节第3项的原有美术描述，包括艺术字、角色、场景、材质、副标题载体和按钮设计；不得把 、安静，适合阅读、理解和低干扰互动。\n使用横版课件画布，画布主体集中在中央学习区，四周保留安全边距。顶部保留原课件已有标题、关卡、进度、奖励、倒计时或得分信息；中央按原课件布局放置题目、图片区、网格、线索、选项、素材池、槽位或操作区；底部或右侧保留原有按钮和工具按钮。背景只提供氛围，不承担学习信息。\n\n2. 封面图规范与生图提示词逻辑\n【本节适用范围】第2节是完整封面设计，第3节是进入后的主互动页背景，两者必须分别生成、分别使用。封面继续执行本节第3项的原有美术描述，包括艺术字、角色、场景、材质、副标题载体和按钮设计；不得把它改成“空背景＋普通HTML标题按钮”。第3节的无文字、无按钮、中央留白要求，以及第4—6节的题板、标准正文字体、学习区低干扰规则，只约束主互动页，不得用来删减封面。除用户在本次调整中明确要求不要封面外，仍按原版规范生成完整图片式首页。\n\n1）封面图用于儿童互动课件首页。封面图本身必须生成主标题、副标题和进入按钮；副标题不得超过15个字，图上不生成任何额外文字、包括风格名、品牌名、logo、水印、二维码、角标、色值、尺寸标记、伪文字或无关宣传语都不允许生成。封面图中的主标题、副标题、按钮造型和按钮文字是最终可见内容，必须保留。HTML 不得在这张封面图上再次叠加可见标题、副标题、按钮、按钮文字或底座；只配置覆盖封面的透明点击层，点击封面任意位置进入原课件。这里禁止的是 HTML 重复叠加，不是禁止图片生成标题或按钮。\n2）主标题、副标题和按钮文案都是可变元素，必须根据当前课件真实内容替换；若为英语课件则尽量用英文，若非英语课件则一律用中文。标题、短副标题和进入按钮需要沿同一视觉主轴组织，层级清楚、可读性强，适合课堂投屏。\n3）本视觉风格封面的生图提示词：\n奶雾莫兰迪色儿童童话封面，轻3D软建模，奶油白、柔粉、奶油黄和淡紫，午后阳光照进绘本房间。画面有窗帘、软垫、童话书、星星抱枕、小兔玩偶、木质小架和温柔光斑。右侧或中间放软萌兔子角色或绘本画面。中心上方生成奶油粉色柔软标题“{标题内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，标题轻柔、白描边、像棉花糖字。标题下方生成短副标题“{副标题内容根据课件真实内容填充，副标题不超过15个字，若为英语课件则尽量用英文，若非英文课件则一律用中文}”。中下方生成柔粉或奶油黄圆角按钮，按钮文字为“{进入绘本，按钮内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，按钮带柔和阴影和星星。\n\n4）封面接入顺序：先根据真实课件确认主标题、短副标题和进入文案，再依照上面的原版美术描述生成一张完整封面图；将它完整适配课件舞台，不裁掉文字、角色或按钮，也不把整张封面当作中间的小插图套进另一张封面。仅在封面容器内移除或隐藏源 HTML 的标题、副标题、示例插画和可见开始按钮，清理伪元素及 CSS 背景中重复的文字/按钮；主互动页的题干、选项、答案、控件和逻辑全部保留。不要因源课件原来使用 HTML 标题而继续保留第二套可见封面。\n5）透明点击层只承接进入事件，不绘制文字、图标、背景、边框、阴影或底座；可保留不可见的无障碍名称和键盘进入能力，不能将整张封面图设成透明。一次完整点击/触控只进入一次，不在 pointerdown 时提前撤掉封面；隔离本次手势，禁止继续触发下一页答案、拖拽或提交。进入第一题时仍为未作答状态。\n6）交付前同时核对封面原图与浏览器实际首屏：图中艺术标题、短副标题和设计按钮齐全且各一套，浏览器没有额外的可见 DOM/CSS 文字或按钮，点击任意位置可进入第一题。若有重复，修正 HTML 接入层；若图中文字错误，单独修正封面素材。不得用删掉艺术字、角色、按钮设计，换成空场景，或直接跳过封面的办法通过去重检查。\n\n3. 背景图规范与生图提示词逻辑\n1）背景图只用于提供风格氛围，不强行生成题目承载区域。题目白板、任务板、卡片、槽位、按钮和状态栏应由 HTML/CSS/JS 根据当前课件内容绘制，并覆盖在背景图上。背景图中不要生成框、白板、题板、任务板、玻璃板、卡片、按钮、标题、题目文字、选项文字、数字、字母、汉字、格线、槽位、logo、水印或二维码。\n2）背景图可以参考该风格 bg 图和 cover 图的视觉感觉自由延展，但只保留场景、色彩、材质、角色气质和边缘装饰；画面中心应保持开阔、低干扰，方便前端绘制适配当前题型的题板。\n3）本视觉风格背景图的生图提示词：\n奶雾莫兰迪童话房间背景，午后阳光、窗帘、软垫、绘本、星星抱枕、兔子玩偶、小书架和奶油质感装饰分布在边缘，温柔安静。画面中心保持开阔的柔光空间，方便 HTML/CSS/JS 绘制绘本质感互动卡片。不要生成卡片框、白板、按钮、标题、文字、书页文字、logo、水印或二维码。\n\n4. 按钮、字体与触控规范\n按钮使用柔和胶囊、纸艺圆角按钮或童话书签按钮，颜色轻、边界清楚。字体温和圆润，适合阅读。\n本课件面向小学低中高年级儿童，所有核心文字和可点击区域必须适合课堂投屏、互动屏和平板触控。题干、核心选项、按钮文字和状态数字要使用明显偏大的字号，普通提示文字也要清楚可读；主按钮、选项卡、拖拽块和槽位要有足够大的触碰面积和间距，儿童手指点击不容易误触。按钮必须有清楚边界、高对比文字、按压反馈和禁用态；不要把关键文字做得过小、过细、过浅或压在复杂纹理上。\n\n5. 色彩、材质与装饰密度\n色彩以奶油白、浅米色、雾粉、浅蓝、浅紫、温暖黄、浅绿和柔和红为主。\n色彩只作为视觉方向，不在图片中显示任何色号、色卡编号、代码、CSS 文本或设计参数。整体保持明亮、干净、护眼，避免大面积深色、强霓虹、复杂渐变和高压迫背景。装饰密度必须低于学习内容，角色、花草、糖果、气泡、电话线、科技光线或海图道具只放在边缘、角落或低层背景，不得穿过题目、选项、槽位、网格、按钮和反馈区域。\n\n6. UI层级与反馈\n底层是风格化背景，只提供氛围；中层是主主题板和内部功能卡片，盖在背景图上，由html/CSS/JS 绘制适合本风格的题板区域，是最高信息承载层；上层是可拖拽对象、选项、按钮、反馈条和当前选中态；弹窗层用于结果、时间到或完成反馈，必须有遮罩或清楚的独立卡片，不能遮挡关键学习内容。\n正确反馈使用柔和星光、浅绿描边和轻翻页感；错误反馈使用浅红边框；选中态使用温柔光圈。\n所有反馈只强化原交互，不新增新玩法，不改变原题目判断逻辑。\n\n7. 音效反馈规范\n音效是 UI 反馈的一部分，必须优先匹配当前风格的专属音效；只用于强化点击、选中、拖拽、落位、提交、答对、答错、提示、完成和重置状态，不改变原课件玩法、题型、节奏和按钮功能。音效需短促、低音量、低干扰，不能循环播放，不能盖过教学语音；需遵守原课件已有静音和音量设置。若没有真实音频素材，可用平台素材库、安全音效或 WebAudio 近似实现，但仍要尽量贴近本风格音效意图。\n本风格音效：点击使用轻柔玻璃铃，翻页或切换使用纸张轻翻声，答对使用温和完成提示，整体低干扰。\n\n8. 禁止项\n禁止生成无关实体、无关玩法、无关学科内容、伪文字、乱码、品牌名、公司名、水印、二维码、角标、设计参数、色值、代码、CSS 标注、软件界面说明、宣传语和不可编辑的题目内容。禁止遮挡、重绘、扭曲或弱化原题目、题板、格线、槽位、按钮和反馈状态。", "basePromptSHA256": "436fd43ea1a31d50fb68ab2b95bd8328cb3aa1c937a05145c72ee0209243301d", "promptSHA256": "59df989791fc2d11b668eef13fbeb17374cdf16fdfb734289bda2b0d8fe13e7d", "status": "候选待生成验证", "changeScope": "仅第2节：图片封面与HTML职责分离；原有封面美术描述逐字保留", "kind": "base", "old": "请严格按“奶雾童话风 UI规范”重新生成同一课件界面。\n\n0. 原课件保留规则\n本风格只用于 UI 视觉换肤，不得改变原课件的学科、题型、题目内容、答案、素材数量、槽位数量、组件数量、布局关系、按钮功能、计分逻辑和交互流程。原来是英语看图拼词、填空、拖拽、选择、分类、连线、逻辑推理或其他玩法，换风格后仍保持原玩法和原题目结构。主互动题页中的题干、选项、答案、字母、汉字、拼音、数字、公式、倒计时、得分、按钮文案、反馈文案和关卡信息等可变教学内容，必须由 HTML/CSS/JS 渲染，不要烘焙进背景图或题板底图。\n\n1. 整体视觉与布局\n风格识别锚点：第一眼应像奶雾莫兰迪绘本房间。使用轻软建模、奶油白、柔粉、奶油黄、淡紫、午后阳光、哑光柔面和微奶油肌理；中央互动卡片像温柔绘本页或软布告板，整体安静、治愈、低刺激，适合低龄绘本场景。\n采用奶雾绘本背景和中央柔和互动卡。画面可以有轻雾、云朵、花朵、城堡、小星星、柔光和绘本角色。整体柔和、低压、奶油白、安静，适合阅读、理解和低干扰互动。\n使用横版课件画布，画布主体集中在中央学习区，四周保留安全边距。顶部保留原课件已有标题、关卡、进度、奖励、倒计时或得分信息；中央按原课件布局放置题目、图片区、网格、线索、选项、素材池、槽位或操作区；底部或右侧保留原有按钮和工具按钮。背景只提供氛围，不承担学习信息。\n\n2. 封面图规范与生图提示词逻辑\n1）封面图用于儿童互动课件首页。封面图本身必须生成主标题、副标题和进入按钮 语和不可编辑的题目内容。禁止遮挡、重绘、扭曲或弱化原题目、题板、格线、槽位、按钮和反馈状态。", "new": "请严格按“奶雾童话风 UI规范”重新生成同一课件界面。\n\n0. 原课件保留规则\n本风格只用于 UI 视觉换肤，不得改变原课件的学科、题型、题目内容、答案、素材数量、槽位数量、组件数量、布局关系、按钮功能、计分逻辑和交互流程。原来是英语看图拼词、填空、拖拽、选择、分类、连线、逻辑推理或其他玩法，换风格后仍保持原玩法和原题目结构。主互动题页中的题干、选项、答案、字母、汉字、拼音、数字、公式、倒计时、得分、按钮文案、反馈文案和关卡信息等可变教学内容，必须由 HTML/CSS/JS 渲染，不要烘焙进背景图或题板底图。\n\n1. 整体视觉与布局\n风格识别锚点：第一眼应像奶雾莫兰迪绘本房间。使用轻软建模、奶油白、柔粉、奶油黄、淡紫、午后阳光、哑光柔面和微奶油肌理；中央互动卡片像温柔绘本页或软布告板，整体安静、治愈、低刺激，适合低龄绘本场景。\n采用奶雾绘本背景和中央柔和互动卡。画面可以有轻雾、云朵、花朵、城堡、小星星、柔光和绘本角色。整体柔和、低压、奶油白、安静，适合阅读、理解和低干扰互动。\n使用横版课件画布，画布主体集中在中央学习区，四周保留安全边距。顶部保留原课件已有标题、关卡、进度、奖励、倒计时或得分信息；中央按原课件布局放置题目、图片区、网格、线索、选项、素材池、槽位或操作区；底部或右侧保留原有按钮和工具按钮。背景只提供氛围，不承担学习信息。\n\n2. 封面图规范与生图提示词逻辑\n【本节适用范围】第2节是完整封面设计，第3节是进入后的主互动页背景，两者必须分别生成、分别使用。封面继续执行本节第3项的原有美术描述，包括艺术字、角色、场景、材质、副标题载体和按钮设计；不得把它改成“空背景＋普通HTML标题按钮”。第3节的无文字、无按钮、中央留白要求，以及第4—6节的题板、标准正文字体、学习区低干扰规则，只约束主互动页，不得用来删减封面。除用户在本次调整中明确要求不要封面外，仍按原版规范生成完整图片式首页。\n\n1）封面图用于儿童互动课件首页。封面图本身必须生成主标题、副标题和进入按钮；副标题不得超过15个字，图上不生成任何额外文字、包括风格名、品牌名、logo、水印、二维码、角标、色值、尺寸标记、伪文字或无关宣传语都不允许生成。封面图中的主标题、副标题、按钮造型和按钮文字是最终可见内容，必须保留。HTML 不得在这张封面图上再次叠加可见标题、副标题、按钮、按钮文字或底座；只配置覆盖封面的透明点击层，点击封面任意位置进入原课件。这里禁止的是 HTML 重复叠加，不是禁止图片生成标题或按钮。\n2）主标题、副标题和按钮文案都是可变元素，必须根据当前课件真实内容替换；若为英语课件则尽量用英文，若非英语课件则一律用中文。标题、短副标题和进入按钮需要沿同一视觉主轴组织，层级清楚、可读性强，适合课堂投屏。\n3）本视觉风格封面的生图提示词：\n奶雾莫兰迪色儿童童话封面，轻3D软建模，奶油白、柔粉、奶油黄和淡紫，午后阳光照进绘本房间。画面有窗帘、软垫、童话书、星星抱枕、小兔玩偶、木质小架和温柔光斑。右侧或中间放软萌兔子角色或绘本画面。中心上方生成奶油粉色柔软标题“{标题内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，标题轻柔、白描边、像棉花糖字。标题下方生成短副标题“{副标题内容根据课件真实内容填充，副标题不超过15个字，若为英语课件则尽量用英文，若非英文课件则一律用中文}”。中下方生成柔粉或奶油黄圆角按钮，按钮文字为“{进入绘本，按钮内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，按钮带柔和阴影和星星。\n\n4）封面接入顺序：先根据真实课件确认主标题、短副标题和进入文案，再依照上面的原版美术描述生成一张完整封面图；将它完整适配课件舞台，不裁掉文字、角色或按钮，也不把整张封面当作中间的小插图套进另一张封面。仅在封面容器内移除或隐藏源 HTML 的标题、副标题、示例插画和可见开始按钮，清理伪元素及 CSS 背景中重复的文字/按钮；主互动页的题干、选项、答案、控件和逻辑全部保留。不要因源课件原来使用 HTML 标题而继续保留第二套可见封面。\n5）透明点击层只承接进入事件，不绘制文字、图标、背景、边框、阴影或底座；可保留不可见的无障碍名称和键盘进入能力，不能将整张封面图设成透明。一次完整点击/触控只进入一次，不在 pointerdown 时提前撤掉封面；隔离本次手势，禁止继续触发下一页答案、拖拽或提交。进入第一题时仍为未作答状态。\n6）交付前同时核对封面原图与浏览器实际首屏：图中艺术标题、短副标题和设计按钮齐全且各一套，浏览器没有额外的可见 DOM/CSS 文字或按钮，点击任意位置可进入第一题。若有重复，修正 HTML 接入层；若图中文字错误，单独修正封面素材。不得用删掉艺术字、角色、按钮设计，换成空场景，或直接跳过封面的办法通过去重检查。\n\n3. 背景图规范与生图提示词逻辑\n1）背景图只用于提供风格氛围，不强行生成题目承载区域。题目白板、任务板、卡片、槽位、按钮和状态栏应由 HTML/CSS/JS 根据当前课件内容绘制，并覆盖在背景图上。背景图中不要生成框、白板、题板、任务板、玻璃板、卡片、按钮、标题、题目文字、选项文字、数字、字母、汉字、格线、槽位、logo、水印或二维码。\n2）背景图可以参考该风格 bg 图和 cover 图的视觉感觉自由延展，但只保留场景、色彩、材质、角色气质和边缘装饰；画面中心应保持开阔、低干扰，方便前端绘制适配当前题型的题板。\n3）本视觉风格背景图的生图提示词：\n奶雾莫兰迪童话房间背景，午后阳光、窗帘、软垫、绘本、星星抱枕、兔子玩偶、小书架和奶油质感装饰分布在边缘，温柔安静。画面中心保持开阔的柔光空间，方便 HTML/CSS/JS 绘制绘本质感互动卡片。不要生成卡片框、白板、按钮、标题、文字、书页文字、logo、水印或二维码。\n\n4. 按钮、字体与触控规范\n按钮使用柔和胶囊、纸艺圆角按钮或童话书签按钮，颜色轻、边界清楚。字体温和圆润，适合阅读。\n本课件面向小学低中高年级儿童，所有核心文字和可点击区域必须适合课堂投屏、互动屏和平板触控。题干、核心选项、按钮文字和状态数字要使用明显偏大的字号，普通提示文字也要清楚可读；主按钮、选项卡、拖拽块和槽位要有足够大的触碰面积和间距，儿童手指点击不容易误触。按钮必须有清楚边界、高对比文字、按压反馈和禁用态；不要把关键文字做得过小、过细、过浅或压在复杂纹理上。\n\n5. 色彩、材质与装饰密度\n色彩以奶油白、浅米色、雾粉、浅蓝、浅紫、温暖黄、浅绿和柔和红为主。\n色彩只作为视觉方向，不在图片中显示任何色号、色卡编号、代码、CSS 文本或设计参数。整体保持明亮、干净、护眼，避免大面积深色、强霓虹、复杂渐变和高压迫背景。装饰密度必须低于学习内容，角色、花草、糖果、气泡、电话线、科技光线或海图道具只放在边缘、角落或低层背景，不得穿过题目、选项、槽位、网格、按钮和反馈区域。\n\n6. UI层级与反馈\n底层是风格化背景，只提供氛围；中层是主主题板和内部功能卡片，盖在背景图上，由html/CSS/JS 绘制适合本风格的题板区域，是最高信息承载层；上层是可拖拽对象、选项、按钮、反馈条和当前选中态；弹窗层用于结果、时间到或完成反馈，必须有遮罩或清楚的独立卡片，不能遮挡关键学习内容。\n正确反馈使用柔和星光、浅绿描边和轻翻页感；错误反馈使用浅红边框；选中态使用温柔光圈。\n所有反馈只强化原交互，不新增新玩法，不改变原题目判断逻辑。\n\n7. 音效反馈规范\n音效是 UI 反馈的一部分，必须优先匹配当前风格的专属音效；只用于强化点击、选中、拖拽、落位、提交、答对、答错、提示、完成和重置状态，不改变原课件玩法、题型、节奏和按钮功能。音效需短促、低音量、低干扰，不能循环播放，不能盖过教学语音；需遵守原课件已有静音和音量设置。若没有真实音频素材，可用平台素材库、安全音效或 WebAudio 近似实现，但仍要尽量贴近本风格音效意图。\n本风格音效：点击使用轻柔玻璃铃，翻页或切换使用纸张轻翻声，答对使用温和完成提示，整体低干扰。\n\n8. 禁止项\n禁止生成无关实体、无关玩法、无关学科内容、伪文字、乱码、品牌名、公司名、水印、二维码、角标、设计参数、色值、代码、CSS 标注、软件界面说明、宣传语和不可编辑的题目内容。禁止遮挡、重绘、扭曲或弱化原题目、题板、格线、槽位、按钮和反馈状态。", "sectionsOld": ["请严格按“奶雾童话风 UI规范”重新生成同一课件界面。\n\n", "0. 原课件保留规则\n本风格只用于 UI 视觉换肤，不得改变原课件的学科、题型、题目内容、答案、素材数量、槽位数量、组件数量、布局关系、按钮功能、计分逻辑和交互流程。原来是英语看图拼词、填空、拖拽、选择、分类、连线、逻辑推理或其他玩法，换风格后仍保持原玩法和原题目结构。主互动题页中的题干、选项、答案、字母、汉字、拼音、数字、公式、倒计时、得分、按钮文案、反馈文案和关卡信息等可变教学内容，必须由 HTML/CSS/JS 渲染，不要烘焙进背景图或题板底图。\n\n", "1. 整体视觉与布局\n风格识别锚点：第一眼应像奶雾莫兰迪绘本房间。使用轻软建模、奶油白、柔粉、奶油黄、淡紫、午后阳光、哑光柔面和微奶油肌理；中央互动卡片像温柔绘本页或软布告板，整体安静、治愈、低刺激，适合低龄绘本场景。\n采用奶雾绘本背景和中央柔和互动卡。画面可以有轻雾、云朵、花朵、城堡、小星星、柔光和绘本角色。整体柔和、低压、奶油白、安静，适合阅读、理解和低干扰互动。\n使用横版课件画布，画布主体集中在中央学习区，四周保留安全边距。顶部保留原课件已有标题、关卡、进度、奖励、倒计时或得分信息；中央按原课件布局放置题目、图片区、网格、线索、选项、素材池、槽位或操作区；底部或右侧保留原有按钮和工具按钮。背景只提供氛围，不承担学习信息。\n\n", "2. 封面图规范与生图提示词逻辑\n1）封面图用于儿童互动课件首页。封面图本身必须生成主标题、副标题和进入按钮；副标题不得超过15个字，图上不生成任何额外文字、包括风格名、品牌名、logo、水印、二维码、角标、色值、尺寸标记、伪文字或无关宣传语都不允许生成。逻辑上，从封面图任意位置点击即可进入，禁止在封面图上再生成任何文字/按钮，只需要配置点击事件。\n2）主标题、副标题和按钮文案都是可变元素，必须根据当前课件真实内容替换；若为英语课件则尽量用英文，若非英语课件则一律用中文。标题、短副标题和进入按钮需要沿同一视觉主轴组织，层级清楚、可读性强，适合课堂投屏。\n3）本视觉风格封面的生图提示词：\n奶雾莫兰迪色儿童童话封面，轻3D软建模，奶油白、柔粉、奶油黄和淡紫，午后阳光照进绘本房间。画面有窗帘、软垫、童话书、星星抱枕、小兔玩偶、木质小架和温柔光斑。右侧或中间放软萌兔子角色或绘本画面。中心上方生成奶油粉色柔软标题“{标题内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，标题轻柔、白描边、像棉花糖字。标题下方生成短副标题“{副标题内容根据课件真实内容填充，副标题不超过15个字，若为英语课件则尽量用英文，若非英文课件则一律用中文}”。中下方生成柔粉或奶油黄圆角按钮，按钮文字为“{进入绘本，按钮内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，按钮带柔和阴影和星星。\n\n", "3. 背景图规范与生图提示词逻辑\n1）背景图只用于提供风格氛围，不强行生成题目承载区域。题目白板、任务板、卡片、槽位、按钮和状态栏应由 HTML/CSS/JS 根据当前课件内容绘制，并覆盖在背景图上。背景图中不要生成框、白板、题板、任务板、玻璃板、卡片、按钮、标题、题目文字、选项文字、数字、字母、汉字、格线、槽位、logo、水印或二维码。\n2）背景图可以参考该风格 bg 图和 cover 图的视觉感觉自由延展，但只保留场景、色彩、材质、角色气质和边缘装饰；画面中心应保持开阔、低干扰，方便前端绘制适配当前题型的题板。\n3）本视觉风格背景图的生图提示词：\n奶雾莫兰迪童话房间背景，午后阳光、窗帘、软垫、绘本、星星抱枕、兔子玩偶、小书架和奶油质感装饰分布在边缘，温柔安静。画面中心保持开阔的柔光空间，方便 HTML/CSS/JS 绘制绘本质感互动卡片。不要生成卡片框、白板、按钮、标题、文字、书页文字、logo、水印或二维码。\n\n", "4. 按钮、字体与触控规范\n按钮使用柔和胶囊、纸艺圆角按钮或童话书签按钮，颜色轻、边界清楚。字体温和圆润，适合阅读。\n本课件面向小学低中高年级儿童，所有核心文字和可点击区域必须适合课堂投屏、互动屏和平板触控。题干、核心选项、按钮文字和状态数字要使用明显偏大的字号，普通提示文字也要清楚可读；主按钮、选项卡、拖拽块和槽位要有足够大的触碰面积和间距，儿童手指点击不容易误触。按钮必须有清楚边界、高对比文字、按压反馈和禁用态；不要把关键文字做得过小、过细、过浅或压在复杂纹理上。\n\n", "5. 色彩、材质与装饰密度\n色彩以奶油白、浅米色、雾粉、浅蓝、浅紫、温暖黄、浅绿和柔和红为主。\n色彩只作为视觉方向，不在图片中显示任何色号、色卡编号、代码、CSS 文本或设计参数。整体保持明亮、干净、护眼，避免大面积深色、强霓虹、复杂渐变和高压迫背景。装饰密度必须低于学习内容，角色、花草、糖果、气泡、电话线、科技光线或海图道具只放在边缘、角落或低层背景，不得穿过题目、选项、槽位、网格、按钮和反馈区域。\n\n", "6. UI层级与反馈\n底层是风格化背景，只提供氛围；中层是主主题板和内部功能卡片，盖在背景图上，由html/CSS/JS 绘制适合本风格的题板区域，是最高信息承载层；上层是可拖拽对象、选项、按钮、反馈条和当前选中态；弹窗层用于结果、时间到或完成反馈，必须有遮罩或清楚的独立卡片，不能遮挡关键学习内容。\n正确反馈使用柔和星光、浅绿描边和轻翻页感；错误反馈使用浅红边框；选中态使用温柔光圈。\n所有反馈只强化原交互，不新增新玩法，不改变原题目判断逻辑。\n\n", "7. 音效反馈规范\n音效是 UI 反馈的一部分，必须优先匹配当前风格的专属音效；只用于强化点击、选中、拖拽、落位、提交、答对、答错、提示、完成和重置状态，不改变原课件玩法、题型、节奏和按钮功能。音效需短促、低音量、低干扰，不能循环播放，不能盖过教学语音；需遵守原课件已有静音和音量设置。若没有真实音频素材，可用平台素材库、安全音效或 WebAudio 近似实现，但仍要尽量贴近本风格音效意图。\n本风格音效：点击使用轻柔玻璃铃，翻页或切换使用纸张轻翻声，答对使用温和完成提示，整体低干扰。\n\n", "8. 禁止项\n禁止生成无关实体、无关玩法、无关学科内容、伪文字、乱码、品牌名、公司名、水印、二维码、角标、设计参数、色值、代码、CSS 标注、软件界面说明、宣传语和不可编辑的题目内容。禁止遮挡、重绘、扭曲或弱化原题目、题板、格线、槽位、按钮和反馈状态。"], "sectionsNew": ["请严格按“奶雾童话风 UI规范”重新生成同一课件界面。\n\n", "0. 原课件保留规则\n本风格只用于 UI 视觉换肤，不得改变原课件的学科、题型、题目内容、答案、素材数量、槽位数量、组件数量、布局关系、按钮功能、计分逻辑和交互流程。原来是英语看图拼词、填空、拖拽、选择、分类、连线、逻辑推理或其他玩法，换风格后仍保持原玩法和原题目结构。主互动题页中的题干、选项、答案、字母、汉字、拼音、数字、公式、倒计时、得分、按钮文案、反馈文案和关卡信息等可变教学内容，必须由 HTML/CSS/JS 渲染，不要烘焙进背景图或题板底图。\n\n", "1. 整体视觉与布局\n风格识别锚点：第一眼应像奶雾莫兰迪绘本房间。使用轻软建模、奶油白、柔粉、奶油黄、淡紫、午后阳光、哑光柔面和微奶油肌理；中央互动卡片像温柔绘本页或软布告板，整体安静、治愈、低刺激，适合低龄绘本场景。\n采用奶雾绘本背景和中央柔和互动卡。画面可以有轻雾、云朵、花朵、城堡、小星星、柔光和绘本角色。整体柔和、低压、奶油白、安静，适合阅读、理解和低干扰互动。\n使用横版课件画布，画布主体集中在中央学习区，四周保留安全边距。顶部保留原课件已有标题、关卡、进度、奖励、倒计时或得分信息；中央按原课件布局放置题目、图片区、网格、线索、选项、素材池、槽位或操作区；底部或右侧保留原有按钮和工具按钮。背景只提供氛围，不承担学习信息。\n\n", "2. 封面图规范与生图提示词逻辑\n【本节适用范围】第2节是完整封面设计，第3节是进入后的主互动页背景，两者必须分别生成、分别使用。封面继续执行本节第3项的原有美术描述，包括艺术字、角色、场景、材质、副标题载体和按钮设计；不得把它改成“空背景＋普通HTML标题按钮”。第3节的无文字、无按钮、中央留白要求，以及第4—6节的题板、标准正文字体、学习区低干扰规则，只约束主互动页，不得用来删减封面。除用户在本次调整中明确要求不要封面外，仍按原版规范生成完整图片式首页。\n\n1）封面图用于儿童互动课件首页。封面图本身必须生成主标题、副标题和进入按钮；副标题不得超过15个字，图上不生成任何额外文字、包括风格名、品牌名、logo、水印、二维码、角标、色值、尺寸标记、伪文字或无关宣传语都不允许生成。封面图中的主标题、副标题、按钮造型和按钮文字是最终可见内容，必须保留。HTML 不得在这张封面图上再次叠加可见标题、副标题、按钮、按钮文字或底座；只配置覆盖封面的透明点击层，点击封面任意位置进入原课件。这里禁止的是 HTML 重复叠加，不是禁止图片生成标题或按钮。\n2）主标题、副标题和按钮文案都是可变元素，必须根据当前课件真实内容替换；若为英语课件则尽量用英文，若非英语课件则一律用中文。标题、短副标题和进入按钮需要沿同一视觉主轴组织，层级清楚、可读性强，适合课堂投屏。\n3）本视觉风格封面的生图提示词：\n奶雾莫兰迪色儿童童话封面，轻3D软建模，奶油白、柔粉、奶油黄和淡紫，午后阳光照进绘本房间。画面有窗帘、软垫、童话书、星星抱枕、小兔玩偶、木质小架和温柔光斑。右侧或中间放软萌兔子角色或绘本画面。中心上方生成奶油粉色柔软标题“{标题内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，标题轻柔、白描边、像棉花糖字。标题下方生成短副标题“{副标题内容根据课件真实内容填充，副标题不超过15个字，若为英语课件则尽量用英文，若非英文课件则一律用中文}”。中下方生成柔粉或奶油黄圆角按钮，按钮文字为“{进入绘本，按钮内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，按钮带柔和阴影和星星。\n\n4）封面接入顺序：先根据真实课件确认主标题、短副标题和进入文案，再依照上面的原版美术描述生成一张完整封面图；将它完整适配课件舞台，不裁掉文字、角色或按钮，也不把整张封面当作中间的小插图套进另一张封面。仅在封面容器内移除或隐藏源 HTML 的标题、副标题、示例插画和可见开始按钮，清理伪元素及 CSS 背景中重复的文字/按钮；主互动页的题干、选项、答案、控件和逻辑全部保留。不要因源课件原来使用 HTML 标题而继续保留第二套可见封面。\n5）透明点击层只承接进入事件，不绘制文字、图标、背景、边框、阴影或底座；可保留不可见的无障碍名称和键盘进入能力，不能将整张封面图设成透明。一次完整点击/触控只进入一次，不在 pointerdown 时提前撤掉封面；隔离本次手势，禁止继续触发下一页答案、拖拽或提交。进入第一题时仍为未作答状态。\n6）交付前同时核对封面原图与浏览器实际首屏：图中艺术标题、短副标题和设计按钮齐全且各一套，浏览器没有额外的可见 DOM/CSS 文字或按钮，点击任意位置可进入第一题。若有重复，修正 HTML 接入层；若图中文字错误，单独修正封面素材。不得用删掉艺术字、角色、按钮设计，换成空场景，或直接跳过封面的办法通过去重检查。\n\n", "3. 背景图规范与生图提示词逻辑\n1）背景图只用于提供风格氛围，不强行生成题目承载区域。题目白板、任务板、卡片、槽位、按钮和状态栏应由 HTML/CSS/JS 根据当前课件内容绘制，并覆盖在背景图上。背景图中不要生成框、白板、题板、任务板、玻璃板、卡片、按钮、标题、题目文字、选项文字、数字、字母、汉字、格线、槽位、logo、水印或二维码。\n2）背景图可以参考该风格 bg 图和 cover 图的视觉感觉自由延展，但只保留场景、色彩、材质、角色气质和边缘装饰；画面中心应保持开阔、低干扰，方便前端绘制适配当前题型的题板。\n3）本视觉风格背景图的生图提示词：\n奶雾莫兰迪童话房间背景，午后阳光、窗帘、软垫、绘本、星星抱枕、兔子玩偶、小书架和奶油质感装饰分布在边缘，温柔安静。画面中心保持开阔的柔光空间，方便 HTML/CSS/JS 绘制绘本质感互动卡片。不要生成卡片框、白板、按钮、标题、文字、书页文字、logo、水印或二维码。\n\n", "4. 按钮、字体与触控规范\n按钮使用柔和胶囊、纸艺圆角按钮或童话书签按钮，颜色轻、边界清楚。字体温和圆润，适合阅读。\n本课件面向小学低中高年级儿童，所有核心文字和可点击区域必须适合课堂投屏、互动屏和平板触控。题干、核心选项、按钮文字和状态数字要使用明显偏大的字号，普通提示文字也要清楚可读；主按钮、选项卡、拖拽块和槽位要有足够大的触碰面积和间距，儿童手指点击不容易误触。按钮必须有清楚边界、高对比文字、按压反馈和禁用态；不要把关键文字做得过小、过细、过浅或压在复杂纹理上。\n\n", "5. 色彩、材质与装饰密度\n色彩以奶油白、浅米色、雾粉、浅蓝、浅紫、温暖黄、浅绿和柔和红为主。\n色彩只作为视觉方向，不在图片中显示任何色号、色卡编号、代码、CSS 文本或设计参数。整体保持明亮、干净、护眼，避免大面积深色、强霓虹、复杂渐变和高压迫背景。装饰密度必须低于学习内容，角色、花草、糖果、气泡、电话线、科技光线或海图道具只放在边缘、角落或低层背景，不得穿过题目、选项、槽位、网格、按钮和反馈区域。\n\n", "6. UI层级与反馈\n底层是风格化背景，只提供氛围；中层是主主题板和内部功能卡片，盖在背景图上，由html/CSS/JS 绘制适合本风格的题板区域，是最高信息承载层；上层是可拖拽对象、选项、按钮、反馈条和当前选中态；弹窗层用于结果、时间到或完成反馈，必须有遮罩或清楚的独立卡片，不能遮挡关键学习内容。\n正确反馈使用柔和星光、浅绿描边和轻翻页感；错误反馈使用浅红边框；选中态使用温柔光圈。\n所有反馈只强化原交互，不新增新玩法，不改变原题目判断逻辑。\n\n", "7. 音效反馈规范\n音效是 UI 反馈的一部分，必须优先匹配当前风格的专属音效；只用于强化点击、选中、拖拽、落位、提交、答对、答错、提示、完成和重置状态，不改变原课件玩法、题型、节奏和按钮功能。音效需短促、低音量、低干扰，不能循环播放，不能盖过教学语音；需遵守原课件已有静音和音量设置。若没有真实音频素材，可用平台素材库、安全音效或 WebAudio 近似实现，但仍要尽量贴近本风格音效意图。\n本风格音效：点击使用轻柔玻璃铃，翻页或切换使用纸张轻翻声，答对使用温和完成提示，整体低干扰。\n\n", "8. 禁止项\n禁止生成无关实体、无关玩法、无关学科内容、伪文字、乱码、品牌名、公司名、水印、二维码、角标、设计参数、色值、代码、CSS 标注、软件界面说明、宣传语和不可编辑的题目内容。禁止遮挡、重绘、扭曲或弱化原题目、题板、格线、槽位、按钮和反馈状态。"], "section2": 3, "blocks": [{"kind": "equal", "old": "2. 封面图规范与生图提示词逻辑\n", "new": "2. 封面图规范与生图提示词逻辑 范”重新生成同一课件界面。\n\n0. 原课件保留规则\n本风格只用于 UI 视觉换肤，不得改变原课件的学科、题型、题目内容、答案、素材数量、槽位数量、组件数量、布局关系、按钮功能、计分逻辑和交互流程。原来是英语看图拼词、填空、拖拽、选择、分类、连线、逻辑推理或其他玩法，换风格后仍保持原玩法和原题目结构。主互动题页中的题干、选项、答案、字母、汉字、拼音、数字、公式、倒计时、得分、按钮文案、反馈文案和关卡信息等可变教学内容，必须由 HTML/CSS/JS 渲染，不要烘焙进背景图或题板底图。\n\n1. 整体视觉与布局\n风格识别锚点：第一眼应像 Low Poly 软糯几何世界。使用低面数温柔建模、圆角几何小块拼接、柔蓝、薄荷绿、奶油黄、柔粉、浅紫和干净分区；中央是几何认知互动区，适合图形规律、城市家园和低龄数学。\n采用低多边形童趣背景和中央几何题板。画面可以有多边形山丘、云朵、树、海面、桌面和几何小道具。低多边形只用于背景和边缘质感，标题、题干、选项、槽位和网格必须平整清楚。\n使用横版课件画布，画布主体集中在中央学习区，四周保留安全边距。顶部保留原课件已有标题、关卡、进度、奖励、倒计时或得分信息；中央按原课件布局放置题目、图片区、网格、线索、选项、素材池、槽位或操作区；底部或右侧保留原有按钮和工具按钮。背景只提供氛围，不承担学习信息。\n\n2. 封面图规范与生图提示词逻辑\n【本节适用范围】第2节是完整封面设计，第3节是进入后的主互动页背景，两者必须分别生成、分别使用。封面继续执行本节第3项的原有美术描述，包括艺术字、角色、场景、材质、副标题载体和按钮设计；不得把它改成“空背景＋普通HTML标题按钮”。第3节的无文字、无按钮、中央留白要求，以及第4—6节的题板、标准正文字体、学习区低干扰规则，只约束主互动页，不得用来删减封面。除用户在本次调整中明确要求不要封面外，仍按原版规范生成完整图片式首页。\n\n1）封面图用于儿童互动课件首页。封面图本身必须生成主标题、副标题和进入按钮；副标题不得超过15个字，图上不生成任何额外文字、包括风格名、品牌名、logo、水印、二维码、角标、色值、尺寸标记、伪文字或无关宣传语都不允许生成。封面图中的主标题、副标题、按钮造型和按钮文字是最终可见内容，必须保留。HTML 不得在这张封面图上再次叠加可见标题、副标题、按钮、按钮文字或底座；只配置覆盖封面的透明点击层，点击封面任意位置进入原课件。这里禁止的是 HTML 重复叠加，不是禁止图片生成标题或按钮。\n2）主标题、副标题和按钮文案都是可变元素，必须根据当前课件真实内容替换；若为英语课件则尽量用英文，若非英语课件则一律用中文。标题、短副标题和进入按钮需要沿同一视觉主轴组织，层级清楚、可读性强，适合课堂投屏。\n3）本视觉风格封面的生图提示词：\nLow Poly 软糯几何儿童封面，低面数温柔建模，柔蓝、薄荷绿、奶油黄、柔粉和浅紫配色。背景是几何小镇、草地、河流、小桥、彩色三角圆形方形积木和云朵，边缘放可爱小熊或几何学习伙伴。中心上方生成柔软几何拼块标题“{标题内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，标题有白描边、粉蓝黄绿小形状点缀。标题下方生成短副标题“{副标题内容根据课件真实内容填充，副标题不超过15个字，若为英语课件则尽量用英文，若非英文课件则一律用中文}”。中下方生成奶油黄或珊瑚粉圆角按钮，按钮文字为“{进入游戏，按钮内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，按钮带简单箭头和星星。\n\n4）封面接入顺序：先根据真实课件确认主标题、短副标题和进入文案，再依照上面的原版美术描述生成一张完整封面图；将它完整适配课件舞台，不裁掉文字、角色或按钮，也不把整张封面当作中间的小插图套进另一张封面。仅在封面容器内移除或隐藏源 HTML 的标题、副标题、示例插画和可见开始按钮，清理伪元素及 CSS 背景中重复的文字/按钮；主互动页的题干、选项、答案、控件和逻辑全部保留。不要因源课件原来使用 HTML 标题而继续保留第二套可见封面。\n5）透明点击层只承接进入事件，不绘制文字、图标、背景、边框、阴影或底座；可保留不可见的无障碍名称和键盘进入能力，不能将整张封面图设成透明。一次完整点击/触控只进入一次，不在 pointerdown 时提前撤掉封面；隔离本次手势，禁止继续触发下一页答案、拖拽或提交。进入第一题时仍为未作答状态。\n6）交付前同时核对封面原图与浏览器实际首屏：图中艺术标题、短副标题和设计按钮齐全且各一套，浏览器没有额外的可见 DOM/CSS 文字或按钮，点击任意位置可进入第一题。若有重复，修正 HTML 接入层；若图中文字错误，单独修正封面素材。不得用删掉艺术字、角色、按钮设计，换成空场景，或直接跳过封面的办法通过去重检查。\n\n3. 背景图规范与生图提示词逻辑\n1）背景图只用于提供风格氛围，不强行生成题目承载区域。题目白板、任务板、卡片、槽位、按钮和状态栏应由 HTML/CSS/JS 根据当前课件内容绘制，并覆盖在背景图上。背景图中不要生成框、白板、题板、任务板、玻璃板、卡片、按钮、标题、题目文字、选项文字、数字、字母、汉字、格线、槽位、logo、水印或二维码。\n2）背景图可以参考该风格 bg 图和 cover 图的视觉感觉自由延展，但只保留场景、色彩、材质、角色气质和边缘装饰；画面中心应保持开阔、低干扰，方便前端绘制适配当前题型的题板。\n3）本视觉风格背景图的生图提示词：\nLow Poly 软糯几何童趣背景，柔蓝天空、薄荷绿草地、奶油黄小路、柔粉屋顶、浅紫远山、几何小镇、河流、小桥、彩色三角圆形方形元素和可爱小熊靠边出现。画面中心保持开阔干净的几何空间，方便 HTML/CSS/JS 绘制图形规律题板。不要生成白板框、卡片框、按钮、标题、文字、数字、logo、水印或二维码。\n\n4. 按钮、字体与触控规范\n按钮使用几何圆角按钮或轻切面按钮，边界清楚、不要尖锐。字体标准清晰，几何风格不能影响识别。\n本课件面向小学低中高年级儿童，所有核心文字和可点击区域必须适合课堂投屏、互动屏和平板触控。题干、核心选项、按钮文字和状态数字要使用明显偏大的字号，普通提示文字也要清楚可读；主按钮、选项卡、拖拽块和槽位要有足够大的触碰面积和间距，儿童手指点击不容易误触。按钮必须有清楚边界、高对比文字、按压反馈和禁用态；不要把关键文字做得过小、过细、过浅或压在复杂纹理上。\n\n5. 色彩、材质与装饰密度\n色彩以天空蓝、草绿、浅黄、奶油白、低多边形青绿、柔和橙和柔和红为主。\n色彩只作为视觉方向，不在图片中显示任何色号、色卡编号、代码、CSS 文本或设计参数。整体保持明亮、干净、护眼，避免大面积深色、强霓虹、复杂渐变和高压迫背景。装饰密度必须低于学习内容，角色、花草、糖果、气泡、电话线、科技光线或海图道具只放在边缘、角落或低层背景，不得穿过题目、选项、槽位、网格、按钮和反馈区域。\n\n6. UI层级与反馈\n底层是风格化背景，只提供氛围；中层是主主题板和内部功能卡片，是最高信息承载层；盖在背景图上，由html/CSS/JS 绘制适合本风格的题板区域，上层是可拖拽对象、选项、按钮、反馈条和当前选中态；弹窗层用于结果、时间到或完成反馈，必须有遮罩或清楚的独立卡片，不能遮挡关键学习内容。\n正确反馈使用几何块点亮、绿色描边和小星星；错误反馈使用柔和红边框；选中态使用几何光圈。\n所有反馈只强化原交互，不新增新玩法，不改变原题目判断逻辑。\n\n7. 音效反馈规范\n音效是 UI 反馈的一部分，必须优先匹配当前风格的专属音效；只用于强化点击、选中、拖拽、落位、提交、答对、答错、提示、完成和重置状态，不改变原课件玩法、题型、节奏和按钮功能。音效需短促、低音量、低干扰，不能循环播放，不能盖过教学语音；需遵守原课件已有静音和音量设置。若没有真实音频素材，可用平台素材库、安全音效或 WebAudio 近似实现，但仍要尽量贴近本风格音效意图。\n本风格音效：点击使用清脆短音，拖拽落位使用几何块拼合声，答对使用任务点亮和短促完成铃。\n\n8. 禁止项\n禁止生成无关实体、无关玩法、无关学科内容、伪文字、乱码、品牌名、公司名、水印、二维码、角标、设计参数、色值、代码、CSS 标注、软件界面说明、宣传语和不可编辑的题目内容。禁止遮挡、重绘、扭曲或弱化原题目、题板、格线、槽位、按钮和反馈状态。", "basePromptSHA256": "e0346dd89d9341b0ec23a025e685ae8ce9b1e1610db08aa1f85b7a94e5d84d8d", "promptSHA256": "74de2acbb661a1ff29a251a329d272a878823c445f7c615be1dd665eb4583670", "status": "候选待生成验证", "changeScope": "仅第2节：图片封面与HTML职责分离；原有封面美术描述逐字保留", "kind": "base", "old": "请严格按“低多边形童趣风 UI规范”重新生成同一课件界面。\n\n0. 原课件保留规则\n本风格只用于 UI 视觉换肤，不得改变原课件的学科、题型、题目内容、答案、素材数量、槽位数量、组件数量、布局关系、按钮功能、计分逻辑和交互流程。原来是英语看图拼词、填空、拖拽、选择、分类、连线、逻辑推理或其他玩法，换风格后仍保持原玩法和原题目结构。主互动题页中的题干、选项、答案、字母、汉字、拼音、数字、公式、倒 填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，按钮带简单箭头和星星。\n\n4）封面接入顺序：先根据真实课件确认主标题、短副标题和进入文案，再依照上面的原版美术描述生成一张完整封面图；将它完整适配课件舞台，不裁掉文字、角色或按钮，也不把整张封面当作中间的小插图套进另一张封面。仅在封面容器内移除或隐藏源 HTML 的标题、副标题、示例插画和可见开始按钮，清理伪元素及 CSS 背景中重复的文字/按钮；主互动页的题干、选项、答案、控件和逻辑全部保留。不要因源课件原来使用 HTML 标题而继续保留第二套可见封面。\n5）透明点击层只承接进入事件，不绘制文字、图标、背景、边框、阴影或底座；可保留不可见的无障碍名称和键盘进入能力，不能将整张封面图设成透明。一次完整点击/触控只进入一次，不在 pointerdown 时提前撤掉封面；隔离本次手势，禁止继续触发下一页答案、拖拽或提交。进入第一题时仍为未作答状态。\n6）交付前同时核对封面原图与浏览器实际首屏：图中艺术标题、短副标题和设计按钮齐全且各一套，浏览器没有额外的可见 DOM/CSS 文字或按钮，点击任意位置可进入第一题。若有重复，修正 HTML 接入层；若图中文字错误，单独修正封面素材。不得用删掉艺术字、角色、按钮设计，换成空场景，或直接跳过封面的办法通过去重检查。\n\n3. 背景图规范与生图提示词逻辑\n1）背景图只用于提供风格氛围，不强行生成题目承载区域。题目白板、任务板、卡片、槽位、按钮和状态栏应由 HTML/CSS/JS 根据当前课件内容绘制，并覆盖在背景图上。背景图中不要生成框、白板、题板、任务板、玻璃板、卡片、按钮、标题、题目文字、选项文字、数字、字母、汉字、格线、槽位、logo、水印或二维码。\n2）背景图可以参考该风格 bg 图和 cover 图的视觉感觉自由延展，但只保留场景、色彩、材质、角色气质和边缘装饰；画面中心应保持开阔、低干扰，方便前端绘制适配当前题型的题板。\n3）本视觉风格背景图的生图提示词：\nLow Poly 软糯几何童趣背景，柔蓝天空、薄荷绿草地、奶油黄小路、柔粉屋顶、浅紫远山、几何小镇、河流、小桥、彩色三角圆形方形元素和可爱小熊靠边出现。画面中心保持开阔干净的几何空间，方便 HTML/CSS/JS 绘制图形规律题板。不要生成白板框、卡片框、按钮、标题、文字、数字、logo、水印或二维码。\n\n4. 按钮、字体与触控规范\n按钮使用几何圆角按钮或轻切面按钮，边界清楚、不要尖锐。字体标准清晰，几何风格不能影响识别。\n本课件面向小学低中高年级儿童，所有核心文字和可点击区域必须适合课堂投屏、互动屏和平板触控。题干、核心选项、按钮文字和状态数字要使用明显偏大的字号，普通提示文字也要清楚可读；主按钮、选项卡、拖拽块和槽位要有足够大的触碰面积和间距，儿童手指点击不容易误触。按钮必须有清楚边界、高对比文字、按压反馈和禁用态；不要把关键文字做得过小、过细、过浅或压在复杂纹理上。\n\n5. 色彩、材质与装饰密度\n色彩以天空蓝、草绿、浅黄、奶油白、低多边形青绿、柔和橙和柔和红为主。\n色彩只作为视觉方向，不在图片中显示任何色号、色卡编号、代码、CSS 文本或设计参数。整体保持明亮、干净、护眼，避免大面积深色、强霓虹、复杂渐变和高压迫背景。装饰密度必须低于学习内容，角色、花草、糖果、气泡、电话线、科技光线或海图道具只放在边缘、角落或低层背景，不得穿过题目、选项、槽位、网格、按钮和反馈区域。\n\n6. UI层级与反馈\n底层是风格化背景，只提供氛围；中层是主主题板和内部功能卡片，是最高信息承载层；盖在背景图上，由html/CSS/JS 绘制适合本风格的题板区域，上层是可拖拽对象、选项、按钮、反馈条和当前选中态；弹窗层用于结果、时间到或完成反馈，必须有遮罩或清楚的独立卡片，不能遮挡关键学习内容。\n正确反馈使用几何块点亮、绿色描边和小星星；错误反馈使用柔和红边框；选中态使用几何光圈。\n所有反馈只强化原交互，不新增新玩法，不改变原题目判断逻辑。\n\n7. 音效反馈规范\n音效是 UI 反馈的一部分，必须优先匹配当前风格的专属音效；只用于强化点击、选中、拖拽、落位、提交、答对、答错、提示、完成和重置状态，不改变原课件玩法、题型、节奏和按钮功能。音效需短促、低音量、低干扰，不能循环播放，不能盖过教学语音；需遵守原课件已有静音和音量设置。若没有真实音频素材，可用平台素材库、安全音效或 WebAudio 近似实现，但仍要尽量贴近本风格音效意图。\n本风格音效：点击使用清脆短音，拖拽落位使用几何块拼合声，答对使用任务点亮和短促完成铃。\n\n8. 禁止项\n禁止生成无关实体、无关玩法、无关学科内容、伪文字、乱码、品牌名、公司名、水印、二维码、角标、设计参数、色值、代码、CSS 标注、软件界面说明、宣传语和不可编辑的题目内容。禁止遮挡、重绘、扭曲或弱化原题目、题板、格线、槽位、按钮和反馈状态。", "sectionsOld": ["请严格按“低多边形童趣风 UI规范”重新生成同一课件界面。\n\n", "0. 原课件保留规则\n本风格只用于 UI 视觉换肤，不得改变原课件的学科、题型、题目内容、答案、素材数量、槽位数量、组件数量、布局关系、按钮功能、计分逻辑和交互流程。原来是英语看图拼词、填空、拖拽、选择、分类、连线、逻辑推理或其他玩法，换风格后仍保持原玩法和原题目结构。主互动题页中的题干、选项、答案、字母、汉字、拼音、数字、公式、倒计时、得分、按钮文案、反馈文案和关卡信息等可变教学内容，必须由 HTML/CSS/JS 渲染，不要烘焙进背景图或题板底图。\n\n", "1. 整体视觉与布局\n风格识别锚点：第一眼应像 Low Poly 软糯几何世界。使用低面数温柔建模、圆角几何小块拼接、柔蓝、薄荷绿、奶油黄、柔粉、浅紫和干净分区；中央是几何认知互动区，适合图形规律、城市家园和低龄数学。\n采用低多边形童趣背景和中央几何题板。画面可以有多边形山丘、云朵、树、海面、桌面和几何小道具。低多边形只用于背景和边缘质感，标题、题干、选项、槽位和网格必须平整清楚。\n使用横版课件画布，画布主体集中在中央学习区，四周保留安全边距。顶部保留原课件已有标题、关卡、进度、奖励、倒计时或得分信息；中央按原课件布局放置题目、图片区、网格、线索、选项、素材池、槽位或操作区；底部或右侧保留原有按钮和工具按钮。背景只提供氛围，不承担学习信息。\n\n", "2. 封面图规范与生图提示词逻辑\n1）封面图用于儿童互动课件首页。封面图本身必须生成主标题、副标题和进入按钮；副标题不得超过15个字，图上不生成任何额外文字、包括风格名、品牌名、logo、水印、二维码、角标、色值、尺寸标记、伪文字或无关宣传语都不允许生成。逻辑上，从封面图任意位置点击即可进入，禁止在封面图上再生成任何文字/按钮，只需要配置点击事件。\n2）主标题、副标题和按钮文案都是可变元素，必须根据当前课件真实内容替换；若为英语课件则尽量用英文，若非英语课件则一律用中文。标题、短副标题和进入按钮需要沿同一视觉主轴组织，层级清楚、可读性强，适合课堂投屏。\n3）本视觉风格封面的生图提示词：\nLow Poly 软糯几何儿童封面，低面数温柔建模，柔蓝、薄荷绿、奶油黄、柔粉和浅紫配色。背景是几何小镇、草地、河流、小桥、彩色三角圆形方形积木和云朵，边缘放可爱小熊或几何学习伙伴。中心上方生成柔软几何拼块标题“{标题内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，标题有白描边、粉蓝黄绿小形状点缀。标题下方生成短副标题“{副标题内容根据课件真实内容填充，副标题不超过15个字，若为英语课件则尽量用英文，若非英文课件则一律用中文}”。中下方生成奶油黄或珊瑚粉圆角按钮，按钮文字为“{进入游戏，按钮内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，按钮带简单箭头和星星。\n\n", "3. 背景图规范与生图提示词逻辑\n1）背景图只用于提供风格氛围，不强行生成题目承载区域。题目白板、任务板、卡片、槽位、按钮和状态栏应由 HTML/CSS/JS 根据当前课件内容绘制，并覆盖在背景图上。背景图中不要生成框、白板、题板、任务板、玻璃板、卡片、按钮、标题、题目文字、选项文字、数字、字母、汉字、格线、槽位、logo、水印或二维码。\n2）背景图可以参考该风格 bg 图和 cover 图的视觉感觉自由延展，但只保留场景、色彩、材质、角色气质和边缘装饰；画面中心应保持开阔、低干扰，方便前端绘制适配当前题型的题板。\n3）本视觉风格背景图的生图提示词：\nLow Poly 软糯几何童趣背景，柔蓝天空、薄荷绿草地、奶油黄小路、柔粉屋顶、浅紫远山、几何小镇、河流、小桥、彩色三角圆形方形元素和可爱小熊靠边出现。画面中心保持开阔干净的几何空间，方便 HTML/CSS/JS 绘制图形规律题板。不要生成白板框、卡片框、按钮、标题、文字、数字、logo、水印或二维码。\n\n", "4. 按钮、字体与触控规范\n按钮使用几何圆角按钮或轻切面按钮，边界清楚、不要尖锐。字体标准清晰，几何风格不能影响识别。\n本课件面向小学低中高年级儿童，所有核心文字和可点击区域必须适合课堂投屏、互动屏和平板触控。题干、核心选项、按钮文字和状态数字要使用明显偏大的字号，普通提示文字也要清楚可读；主按钮、选项卡、拖拽块和槽位要有足够大的触碰面积和间距，儿童手指点击不容易误触。按钮必须有清楚边界、高对比文字、按压反馈和禁用态；不要把关键文字做得过小、过细、过浅或压在复杂纹理上。\n\n", "5. 色彩、材质与装饰密度\n色彩以天空蓝、草绿、浅黄、奶油白、低多边形青绿、柔和橙和柔和红为主。\n色彩只作为视觉方向，不在图片中显示任何色号、色卡编号、代码、CSS 文本或设计参数。整体保持明亮、干净、护眼，避免大面积深色、强霓虹、复杂渐变和高压迫背景。装饰密度必须低于学习内容，角色、花草、糖果、气泡、电话线、科技光线或海图道具只放在边缘、角落或低层背景，不得穿过题目、选项、槽位、网格、按钮和反馈区域。\n\n", "6. UI层级与反馈\n底层是风格化背景，只提供氛围；中层是主主题板和内部功能卡片，是最高信息承载层；盖在背景图上，由html/CSS/JS 绘制适合本风格的题板区域，上层是可拖拽对象、选项、按钮、反馈条和当前选中态；弹窗层用于结果、时间到或完成反馈，必须有遮罩或清楚的独立卡片，不能遮挡关键学习内容。\n正确反馈使用几何块点亮、绿色描边和小星星；错误反馈使用柔和红边框；选中态使用几何光圈。\n所有反馈只强化原交互，不新增新玩法，不改变原题目判断逻辑。\n\n", "7. 音效反馈规范\n音效是 UI 反馈的一部分，必须优先匹配当前风格的专属音效；只用于强化点击、选中、拖拽、落位、提交、答对、答错、提示、完成和重置状态，不改变原课件玩法、题型、节奏和按钮功能。音效需短促、低音量、低干扰，不能循环播放，不能盖过教学语音；需遵守原课件已有静音和音量设置。若没有真实音频素材，可用平台素材库、安全音效或 WebAudio 近似实现，但仍要尽量贴近本风格音效意图。\n本风格音效：点击使用清脆短音，拖拽落位使用几何块拼合声，答对使用任务点亮和短促完成铃。\n\n", "8. 禁止项\n禁止生成无关实体、无关玩法、无关学科内容、伪文字、乱码、品牌名、公司名、水印、二维码、角标、设计参数、色值、代码、CSS 标注、软件界面说明、宣传语和不可编辑的题目内容。禁止遮挡、重绘、扭曲或弱化原题目、题板、格线、槽位、按钮和反馈状态。"], "sectionsNew": ["请严格按“低多边形童趣风 UI规范”重新生成同一课件界面。\n\n", "0. 原课件保留规则\n本风格只用于 UI 视觉换肤，不得改变原课件的学科、题型、题目内容、答案、素材数量、槽位数量、组件数量、布局关系、按钮功能、计分逻辑和交互流程。原来是英语看图拼词、填空、拖拽、选择、分类、连线、逻辑推理或其他玩法，换风格后仍保持原玩法和原题目结构。主互动题页中的题干、选项、答案、字母、汉字、拼音、数字、公式、倒计时、得分、按钮文案、反馈文案和关卡信息等可变教学内容，必须由 HTML/CSS/JS 渲染，不要烘焙进背景图或题板底图。\n\n", "1. 整体视觉与布局\n风格识别锚点：第一眼应像 Low Poly 软糯几何世界。使用低面数温柔建模、圆角几何小块拼接、柔蓝、薄荷绿、奶油黄、柔粉、浅紫和干净分区；中央是几何认知互动区，适合图形规律、城市家园和低龄数学。\n采用低多边形童趣背景和中央几何题板。画面可以有多边形山丘、云朵、树、海面、桌面和几何小道具。低多边形只用于背景和边缘质感，标题、题干、选项、槽位和网格必须平整清楚。\n使用横版课件画布，画布主体集中在中央学习区，四周保留安全边距。顶部保留原课件已有标题、关卡、进度、奖励、倒计时或得分信息；中央按原课件布局放置题目、图片区、网格、线索、选项、素材池、槽位或操作区；底部或右侧保留原有按钮和工具按钮。背景只提供氛围，不承担学习信息。\n\n", "2. 封面图规范与生图提示词逻辑\n【本节适用范围】第2节是完整封面设计，第3节是进入后的主互动页背景，两者必须分别生成、分别使用。封面继续执行本节第3项的原有美术描述，包括艺术字、角色、场景、材质、副标题载体和按钮设计；不得把它改成“空背景＋普通HTML标题按钮”。第3节的无文字、无按钮、中央留白要求，以及第4—6节的题板、标准正文字体、学习区低干扰规则，只约束主互动页，不得用来删减封面。除用户在本次调整中明确要求不要封面外，仍按原版规范生成完整图片式首页。\n\n1）封面图用于儿童互动课件首页。封面图本身必须生成主标题、副标题和进入按钮；副标题不得超过15个字，图上不生成任何额外文字、包括风格名、品牌名、logo、水印、二维码、角标、色值、尺寸标记、伪文字或无关宣传语都不允许生成。封面图中的主标题、副标题、按钮造型和按钮文字是最终可见内容，必须保留。HTML 不得在这张封面图上再次叠加可见标题、副标题、按钮、按钮文字或底座；只配置覆盖封面的透明点击层，点击封面任意位置进入原课件。这里禁止的是 HTML 重复叠加，不是禁止图片生成标题或按钮。\n2）主标题、副标题和按钮文案都是可变元素，必须根据当前课件真实内容替换；若为英语课件则尽量用英文，若非英语课件则一律用中文。标题、短副标题和进入按钮需要沿同一视觉主轴组织，层级清楚、可读性强，适合课堂投屏。\n3）本视觉风格封面的生图提示词：\nLow Poly 软糯几何儿童封面，低面数温柔建模，柔蓝、薄荷绿、奶油黄、柔粉和浅紫配色。背景是几何小镇、草地、河流、小桥、彩色三角圆形方形积木和云朵，边缘放可爱小熊或几何学习伙伴。中心上方生成柔软几何拼块标题“{标题内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，标题有白描边、粉蓝黄绿小形状点缀。标题下方生成短副标题“{副标题内容根据课件真实内容填充，副标题不超过15个字，若为英语课件则尽量用英文，若非英文课件则一律用中文}”。中下方生成奶油黄或珊瑚粉圆角按钮，按钮文字为“{进入游戏，按钮内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，按钮带简单箭头和星星。\n\n4）封面接入顺序：先根据真实课件确认主标题、短副标题和进入文案，再依照上面的原版美术描述生成一张完整封面图；将它完整适配课件舞台，不裁掉文字、角色或按钮，也不把整张封面当作中间的小插图套进另一张封面。仅在封面容器内移除或隐藏源 HTML 的标题、副标题、示例插画和可见开始按钮，清理伪元素及 CSS 背景中重复的文字/按钮；主互动页的题干、选项、答案、控件和逻辑全部保留。不要因源课件原来使用 HTML 标题而继续保留第二套可见封面。\n5）透明点击层只承接进入事件，不绘制文字、图标、背景、边框、阴影或底座；可保留不可见的无障碍名称和键盘进入能力，不能将整张封面图设成透明。一次完整点击/触控只进入一次，不在 pointerdown 时提前撤掉封面；隔离本次手势，禁止继续触发下一页答案、拖拽或提交。进入第一题时仍为未作答状态。\n6）交付前同时核对封面原图与浏览器实际首屏：图中艺术标题、短副标题和设计按钮齐全且各一套，浏览器没有额外的可见 DOM/CSS 文字或按钮，点击任意位置可进入第一题。若有重复，修正 HTML 接入层；若图中文字错误，单独修正封面素材。不得用删掉艺术字、角色、按钮设计，换成空场景，或直接跳过封面的办法通过去重检查。\n\n", "3. 背景图规范与生图提示词逻辑\n1）背景图只用于提供风格氛围，不强行生成题目承载区域。题目白板、任务板、卡片、槽位、按钮和状态栏应由 HTML/CSS/JS 根据当前课件内容绘制，并覆盖在背景图上。背景图中不要生成框、白板、题板、任务板、玻璃板、卡片、按钮、标题、题目文字、选项文字、数字、字母、汉字、格线、槽位、logo、水印或二维码。\n2）背景图可以参考该风格 bg 图和 cover 图的视觉感觉自由延展，但只保留场景、色彩、材质、角色气质和边缘装饰；画面中心应保持开阔、低干扰，方便前端绘制适配当前题型的题板。\n3）本视觉风格背景图的生图提示词：\nLow Poly 软糯几何童趣背景，柔蓝天空、薄荷绿草地、奶油黄小路、柔粉屋顶、浅紫远山、几何小镇、河流、小桥、彩色三角圆形方形元素和可爱小熊靠边出现。画面中心保持开阔干净的几何空间，方便 HTML/CSS/JS 绘制图形规律题板。不要生成白板框、卡片框、按钮、标题、文字、数字、logo、水印或二维码。\n\n", "4. 按钮、字体与触控规范\n按钮使用几何圆角按钮或轻切面按钮，边界清楚、不要尖锐。字体标准清晰，几何风格不能影响识别。\n本课件面向小学低中高年级儿童，所有核心文字和可点击区域必须适合课堂投屏、互动屏和平板触控。题干、核心选项、按钮文字和状态数字要使用明显偏大的字号，普通提示文字也要清楚可读；主按钮、选项卡、拖拽块和槽位要有足够大的触碰面积和间距，儿童手指点击不容易误触。按钮必须有清楚边界、高对比文字、按压反馈和禁用态；不要把关键文字做得过小、过细、过浅或压在复杂纹理上。\n\n", "5. 色彩、材质与装饰密度\n色彩以天空蓝、草绿、浅黄、奶油白、低多边形青绿、柔和橙和柔和红为主。\n色彩只作为视觉方向，不在图片中显示任何色号、色卡编号、代码、CSS 文本或设计参数。整体保持明亮、干净、护眼，避免大面积深色、强霓虹、复杂渐变和高压迫背景。装饰密度必须低于学习内容，角色、花草、糖果、气泡、电话线、科技光线或海图道具只放在边缘、角落或低层背景，不得穿过题目、选项、槽位、网格、按钮和反馈区域。\n\n", "6. UI层级与反馈\n底层是风格化背景，只提供氛围；中层是主主题板和内部功能卡片，是最高信息承载层；盖在背景图上，由html/CSS/JS 绘制适合本风格的题板区域，上层是可拖拽对象、选项、按钮、反馈条和当前选中态；弹窗层用于结果、时间到或完成反馈，必须有遮罩或清楚的独立卡片，不能遮挡关键学习内容。\n正确反馈使用几何块点亮、绿色描边和小星星；错误反馈使用柔和红边框；选中态使用几何光圈。\n所有反馈只强化原交互，不新增新玩法，不改变原题目判断逻辑。\n\n", "7. 音效反馈规范\n音效是 UI 反馈的一部分，必须优先匹配当前风格的专属音效；只用于强化点击、选中、拖拽、落位、提交、答对、答错、提示、完成和重置状态，不改变原课件玩法、题型、节奏和按钮功能。音效需短促、低音量、低干扰，不能循环播放，不能盖过教学语音；需遵守原课件已有静音和音量设置。若没有真实音频素材，可用平台素材库、安全音效或 WebAudio 近似实现，但仍要尽量贴近本风格音效意图。\n本风格音效：点击使用清脆短音，拖拽落位使用几何块拼合声，答对使用任务点亮和短促完成铃。\n\n", "8. 禁止项\n禁止生成无关实体、无关玩法、无关学科内容、伪文字、乱码、品牌名、公司名、水印、二维码、角标、设计参数、色值、代码、CSS 标注、软件界面说明、宣传语和不可编辑的题目内容。禁止遮挡、重绘、扭曲或弱化原题目、题板、格线、槽位、按钮和反馈状态。"], "section2": 3, "blocks": [{"kind": "equal", "old": "2. 封面图规范与生图提示词逻辑\n", "new": "2. 封面图规范与生图提示词逻辑\n"}, {"kind": "insert", "old": "", "new": "【本节适用范围】第2节是完整封面设计，第3节是进入后的主互动页背景，两者必须分别生成、分别使用。封面继续执行本节第3项的原有美术描述，包括艺术字、角色、场景、材质、副标题载体和按钮设计；不得把它改成“空背景＋普通HTML标题按钮”。第3节的无文字、无按钮、中央留白要求，以及第4—6节的题板、标准正文字体、学习区低干扰规则，只约束主互动页，不得用来删减封面。除用户在本次调整中明确要求不要封面外，仍按原版规范生成完整图片式首页。\n\n", "change": 0, "left": [], "right": [{"text": "【本节适用范围】第2节是完整封面设计，第3节是进入后的主互动页背景，两者必须分别生成、分别使用。封面继续执行本节第3项的原有美术描述，包括艺术字、角色、场景、材质、副标题载体和按钮设计；不得把它改成“空背景＋普通HTML标题按钮”。第3节的无文字、无按钮、中央留白要求，以及第4—6节的题板、标准正文字体、学习区低干扰规则，只约束主互动页，不得用来删减封面。除用户在本次调整中明确要求不要封面外，仍按原版规范生成完整图片式首页。\n\n", "changed": true}]}, {"kind": "replace", "old": "1）封面图用于儿童互动课件首页。封面图本身必须生成主标题、副标题和进入按钮；副标题不得超过15个字，图上不生成任何额外文字、包括风格名、品牌名、logo、水印、二维码、角标、色值、尺寸标记、伪文字或无关宣传语都不允许生成。逻辑上，从封面图任意位置点击即可进入，禁止在封面图上再生成任何文字/按钮，只需要配置点击事件。\n", "new": "1）封面图用于儿童互动课件首页。封面图本身必须生成主标题、副标题和进入按钮；副标题不得超过15个字，图上不生成任何额外文字、包括风格名、品牌名、logo、水印、二维码、角标、色值、尺寸标记、伪文字或无关宣传语都不允许生成。封面图中的主标题、副标题、按钮造型和按钮文字是最终可见内容，必须保留。HTML 不得在这张封面图上再次叠加可见标题、副标题、按钮、按钮文字或底座；只配置覆盖封面的透明点击层，点击封面任意位置进入原课件。这里禁止的是 HTML 重复叠加，不是禁止图片生成标题或按钮。\n", "change": 1, "left": [{"text": "1）封面图用于儿童互动课件首页。封面图本身必须生成主标题、副标题和进入按钮；副标题不得超过15个字，图上不生成任何额外文字、包括风格名、品牌名、logo、水印、二维码、角标、色值、尺寸标记、伪文字或无关宣传语都不允许生成。", "changed": false}, {"text": "逻辑上，从封面图任意位置点击即可进入，禁止在封面图上再生成任何文字/按钮，只需要配置点击事件。\n", "changed": true}], "right": [{"text": "1）封面图用于儿童互动课件首页。封面图本身必须生成主标题、副标题和进入按钮；副标题不得超过15个字，图上不生成任何额外文字、包括风格名、品牌名、logo、水印、二维码、角标、色值、尺寸标记、伪文字或无关宣传语都不允许生成。", "changed": false}, {"text": "封面图中的主标题、副标题、按钮造型和按钮文字是最终可见内容，必须保留。HTML 不得在这张封面图上再次 ert", "old": "", "new": "6）交付前同时核对封面原图与浏览器实际首屏：图中艺术标题、短副标题和设计按钮齐全且各一套，浏览器没有额外的可见 DOM/CSS 文字或按钮，点击任意位置可进入第一题。若有重复，修正 HTML 接入层；若图中文字错误，单独修正封面素材。不得用删掉艺术字、角色、按钮设计，换成空场景，或直接跳过封面的办法通过去重检查。\n\n", "change": 4, "left": [], "right": [{"text": "6）交付前同时核对封面原图与浏览器实际首屏：图中艺术标题、短副标题和设计按钮齐全且各一套，浏览器没有额外的可见 DOM/CSS 文字或按钮，点击任意位置可进入第一题。若有重复，修正 HTML 接入层；若图中文字错误，单独修正封面素材。不得用删掉艺术字、角色、按钮设计，换成空场景，或直接跳过封面的办法通过去重检查。\n\n", "changed": true}]}], "delta": 825}, {"styleCode": "minimal_flat", "displayName": "极简扁平童趣风", "caseId": "S24", "promptText": "请严格按“极简扁平童趣风 UI规范”重新生成同一课件界面。\n\n0. 原课件保留规则\n本风格只用于 UI 视觉换肤，不得改变原课件的学科、题型、题目内容、答案、素材数量、槽位数量、组件数量、布局关系、按钮功能、计分逻辑和交互流程。原来是英语看图拼词、填空、拖拽、选择、分类、连线、逻辑推理或其他玩法，换风格后仍保持原玩法和原题目结构。主互动题页中的题干、选项、答案、字母、汉字、拼音、数字、公式、倒计时、得分、按钮文案、反馈文案和关卡信息等可变教学内容，必须由 HTML/CSS/JS 渲染，不要烘焙进背景图或题板底图。\n\n1. 整体视觉与布局\n风格识别锚点：第一眼应像极简扁平早教认知卡。使用纯色块、无复杂纹理、少阴影干扰、奶油白、淡蓝、浅黄背景、红蓝黄绿高识别元素、粗圆角线条和超大按钮；图标极简易辨认，信息清晰，适合早教颜色、形状和基础分类。\n采用护眼浅色背景和中央极简题板。画面以留白、清楚分区、大图标、大选项和低装饰为核心。不要复杂场景、角色堆叠、多层浮窗或强拟物材质。\n使用横版课件画布，画布主体集中在中央学习区，四周保留安全边距。顶部保留原课件已有标题、关卡、进度、奖励、倒计时或得分信息；中央按原课件布局放置题目、图片区、网格、线索、选项、素材池、槽位或操作区；底部或右侧保留原有按钮和工具按钮。背景只提供氛围，不承担学习信息。\n\n2. 封面图规范与生图提示词逻辑\n【本节适用范围】第2节是完整封面设计，第3节是进入后的主互动页背景，两者必须分别生成、分别使用。封面继续执行本节第3项的原有美术描述，包括艺术字、角色、场景、材质、副标题载体和按钮设计；不得把它改成“空背景＋普通HTML标题按钮”。第3节的无文字、无按钮、中央留白要求，以及第4—6节的题板、标准正文字体、学习区低干扰规则，只约束主互动页，不得用来删减封面。除用户在本次调整中明确要求不要封面外，仍按原版规范生成完整图片式首页。\n\n1）封面图用于儿童互动课件首页。封面图本身必须生成主标题、副标题和进入按钮；副标题不得超过15个字，图上不生成任何额外文字、包括风格名、品牌名、logo、水印、二维码、角标、色值、尺寸标记、伪文字或无关宣传语都不允许生成。封面图中的主标题、副标题、按钮造型和按钮文字是最终可见内容，必须保留。HTML 不得在这张封面图上再次叠加可见标题、副标题、按钮、按钮文字或底座；只配置覆盖封面的透明点击层，点击封面任意位置进入原课件。这里禁止的是 HTML 重复叠加，不是禁止图片生成标题或按钮。\n2）主标题、副标题和按钮文案都是可变元素，必须根据当前课件真实内容替换；若为英语课件则尽量用英文，若非英语课件则一律用中文。标题、短副标题和进入按钮需要沿同一视觉主轴组织，层级清楚、可读性强，适合课堂投屏。\n3）本视觉风格封面的生图提示词：\n极简扁平儿童认知封面，奶油白和淡蓝背景，红蓝黄绿高饱和纯色元素，粗圆角线条，无复杂纹理、无阴影干扰。画面可放一个简单儿童头像、喇叭图标、几个大号扁平物品图标或几何图形，整体像低龄早教认知 App。中心上方生成大号粗圆角标题“{标题内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，标题清晰、色彩分明、无立体复杂效果。标题下方生成短副标题“{副标题内容根据课件真实内容填充，副标题不超过15个字，若为英语课件则尽量用英文，若非英文课件则一律用中文}”。中下方生成大号扁平圆角按钮，按钮文字为“{进入游戏，按钮内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，按钮颜色高对比、边界清楚。\n\n4）封面接入顺序：先根据真实课件确认主标题、短副标题和进入文案，再依照上面的原版美术描述生成一张完整封面图；将它完整适配课件舞台，不裁掉文字、角色或按钮，也不把整张封面当作中间的小插图套进另一张封面。仅在封面容器内移除或隐藏源 HTML 的标题、副标题、示例插画和可见开始按钮，清理伪元素及 CSS 背景中重复的文字/按钮；主互动页的题干、选项、答案、控件和逻辑全部保留。不要因源课件原来使用 HTML 标题而继续保留第二套可见封面。\n5）透明点击层只承接进入事件，不绘制文字、图标、背景、边框、阴影或底座；可保留不可见的无障碍名称和键盘进入能力，不能将整张封面图设成透明。一次完整点击/触控只进入一次，不在 pointerdown 时提前撤掉封面；隔离本次手势，禁止继续触发下一页答案、拖拽或提交。进入第一题时仍为未作答状态。\n6）交付前同时核对封面原图与浏览器实际首屏：图中艺术标题、短副标题和设计按钮齐全且各一套，浏览器没有额外的可见 DOM/CSS 文字或按钮，点击任意位置可进入第一题。若有重复，修正 HTML 接入层；若图中文字错误，单独修正封面素材。不得用删掉艺术字、角色、按钮设计，换成空场景，或直接跳过封面的办法通过去重检查。\n\n3. 背景图规范与生图提示词逻辑\n1）背景图只用于提供风格氛围，不强行生成题目承载区域。题目白板、任务板、卡片、槽位、按钮和状态栏应由 HTML/CSS/JS 根据当前课件内容绘制，并覆盖在背景图上。背景图中不要生成框、白板、题板、任务板、玻璃板、卡片、按钮、标题、题目文字、选项文字、数字、字母、汉字、格线、槽位、logo、水印或二维码。\n2）背景图可以参考该风格 bg 图和 cover 图的视觉感觉自由延展，但只保留场景、色彩、材质、角色气质和边缘装饰；画面中心应保持开阔、低干扰，方便前端绘制适配当前题型的题板。\n3）本视觉风格背景图的生图提示词：\n极简扁平童趣背景，奶油白、淡蓝、浅黄作为底色，少量红蓝黄绿纯色几何块、云朵、圆点、儿童头像或简单图标放在边缘，信息极简、清楚、低干扰。画面中心保持大面积空白，方便 HTML/CSS/JS 绘制早教认知题板。不要生成白板框、题板、按钮、标题、文字、数字、图标说明、logo、水印或二维码。\n\n4. 按钮、字体与触控规范\n按钮使用大尺寸扁平圆角按钮，颜色明确、文字高对比、反馈简洁。字体使用标准无衬线或圆体，避免装饰字。\n本课件面向小学低中高年级儿童，所有核心文字和可点击区域必须适合课堂投屏、互动屏和平板触控。题干、核心选项、按钮文字和状态数字要使用明显偏大的字号，普通提示文字也要清楚可读；主按钮、选项卡、拖拽块和槽位要有足够大的触碰面积和间距，儿童手指点击不容易误触。按钮必须有清楚边界、高对比文字、按压反馈和禁用态；不要把关键文字做得过小、过细、过浅或压在复杂纹理上。\n\n5. 色彩、材质与装饰密度\n色彩以白色、浅灰白、天空蓝、清新绿、温暖黄、柔和橙和柔和红为主。\n色彩只作为视觉方向，不在图片中显示任何色号、色卡编号、代码、CSS 文本或设计参数。整体保持明亮、干净、护眼，避免大面积深色、强霓虹、复杂渐变和高压迫背景。装饰密度必须低于学习内容，角色、花草、糖果、气泡、电话线、科技光线或海图道具只放在边缘、角落或低层背景，不得穿过题目、选项、槽位、网格、按钮和反馈区域。\n\n6. UI层级与反馈\n底层是风格化背景，只提供氛围；中层是主主题板和内部功能卡片，盖在背景图上，由html/CSS/JS 绘制适合本风格的题板区域，是最高信息承载层；上层是可拖拽对象、选项、按钮、反馈条和当前选中态；弹窗层用于结果、时间到或完成反馈，必须有遮罩或清楚的独立卡片，不能遮挡关键学习内容。\n正确反馈使用绿色描边、对勾和轻微填充；错误反馈使用柔和红边框；选中态使用清楚描边和简单上浮。\n所有反馈只强化原交互，不新增新玩法，不改变原题目判断逻辑。\n\n7. 音效反馈规范\n音效是 UI 反馈的一部分，必须优先匹配当前风格的专属音效；只用于强化点击、选中、拖拽、落位、提交、答对、答错、提示、完成和重置状态，不改变原课件玩法、题型、节奏和按钮功能。音效需短促、低音量、低干扰，不能循环播放，不能盖过教学语音；需遵守原课件已有静音和音量设置。若没有真实音频素材，可用平台素材库、安全音效或 WebAudio 近似实现，但仍要尽量贴近本风格音效意图。\n本风格音效：只保留轻点击、轻选中、正确提示和错误提示四类极简音效，声音短促、低干扰。\n\n8. 禁止项\n禁止生成无关实体、无关玩法、无关学科内容、伪文字、乱码、品牌名、公司名、水印、二维码、角标、设计参数、色值、代码、CSS 标注、软

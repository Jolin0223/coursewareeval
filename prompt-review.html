糖果城堡、棉花糖云、彩虹桥、棒棒糖、马卡龙、甜甜圈和软糖小路。右侧或下方放可爱兔子、小鸡或糖果学习伙伴，表情软萌。画面中心上方生成奶油糖霜大标题“{标题内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，标题像翻糖蛋糕字，粉白渐变、白描边、带星星和糖霜高光。标题下方生成短副标题“{副标题内容根据课件真实内容填充，副标题不超过15个字，若为英语课件则尽量用英文，若非英文课件则一律用中文}”。中下方生成粉色或蜜桃色果冻胶囊按钮，按钮文字为“{进入游戏，按钮内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，按钮带白描边、糖果高光和小星星。\n\n3. 背景图规范与生图提示词逻辑\n1）背景图只用于提供风格氛围，不强行生成题目承载区域。题目白板、任务板、卡片、槽位、按钮和状态栏应由 HTML/CSS/JS 根据当前课件内容绘制，并覆盖在背景图上。背景图中不要生成框、白板、题板、任务板、玻璃板、卡片、按钮、标题、题目文字、选项文字、数字、字母、汉字、格线、槽位、logo、水印或二维码。\n2）背景图可以参考该风格 bg 图和 cover 图的视觉感觉自由延展，但只保留场景、色彩、材质、角色气质和边缘装饰；画面中心应保持开阔、低干扰，方便前端绘制适配当前题型的题板。\n3）本视觉风格背景图的生图提示词：\n3D粘土哑光糖果乐园背景，马卡龙粉、奶油黄、浅紫、薄荷绿，糖果城堡、棉花糖云、彩虹桥、棒棒糖、马卡龙、甜甜圈和软糖装饰放在边缘，整体甜美柔软。画面中心保持开阔的低纹理糖果世界背景，方便 HTML/CSS/JS 绘制题板。不要生成奶油框、任务板、卡片、按钮、标题、文字、糖果标签、logo、水印或二维码。\n\n4. 按钮、字体与触控规范\n按钮使用糖果胶囊、果冻圆角按钮或软糖按钮，带白描边、柔和高光和按压回弹。字体圆润可爱，但字母、数字、题干不能装饰化到难读。\n本课件面向小学低中高年级儿童，所有核心文字和可点击区域必须适合课堂投屏、互动屏和平板触控。题干、核心选项、按钮文字和状态数字要使用明显偏大的字号，普通提示文字也要清楚可读；主按钮、选项卡、拖拽块和槽位要有足够大的触碰面积和间距，儿童手指点击不容易误触。按钮必须有清楚边界、高对比文字、按压反馈和禁用态；不要把关键文字做得过小、过细、过浅或压在复杂纹理上。\n\n5. 色彩、材质与装饰密度\n色彩以奶油白、樱花粉、蜜桃粉、浅紫、薄荷绿、柠檬黄、天空蓝和柔和红为主。\n色彩只作为视觉方向，不在图片中显示任何色号、色卡编号、代码、CSS 文本或设计参数。整体保持明亮、干净、护眼，避免大面积深色、强霓虹、复杂渐变和高压迫背景。装饰密度必须低于学习内容，角色、花草、糖果、气泡、电话线、科技光线或海图道具只放在边缘、角落或低层背景，不得穿过题目、选项、槽位、网格、按钮和反馈区域。\n\n6. UI层级与反馈\n底层是风格化背景，只提供氛围；中层是主主题板和内部功能卡片，盖在背景图上，由html/CSS/JS 绘制适合本风格的题板区域，是最高信息承载层；上层是可拖拽对象、选项、按钮、反馈条和当前选中态；弹窗层用于结果、时间到或完成反馈，必须有遮罩或清楚的独立卡片，不能遮挡关键学习内容。\n正确反馈使用糖果星星、软糖弹起和绿色描边；错误反馈使用浅粉红边框和柔软回弹；选中态使用白描边和果冻上浮。\n所有反馈只强化原交互，不新增新玩法，不改变原题目判断逻辑。\n\n7. 音效反馈规范\n音效是 UI 反馈的一部分，必须优先匹配当前风格的专属音效；只用于强化点击、选中、拖拽、落位、提交、答对、答错、提示、完成和重置状态，不改变原课件玩法、题型、节奏和按钮功能。音效需短促、低音量、低干扰，不能循环播放，不能盖过教学语音；需遵守原课件已有静音和音量设置。若没有真实音频素材，可用平台素材库、安全音效或 WebAudio 近似实现，但仍要尽量贴近本风格音效意图。\n本风格音效：点击使用糖果轻碰声，按钮使用软糖弹跳声，答对使用甜美短铃和泡泡破裂声，答错使用柔软回弹声。\n\n8. 禁止项\n禁止生成无关实体、无关玩法、无关学科内容、伪文字、乱码、品牌名、公司名、水印、二维码、角标、设计参数、色值、代码、CSS 标注、软件界面说明、宣传语和不可编辑的题目内容。禁止遮挡、重绘、扭曲或弱化原题目、题板、格线、槽位、按钮和反馈状态。", "new": "请严格按“糖果乐园风 UI规范”重新生成同一课件界面。\n\n0. 原课件保留规则\n本风格只用于 UI 视觉换肤，不得改变原课件的学科、题型、题目内容、答案、素材数量、槽位数量、组件数量、布局关系、按钮功能、计分逻辑和交互流程。原来是英语看图拼词、填空、拖拽、选择、分类、连线、逻辑推理或其他玩法，换风格后仍保持原玩法和原题目结构。主互动题页中的题干、选项、答案、字母、汉字、拼音、数字、公式、倒计时、得分、按钮文案、反馈文案和关卡信息等可变教学内容，必须由 HTML/CSS/JS 渲染，不要烘焙进背景图或题板底图。\n\n1. 整体视觉与布局\n风格识别锚点：第一眼应像哑光粘土糖果世界。使用马卡龙粉、奶油黄、浅紫、薄荷绿、棉花糖圆角按钮、马卡龙道具、糖果装饰和可爱陪伴角色；中央互动区像柔软翻糖蛋糕或糖果托盘，甜美治愈但内容区必须干净，适合低龄英语、颜色形状和配对游戏。\n采用马卡龙糖果背景和中央奶油甜品题板。画面可以有糖果屋、棒棒糖、软云、甜甜圈、马卡龙、彩虹和果冻质感。整体高明度、甜美、柔软、低龄友好，不能过暗、过灰或变成普通玻璃卡片。\n使用横版课件画布，画布主体集中在中央学习区，四周保留安全边距。顶部保留原课件已有标题、关卡、进度、奖励、倒计时或得分信息；中央按原课件布局放置题目、图片区、网格、线索、选项、素材池、槽位或操作区；底部或右侧保留原有按钮和工具按钮。背景只提供氛围，不承担学习信息。\n\n2. 封面图规范与生图提示词逻辑\n【本节适用范围】第2节是完整封面设计，第3节是进入后的主互动页背景，两者必须分别生成、分别使用。封面继续执行本节第3项的原有美术描述，包括艺术字、角色、场景、材质、副标题载体和按钮设计；不得把它改成“空背景＋普通HTML标题按钮”。第3节的无文字、无按钮、中央留白要求，以及第4—6节的题板、标准正文字体、学习区低干扰规则，只约束主互动页，不得用来删减封面。除用户在本次调整中明确要求不要封面外，仍按原版规范生成完整图片式首页。\n\n1）封面图用于儿童互动课件首页。封面图本身必须生成主标题、副标题和进入按钮；副标题不得超过15个字，图上不生成任何额外文字、包括风格名、品牌名、logo、水印、二维码、角标、色值、尺寸标记、伪文字或无关宣传语都不允许生成。封面图中的主标题、副标题、按钮造型和按钮文字是最终可见内容，必须保留。HTML 不得在这张封面图上再次叠加可见标题、副标题、按钮、按钮文字或底座；只配置覆盖封面的透明点击层，点击封面任意位置进入原课件。这里禁止的是 HTML 重复叠加，不是禁止图片生成标题或按钮。\n2）主标题、副标题和按钮文案都是可变元素，必须根据当前课件真实内容替换；若为英语课件则尽量用英文，若非英语课件则一律用中文。标题、短副标题和进入按钮需要沿同一视觉主轴组织，层级清楚、可读性强，适合课堂投屏。\n3）本视觉风格封面的生图提示词：\n3D粘土哑光糖果乐园封面，马卡龙粉、奶油黄、浅紫和薄荷绿配色，背景有糖果城堡、棉花糖云、彩虹桥、棒棒糖、马卡龙、甜甜圈和软糖小路。右侧或下方放可爱兔子、小鸡或糖果学习伙伴，表情软萌。画面中心上方生成奶油糖霜大标题“{标题内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，标题像翻糖蛋糕字，粉白渐变、白描边、带星星和糖霜高光。标题下方生成短副标题“{副标题内容根据课件真实内容填充，副标题不超过15个字，若为英语课件则尽量用英文，若非英文课件则一律用中文}”。中下方生成粉色或蜜桃色果冻胶囊按钮，按钮文字为“{进入游戏，按钮内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，按钮带白描边、糖果高光和小星星。\n\n4）封面接入顺序：先根据真实课件确认主标题、短副标题和进入文案，再依照上面的原版美术描述生成一张完整封面图；将它完整适配课件舞台，不裁掉文字、角色或按钮，也不把整张封面当作中间的小插图套进另一张封面。仅在封面容器内移除或隐藏源 HTML 的标题、副标题、示例插画和可见开始按钮，清理伪元素及 CSS 背景中重复的文字/按钮；主互动页的题干、选项、答案、控件和逻辑全部保留。不要因源课件原来使用 HTML 标题而继续保留第二套可见封面。\n5）透明点击层只承接进入事件，不绘制文字、图标、背景、边框、阴影或底座；可保留不可见的无障碍名称和键盘进入能力，不能将整张封面图设成透明。一次完整点击/触控只进入一次，不在 pointerdown 时提前撤掉封面；隔离本次手势，禁止继续触发下一页答案、拖拽或提交。进入第一题时仍为未作答状态。\n6）交付前同时核对封面原图与浏览器实际首屏：图中艺术标题、短副标题和设计按钮齐全且各一套，浏览器没有额外的可见 DOM/CSS 文字或按钮，点击任意位置可进入第一题。若有重复，修正 HTML 接入层；若图中文字错误，单独修正封面素材。不得用删掉艺术字、角色、按钮设计，换成空场景，或直接跳过封面的办法通过去重检查。\n\n3. 背景图规范与生图提示词逻辑\n1）背景图只用于提供风格氛围，不强行生成题目承载区域。题目白板、任务板、卡片、槽位、按钮和状态栏应由 HTML/CSS/JS 根据当前课件内容绘制，并覆盖在背景图上。背景图中不要生成框、白板、题板、任务板、玻璃板、卡片、按钮、标题、题目文字、选项文字、数字、字母、汉字、格线、槽位、logo、水印或二维码。\n2）背景图可以参考该风格 bg 图和 cover 图的视觉感觉自由延展，但只保留场景、色彩、材质、角色气质和边缘装饰；画面中心应保持开阔、低干扰，方便前端绘制适配当前题型的题板。\n3）本视觉风格背景图的生图提示词：\n3D粘土哑光糖果乐园背景，马卡龙粉、奶油黄、浅紫、薄荷绿，糖果城堡、棉花糖云、彩虹桥、棒棒糖、马卡龙、甜甜圈和软糖装饰放在边缘，整体甜美柔软。画面中心保持开阔的低纹理糖果世界背景，方便 HTML/CSS/JS 绘制题板。不要生成奶油框、任务板、卡片、按钮、标题、文字、糖果标签、logo、水印或二维码。\n\n4. 按钮、字体与触控规范\n按钮使用糖果胶囊、果冻圆角按钮或软糖按钮，带白描边、柔和高光和按压回弹。字体圆润可爱，但字母、数字、题干不能装饰化到难读。\n本课件面向小学低中高年级儿童，所有核心文字和可点击区域必须适合课堂投屏、互动屏和平板触控。题干、核心选项、按钮文字和状态数字要使用明显偏大的字号，普通提示文字也要清楚可读；主按钮、选项卡、拖拽块和槽位要有足够大的触碰面积和间距，儿童手指点击不容易误触。按钮必须有清楚边界、高对比文字、按压反馈和禁用态；不要把关键文字做得过小、过细、过浅或压在复杂纹理上。\n\n5. 色彩、材质与装饰密度\n色彩以奶油白、樱花粉、蜜桃粉、浅紫、薄荷绿、柠檬黄、天空蓝和柔和红为主。\n色彩只作为视觉方向，不在图片中显示任何色号、色卡编号、代码、CSS 文本或设计参数。整体保持明亮、干净、护眼，避免大面积深色、强霓虹、复杂渐变和高压迫背景。装饰密度必须低于学习内容，角色、花草、糖果、气泡、电话线、科技光线或海图道具只放在边缘、角落或低层背景，不得穿过题目、选项、槽位、网格、按钮和反馈区域。\n\n6. UI层级与反馈\n底层是风格化背景，只提供氛围；中层是主主题板和内部功能卡片，盖在背景图上，由html/CSS/JS 绘制适合本风格的题板区域，是最高信息承载层；上层是可拖拽对象、选项、按钮、反馈条和当前选中态；弹窗层用于结果、时间到或完成反馈，必须有遮罩或清楚的独立卡片，不能遮挡关键学习内容。\n正确反馈使用糖果星星、软糖弹起和绿色描边；错误反馈使用浅粉红边框和柔软回弹；选中态使用白描边和果冻上浮。\n所有反馈只强化原交互，不新增新玩法，不改变原题目判断逻辑。\n\n7. 音效反馈规范\n音效是 UI 反馈的一部分，必须优先匹配当前风格的专属音效；只用于强化点击、选中、拖拽、落位、提交、答对、答错、提示、完成和重置状态，不改变原课件玩法、题型、节奏和按钮功能。音效需短促、低音量、低干扰，不能循环播放，不能盖过教学语音；需遵守原课件已有静音和音量设置。若没有真实音频素材，可用平台素材库、安全音效或 WebAudio 近似实现，但仍要尽量贴近本风格音效意图。\n本风格音效：点击使用糖果轻碰声，按钮使用软糖弹跳声，答对使用甜美短铃和泡泡破裂声，答错使用柔软回弹声。\n\n8. 禁止项\n禁止生成无关实体、无关玩法、无关学科内容、伪文字、乱码、品牌名、公司名、水印、二维码、角标、设计参数、色值、代码、CSS 标注、软件界面说明、宣传语和不可编辑的题目内容。禁止遮挡、重绘、扭曲或弱化原题目、题板、格线、槽位、按钮和反馈状态。", "sectionsOld": ["请严格按“糖果乐园风 UI规范”重新生成同一课件界面。\n\n", "0. 原课件保留规则\n本风格只用于 UI 视觉换肤，不得改变原课件的学科、题型、题目内容、答案、素材数量、槽位数量、组件数量、布局关系、按钮功能、计分逻辑和交互流程。原来是英语看图拼词、填空、拖拽、选择、分类、连线、逻辑推理或其他玩法，换风格后仍保持原玩法和原题目结构。主互动题页中的题干、选项、答案、字母、汉字、拼音、数字、公式、倒计时、得分、按钮文案、反馈文案和关卡信息等可变教学内容，必须由 HTML/CSS/JS 渲染，不要烘焙进背景图或题板底图。\n\n", "1. 整体视觉与布局\n风格识别锚点：第一眼应像哑光粘土糖果世界。使用马卡龙粉、奶油黄、浅紫、薄荷绿、棉花糖圆角按钮、马卡龙道具、糖果装饰和可爱陪伴角色；中央互动区像柔软翻糖蛋糕或糖果托盘，甜美治愈但内容区必须干净，适合低龄英语、颜色形状和配对游戏。\n采用马卡龙糖果背景和中央奶油甜品题板。画面可以有糖果屋、棒棒糖、软云、甜甜圈、马卡龙、彩虹和果冻质感。整体高明度、甜美、柔软、低龄友好，不能过暗、过灰或变成普通玻璃卡片。\n使用横版课件画布，画布主体集中在中央学习区，四周保留安全边距。顶部保留原课件已有标题、关卡、进度、奖励、倒计时或得分信息；中央按原课件布局放置题目、图片区、网格、线索、选项、素材池、槽位或操作区；底部或右侧保留原有按钮和工具按钮。背景只提供氛围，不承担学习信息。\n\n", "2. 封面图规范与生图提示词逻辑\n1）封面图用于儿童互动课件首页。封面图本身必须生成主标题、副标题和进入按钮；副标题不得超过15个字，图上不生成任何额外文字、包括风格名、品牌名、logo、水印、二维码、角标、色值、尺寸标记、伪文字或无关宣传语都不允许生成。逻辑上，从封面图任意位置点击即可进入，禁止在封面图上再生成任何文字/按钮，只需要配置点击事件。\n2）主标题、副标题和按钮文案都是可变元素，必须根据当前课件真实内容替换；若为英语课件则尽量用英文，若非英语课件则一律用中文。标题、短副标题和进入按钮需要沿同一视觉主轴组织，层级清楚、可读性强，适合课堂投屏。\n3）本视觉风格封面的生图提示词：\n3D粘土哑光糖果乐园封面，马卡龙粉、奶油黄、浅紫和薄荷绿配色，背景有糖果城堡、棉花糖云、彩虹桥、棒棒糖、马卡龙、甜甜圈和软糖小路。右侧或下方放可爱兔子、小鸡或糖果学习伙伴，表情软萌。画面中心上方生成奶油糖霜大标题“{标题内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，标题像翻糖蛋糕字，粉白渐变、白描边、带星星和糖霜高光。标题下方生成短副标题“{副标题内容根据课件真实内容填充，副标题不超过15个字，若为英语课件则尽量用英文，若非英文课件则一律用中文}”。中下方生成粉色或蜜桃色果冻胶囊按钮，按钮文字为“{进入游戏，按钮内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，按钮带白描边、糖果高光和小星星。\n\n", "3. 背景图规范与生图提示词逻辑\n1）背景图只用于提供风格氛围，不强行生成题目承载区域。题目白板、任务板、卡片、槽位、按钮和状态栏应由 HTML/CSS/JS 根据当前课件内容绘制，并覆盖在背景图上。背景图中不要生成框、白板、题板、任务板、玻璃板、卡片、按钮、标题、题目文字、选项文字、数字、字母、汉字、格线、槽位、logo、水印或二维码。\n2）背景图可以参考该风格 bg 图和 cover 图的视觉感觉自由延展，但只保留场景、色彩、材质、角色气质和边缘装饰；画面中心应保持开阔、低干扰，方便前端绘制适配当前题型的题板。\n3）本视觉风格背景图的生图提示词：\n3D粘土哑光糖果乐园背景，马卡龙粉、奶油黄、浅紫、薄荷绿，糖果城堡、棉花糖云、彩虹桥、棒棒糖、马卡龙、甜甜圈和软糖装饰放在边缘，整体甜美柔软。画面中心保持开阔的低纹理糖果世界背景，方便 HTML/CSS/JS 绘制题板。不要生成奶油框、任务板、卡片、按钮、标题、文字、糖果标签、logo、水印或二维码。\n\n", "4. 按钮、字体与触控规范\n按钮使用糖果胶囊、果冻圆角按钮或软糖按钮，带白描边、柔和高光和按压回弹。字体圆润可爱，但字母、数字、题干不能装饰化到难读。\n本课件面向小学低中高年级儿童，所有核心文字和可点击区域必须适合课堂投屏、互动屏和平板触控。题干、核心选项、按钮文字和状态数字要使用明显偏大的字号，普通提示文字也要清楚可读；主按钮、选项卡、拖拽块和槽位要有足够大的触碰面积和间距，儿童手指点击不容易误触。按钮必须有清楚边界、高对比文字、按压反馈和禁用态；不要把关键文字做得过小、过细、过浅或压在复杂纹理上。\n\n", "5. 色彩、材质与装饰密度\n色彩以奶油白、樱花粉、蜜桃粉、浅紫、薄荷绿、柠檬黄、天空蓝和柔和红为主。\n色彩只作为视觉方向，不在图片中显示任何色号、色卡编号、代码、CSS 文本或设计参数。整体保持明亮、干净、护眼，避免大面积深色、强霓虹、复杂渐变和高压迫背景。装饰密度必须低于学习内容，角色、花草、糖果、气泡、电话线、科技光线或海图道具只放在边缘、角落或低层背景，不得穿过题目、选项、槽位、网格、按钮和反馈区域。\n\n", "6. UI层级与反馈\n底层是风格化背景，只提供氛围；中层是主主题板和内部功能卡片，盖在背景图上，由html/CSS/JS 绘制适合本风格的题板区域，是最高信息承载层；上层是可拖拽对象、选项、按钮、反馈条和当前选中态；弹窗层用于结果、时间到或完成反馈，必须有遮罩或清楚的独立卡片，不能遮挡关键学习内容。\n正确反馈使用糖果星星、软糖弹起和绿色描边；错误反馈使用浅粉红边框和柔软回弹；选中态使用白描边和果冻上浮。\n所有反馈只强化原交互，不新增新玩法，不改变原题目判断逻辑。\n\n", "7. 音效反馈规范\n音效是 UI 反馈的一部分，必须优先匹配当前风格的专属音效；只用于强化点击、选中、拖拽、落位、提交、答对、答错、提示、完成和重置状态，不改变原课件玩法、题型、节奏和按钮功能。音效需短促、低音量、低干扰，不能循环播放，不能盖过教学语音；需遵守原课件已有静音和音量设置。若没有真实音频素材，可用平台素材库、安全音效或 WebAudio 近似实现，但仍要尽量贴近本风格音效意图。\n本风格音效：点击使用糖果轻碰声，按钮使用软糖弹跳声，答对使用甜美短铃和泡泡破裂声，答错使用柔软回弹声。\n\n", "8. 禁止项\n禁止生成无关实体、无关玩法、无关学科内容、伪文字、乱码、品牌名、公司名、水印、二维码、角标、设计参数、色值、代码、CSS 标注、软件界面说明、宣传语和不可编辑的题目内容。禁止遮挡、重绘、扭曲或弱化原题目、题板、格线、槽位、按钮和反馈状态。"], "sectionsNew": ["请严格按“糖果乐园风 UI规范”重新生成同一课件界面。\n\n", "0. 原课件保留规则\n本风格只用于 UI 视觉换肤，不得改变原课件的学科、题型、题目内容、答案、素材数量、槽位数量、组件数量、布局关系、按钮功能、计分逻辑和交互流程。原来是英语看图拼词、填空、拖拽、选择、分类、连线、逻辑推理或其他玩法，换风格后仍保持原玩法和原题目结构。主互动题页中的题干、选项、答案、字母、汉字、拼音、数字、公式、倒计时、得分、按钮文案、反馈文案和关卡信息等可变教学内容，必须由 HTML/CSS/JS 渲染，不要烘焙进背景图或题板底图。\n\n", "1. 整体视觉与布局\n风格识别锚点：第一眼应像哑光粘土糖果世界。使用马卡龙粉、奶油黄、浅紫、薄荷绿、棉花糖圆角按钮、马卡龙道具、糖果装饰和可爱陪伴角色；中央互动区像柔软翻糖蛋糕或糖果托盘，甜美治愈但内容区必须干净，适合低龄英语、颜色形状和配对游戏。\n采用马卡龙糖果背景和中央奶油甜品题板。画面可以有糖果屋、棒棒糖、软云、甜甜圈、马卡龙、彩虹和果冻质感。整体高明度、甜美、柔软、低龄友好，不能过暗、过灰或变成普通玻璃卡片。\n使用横版课件画布，画布主体集中在中央学习区，四周保留安全边距。顶部保留原课件已有标题、关卡、进度、奖励、倒计时或得分信息；中央按原课件布局放置题目、图片区、网格、线索、选项、素材池、槽位或操作区；底部或右侧保留原有按钮和工具按钮。背景只提供氛围，不承担学习信息。\n\n", "2. 封面图规范与生图提示词逻辑\n【本节适用范围】第2节是完整封面设计，第3节是进入后的主互动页背景，两者必须分别生成、分别使用。封面继续执行本节第3项的原有美术描述，包括艺术字、角色、场景、材质、副标题载体和按钮设计；不得把它改成“空背景＋普通HTML标题按钮”。第3节的无文字、无按钮、中央留白要求，以及第4—6节的题板、标准正文字体、学习区低干扰规则，只约束主互动页，不得用来删减封面。除用户在本次调整中明确要求不要封面外，仍按原版规范生成完整图片式首页。\n\n1）封面图用于儿童互动课件首页。封面图本身必须生成主标题、副标题和进入按钮；副标题不得超过15个字，图上不生成任何额外文字、包括风格名、品牌名、logo、水印、二维码、角标、色值、尺寸标记、伪文字或无关宣传语都不允许生成。封面图中的主标题、副标题、按钮造型和按钮文字是最终可见内容，必须保留。HTML 不得在这张封面图上再次叠加可见标题、副标题、按钮、按钮文字或底座；只配置覆盖封面的透明点击层，点击封面任意位置进入原课件。这里禁止的是 HTML 重复叠加，不是禁止图片生成标题或按钮。\n2）主标题、副标题和按钮文案都是可变元素，必须根据当前课件真实内容替换；若为英语课件则尽量用英文，若非英语课件则一律用中文。标题、短副标题和进入按钮需要沿同一视觉主轴组织，层级清楚、可读性强，适合课堂投屏。\n3）本视觉风格封面的生图提示词：\n3D粘土哑光糖果乐园封面，马卡龙粉、奶油黄、浅紫和薄荷绿配色，背景有糖果城堡、棉花糖云、彩虹桥、棒棒糖、马卡龙、甜甜圈和软糖小路。右侧或下方放可爱兔子、小鸡或糖果学习伙伴，表情软萌。画面中心上方生成奶油糖霜大标题“{标题内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，标题像翻糖蛋糕字，粉白渐变、白描边、带星星和糖霜高光。标题下方生成短副标题“{副标题内容根据课件真实内容填充，副标题不超过15个字，若为英语课件则尽量用英文，若非英文课件则一律用中文}”。中下方生成粉色或蜜桃色果冻胶囊按钮，按钮文字为“{进入游戏，按钮内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，按钮带白描边、糖果高光和小星星。\n\n4）封面接入顺序：先根据真实课件确认主标题、短副标题和进入文案，再依照上面的原版美术描述生成一张完整封面图；将它完整适配课件舞台，不裁掉文字、角色或按钮，也不把整张封面当作中间的小插图套进另一张封面。仅在封面容器内移除或隐藏源 HTML 的标题、副标题、示例插画和可见开始按钮，清理伪元素及 CSS 背景中重复的文字/按钮；主互动页的题干、选项、答案、控件和逻辑全部保留。不要因源课件原来使用 HTML 标题而继续保留第二套可见封面。\n5）透明点击层只承接进入事件，不绘制文字、图标、背景、边框、阴影或底座；可保留不可见的无障碍名称和键盘进入能力，不能将整张封面图设成透明。一次完整点击/触控只进入一次，不在 pointerdown 时提前撤掉封面；隔离本次手势，禁止继续触发下一页答案、拖拽或提交。进入第一题时仍为未作答状态。\n6）交付前同时核对封面原图与浏览器实际首屏：图中艺术标题、短副标题和设计按钮齐全且各一套，浏览器没有额外的可见 DOM/CSS 文字或按钮，点击任意位置可进入第一题。若有重复，修正 HTML 接入层；若图中文字错误，单独修正封面素材。不得用删掉艺术字、角色、按钮设计，换成空场景，或直接跳过封面的办法通过去重检查。\n\n", "3. 背景图规范与生图提示词逻辑\n1）背景图只用于提供风格氛围，不强行生成题目承载区域。题目白板、任务板、卡片、槽位、按钮和状态栏应由 HTML/CSS/JS 根据当前课件内容绘制，并覆盖在背景图上。背景图中不要生成框、白板、题板、任务板、玻璃板、卡片、按钮、标题、题目文字、选项文字、数字、字母、汉字、格线、槽位、logo、水印或二维码。\n2）背景图可以参考该风格 bg 图和 cover 图的视觉感觉自由延展，但只保留场景、色彩、材质、角色气质和边缘装饰；画面中心应保持开阔、低干扰，方便前端绘制适配当前题型的题板。\n3）本视觉风格背景图的生图提示词：\n3D粘土哑光糖果乐园背景，马卡龙粉、奶油黄、浅紫、薄荷绿，糖果城堡、棉花糖云、彩虹桥、棒棒糖、马卡龙、甜甜圈和软糖装饰放在边缘，整体甜美柔软。画面中心保持开阔的低纹理糖果世界背景，方便 HTML/CSS/JS 绘制题板。不要生成奶油框、任务板、卡片、按钮、标题、文字、糖果标签、logo、水印或二维码。\n\n", "4. 按钮、字体与触控规范\n按钮使用糖果胶囊、果冻圆角按钮或软糖按钮，带白描边、柔和高光和按压回弹。字体圆润可爱，但字母、数字、题干不能装饰化到难读。\n本课件面向小学低中高年级儿童，所有核心文字和可点击区域必须适合课堂投屏、互动屏和平板触控。题干、核心选项、按钮文字和状态数字要使用明显偏大的字号，普通提示文字也要清楚可读；主按钮、选项卡、拖拽块和槽位要有足够大的触碰面积和间距，儿童手指点击不容易误触。按钮必须有清楚边界、高对比文字、按压反馈和禁用态；不要把关键文字做得过小、过细、过浅或压在复杂纹理上。\n\n", "5. 色彩、材质与装饰密度\n色彩以奶油白、樱花粉、蜜桃粉、浅紫、薄荷绿、柠檬黄、天空蓝和柔和红为主。\n色彩只作为视觉方向，不在图片中显示任何色号、色卡编号、代码、CSS 文本或设计参数。整体保持明亮、干净、护眼，避免大面积深色、强霓虹、复杂渐变和高压迫背景。装饰密度必须低于学习内容，角色、花草、糖果、气泡、电话线、科技光线或海图道具只放在边缘、角落或低层背景，不得穿过题目、选项、槽位、网格、按钮和反馈区域。\n\n", "6. UI层级与反馈\n底层是风格化背景，只提供氛围；中层是主主题板和内部功能卡片，盖在背景图上，由html/CSS/JS 绘制适合本风格的题板区域，是最高信息承载层；上层是可拖拽对象、选项、按钮、反馈条和当前选中态；弹窗层用于结果、时间到或完成反馈，必须有遮罩或清楚的独立卡片，不能遮挡关键学习内容。\n正确反馈使用糖果星星、软糖弹起和绿色描边；错误反馈使用浅粉红边框和柔软回弹；选中态使用白描边和果冻上浮。\n所有反馈只强化原交互，不新增新玩法，不改变原题目判断逻辑。\n\n", "7. 音效反馈规范\n音效是 UI 反馈的一部分，必须优先匹配当前风格的专属音效；只用于强化点击、选中、拖拽、落位、提交、答对、答错、提示、完成和重置状态，不改变原课件玩法、题型、节奏和按钮功能。音效需短促、低音量、低干扰，不能循环播放，不能盖过教学语音；需遵守原课件已有静音和音量设置。若没有真实音频素材，可用平台素材库、安全音效或 WebAudio 近似实现，但仍要尽量贴近本风格音效意图。\n本风格音效：点击使用糖果轻碰声，按钮使用软糖弹跳声，答对使用甜美短铃和泡泡破裂声，答错使用柔软回弹声。\n\n", "8. 禁止项\n禁止生成无关实体、无关玩法、无关学科内容、伪文字、乱码、品牌名、公司名、水印、二维码、角标、设计参数、色值、代码、CSS 标注、软件界面说明、宣传语和不可编辑的题目内容。禁止遮挡、重绘、扭曲或弱化原题目、题板、格线、槽位、按钮和反馈状态。"], "section2": 3, "blocks": [{"kind": ": "ocean_clay", "displayName": "软萌海底风", "caseId": "S15", "promptText": "请严格按“软萌海底风 UI规范”重新生成同一课件界面。\n\n0. 原课件保留规则\n本风格只用于 UI 视觉换肤，不得改变原课件的学科、题型、题目内容、答案、素材数量、槽位数量、组件数量、布局关系、按钮功能、计分逻辑和交互流程。原来是英语看图拼词、填空、拖拽、选择、分类、连线、逻辑推理或其他玩法，换风格后仍保持原玩法和原题目结构。主互动题页中的题干、选项、答案、字母、汉字、拼音、数字、公式、倒计时、得分、按钮文案、反馈文案和关卡信息等可变教学内容，必须由 HTML/CSS/JS 渲染，不要烘焙进背景图或题板底图。\n\n1. 整体视觉与布局\n风格识别锚点：第一眼应像哑光粘土海底课堂。使用浅蓝沙地、珊瑚蓝背景、贝壳、海星、珍珠、小鱼、海龟和白色圆角任务卡；整体清爽护眼，物体圆润膨胀，海底装饰低密度放在边缘，中央题板保持干净。\n采用浅蓝海底玩具背景和中央圆润任务卡。画面可以有软萌小鱼、贝壳、海星、珊瑚、珍珠和气泡，材质更像儿童玩具与果冻。主板必须居中、边距均衡，海底装饰不能挤压题板。\n使用横版课件画布，画布主体集中在中央学习区，四周保留安全边距。顶部保留原课件已有标题、关卡、进度、奖励、倒计时或得分信息；中央按原课件布局放置题目、图片区、网格、线索、选项、素材池、槽位或操作区；底部或右侧保留原有按钮和工具按钮。背景只提供氛围，不承担学习信息。\n\n2. 封面图规范与生图提示词逻辑\n【本节适用范围】第2节是完整封面设计，第3节是进入后的主互动页背景，两者必须分别生成、分别使用。封面继续执行本节第3项的原有美术描述，包括艺术字、角色、场景、材质、副标题载体和按钮设计；不得把它改成“空背景＋普通HTML标题按钮”。第3节的无文字、无按钮、中央留白要求，以及第4—6节的题板、标准正文字体、学习区低干扰规则，只约束主互动页，不得用来删减封面。除用户在本次调整中明确要求不要封面外，仍按原版规范生成完整图片式首页。\n\n1）封面图用于儿童互动课件首页。封面图本身必须生成主标题、副标题和进入按钮；副标题不得超过15个字，图上不生成任何额外文字、包括风格名、品牌名、logo、水印、二维码、角标、色值、尺寸标记、伪文字或无关宣传语都不允许生成。封面图中的主标题、副标题、按钮造型和按钮文字是最终可见内容，必须保留。HTML 不得在这张封面图上再次叠加可见标题、副标题、按钮、按钮文字或底座；只配置覆盖封面的透明点击层，点击封面任意位置进入原课件。这里禁止的是 HTML 重复叠加，不是禁止图片生成标题或按钮。\n2）主标题、副标题和按钮文案都是可变元素，必须根据当前课件真实内容替换；若为英语课件则尽量用英文，若非英语课件则一律用中文。标题、短副标题和进入按钮需要沿同一视觉主轴组织，层级清楚、可读性强，适合课堂投屏。\n3）本视觉风格封面的生图提示词：\n3D粘土哑光软萌海底封面，浅蓝沙地、珊瑚蓝墙面、水面光束、珊瑚、贝壳、珍珠、海星、小鱼和海龟角色，整体清爽护眼。画面中心上方生成白蓝泡泡质感大标题“{标题内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，标题带贝壳、海星和珍珠装饰。标题下方生成短副标题“{副标题内容根据课件真实内容填充，副标题不超过15个字，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，放在浅蓝水波丝带里。中下方生成黄色圆润胶囊按钮，按钮文字为“{进入，按钮内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，按钮带珍珠高光和柔和阴影。\n\n4）封面接入顺序：先根据真实课件确认主标题、短副标题和进入文案，再依照上面的原版美术描述生成一张完整封面图；将它完整适配课件舞台，不裁掉文字、角色或按钮，也不把整张封面当作中间的小插图套进另一张封面。仅在封面容器内移除或隐藏源 HTML 的标题、副标题、示例插画和可见开始按钮，清理伪元素及 CSS 背景中重复的文字/按钮；主互动页的题干、选项、答案、控件和逻辑全部保留。不要因源课件原来使用 HTML 标题而继续保留第二套可见封面。\n5）透明点击层只承接进入事件，不绘制文字、图标、背景、边框、阴影或底座；可保留不可见的无障碍名称和键盘进入能力，不能将整张封面图设成透明。一次完整点击/触控只进入一次，不在 pointerdown 时提前撤掉封面；隔离本次手势，禁止继续触发下一页答案、拖拽或提交。进入第一题时仍为未作答状态。\n6）交付前同时核对封面原图与浏览器实际首屏：图中艺术标题、短副标题和设计按钮齐全且各一套，浏览器没有额外的可见 DOM/CSS 文字或按钮，点击任意位置可进入第一题。若有重复，修正 HTML 接入层；若图中文字错误，单独修正封面素材。不得用删掉艺术字、角色、按钮设计，换成空场景，或直接跳过封面的办法通过去重检查。\n\n3. 背景图规范与生图提示词逻辑\n1）背景图只用于提供风格氛围，不强行生成题目承载区域。题目白板、任务板、卡片、槽位、按钮和状态栏应由 HTML/CSS/JS 根据当前课件内容绘制，并覆盖在背景图上。背景图中不要生成框、白板、题板、任务板、玻璃板、卡片、按钮、标题、题目文字、选项文字、数字、字母、汉字、格线、槽位、logo、水印或二维码。\n2）背景图可以参考该风格 bg 图和 cover 图的视觉感觉自由延展，但只保留场景、色彩、材质、角色气质和边缘装饰；画面中心应保持开阔、低干扰，方便前端绘制适配当前题型的题板。\n3）本视觉风格背景图的生图提示词：\n3D粘土哑光软萌海底背景，浅蓝海水、沙地、珊瑚、贝壳、珍珠、海星、小鱼和海龟角色分布在画面边缘，物体圆润膨胀、低干扰。画面中心保持开阔清爽的海底空间，方便 HTML/CSS/JS 绘制任务题板。不要生成白色任务卡片、水波框、按钮、标题、文字、图标、logo、水印或二维码。\n\n4. 按钮、字体与触控规范\n按钮使用贝壳、珍珠或水滴形圆润按钮，状态按钮和工具按钮必须在主板安全区内。字体圆润、厚实、清楚，不能被水泡和透明质感削弱。\n本课件面向小学低中高年级儿童，所有核心文字和可点击区域必须适合课堂投屏、互动屏和平板触控。题干、核心选项、按钮文字和状态数字要使用明显偏大的字号，普通提示文字也要清楚可读；主按钮、选项卡、拖拽块和槽位要有足够大的触碰面积和间距，儿童手指点击不容易误触。按钮必须有清楚边界、高对比文字、按压反馈和禁用态；不要把关键文字做得过小、过细、过浅或压在复杂纹理上。\n\n5. 色彩、材质与装饰密度\n色彩以浅蓝、珍珠白、珊瑚粉、贝壳黄、薄荷绿、海星橙和柔和红为主。\n色彩只作为视觉方向，不在图片中显示任何色号、色卡编号、代码、CSS 文本或设计参数。整体保持明亮、干净、护眼，避免大面积深色、强霓虹、复杂渐变和高压迫背景。装饰密度必须低于学习内容，角色、花草、糖果、气泡、电话线、科技光线或海图道具只放在边缘、角落或低层背景，不得穿过题目、选项、槽位、网格、按钮和反馈区域。\n\n6. UI层级与反馈\n底层是风格化背景，只提供氛围；中层是主主题板和内部功能卡片，盖在背景图上，由html/CSS/JS 绘制适合本风格的题板区域，是最高信息承载层；上层是可拖拽对象、选项、按钮、反馈条和当前选中态；弹窗层用于结果、时间到或完成反馈，必须有遮罩或清楚的独立卡片，不能遮挡关键学习内容。\n正确反馈使用珍珠闪烁、小气泡和绿色描边；错误反馈使用柔和珊瑚边框；选中态使用水泡光圈和卡片轻浮。\n所有反馈只强化原交互，不新增新玩法，不改变原题目判断逻辑。\n\n7. 音效反馈规范\n音效是 UI 反馈的一部分，必须优先匹配当前风格的专属音效；只用于强化点击、选中、拖拽、落位、提交、答对、答错、提示、完成和重置状态，不改变原课件玩法、题型、节奏和按钮功能。音效需短促、低音量、低干扰，不能循环播放，不能盖过教学语音；需遵守原课件已有静音和音量设置。若没有真实音频素材，可用平台素材库、安全音效或 WebAudio 近似实现，但仍要尽量贴近本风格音效意图。\n本风格音效：点击使用软水泡声，选中使用贝壳轻碰声，答对使用连续小气泡和珍珠闪烁音，答错使用柔和水波回弹声。\n\n8. 禁止项\n禁止生成无关实体、无关玩法、无关学科内容、伪文字、乱码、品牌名、公司名、水印、二维码、角标、设计参数、色值、代码、CSS 标注、软件界面说明、宣传语和不可编辑的题目内容。禁止遮挡、重绘、扭曲或弱化原题目、题板、格线、槽位、按钮和反馈状态。", "basePromptSHA256": "c5d79aa231d37590ac36c4726939a0e7c3e652153a45bae06f999e592c7392a5", "promptSHA256": "bf2ed4f73958ca1a92cb5c723dda5dacb239e5b23726be8b4e8436e9b0a8ef0f", "status": "候选待生成验证", "changeScope": "仅第2节：图片封面与HTML职责分离；原有封面美术描述逐字保留", "kind": "base", "old": "请严格按“软萌海底风 UI规范”重新生成同一课件界面。\n\n0. 原课件保留规则\n本风格只用于 UI 视觉换肤，不得改变原课件的学科、题型、题目内容、答案、素材数量、槽位数量、组件数量、布局关系、按钮功能、计分逻辑和交互流程。原来是英语看图拼词、填空、拖拽、选择、分类、连 的题板区域，是最高信息承载层；上层是可拖拽对象、选项、按钮、反馈条和当前选中态；弹窗层用于结果、时间到或完成反馈，必须有遮罩或清楚的独立卡片，不能遮挡关键学习内容。\n正确反馈使用珍珠闪烁、小气泡和绿色描边；错误反馈使用柔和珊瑚边框；选中态使用水泡光圈和卡片轻浮。\n所有反馈只强化原交互，不新增新玩法，不改变原题目判断逻辑。\n\n7. 音效反馈规范\n音效是 UI 反馈的一部分，必须优先匹配当前风格的专属音效；只用于强化点击、选中、拖拽、落位、提交、答对、答错、提示、完成和重置状态，不改变原课件玩法、题型、节奏和按钮功能。音效需短促、低音量、低干扰，不能循环播放，不能盖过教学语音；需遵守原课件已有静音和音量设置。若没有真实音频素材，可用平台素材库、安全音效或 WebAudio 近似实现，但仍要尽量贴近本风格音效意图。\n本风格音效：点击使用软水泡声，选中使用贝壳轻碰声，答对使用连续小气泡和珍珠闪烁音，答错使用柔和水波回弹声。\n\n8. 禁止项\n禁止生成无关实体、无关玩法、无关学科内容、伪文字、乱码、品牌名、公司名、水印、二维码、角标、设计参数、色值、代码、CSS 标注、软件界面说明、宣传语和不可编辑的题目内容。禁止遮挡、重绘、扭曲或弱化原题目、题板、格线、槽位、按钮和反馈状态。", "new": "请严格按“软萌海底风 UI规范”重新生成同一课件界面。\n\n0. 原课件保留规则\n本风格只用于 UI 视觉换肤，不得改变原课件的学科、题型、题目内容、答案、素材数量、槽位数量、组件数量、布局关系、按钮功能、计分逻辑和交互流程。原来是英语看图拼词、填空、拖拽、选择、分类、连线、逻辑推理或其他玩法，换风格后仍保持原玩法和原题目结构。主互动题页中的题干、选项、答案、字母、汉字、拼音、数字、公式、倒计时、得分、按钮文案、反馈文案和关卡信息等可变教学内容，必须由 HTML/CSS/JS 渲染，不要烘焙进背景图或题板底图。\n\n1. 整体视觉与布局\n风格识别锚点：第一眼应像哑光粘土海底课堂。使用浅蓝沙地、珊瑚蓝背景、贝壳、海星、珍珠、小鱼、海龟和白色圆角任务卡；整体清爽护眼，物体圆润膨胀，海底装饰低密度放在边缘，中央题板保持干净。\n采用浅蓝海底玩具背景和中央圆润任务卡。画面可以有软萌小鱼、贝壳、海星、珊瑚、珍珠和气泡，材质更像儿童玩具与果冻。主板必须居中、边距均衡，海底装饰不能挤压题板。\n使用横版课件画布，画布主体集中在中央学习区，四周保留安全边距。顶部保留原课件已有标题、关卡、进度、奖励、倒计时或得分信息；中央按原课件布局放置题目、图片区、网格、线索、选项、素材池、槽位或操作区；底部或右侧保留原有按钮和工具按钮。背景只提供氛围，不承担学习信息。\n\n2. 封面图规范与生图提示词逻辑\n【本节适用范围】第2节是完整封面设计，第3节是进入后的主互动页背景，两者必须分别生成、分别使用。封面继续执行本节第3项的原有美术描述，包括艺术字、角色、场景、材质、副标题载体和按钮设计；不得把它改成“空背景＋普通HTML标题按钮”。第3节的无文字、无按钮、中央留白要求，以及第4—6节的题板、标准正文字体、学习区低干扰规则，只约束主互动页，不得用来删减封面。除用户在本次调整中明确要求不要封面外，仍按原版规范生成完整图片式首页。\n\n1）封面图用于儿童互动课件首页。封面图本身必须生成主标题、副标题和进入按钮；副标题不得超过15个字，图上不生成任何额外文字、包括风格名、品牌名、logo、水印、二维码、角标、色值、尺寸标记、伪文字或无关宣传语都不允许生成。封面图中的主标题、副标题、按钮造型和按钮文字是最终可见内容，必须保留。HTML 不得在这张封面图上再次叠加可见标题、副标题、按钮、按钮文字或底座；只配置覆盖封面的透明点击层，点击封面任意位置进入原课件。这里禁止的是 HTML 重复叠加，不是禁止图片生成标题或按钮。\n2）主标题、副标题和按钮文案都是可变元素，必须根据当前课件真实内容替换；若为英语课件则尽量用英文，若非英语课件则一律用中文。标题、短副标题和进入按钮需要沿同一视觉主轴组织，层级清楚、可读性强，适合课堂投屏。\n3）本视觉风格封面的生图提示词：\n3D粘土哑光软萌海底封面，浅蓝沙地、珊瑚蓝墙面、水面光束、珊瑚、贝壳、珍珠、海星、小鱼和海龟角色，整体清爽护眼。画面中心上方生成白蓝泡泡质感大标题“{标题内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，标题带贝壳、海星和珍珠装饰。标题下方生成短副标题“{副标题内容根据课件真实内容填充，副标题不超过15个字，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，放在浅蓝水波丝带里。中下方生成黄色圆润胶囊按钮，按钮文字为“{进入，按钮内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，按钮带珍珠高光和柔和阴影。\n\n4）封面接入顺序：先根据真实课件确认主标题、短副标题和进入文案，再依照上面的原版美术描述生成一张完整封面图；将它完整适配课件舞台，不裁掉文字、角色或按钮，也不把整张封面当作中间的小插图套进另一张封面。仅在封面容器内移除或隐藏源 HTML 的标题、副标题、示例插画和可见开始按钮，清理伪元素及 CSS 背景中重复的文字/按钮；主互动页的题干、选项、答案、控件和逻辑全部保留。不要因源课件原来使用 HTML 标题而继续保留第二套可见封面。\n5）透明点击层只承接进入事件，不绘制文字、图标、背景、边框、阴影或底座；可保留不可见的无障碍名称和键盘进入能力，不能将整张封面图设成透明。一次完整点击/触控只进入一次，不在 pointerdown 时提前撤掉封面；隔离本次手势，禁止继续触发下一页答案、拖拽或提交。进入第一题时仍为未作答状态。\n6）交付前同时核对封面原图与浏览器实际首屏：图中艺术标题、短副标题和设计按钮齐全且各一套，浏览器没有额外的可见 DOM/CSS 文字或按钮，点击任意位置可进入第一题。若有重复，修正 HTML 接入层；若图中文字错误，单独修正封面素材。不得用删掉艺术字、角色、按钮设计，换成空场景，或直接跳过封面的办法通过去重检查。\n\n3. 背景图规范与生图提示词逻辑\n1）背景图只用于提供风格氛围，不强行生成题目承载区域。题目白板、任务板、卡片、槽位、按钮和状态栏应由 HTML/CSS/JS 根据当前课件内容绘制，并覆盖在背景图上。背景图中不要生成框、白板、题板、任务板、玻璃板、卡片、按钮、标题、题目文字、选项文字、数字、字母、汉字、格线、槽位、logo、水印或二维码。\n2）背景图可以参考该风格 bg 图和 cover 图的视觉感觉自由延展，但只保留场景、色彩、材质、角色气质和边缘装饰；画面中心应保持开阔、低干扰，方便前端绘制适配当前题型的题板。\n3）本视觉风格背景图的生图提示词：\n3D粘土哑光软萌海底背景，浅蓝海水、沙地、珊瑚、贝壳、珍珠、海星、小鱼和海龟角色分布在画面边缘，物体圆润膨胀、低干扰。画面中心保持开阔清爽的海底空间，方便 HTML/CSS/JS 绘制任务题板。不要生成白色任务卡片、水波框、按钮、标题、文字、图标、logo、水印或二维码。\n\n4. 按钮、字体与触控规范\n按钮使用贝壳、珍珠或水滴形圆润按钮，状态按钮和工具按钮必须在主板安全区内。字体圆润、厚实、清楚，不能被水泡和透明质感削弱。\n本课件面向小学低中高年级儿童，所有核心文字和可点击区域必须适合课堂投屏、互动屏和平板触控。题干、核心选项、按钮文字和状态数字要使用明显偏大的字号，普通提示文字也要清楚可读；主按钮、选项卡、拖拽块和槽位要有足够大的触碰面积和间距，儿童手指点击不容易误触。按钮必须有清楚边界、高对比文字、按压反馈和禁用态；不要把关键文字做得过小、过细、过浅或压在复杂纹理上。\n\n5. 色彩、材质与装饰密度\n色彩以浅蓝、珍珠白、珊瑚粉、贝壳黄、薄荷绿、海星橙和柔和红为主。\n色彩只作为视觉方向，不在图片中显示任何色号、色卡编号、代码、CSS 文本或设计参数。整体保持明亮、干净、护眼，避免大面积深色、强霓虹、复杂渐变和高压迫背景。装饰密度必须低于学习内容，角色、花草、糖果、气泡、电话线、科技光线或海图道具只放在边缘、角落或低层背景，不得穿过题目、选项、槽位、网格、按钮和反馈区域。\n\n6. UI层级与反馈\n底层是风格化背景，只提供氛围；中层是主主题板和内部功能卡片，盖在背景图上，由html/CSS/JS 绘制适合本风格的题板区域，是最高信息承载层；上层是可拖拽对象、选项、按钮、反馈条和当前选中态；弹窗层用于结果、时间到或完成反馈，必须有遮罩或清楚的独立卡片，不能遮挡关键学习内容。\n正确反馈使用珍珠闪烁、小气泡和绿色描边；错误反馈使用柔和珊瑚边框；选中态使用水泡光圈和卡片轻浮。\n所有反馈只强化原交互，不新增新玩法，不改变原题目判断逻辑。\n\n7. 音效反馈规范\n音效是 UI 反馈的一部分，必须优先匹配当前风格的专属音效；只用于强化点击、选中、拖拽、落位、提交、答对、答错、提示、完成和重置状态，不改变原课件玩法、题型、节奏和按钮功能。音效需短促、低音量、低干扰，不能循环播放，不能盖过教学语音；需遵守原课件已有静音和音量设置。若没有真实音频素材，可用平台素材库、安全音效或 WebAudio 近似实现，但仍要尽量贴近本风格音效意图。\n本风格音效：点击使用软水泡声，选中使用贝壳轻碰声，答对使用连续小气泡和珍珠闪烁音，答错使用柔和水波回弹声。\n\n8. 禁止项\n禁止生成无关实体、无关玩法、无关学科内容、伪文字、乱码、品牌名、公司名、水印、二维码、角标、设计参数、色值、代码、CSS 标注、软件界面说明、宣传语和不可编辑的题目内容。禁止遮挡、重绘、扭曲或弱化原题目、题板、格线、槽位、按钮和反馈状态。", "sectionsOld": ["请严格按“软萌海底风 UI规范”重新生成同一课件界面。\n\n", "0. 原课件保留规则\n本风格只用于 UI 视觉换肤，不得改变原课件的学科、题型、题目内容、答案、素材数量、槽位数量、组件数量、布局关系、按钮功能、计分逻辑和交互流程。原来是英语看图拼词、填空、拖拽、选择、分类、连线、逻辑推理或其他玩法，换风格后仍保持原玩法和原题目结构。主互动题页中的题干、选项、答案、字母、汉字、拼音、数字、公式、倒计时、得分、按钮文案、反馈文案和关卡信息等可变教学内容，必须由 HTML/CSS/JS 渲染，不要烘焙进背景图或题板底图。\n\n", "1. 整体视觉与布局\n风格识别锚点：第一眼应像哑光粘土海底课堂。使用浅蓝沙地、珊瑚蓝背景、贝壳、海星、珍珠、小鱼、海龟和白色圆角任务卡；整体清爽护眼，物体圆润膨胀，海底装饰低密度放在边缘，中央题板保持干净。\n采用浅蓝海底玩具背景和中央圆润任务卡。画面可以有软萌小鱼、贝壳、海星、珊瑚、珍珠和气泡，材质更像儿童玩具与果冻。主板必须居中、边距均衡，海底装饰不能挤压题板。\n使用横版课件画布，画布主体集中在中央学习区，四周保留安全边距。顶部保留原课件已有标题、关卡、进度、奖励、倒计时或得分信息；中央按原课件布局放置题目、图片区、网格、线索、选项、素材池、槽位或操作区；底部或右侧保留原有按钮和工具按钮。背景只提供氛围，不承担学习信息。\n\n", "2. 封面图规范与生图提示词逻辑\n1）封面图用于儿童互动课件首页。封面图本身必须生成主标题、副标题和进入按钮；副标题不得超过15个字，图上不生成任何额外文字、包括风格名、品牌名、logo、水印、二维码、角标、色值、尺寸标记、伪文字或无关宣传语都不允许生成。逻辑上，从封面图任意位置点击即可进入，禁止在封面图上再生成任何文字/按钮，只需要配置点击事件。\n2）主标题、副标题和按钮文案都是可变元素，必须根据当前课件真实内容替换；若为英语课件则尽量用英文，若非英语课件则一律用中文。标题、短副标题和进入按钮需要沿同一视觉主轴组织，层级清楚、可读性强，适合课堂投屏。\n3）本视觉风格封面的生图提示词：\n3D粘土哑光软萌海底封面，浅蓝沙地、珊瑚蓝墙面、水面光束、珊瑚、贝壳、珍珠、海星、小鱼和海龟角色，整体清爽护眼。画面中心上方生成白蓝泡泡质感大标题“{标题内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，标题带贝壳、海星和珍珠装饰。标题下方生成短副标题“{副标题内容根据课件真实内容填充，副标题不超过15个字，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，放在浅蓝水波丝带里。中下方生成黄色圆润胶囊按钮，按钮文字为“{进入，按钮内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，按钮带珍珠高光和柔和阴影。\n\n", "3. 背景图规范与生图提示词逻辑\n1）背景图只用于提供风格氛围，不强行生成题目承载区域。题目白板、任务板、卡片、槽位、按钮和状态栏应由 HTML/CSS/JS 根据当前课件内容绘制，并覆盖在背景图上。背景图中不要生成框、白板、题板、任务板、玻璃板、卡片、按钮、标题、题目文字、选项文字、数字、字母、汉字、格线、槽位、logo、水印或二维码。\n2）背景图可以参考该风格 bg 图和 cover 图的视觉感觉自由延展，但只保留场景、色彩、材质、角色气质和边缘装饰；画面中心应保持开阔、低干扰，方便前端绘制适配当前题型的题板。\n3）本视觉风格背景图的生图提示词：\n3D粘土哑光软萌海底背景，浅蓝海水、沙地、珊瑚、贝壳、珍珠、海星、小鱼和海龟角色分布在画面边缘，物体圆润膨胀、低干扰。画面中心保持开阔清爽的海底空间，方便 HTML/CSS/JS 绘制任务题板。不要生成白色任务卡片、水波框、按钮、标题、文字、图标、logo、水印或二维码。\n\n", "4. 按钮、字体与触控规范\n按钮使用贝壳、珍珠或水滴形圆润按钮，状态按钮和工具按钮必须在主板安全区内。字体圆润、厚实、清楚，不能被水泡和透明质感削弱。\n本课件面向小学低中高年级儿童，所有核心文字和可点击区域必须适合课堂投屏、互动屏和平板触控。题干、核心选项、按钮文字和状态数字要使用明显偏大的字号，普通提示文字也要清楚可读；主按钮、选项卡、拖拽块和槽位要有足够大的触碰面积和间距，儿童手指点击不容易误触。按钮必须有清楚边界、高对比文字、按压反馈和禁用态；不要把关键文字做得过小、过细、过浅或压在复杂纹理上。\n\n", "5. 色彩、材质与装饰密度\n色彩以浅蓝、珍珠白、珊瑚粉、贝壳黄、薄荷绿、海星橙和柔和红为主。\n色彩只作为视觉方向，不在图片中显示任何色号、色卡编号、代码、CSS 文本或设计参数。整体保持明亮、干净、护眼，避免大面积深色、强霓虹、复杂渐变和高压迫背景。装饰密度必须低于学习内容，角色、花草、糖果、气泡、电话线、科技光线或海图道具只放在边缘、角落或低层背景，不得穿过题目、选项、槽位、网格、按钮和反馈区域。\n\n", "6. UI层级与反馈\n底层是风格化背景，只提供氛围；中层是主主题板和内部功能卡片，盖在背景图上，由html/CSS/JS 绘制适合本风格的题板区域，是最高信息承载层；上层是可拖拽对象、选项、按钮、反馈条和当前选中态；弹窗层用于结果、时间到或完成反馈，必须有遮罩或清楚的独立卡片，不能遮挡关键学习内容。\n正确反馈使用珍珠闪烁、小气泡和绿色描边；错误反馈使用柔和珊瑚边框；选中态使用水泡光圈和卡片轻浮。\n所有反馈只强化原交互，不新增新玩法，不改变原题目判断逻辑。\n\n", "7. 音效反馈规范\n音效是 UI 反馈的一部分，必须优先匹配当前风格的专属音效；只用于强化点击、选中、拖拽、落位、提交、答对、答错、提示、完成和重置状态，不改变原课件玩法、题型、节奏和按钮功能。音效需短促、低音量、低干扰，不能循环播放，不能盖过教学语音；需遵守原课件已有静音和音量设置。若没有真实音频素材，可用平台素材库、安全音效或 WebAudio 近似实现，但仍要尽量贴近本风格音效意图。\n本风格音效：点击使用软水泡声，选中使用贝壳轻碰声，答对使用连续小气泡和珍珠闪烁音，答错使用柔和水波回弹声。\n\n", "8. 禁止项\n禁止生成无关实体、无关玩法、无关学科内容、伪文字、乱码、品牌名、公司名、水印、二维码、角标、设计参数、色值、代码、CSS 标注、软件界面说明、宣传语和不可编辑的题目内容。禁止遮挡、重绘、扭曲或弱化原题目、题板、格线、槽位、按钮和反馈状态。"], "sectionsNew": ["请严格按“软萌海底风 UI规范”重新生成同一课件界面。\n\n", "0. 原课件保留规则\n本风格只用于 UI 视觉换肤，不得改变原课件的学科、题型、题目内容、答案、素材数量、槽位数量、组件数量、布局关系、按钮功能、计分逻辑和交互流程。原来是英语看图拼词、填空、拖拽、选择、分类、连线、逻辑推理或其他玩法，换风格后仍保持原玩法和原题目结构。主互动题页中的题干、选项、答案、字母、汉字、拼音、数字、公式、倒计时、得分、按钮文案、反馈文案和关卡信息等可变教学内容，必须由 HTML/CSS/JS 渲染，不要烘焙进背景图或题板底图。\n\n", "1. 整体视觉与布局\n风格识别锚点：第一眼应像哑光粘土海底课堂。使用浅蓝沙地、珊瑚蓝背景、贝壳、海星、珍珠、小鱼、海龟和白色圆角任务卡；整体清爽护眼，物体圆润膨胀，海底装饰低密度放在边缘，中央题板保持干净。\n采用浅蓝海底玩具背景和中央圆润任务卡。画面可以有软萌小鱼、贝壳、海星、珊瑚、珍珠和气泡，材质更像儿童玩具与果冻。主板必须居中、边距均衡，海底装饰不能挤压题板。\n使用横版课件画布，画布主体集中在中央学习区，四周保留安全边距。顶部保留原课件已有标题、关卡、进度、奖励、倒计时或得分信息；中央按原课件布局放置题目、图片区、网格、线索、选项、素材池、槽位或操作区；底部或右侧保留原有按钮和工具按钮。背景只提供氛围，不承担学习信息。\n\n", "2. 封面图规范与生图提示词逻辑\n【本节适用范围】第2节是完整封面设计，第3节是进入后的主互动页背景，两者必须分别生成、分别使用。封面继续执行本节第3项的原有美术描述，包括艺术字、角色、场景、材质、副标题载体和按钮设计；不得把它改成“空背景＋普通HTML标题按钮”。第3节的无文字、无按钮、中央留白要求，以及第4—6节的题板、标准正文字体、学习区低干扰规则，只约束主互动页，不得用来删减封面。除用户在本次调整中明确要求不要封面外，仍按原版规范生成完整图片式首页。\n\n1）封面图用于儿童互动课件首页。封面图本身必须生成主标题、副标题和进入按钮；副标题不得超过15个字，图上不生成任何额外文字、包括风格名、品牌名、logo、水印、二维码、角标、色值、尺寸标记、伪文字或无关宣传语都不允许生成。封面图中的主标题、副标题、按钮造型和按钮文字是最终可见内容，必须保留。HTML 不得在这张封面图上再次叠加可见标题、副标题、按钮、按钮文字或底座；只配置覆盖封面的透明点击层，点击封面任意位置进入原课件。这里禁止的是 HTML 重复叠加，不是禁止图片生成标题或按钮。\n2）主标题、副标题和按钮文案都是可变元素，必须根据当前课件真实内容替换；若为英语课件则尽量用英文，若非英语课件则一律用中文。标题、短副标题和进入按钮需要沿同一视觉主轴组织，层级清楚、可读性强，适合课堂投屏。\n3）本视觉风格封面的生图提示词：\n3D粘土哑光软萌海底封面，浅蓝沙地、珊瑚蓝墙面、水面光束、珊瑚、贝壳、珍珠、海星、小鱼和海龟角色，整体清爽护眼。画面中心上方生成白蓝泡泡质感大标题“{标题内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，标题带贝壳、海星和珍珠装饰。标题下方生成短副标题“{副标题内容根据课件真实内容填充，副标题不超过15个字，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，放在浅蓝水波丝带里。中下方生成黄色圆润胶囊按钮，按钮文字为“{进入，按钮内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，按钮带珍珠高光和柔和阴影。\n\n4）封面接入顺序：先根据真实课件确认主标题、短副标题和进入文案，再依照上面的原版美术描述生成一张完整封面图；将它完整适配课件舞台，不裁掉文字、角色或按钮，也不把整张封面当作中间的小插图套进另一张封面。仅在封面容器内移除或隐藏源 HTML 的标题、副标题、示例插画和可见开始按钮，清理伪元素及 CSS 背景中重复的文字/按钮；主互动页的题干、选项、答案、控件和逻辑全部保留。不要因源课件原来使用 HTML 标题而继续保留第二套可见封面。\n5）透明点击层只承接进入事件，不绘制文字、图标、背景、边框、阴影或底座；可保留不可见的无障碍名称和键盘进入能力，不能将整张封面图设成透明。一次完整点击/触控只进入一次，不在 pointerdown 时提前撤掉封面；隔离本次手势，禁止继续触发下一页答案、拖拽或提交。进入第一题时仍为未作答状态。\n6）交付前同时核对封面原图与浏览器实际首屏：图中艺术标题、短副标题和设计按钮齐全且各一套，浏览器没有额外的可见 DOM/CSS 文字或按钮，点击任意位置可进入第一题。若有重复，修正 HTML 接入层；若图中文字错误，单独修正封面素材。不得用删掉艺术字、角色、按钮设计，换成空场景，或直接跳过封面的办法通过去重检查。\n\n", "3. 背景图规范与生图提示词逻辑\n1）背景图只用于提供风格氛围，不强行生成题目承载区域。题目白板、任务板、卡片、槽位、按钮和状态栏应由 HTML/CSS/JS 根据当前课件内容绘制，并覆盖在背景图上。背景图中不要生成框、白板、题板、任务板、玻璃板、卡片、按钮、标题、题目文字、选项文字、数字、字母、汉字、格线、槽位、logo、水印或二维码。\n2）背景图可以参考该风格 bg 图和 cover 图的视觉感觉自由延展，但只保留场景、色彩、材质、角色气质和边缘装饰；画面中心应保持开阔、低干扰，方便前端绘制适配当前题型的题板。\n3）本视觉风格背景图的生图提示词：\n3D粘土哑光软萌海底背景，浅蓝海水、沙地、珊瑚、贝壳、珍珠、海星、小鱼和海龟角色分布在画面边缘，物体圆润膨胀、低干扰。画面中心保持开阔清爽的海底空间，方便 HTML/CSS/JS 绘制任务题板。不要生成白色任务卡片、水波框、按钮、标题、文字、图标、logo、水印或二维码。\n\n", "4. 按钮、字体与触控规范\n按钮使用贝壳、珍珠或水滴形圆润按钮，状态按钮和工具按钮必须在主板安全区内。字体圆润、厚实、清楚，不能被水泡和透明质感削弱。\n本课件面向小学低中高年级儿童，所有核心文字和可点击区域必须适合课堂投屏、互动屏和平板触控。题干、核心选项、按钮文字和状态数字要使用明显偏大的字号，普通提示文字也要清楚可读；主按钮、选项卡、拖拽块和槽位要有足够大的触碰面积和间距，儿童手指点击不容易误触。按钮必须有清楚边界、高对比文字、按压反馈和禁用态；不要把关键文字做得过小、过细、过浅或压在复杂纹理上。\n\n", "5. 色彩、材质与装饰密度\n色彩以浅蓝、珍珠白、珊瑚粉、贝壳黄、薄荷绿、海星橙和柔和红为主。\n色彩只作为视觉方向，不在图片中显示任何色号、色卡编号、代码、CSS 文本或设计参数。整体保持明亮、干净、护眼，避免大面积深色、强霓虹、复杂渐变和高压迫背景。装饰密度必须低于学习内容，角色、花草、糖果、气泡、电话线、科技光线或海图道具只放在边缘、角落或低层背景，不得穿过题目、选项、槽位、网格、按钮和反馈区域。\n\n", "6. UI层级与反馈\n底层是风格化背景，只提供氛围；中层是主主题板和内部功能卡片，盖在背景图上，由html/CSS/JS 绘制适合本风格的题板区域，是最高信息承载层；上层是可拖拽对象、选项、按钮、反馈条和当前选中态；弹窗层用于结果、时间到或完成反馈，必须有遮罩或清楚的独立卡片，不能遮挡关键学习内容。\n正确反馈使用珍珠闪烁、小气泡和绿色描边；错误反馈使用柔和珊瑚边框；选中态使用水泡光圈和卡片轻浮。\n所有反馈只强化原交互，不新增新玩法，不改变原题目判断逻辑。\n\n", "7. 音效反馈规范\n音效是 UI 反馈的一部分，必须优先匹配当前风格的专属音效；只用于强化点击、选中、拖拽、落位、提交、答对、答错、提示、完成和重置状态，不改变原课件玩法、题型、节奏和按钮功能。音效需短促、低音量、低干扰，不能循环播放，不能盖过教学语音；需遵守原课件已有静音和音量设置。若没有真实音频素材，可用平台素材库、安全音效或 WebAudio 近似实现，但仍要尽量贴近本风格音效意图。\n本风格音效：点击使用软水泡声，选中使用贝壳轻碰声，答对使用连续小气泡和珍珠闪烁音，答错使用柔和水波回弹声。\n\n", "8. 禁止项\n禁止生成无关实体、无关玩法、无关学科内容、伪文字、乱码、品牌名、公司名、水印、二维码、角标、设计参数、色值、代码、CSS 标注、软件界面说明、宣传语和不可编辑的题目内容。禁止遮挡、重绘、扭曲或弱化原题目、题板、格线、槽位、按钮和反馈状态。"], "section2": 3, "blocks": [{"kind": "equal", "old": "2. 封面图规范与生图提示词逻辑\n", "new": "2. 封面图规范与生图提示词逻辑\n"}, {"kind": "insert", "old": "", "new": "【本节适用范围】第2节是完整封面设计，第3节是进入后的主互动页背景，两者必须分别生成、分别使用。封面继续执行本节第3项的原有美术描述，包括艺术字、角色、场景、材质、副标题载体和按钮设计；不得把它改成“空背景＋普通HTML标题按钮”。第3节的无文字、无按钮、中央留白要求，以及第4—6节的题板、标准正文字体、学习区低干扰规则，只约束主互动页，不得用来删减封面。除用户在本次调整中明确要求不要封面外，仍按原版规范生成完整图片式首页。\n\n", "change": 0, "left": [], "right": [{"text": "【本节适用范围】第2节是完整封面设计，第3节是进入后的主互动页背景，两者必须分别生成、分别使用。封面继续执行本节第3项的原有美术描述，包括艺术字、角色、场景、材质、副标题载体和按钮设计；不得把它改成“空背景＋普通HTML标题按钮”。第3节的无文字、无按钮、中央留白要求，以及第4—6节的题板、标准正文字体、学习区低干扰规则，只约束主互动页，不得用来删减封面。除用户在本次调整中明确要求不要封面外，仍按原版规范生成完整图片式首页。\n\n", "changed": true}]}, {"kind": "replace", "old": "1）封面图用于儿童互动课件首页。封面图本身必须生成主标题、副标题和进入按钮；副标题不得超过15个字，图上不生成任何额外文字、包括风格名、品牌名、logo、水印、二维码、角标、色值、尺寸标记、伪文字或无关宣传语都不允许生成。逻辑上，从封面图任意位置点击即可进入，禁止在封面图上再生成任何文字/按钮，只需要配置点击事件。\n", "new": "1）封面图用于儿童互动课件首页。封面图本身必须生成主标题、副标题和进入按钮；副标题不得超过15个字，图上不生成任何额外文字、包括风格名、品牌名、logo、水印、二维码、角标、色值、尺寸标记、伪文字或无关宣传语都不允许生成。封面图中的主标题、副标题、按钮造型和按钮文字是最终可见内容，必须保留。HTML 不得在这张封面图上再次叠加可见标题、副标题、按钮、按钮文字或底座；只配置覆盖封面的透明点击层，点击封面任意位置进入原课件。这里禁止的是 HTML 重复叠加，不是禁止图片生成标题或按钮。\n", "change": 1, "left": [{"text": "1）封面图用于儿童互动课件首页。封面图本身必须生成主标题、副标题和进入按钮；副标题不得超过15个字，图上不生成任何额外文字、包括风格名、品牌名、logo、水印、二维码、角标、色值、尺寸标记、伪文字或无关宣传语都不允许生成。", "changed": false}, {"text": "逻辑上，从封面图任意位置点击即可进入，禁止在封面图上再生成任何文字/按钮，只需要配置点击事件。\n", "changed": true}], "right": [{"text": "1）封面图用于儿童互动课件首页。封面图本身必须生成主标题、副标题和进入按钮；副标题不得超过15个字，图上不生成任何额外文字、包括风格名、品牌名、logo、水印、二维码、角标、色值、尺寸标记、伪文字或无关宣传语都不允许生成。", "changed": false}, {"text": "封面图中的主标题、副标题、按钮造型和按钮文字是最终可见内容，必须保留。HTML 不得在这张封面图上再次叠加可见标题、副标题、按钮、按钮文字或底座；只配置覆盖封面的透明点击层，点击封面任 任意位置可进入第一题。若有重复，修正 HTML 接入层；若图中文字错误，单独修正封面素材。不得用删掉艺术字、角色、按钮设计，换成空场景，或直接跳过封面的办法通过去重检查。\n\n", "change": 4, "left": [], "right": [{"text": "6）交付前同时核对封面原图与浏览器实际首屏：图中艺术标题、短副标题和设计按钮齐全且各一套，浏览器没有额外的可见 DOM/CSS 文字或按钮，点击任意位置可进入第一题。若有重复，修正 HTML 接入层；若图中文字错误，单独修正封面素材。不得用删掉艺术字、角色、按钮设计，换成空场景，或直接跳过封面的办法通过去重检查。\n\n", "changed": true}]}], "delta": 825}, {"styleCode": "space", "displayName": "太空探索风", "caseId": "S16", "promptText": "请严格按“太空探索风 UI规范”重新生成同一课件界面。\n\n0. 原课件保留规则\n本风格只用于 UI 视觉换肤，不得改变原课件的学科、题型、题目内容、答案、素材数量、槽位数量、组件数量、布局关系、按钮功能、计分逻辑和交互流程。原来是英语看图拼词、填空、拖拽、选择、分类、连线、逻辑推理或其他玩法，换风格后仍保持原玩法和原题目结构。主互动题页中的题干、选项、答案、字母、汉字、拼音、数字、公式、倒计时、得分、按钮文案、反馈文案和关卡信息等可变教学内容，必须由 HTML/CSS/JS 渲染，不要烘焙进背景图或题板底图。\n\n1. 整体视觉与布局\n风格识别锚点：第一眼应像儿童太空舱探索任务。使用哑光粘土太空场景、深蓝太空舱、星空、星球、陨石、可爱宇航员、机器人和柔和发光任务面板；科技感要明亮友好，不压暗、不恐怖，不把课件变成复杂科幻海报。\n采用柔和星空背景和明亮任务控制台。画面可以有舷窗、星球、星云、飞船控制台、能量条和发光边框。科技感服务于课堂任务，不能过暗、过硬、过赛博，也不能让星空和光效影响题目可读性。\n使用横版课件画布，画布主体集中在中央学习区，四周保留安全边距。顶部保留原课件已有标题、关卡、进度、奖励、倒计时或得分信息；中央按原课件布局放置题目、图片区、网格、线索、选项、素材池、槽位或操作区；底部或右侧保留原有按钮和工具按钮。背景只提供氛围，不承担学习信息。\n\n2. 封面图规范与生图提示词逻辑\n【本节适用范围】第2节是完整封面设计，第3节是进入后的主互动页背景，两者必须分别生成、分别使用。封面继续执行本节第3项的原有美术描述，包括艺术字、角色、场景、材质、副标题载体和按钮设计；不得把它改成“空背景＋普通HTML标题按钮”。第3节的无文字、无按钮、中央留白要求，以及第4—6节的题板、标准正文字体、学习区低干扰规则，只约束主互动页，不得用来删减封面。除用户在本次调整中明确要求不要封面外，仍按原版规范生成完整图片式首页。\n\n1）封面图用于儿童互动课件首页。封面图本身必须生成主标题、副标题和进入按钮；副标题不得超过15个字，图上不生成任何额外文字、包括风格名、品牌名、logo、水印、二维码、角标、色值、尺寸标记、伪文字或无关宣传语都不允许生成。封面图中的主标题、副标题、按钮造型和按钮文字是最终可见内容，必须保留。HTML 不得在这张封面图上再次叠加可见标题、副标题、按钮、按钮文字或底座；只配置覆盖封面的透明点击层，点击封面任意位置进入原课件。这里禁止的是 HTML 重复叠加，不是禁止图片生成标题或按钮。\n2）主标题、副标题和按钮文案都是可变元素，必须根据当前课件真实内容替换；若为英语课件则尽量用英文，若非英语课件则一律用中文。标题、短副标题和进入按钮需要沿同一视觉主轴组织，层级清楚、可读性强，适合课堂投屏。\n3）本视觉风格封面的生图提示词：\n3D粘土哑光太空探索封面，深蓝太空舱和星空背景，星球、陨石、银河、发光星星、Q版宇航员和小机器人分布在两侧。中心上方生成蓝紫发光立体标题“{标题内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，标题带星星徽章、黄色描边和柔和霓虹边。标题下方生成短副标题“{副标题内容根据课件真实内容填充，副标题不超过15个字，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，放在深蓝科技丝带或星际标签内。中下方生成黄色橙色圆角按钮，按钮文字为“{进入冒险，按钮内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，按钮带火箭图标、白描边和轻微发光。\n\n4）封面接入顺序：先根据真实课件确认主标题、短副标题和进入文案，再依照上面的原版美术描述生成一张完整封面图；将它完整适配课件舞台，不裁掉文字、角色或按钮，也不把整张封面当作中间的小插图套进另一张封面。仅在封面容器内移除或隐藏源 HTML 的标题、副标题、示例插画和可见开始按钮，清理伪元素及 CSS 背景中重复的文字/按钮；主互动页的题干、选项、答案、控件和逻辑全部保留。不要因源课件原来使用 HTML 标题而继续保留第二套可见封面。\n5）透明点击层只承接进入事件，不绘制文字、图标、背景、边框、阴影或底座；可保留不可见的无障碍名称和键盘进入能力，不能将整张封面图设成透明。一次完整点击/触控只进入一次，不在 pointerdown 时提前撤掉封面；隔离本次手势，禁止继续触发下一页答案、拖拽或提交。进入第一题时仍为未作答状态。\n6）交付前同时核对封面原图与浏览器实际首屏：图中艺术标题、短副标题和设计按钮齐全且各一套，浏览器没有额外的可见 DOM/CSS 文字或按钮，点击任意位置可进入第一题。若有重复，修正 HTML 接入层；若图中文字错误，单独修正封面素材。不得用删掉艺术字、角色、按钮设计，换成空场景，或直接跳过封面的办法通过去重检查。\n\n3. 背景图规范与生图提示词逻辑\n1）背景图只用于提供风格氛围，不强行生成题目承载区域。题目白板、任务板、卡片、槽位、按钮和状态栏应由 HTML/CSS/JS 根据当前课件内容绘制，并覆盖在背景图上。背景图中不要生成框、白板、题板、任务板、玻璃板、卡片、按钮、标题、题目文字、选项文字、数字、字母、汉字、格线、槽位、logo、水印或二维码。\n2）背景图可以参考该风格 bg 图和 cover 图的视觉感觉自由延展，但只保留场景、色彩、材质、角色气质和边缘装饰；画面中心应保持开阔、低干扰，方便前端绘制适配当前题型的题板。\n3）本视觉风格背景图的生图提示词：\n3D粘土哑光太空背景，深蓝星空、星球、陨石、银河、太空舱地面、发光星星、Q版宇航员和机器人靠边放置，科技感但儿童友好。画面中心保持开阔的暗蓝星际空间和柔和舞台光，方便 HTML/CSS/JS 绘制发光任务面板。不要生成科技面板框、白板、按钮、标题、文字、星际标签、logo、水印或二维码。\n\n4. 按钮、字体与触控规范\n按钮使用科技胶囊、能量按钮或控制台按键，主按钮明亮高对比。字体可有轻科技感，但不能过细、过窄或强发光。\n本课件面向小学低中高年级儿童，所有核心文字和可点击区域必须适合课堂投屏、互动屏和平板触控。题干、核心选项、按钮文字和状态数字要使用明显偏大的字号，普通提示文字也要清楚可读；主按钮、选项卡、拖拽块和槽位要有足够大的触碰面积和间距，儿童手指点击不容易误触。按钮必须有清楚边界、高对比文字、按压反馈和禁用态；不要把关键文字做得过小、过细、过浅或压在复杂纹理上。\n\n5. 色彩、材质与装饰密度\n色彩以深浅平衡的星空蓝、天空蓝、银白、能量青、柔和紫、星星黄和柔和红为主。\n色彩只作为视觉方向，不在图片中显示任何色号、色卡编号、代码、CSS 文本或设计参数。整体保持明亮、干净、护眼，避免大面积深色、强霓虹、复杂渐变和高压迫背景。装饰密度必须低于学习内容，角色、花草、糖果、气泡、电话线、科技光线或海图道具只放在边缘、角落或低层背景，不得穿过题目、选项、槽位、网格、按钮和反馈区域。\n\n6. UI层级与反馈\n底层是风格化背景，只提供氛围；中层是主主题板和内部功能卡片，盖在背景图上，由html/CSS/JS 绘制适合本风格的题板区域，是最高信息承载层；上层是可拖拽对象、选项、按钮、反馈条和当前选中态；弹窗层用于结果、时间到或完成反馈，必须有遮罩或清楚的独立卡片，不能遮挡关键学习内容。\n正确反馈使用能量点亮、星星收集和绿色边框；错误反馈使用柔和红色警示边框；选中态使用能量环和轻上浮。\n所有反馈只强化原交互，不新增新玩法，不改变原题目判断逻辑。\n\n7. 音效反馈规范\n音效是 UI 反馈的一部分，必须优先匹配当前风格的专属音效；只用于强化点击、选中、拖拽、落位、提交、答对、答错、提示、完成和重置状态，不改变原课件玩法、题型、节奏和按钮功能。音效需短促、低音量、低干扰，不能循环播放，不能盖过教学语音；需遵守原课件已有静音和音量设置。若没有真实音频素材，可用平台素材库、安全音效或 WebAudio 近似实现，但仍要尽量贴近本风格音效意图。\n本风格音效：点击使用短促电子提示，选中使用能量点亮声，开始或切换使用舱门轻响，答对使用星星收集音，避免长时间科幻轰鸣。\n\n8. 禁止项\n禁止生成无关实体、无关玩法、无关学科内容、伪文字、乱码、品牌名、公司名、水印、二维码、角标、设计参数、色值、代码、CSS 标注、软件界面说明、宣传语和不可编辑的题目内容。禁止遮挡、重绘、扭曲或弱化原题目、题板、格线、槽位、按钮和反馈状态。", "basePromptSHA256": "55ad2633 层，点击封面任意位置进入原课件。这里禁止的是 HTML 重复叠加，不是禁止图片生成标题或按钮。\n2）主标题、副标题和按钮文案都是可变元素，必须根据当前课件真实内容替换；若为英语课件则尽量用英文，若非英语课件则一律用中文。标题、短副标题和进入按钮需要沿同一视觉主轴组织，层级清楚、可读性强，适合课堂投屏。\n3）本视觉风格封面的生图提示词：\n3D粘土哑光太空探索封面，深蓝太空舱和星空背景，星球、陨石、银河、发光星星、Q版宇航员和小机器人分布在两侧。中心上方生成蓝紫发光立体标题“{标题内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，标题带星星徽章、黄色描边和柔和霓虹边。标题下方生成短副标题“{副标题内容根据课件真实内容填充，副标题不超过15个字，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，放在深蓝科技丝带或星际标签内。中下方生成黄色橙色圆角按钮，按钮文字为“{进入冒险，按钮内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，按钮带火箭图标、白描边和轻微发光。\n\n4）封面接入顺序：先根据真实课件确认主标题、短副标题和进入文案，再依照上面的原版美术描述生成一张完整封面图；将它完整适配课件舞台，不裁掉文字、角色或按钮，也不把整张封面当作中间的小插图套进另一张封面。仅在封面容器内移除或隐藏源 HTML 的标题、副标题、示例插画和可见开始按钮，清理伪元素及 CSS 背景中重复的文字/按钮；主互动页的题干、选项、答案、控件和逻辑全部保留。不要因源课件原来使用 HTML 标题而继续保留第二套可见封面。\n5）透明点击层只承接进入事件，不绘制文字、图标、背景、边框、阴影或底座；可保留不可见的无障碍名称和键盘进入能力，不能将整张封面图设成透明。一次完整点击/触控只进入一次，不在 pointerdown 时提前撤掉封面；隔离本次手势，禁止继续触发下一页答案、拖拽或提交。进入第一题时仍为未作答状态。\n6）交付前同时核对封面原图与浏览器实际首屏：图中艺术标题、短副标题和设计按钮齐全且各一套，浏览器没有额外的可见 DOM/CSS 文字或按钮，点击任意位置可进入第一题。若有重复，修正 HTML 接入层；若图中文字错误，单独修正封面素材。不得用删掉艺术字、角色、按钮设计，换成空场景，或直接跳过封面的办法通过去重检查。\n\n3. 背景图规范与生图提示词逻辑\n1）背景图只用于提供风格氛围，不强行生成题目承载区域。题目白板、任务板、卡片、槽位、按钮和状态栏应由 HTML/CSS/JS 根据当前课件内容绘制，并覆盖在背景图上。背景图中不要生成框、白板、题板、任务板、玻璃板、卡片、按钮、标题、题目文字、选项文字、数字、字母、汉字、格线、槽位、logo、水印或二维码。\n2）背景图可以参考该风格 bg 图和 cover 图的视觉感觉自由延展，但只保留场景、色彩、材质、角色气质和边缘装饰；画面中心应保持开阔、低干扰，方便前端绘制适配当前题型的题板。\n3）本视觉风格背景图的生图提示词：\n3D粘土哑光太空背景，深蓝星空、星球、陨石、银河、太空舱地面、发光星星、Q版宇航员和机器人靠边放置，科技感但儿童友好。画面中心保持开阔的暗蓝星际空间和柔和舞台光，方便 HTML/CSS/JS 绘制发光任务面板。不要生成科技面板框、白板、按钮、标题、文字、星际标签、logo、水印或二维码。\n\n4. 按钮、字体与触控规范\n按钮使用科技胶囊、能量按钮或控制台按键，主按钮明亮高对比。字体可有轻科技感，但不能过细、过窄或强发光。\n本课件面向小学低中高年级儿童，所有核心文字和可点击区域必须适合课堂投屏、互动屏和平板触控。题干、核心选项、按钮文字和状态数字要使用明显偏大的字号，普通提示文字也要清楚可读；主按钮、选项卡、拖拽块和槽位要有足够大的触碰面积和间距，儿童手指点击不容易误触。按钮必须有清楚边界、高对比文字、按压反馈和禁用态；不要把关键文字做得过小、过细、过浅或压在复杂纹理上。\n\n5. 色彩、材质与装饰密度\n色彩以深浅平衡的星空蓝、天空蓝、银白、能量青、柔和紫、星星黄和柔和红为主。\n色彩只作为视觉方向，不在图片中显示任何色号、色卡编号、代码、CSS 文本或设计参数。整体保持明亮、干净、护眼，避免大面积深色、强霓虹、复杂渐变和高压迫背景。装饰密度必须低于学习内容，角色、花草、糖果、气泡、电话线、科技光线或海图道具只放在边缘、角落或低层背景，不得穿过题目、选项、槽位、网格、按钮和反馈区域。\n\n6. UI层级与反馈\n底层是风格化背景，只提供氛围；中层是主主题板和内部功能卡片，盖在背景图上，由html/CSS/JS 绘制适合本风格的题板区域，是最高信息承载层；上层是可拖拽对象、选项、按钮、反馈条和当前选中态；弹窗层用于结果、时间到或完成反馈，必须有遮罩或清楚的独立卡片，不能遮挡关键学习内容。\n正确反馈使用能量点亮、星星收集和绿色边框；错误反馈使用柔和红色警示边框；选中态使用能量环和轻上浮。\n所有反馈只强化原交互，不新增新玩法，不改变原题目判断逻辑。\n\n7. 音效反馈规范\n音效是 UI 反馈的一部分，必须优先匹配当前风格的专属音效；只用于强化点击、选中、拖拽、落位、提交、答对、答错、提示、完成和重置状态，不改变原课件玩法、题型、节奏和按钮功能。音效需短促、低音量、低干扰，不能循环播放，不能盖过教学语音；需遵守原课件已有静音和音量设置。若没有真实音频素材，可用平台素材库、安全音效或 WebAudio 近似实现，但仍要尽量贴近本风格音效意图。\n本风格音效：点击使用短促电子提示，选中使用能量点亮声，开始或切换使用舱门轻响，答对使用星星收集音，避免长时间科幻轰鸣。\n\n8. 禁止项\n禁止生成无关实体、无关玩法、无关学科内容、伪文字、乱码、品牌名、公司名、水印、二维码、角标、设计参数、色值、代码、CSS 标注、软件界面说明、宣传语和不可编辑的题目内容。禁止遮挡、重绘、扭曲或弱化原题目、题板、格线、槽位、按钮和反馈状态。", "sectionsOld": ["请严格按“太空探索风 UI规范”重新生成同一课件界面。\n\n", "0. 原课件保留规则\n本风格只用于 UI 视觉换肤，不得改变原课件的学科、题型、题目内容、答案、素材数量、槽位数量、组件数量、布局关系、按钮功能、计分逻辑和交互流程。原来是英语看图拼词、填空、拖拽、选择、分类、连线、逻辑推理或其他玩法，换风格后仍保持原玩法和原题目结构。主互动题页中的题干、选项、答案、字母、汉字、拼音、数字、公式、倒计时、得分、按钮文案、反馈文案和关卡信息等可变教学内容，必须由 HTML/CSS/JS 渲染，不要烘焙进背景图或题板底图。\n\n", "1. 整体视觉与布局\n风格识别锚点：第一眼应像儿童太空舱探索任务。使用哑光粘土太空场景、深蓝太空舱、星空、星球、陨石、可爱宇航员、机器人和柔和发光任务面板；科技感要明亮友好，不压暗、不恐怖，不把课件变成复杂科幻海报。\n采用柔和星空背景和明亮任务控制台。画面可以有舷窗、星球、星云、飞船控制台、能量条和发光边框。科技感服务于课堂任务，不能过暗、过硬、过赛博，也不能让星空和光效影响题目可读性。\n使用横版课件画布，画布主体集中在中央学习区，四周保留安全边距。顶部保留原课件已有标题、关卡、进度、奖励、倒计时或得分信息；中央按原课件布局放置题目、图片区、网格、线索、选项、素材池、槽位或操作区；底部或右侧保留原有按钮和工具按钮。背景只提供氛围，不承担学习信息。\n\n", "2. 封面图规范与生图提示词逻辑\n1）封面图用于儿童互动课件首页。封面图本身必须生成主标题、副标题和进入按钮；副标题不得超过15个字，图上不生成任何额外文字、包括风格名、品牌名、logo、水印、二维码、角标、色值、尺寸标记、伪文字或无关宣传语都不允许生成。逻辑上，从封面图任意位置点击即可进入，禁止在封面图上再生成任何文字/按钮，只需要配置点击事件。\n2）主标题、副标题和按钮文案都是可变元素，必须根据当前课件真实内容替换；若为英语课件则尽量用英文，若非英语课件则一律用中文。标题、短副标题和进入按钮需要沿同一视觉主轴组织，层级清楚、可读性强，适合课堂投屏。\n3）本视觉风格封面的生图提示词：\n3D粘土哑光太空探索封面，深蓝太空舱和星空背景，星球、陨石、银河、发光星星、Q版宇航员和小机器人分布在两侧。中心上方生成蓝紫发光立体标题“{标题内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，标题带星星徽章、黄色描边和柔和霓虹边。标题下方生成短副标题“{副标题内容根据课件真实内容填充，副标题不超过15个字，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，放在深蓝科技丝带或星际标签内。中下方生成黄色橙色圆角按钮，按钮文字为“{进入冒险，按钮内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，按钮带火箭图标、白描边和轻微发光。\n\n", "3. 背景图规范与生图提示词逻辑\n1）背景图只用于提供风格氛围，不强行生成题目承载区域。题目白板、任务板、卡片、槽位、按钮和状态栏应由 HTML/CSS/JS 根据当前课件内容绘制，并覆盖在背景图上。背景图中不要生成框、白板、题板、任务板、玻璃板、卡片、按钮、标题、题目文字、选项文字、数字、字母、汉字、格线、槽位、logo、水印或二维码。\n2）背景图可以参考该风格 bg 图和 cover 图的视觉感觉自由延展，但只保留场景、色彩、材质、角色气质和边缘装饰；画面中心应保持开阔、低干扰，方便前端绘制适配当前题型的题板。\n3）本视觉风格背景图的生图提示词：\n3D粘土哑光太空背景，深蓝星空、星球、陨石、银河、太空舱地面、发光星星、Q版宇航员和机器人靠边放置，科技感但儿童友好。画面中心保持开阔的暗蓝星际空间和柔和舞台光，方便 HTML/CSS/JS 绘制发光任务面板。不要生成科技面板框、白板、按钮、标题、文字、星际标签、logo、水印或二维码。\n\n", "4. 按钮、字体与触控规范\n按钮使用科技胶囊、能量按钮或控制台按键，主按钮明亮高对比。字体可有轻科技感，但不能过细、过窄或强发光。\n本课件面向小学低中高年级儿童，所有核心文字和可点击区域必须适合课堂投屏、互动屏和平板触控。题干、核心选项、按钮文字和状态数字要使用明显偏大的字号，普通提示文字也要清楚可读；主按钮、选项卡、拖拽块和槽位要有足够大的触碰面积和间距，儿童手指点击不容易误触。按钮必须有清楚边界、高对比文字、按压反馈和禁用态；不要把关键文字做得过小、过细、过浅或压在复杂纹理上。\n\n", "5. 色彩、材质与装饰密度\n色彩以深浅平衡的星空蓝、天空蓝、银白、能量青、柔和紫、星星黄和柔和红为主。\n色彩只作为视觉方向，不在图片中显示任何色号、色卡编号、代码、CSS 文本或设计参数。整体保持明亮、干净、护眼，避免大面积深色、强霓虹、复杂渐变和高压迫背景。装饰密度必须低于学习内容，角色、花草、糖果、气泡、电话线、科技光线或海图道具只放在边缘、角落或低层背景，不得穿过题目、选项、槽位、网格、按钮和反馈区域。\n\n", "6. UI层级与反馈\n底层是风格化背景，只提供氛围；中层是主主题板和内部功能卡片，盖在背景图上，由html/CSS/JS 绘制适合本风格的题板区域，是最高信息承载层；上层是可拖拽对象、选项、按钮、反馈条和当前选中态；弹窗层用于结果、时间到或完成反馈，必须有遮罩或清楚的独立卡片，不能遮挡关键学习内容。\n正确反馈使用能量点亮、星星收集和绿色边框；错误反馈使用柔和红色警示边框；选中态使用能量环和轻上浮。\n所有反馈只强化原交互，不新增新玩法，不改变原题目判断逻辑。\n\n", "7. 音效反馈规范\n音效是 UI 反馈的一部分，必须优先匹配当前风格的专属音效；只用于强化点击、选中、拖拽、落位、提交、答对、答错、提示、完成和重置状态，不改变原课件玩法、题型、节奏和按钮功能。音效需短促、低音量、低干扰，不能循环播放，不能盖过教学语音；需遵守原课件已有静音和音量设置。若没有真实音频素材，可用平台素材库、安全音效或 WebAudio 近似实现，但仍要尽量贴近本风格音效意图。\n本风格音效：点击使用短促电子提示，选中使用能量点亮声，开始或切换使用舱门轻响，答对使用星星收集音，避免长时间科幻轰鸣。\n\n", "8. 禁止项\n禁止生成无关实体、无关玩法、无关学科内容、伪文字、乱码、品牌名、公司名、水印、二维码、角标、设计参数、色值、代码、CSS 标注、软件界面说明、宣传语和不可编辑的题目内容。禁止遮挡、重绘、扭曲或弱化原题目、题板、格线、槽位、按钮和反馈状态。"], "sectionsNew": ["请严格按“太空探索风 UI规范”重新生成同一课件界面。\n\n", "0. 原课件保留规则\n本风格只用于 UI 视觉换肤，不得改变原课件的学科、题型、题目内容、答案、素材数量、槽位数量、组件数量、布局关系、按钮功能、计分逻辑和交互流程。原来是英语看图拼词、填空、拖拽、选择、分类、连线、逻辑推理或其他玩法，换风格后仍保持原玩法和原题目结构。主互动题页中的题干、选项、答案、字母、汉字、拼音、数字、公式、倒计时、得分、按钮文案、反馈文案和关卡信息等可变教学内容，必须由 HTML/CSS/JS 渲染，不要烘焙进背景图或题板底图。\n\n", "1. 整体视觉与布局\n风格识别锚点：第一眼应像儿童太空舱探索任务。使用哑光粘土太空场景、深蓝太空舱、星空、星球、陨石、可爱宇航员、机器人和柔和发光任务面板；科技感要明亮友好，不压暗、不恐怖，不把课件变成复杂科幻海报。\n采用柔和星空背景和明亮任务控制台。画面可以有舷窗、星球、星云、飞船控制台、能量条和发光边框。科技感服务于课堂任务，不能过暗、过硬、过赛博，也不能让星空和光效影响题目可读性。\n使用横版课件画布，画布主体集中在中央学习区，四周保留安全边距。顶部保留原课件已有标题、关卡、进度、奖励、倒计时或得分信息；中央按原课件布局放置题目、图片区、网格、线索、选项、素材池、槽位或操作区；底部或右侧保留原有按钮和工具按钮。背景只提供氛围，不承担学习信息。\n\n", "2. 封面图规范与生图提示词逻辑\n【本节适用范围】第2节是完整封面设计，第3节是进入后的主互动页背景，两者必须分别生成、分别使用。封面继续执行本节第3项的原有美术描述，包括艺术字、角色、场景、材质、副标题载体和按钮设计；不得把它改成“空背景＋普通HTML标题按钮”。第3节的无文字、无按钮、中央留白要求，以及第4—6节的题板、标准正文字体、学习区低干扰规则，只约束主互动页，不得用来删减封面。除用户在本次调整中明确要求不要封面外，仍按原版规范生成完整图片式首页。\n\n1）封面图用于儿童互动课件首页。封面图本身必须生成主标题、副标题和进入按钮；副标题不得超过15个字，图上不生成任何额外文字、包括风格名、品牌名、logo、水印、二维码、角标、色值、尺寸标记、伪文字或无关宣传语都不允许生成。封面图中的主标题、副标题、按钮造型和按钮文字是最终可见内容，必须保留。HTML 不得在这张封面图上再次叠加可见标题、副标题、按钮、按钮文字或底座；只配置覆盖封面的透明点击层，点击封面任意位置进入原课件。这里禁止的是 HTML 重复叠加，不是禁止图片生成标题或按钮。\n2）主标题、副标题和按钮文案都是可变元素，必须根据当前课件真实内容替换；若为英语课件则尽量用英文，若非英语课件则一律用中文。标题、短副标题和进入按钮需要沿同一视觉主轴组织，层级清楚、可读性强，适合课堂投屏。\n3）本视觉风格封面的生图提示词：\n3D粘土哑光太空探索封面，深蓝太空舱和星空背景，星球、陨石、银河、发光星星、Q版宇航员和小机器人分布在两侧。中心上方生成蓝紫发光立体标题“{标题内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，标题带星星徽章、黄色描边和柔和霓虹边。标题下方生成短副标题“{副标题内容根据课件真实内容填充，副标题不超过15个字，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，放在深蓝科技丝带或星际标签内。中下方生成黄色橙色圆角按钮，按钮文字为“{进入冒险，按钮内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，按钮带火箭图标、白描边和轻微发光。\n\n4）封面接入顺序：先根据真实课件确认主标题、短副标题和进入文案，再依照上面的原版美术描述生成一张完整封面图；将它完整适配课件舞台，不裁掉文字、角色或按钮，也不把整张封面当作中间的小插图套进另一张封面。仅在封面容器内移除或隐藏源 HTML 的标题、副标题、示例插画和可见开始按钮，清理伪元素及 CSS 背景中重复的文字/按钮；主互动页的题干、选项、答案、控件和逻辑全部保留。不要因源课件原来使用 HTML 标题而继续保留第二套可见封面。\n5）透明点击层只承接进入事件，不绘制文字、图标、背景、边框、阴影或底座；可保留不可见的无障碍名称和键盘进入能力，不能将整张封面图设成透明。一次完整点击/触控只进入一次，不在 pointerdown 时提前撤掉封面；隔离本次手势，禁止继续触发下一页答案、拖拽或提交。进入第一题时仍为未作答状态。\n6）交付前同时核对封面原图与浏览器实际首屏：图中艺术标题、短副标题和设计按钮齐全且各一套，浏览器没有额外的可见 DOM/CSS 文字或按钮，点击任意位置可进入第一题。若有重复，修正 HTML 接入层；若图中文字错误，单独修正封面素材。不得用删掉艺术字、角色、按钮设计，换成空场景，或直接跳过封面的办法通过去重检查。\n\n", "3. 背景图规范与生图提示词逻辑\n1）背景图只用于提供风格氛围，不强行生成题目承载区域。题目白板、任务板、卡片、槽位、按钮和状态栏应由 HTML/CSS/JS 根据当前课件内容绘制，并覆盖在背景图上。背景图中不要生成框、白板、题板、任务板、玻璃板、卡片、按钮、标题、题目文字、选项文字、数字、字母、汉字、格线、槽位、logo、水印或二维码。\n2）背景图可以参考该风格 bg 图和 cover 图的视觉感觉自由延展，但只保留场景、色彩、材质、角色气质和边缘装饰；画面中心应保持开阔、低干扰，方便前端绘制适配当前题型的题板。\n3）本视觉风格背景图的生图提示词：\n3D粘土哑光太空背景，深蓝星空、星球、陨石、银河、太空舱地面、发光星星、Q版宇航员和机器人靠边放置，科技感但儿童友好。画面中心保持开阔的暗蓝星际空间和柔和舞台光，方便 HTML/CSS/JS 绘制发光任务面板。不要生成科技面板框、白板、按钮、标题、文字、星际标签、logo、水印或二维码。\n\n", "4. 按钮、字体与触控规范\n按钮使用科技胶囊、能量按钮或控制台按键，主按钮明亮高对比。字体可有轻科技感，但不能过细、过窄或强发光。\n本课件面向小学低中高年级儿童，所有核心文字和可点击区域必须适合课堂投屏、互动屏和平板触控。题干、核心选项、按钮文字和状态数字要使用明显偏大的字号，普通提示文字也要清楚可读；主按钮、选项卡、拖拽块和槽位要有足够大的触碰面积和间距，儿童手指点击不容易误触。按钮必须有清楚边界、高对比文字、按压反馈和禁用态；不要把关键文字做得过小、过细、过浅或压在复杂纹理上。\n\n", "5. 色彩、材质与装饰密度\n色彩以深浅平衡的星空蓝、天空蓝、银白、能量青、柔和紫、星星黄和柔和红为主。\n色彩只作为视觉方向，不在图片中显示任何色号、色卡编号、代码、CSS 文本或设计参数。整体保持明亮、干净、护眼，避免大面积深色、强霓虹、复杂渐变和高压迫背景。装饰密度必须低于学习内容，角色、花草、糖果、气泡、电话线、科技光线或海图道具只放在边缘、角落或低层背景，不得穿过题目、选项、槽位、网格、按钮和反馈区域。\n\n", "6. UI层级与反馈\n底层是风格化背景，只提供氛围；中层是主主题板和内部功能卡片，盖在背景图上，由html/CSS/JS 绘制适合本风格的题板区域，是最高信息承载层；上层是可拖拽对象、选项、按钮、反馈条和当前选中态；弹窗层用于结果、时间到或完成反馈，必须有遮罩或清楚的独立卡片，不能遮挡关键学习内容。\n正确反馈使用能量点亮、星星收集和绿色边框；错误反馈使用柔和红色警示边框；选中态使用能量环和轻上浮。\n所有反馈只强化原交互，不新增新玩法，不改变原题目判断逻辑。\n\n", "7. 音效反馈规范\n音效是 UI 反馈的一部分，必须优先匹配当前风格的专属音效；只用于强化点击、选中、拖拽、落位、提交、答对、答错、提示、完成和重置状态，不改变原课件玩法、题型、节奏和按钮功能。音效需短促、低音量、低干扰，不能循环播放，不能盖过教学语音；需遵守原课件已有静音和音量设置。若没有真实音频素材，可用平台素材库、安全音效或 WebAudio 近似实现，但仍要尽量贴近本风格音效意图。\n本风格音效：点击使用短促电子提示，选中使用能量点亮声，开始或切换使用舱门轻响，答对使用星星收集音，避免长时间科幻轰鸣。\n\n", "8. 禁止项\n禁止生成无关实体、无关玩法、无关学科内容、伪文字、乱码、品牌名、公司名、水印、二维码、角标、设计参数、色值、代码、CSS 标注、软件界面说明、宣传语和不可编辑的题目内容。禁止遮挡、重绘、扭曲或弱化原题目、题板、格线、槽位、按钮和反馈状态。"], "section2": 3, "blocks": [{"kind": "equal", "old": "2. 封面图规范与生图提示词逻辑\n", "new": "2. 封面图规范与生图提示词逻辑\n"}, {"kind": "insert", "old": "", "new": "【本节适用范围】第2节是完整封面设计，第3节是进入后的主互动页背景，两者必须分别生成、分别使用。封面继续执行本节第3项的原有美术描述，包括艺术字、角色、场景、材质、副标题载体和按钮设计；不得把它改成“空背景＋普通HTML标题按钮”。第3节的无文字、无按钮、中央留白要求，以及第4—6节的题板、标准正文字体、学习区低干扰规则，只约束主互动页，不得用来删减封面。除用户在本次调整中明确要求不要封面外，仍按原版规范生成完整图片式首页。\n\n", "change": 0, "left": [], "right": [{"text": "【本节适用范围】第2节是完整封面设计，第3节是进入后的主互动页背景，两者必须分别生成、分别使用。封面继续执行本节第3项的原有美术描述，包括艺术字、角色、场景、材质、副标题载体和按钮设计；不得把它改成“空背景＋普通HTML标题按钮”。第3节的无文字、无按钮、中央留白要求，以及第4—6节的题板、标准正文字体、学习区低干扰规则，只约束主互动页，不得用来删减封面。除用户在本次调整中明确要求不要封面外，仍按原版规范生成完整图片式首页。\n\n", "changed": true}]}, {"kind": "replace", "old": "1）封面图用于儿童互动课件首页。封面图本身必须生成主标题、副标题和进入按钮；副标题不得超过15个字，图上不生成任何额外文字、包括风格名、品牌名、logo、水印、二维码、角标、色值、尺寸标记、伪文字或无关宣传语都不允许生成。逻辑上，从封面图任意位置点击即可进入，禁止在封面图上再生成任何文字/按钮，只需要配置点击事件。\n", "new": "1）封面图用于儿童互动课件首页。封面图本身必须生成主标题、副标题和进入按钮；副标题不得超过15个字，图上不生成任何额外文字、包括风格名、品牌名、logo、水印、二维码、角标、色值、尺寸标记、伪文字或无关宣传语都不允许生成。封面图中的主标题、副标题、按钮造型和按钮文字是最终可见内容，必须保留。HTML 不得在这张封面图上再次叠加可见标题、副标题、按钮、按钮文字或底座；只配置覆盖封面的透明点击层，点击封面任意位置进入原课件。这里禁止的是 HTML 重复叠加，不是禁止图片生成标题或按 ged": true}]}, {"kind": "insert", "old": "", "new": "5）透明点击层只承接进入事件，不绘制文字、图标、背景、边框、阴影或底座；可保留不可见的无障碍名称和键盘进入能力，不能将整张封面图设成透明。一次完整点击/触控只进入一次，不在 pointerdown 时提前撤掉封面；隔离本次手势，禁止继续触发下一页答案、拖拽或提交。进入第一题时仍为未作答状态。\n", "change": 3, "left": [], "right": [{"text": "5）透明点击层只承接进入事件，不绘制文字、图标、背景、边框、阴影或底座；可保留不可见的无障碍名称和键盘进入能力，不能将整张封面图设成透明。一次完整点击/触控只进入一次，不在 pointerdown 时提前撤掉封面；隔离本次手势，禁止继续触发下一页答案、拖拽或提交。进入第一题时仍为未作答状态。\n", "changed": true}]}, {"kind": "insert", "old": "", "new": "6）交付前同时核对封面原图与浏览器实际首屏：图中艺术标题、短副标题和设计按钮齐全且各一套，浏览器没有额外的可见 DOM/CSS 文字或按钮，点击任意位置可进入第一题。若有重复，修正 HTML 接入层；若图中文字错误，单独修正封面素材。不得用删掉艺术字、角色、按钮设计，换成空场景，或直接跳过封面的办法通过去重检查。\n\n", "change": 4, "left": [], "right": [{"text": "6）交付前同时核对封面原图与浏览器实际首屏：图中艺术标题、短副标题和设计按钮齐全且各一套，浏览器没有额外的可见 DOM/CSS 文字或按钮，点击任意位置可进入第一题。若有重复，修正 HTML 接入层；若图中文字错误，单独修正封面素材。不得用删掉艺术字、角色、按钮设计，换成空场景，或直接跳过封面的办法通过去重检查。\n\n", "changed": true}]}], "delta": 825}, {"styleCode": "blocks", "displayName": "积木教具风", "caseId": "S17", "promptText": "请严格按“积木教具风 UI规范”重新生成同一课件界面。\n\n0. 原课件保留规则\n本风格只用于 UI 视觉换肤，不得改变原课件的学科、题型、题目内容、答案、素材数量、槽位数量、组件数量、布局关系、按钮功能、计分逻辑和交互流程。原来是英语看图拼词、填空、拖拽、选择、分类、连线、逻辑推理或其他玩法，换风格后仍保持原玩法和原题目结构。主互动题页中的题干、选项、答案、字母、汉字、拼音、数字、公式、倒计时、得分、按钮文案、反馈文案和关卡信息等可变教学内容，必须由 HTML/CSS/JS 渲染，不要烘焙进背景图或题板底图。\n\n1. 整体视觉与布局\n风格识别锚点：第一眼应像软积木 STEM 教具台。使用哑光软积木、浅色教育背景、红黄蓝绿几何积木、积木墙、几何色块和教育吉祥物；中央是清晰拼搭或空间认知互动区，整体极简、安全、教育感强。\n采用浅色教室或建构区背景和中央工作板。画面可以有积木、算盘、木质托盘、几何教具、彩色方块和学习桌面。积木只作为 UI 边框、按钮、素材池或卡片质感，不新增搭建玩法。\n使用横版课件画布，画布主体集中在中央学习区，四周保留安全边距。顶部保留原课件已有标题、关卡、进度、奖励、倒计时或得分信息；中央按原课件布局放置题目、图片区、网格、线索、选项、素材池、槽位或操作区；底部或右侧保留原有按钮和工具按钮。背景只提供氛围，不承担学习信息。\n\n2. 封面图规范与生图提示词逻辑\n【本节适用范围】第2节是完整封面设计，第3节是进入后的主互动页背景，两者必须分别生成、分别使用。封面继续执行本节第3项的原有美术描述，包括艺术字、角色、场景、材质、副标题载体和按钮设计；不得把它改成“空背景＋普通HTML标题按钮”。第3节的无文字、无按钮、中央留白要求，以及第4—6节的题板、标准正文字体、学习区低干扰规则，只约束主互动页，不得用来删减封面。除用户在本次调整中明确要求不要封面外，仍按原版规范生成完整图片式首页。\n\n1）封面图用于儿童互动课件首页。封面图本身必须生成主标题、副标题和进入按钮；副标题不得超过15个字，图上不生成任何额外文字、包括风格名、品牌名、logo、水印、二维码、角标、色值、尺寸标记、伪文字或无关宣传语都不允许生成。封面图中的主标题、副标题、按钮造型和按钮文字是最终可见内容，必须保留。HTML 不得在这张封面图上再次叠加可见标题、副标题、按钮、按钮文字或底座；只配置覆盖封面的透明点击层，点击封面任意位置进入原课件。这里禁止的是 HTML 重复叠加，不是禁止图片生成标题或按钮。\n2）主标题、副标题和按钮文案都是可变元素，必须根据当前课件真实内容替换；若为英语课件则尽量用英文，若非英语课件则一律用中文。标题、短副标题和进入按钮需要沿同一视觉主轴组织，层级清楚、可读性强，适合课堂投屏。\n3）本视觉风格封面的生图提示词：\n3D粘土哑光软积木儿童封面，浅色教育背景，红黄蓝绿几何积木、积木塔、几何色块、木质小桌和可爱狮子教育吉祥物。画面中心上方生成彩色积木堆叠质感大标题“{标题内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，标题厚实圆润、白描边、带星星和小积木装饰。标题下方生成短副标题“{副标题内容根据课件真实内容填充，副标题不超过15个字，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，放在蓝色或黄色圆角标签内。中下方生成奶油黄或橙色圆角按钮，按钮文字为“{进入游戏，按钮内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，按钮带积木颗粒和小箭头。\n\n4）封面接入顺序：先根据真实课件确认主标题、短副标题和进入文案，再依照上面的原版美术描述生成一张完整封面图；将它完整适配课件舞台，不裁掉文字、角色或按钮，也不把整张封面当作中间的小插图套进另一张封面。仅在封面容器内移除或隐藏源 HTML 的标题、副标题、示例插画和可见开始按钮，清理伪元素及 CSS 背景中重复的文字/按钮；主互动页的题干、选项、答案、控件和逻辑全部保留。不要因源课件原来使用 HTML 标题而继续保留第二套可见封面。\n5）透明点击层只承接进入事件，不绘制文字、图标、背景、边框、阴影或底座；可保留不可见的无障碍名称和键盘进入能力，不能将整张封面图设成透明。一次完整点击/触控只进入一次，不在 pointerdown 时提前撤掉封面；隔离本次手势，禁止继续触发下一页答案、拖拽或提交。进入第一题时仍为未作答状态。\n6）交付前同时核对封面原图与浏览器实际首屏：图中艺术标题、短副标题和设计按钮齐全且各一套，浏览器没有额外的可见 DOM/CSS 文字或按钮，点击任意位置可进入第一题。若有重复，修正 HTML 接入层；若图中文字错误，单独修正封面素材。不得用删掉艺术字、角色、按钮设计，换成空场景，或直接跳过封面的办法通过去重检查。\n\n3. 背景图规范与生图提示词逻辑\n1）背景图只用于提供风格氛围，不强行生成题目承载区域。题目白板、任务板、卡片、槽位、按钮和状态栏应由 HTML/CSS/JS 根据当前课件内容绘制，并覆盖在背景图上。背景图中不要生成框、白板、题板、任务板、玻璃板、卡片、按钮、标题、题目文字、选项文字、数字、字母、汉字、格线、槽位、logo、水印或二维码。\n2）背景图可以参考该风格 bg 图和 cover 图的视觉感觉自由延展，但只保留场景、色彩、材质、角色气质和边缘装饰；画面中心应保持开阔、低干扰，方便前端绘制适配当前题型的题板。\n3）本视觉风格背景图的生图提示词：\n3D粘土哑光软积木教育背景，浅色教室或玩具房氛围，红黄蓝绿积木、几何块、积木塔、木质教具和可爱狮子吉祥物放在边缘。画面中心保持开阔浅色背景，方便 HTML/CSS/JS 绘制拼搭互动题板。不要生成白板框、拼搭区框、任务板、按钮、标题、文字、图标、logo、水印或二维码。\n\n4. 按钮、字体与触控规范\n按钮使用积木块、木质按键或圆角托盘按钮，边界清楚、可点击感强。字体清晰圆润，数字、字母和符号不得被积木纹理遮挡。\n本课件面向小学低中高年级儿童，所有核心文字和可点击区域必须适合课堂投屏、互动屏和平板触控。题干、核心选项、按钮文字和状态数字要使用明显偏大的字号，普通提示文字也要清楚可读；主按钮、选项卡、拖拽块和槽位要有足够大的触碰面积和间距，儿童手指点击不容易误触。按钮必须有清楚边界、高对比文字、按压反馈和禁用态；不要把关键文字做得过小、过细、过浅或压在复杂纹理上。\n\n5. 色彩、材质与装饰密度\n色彩以奶油白、浅木色、积木红、积木蓝、积木黄、薄荷绿和柔和红为主。\n色彩只作为视觉方向，不在图片中显示任何色号、色卡编号、代码、CSS 文本或设计参数。整体保持明亮、干净、护眼，避免大面积深色、强霓虹、复杂渐变和高压迫背景。装饰密度必须低于学习内容，角色、花草、糖果、气泡、电话线、科技光线或海图道具只放在边缘、角落或低层背景，不得穿过题目、选项、槽位、网格、按钮和反馈区域。\n\n6. UI层级与反馈\n底层是风格化背景，只提供氛围；中层是主主题板和内部功能卡片，盖在背景图上，由html/CSS/JS 绘制适合本风格的题板区域，是最高信息承载层；上层是可拖拽对象、选项、按钮、反馈条和当前选中态；弹窗层用于结果、时间到或完成反馈，必须有遮罩或清楚的独立卡片，不 留原有按钮和工具按钮。背景只提供氛围，不承担学习信息。\n\n2. 封面图规范与生图提示词逻辑\n【本节适用范围】第2节是完整封面设计，第3节是进入后的主互动页背景，两者必须分别生成、分别使用。封面继续执行本节第3项的原有美术描述，包括艺术字、角色、场景、材质、副标题载体和按钮设计；不得把它改成“空背景＋普通HTML标题按钮”。第3节的无文字、无按钮、中央留白要求，以及第4—6节的题板、标准正文字体、学习区低干扰规则，只约束主互动页，不得用来删减封面。除用户在本次调整中明确要求不要封面外，仍按原版规范生成完整图片式首页。\n\n1）封面图用于儿童互动课件首页。封面图本身必须生成主标题、副标题和进入按钮；副标题不得超过15个字，图上不生成任何额外文字、包括风格名、品牌名、logo、水印、二维码、角标、色值、尺寸标记、伪文字或无关宣传语都不允许生成。封面图中的主标题、副标题、按钮造型和按钮文字是最终可见内容，必须保留。HTML 不得在这张封面图上再次叠加可见标题、副标题、按钮、按钮文字或底座；只配置覆盖封面的透明点击层，点击封面任意位置进入原课件。这里禁止的是 HTML 重复叠加，不是禁止图片生成标题或按钮。\n2）主标题、副标题和按钮文案都是可变元素，必须根据当前课件真实内容替换；若为英语课件则尽量用英文，若非英语课件则一律用中文。标题、短副标题和进入按钮需要沿同一视觉主轴组织，层级清楚、可读性强，适合课堂投屏。\n3）本视觉风格封面的生图提示词：\n3D粘土哑光软积木儿童封面，浅色教育背景，红黄蓝绿几何积木、积木塔、几何色块、木质小桌和可爱狮子教育吉祥物。画面中心上方生成彩色积木堆叠质感大标题“{标题内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，标题厚实圆润、白描边、带星星和小积木装饰。标题下方生成短副标题“{副标题内容根据课件真实内容填充，副标题不超过15个字，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，放在蓝色或黄色圆角标签内。中下方生成奶油黄或橙色圆角按钮，按钮文字为“{进入游戏，按钮内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，按钮带积木颗粒和小箭头。\n\n4）封面接入顺序：先根据真实课件确认主标题、短副标题和进入文案，再依照上面的原版美术描述生成一张完整封面图；将它完整适配课件舞台，不裁掉文字、角色或按钮，也不把整张封面当作中间的小插图套进另一张封面。仅在封面容器内移除或隐藏源 HTML 的标题、副标题、示例插画和可见开始按钮，清理伪元素及 CSS 背景中重复的文字/按钮；主互动页的题干、选项、答案、控件和逻辑全部保留。不要因源课件原来使用 HTML 标题而继续保留第二套可见封面。\n5）透明点击层只承接进入事件，不绘制文字、图标、背景、边框、阴影或底座；可保留不可见的无障碍名称和键盘进入能力，不能将整张封面图设成透明。一次完整点击/触控只进入一次，不在 pointerdown 时提前撤掉封面；隔离本次手势，禁止继续触发下一页答案、拖拽或提交。进入第一题时仍为未作答状态。\n6）交付前同时核对封面原图与浏览器实际首屏：图中艺术标题、短副标题和设计按钮齐全且各一套，浏览器没有额外的可见 DOM/CSS 文字或按钮，点击任意位置可进入第一题。若有重复，修正 HTML 接入层；若图中文字错误，单独修正封面素材。不得用删掉艺术字、角色、按钮设计，换成空场景，或直接跳过封面的办法通过去重检查。\n\n3. 背景图规范与生图提示词逻辑\n1）背景图只用于提供风格氛围，不强行生成题目承载区域。题目白板、任务板、卡片、槽位、按钮和状态栏应由 HTML/CSS/JS 根据当前课件内容绘制，并覆盖在背景图上。背景图中不要生成框、白板、题板、任务板、玻璃板、卡片、按钮、标题、题目文字、选项文字、数字、字母、汉字、格线、槽位、logo、水印或二维码。\n2）背景图可以参考该风格 bg 图和 cover 图的视觉感觉自由延展，但只保留场景、色彩、材质、角色气质和边缘装饰；画面中心应保持开阔、低干扰，方便前端绘制适配当前题型的题板。\n3）本视觉风格背景图的生图提示词：\n3D粘土哑光软积木教育背景，浅色教室或玩具房氛围，红黄蓝绿积木、几何块、积木塔、木质教具和可爱狮子吉祥物放在边缘。画面中心保持开阔浅色背景，方便 HTML/CSS/JS 绘制拼搭互动题板。不要生成白板框、拼搭区框、任务板、按钮、标题、文字、图标、logo、水印或二维码。\n\n4. 按钮、字体与触控规范\n按钮使用积木块、木质按键或圆角托盘按钮，边界清楚、可点击感强。字体清晰圆润，数字、字母和符号不得被积木纹理遮挡。\n本课件面向小学低中高年级儿童，所有核心文字和可点击区域必须适合课堂投屏、互动屏和平板触控。题干、核心选项、按钮文字和状态数字要使用明显偏大的字号，普通提示文字也要清楚可读；主按钮、选项卡、拖拽块和槽位要有足够大的触碰面积和间距，儿童手指点击不容易误触。按钮必须有清楚边界、高对比文字、按压反馈和禁用态；不要把关键文字做得过小、过细、过浅或压在复杂纹理上。\n\n5. 色彩、材质与装饰密度\n色彩以奶油白、浅木色、积木红、积木蓝、积木黄、薄荷绿和柔和红为主。\n色彩只作为视觉方向，不在图片中显示任何色号、色卡编号、代码、CSS 文本或设计参数。整体保持明亮、干净、护眼，避免大面积深色、强霓虹、复杂渐变和高压迫背景。装饰密度必须低于学习内容，角色、花草、糖果、气泡、电话线、科技光线或海图道具只放在边缘、角落或低层背景，不得穿过题目、选项、槽位、网格、按钮和反馈区域。\n\n6. UI层级与反馈\n底层是风格化背景，只提供氛围；中层是主主题板和内部功能卡片，盖在背景图上，由html/CSS/JS 绘制适合本风格的题板区域，是最高信息承载层；上层是可拖拽对象、选项、按钮、反馈条和当前选中态；弹窗层用于结果、时间到或完成反馈，必须有遮罩或清楚的独立卡片，不能遮挡关键学习内容。\n正确反馈使用积木拼合、绿色描边和小星星；错误反馈使用柔和红边框；选中态使用积木卡扣高亮。\n所有反馈只强化原交互，不新增新玩法，不改变原题目判断逻辑。\n\n7. 音效反馈规范\n音效是 UI 反馈的一部分，必须优先匹配当前风格的专属音效；只用于强化点击、选中、拖拽、落位、提交、答对、答错、提示、完成和重置状态，不改变原课件玩法、题型、节奏和按钮功能。音效需短促、低音量、低干扰，不能循环播放，不能盖过教学语音；需遵守原课件已有静音和音量设置。若没有真实音频素材，可用平台素材库、安全音效或 WebAudio 近似实现，但仍要尽量贴近本风格音效意图。\n本风格音效：点击使用木质轻敲声，拖拽落位使用积木卡扣声，答对使用拼合完成音，答错使用柔和回弹声。\n\n8. 禁止项\n禁止生成无关实体、无关玩法、无关学科内容、伪文字、乱码、品牌名、公司名、水印、二维码、角标、设计参数、色值、代码、CSS 标注、软件界面说明、宣传语和不可编辑的题目内容。禁止遮挡、重绘、扭曲或弱化原题目、题板、格线、槽位、按钮和反馈状态。", "sectionsOld": ["请严格按“积木教具风 UI规范”重新生成同一课件界面。\n\n", "0. 原课件保留规则\n本风格只用于 UI 视觉换肤，不得改变原课件的学科、题型、题目内容、答案、素材数量、槽位数量、组件数量、布局关系、按钮功能、计分逻辑和交互流程。原来是英语看图拼词、填空、拖拽、选择、分类、连线、逻辑推理或其他玩法，换风格后仍保持原玩法和原题目结构。主互动题页中的题干、选项、答案、字母、汉字、拼音、数字、公式、倒计时、得分、按钮文案、反馈文案和关卡信息等可变教学内容，必须由 HTML/CSS/JS 渲染，不要烘焙进背景图或题板底图。\n\n", "1. 整体视觉与布局\n风格识别锚点：第一眼应像软积木 STEM 教具台。使用哑光软积木、浅色教育背景、红黄蓝绿几何积木、积木墙、几何色块和教育吉祥物；中央是清晰拼搭或空间认知互动区，整体极简、安全、教育感强。\n采用浅色教室或建构区背景和中央工作板。画面可以有积木、算盘、木质托盘、几何教具、彩色方块和学习桌面。积木只作为 UI 边框、按钮、素材池或卡片质感，不新增搭建玩法。\n使用横版课件画布，画布主体集中在中央学习区，四周保留安全边距。顶部保留原课件已有标题、关卡、进度、奖励、倒计时或得分信息；中央按原课件布局放置题目、图片区、网格、线索、选项、素材池、槽位或操作区；底部或右侧保留原有按钮和工具按钮。背景只提供氛围，不承担学习信息。\n\n", "2. 封面图规范与生图提示词逻辑\n1）封面图用于儿童互动课件首页。封面图本身必须生成主标题、副标题和进入按钮；副标题不得超过15个字，图上不生成任何额外文字、包括风格名、品牌名、logo、水印、二维码、角标、色值、尺寸标记、伪文字或无关宣传语都不允许生成。逻辑上，从封面图任意位置点击即可进入，禁止在封面图上再生成任何文字/按钮，只需要配置点击事件。\n2）主标题、副标题和按钮文案都是可变元素，必须根据当前课件真实内容替换；若为英语课件则尽量用英文，若非英语课件则一律用中文。标题、短副标题和进入按钮需要沿同一视觉主轴组织，层级清楚、可读性强，适合课堂投屏。\n3）本视觉风格封面的生图提示词：\n3D粘土哑光软积木儿童封面，浅色教育背景，红黄蓝绿几何积木、积木塔、几何色块、木质小桌和可爱狮子教育吉祥物。画面中心上方生成彩色积木堆叠质感大标题“{标题内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，标题厚实圆润、白描边、带星星和小积木装饰。标题下方生成短副标题“{副标题内容根据课件真实内容填充，副标题不超过15个字，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，放在蓝色或黄色圆角标签内。中下方生成奶油黄或橙色圆角按钮，按钮文字为“{进入游戏，按钮内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，按钮带积木颗粒和小箭头。\n\n", "3. 背景图规范与生图提示词逻辑\n1）背景图只用于提供风格氛围，不强行生成题目承载区域。题目白板、任务板、卡片、槽位、按钮和状态栏应由 HTML/CSS/JS 根据当前课件内容绘制，并覆盖在背景图上。背景图中不要生成框、白板、题板、任务板、玻璃板、卡片、按钮、标题、题目文字、选项文字、数字、字母、汉字、格线、槽位、logo、水印或二维码。\n2）背景图可以参考该风格 bg 图和 cover 图的视觉感觉自由延展，但只保留场景、色彩、材质、角色气质和边缘装饰；画面中心应保持开阔、低干扰，方便前端绘制适配当前题型的题板。\n3）本视觉风格背景图的生图提示词：\n3D粘土哑光软积木教育背景，浅色教室或玩具房氛围，红黄蓝绿积木、几何块、积木塔、木质教具和可爱狮子吉祥物放在边缘。画面中心保持开阔浅色背景，方便 HTML/CSS/JS 绘制拼搭互动题板。不要生成白板框、拼搭区框、任务板、按钮、标题、文字、图标、logo、水印或二维码。\n\n", "4. 按钮、字体与触控规范\n按钮使用积木块、木质按键或圆角托盘按钮，边界清楚、可点击感强。字体清晰圆润，数字、字母和符号不得被积木纹理遮挡。\n本课件面向小学低中高年级儿童，所有核心文字和可点击区域必须适合课堂投屏、互动屏和平板触控。题干、核心选项、按钮文字和状态数字要使用明显偏大的字号，普通提示文字也要清楚可读；主按钮、选项卡、拖拽块和槽位要有足够大的触碰面积和间距，儿童手指点击不容易误触。按钮必须有清楚边界、高对比文字、按压反馈和禁用态；不要把关键文字做得过小、过细、过浅或压在复杂纹理上。\n\n", "5. 色彩、材质与装饰密度\n色彩以奶油白、浅木色、积木红、积木蓝、积木黄、薄荷绿和柔和红为主。\n色彩只作为视觉方向，不在图片中显示任何色号、色卡编号、代码、CSS 文本或设计参数。整体保持明亮、干净、护眼，避免大面积深色、强霓虹、复杂渐变和高压迫背景。装饰密度必须低于学习内容，角色、花草、糖果、气泡、电话线、科技光线或海图道具只放在边缘、角落或低层背景，不得穿过题目、选项、槽位、网格、按钮和反馈区域。\n\n", "6. UI层级与反馈\n底层是风格化背景，只提供氛围；中层是主主题板和内部功能卡片，盖在背景图上，由html/CSS/JS 绘制适合本风格的题板区域，是最高信息承载层；上层是可拖拽对象、选项、按钮、反馈条和当前选中态；弹窗层用于结果、时间到或完成反馈，必须有遮罩或清楚的独立卡片，不能遮挡关键学习内容。\n正确反馈使用积木拼合、绿色描边和小星星；错误反馈使用柔和红边框；选中态使用积木卡扣高亮。\n所有反馈只强化原交互，不新增新玩法，不改变原题目判断逻辑。\n\n", "7. 音效反馈规范\n音效是 UI 反馈的一部分，必须优先匹配当前风格的专属音效；只用于强化点击、选中、拖拽、落位、提交、答对、答错、提示、完成和重置状态，不改变原课件玩法、题型、节奏和按钮功能。音效需短促、低音量、低干扰，不能循环播放，不能盖过教学语音；需遵守原课件已有静音和音量设置。若没有真实音频素材，可用平台素材库、安全音效或 WebAudio 近似实现，但仍要尽量贴近本风格音效意图。\n本风格音效：点击使用木质轻敲声，拖拽落位使用积木卡扣声，答对使用拼合完成音，答错使用柔和回弹声。\n\n", "8. 禁止项\n禁止生成无关实体、无关玩法、无关学科内容、伪文字、乱码、品牌名、公司名、水印、二维码、角标、设计参数、色值、代码、CSS 标注、软件界面说明、宣传语和不可编辑的题目内容。禁止遮挡、重绘、扭曲或弱化原题目、题板、格线、槽位、按钮和反馈状态。"], "sectionsNew": ["请严格按“积木教具风 UI规范”重新生成同一课件界面。\n\n", "0. 原课件保留规则\n本风格只用于 UI 视觉换肤，不得改变原课件的学科、题型、题目内容、答案、素材数量、槽位数量、组件数量、布局关系、按钮功能、计分逻辑和交互流程。原来是英语看图拼词、填空、拖拽、选择、分类、连线、逻辑推理或其他玩法，换风格后仍保持原玩法和原题目结构。主互动题页中的题干、选项、答案、字母、汉字、拼音、数字、公式、倒计时、得分、按钮文案、反馈文案和关卡信息等可变教学内容，必须由 HTML/CSS/JS 渲染，不要烘焙进背景图或题板底图。\n\n", "1. 整体视觉与布局\n风格识别锚点：第一眼应像软积木 STEM 教具台。使用哑光软积木、浅色教育背景、红黄蓝绿几何积木、积木墙、几何色块和教育吉祥物；中央是清晰拼搭或空间认知互动区，整体极简、安全、教育感强。\n采用浅色教室或建构区背景和中央工作板。画面可以有积木、算盘、木质托盘、几何教具、彩色方块和学习桌面。积木只作为 UI 边框、按钮、素材池或卡片质感，不新增搭建玩法。\n使用横版课件画布，画布主体集中在中央学习区，四周保留安全边距。顶部保留原课件已有标题、关卡、进度、奖励、倒计时或得分信息；中央按原课件布局放置题目、图片区、网格、线索、选项、素材池、槽位或操作区；底部或右侧保留原有按钮和工具按钮。背景只提供氛围，不承担学习信息。\n\n", "2. 封面图规范与生图提示词逻辑\n【本节适用范围】第2节是完整封面设计，第3节是进入后的主互动页背景，两者必须分别生成、分别使用。封面继续执行本节第3项的原有美术描述，包括艺术字、角色、场景、材质、副标题载体和按钮设计；不得把它改成“空背景＋普通HTML标题按钮”。第3节的无文字、无按钮、中央留白要求，以及第4—6节的题板、标准正文字体、学习区低干扰规则，只约束主互动页，不得用来删减封面。除用户在本次调整中明确要求不要封面外，仍按原版规范生成完整图片式首页。\n\n1）封面图用于儿童互动课件首页。封面图本身必须生成主标题、副标题和进入按钮；副标题不得超过15个字，图上不生成任何额外文字、包括风格名、品牌名、logo、水印、二维码、角标、色值、尺寸标记、伪文字或无关宣传语都不允许生成。封面图中的主标题、副标题、按钮造型和按钮文字是最终可见内容，必须保留。HTML 不得在这张封面图上再次叠加可见标题、副标题、按钮、按钮文字或底座；只配置覆盖封面的透明点击层，点击封面任意位置进入原课件。这里禁止的是 HTML 重复叠加，不是禁止图片生成标题或按钮。\n2）主标题、副标题和按钮文案都是可变元素，必须根据当前课件真实内容替换；若为英语课件则尽量用英文，若非英语课件则一律用中文。标题、短副标题和进入按钮需要沿同一视觉主轴组织，层级清楚、可读性强，适合课堂投屏。\n3）本视觉风格封面的生图提示词：\n3D粘土哑光软积木儿童封面，浅色教育背景，红黄蓝绿几何积木、积木塔、几何色块、木质小桌和可爱狮子教育吉祥物。画面中心上方生成彩色积木堆叠质感大标题“{标题内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，标题厚实圆润、白描边、带星星和小积木装饰。标题下方生成短副标题“{副标题内容根据课件真实内容填充，副标题不超过15个字，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，放在蓝色或黄色圆角标签内。中下方生成奶油黄或橙色圆角按钮，按钮文字为“{进入游戏，按钮内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，按钮带积木颗粒和小箭头。\n\n4）封面接入顺序：先根据真实课件确认主标题、短副标题和进入文案，再依照上面的原版美术描述生成一张完整封面图；将它完整适配课件舞台，不裁掉文字、角色或按钮，也不把整张封面当作中间的小插图套进另一张封面。仅在封面容器内移除或隐藏源 HTML 的标题、副标题、示例插画和可见开始按钮，清理伪元素及 CSS 背景中重复的文字/按钮；主互动页的题干、选项、答案、控件和逻辑全部保留。不要因源课件原来使用 HTML 标题而继续保留第二套可见封面。\n5）透明点击层只承接进入事件，不绘制文字、图标、背景、边框、阴影或底座；可保留不可见的无障碍名称和键盘进入能力，不能将整张封面图设成透明。一次完整点击/触控只进入一次，不在 pointerdown 时提前撤掉封面；隔离本次手势，禁止继续触发下一页答案、拖拽或提交。进入第一题时仍为未作答状态。\n6）交付前同时核对封面原图与浏览器实际首屏：图中艺术标题、短副标题和设计按钮齐全且各一套，浏览器没有额外的可见 DOM/CSS 文字或按钮，点击任意位置可进入第一题。若有重复，修正 HTML 接入层；若图中文字错误，单独修正封面素材。不得用删掉艺术字、角色、按钮设计，换成空场景，或直接跳过封面的办法通过去重检查。\n\n", "3. 背景图规范与生图提示词逻辑\n1）背景图只用于提供风格氛围，不强行生成题目承载区域。题目白板、任务板、卡片、槽位、按钮和状态栏应由 HTML/CSS/JS 根据当前课件内容绘制，并覆盖在背景图上。背景图中不要生成框、白板、题板、任务板、玻璃板、卡片、按钮、标题、题目文字、选项文字、数字、字母、汉字、格线、槽位、logo、水印或二维码。\n2）背景图可以参考该风格 bg 图和 cover 图的视觉感觉自由延展，但只保留场景、色彩、材质、角色气质和边缘装饰；画面中心应保持开阔、低干扰，方便前端绘制适配当前题型的题板。\n3）本视觉风格背景图的生图提示词：\n3D粘土哑光软积木教育背景，浅色教室或玩具房氛围，红黄蓝绿积木、几何块、积木塔、木质教具和可爱狮子吉祥物放在边缘。画面中心保持开阔浅色背景，方便 HTML/CSS/JS 绘制拼搭互动题板。不要生成白板框、拼搭区框、任务板、按钮、标题、文字、图标、logo、水印或二维码。\n\n", "4. 按钮、字体与触控规范\n按钮使用积木块、木质按键或圆角托盘按钮，边界清楚、可点击感强。字体清晰圆润，数字、字母和符号不得被积木纹理遮挡。\n本课件面向小学低中高年级儿童，所有核心文字和可点击区域必须适合课堂投屏、互动屏和平板触控。题干、核心选项、按钮文字和状态数字要使用明显偏大的字号，普通提示文字也要清楚可读；主按钮、选项卡、拖拽块和槽位要有足够大的触碰面积和间距，儿童手指点击不容易误触。按钮必须有清楚边界、高对比文字、按压反馈和禁用态；不要把关键文字做得过小、过细、过浅或压在复杂纹理上。\n\n", "5. 色彩、材质与装饰密度\n色彩以奶油白、浅木色、积木红、积木蓝、积木黄、薄荷绿和柔和红为主。\n色彩只作为视觉方向，不在图片中显示任何色号、色卡编号、代码、CSS 文本或设计参数。整体保持明亮、干净、护眼，避免大面积深色、强霓虹、复杂渐变和高压迫背景。装饰密度必须低于学习内容，角色、花草、糖果、气泡、电话线、科技光线或海图道具只放在边缘、角落或低层背景，不得穿过题目、选项、槽位、网格、按钮和反馈区域。\n\n", "6. UI层级与反馈\n底层是风格化背景，只提供氛围；中层是主主题板和内部功能卡片，盖在背景图上，由html/CSS/JS 绘制适合本风格的题板区域，是最高信息承载层；上层是可拖拽对象、选项、按钮、反馈条和当前选中态；弹窗层用于结果、时间到或完成反馈，必须有遮罩或清楚的独立卡片，不能遮挡关键学习内容。\n正确反馈使用积木拼合、绿色描边和小星星；错误反馈使用柔和红边框；选中态使用积木卡扣高亮。\n所有反馈只强化原交互，不新增新玩法，不改变原题目判断逻辑。\n\n", "7. 音效反馈规范\n音效是 UI 反馈的一部分，必须优先匹配当前风格的专属音效；只用于强化点击、选中、拖拽、落位、提交、答对、答错、提示、完成和重置状态，不改变原课件玩法、题型、节奏和按钮功能。音效需短促、低音量、低干扰，不能循环播放，不能盖过教学语音；需遵守原课件已有静音和音量设置。若没有真实音频素材，可用平台素材库、安全音效或 WebAudio 近似实现，但仍要尽量贴近本风格音效意图。\n本风格音效：点击使用木质轻敲声，拖拽落位使用积木卡扣声，答对使用拼合完成音，答错使用柔和回弹声。\n\n", "8. 禁止项\n禁止生成无关实体、无关玩法、无关学科内容、伪文字、乱码、品牌名、公司名、水印、二维码、角标、设计参数、色值、代码、CSS 标注、软件界面说明、宣传语和不可编辑的题目内容。禁止遮挡、重绘、扭曲或弱化原题目、题板、格线、槽位、按钮和反馈状态。"], "section2": 3, "blocks": [{"kind": "equal", "old": "2. 封面图规范与生图提示词逻辑\n", "new": "2. 封面图规范与生图提示词逻辑\n"}, {"kind": "insert", "old": "", "new": "【本节适用范围】第2节是完整封面设计，第3节是进入后的主互动页背景，两者必须分别生成、分别使用。封面继续执行本节第3项的原有美术描述，包括艺术字、角色、场景、材质、副标题载体和按钮设计；不得把它改成“空背景＋普通HTML标题按钮”。第3节的无文字、无按钮、中央留白要求，以及第4—6节的题板、标准正文字体、学习区低干扰规则，只约束主互动页，不得用来删减封面。除用户在本次调整中明确要求不要封面外，仍按原版规范生成完整图片式首页。\n\n", "change": 0, "left": [], "right": [{"text": "【本节适用范围】第2节是完整封面设计，第3节是进入后的主互动页背景，两者必须分别生成、分别使用。封面继续执行本节第3项的原有美术描述，包括艺术字、角色、场景、材质、副标题载体和按钮设计；不得把它改成“空背景＋普通HTML标题按钮”。第3节的无文字、无按钮、中央留白要求，以及第4—6节的题板、标准正文字体、学习区低干扰规则，只约束主互动页，不得用来删减封面。除用户在本次调整中明确要求不要封面外，仍按原版规范生成完整图片式首页。\n\n", "changed": true}]}, {"kind": "replace", "old": "1）封面图用于儿童互动课件首页。封面图本身必须生成主标题、副标 央按原课件结构放置图片、听音按钮、题干、单词卡、字母槽、拖拽区、选项区或连线区；底部或右侧放主要操作按钮。若原课件本来是英语看图拼写，推荐形成“图片区或听音区 + 拼写槽 + 字母素材池”的清晰结构；若原课件不是英语题，只使用英语启蒙风的卡片、图标和配色，不改变原内容。\n\n2. 封面图规范与生图提示词逻辑\n【本节适用范围】第2节是完整封面设计，第3节是进入后的主互动页背景，两者必须分别生成、分别使用。封面继续执行本节第3项的原有美术描述，包括艺术字、角色、场景、材质、副标题载体和按钮设计；不得把它改成“空背景＋普通HTML标题按钮”。第3节的无文字、无按钮、中央留白要求，以及第4—6节的题板、标准正文字体、学习区低干扰规则，只约束主互动页，不得用来删减封面。除用户在本次调整中明确要求不要封面外，仍按原版规范生成完整图片式首页。\n\n1）封面图用于儿童互动课件首页。封面图本身必须生成主标题、副标题和进入按钮；副标题不得超过15个字，图上不生成任何额外文字、包括风格名、品牌名、logo、水印、二维码、角标、色值、尺寸标记、伪文字或无关宣传语都不允许生成。封面图中的主标题、副标题、按钮造型和按钮文字是最终可见内容，必须保留。HTML 不得在这张封面图上再次叠加可见标题、副标题、按钮、按钮文字或底座；只配置覆盖封面的透明点击层，点击封面任意位置进入原课件。这里禁止的是 HTML 重复叠加，不是禁止图片生成标题或按钮。\n2）主标题、副标题和按钮文案都是可变元素，必须根据当前课件真实内容替换；若为英语课件则尽量用英文，若非英语课件则一律用中文。标题、短副标题和进入按钮需要沿同一视觉主轴组织，层级清楚、可读性强，适合课堂投屏。\n3）本视觉风格封面的生图提示词：\n高饱和但干净的儿童英语启蒙封面，品牌感黄色、天空蓝、成功绿和提示青配色，阳光草地、蓝天白云、彩虹和学习小路。左侧放可爱小狗学习伙伴，画面中可有打开的英语书、字母卡、苹果闪卡和听音图标。中心上方生成大号圆润英文或中英标题“{标题内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，标题使用黄色、绿色、红色和白描边，像自然拼读 App。标题下方生成短副标题“{副标题内容根据课件真实内容填充，副标题不超过15个字，若为英语课件则尽量用英文，若非英文课件则一律用中文}”。中下方生成绿色或黄色超大圆角按钮，按钮文字为“{Let’s Start，按钮内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，按钮带白色箭头和高对比文字。\n\n4）封面接入顺序：先根据真实课件确认主标题、短副标题和进入文案，再依照上面的原版美术描述生成一张完整封面图；将它完整适配课件舞台，不裁掉文字、角色或按钮，也不把整张封面当作中间的小插图套进另一张封面。仅在封面容器内移除或隐藏源 HTML 的标题、副标题、示例插画和可见开始按钮，清理伪元素及 CSS 背景中重复的文字/按钮；主互动页的题干、选项、答案、控件和逻辑全部保留。不要因源课件原来使用 HTML 标题而继续保留第二套可见封面。\n5）透明点击层只承接进入事件，不绘制文字、图标、背景、边框、阴影或底座；可保留不可见的无障碍名称和键盘进入能力，不能将整张封面图设成透明。一次完整点击/触控只进入一次，不在 pointerdown 时提前撤掉封面；隔离本次手势，禁止继续触发下一页答案、拖拽或提交。进入第一题时仍为未作答状态。\n6）交付前同时核对封面原图与浏览器实际首屏：图中艺术标题、短副标题和设计按钮齐全且各一套，浏览器没有额外的可见 DOM/CSS 文字或按钮，点击任意位置可进入第一题。若有重复，修正 HTML 接入层；若图中文字错误，单独修正封面素材。不得用删掉艺术字、角色、按钮设计，换成空场景，或直接跳过封面的办法通过去重检查。\n\n3. 背景图规范与生图提示词逻辑\n1）背景图只用于提供风格氛围，不强行生成题目承载区域。题目白板、任务板、卡片、槽位、按钮和状态栏应由 HTML/CSS/JS 根据当前课件内容绘制，并覆盖在背景图上。背景图中不要生成框、白板、题板、任务板、玻璃板、卡片、按钮、标题、题目文字、选项文字、数字、字母、汉字、格线、槽位、logo、水印或二维码。\n2）背景图可以参考该风格 bg 图和 cover 图的视觉感觉自由延展，但只保留场景、色彩、材质、角色气质和边缘装饰；画面中心应保持开阔、低干扰，方便前端绘制适配当前题型的题板。\n3）本视觉风格背景图的生图提示词：\n明亮儿童英语启蒙背景，天空蓝、草地、白云、彩虹、打开的英语书、字母卡、苹果闪卡、听音图标和小狗学习伙伴靠边出现，一屏一个学习任务的清爽氛围。画面中心保持开阔明亮，方便 HTML/CSS/JS 绘制单词任务板和字母槽。不要生成白板框、单词卡框、按钮、标题、文字、随机字母、伪英文、logo、水印或二维码。\n\n4. 按钮、字体与触控规范\n按钮使用听音圆钮、磁贴按钮、单词卡按钮和大圆角确认按钮。听音按钮建议使用清楚的喇叭图标；提交、下一题、重置等按钮要保持原功能，不因为英语风格新增朗读、跟读或录音玩法。\n英文字母和单词必须使用圆润但标准的无衬线字体，大小写、空格和标点保持原题一致，不拉伸、不变形、不做厚重描边。中文提示、数学数字或其他学科内容跟随原课件保持清晰标准字体。所有核心文字、字母块、选项卡、拖拽块和按钮都要适合课堂投屏、互动屏和平板触控，触碰面积充足、间距舒适、边界清楚。\n\n5. 色彩、材质与装饰密度\n色彩以奶油白、天空蓝、柠檬黄、清新绿、品牌橙、浅粉和柔和红为主，整体明亮、轻快、干净，像低龄英语课堂和自然拼读闪卡。材质可用软胶卡片、磨砂白板、纸质单词卡、磁贴和轻贴纸，不使用厚重木纹、国风纸张、田字格、毛笔、卷轴或明显汉字学习元素。\n色彩只作为视觉方向，不在图片中显示任何色号、色卡编号、代码、CSS 文本或设计参数。装饰密度必须低于学习内容，字母积木、贴纸、星星、铅笔和课堂道具只放边缘或卡片角落，不能穿过题目、图片、字母槽、选项、按钮和反馈区域。\n\n6. UI层级与反馈\n底层是明亮英语课堂或学习桌背景；中层是中央单词任务板和内部闪卡，盖在背景图上，由html/CSS/JS 绘制适合本风格的题板区域；上层是听音按钮、字母块、拖拽对象、选项卡、反馈条和当前选中态；弹窗层用于结果、时间到或完成反馈，必须有遮罩或清楚独立卡片。\n正确反馈使用绿色描边、星星贴纸、单词卡轻弹和完成音；错误反馈使用柔和红边框和轻微回弹；选中态使用蓝色或黄色磁贴高亮；拖拽落位使用拼写槽点亮。所有反馈只强化原交互，不新增新玩法，不改变原题目判断逻辑。\n\n7. 音效反馈规范\n音效是 UI 反馈的一部分，必须优先匹配当前风格的专属音效；只用于强化点击、选中、拖拽、落位、提交、答对、答错、提示、完成和重置状态，不改变原课件玩法、题型、节奏和按钮功能。音效需短促、低音量、低干扰，不能循环播放，不能盖过教学语音；需遵守原课件已有静音和音量设置。若没有真实音频素材，可用平台素材库、安全音效或 WebAudio 近似实现，但仍要尽量贴近本风格音效意图。\n本风格音效：点击使用轻快磁贴声，听音按钮使用短促提示音但不覆盖原有语音，字母拖拽落位使用卡片吸附声，答对使用明亮星星奖励音，答错使用柔和回弹提示音。\n\n8. 禁止项\n禁止生成无关实体、无关玩法、无关学科内容、伪文字、乱码、伪英文单词、随机字母串、品牌名、公司名、水印、二维码、角标、设计参数、色值、代码、CSS 标注、软件界面说明、宣传语和不可编辑的题目内容。禁止遮挡、重绘、扭曲或弱化原题目、题板、格线、槽位、按钮和反馈状态。尤其禁止把汉字启蒙、田字格、毛笔、卷轴、偏旁部件等汉字学习视觉锚点混入英语启蒙风。", "basePromptSHA256": "6eafd903b0fcec09f443fab2af2b64d8d776b6bc8b8fe4df8ca3543684786adc", "promptSHA256": "dd3db3292d97481926d7e21e446df9164373f55e9ae80ec468cee8712b220c54", "status": "候选待生成验证", "changeScope": "仅第2节：图片封面与HTML职责分离；原有封面美术描述逐字保留", "kind": "base", "old": "请严格按“英语启蒙风 UI规范”重新生成同一课件界面。\n\n0. 原课件保留规则\n本风格只用于 UI 视觉换肤，不得改变原课件的学科、题型、题目内容、答案、素材数量、槽位数量、组件数量、布局关系、按钮功能、计分逻辑和交互流程。原来是英语看图拼词、填空、拖拽、选择、分类、连线、逻辑推理或其他玩法，换风格后仍保持原玩法和原题目结构。主互动题页中的题干、选项、答案、字母、单词、汉字、拼音、数字、公式、倒计时、得分、按钮文案、反馈文案和关卡信息等可变教学内容，必须由 HTML/CSS/JS 渲染，不要烘焙进背景图或题板底图。尤其禁止因为选择英语启蒙风，把原本非英语课件改成英语题；也禁止把原本英语看图拼词题改成语文、数学或其他题型。\n\n1. 整体视觉与布局\n风格识别锚点：第一眼应像高饱和但干净的儿童英语启蒙课。使用品牌感黄色、天空蓝、成功绿、提示青、超大圆润按钮、一屏一个学习任务、中央字母或单词互动区、拟人化学习伙伴和底部大按钮操作区；强化自然拼读、单词配对、听音、拼写槽和字母素材池，但不得改变原题型。\n采用“低龄英语自然拼读课堂 + 中央单词任务板”的 于结果、时间到或完成反馈，必须有遮罩或清楚独立卡片。\n正确反馈使用绿色描边、星星贴纸、单词卡轻弹和完成音；错误反馈使用柔和红边框和轻微回弹；选中态使用蓝色或黄色磁贴高亮；拖拽落位使用拼写槽点亮。所有反馈只强化原交互，不新增新玩法，不改变原题目判断逻辑。\n\n7. 音效反馈规范\n音效是 UI 反馈的一部分，必须优先匹配当前风格的专属音效；只用于强化点击、选中、拖拽、落位、提交、答对、答错、提示、完成和重置状态，不改变原课件玩法、题型、节奏和按钮功能。音效需短促、低音量、低干扰，不能循环播放，不能盖过教学语音；需遵守原课件已有静音和音量设置。若没有真实音频素材，可用平台素材库、安全音效或 WebAudio 近似实现，但仍要尽量贴近本风格音效意图。\n本风格音效：点击使用轻快磁贴声，听音按钮使用短促提示音但不覆盖原有语音，字母拖拽落位使用卡片吸附声，答对使用明亮星星奖励音，答错使用柔和回弹提示音。\n\n8. 禁止项\n禁止生成无关实体、无关玩法、无关学科内容、伪文字、乱码、伪英文单词、随机字母串、品牌名、公司名、水印、二维码、角标、设计参数、色值、代码、CSS 标注、软件界面说明、宣传语和不可编辑的题目内容。禁止遮挡、重绘、扭曲或弱化原题目、题板、格线、槽位、按钮和反馈状态。尤其禁止把汉字启蒙、田字格、毛笔、卷轴、偏旁部件等汉字学习视觉锚点混入英语启蒙风。", "new": "请严格按“英语启蒙风 UI规范”重新生成同一课件界面。\n\n0. 原课件保留规则\n本风格只用于 UI 视觉换肤，不得改变原课件的学科、题型、题目内容、答案、素材数量、槽位数量、组件数量、布局关系、按钮功能、计分逻辑和交互流程。原来是英语看图拼词、填空、拖拽、选择、分类、连线、逻辑推理或其他玩法，换风格后仍保持原玩法和原题目结构。主互动题页中的题干、选项、答案、字母、单词、汉字、拼音、数字、公式、倒计时、得分、按钮文案、反馈文案和关卡信息等可变教学内容，必须由 HTML/CSS/JS 渲染，不要烘焙进背景图或题板底图。尤其禁止因为选择英语启蒙风，把原本非英语课件改成英语题；也禁止把原本英语看图拼词题改成语文、数学或其他题型。\n\n1. 整体视觉与布局\n风格识别锚点：第一眼应像高饱和但干净的儿童英语启蒙课。使用品牌感黄色、天空蓝、成功绿、提示青、超大圆润按钮、一屏一个学习任务、中央字母或单词互动区、拟人化学习伙伴和底部大按钮操作区；强化自然拼读、单词配对、听音、拼写槽和字母素材池，但不得改变原题型。\n采用“低龄英语自然拼读课堂 + 中央单词任务板”的 UI，而不是通用儿童白板。画面第一眼应能看出是英语启蒙学习：可使用听音图标、单词卡造型、图片闪卡、字母积木、拼写槽、贴纸奖励、英语课堂小黑板、书包、铅笔、磁贴和星星奖励等视觉锚点。背景只提供氛围，不能生成真实题目文字、伪单词、乱字母、无关英文标语或品牌名。\n主学习区集中在中央大号单词任务板内。顶部承载原课件标题、关卡、进度、奖励、倒计时或得分；中央按原课件结构放置图片、听音按钮、题干、单词卡、字母槽、拖拽区、选项区或连线区；底部或右侧放主要操作按钮。若原课件本来是英语看图拼写，推荐形成“图片区或听音区 + 拼写槽 + 字母素材池”的清晰结构；若原课件不是英语题，只使用英语启蒙风的卡片、图标和配色，不改变原内容。\n\n2. 封面图规范与生图提示词逻辑\n【本节适用范围】第2节是完整封面设计，第3节是进入后的主互动页背景，两者必须分别生成、分别使用。封面继续执行本节第3项的原有美术描述，包括艺术字、角色、场景、材质、副标题载体和按钮设计；不得把它改成“空背景＋普通HTML标题按钮”。第3节的无文字、无按钮、中央留白要求，以及第4—6节的题板、标准正文字体、学习区低干扰规则，只约束主互动页，不得用来删减封面。除用户在本次调整中明确要求不要封面外，仍按原版规范生成完整图片式首页。\n\n1）封面图用于儿童互动课件首页。封面图本身必须生成主标题、副标题和进入按钮；副标题不得超过15个字，图上不生成任何额外文字、包括风格名、品牌名、logo、水印、二维码、角标、色值、尺寸标记、伪文字或无关宣传语都不允许生成。封面图中的主标题、副标题、按钮造型和按钮文字是最终可见内容，必须保留。HTML 不得在这张封面图上再次叠加可见标题、副标题、按钮、按钮文字或底座；只配置覆盖封面的透明点击层，点击封面任意位置进入原课件。这里禁止的是 HTML 重复叠加，不是禁止图片生成标题或按钮。\n2）主标题、副标题和按钮文案都是可变元素，必须根据当前课件真实内容替换；若为英语课件则尽量用英文，若非英语课件则一律用中文。标题、短副标题和进入按钮需要沿同一视觉主轴组织，层级清楚、可读性强，适合课堂投屏。\n3）本视觉风格封面的生图提示词：\n高饱和但干净的儿童英语启蒙封面，品牌感黄色、天空蓝、成功绿和提示青配色，阳光草地、蓝天白云、彩虹和学习小路。左侧放可爱小狗学习伙伴，画面中可有打开的英语书、字母卡、苹果闪卡和听音图标。中心上方生成大号圆润英文或中英标题“{标题内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，标题使用黄色、绿色、红色和白描边，像自然拼读 App。标题下方生成短副标题“{副标题内容根据课件真实内容填充，副标题不超过15个字，若为英语课件则尽量用英文，若非英文课件则一律用中文}”。中下方生成绿色或黄色超大圆角按钮，按钮文字为“{Let’s Start，按钮内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，按钮带白色箭头和高对比文字。\n\n4）封面接入顺序：先根据真实课件确认主标题、短副标题和进入文案，再依照上面的原版美术描述生成一张完整封面图；将它完整适配课件舞台，不裁掉文字、角色或按钮，也不把整张封面当作中间的小插图套进另一张封面。仅在封面容器内移除或隐藏源 HTML 的标题、副标题、示例插画和可见开始按钮，清理伪元素及 CSS 背景中重复的文字/按钮；主互动页的题干、选项、答案、控件和逻辑全部保留。不要因源课件原来使用 HTML 标题而继续保留第二套可见封面。\n5）透明点击层只承接进入事件，不绘制文字、图标、背景、边框、阴影或底座；可保留不可见的无障碍名称和键盘进入能力，不能将整张封面图设成透明。一次完整点击/触控只进入一次，不在 pointerdown 时提前撤掉封面；隔离本次手势，禁止继续触发下一页答案、拖拽或提交。进入第一题时仍为未作答状态。\n6）交付前同时核对封面原图与浏览器实际首屏：图中艺术标题、短副标题和设计按钮齐全且各一套，浏览器没有额外的可见 DOM/CSS 文字或按钮，点击任意位置可进入第一题。若有重复，修正 HTML 接入层；若图中文字错误，单独修正封面素材。不得用删掉艺术字、角色、按钮设计，换成空场景，或直接跳过封面的办法通过去重检查。\n\n3. 背景图规范与生图提示词逻辑\n1）背景图只用于提供风格氛围，不强行生成题目承载区域。题目白板、任务板、卡片、槽位、按钮和状态栏应由 HTML/CSS/JS 根据当前课件内容绘制，并覆盖在背景图上。背景图中不要生成框、白板、题板、任务板、玻璃板、卡片、按钮、标题、题目文字、选项文字、数字、字母、汉字、格线、槽位、logo、水印或二维码。\n2）背景图可以参考该风格 bg 图和 cover 图的视觉感觉自由延展，但只保留场景、色彩、材质、角色气质和边缘装饰；画面中心应保持开阔、低干扰，方便前端绘制适配当前题型的题板。\n3）本视觉风格背景图的生图提示词：\n明亮儿童英语启蒙背景，天空蓝、草地、白云、彩虹、打开的英语书、字母卡、苹果闪卡、听音图标和小狗学习伙伴靠边出现，一屏一个学习任务的清爽氛围。画面中心保持开阔明亮，方便 HTML/CSS/JS 绘制单词任务板和字母槽。不要生成白板框、单词卡框、按钮、标题、文字、随机字母、伪英文、logo、水印或二维码。\n\n4. 按钮、字体与触控规范\n按钮使用听音圆钮、磁贴按钮、单词卡按钮和大圆角确认按钮。听音按钮建议使用清楚的喇叭图标；提交、下一题、重置等按钮要保持原功能，不因为英语风格新增朗读、跟读或录音玩法。\n英文字母和单词必须使用圆润但标准的无衬线字体，大小写、空格和标点保持原题一致，不拉伸、不变形、不做厚重描边。中文提示、数学数字或其他学科内容跟随原课件保持清晰标准字体。所有核心文字、字母块、选项卡、拖拽块和按钮都要适合课堂投屏、互动屏和平板触控，触碰面积充足、间距舒适、边界清楚。\n\n5. 色彩、材质与装饰密度\n色彩以奶油白、天空蓝、柠檬黄、清新绿、品牌橙、浅粉和柔和红为主，整体明亮、轻快、干净，像低龄英语课堂和自然拼读闪卡。材质可用软胶卡片、磨砂白板、纸质单词卡、磁贴和轻贴纸，不使用厚重木纹、国风纸张、田字格、毛笔、卷轴或明显汉字学习元素。\n色彩只作为视觉方向，不在图片中显示任何色号、色卡编号、代码、CSS 文本或设计参数。装饰密度必须低于学习内容，字母积木、贴纸、星星、铅笔和课堂道具只放边缘或卡片角落，不能穿过题目、图片、字母槽、选项、按钮和反馈区域。\n\n6. UI层级与反馈\n底层是明亮英语课堂或学习桌背景；中层是中央单词任务板和内部闪卡，盖在背景图上，由html/CSS/JS 绘制适合本风格的题板区域；上层是听音按钮、字母块、拖拽对象、选项卡、反馈条和当前选中态；弹窗层用于结果、时间到或完成反馈，必须有遮罩或清楚独立卡片。\n正确反馈使用绿色描边、星星贴纸、单词卡轻弹和完成音；错误反馈使用柔和红边框和轻微回弹；选中态使用蓝色或黄色磁贴高亮；拖拽落位使用拼写槽点亮。所有反馈只强化原交互，不新增新玩法，不改变原题目判断逻辑。\n\n7. 音效反馈规范\n音效是 UI 反馈的一部分，必须优先匹配当前风格的专属音效；只用于强化点击、选中、拖拽、落位、提交、答对、答错、提示、完成和重置状态，不改变原课件玩法、题型、节奏和按钮功能。音效需短促、低音量、低干扰，不能循环播放，不能盖过教学语音；需遵守原课件已有静音和音量设置。若没有真实音频素材，可用平台素材库、安全音效或 WebAudio 近似实现，但仍要尽量贴近本风格音效意图。\n本风格音效：点击使用轻快磁贴声，听音按钮使用短促提示音但不覆盖原有语音，字母拖拽落位使用卡片吸附声，答对使用明亮星星奖励音，答错使用柔和回弹提示音。\n\n8. 禁止项\n禁止生成无关实体、无关玩法、无关学科内容、伪文字、乱码、伪英文单词、随机字母串、品牌名、公司名、水印、二维码、角标、设计参数、色值、代码、CSS 标注、软件界面说明、宣传语和不可编辑的题目内容。禁止遮挡、重绘、扭曲或弱化原题目、题板、格线、槽位、按钮和反馈状态。尤其禁止把汉字启蒙、田字格、毛笔、卷轴、偏旁部件等汉字学习视觉锚点混入英语启蒙风。", "sectionsOld": ["请严格按“英语启蒙风 UI规范”重新生成同一课件界面。\n\n", "0. 原课件保留规则\n本风格只用于 UI 视觉换肤，不得改变原课件的学科、题型、题目内容、答案、素材数量、槽位数量、组件数量、布局关系、按钮功能、计分逻辑和交互流程。原来是英语看图拼词、填空、拖拽、选择、分类、连线、逻辑推理或其他玩法，换风格后仍保持原玩法和原题目结构。主互动题页中的题干、选项、答案、字母、单词、汉字、拼音、数字、公式、倒计时、得分、按钮文案、反馈文案和关卡信息等可变教学内容，必须由 HTML/CSS/JS 渲染，不要烘焙进背景图或题板底图。尤其禁止因为选择英语启蒙风，把原本非英语课件改成英语题；也禁止把原本英语看图拼词题改成语文、数学或其他题型。\n\n", "1. 整体视觉与布局\n风格识别锚点：第一眼应像高饱和但干净的儿童英语启蒙课。使用品牌感黄色、天空蓝、成功绿、提示青、超大圆润按钮、一屏一个学习任务、中央字母或单词互动区、拟人化学习伙伴和底部大按钮操作区；强化自然拼读、单词配对、听音、拼写槽和字母素材池，但不得改变原题型。\n采用“低龄英语自然拼读课堂 + 中央单词任务板”的 UI，而不是通用儿童白板。画面第一眼应能看出是英语启蒙学习：可使用听音图标、单词卡造型、图片闪卡、字母积木、拼写槽、贴纸奖励、英语课堂小黑板、书包、铅笔、磁贴和星星奖励等视觉锚点。背景只提供氛围，不能生成真实题目文字、伪单词、乱字母、无关英文标语或品牌名。\n主学习区集中在中央大号单词任务板内。顶部承载原课件标题、关卡、进度、奖励、倒计时或得分；中央按原课件结构放置图片、听音按钮、题干、单词卡、字母槽、拖拽区、选项区或连线区；底部或右侧放主要操作按钮。若原课件本来是英语看图拼写，推荐形成“图片区或听音区 + 拼写槽 + 字母素材池”的清晰结构；若原课件不是英语题，只使用英语启蒙风的卡片、图标和配色，不改变原内容。\n\n", "2. 封面图规范与生图提示词逻辑\n1）封面图用于儿童互动课件首页。封面图本身必须生成主标题、副标题和进入按钮；副标题不得超过15个字，图上不生成任何额外文字、包括风格名、品牌名、logo、水印、二维码、角标、色值、尺寸标记、伪文字或无关宣传语都不允许生成。逻辑上，从封面图任意位置点击即可进入，禁止在封面图上再生成任何文字/按钮，只需要配置点击事件。\n2）主标题、副标题和按钮文案都是可变元素，必须根据当前课件真实内容替换；若为英语课件则尽量用英文，若非英语课件则一律用中文。标题、短副标题和进入按钮需要沿同一视觉主轴组织，层级清楚、可读性强，适合课堂投屏。\n3）本视觉风格封面的生图提示词：\n高饱和但干净的儿童英语启蒙封面，品牌感黄色、天空蓝、成功绿和提示青配色，阳光草地、蓝天白云、彩虹和学习小路。左侧放可爱小狗学习伙伴，画面中可有打开的英语书、字母卡、苹果闪卡和听音图标。中心上方生成大号圆润英文或中英标题“{标题内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，标题使用黄色、绿色、红色和白描边，像自然拼读 App。标题下方生成短副标题“{副标题内容根据课件真实内容填充，副标题不超过15个字，若为英语课件则尽量用英文，若非英文课件则一律用中文}”。中下方生成绿色或黄色超大圆角按钮，按钮文字为“{Let’s Start，按钮内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，按钮带白色箭头和高对比文字。\n\n", "3. 背景图规范与生图提示词逻辑\n1）背景图只用于提供风格氛围，不强行生成题目承载区域。题目白板、任务板、卡片、槽位、按钮和状态栏应由 HTML/CSS/JS 根据当前课件内容绘制，并覆盖在背景图上。背景图中不要生成框、白板、题板、任务板、玻璃板、卡片、按钮、标题、题目文字、选项文字、数字、字母、汉字、格线、槽位、logo、水印或二维码。\n2）背景图可以参考该风格 bg 图和 cover 图的视觉感觉自由延展，但只保留场景、色彩、材质、角色气质和边缘装饰；画面中心应保持开阔、低干扰，方便前端绘制适配当前题型的题板。\n3）本视觉风格背景图的生图提示词：\n明亮儿童英语启蒙背景，天空蓝、草地、白云、彩虹、打开的英语书、字母卡、苹果闪卡、听音图标和小狗学习伙伴靠边出现，一屏一个学习任务的清爽氛围。画面中心保持开阔明亮，方便 HTML/CSS/JS 绘制单词任务板和字母槽。不要生成白板框、单词卡框、按钮、标题、文字、随机字母、伪英文、logo、水印或二维码。\n\n", "4. 按钮、字体与触控规范\n按钮使用听音圆钮、磁贴按钮、单词卡按钮和大圆角确认按钮。听音按钮建议使用清楚的喇叭图标；提交、下一题、重置等按钮要保持原功能，不因为英语风格新增朗读、跟读或录音玩法。\n英文字母和单词必须使用圆润但标准的无衬线字体，大小写、空格和标点保持原题一致，不拉伸、不变形、不做厚重描边。中文提示、数学数字或其他学科内容跟随原课件保持清晰标准字体。所有核心文字、字母块、选项卡、拖拽块和按钮都要适合课堂投屏、互动屏和平板触控，触碰面积充足、间距舒适、边界清楚。\n\n", "5. 色彩、材质与装饰密度\n色彩以奶油白、天空蓝、柠檬黄、清新绿、品牌橙、浅粉和柔和红为主，整体明亮、轻快、干净，像低龄英语课堂和自然拼读闪卡。材质可用软胶卡片、磨砂白板、纸质单词卡、磁贴和轻贴纸，不使用厚重木纹、国风纸张、田字格、毛笔、卷轴或明显汉字学习元素。\n色彩只作为视觉方向，不在图片中显示任何色号、色卡编号、代码、CSS 文本或设计参数。装饰密度必须低于学习内容，字母积木、贴纸、星星、铅笔和课堂道具只放边缘或卡片角落，不能穿过题目、图片、字母槽、选项、按钮和反馈区域。\n\n", "6. UI层级与反馈\n底层是明亮英语课堂或学习桌背景；中层是中央单词任务板和内部闪卡，盖在背景图上，由html/CSS/JS 绘制适合本风格的题板区域；上层是听音按钮、字母块、拖拽对象、选项卡、反馈条和当前选中态；弹窗层用于结果、时间到或完成反馈，必须有遮罩或清楚独立卡片。\n正确反馈使用绿色描边、星星贴纸、单词卡轻弹和完成音；错误反馈使用柔和红边框和轻微回弹；选中态使用蓝色或黄色磁贴高亮；拖拽落位使用拼写槽点亮。所有反馈只强化原交互，不新增新玩法，不改变原题目判断逻辑。\n\n", "7. 音效反馈规范\n音效是 UI 反馈的一部分，必须优先匹配当前风格的专属音效；只用于强化点击、选中、拖拽、落位、提交、答对、答错、提示、完成和重置状态，不改变原课件玩法、题型、节奏和按钮功能。音效需短促、低音量、低干扰，不能循环播放，不能盖过教学语音；需遵守原课件已有静音和音量设置。若没有真实音频素材，可用平台素材库、安全音效或 WebAudio 近似实现，但仍要尽量贴近本风格音效意图。\n本风格音效：点击使用轻快磁贴声，听音按钮使用短促提示音但不覆盖原有语音，字母拖拽落位使用卡片吸附声，答对使用明亮星星奖励音，答错使用柔和回弹提示音。\n\n", "8. 禁止项\n禁止生成无关实体、无关玩法、无关学科内容、伪文字、乱码、伪英文单词、随机字母串、品牌名、公司名、水印、二维码、角标、设计参数、色值、代码、CSS 标注、软件界面说明、宣传语和不可编辑的题目内容。禁止遮挡、重绘、扭曲或弱化原题目、题板、格线、槽位、按钮和反馈状态。尤其禁止把汉字启蒙、田字格、毛笔、卷轴、偏旁部件等汉字学习视觉锚点混入英语启蒙风。"], "sectionsNew": ["请严格按“英语启蒙风 UI规范”重新生成同一课件界面。\n\n", "0. 原课件保留规则\n本风格只用于 UI 视觉换肤，不得改变原课件的学科、题型、题目内容、答案、素材数量、槽位数量、组件数量、布局关系、按钮功能、计分逻辑和交互流程。原来是英语看图拼词、填空、拖拽、选择、分类、连线、逻辑推理或其他玩法，换风格后仍保持原玩法和原题目结构。主互动题页中的题干、选项、答案、字母、单词、汉字、拼音、数字、公式、倒计时、得分、按钮文案、反馈文案和关卡信息等可变教学内容，必须由 HTML/CSS/JS 渲染，不要烘焙进背景图或题板底图。尤其禁止因为选择英语启蒙风，把原本非英语课件改成英语题；也禁止把原本英语看图拼词题改成语文、数学或其他题型。\n\n", "1. 整体视觉与布局\n风格识别锚点：第一眼应像高饱和但干净的儿童英语启蒙课。使用品牌感黄色、天空蓝、成功绿、提示青、超大圆润按钮、一屏一个学习任务、中央字母或单词互动区、拟人化学习伙伴和底部大按钮操作区；强化自然拼读、单词配对、听音、拼写槽和字母素材池，但不得改变原题型。\n采用“低龄英语自然拼读课堂 + 中央单词任务板”的 UI，而不是通用儿童白板。画面第一眼应能看出是英语启蒙学习：可使用听音图标、单词卡造型、图片闪卡、字母积木、拼写槽、贴纸奖励、英语课堂小黑板、书包、铅笔、磁贴和星星奖励等视觉锚点。背景只提供氛围，不能生成真实题目文字、伪单词、乱字母、无关英文标语或品牌名。\n主学习区集中在中央大号单词任务板内。顶部承载原课件标题、关卡、进度、奖励、倒计时或得分；中央按原课件结构放置图片、听音按钮、题干、单词卡、字母槽、拖拽区、选项区或连线区；底部或右侧放主要操作按钮。若原课件本来是英语看图拼写，推荐形成“图片区或听音区 + 拼写槽 + 字母素材池”的清晰结构；若原课件不是英语题，只使用英语启蒙风的卡片、图标和配色，不改变原内容。\n\n", "2. 封面图规范与生图提示词逻辑\n【本节适用范围】第2节是完整封面设计，第3节是进入后的主互动页背景，两者必须分别生成、分别使用。封面继续执行本节第3项的原有美术描述，包括艺术字、角色、场景、材质、副标题载体和按钮设计；不得把它改成“空背景＋普通HTML标题按钮”。第3节的无文字、无按钮、中央留白要求，以及第4—6节的题板、标准正文字体、学习区低干扰规则，只约束主互动页，不得用来删减封面。除用户在本次调整中明确要求不要封面外，仍按原版规范生成完整图片式首页。\n\n1）封面图用于儿童互动课件首页。封面图本身必须生成主标题、副标题和进入按钮；副标题不得超过15个字，图上不生成任何额外文字、包括风格名、品牌名、logo、水印、二维码、角标、色值、尺寸标记、伪文字或无关宣传语都不允许生成。封面图中的主标题、副标题、按钮造型和按钮文字是最终可见内容，必须保留。HTML 不得在这张封面图上再次叠加可见标题、副标题、按钮、按钮文字或底座；只配置覆盖封面的透明点击层，点击封面任意位置进入原课件。这里禁止的是 HTML 重复叠加，不是禁止图片生成标题或按钮。\n2）主标题、副标题和按钮文案都是可变元素，必须根据当前课件真实内容替换；若为英语课件则尽量用英文，若非英语课件则一律用中文。标题、短副标题和进入按钮需要沿同一视觉主轴组织，层级清楚、可读性强，适合课堂投屏。\n3）本视觉风格封面的生图提示词：\n高饱和但干净的儿童英语启蒙封面，品牌感黄色、天空蓝、成功绿和提示青配色，阳光草地、蓝天白云、彩虹和学习小路。左侧放可爱小狗学习伙伴，画面中可有打开的英语书、字母卡、苹果闪卡和听音图标。中心上方生成大号圆润英文或中英标题“{标题内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，标题使用黄色、绿色、红色和白描边，像自然拼读 App。标题下方生成短副标题“{副标题内容根据课件真实内容填充，副标题不超过15个字，若为英语课件则尽量用英文，若非英文课件则一律用中文}”。中下方生成绿色或黄色超大圆角按钮，按钮文字为“{Let’s Start，按钮内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，按钮带白色箭头和高对比文字。\n\n4）封面接入顺序：先根据真实课件确认主标题、短副标题和进入文案，再依照上面的原版美术描述生成一张完整封面图；将它完整适配课件舞台，不裁掉文字、角色或按钮，也不把整张封面当作中间的小插图套进另一张封面。仅在封面容器内移除或隐藏源 HTML 的标题、副标题、示例插画和可见开始按钮，清理伪元素及 CSS 背景中重复的文字/按钮；主互动页的题干、选项、答案、控件和逻辑全部保留。不要因源课件原来使用 HTML 标题而继续保留第二套可见封面。\n5）透明点击层只承接进入事件，不绘制文字、图标、背景、边框、阴影或底座；可保留不可见的无障碍名称和键盘进入能力，不能将整张封面图设成透明。一次完整点击/触控只进入一次，不在 pointerdown 时提前撤掉封面；隔离本次手势，禁止继续触发下一页答案、拖拽或提交。进入第一题时仍为未作答状态。\n6）交付前同时核对封面原图与浏览器实际首屏：图中艺术标题、短副标题和设计按钮齐全且各一套，浏览器没有额外的可见 DOM/CSS 文字或按钮，点击任意位置可进入第一题。若有重复，修正 HTML 接入层；若图中文字错误，单独修正封面素材。不得用删掉艺术字、角色、按钮设计，换成空场景，或直接跳过封面的办法通过去重检查。\n\n", "3. 背景图规范与生图提示词逻辑\n1）背景图只用于提供风格氛围，不强行生成题目承载区域。题目白板、任务板、卡片、槽位、按钮和状态栏应由 HTML/CSS/JS 根据当前课件内容绘制，并覆盖在背景图上。背景图中不要生成框、白板、题板、任务板、玻璃板、卡片、按钮、标题、题目文字、选项文字、数字、字母、汉字、格线、槽位、logo、水印或二维码。\n2）背景图可以参考该风格 bg 图和 cover 图的视觉感觉自由延展，但只保留场景、色彩、材质、角色气质和边缘装饰；画面中心应保持开阔、低干扰，方便前端绘制适配当前题型的题板。\n3）本视觉风格背景图的生图提示词：\n明亮儿童英语启蒙背景，天空蓝、草地、白云、彩虹、打开的英语书、字母卡、苹果闪卡、听音图标和小狗学习伙伴靠边出现，一屏一个学习任务的清爽氛围。画面中心保持开阔明亮，方便 HTML/CSS/JS 绘制单词任务板和字母槽。不要生成白板框、单词卡框、按钮、标题、文字、随机字母、伪英文、logo、水印或二维码。\n\n", "4. 按钮、字体与触控规范\n按钮使用听音圆钮、磁贴按钮、单词卡按钮和大圆角确认按钮。听音按钮建议使用清楚的喇叭图标；提交、下一题、重置等按钮要保持原功能，不因为英语风格新增朗读、跟读或录音玩法。\n英文字母和单词必须使用圆润但标准的无衬线字体，大小写、空格和标点保持原题一致，不拉伸、不变形、不做厚重描边。中文提示、数学数字或其他学科内容跟随原课件保持清晰标准字体。所有核心文字、字母块、选项卡、拖拽块和按钮都要适合课堂投屏、互动屏和平板触控，触碰面积充足、间距舒适、边界清楚。\n\n", "5. 色彩、材质与装饰密度\n色彩以奶油白、天空蓝、柠檬黄、清新绿、品牌橙、浅粉和柔和红为主，整体明亮、轻快、干净，像低龄英语课堂和自然拼读闪卡。材质可用软胶卡片、磨砂白板、纸质单词卡、磁贴和轻贴纸，不使用厚重木纹、国风纸张、田字格、毛笔、卷轴或明显汉字学习元素。\n色彩只作为视觉方向，不在图片中显示任何色号、色卡编号、代码、CSS 文本或设计参数。装饰密度必须低于学习内容，字母积木、贴纸、星星、铅笔和课堂道具只放边缘或卡片角落，不能穿过题目、图片、字母槽、选项、按钮和反馈区域。\n\n", "6. UI层级与反馈\n底层是明亮英语课堂或学习桌背景；中层是中央单词任务板和内部闪卡，盖在背景图上，由html/CSS/JS 绘制适合本风格的题板区域；上层是听音按钮、字母块、拖拽对象、选项卡、反馈条和当前选中态；弹窗层用于结果、时间到或完成反馈，必须有遮罩或清楚独立卡片。\n正确反馈使用绿色描边、星星贴纸、单词卡轻弹和完成音；错误反馈使用柔和红边框和轻微回弹；选中态使用蓝色或黄色磁贴高亮；拖拽落位使用拼写槽点亮。所有反馈只强化原交互，不新增新玩法，不改变原题目判断逻辑。\n\n", "7. 音效反馈规范\n音效是 UI 反馈的一部分，必须优先匹配当前风格的专属音效；只用于强化点击、选中、拖拽、落位、提交、答对、答错、提示、完成和重置状态，不改变原课件玩法、题型、节奏和按钮功能。音效需短促、低音量、低干扰，不能循环播放，不能盖过教学语音；需遵守原课件已有静音和音量设置。若没有真实音频素材，可用平台素材库、安全音效或 WebAudio 近似实现，但仍要尽量贴近本风格音效意图。\n本风格音效：点击使用轻快磁贴声，听音按钮使用短促提示音但不覆盖原有语音，字母拖拽落位使用卡片吸附声，答对使用明亮星星奖励音，答错使用柔和回弹提示音。\n\n", "8. 禁止项\n禁止生成无关实体、无关玩法、无关学科内容、伪文字、乱码、伪英文单词、随机字母串、品牌名、公司名、水印、二维码、角标、设计参数、色值、代码、CSS 标注、软件界面说明、宣传语和不可编辑的题目内容。禁止遮挡、重绘、扭曲或弱化原题目、题板、格线、槽位、按钮和反馈状态。尤其禁止把汉字启蒙、田字格、毛笔、卷轴、偏旁部件等汉字学习视觉锚点混入英语启蒙风。"], "section2": 3, "blocks": [{"kind": "equal", "old": "2. 封面图规范与生图提示词逻辑\n", "new": "2. 封面图规范与生图提示词逻辑\n"}, {"kind": "insert", "old": "", "new": "【本节适用范围】第2节是完整封面设计，第3节是进入后的主互动页背景，两者必须分别生成、分别使用。封面继续执行本节第3项的原有美术描述，包括艺术字、角色、场景、材质、副标题载体和按钮设计；不得把它改成“空背景＋普通HTML标题按钮”。第3节的无文字、无按钮、中央留白要求，以及第4—6节的题板、标准正文字体、学习区低干扰规则，只约束主互动页，不得用来删减封面。除用户在本次调整中明确要求不要封面外，仍按原版规范生成完整图片式首页。\n\n", "change": 0, "left": [], "right": [{"t 标题内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，标题使用黄色、绿色、红色和白描边，像自然拼读 App。标题下方生成短副标题“{副标题内容根据课件真实内容填充，副标题不超过15个字，若为英语课件则尽量用英文，若非英文课件则一律用中文}”。中下方生成绿色或黄色超大圆角按钮，按钮文字为“{Let’s Start，按钮内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，按钮带白色箭头和高对比文字。\n\n"}, {"kind": "insert", "old": "", "new": "4）封面接入顺序：先根据真实课件确认主标题、短副标题和进入文案，再依照上面的原版美术描述生成一张完整封面图；将它完整适配课件舞台，不裁掉文字、角色或按钮，也不把整张封面当作中间的小插图套进另一张封面。仅在封面容器内移除或隐藏源 HTML 的标题、副标题、示例插画和可见开始按钮，清理伪元素及 CSS 背景中重复的文字/按钮；主互动页的题干、选项、答案、控件和逻辑全部保留。不要因源课件原来使用 HTML 标题而继续保留第二套可见封面。\n", "change": 2, "left": [], "right": [{"text": "4）封面接入顺序：先根据真实课件确认主标题、短副标题和进入文案，再依照上面的原版美术描述生成一张完整封面图；将它完整适配课件舞台，不裁掉文字、角色或按钮，也不把整张封面当作中间的小插图套进另一张封面。仅在封面容器内移除或隐藏源 HTML 的标题、副标题、示例插画和可见开始按钮，清理伪元素及 CSS 背景中重复的文字/按钮；主互动页的题干、选项、答案、控件和逻辑全部保留。不要因源课件原来使用 HTML 标题而继续保留第二套可见封面。\n", "changed": true}]}, {"kind": "insert", "old": "", "new": "5）透明点击层只承接进入事件，不绘制文字、图标、背景、边框、阴影或底座；可保留不可见的无障碍名称和键盘进入能力，不能将整张封面图设成透明。一次完整点击/触控只进入一次，不在 pointerdown 时提前撤掉封面；隔离本次手势，禁止继续触发下一页答案、拖拽或提交。进入第一题时仍为未作答状态。\n", "change": 3, "left": [], "right": [{"text": "5）透明点击层只承接进入事件，不绘制文字、图标、背景、边框、阴影或底座；可保留不可见的无障碍名称和键盘进入能力，不能将整张封面图设成透明。一次完整点击/触控只进入一次，不在 pointerdown 时提前撤掉封面；隔离本次手势，禁止继续触发下一页答案、拖拽或提交。进入第一题时仍为未作答状态。\n", "changed": true}]}, {"kind": "insert", "old": "", "new": "6）交付前同时核对封面原图与浏览器实际首屏：图中艺术标题、短副标题和设计按钮齐全且各一套，浏览器没有额外的可见 DOM/CSS 文字或按钮，点击任意位置可进入第一题。若有重复，修正 HTML 接入层；若图中文字错误，单独修正封面素材。不得用删掉艺术字、角色、按钮设计，换成空场景，或直接跳过封面的办法通过去重检查。\n\n", "change": 4, "left": [], "right": [{"text": "6）交付前同时核对封面原图与浏览器实际首屏：图中艺术标题、短副标题和设计按钮齐全且各一套，浏览器没有额外的可见 DOM/CSS 文字或按钮，点击任意位置可进入第一题。若有重复，修正 HTML 接入层；若图中文字错误，单独修正封面素材。不得用删掉艺术字、角色、按钮设计，换成空场景，或直接跳过封面的办法通过去重检查。\n\n", "changed": true}]}], "delta": 825}, {"styleCode": "chinese_start", "displayName": "汉字启蒙风", "caseId": "S19", "promptText": "请严格按“汉字启蒙风 UI规范”重新生成同一课件界面。\n\n0. 原课件保留规则\n本风格只用于 UI 视觉换肤，不得改变原课件的学科、题型、题目内容、答案、素材数量、槽位数量、组件数量、布局关系、按钮功能、计分逻辑和交互流程。原来是英语看图拼词、填空、拖拽、选择、分类、连线、逻辑推理或其他玩法，换风格后仍保持原玩法和原题目结构。主互动题页中的题干、选项、答案、字母、单词、汉字、拼音、数字、公式、倒计时、得分、按钮文案、反馈文案和关卡信息等可变教学内容，必须由 HTML/CSS/JS 渲染，不要烘焙进背景图或题板底图。尤其禁止因为选择汉字启蒙风，把英语、数学或其他原课件改成语文识字题。\n\n1. 整体视觉与布局\n风格识别锚点：第一眼应像高饱和明亮的低龄汉字学习课。使用橙色、天空蓝、活力红、清新绿、温暖黄、白色大圆角内容卡片、字卡练习台、印章奖励和生活化启蒙场景；只有原课件本来是语文识字任务时，才可使用拟人汉字角色、大汉字、象形演变、听音辨字和笔画描红结构。\n采用“低龄汉字认知课堂 + 字卡练习台”的 UI，而不是通用春日白板。画面第一眼应能看出是汉字启蒙学习：可使用描红纸、田字格样式空槽、偏旁积木、笔画卡、字卡收纳盒、印章奖励、毛笔或白板笔、书卷边框、课堂小桌和温和国文启蒙道具。所有这些元素只作为 UI 结构和视觉锚点，不生成随机汉字、伪字、古文、标语或无关标题。\n主学习区集中在中央大号字卡练习台内。顶部承载原课件标题、关卡、进度、奖励、倒计时或得分；中央按原课件结构放置题干、图片、田字格样式槽位、偏旁/笔画/字卡素材池、选项区、连线区或分类区；底部或右侧放主要操作按钮。若原课件本来是汉字、偏旁、拼音或识字任务，推荐形成“目标字卡 + 田字格/结构槽 + 部件素材池”的清晰结构；若原课件不是语文题，只使用汉字启蒙风的纸张、字卡、印章和课堂道具，不改变原内容。\n\n2. 封面图规范与生图提示词逻辑\n【本节适用范围】第2节是完整封面设计，第3节是进入后的主互动页背景，两者必须分别生成、分别使用。封面继续执行本节第3项的原有美术描述，包括艺术字、角色、场景、材质、副标题载体和按钮设计；不得把它改成“空背景＋普通HTML标题按钮”。第3节的无文字、无按钮、中央留白要求，以及第4—6节的题板、标准正文字体、学习区低干扰规则，只约束主互动页，不得用来删减封面。除用户在本次调整中明确要求不要封面外，仍按原版规范生成完整图片式首页。\n\n1）封面图用于儿童互动课件首页。封面图本身必须生成主标题、副标题和进入按钮；副标题不得超过15个字，图上不生成任何额外文字、包括风格名、品牌名、logo、水印、二维码、角标、色值、尺寸标记、伪文字或无关宣传语都不允许生成。封面图中的主标题、副标题、按钮造型和按钮文字是最终可见内容，必须保留。HTML 不得在这张封面图上再次叠加可见标题、副标题、按钮、按钮文字或底座；只配置覆盖封面的透明点击层，点击封面任意位置进入原课件。这里禁止的是 HTML 重复叠加，不是禁止图片生成标题或按钮。\n2）主标题、副标题和按钮文案都是可变元素，必须根据当前课件真实内容替换；若为英语课件则尽量用英文，若非英语课件则一律用中文。标题、短副标题和进入按钮需要沿同一视觉主轴组织，层级清楚、可读性强，适合课堂投屏。\n3）本视觉风格封面的生图提示词：\n高饱和明亮的低龄汉字启蒙封面，天空蓝、草地、温暖黄、活力红和清新绿配色，儿童学习村庄、树木、小屋和彩虹。左侧可有拟人汉字角色，右侧可有小朋友、兔子学习伙伴、铅笔、字卡和田字格道具。中心上方生成圆润彩色大标题“{标题内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，标题像儿童识字 App，厚白描边、带星星和铅笔装饰。标题下方生成红色或蓝色丝带副标题“{副标题内容根据课件真实内容填充，副标题不超过15个字，若为英语课件则尽量用英文，若非英文课件则一律用中文}”。中下方生成黄色或橙色圆角按钮，按钮文字为“{开始学习，按钮内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，按钮带白色高光和小箭头。\n\n4）封面接入顺序：先根据真实课件确认主标题、短副标题和进入文案，再依照上面的原版美术描述生成一张完整封面图；将它完整适配课件舞台，不裁掉文字、角色或按钮，也不把整张封面当作中间的小插图套进另一张封面。仅在封面容器内移除或隐藏源 HTML 的标题、副标题、示例插画和可见开始按钮，清理伪元素及 CSS 背景中重复的文字/按钮；主互动页的题干、选项、答案、控件和逻辑全部保留。不要因源课件原来使用 HTML 标题而继续保留第二套可见封面。\n5）透明点击层只承接进入事件，不绘制文字、图标、背景、边框、阴影或底座；可保留不可见的无障碍名称和键盘进入能力，不能将整张封面图设成透明。一次完整点击/触控只进入一次，不在 pointerdown 时提前撤掉封面；隔离本次手势，禁止继续触发下一页答案、拖拽或提交。进入第一题时仍为未作答状态。\n6）交付前同时核对封面原图与浏览器实际首屏：图中艺术标题、短副标题和设计按钮齐全且各一套，浏览器没有额外的可见 DOM/CSS 文字或按钮，点击任意位置可进入第一题。若有重复，修正 HTML 接入层；若图中文字错误，单独修正封面素材。不得用删掉艺术字、角色、按钮设计，换成空场景，或直接跳过封面的办法通过去重检查。\n\n3. 背景图规范与生图提示词逻辑\n1）背景图只用于提供风格氛围，不强行生成题目承载区域。题目白板、任务板、卡片、槽位、按钮和状态栏应由 HTML/CSS/JS 根据当前课件内容绘制，并覆盖在背景图上。背景图中不要生成框、白板、题板、任务板、玻璃板、卡片、按钮、标题、题目文字、选项文字、数字、字母、汉字、格线、槽位、logo、水印或二维码。\n2）背景图可以参考该风格 bg 图和 cover 图的视觉感觉自由延展，但只保留场景、色彩、材质、角色气质和边缘装饰；画面中心应保持开阔、低干扰，方便前端绘制适配当前题型的题板。\n3）本视觉风格背景图的生图提示词：\n明亮低龄汉字启蒙背景，蓝天、草地、儿童学习村庄、树木、小屋、铅笔、字卡、拟人汉字角色和兔子/小朋友学习伙伴靠边放置。画面中心保持开阔、干净、低纹理，方便 HTML/CSS/JS 绘制汉字学习题板。不要生成白板框、田字格框、按钮、标题、汉字、拼音、伪汉字、logo、水印或二维码。\n\n4. 按钮、字体与触控规范\n按钮使用印章按钮、纸艺胶囊按钮、字卡按钮和温暖圆角确认按钮。开始、下一题、提交、重置等按钮保持原功能，不因为汉字风格新增描红、朗读或笔顺教学玩法。\n汉字、偏旁、拼音和笔画内容必须使用标准清晰字形，适合课堂投屏；汉字学习内容可使用清楚楷体、宋体或教学黑体，但不能装饰化变形。英语字母、单词、数学数字或其他学科内容跟随原课件保持标准字体。所有核心文字、字卡、选项卡、拖拽块和按钮都要触碰面积充足、间距舒适、边界清楚。\n\n5. 色彩、材质与装饰密度\n色彩以奶油宣纸白、浅米黄、朱砂红、竹青、浅木色、天空蓝、温暖黄和清新绿为主，整体明亮、温润、启蒙友好。材质可用轻纸张、字卡、浅木、印章、描红纸和磨砂白板，不使用英语单词卡、随机字母、霓虹科技、糖果宇宙或过度春日绘本元素。\n色彩只作为视觉方向，不在图片中显示任何色号、色卡编号、代码、CSS 文本或设计参数。装饰密度必须低于学习内容，书卷、毛笔、印章、竹叶、字卡盒和课堂道具只放边缘或卡片角落，不能穿过题目、汉字、拼音、槽位、选项、按钮和反馈区域。\n\n6. UI层级与反馈\n底层是温润国文启蒙课堂或学习桌背景；中层是中央字卡练习台和内部纸面功能卡，盖在背景图上，由html/CSS/JS 绘制适合本风格的题板区域；上层是偏旁块、笔画卡、选项、按钮、反馈条和当前选中态；弹窗层用于结果、时间到或完成反馈，必须有遮罩或清楚独立卡片。\n正确反馈使用浅绿描边、印章盖章、小星光或字卡轻弹；错误反馈使用柔和红橙边框和轻微回弹；选中态使用朱砂红或温暖黄描边；拖拽落位使用田字格或字卡槽轻亮。所有反馈只强化原交互，不新增新玩法，不改变原题目判断逻辑。\n\n7. 音效反馈规范\n音效是 UI 反馈的一部分，必须优先匹配当前风格的专属音效；只用于强化点击、选中、拖拽、落位、提交、答对、答错、提示、完成和重置状态，不改变原课件玩法、题型、节奏和按钮功能。音效需短促、低音量、低干扰，不能循环播放，不能盖过教学语音；需遵守原课件已有静音和音量设置。若没有真实音频素材，可用平台素材库、安全音效或 WebAudio 近似实现，但仍要尽量贴近本风格音效意图。\n本风格音效：点击使用白板笔或木质字卡轻点声，拖拽落位使用纸卡吸附声，答对使用轻印章和星星奖励音，答错使用柔和纸卡回弹声，不能新增与原学科冲突的朗读音。\n\n8. 禁止项\n禁止生成无关实体、无关玩法、无关学科内容、伪文字、乱码、伪汉字、书页假字、随机英文、品牌名、公司名、水印、二维码、角标、设计参数、色值、代码、CSS 标注、软件界面说明、宣传语和不可编辑的题目内容。禁止遮挡、重绘、扭曲或弱化原题目、题板、格线、槽位、按钮和反馈状态。尤其禁止把英语启蒙风的单词卡、随机字母、听音拼写 UI 误混入汉字启蒙风。", "basePromptSHA256": "4b8bba85c81671af666ecdf28cfaf7aeea5bd18311c757c2c21b8c0f7d3ab76a", "promptSHA256": "6e4b85111b0bcc24af8f6d598803ca6fd5527d7b14292cc339973a5cf4a3d3ea", "status": "候选待生成验证", "changeScope": "仅第2节：图片封面与HTML职责分离；原有封面美术描述逐字保留", "kind": "base", "old": "请严格按“汉字启蒙风 UI规范”重新生成同一课件界面。\n\n0. 原课件保留规则\n本风格只用于 UI 视觉换肤，不得改变原课件的学科、题型、题目内容、答案、素材数量、槽位数量、组件数量、布局关系、按钮功能、计分逻辑和交互流程。原来是英语看图拼词、填空、拖拽、选择、分类、连线、逻

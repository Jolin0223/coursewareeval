。HTML 不得在这张封面图上再次叠加可见标题、副标题、按钮、按钮文字或底座；只配置覆盖封面的透明点击层，点击封面任意位置进入原课件。这里禁止的是 HTML 重复叠加，不是禁止图片生成标题或按钮。\n2）主标题、副标题和按钮文案都是可变元素，必须根据当前课件真实内容替换；若为英语课件则尽量用英文，若非英语课件则一律用中文。标题、短副标题和进入按钮需要沿同一视觉主轴组织，层级清楚、可读性强，适合课堂投屏。\n3）本视觉风格封面的生图提示词：\n极简扁平儿童认知封面，奶油白和淡蓝背景，红蓝黄绿高饱和纯色元素，粗圆角线条，无复杂纹理、无阴影干扰。画面可放一个简单儿童头像、喇叭图标、几个大号扁平物品图标或几何图形，整体像低龄早教认知 App。中心上方生成大号粗圆角标题“{标题内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，标题清晰、色彩分明、无立体复杂效果。标题下方生成短副标题“{副标题内容根据课件真实内容填充，副标题不超过15个字，若为英语课件则尽量用英文，若非英文课件则一律用中文}”。中下方生成大号扁平圆角按钮，按钮文字为“{进入游戏，按钮内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，按钮颜色高对比、边界清楚。\n\n4）封面接入顺序：先根据真实课件确认主标题、短副标题和进入文案，再依照上面的原版美术描述生成一张完整封面图；将它完整适配课件舞台，不裁掉文字、角色或按钮，也不把整张封面当作中间的小插图套进另一张封面。仅在封面容器内移除或隐藏源 HTML 的标题、副标题、示例插画和可见开始按钮，清理伪元素及 CSS 背景中重复的文字/按钮；主互动页的题干、选项、答案、控件和逻辑全部保留。不要因源课件原来使用 HTML 标题而继续保留第二套可见封面。\n5）透明点击层只承接进入事件，不绘制文字、图标、背景、边框、阴影或底座；可保留不可见的无障碍名称和键盘进入能力，不能将整张封面图设成透明。一次完整点击/触控只进入一次，不在 pointerdown 时提前撤掉封面；隔离本次手势，禁止继续触发下一页答案、拖拽或提交。进入第一题时仍为未作答状态。\n6）交付前同时核对封面原图与浏览器实际首屏：图中艺术标题、短副标题和设计按钮齐全且各一套，浏览器没有额外的可见 DOM/CSS 文字或按钮，点击任意位置可进入第一题。若有重复，修正 HTML 接入层；若图中文字错误，单独修正封面素材。不得用删掉艺术字、角色、按钮设计，换成空场景，或直接跳过封面的办法通过去重检查。\n\n3. 背景图规范与生图提示词逻辑\n1）背景图只用于提供风格氛围，不强行生成题目承载区域。题目白板、任务板、卡片、槽位、按钮和状态栏应由 HTML/CSS/JS 根据当前课件内容绘制，并覆盖在背景图上。背景图中不要生成框、白板、题板、任务板、玻璃板、卡片、按钮、标题、题目文字、选项文字、数字、字母、汉字、格线、槽位、logo、水印或二维码。\n2）背景图可以参考该风格 bg 图和 cover 图的视觉感觉自由延展，但只保留场景、色彩、材质、角色气质和边缘装饰；画面中心应保持开阔、低干扰，方便前端绘制适配当前题型的题板。\n3）本视觉风格背景图的生图提示词：\n极简扁平童趣背景，奶油白、淡蓝、浅黄作为底色，少量红蓝黄绿纯色几何块、云朵、圆点、儿童头像或简单图标放在边缘，信息极简、清楚、低干扰。画面中心保持大面积空白，方便 HTML/CSS/JS 绘制早教认知题板。不要生成白板框、题板、按钮、标题、文字、数字、图标说明、logo、水印或二维码。\n\n4. 按钮、字体与触控规范\n按钮使用大尺寸扁平圆角按钮，颜色明确、文字高对比、反馈简洁。字体使用标准无衬线或圆体，避免装饰字。\n本课件面向小学低中高年级儿童，所有核心文字和可点击区域必须适合课堂投屏、互动屏和平板触控。题干、核心选项、按钮文字和状态数字要使用明显偏大的字号，普通提示文字也要清楚可读；主按钮、选项卡、拖拽块和槽位要有足够大的触碰面积和间距，儿童手指点击不容易误触。按钮必须有清楚边界、高对比文字、按压反馈和禁用态；不要把关键文字做得过小、过细、过浅或压在复杂纹理上。\n\n5. 色彩、材质与装饰密度\n色彩以白色、浅灰白、天空蓝、清新绿、温暖黄、柔和橙和柔和红为主。\n色彩只作为视觉方向，不在图片中显示任何色号、色卡编号、代码、CSS 文本或设计参数。整体保持明亮、干净、护眼，避免大面积深色、强霓虹、复杂渐变和高压迫背景。装饰密度必须低于学习内容，角色、花草、糖果、气泡、电话线、科技光线或海图道具只放在边缘、角落或低层背景，不得穿过题目、选项、槽位、网格、按钮和反馈区域。\n\n6. UI层级与反馈\n底层是风格化背景，只提供氛围；中层是主主题板和内部功能卡片，盖在背景图上，由html/CSS/JS 绘制适合本风格的题板区域，是最高信息承载层；上层是可拖拽对象、选项、按钮、反馈条和当前选中态；弹窗层用于结果、时间到或完成反馈，必须有遮罩或清楚的独立卡片，不能遮挡关键学习内容。\n正确反馈使用绿色描边、对勾和轻微填充；错误反馈使用柔和红边框；选中态使用清楚描边和简单上浮。\n所有反馈只强化原交互，不新增新玩法，不改变原题目判断逻辑。\n\n7. 音效反馈规范\n音效是 UI 反馈的一部分，必须优先匹配当前风格的专属音效；只用于强化点击、选中、拖拽、落位、提交、答对、答错、提示、完成和重置状态，不改变原课件玩法、题型、节奏和按钮功能。音效需短促、低音量、低干扰，不能循环播放，不能盖过教学语音；需遵守原课件已有静音和音量设置。若没有真实音频素材，可用平台素材库、安全音效或 WebAudio 近似实现，但仍要尽量贴近本风格音效意图。\n本风格音效：只保留轻点击、轻选中、正确提示和错误提示四类极简音效，声音短促、低干扰。\n\n8. 禁止项\n禁止生成无关实体、无关玩法、无关学科内容、伪文字、乱码、品牌名、公司名、水印、二维码、角标、设计参数、色值、代码、CSS 标注、软件界面说明、宣传语和不可编辑的题目内容。禁止遮挡、重绘、扭曲或弱化原题目、题板、格线、槽位、按钮和反馈状态。", "sectionsOld": ["请严格按“极简扁平童趣风 UI规范”重新生成同一课件界面。\n\n", "0. 原课件保留规则\n本风格只用于 UI 视觉换肤，不得改变原课件的学科、题型、题目内容、答案、素材数量、槽位数量、组件数量、布局关系、按钮功能、计分逻辑和交互流程。原来是英语看图拼词、填空、拖拽、选择、分类、连线、逻辑推理或其他玩法，换风格后仍保持原玩法和原题目结构。主互动题页中的题干、选项、答案、字母、汉字、拼音、数字、公式、倒计时、得分、按钮文案、反馈文案和关卡信息等可变教学内容，必须由 HTML/CSS/JS 渲染，不要烘焙进背景图或题板底图。\n\n", "1. 整体视觉与布局\n风格识别锚点：第一眼应像极简扁平早教认知卡。使用纯色块、无复杂纹理、少阴影干扰、奶油白、淡蓝、浅黄背景、红蓝黄绿高识别元素、粗圆角线条和超大按钮；图标极简易辨认，信息清晰，适合早教颜色、形状和基础分类。\n采用护眼浅色背景和中央极简题板。画面以留白、清楚分区、大图标、大选项和低装饰为核心。不要复杂场景、角色堆叠、多层浮窗或强拟物材质。\n使用横版课件画布，画布主体集中在中央学习区，四周保留安全边距。顶部保留原课件已有标题、关卡、进度、奖励、倒计时或得分信息；中央按原课件布局放置题目、图片区、网格、线索、选项、素材池、槽位或操作区；底部或右侧保留原有按钮和工具按钮。背景只提供氛围，不承担学习信息。\n\n", "2. 封面图规范与生图提示词逻辑\n1）封面图用于儿童互动课件首页。封面图本身必须生成主标题、副标题和进入按钮；副标题不得超过15个字，图上不生成任何额外文字、包括风格名、品牌名、logo、水印、二维码、角标、色值、尺寸标记、伪文字或无关宣传语都不允许生成。逻辑上，从封面图任意位置点击即可进入，禁止在封面图上再生成任何文字/按钮，只需要配置点击事件。\n2）主标题、副标题和按钮文案都是可变元素，必须根据当前课件真实内容替换；若为英语课件则尽量用英文，若非英语课件则一律用中文。标题、短副标题和进入按钮需要沿同一视觉主轴组织，层级清楚、可读性强，适合课堂投屏。\n3）本视觉风格封面的生图提示词：\n极简扁平儿童认知封面，奶油白和淡蓝背景，红蓝黄绿高饱和纯色元素，粗圆角线条，无复杂纹理、无阴影干扰。画面可放一个简单儿童头像、喇叭图标、几个大号扁平物品图标或几何图形，整体像低龄早教认知 App。中心上方生成大号粗圆角标题“{标题内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，标题清晰、色彩分明、无立体复杂效果。标题下方生成短副标题“{副标题内容根据课件真实内容填充，副标题不超过15个字，若为英语课件则尽量用英文，若非英文课件则一律用中文}”。中下方生成大号扁平圆角按钮，按钮文字为“{进入游戏，按钮内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，按钮颜色高对比、边界清楚。\n\n", "3. 背景图规范与生图提示词逻辑\n1）背景图只用于提供风格氛围，不强行生成题目承载区域。题目白板、任务板、卡片、槽位、按钮和状态栏应由 HTML/CSS/JS 根据当前课件内容绘制，并覆盖在背景图上。背景图中不要生成框、白板、题板、任务板、玻璃板、卡片、按钮、标题、题目文字、选项文字、数字、字母、汉字、格线、槽位、logo、水印或二维码。\n2）背景图可以参考该风格 bg 图和 cover 图的视觉感觉自由延展，但只保留场景、色彩、材质、角色气质和边缘装饰；画面中心应保持开阔、低干扰，方便前端绘制适配当前题型的题板。\n3）本视觉风格背景图的生图提示词：\n极简扁平童趣背景，奶油白、淡蓝、浅黄作为底色，少量红蓝黄绿纯色几何块、云朵、圆点、儿童头像或简单图标放在边缘，信息极简、清楚、低干扰。画面中心保持大面积空白，方便 HTML/CSS/JS 绘制早教认知题板。不要生成白板框、题板、按钮、标题、文字、数字、图标说明、logo、水印或二维码。\n\n", "4. 按钮、字体与触控规范\n按钮使用大尺寸扁平圆角按钮，颜色明确、文字高对比、反馈简洁。字体使用标准无衬线或圆体，避免装饰字。\n本课件面向小学低中高年级儿童，所有核心文字和可点击区域必须适合课堂投屏、互动屏和平板触控。题干、核心选项、按钮文字和状态数字要使用明显偏大的字号，普通提示文字也要清楚可读；主按钮、选项卡、拖拽块和槽位要有足够大的触碰面积和间距，儿童手指点击不容易误触。按钮必须有清楚边界、高对比文字、按压反馈和禁用态；不要把关键文字做得过小、过细、过浅或压在复杂纹理上。\n\n", "5. 色彩、材质与装饰密度\n色彩以白色、浅灰白、天空蓝、清新绿、温暖黄、柔和橙和柔和红为主。\n色彩只作为视觉方向，不在图片中显示任何色号、色卡编号、代码、CSS 文本或设计参数。整体保持明亮、干净、护眼，避免大面积深色、强霓虹、复杂渐变和高压迫背景。装饰密度必须低于学习内容，角色、花草、糖果、气泡、电话线、科技光线或海图道具只放在边缘、角落或低层背景，不得穿过题目、选项、槽位、网格、按钮和反馈区域。\n\n", "6. UI层级与反馈\n底层是风格化背景，只提供氛围；中层是主主题板和内部功能卡片，盖在背景图上，由html/CSS/JS 绘制适合本风格的题板区域，是最高信息承载层；上层是可拖拽对象、选项、按钮、反馈条和当前选中态；弹窗层用于结果、时间到或完成反馈，必须有遮罩或清楚的独立卡片，不能遮挡关键学习内容。\n正确反馈使用绿色描边、对勾和轻微填充；错误反馈使用柔和红边框；选中态使用清楚描边和简单上浮。\n所有反馈只强化原交互，不新增新玩法，不改变原题目判断逻辑。\n\n", "7. 音效反馈规范\n音效是 UI 反馈的一部分，必须优先匹配当前风格的专属音效；只用于强化点击、选中、拖拽、落位、提交、答对、答错、提示、完成和重置状态，不改变原课件玩法、题型、节奏和按钮功能。音效需短促、低音量、低干扰，不能循环播放，不能盖过教学语音；需遵守原课件已有静音和音量设置。若没有真实音频素材，可用平台素材库、安全音效或 WebAudio 近似实现，但仍要尽量贴近本风格音效意图。\n本风格音效：只保留轻点击、轻选中、正确提示和错误提示四类极简音效，声音短促、低干扰。\n\n", "8. 禁止项\n禁止生成无关实体、无关玩法、无关学科内容、伪文字、乱码、品牌名、公司名、水印、二维码、角标、设计参数、色值、代码、CSS 标注、软件界面说明、宣传语和不可编辑的题目内容。禁止遮挡、重绘、扭曲或弱化原题目、题板、格线、槽位、按钮和反馈状态。"], "sectionsNew": ["请严格按“极简扁平童趣风 UI规范”重新生成同一课件界面。\n\n", "0. 原课件保留规则\n本风格只用于 UI 视觉换肤，不得改变原课件的学科、题型、题目内容、答案、素材数量、槽位数量、组件数量、布局关系、按钮功能、计分逻辑和交互流程。原来是英语看图拼词、填空、拖拽、选择、分类、连线、逻辑推理或其他玩法，换风格后仍保持原玩法和原题目结构。主互动题页中的题干、选项、答案、字母、汉字、拼音、数字、公式、倒计时、得分、按钮文案、反馈文案和关卡信息等可变教学内容，必须由 HTML/CSS/JS 渲染，不要烘焙进背景图或题板底图。\n\n", "1. 整体视觉与布局\n风格识别锚点：第一眼应像极简扁平早教认知卡。使用纯色块、无复杂纹理、少阴影干扰、奶油白、淡蓝、浅黄背景、红蓝黄绿高识别元素、粗圆角线条和超大按钮；图标极简易辨认，信息清晰，适合早教颜色、形状和基础分类。\n采用护眼浅色背景和中央极简题板。画面以留白、清楚分区、大图标、大选项和低装饰为核心。不要复杂场景、角色堆叠、多层浮窗或强拟物材质。\n使用横版课件画布，画布主体集中在中央学习区，四周保留安全边距。顶部保留原课件已有标题、关卡、进度、奖励、倒计时或得分信息；中央按原课件布局放置题目、图片区、网格、线索、选项、素材池、槽位或操作区；底部或右侧保留原有按钮和工具按钮。背景只提供氛围，不承担学习信息。\n\n", "2. 封面图规范与生图提示词逻辑\n【本节适用范围】第2节是完整封面设计，第3节是进入后的主互动页背景，两者必须分别生成、分别使用。封面继续执行本节第3项的原有美术描述，包括艺术字、角色、场景、材质、副标题载体和按钮设计；不得把它改成“空背景＋普通HTML标题按钮”。第3节的无文字、无按钮、中央留白要求，以及第4—6节的题板、标准正文字体、学习区低干扰规则，只约束主互动页，不得用来删减封面。除用户在本次调整中明确要求不要封面外，仍按原版规范生成完整图片式首页。\n\n1）封面图用于儿童互动课件首页。封面图本身必须生成主标题、副标题和进入按钮；副标题不得超过15个字，图上不生成任何额外文字、包括风格名、品牌名、logo、水印、二维码、角标、色值、尺寸标记、伪文字或无关宣传语都不允许生成。封面图中的主标题、副标题、按钮造型和按钮文字是最终可见内容，必须保留。HTML 不得在这张封面图上再次叠加可见标题、副标题、按钮、按钮文字或底座；只配置覆盖封面的透明点击层，点击封面任意位置进入原课件。这里禁止的是 HTML 重复叠加，不是禁止图片生成标题或按钮。\n2）主标题、副标题和按钮文案都是可变元素，必须根据当前课件真实内容替换；若为英语课件则尽量用英文，若非英语课件则一律用中文。标题、短副标题和进入按钮需要沿同一视觉主轴组织，层级清楚、可读性强，适合课堂投屏。\n3）本视觉风格封面的生图提示词：\n极简扁平儿童认知封面，奶油白和淡蓝背景，红蓝黄绿高饱和纯色元素，粗圆角线条，无复杂纹理、无阴影干扰。画面可放一个简单儿童头像、喇叭图标、几个大号扁平物品图标或几何图形，整体像低龄早教认知 App。中心上方生成大号粗圆角标题“{标题内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，标题清晰、色彩分明、无立体复杂效果。标题下方生成短副标题“{副标题内容根据课件真实内容填充，副标题不超过15个字，若为英语课件则尽量用英文，若非英文课件则一律用中文}”。中下方生成大号扁平圆角按钮，按钮文字为“{进入游戏，按钮内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，按钮颜色高对比、边界清楚。\n\n4）封面接入顺序：先根据真实课件确认主标题、短副标题和进入文案，再依照上面的原版美术描述生成一张完整封面图；将它完整适配课件舞台，不裁掉文字、角色或按钮，也不把整张封面当作中间的小插图套进另一张封面。仅在封面容器内移除或隐藏源 HTML 的标题、副标题、示例插画和可见开始按钮，清理伪元素及 CSS 背景中重复的文字/按钮；主互动页的题干、选项、答案、控件和逻辑全部保留。不要因源课件原来使用 HTML 标题而继续保留第二套可见封面。\n5）透明点击层只承接进入事件，不绘制文字、图标、背景、边框、阴影或底座；可保留不可见的无障碍名称和键盘进入能力，不能将整张封面图设成透明。一次完整点击/触控只进入一次，不在 pointerdown 时提前撤掉封面；隔离本次手势，禁止继续触发下一页答案、拖拽或提交。进入第一题时仍为未作答状态。\n6）交付前同时核对封面原图与浏览器实际首屏：图中艺术标题、短副标题和设计按钮齐全且各一套，浏览器没有额外的可见 DOM/CSS 文字或按钮，点击任意位置可进入第一题。若有重复，修正 HTML 接入层；若图中文字错误，单独修正封面素材。不得用删掉艺术字、角色、按钮设计，换成空场景，或直接跳过封面的办法通过去重检查。\n\n", "3. 背景图规范与生图提示词逻辑\n1）背景图只用于提供风格氛围，不强行生成题目承载区域。题目白板、任务板、卡片、槽位、按钮和状态栏应由 HTML/CSS/JS 根据当前课件内容绘制，并覆盖在背景图上。背景图中不要生成框、白板、题板、任务板、玻璃板、卡片、按钮、标题、题目文字、选项文字、数字、字母、汉字、格线、槽位、logo、水印或二维码。\n2）背景图可以参考该风格 bg 图和 cover 图的视觉感觉自由延展，但只保留场景、色彩、材质、角色气质和边缘装饰；画面中心应保持开阔、低干扰，方便前端绘制适配当前题型的题板。\n3）本视觉风格背景图的生图提示词：\n极简扁平童趣背景，奶油白、淡蓝、浅黄作为底色，少量红蓝黄绿纯色几何块、云朵、圆点、儿童头像或简单图标放在边缘，信息极简、清楚、低干扰。画面中心保持大面积空白，方便 HTML/CSS/JS 绘制早教认知题板。不要生成白板框、题板、按钮、标题、文字、数字、图标说明、logo、水印或二维码。\n\n", "4. 按钮、字体与触控规范\n按钮使用大尺寸扁平圆角按钮，颜色明确、文字高对比、反馈简洁。字体使用标准无衬线或圆体，避免装饰字。\n本课件面向小学低中高年级儿童，所有核心文字和可点击区域必须适合课堂投屏、互动屏和平板触控。题干、核心选项、按钮文字和状态数字要使用明显偏大的字号，普通提示文字也要清楚可读；主按钮、选项卡、拖拽块和槽位要有足够大的触碰面积和间距，儿童手指点击不容易误触。按钮必须有清楚边界、高对比文字、按压反馈和禁用态；不要把关键文字做得过小、过细、过浅或压在复杂纹理上。\n\n", "5. 色彩、材质与装饰密度\n色彩以白色、浅灰白、天空蓝、清新绿、温暖黄、柔和橙和柔和红为主。\n色彩只作为视觉方向，不在图片中显示任何色号、色卡编号、代码、CSS 文本或设计参数。整体保持明亮、干净、护眼，避免大面积深色、强霓虹、复杂渐变和高压迫背景。装饰密度必须低于学习内容，角色、花草、糖果、气泡、电话线、科技光线或海图道具只放在边缘、角落或低层背景，不得穿过题目、选项、槽位、网格、按钮和反馈区域。\n\n", "6. UI层级与反馈\n底层是风格化背景，只提供氛围；中层是主主题板和内部功能卡片，盖在背景图上，由html/CSS/JS 绘制适合本风格的题板区域，是最高信息承载层；上层是可拖拽对象、选项、按钮、反馈条和当前选中态；弹窗层用于结果、时间到或完成反馈，必须有遮罩或清楚的独立卡片，不能遮挡关键学习内容。\n正确反馈使用绿色描边、对勾和轻微填充；错误反馈使用柔和红边框；选中态使用清楚描边和简单上浮。\n所有反馈只强化原交互，不新增新玩法，不改变原题目判断逻辑。\n\n", "7. 音效反馈规范\n音效是 UI 反馈的一部分，必须优先匹配当前风格的专属音效；只用于强化点击、选中、拖拽、落位、提交、答对、答错、提示、完成和重置状态，不改变原课件玩法、题型、节奏和按钮功能。音效需短促、低音量、低干扰，不能循环播放，不能盖过教学语音；需遵守原课件已有静音和音量设置。若没有真实音频素材，可用平台素材库、安全音效或 WebAudio 近似实现，但仍要尽量贴近本风格音效意图。\n本风格音效：只保留轻点击、轻选中、正确提示和错误提示四类极简音效，声音短促、低干扰。\n\n", "8. 禁止项\n禁止生成无关实体、无关玩法、无关学科内容、伪文字、乱码、品牌名、公司名、水印、二维码、角标、设计参数、色值、代码、CSS 标注、软件界面说明、宣传语和不可编辑的题目内容。禁止遮挡、重绘、扭曲或弱化原题目、题板、格线、槽位、按钮和反馈状态。"], "section2": 3, "blocks": [{"kind": "equal", "old": "2. 封面图规范与生图提示词逻辑\n", "new": "2. 封面图规范与生图提示词逻辑\n"}, {"kind": "insert", "old": "", "new": "【本节适用范围】第2节是完整封面设计，第3节是进入后的主互动页背景，两者必须分别生成、分别使用。封面继续执行本节第3项的原有美术描述，包括艺术字、角色、场景、材质、副标题载体和按钮设计；不得把它改成“空背景＋普通HTML标题按钮”。第3节的无文字、无按钮、中央留白要求，以及第4—6节的题板、标准正文字体、学习区低干扰规则，只约束主互动页，不得用来删减封面。除用户在本次调整中明确要求不要封面外，仍按原版规范生成完整图片式首页。\n\n", "change": 0, "left": [], "right": [{"text": "【本节适用范围】第2节是完整封面设计，第3节是进入后的主互动页背景，两者必须分别生成、分别使用。封面继续执行本节第3项的原有美术描述，包括艺术字、角色、场景、材质、副标题载体和按钮设计；不得把它改成“空背景＋普通HTML标题按钮”。第3节的无文字、无按钮、中央留白要求，以及第4—6节的题板、标准正文字体、学习区低干扰规则，只约束主互动页，不得用来删减封面。除用户在本次调整中明确要求不要封面外，仍按原版规范生成完整图片式首页。\n\n", "changed": true}]}, {"kind": "replace", "old": "1）封面图用于儿童互动课件首页。封面图本身必须生成主标题、副标题和进入按钮；副标题不得超过15个字，图上不生成任何额外文字、包括风格名、品牌名、logo、水印、二维码、角标、色值、尺寸标记、伪文字或无关宣传语都不允许生成。逻辑上，从封面图任意位置点击即可进入，禁止在封面图上再生成任何文字/按钮，只需要配置点击事件。\n", "new": "1）封面图用于儿童互动课件首页。封面图本身必须生成主标题、副标题和进入按钮；副标题不得超过15个字，图上不生成任何额外文字、包括风格名、品牌名、logo、水印、二维码、角标、色值、尺寸标记、伪文字或无关宣传语都不允许生成。封面图中的主标题、副标题、按钮造型和按钮文字是最终可见内容，必须保留。HTML 不得在这张封面图上再次叠加可见标题、副标题、按钮、按钮文字或底座；只配置覆盖封面的透明点击层，点击封面任意位置进入原课件。这里禁止的是 HTML 重复叠加，不是禁止图片 、控件和逻辑全部保留。不要因源课件原来使用 HTML 标题而继续保留第二套可见封面。\n", "changed": true}]}, {"kind": "insert", "old": "", "new": "5）透明点击层只承接进入事件，不绘制文字、图标、背景、边框、阴影或底座；可保留不可见的无障碍名称和键盘进入能力，不能将整张封面图设成透明。一次完整点击/触控只进入一次，不在 pointerdown 时提前撤掉封面；隔离本次手势，禁止继续触发下一页答案、拖拽或提交。进入第一题时仍为未作答状态。\n", "change": 3, "left": [], "right": [{"text": "5）透明点击层只承接进入事件，不绘制文字、图标、背景、边框、阴影或底座；可保留不可见的无障碍名称和键盘进入能力，不能将整张封面图设成透明。一次完整点击/触控只进入一次，不在 pointerdown 时提前撤掉封面；隔离本次手势，禁止继续触发下一页答案、拖拽或提交。进入第一题时仍为未作答状态。\n", "changed": true}]}, {"kind": "insert", "old": "", "new": "6）交付前同时核对封面原图与浏览器实际首屏：图中艺术标题、短副标题和设计按钮齐全且各一套，浏览器没有额外的可见 DOM/CSS 文字或按钮，点击任意位置可进入第一题。若有重复，修正 HTML 接入层；若图中文字错误，单独修正封面素材。不得用删掉艺术字、角色、按钮设计，换成空场景，或直接跳过封面的办法通过去重检查。\n\n", "change": 4, "left": [], "right": [{"text": "6）交付前同时核对封面原图与浏览器实际首屏：图中艺术标题、短副标题和设计按钮齐全且各一套，浏览器没有额外的可见 DOM/CSS 文字或按钮，点击任意位置可进入第一题。若有重复，修正 HTML 接入层；若图中文字错误，单独修正封面素材。不得用删掉艺术字、角色、按钮设计，换成空场景，或直接跳过封面的办法通过去重检查。\n\n", "changed": true}]}], "delta": 825}, {"styleCode": "telephone_switchboard", "displayName": "电话接线风", "caseId": "S25", "promptText": "请严格按“电话接线风 UI规范”重新生成同一课件界面。\n\n0. 原课件保留规则\n本风格只用于 UI 视觉换肤，不得改变原课件的学科、题型、题目内容、答案、素材数量、槽位数量、组件数量、布局关系、按钮功能、计分逻辑和交互流程。原来是英语看图拼词、填空、拖拽、选择、分类、连线、逻辑推理或其他玩法，换风格后仍保持原玩法和原题目结构。主互动题页中的题干、选项、答案、字母、汉字、拼音、数字、公式、倒计时、得分、按钮文案、反馈文案和关卡信息等可变教学内容，必须由 HTML/CSS/JS 渲染，不要烘焙进背景图或题板底图。\n\n1. 整体视觉与布局\n风格识别锚点：第一眼应像复古电话交换机教室，但题目可读性优先。中央必须是干净浅色接线板或课堂白板区域，边缘少量放圆润复古电话机、彩色电话线、交换机旋钮、浅蓝小云朵、柠檬黄边框和薄荷绿小灯；电话线只作为风格装饰，不得把填空题、选择题或其他原题型改成连线题。\n采用明亮儿童课堂里的电话接线板或电话交换机视觉。复古电话、听筒、接线盒、彩色电话线、小灯泡和云朵只能作为边缘装饰。风格只改变画面，不改变题型；除非原课件本来就是连线题，否则不得把填空、拼词、拖拽或选择改成左右连线玩法。\n使用横版课件画布，画布主体集中在中央学习区，四周保留安全边距。顶部保留原课件已有标题、关卡、进度、奖励、倒计时或得分信息；中央按原课件布局放置题目、图片区、网格、线索、选项、素材池、槽位或操作区；底部或右侧保留原有按钮和工具按钮。背景只提供氛围，不承担学习信息。\n\n2. 封面图规范与生图提示词逻辑\n【本节适用范围】第2节是完整封面设计，第3节是进入后的主互动页背景，两者必须分别生成、分别使用。封面继续执行本节第3项的原有美术描述，包括艺术字、角色、场景、材质、副标题载体和按钮设计；不得把它改成“空背景＋普通HTML标题按钮”。第3节的无文字、无按钮、中央留白要求，以及第4—6节的题板、标准正文字体、学习区低干扰规则，只约束主互动页，不得用来删减封面。除用户在本次调整中明确要求不要封面外，仍按原版规范生成完整图片式首页。\n\n1）封面图用于儿童互动课件首页。封面图本身必须生成主标题、副标题和进入按钮；副标题不得超过15个字，图上不生成任何额外文字、包括风格名、品牌名、logo、水印、二维码、角标、色值、尺寸标记、伪文字或无关宣传语都不允许生成。封面图中的主标题、副标题、按钮造型和按钮文字是最终可见内容，必须保留。HTML 不得在这张封面图上再次叠加可见标题、副标题、按钮、按钮文字或底座；只配置覆盖封面的透明点击层，点击封面任意位置进入原课件。这里禁止的是 HTML 重复叠加，不是禁止图片生成标题或按钮。\n2）主标题、副标题和按钮文案都是可变元素，必须根据当前课件真实内容替换；若为英语课件则尽量用英文，若非英语课件则一律用中文。标题、短副标题和进入按钮需要沿同一视觉主轴组织，层级清楚、可读性强，适合课堂投屏。\n3）本视觉风格封面的生图提示词：\nStarfall 教育风 + 儿童逻辑风 + 轻3D粘土哑光质感的复古电话交换机教室封面，奶油白、浅天空蓝、柠檬黄、薄荷绿配色。右侧或下方有复古电话交换机、彩色电话线、旋钮、老式听筒和小桌子，左侧有干净的云朵标题区和星星装饰，整体明亮护眼，不做暗色悬疑。中心上方生成圆润可读标题“{标题内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，标题像软胶字或纸艺字，带白描边。标题下方生成短副标题“{副标题内容根据课件真实内容填充，副标题不超过15个字，若为英语课件则尽量用英文，若非英文课件则一律用中文}”。中下方生成黄色或薄荷绿圆角按钮，按钮文字为“{进入游戏，按钮内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，按钮带小电话图标和箭头。\n\n4）封面接入顺序：先根据真实课件确认主标题、短副标题和进入文案，再依照上面的原版美术描述生成一张完整封面图；将它完整适配课件舞台，不裁掉文字、角色或按钮，也不把整张封面当作中间的小插图套进另一张封面。仅在封面容器内移除或隐藏源 HTML 的标题、副标题、示例插画和可见开始按钮，清理伪元素及 CSS 背景中重复的文字/按钮；主互动页的题干、选项、答案、控件和逻辑全部保留。不要因源课件原来使用 HTML 标题而继续保留第二套可见封面。\n5）透明点击层只承接进入事件，不绘制文字、图标、背景、边框、阴影或底座；可保留不可见的无障碍名称和键盘进入能力，不能将整张封面图设成透明。一次完整点击/触控只进入一次，不在 pointerdown 时提前撤掉封面；隔离本次手势，禁止继续触发下一页答案、拖拽或提交。进入第一题时仍为未作答状态。\n6）交付前同时核对封面原图与浏览器实际首屏：图中艺术标题、短副标题和设计按钮齐全且各一套，浏览器没有额外的可见 DOM/CSS 文字或按钮，点击任意位置可进入第一题。若有重复，修正 HTML 接入层；若图中文字错误，单独修正封面素材。不得用删掉艺术字、角色、按钮设计，换成空场景，或直接跳过封面的办法通过去重检查。\n\n3. 背景图规范与生图提示词逻辑\n1）背景图只用于提供风格氛围，不强行生成题目承载区域。题目白板、任务板、卡片、槽位、按钮和状态栏应由 HTML/CSS/JS 根据当前课件内容绘制，并覆盖在背景图上。背景图中不要生成框、白板、题板、任务板、玻璃板、卡片、按钮、标题、题目文字、选项文字、数字、字母、汉字、格线、槽位、logo、水印或二维码。\n2）背景图可以参考该风格 bg 图和 cover 图的视觉感觉自由延展，但只保留场景、色彩、材质、角色气质和边缘装饰；画面中心应保持开阔、低干扰，方便前端绘制适配当前题型的题板。\n3）本视觉风格背景图的生图提示词：\n复古电话交换机教室背景，Starfall 教育风和轻3D粘土哑光质感，奶油白墙面、浅蓝小云朵、柠檬黄边框感、薄荷绿小灯、老式电话机、交换机旋钮和彩色电话线放在边缘。画面中心保持干净浅色空间，方便 HTML/CSS/JS 绘制对话、填空或配对题板。不要生成接线板框、孔洞题板、电话线穿越中心、按钮、标题、文字、英文字母、logo、水印或二维码。\n\n4. 按钮、字体与触控规范\n按钮使用电话按键式圆角按钮或大胶囊按钮，提交偏亮蓝，重置偏黄色，开始偏粉橙或亮蓝。字体圆润清楚，不得为了电话风格缩小题目字号。\n本课件面向小学低中高年级儿童，所有核心文字和可点击区域必须适合课堂投屏、互动屏和平板触控。题干、核心选项、按钮文字和状态数字要使用明显偏大的字号，普通提示文字也要清楚可读；主按钮、选项卡、拖拽块和槽位要有足够大的触碰面积和间距，儿童手指点击不容易误触。按钮必须有清楚边界、高对比文字、按压反馈和禁用态；不要把关键文字做得过小、过细、过浅或压在复杂纹理上。\n\n5. 色彩、材质与装饰密度\n色彩以奶油白、浅天空蓝、柠檬黄、电话线黄、薄荷绿、亮蓝、浅粉橙和柔和红为主。\n色彩只作为视觉方向，不在图片中显示任何色号、色卡编号、代码、CSS 文本或设计参数。整体保持明亮、干净、护眼，避免大面积深色、强霓虹、复杂渐变和高压迫 一题。若有重复，修正 HTML 接入层；若图中文字错误，单独修正封面素材。不得用删掉艺术字、角色、按钮设计，换成空场景，或直接跳过封面的办法通过去重检查。\n\n3. 背景图规范与生图提示词逻辑\n1）背景图只用于提供风格氛围，不强行生成题目承载区域。题目白板、任务板、卡片、槽位、按钮和状态栏应由 HTML/CSS/JS 根据当前课件内容绘制，并覆盖在背景图上。背景图中不要生成框、白板、题板、任务板、玻璃板、卡片、按钮、标题、题目文字、选项文字、数字、字母、汉字、格线、槽位、logo、水印或二维码。\n2）背景图可以参考该风格 bg 图和 cover 图的视觉感觉自由延展，但只保留场景、色彩、材质、角色气质和边缘装饰；画面中心应保持开阔、低干扰，方便前端绘制适配当前题型的题板。\n3）本视觉风格背景图的生图提示词：\n复古电话交换机教室背景，Starfall 教育风和轻3D粘土哑光质感，奶油白墙面、浅蓝小云朵、柠檬黄边框感、薄荷绿小灯、老式电话机、交换机旋钮和彩色电话线放在边缘。画面中心保持干净浅色空间，方便 HTML/CSS/JS 绘制对话、填空或配对题板。不要生成接线板框、孔洞题板、电话线穿越中心、按钮、标题、文字、英文字母、logo、水印或二维码。\n\n4. 按钮、字体与触控规范\n按钮使用电话按键式圆角按钮或大胶囊按钮，提交偏亮蓝，重置偏黄色，开始偏粉橙或亮蓝。字体圆润清楚，不得为了电话风格缩小题目字号。\n本课件面向小学低中高年级儿童，所有核心文字和可点击区域必须适合课堂投屏、互动屏和平板触控。题干、核心选项、按钮文字和状态数字要使用明显偏大的字号，普通提示文字也要清楚可读；主按钮、选项卡、拖拽块和槽位要有足够大的触碰面积和间距，儿童手指点击不容易误触。按钮必须有清楚边界、高对比文字、按压反馈和禁用态；不要把关键文字做得过小、过细、过浅或压在复杂纹理上。\n\n5. 色彩、材质与装饰密度\n色彩以奶油白、浅天空蓝、柠檬黄、电话线黄、薄荷绿、亮蓝、浅粉橙和柔和红为主。\n色彩只作为视觉方向，不在图片中显示任何色号、色卡编号、代码、CSS 文本或设计参数。整体保持明亮、干净、护眼，避免大面积深色、强霓虹、复杂渐变和高压迫背景。装饰密度必须低于学习内容，角色、花草、糖果、气泡、电话线、科技光线或海图道具只放在边缘、角落或低层背景，不得穿过题目、选项、槽位、网格、按钮和反馈区域。\n\n6. UI层级与反馈\n底层是风格化背景，只提供氛围；中层是主主题板和内部功能卡片，盖在背景图上，由html/CSS/JS 绘制适合本风格的题板区域，是最高信息承载层；上层是可拖拽对象、选项、按钮、反馈条和当前选中态；弹窗层用于结果、时间到或完成反馈，必须有遮罩或清楚的独立卡片，不能遮挡关键学习内容。\n正确反馈使用灯泡点亮、绿色描边和接通感；错误反馈使用柔和红边框和低调断开提示；选中态使用蓝色或黄色描边。\n所有反馈只强化原交互，不新增新玩法，不改变原题目判断逻辑。\n\n7. 音效反馈规范\n音效是 UI 反馈的一部分，必须优先匹配当前风格的专属音效；只用于强化点击、选中、拖拽、落位、提交、答对、答错、提示、完成和重置状态，不改变原课件玩法、题型、节奏和按钮功能。音效需短促、低音量、低干扰，不能循环播放，不能盖过教学语音；需遵守原课件已有静音和音量设置。若没有真实音频素材，可用平台素材库、安全音效或 WebAudio 近似实现，但仍要尽量贴近本风格音效意图。\n本风格音效：点击使用老式电话按键声，提交使用短接通提示，错误使用低音量忙音，拖拽或放置使用插头轻插入声，状态点亮使用灯泡提示音，忙音不能循环干扰。\n\n8. 禁止项\n禁止生成无关实体、无关玩法、无关学科内容、伪文字、乱码、品牌名、公司名、水印、二维码、角标、设计参数、色值、代码、CSS 标注、软件界面说明、宣传语和不可编辑的题目内容。禁止遮挡、重绘、扭曲或弱化原题目、题板、格线、槽位、按钮和反馈状态。尤其禁止把原题型改成电话连线题，禁止电话线穿过学习内容。", "sectionsOld": ["请严格按“电话接线风 UI规范”重新生成同一课件界面。\n\n", "0. 原课件保留规则\n本风格只用于 UI 视觉换肤，不得改变原课件的学科、题型、题目内容、答案、素材数量、槽位数量、组件数量、布局关系、按钮功能、计分逻辑和交互流程。原来是英语看图拼词、填空、拖拽、选择、分类、连线、逻辑推理或其他玩法，换风格后仍保持原玩法和原题目结构。主互动题页中的题干、选项、答案、字母、汉字、拼音、数字、公式、倒计时、得分、按钮文案、反馈文案和关卡信息等可变教学内容，必须由 HTML/CSS/JS 渲染，不要烘焙进背景图或题板底图。\n\n", "1. 整体视觉与布局\n风格识别锚点：第一眼应像复古电话交换机教室，但题目可读性优先。中央必须是干净浅色接线板或课堂白板区域，边缘少量放圆润复古电话机、彩色电话线、交换机旋钮、浅蓝小云朵、柠檬黄边框和薄荷绿小灯；电话线只作为风格装饰，不得把填空题、选择题或其他原题型改成连线题。\n采用明亮儿童课堂里的电话接线板或电话交换机视觉。复古电话、听筒、接线盒、彩色电话线、小灯泡和云朵只能作为边缘装饰。风格只改变画面，不改变题型；除非原课件本来就是连线题，否则不得把填空、拼词、拖拽或选择改成左右连线玩法。\n使用横版课件画布，画布主体集中在中央学习区，四周保留安全边距。顶部保留原课件已有标题、关卡、进度、奖励、倒计时或得分信息；中央按原课件布局放置题目、图片区、网格、线索、选项、素材池、槽位或操作区；底部或右侧保留原有按钮和工具按钮。背景只提供氛围，不承担学习信息。\n\n", "2. 封面图规范与生图提示词逻辑\n1）封面图用于儿童互动课件首页。封面图本身必须生成主标题、副标题和进入按钮；副标题不得超过15个字，图上不生成任何额外文字、包括风格名、品牌名、logo、水印、二维码、角标、色值、尺寸标记、伪文字或无关宣传语都不允许生成。逻辑上，从封面图任意位置点击即可进入，禁止在封面图上再生成任何文字/按钮，只需要配置点击事件。\n2）主标题、副标题和按钮文案都是可变元素，必须根据当前课件真实内容替换；若为英语课件则尽量用英文，若非英语课件则一律用中文。标题、短副标题和进入按钮需要沿同一视觉主轴组织，层级清楚、可读性强，适合课堂投屏。\n3）本视觉风格封面的生图提示词：\nStarfall 教育风 + 儿童逻辑风 + 轻3D粘土哑光质感的复古电话交换机教室封面，奶油白、浅天空蓝、柠檬黄、薄荷绿配色。右侧或下方有复古电话交换机、彩色电话线、旋钮、老式听筒和小桌子，左侧有干净的云朵标题区和星星装饰，整体明亮护眼，不做暗色悬疑。中心上方生成圆润可读标题“{标题内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，标题像软胶字或纸艺字，带白描边。标题下方生成短副标题“{副标题内容根据课件真实内容填充，副标题不超过15个字，若为英语课件则尽量用英文，若非英文课件则一律用中文}”。中下方生成黄色或薄荷绿圆角按钮，按钮文字为“{进入游戏，按钮内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，按钮带小电话图标和箭头。\n\n", "3. 背景图规范与生图提示词逻辑\n1）背景图只用于提供风格氛围，不强行生成题目承载区域。题目白板、任务板、卡片、槽位、按钮和状态栏应由 HTML/CSS/JS 根据当前课件内容绘制，并覆盖在背景图上。背景图中不要生成框、白板、题板、任务板、玻璃板、卡片、按钮、标题、题目文字、选项文字、数字、字母、汉字、格线、槽位、logo、水印或二维码。\n2）背景图可以参考该风格 bg 图和 cover 图的视觉感觉自由延展，但只保留场景、色彩、材质、角色气质和边缘装饰；画面中心应保持开阔、低干扰，方便前端绘制适配当前题型的题板。\n3）本视觉风格背景图的生图提示词：\n复古电话交换机教室背景，Starfall 教育风和轻3D粘土哑光质感，奶油白墙面、浅蓝小云朵、柠檬黄边框感、薄荷绿小灯、老式电话机、交换机旋钮和彩色电话线放在边缘。画面中心保持干净浅色空间，方便 HTML/CSS/JS 绘制对话、填空或配对题板。不要生成接线板框、孔洞题板、电话线穿越中心、按钮、标题、文字、英文字母、logo、水印或二维码。\n\n", "4. 按钮、字体与触控规范\n按钮使用电话按键式圆角按钮或大胶囊按钮，提交偏亮蓝，重置偏黄色，开始偏粉橙或亮蓝。字体圆润清楚，不得为了电话风格缩小题目字号。\n本课件面向小学低中高年级儿童，所有核心文字和可点击区域必须适合课堂投屏、互动屏和平板触控。题干、核心选项、按钮文字和状态数字要使用明显偏大的字号，普通提示文字也要清楚可读；主按钮、选项卡、拖拽块和槽位要有足够大的触碰面积和间距，儿童手指点击不容易误触。按钮必须有清楚边界、高对比文字、按压反馈和禁用态；不要把关键文字做得过小、过细、过浅或压在复杂纹理上。\n\n", "5. 色彩、材质与装饰密度\n色彩以奶油白、浅天空蓝、柠檬黄、电话线黄、薄荷绿、亮蓝、浅粉橙和柔和红为主。\n色彩只作为视觉方向，不在图片中显示任何色号、色卡编号、代码、CSS 文本或设计参数。整体保持明亮、干净、护眼，避免大面积深色、强霓虹、复杂渐变和高压迫背景。装饰密度必须低于学习内容，角色、花草、糖果、气泡、电话线、科技光线或海图道具只放在边缘、角落或低层背景，不得穿过题目、选项、槽位、网格、按钮和反馈区域。\n\n", "6. UI层级与反馈\n底层是风格化背景，只提供氛围；中层是主主题板和内部功能卡片，盖在背景图上，由html/CSS/JS 绘制适合本风格的题板区域，是最高信息承载层；上层是可拖拽对象、选项、按钮、反馈条和当前选中态；弹窗层用于结果、时间到或完成反馈，必须有遮罩或清楚的独立卡片，不能遮挡关键学习内容。\n正确反馈使用灯泡点亮、绿色描边和接通感；错误反馈使用柔和红边框和低调断开提示；选中态使用蓝色或黄色描边。\n所有反馈只强化原交互，不新增新玩法，不改变原题目判断逻辑。\n\n", "7. 音效反馈规范\n音效是 UI 反馈的一部分，必须优先匹配当前风格的专属音效；只用于强化点击、选中、拖拽、落位、提交、答对、答错、提示、完成和重置状态，不改变原课件玩法、题型、节奏和按钮功能。音效需短促、低音量、低干扰，不能循环播放，不能盖过教学语音；需遵守原课件已有静音和音量设置。若没有真实音频素材，可用平台素材库、安全音效或 WebAudio 近似实现，但仍要尽量贴近本风格音效意图。\n本风格音效：点击使用老式电话按键声，提交使用短接通提示，错误使用低音量忙音，拖拽或放置使用插头轻插入声，状态点亮使用灯泡提示音，忙音不能循环干扰。\n\n", "8. 禁止项\n禁止生成无关实体、无关玩法、无关学科内容、伪文字、乱码、品牌名、公司名、水印、二维码、角标、设计参数、色值、代码、CSS 标注、软件界面说明、宣传语和不可编辑的题目内容。禁止遮挡、重绘、扭曲或弱化原题目、题板、格线、槽位、按钮和反馈状态。尤其禁止把原题型改成电话连线题，禁止电话线穿过学习内容。"], "sectionsNew": ["请严格按“电话接线风 UI规范”重新生成同一课件界面。\n\n", "0. 原课件保留规则\n本风格只用于 UI 视觉换肤，不得改变原课件的学科、题型、题目内容、答案、素材数量、槽位数量、组件数量、布局关系、按钮功能、计分逻辑和交互流程。原来是英语看图拼词、填空、拖拽、选择、分类、连线、逻辑推理或其他玩法，换风格后仍保持原玩法和原题目结构。主互动题页中的题干、选项、答案、字母、汉字、拼音、数字、公式、倒计时、得分、按钮文案、反馈文案和关卡信息等可变教学内容，必须由 HTML/CSS/JS 渲染，不要烘焙进背景图或题板底图。\n\n", "1. 整体视觉与布局\n风格识别锚点：第一眼应像复古电话交换机教室，但题目可读性优先。中央必须是干净浅色接线板或课堂白板区域，边缘少量放圆润复古电话机、彩色电话线、交换机旋钮、浅蓝小云朵、柠檬黄边框和薄荷绿小灯；电话线只作为风格装饰，不得把填空题、选择题或其他原题型改成连线题。\n采用明亮儿童课堂里的电话接线板或电话交换机视觉。复古电话、听筒、接线盒、彩色电话线、小灯泡和云朵只能作为边缘装饰。风格只改变画面，不改变题型；除非原课件本来就是连线题，否则不得把填空、拼词、拖拽或选择改成左右连线玩法。\n使用横版课件画布，画布主体集中在中央学习区，四周保留安全边距。顶部保留原课件已有标题、关卡、进度、奖励、倒计时或得分信息；中央按原课件布局放置题目、图片区、网格、线索、选项、素材池、槽位或操作区；底部或右侧保留原有按钮和工具按钮。背景只提供氛围，不承担学习信息。\n\n", "2. 封面图规范与生图提示词逻辑\n【本节适用范围】第2节是完整封面设计，第3节是进入后的主互动页背景，两者必须分别生成、分别使用。封面继续执行本节第3项的原有美术描述，包括艺术字、角色、场景、材质、副标题载体和按钮设计；不得把它改成“空背景＋普通HTML标题按钮”。第3节的无文字、无按钮、中央留白要求，以及第4—6节的题板、标准正文字体、学习区低干扰规则，只约束主互动页，不得用来删减封面。除用户在本次调整中明确要求不要封面外，仍按原版规范生成完整图片式首页。\n\n1）封面图用于儿童互动课件首页。封面图本身必须生成主标题、副标题和进入按钮；副标题不得超过15个字，图上不生成任何额外文字、包括风格名、品牌名、logo、水印、二维码、角标、色值、尺寸标记、伪文字或无关宣传语都不允许生成。封面图中的主标题、副标题、按钮造型和按钮文字是最终可见内容，必须保留。HTML 不得在这张封面图上再次叠加可见标题、副标题、按钮、按钮文字或底座；只配置覆盖封面的透明点击层，点击封面任意位置进入原课件。这里禁止的是 HTML 重复叠加，不是禁止图片生成标题或按钮。\n2）主标题、副标题和按钮文案都是可变元素，必须根据当前课件真实内容替换；若为英语课件则尽量用英文，若非英语课件则一律用中文。标题、短副标题和进入按钮需要沿同一视觉主轴组织，层级清楚、可读性强，适合课堂投屏。\n3）本视觉风格封面的生图提示词：\nStarfall 教育风 + 儿童逻辑风 + 轻3D粘土哑光质感的复古电话交换机教室封面，奶油白、浅天空蓝、柠檬黄、薄荷绿配色。右侧或下方有复古电话交换机、彩色电话线、旋钮、老式听筒和小桌子，左侧有干净的云朵标题区和星星装饰，整体明亮护眼，不做暗色悬疑。中心上方生成圆润可读标题“{标题内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，标题像软胶字或纸艺字，带白描边。标题下方生成短副标题“{副标题内容根据课件真实内容填充，副标题不超过15个字，若为英语课件则尽量用英文，若非英文课件则一律用中文}”。中下方生成黄色或薄荷绿圆角按钮，按钮文字为“{进入游戏，按钮内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，按钮带小电话图标和箭头。\n\n4）封面接入顺序：先根据真实课件确认主标题、短副标题和进入文案，再依照上面的原版美术描述生成一张完整封面图；将它完整适配课件舞台，不裁掉文字、角色或按钮，也不把整张封面当作中间的小插图套进另一张封面。仅在封面容器内移除或隐藏源 HTML 的标题、副标题、示例插画和可见开始按钮，清理伪元素及 CSS 背景中重复的文字/按钮；主互动页的题干、选项、答案、控件和逻辑全部保留。不要因源课件原来使用 HTML 标题而继续保留第二套可见封面。\n5）透明点击层只承接进入事件，不绘制文字、图标、背景、边框、阴影或底座；可保留不可见的无障碍名称和键盘进入能力，不能将整张封面图设成透明。一次完整点击/触控只进入一次，不在 pointerdown 时提前撤掉封面；隔离本次手势，禁止继续触发下一页答案、拖拽或提交。进入第一题时仍为未作答状态。\n6）交付前同时核对封面原图与浏览器实际首屏：图中艺术标题、短副标题和设计按钮齐全且各一套，浏览器没有额外的可见 DOM/CSS 文字或按钮，点击任意位置可进入第一题。若有重复，修正 HTML 接入层；若图中文字错误，单独修正封面素材。不得用删掉艺术字、角色、按钮设计，换成空场景，或直接跳过封面的办法通过去重检查。\n\n", "3. 背景图规范与生图提示词逻辑\n1）背景图只用于提供风格氛围，不强行生成题目承载区域。题目白板、任务板、卡片、槽位、按钮和状态栏应由 HTML/CSS/JS 根据当前课件内容绘制，并覆盖在背景图上。背景图中不要生成框、白板、题板、任务板、玻璃板、卡片、按钮、标题、题目文字、选项文字、数字、字母、汉字、格线、槽位、logo、水印或二维码。\n2）背景图可以参考该风格 bg 图和 cover 图的视觉感觉自由延展，但只保留场景、色彩、材质、角色气质和边缘装饰；画面中心应保持开阔、低干扰，方便前端绘制适配当前题型的题板。\n3）本视觉风格背景图的生图提示词：\n复古电话交换机教室背景，Starfall 教育风和轻3D粘土哑光质感，奶油白墙面、浅蓝小云朵、柠檬黄边框感、薄荷绿小灯、老式电话机、交换机旋钮和彩色电话线放在边缘。画面中心保持干净浅色空间，方便 HTML/CSS/JS 绘制对话、填空或配对题板。不要生成接线板框、孔洞题板、电话线穿越中心、按钮、标题、文字、英文字母、logo、水印或二维码。\n\n", "4. 按钮、字体与触控规范\n按钮使用电话按键式圆角按钮或大胶囊按钮，提交偏亮蓝，重置偏黄色，开始偏粉橙或亮蓝。字体圆润清楚，不得为了电话风格缩小题目字号。\n本课件面向小学低中高年级儿童，所有核心文字和可点击区域必须适合课堂投屏、互动屏和平板触控。题干、核心选项、按钮文字和状态数字要使用明显偏大的字号，普通提示文字也要清楚可读；主按钮、选项卡、拖拽块和槽位要有足够大的触碰面积和间距，儿童手指点击不容易误触。按钮必须有清楚边界、高对比文字、按压反馈和禁用态；不要把关键文字做得过小、过细、过浅或压在复杂纹理上。\n\n", "5. 色彩、材质与装饰密度\n色彩以奶油白、浅天空蓝、柠檬黄、电话线黄、薄荷绿、亮蓝、浅粉橙和柔和红为主。\n色彩只作为视觉方向，不在图片中显示任何色号、色卡编号、代码、CSS 文本或设计参数。整体保持明亮、干净、护眼，避免大面积深色、强霓虹、复杂渐变和高压迫背景。装饰密度必须低于学习内容，角色、花草、糖果、气泡、电话线、科技光线或海图道具只放在边缘、角落或低层背景，不得穿过题目、选项、槽位、网格、按钮和反馈区域。\n\n", "6. UI层级与反馈\n底层是风格化背景，只提供氛围；中层是主主题板和内部功能卡片，盖在背景图上，由html/CSS/JS 绘制适合本风格的题板区域，是最高信息承载层；上层是可拖拽对象、选项、按钮、反馈条和当前选中态；弹窗层用于结果、时间到或完成反馈，必须有遮罩或清楚的独立卡片，不能遮挡关键学习内容。\n正确反馈使用灯泡点亮、绿色描边和接通感；错误反馈使用柔和红边框和低调断开提示；选中态使用蓝色或黄色描边。\n所有反馈只强化原交互，不新增新玩法，不改变原题目判断逻辑。\n\n", "7. 音效反馈规范\n音效是 UI 反馈的一部分，必须优先匹配当前风格的专属音效；只用于强化点击、选中、拖拽、落位、提交、答对、答错、提示、完成和重置状态，不改变原课件玩法、题型、节奏和按钮功能。音效需短促、低音量、低干扰，不能循环播放，不能盖过教学语音；需遵守原课件已有静音和音量设置。若没有真实音频素材，可用平台素材库、安全音效或 WebAudio 近似实现，但仍要尽量贴近本风格音效意图。\n本风格音效：点击使用老式电话按键声，提交使用短接通提示，错误使用低音量忙音，拖拽或放置使用插头轻插入声，状态点亮使用灯泡提示音，忙音不能循环干扰。\n\n", "8. 禁止项\n禁止生成无关实体、无关玩法、无关学科内容、伪文字、乱码、品牌名、公司名、水印、二维码、角标、设计参数、色值、代码、CSS 标注、软件界面说明、宣传语和不可编辑的题目内容。禁止遮挡、重绘、扭曲或弱化原题目、题板、格线、槽位、按钮和反馈状态。尤其禁止把原题型改成电话连线题，禁止电话线穿过学习内容。"], "section2": 3, "blocks": [{"kind": "equal", "old": "2. 封面图规范与生图提示词逻辑\n", "new": "2. 封面图规范与生图提示词逻辑\n"}, {"kind": "insert", "old": "", "new": "【本节适用范围】第2节是完整封面设计，第3节是进入后的主互动页背景，两者必须分别生成、分别使用。封面继续执行本节第3项的原有美术描述，包括艺术字、角色、场景、材质、副标题载体和按钮设计；不得把它改成“空背景＋普通HTML标题按钮”。第3节的无文字、无按钮、中央留白要求，以及第4—6节的题板、标准正文字体、学习区低干扰规则，只约束主互动页，不得用来删减封面。除用户在本次调整中明确要求不要封面外，仍按原版规范生成完整图片式首页。\n\n", "change": 0, "left": [], "right": [{"text": "【本节适用范围】第2节是完整封面设计，第3节是进入后的主互动页背景，两者必须分别生成、分别使用。封面继续执行本节第3项的原有美术描述，包括艺术字、角色、场景、材质、副标题载体和按钮设计；不得把它改成“空背景＋普通HTML标题按钮”。第3节的无文字、无按钮、中央留白要求，以及第4—6节的题板、标准正文字体、学习区低干扰规则，只约束主互动页，不得用来删减封面。除用户在本次调整中明确要求不要封面外，仍按原版规范生成完整图片式首页。\n\n", "changed": true}]}, {"kind": "replace", "old": "1）封面图用于儿童互动课件首页。封面图本身必须生成主标题、副标题和进入按钮；副标题不得超过15个字，图上不生成任何额外文字、包括风格名、品牌名、logo、水印、二维码、角标、色值、尺寸标记、伪文字或无关宣传语都不允许生成。逻辑上，从封面图任意位置点击即可进入，禁止在封面图上再生成任何文字/按钮，只需要配置点击事件。\n", "new": "1）封面图用于儿童互动课件首页。封面图本身必须生成主标题、副标题和进入按钮；副标题不得超过15个字，图上不生成任何额外文字、包括风格名、品牌名、logo、水印、二维码、角标、色值、尺寸标记、伪文字或无关宣传语都不允许生成。封面图中的主标题、副标题、按钮造型和按钮文字是最终可见内容，必须保留。HTML 不得在这张封面图上再次叠加可见标题、副标题、按钮、按钮文字或底座；只配置覆盖封面的透明点击层，点击封面任意位置进入原课件。这里禁止的是 HTML 重复叠加，不是禁止图片生成标题或按钮。\n", "change": 1, "left": [{"text": "1）封面图用于儿童互动课件首页。封面图本身必须生成主标题、副标题和进入按钮；副标题不得超过15个字，图上不生成任何额外文字、包括风格名、品牌名、logo、水印、二维码、角标、色值、尺寸标记、伪文字或无关宣传语都不允许生成。", "changed": false}, {"text": "逻辑上，从封面图任意位置点击即可进入，禁止在封面图上再生成任何文字/按钮，只需要配置点击事件。\n", "changed": true}], "right": [{"text": "1）封面图用于儿童互动课件首页。封面图本身必须生成主标题、副标题和进入按钮；副标题不得超过15个字，图上不生成任何额外文字、包括风格名、品牌名、logo、水印、二维码、角标、色值、尺寸标记、伪文字或无关宣传语都不允许生成。", "changed": false}, {"text": "封面图中的主标题、副标题、按钮造型和按钮文字是最终可见内容，必须保留。HTML 不得在这张封 ，禁止继续触发下一页答案、拖拽或提交。进入第一题时仍为未作答状态。\n", "changed": true}]}, {"kind": "insert", "old": "", "new": "6）交付前同时核对封面原图与浏览器实际首屏：图中艺术标题、短副标题和设计按钮齐全且各一套，浏览器没有额外的可见 DOM/CSS 文字或按钮，点击任意位置可进入第一题。若有重复，修正 HTML 接入层；若图中文字错误，单独修正封面素材。不得用删掉艺术字、角色、按钮设计，换成空场景，或直接跳过封面的办法通过去重检查。\n\n", "change": 4, "left": [], "right": [{"text": "6）交付前同时核对封面原图与浏览器实际首屏：图中艺术标题、短副标题和设计按钮齐全且各一套，浏览器没有额外的可见 DOM/CSS 文字或按钮，点击任意位置可进入第一题。若有重复，修正 HTML 接入层；若图中文字错误，单独修正封面素材。不得用删掉艺术字、角色、按钮设计，换成空场景，或直接跳过封面的办法通过去重检查。\n\n", "changed": true}]}], "delta": 825}, {"styleCode": "seaMapCommand", "displayName": "海图指挥台风", "caseId": "S26", "promptText": "请严格按“海图指挥台风 UI规范”重新生成同一课件界面。\n\n0. 原课件保留规则\n本风格只用于 UI 视觉换肤，不得改变原课件的学科、题型、题目内容、答案、素材数量、槽位数量、组件数量、布局关系、按钮功能、计分逻辑和交互流程。原来是英语看图拼词、填空、拖拽、选择、分类、连线、逻辑推理或其他玩法，换风格后仍保持原玩法和原题目结构。主互动题页中的题干、选项、答案、字母、汉字、拼音、数字、公式、倒计时、得分、按钮文案、反馈文案和关卡信息等可变教学内容，必须由 HTML/CSS/JS 渲染，不要烘焙进背景图或题板底图。\n\n1. 整体视觉与布局\n风格识别锚点：第一眼应像儿童海图指挥台上的逻辑任务桌，而不是普通海洋风。使用低多边形哑光几何、浅色海图桌、指南针、圆润战舰小模型、浮标、铅笔、尺子、贝壳和弱化坐标线；装饰靠边且低对比，明确禁止炮火、爆炸、真实军事风和复杂海底背景。\n采用战舰逻辑挑战式的低多边形海图指挥台，而不是普通海洋探索或水下场景。画面像浅色海图桌面，有坐标网格、罗盘、尺规、灯塔、礁石、船模、战舰小图标和作答状态面板。不要出现鱼群、珊瑚、气泡、贝壳、潜水玻璃和水下光束。\n使用横版课件画布，画布主体集中在中央学习区，四周保留安全边距。顶部保留原课件已有标题、关卡、进度、奖励、倒计时或得分信息；中央按原课件布局放置题目、图片区、网格、线索、选项、素材池、槽位或操作区；底部或右侧保留原有按钮和工具按钮。背景只提供氛围，不承担学习信息。\n\n2. 封面图规范与生图提示词逻辑\n【本节适用范围】第2节是完整封面设计，第3节是进入后的主互动页背景，两者必须分别生成、分别使用。封面继续执行本节第3项的原有美术描述，包括艺术字、角色、场景、材质、副标题载体和按钮设计；不得把它改成“空背景＋普通HTML标题按钮”。第3节的无文字、无按钮、中央留白要求，以及第4—6节的题板、标准正文字体、学习区低干扰规则，只约束主互动页，不得用来删减封面。除用户在本次调整中明确要求不要封面外，仍按原版规范生成完整图片式首页。\n\n1）封面图用于儿童互动课件首页。封面图本身必须生成主标题、副标题和进入按钮；副标题不得超过15个字，图上不生成任何额外文字、包括风格名、品牌名、logo、水印、二维码、角标、色值、尺寸标记、伪文字或无关宣传语都不允许生成。封面图中的主标题、副标题、按钮造型和按钮文字是最终可见内容，必须保留。HTML 不得在这张封面图上再次叠加可见标题、副标题、按钮、按钮文字或底座；只配置覆盖封面的透明点击层，点击封面任意位置进入原课件。这里禁止的是 HTML 重复叠加，不是禁止图片生成标题或按钮。\n2）主标题、副标题和按钮文案都是可变元素，必须根据当前课件真实内容替换；若为英语课件则尽量用英文，若非英语课件则一律用中文。标题、短副标题和进入按钮需要沿同一视觉主轴组织，层级清楚、可读性强，适合课堂投屏。\n3）本视觉风格封面的生图提示词：\n低多边形童趣海图指挥台封面，浅蓝海面、海图桌、罗盘、船模、灯塔、浮标、棋盘和小战舰模型构成儿童逻辑挑战氛围。整体低饱和、圆角几何、哑光柔面，不是真实军事风。中心上方生成深蓝白色厚描边标题“{标题内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，标题带罗盘、船舵或星形徽章点缀。标题下方生成短副标题“{副标题内容根据课件真实内容填充，副标题不超过15个字，若为英语课件则尽量用英文，若非英文课件则一律用中文}”。中下方生成橙色或蓝色圆角按钮，按钮文字为“{进入挑战，按钮内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，按钮带白描边和小箭头。\n\n4）封面接入顺序：先根据真实课件确认主标题、短副标题和进入文案，再依照上面的原版美术描述生成一张完整封面图；将它完整适配课件舞台，不裁掉文字、角色或按钮，也不把整张封面当作中间的小插图套进另一张封面。仅在封面容器内移除或隐藏源 HTML 的标题、副标题、示例插画和可见开始按钮，清理伪元素及 CSS 背景中重复的文字/按钮；主互动页的题干、选项、答案、控件和逻辑全部保留。不要因源课件原来使用 HTML 标题而继续保留第二套可见封面。\n5）透明点击层只承接进入事件，不绘制文字、图标、背景、边框、阴影或底座；可保留不可见的无障碍名称和键盘进入能力，不能将整张封面图设成透明。一次完整点击/触控只进入一次，不在 pointerdown 时提前撤掉封面；隔离本次手势，禁止继续触发下一页答案、拖拽或提交。进入第一题时仍为未作答状态。\n6）交付前同时核对封面原图与浏览器实际首屏：图中艺术标题、短副标题和设计按钮齐全且各一套，浏览器没有额外的可见 DOM/CSS 文字或按钮，点击任意位置可进入第一题。若有重复，修正 HTML 接入层；若图中文字错误，单独修正封面素材。不得用删掉艺术字、角色、按钮设计，换成空场景，或直接跳过封面的办法通过去重检查。\n\n3. 背景图规范与生图提示词逻辑\n1）背景图只用于提供风格氛围，不强行生成题目承载区域。题目白板、任务板、卡片、槽位、按钮和状态栏应由 HTML/CSS/JS 根据当前课件内容绘制，并覆盖在背景图上。背景图中不要生成框、白板、题板、任务板、玻璃板、卡片、按钮、标题、题目文字、选项文字、数字、字母、汉字、格线、槽位、logo、水印或二维码。\n2）背景图可以参考该风格 bg 图和 cover 图的视觉感觉自由延展，但只保留场景、色彩、材质、角色气质和边缘装饰；画面中心应保持开阔、低干扰，方便前端绘制适配当前题型的题板。\n3）本视觉风格背景图的生图提示词：\n低多边形童趣海图指挥台背景，浅蓝海面、柔和海图桌面、罗盘、船模、灯塔、浮标、尺规、贝壳和小战舰模型靠边放置，整体明亮低饱和、哑光柔面。画面中心保持开阔的浅色海图桌面氛围，方便 HTML/CSS/JS 绘制逻辑棋盘和状态栏。不要生成海图框、棋盘格、坐标、按钮、标题、文字、数字、战争炮火、logo、水印或二维码。\n\n4. 按钮、字体与触控规范\n按钮使用厚实胶囊或圆角矩形，提示偏亮蓝，提交偏绿色，重置偏珍珠黄或暖黄。按钮文字居中、高对比、粗清楚，适合推理题长时间操作。\n本课件面向小学低中高年级儿童，所有核心文字和可点击区域必须适合课堂投屏、互动屏和平板触控。题干、核心选项、按钮文字和状态数字要使用明显偏大的字号，普通提示文字也要清楚可读；主按钮、选项卡、拖拽块和槽位要有足够大的触碰面积和间距，儿童手指点击不容易误触。按钮必须有清楚边界、高对比文字、按压反馈和禁用态；不要把关键文字做得过小、过细、过浅或压在复杂纹理上。\n\n5. 色彩、材质与装饰密度\n色彩以浅海蓝、天空蓝、海图蓝、奶油白、浅黄、深海军蓝、海藻绿和珊瑚红为主。\n色彩只作为视觉方向，不在图片中显示任何色号、色卡编号、代码、CSS 文本或设计参数。整体保持明亮、干净、护眼，避免大面积深色、强霓虹、复杂渐变和高压迫背景。装饰密度必须低于学习内容，角色、花草、糖果、气泡、电话线、科技光线或海图道具只放在边缘、角落或低层背景，不得穿过题目、选项、槽位、网格、按钮和反馈区域。\n\n6. UI层级与反馈\n底层是风格化背景，只提供氛围；中层是主主题板和内部功能卡片，盖在背景图上，由html/CSS/JS 绘制适合本风格的题板区域，是最高信息承载层；上层是可拖拽对象、选项、按钮、反馈条和当前选中态；弹窗层用于结果、时间到或完成反馈，必须有遮罩或清楚的独立卡片，不能遮挡关键学习内容。\n正确反馈使用海域标记、绿色描边、罗盘点亮和棋格落点；错误反馈使用珊瑚红边框；选中态使用海图蓝描边和轻高亮。\n所有反馈只强化原交互，不新增新玩法，不改变原题目判断逻辑。\n\n7. 音效反馈规范\n音效是 UI 反馈的一部分，必须优先匹配当前风格的专属音效；只用于强化点击、选中、拖拽、落位、提交、答对、答错、提示、完成和重置状态，不改变原课件玩法、题型、节奏和按钮功能。音效需短促、低音量、低干扰，不能循环播放，不能盖过教学语音；需遵守原课件已有静音和音量设置。若没有真实音频素材，可用平台素材库、安全音效或 WebAudio 近 承担学习信息。\n\n2. 封面图规范与生图提示词逻辑\n【本节适用范围】第2节是完整封面设计，第3节是进入后的主互动页背景，两者必须分别生成、分别使用。封面继续执行本节第3项的原有美术描述，包括艺术字、角色、场景、材质、副标题载体和按钮设计；不得把它改成“空背景＋普通HTML标题按钮”。第3节的无文字、无按钮、中央留白要求，以及第4—6节的题板、标准正文字体、学习区低干扰规则，只约束主互动页，不得用来删减封面。除用户在本次调整中明确要求不要封面外，仍按原版规范生成完整图片式首页。\n\n1）封面图用于儿童互动课件首页。封面图本身必须生成主标题、副标题和进入按钮；副标题不得超过15个字，图上不生成任何额外文字、包括风格名、品牌名、logo、水印、二维码、角标、色值、尺寸标记、伪文字或无关宣传语都不允许生成。封面图中的主标题、副标题、按钮造型和按钮文字是最终可见内容，必须保留。HTML 不得在这张封面图上再次叠加可见标题、副标题、按钮、按钮文字或底座；只配置覆盖封面的透明点击层，点击封面任意位置进入原课件。这里禁止的是 HTML 重复叠加，不是禁止图片生成标题或按钮。\n2）主标题、副标题和按钮文案都是可变元素，必须根据当前课件真实内容替换；若为英语课件则尽量用英文，若非英语课件则一律用中文。标题、短副标题和进入按钮需要沿同一视觉主轴组织，层级清楚、可读性强，适合课堂投屏。\n3）本视觉风格封面的生图提示词：\n低多边形童趣海图指挥台封面，浅蓝海面、海图桌、罗盘、船模、灯塔、浮标、棋盘和小战舰模型构成儿童逻辑挑战氛围。整体低饱和、圆角几何、哑光柔面，不是真实军事风。中心上方生成深蓝白色厚描边标题“{标题内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，标题带罗盘、船舵或星形徽章点缀。标题下方生成短副标题“{副标题内容根据课件真实内容填充，副标题不超过15个字，若为英语课件则尽量用英文，若非英文课件则一律用中文}”。中下方生成橙色或蓝色圆角按钮，按钮文字为“{进入挑战，按钮内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，按钮带白描边和小箭头。\n\n4）封面接入顺序：先根据真实课件确认主标题、短副标题和进入文案，再依照上面的原版美术描述生成一张完整封面图；将它完整适配课件舞台，不裁掉文字、角色或按钮，也不把整张封面当作中间的小插图套进另一张封面。仅在封面容器内移除或隐藏源 HTML 的标题、副标题、示例插画和可见开始按钮，清理伪元素及 CSS 背景中重复的文字/按钮；主互动页的题干、选项、答案、控件和逻辑全部保留。不要因源课件原来使用 HTML 标题而继续保留第二套可见封面。\n5）透明点击层只承接进入事件，不绘制文字、图标、背景、边框、阴影或底座；可保留不可见的无障碍名称和键盘进入能力，不能将整张封面图设成透明。一次完整点击/触控只进入一次，不在 pointerdown 时提前撤掉封面；隔离本次手势，禁止继续触发下一页答案、拖拽或提交。进入第一题时仍为未作答状态。\n6）交付前同时核对封面原图与浏览器实际首屏：图中艺术标题、短副标题和设计按钮齐全且各一套，浏览器没有额外的可见 DOM/CSS 文字或按钮，点击任意位置可进入第一题。若有重复，修正 HTML 接入层；若图中文字错误，单独修正封面素材。不得用删掉艺术字、角色、按钮设计，换成空场景，或直接跳过封面的办法通过去重检查。\n\n3. 背景图规范与生图提示词逻辑\n1）背景图只用于提供风格氛围，不强行生成题目承载区域。题目白板、任务板、卡片、槽位、按钮和状态栏应由 HTML/CSS/JS 根据当前课件内容绘制，并覆盖在背景图上。背景图中不要生成框、白板、题板、任务板、玻璃板、卡片、按钮、标题、题目文字、选项文字、数字、字母、汉字、格线、槽位、logo、水印或二维码。\n2）背景图可以参考该风格 bg 图和 cover 图的视觉感觉自由延展，但只保留场景、色彩、材质、角色气质和边缘装饰；画面中心应保持开阔、低干扰，方便前端绘制适配当前题型的题板。\n3）本视觉风格背景图的生图提示词：\n低多边形童趣海图指挥台背景，浅蓝海面、柔和海图桌面、罗盘、船模、灯塔、浮标、尺规、贝壳和小战舰模型靠边放置，整体明亮低饱和、哑光柔面。画面中心保持开阔的浅色海图桌面氛围，方便 HTML/CSS/JS 绘制逻辑棋盘和状态栏。不要生成海图框、棋盘格、坐标、按钮、标题、文字、数字、战争炮火、logo、水印或二维码。\n\n4. 按钮、字体与触控规范\n按钮使用厚实胶囊或圆角矩形，提示偏亮蓝，提交偏绿色，重置偏珍珠黄或暖黄。按钮文字居中、高对比、粗清楚，适合推理题长时间操作。\n本课件面向小学低中高年级儿童，所有核心文字和可点击区域必须适合课堂投屏、互动屏和平板触控。题干、核心选项、按钮文字和状态数字要使用明显偏大的字号，普通提示文字也要清楚可读；主按钮、选项卡、拖拽块和槽位要有足够大的触碰面积和间距，儿童手指点击不容易误触。按钮必须有清楚边界、高对比文字、按压反馈和禁用态；不要把关键文字做得过小、过细、过浅或压在复杂纹理上。\n\n5. 色彩、材质与装饰密度\n色彩以浅海蓝、天空蓝、海图蓝、奶油白、浅黄、深海军蓝、海藻绿和珊瑚红为主。\n色彩只作为视觉方向，不在图片中显示任何色号、色卡编号、代码、CSS 文本或设计参数。整体保持明亮、干净、护眼，避免大面积深色、强霓虹、复杂渐变和高压迫背景。装饰密度必须低于学习内容，角色、花草、糖果、气泡、电话线、科技光线或海图道具只放在边缘、角落或低层背景，不得穿过题目、选项、槽位、网格、按钮和反馈区域。\n\n6. UI层级与反馈\n底层是风格化背景，只提供氛围；中层是主主题板和内部功能卡片，盖在背景图上，由html/CSS/JS 绘制适合本风格的题板区域，是最高信息承载层；上层是可拖拽对象、选项、按钮、反馈条和当前选中态；弹窗层用于结果、时间到或完成反馈，必须有遮罩或清楚的独立卡片，不能遮挡关键学习内容。\n正确反馈使用海域标记、绿色描边、罗盘点亮和棋格落点；错误反馈使用珊瑚红边框；选中态使用海图蓝描边和轻高亮。\n所有反馈只强化原交互，不新增新玩法，不改变原题目判断逻辑。\n\n7. 音效反馈规范\n音效是 UI 反馈的一部分，必须优先匹配当前风格的专属音效；只用于强化点击、选中、拖拽、落位、提交、答对、答错、提示、完成和重置状态，不改变原课件玩法、题型、节奏和按钮功能。音效需短促、低音量、低干扰，不能循环播放，不能盖过教学语音；需遵守原课件已有静音和音量设置。若没有真实音频素材，可用平台素材库、安全音效或 WebAudio 近似实现，但仍要尽量贴近本风格音效意图。\n本风格音效：点击使用海图按钮声，选中使用罗盘点亮声，棋格操作使用落点声，水域标记使用轻水声，提示使用地图纸轻响和提示铃，明确禁止炮火、爆炸、警报轰鸣和战争化音效。\n\n8. 禁止项\n禁止生成无关实体、无关玩法、无关学科内容、伪文字、乱码、品牌名、公司名、水印、二维码、角标、设计参数、色值、代码、CSS 标注、软件界面说明、宣传语和不可编辑的题目内容。禁止遮挡、重绘、扭曲或弱化原题目、题板、格线、槽位、按钮和反馈状态。尤其禁止把风格做成海洋探索、海底世界或战争炮火场景。", "sectionsOld": ["请严格按“海图指挥台风 UI规范”重新生成同一课件界面。\n\n", "0. 原课件保留规则\n本风格只用于 UI 视觉换肤，不得改变原课件的学科、题型、题目内容、答案、素材数量、槽位数量、组件数量、布局关系、按钮功能、计分逻辑和交互流程。原来是英语看图拼词、填空、拖拽、选择、分类、连线、逻辑推理或其他玩法，换风格后仍保持原玩法和原题目结构。主互动题页中的题干、选项、答案、字母、汉字、拼音、数字、公式、倒计时、得分、按钮文案、反馈文案和关卡信息等可变教学内容，必须由 HTML/CSS/JS 渲染，不要烘焙进背景图或题板底图。\n\n", "1. 整体视觉与布局\n风格识别锚点：第一眼应像儿童海图指挥台上的逻辑任务桌，而不是普通海洋风。使用低多边形哑光几何、浅色海图桌、指南针、圆润战舰小模型、浮标、铅笔、尺子、贝壳和弱化坐标线；装饰靠边且低对比，明确禁止炮火、爆炸、真实军事风和复杂海底背景。\n采用战舰逻辑挑战式的低多边形海图指挥台，而不是普通海洋探索或水下场景。画面像浅色海图桌面，有坐标网格、罗盘、尺规、灯塔、礁石、船模、战舰小图标和作答状态面板。不要出现鱼群、珊瑚、气泡、贝壳、潜水玻璃和水下光束。\n使用横版课件画布，画布主体集中在中央学习区，四周保留安全边距。顶部保留原课件已有标题、关卡、进度、奖励、倒计时或得分信息；中央按原课件布局放置题目、图片区、网格、线索、选项、素材池、槽位或操作区；底部或右侧保留原有按钮和工具按钮。背景只提供氛围，不承担学习信息。\n\n", "2. 封面图规范与生图提示词逻辑\n1）封面图用于儿童互动课件首页。封面图本身必须生成主标题、副标题和进入按钮；副标题不得超过15个字，图上不生成任何额外文字、包括风格名、品牌名、logo、水印、二维码、角标、色值、尺寸标记、伪文字或无关宣传语都不允许生成。逻辑上，从封面图任意位置点击即可进入，禁止在封面图上再生成任何文字/按钮，只需要配置点击事件。\n2）主标题、副标题和按钮文案都是可变元素，必须根据当前课件真实内容替换；若为英语课件则尽量用英文，若非英语课件则一律用中文。标题、短副标题和进入按钮需要沿同一视觉主轴组织，层级清楚、可读性强，适合课堂投屏。\n3）本视觉风格封面的生图提示词：\n低多边形童趣海图指挥台封面，浅蓝海面、海图桌、罗盘、船模、灯塔、浮标、棋盘和小战舰模型构成儿童逻辑挑战氛围。整体低饱和、圆角几何、哑光柔面，不是真实军事风。中心上方生成深蓝白色厚描边标题“{标题内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，标题带罗盘、船舵或星形徽章点缀。标题下方生成短副标题“{副标题内容根据课件真实内容填充，副标题不超过15个字，若为英语课件则尽量用英文，若非英文课件则一律用中文}”。中下方生成橙色或蓝色圆角按钮，按钮文字为“{进入挑战，按钮内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，按钮带白描边和小箭头。\n\n", "3. 背景图规范与生图提示词逻辑\n1）背景图只用于提供风格氛围，不强行生成题目承载区域。题目白板、任务板、卡片、槽位、按钮和状态栏应由 HTML/CSS/JS 根据当前课件内容绘制，并覆盖在背景图上。背景图中不要生成框、白板、题板、任务板、玻璃板、卡片、按钮、标题、题目文字、选项文字、数字、字母、汉字、格线、槽位、logo、水印或二维码。\n2）背景图可以参考该风格 bg 图和 cover 图的视觉感觉自由延展，但只保留场景、色彩、材质、角色气质和边缘装饰；画面中心应保持开阔、低干扰，方便前端绘制适配当前题型的题板。\n3）本视觉风格背景图的生图提示词：\n低多边形童趣海图指挥台背景，浅蓝海面、柔和海图桌面、罗盘、船模、灯塔、浮标、尺规、贝壳和小战舰模型靠边放置，整体明亮低饱和、哑光柔面。画面中心保持开阔的浅色海图桌面氛围，方便 HTML/CSS/JS 绘制逻辑棋盘和状态栏。不要生成海图框、棋盘格、坐标、按钮、标题、文字、数字、战争炮火、logo、水印或二维码。\n\n", "4. 按钮、字体与触控规范\n按钮使用厚实胶囊或圆角矩形，提示偏亮蓝，提交偏绿色，重置偏珍珠黄或暖黄。按钮文字居中、高对比、粗清楚，适合推理题长时间操作。\n本课件面向小学低中高年级儿童，所有核心文字和可点击区域必须适合课堂投屏、互动屏和平板触控。题干、核心选项、按钮文字和状态数字要使用明显偏大的字号，普通提示文字也要清楚可读；主按钮、选项卡、拖拽块和槽位要有足够大的触碰面积和间距，儿童手指点击不容易误触。按钮必须有清楚边界、高对比文字、按压反馈和禁用态；不要把关键文字做得过小、过细、过浅或压在复杂纹理上。\n\n", "5. 色彩、材质与装饰密度\n色彩以浅海蓝、天空蓝、海图蓝、奶油白、浅黄、深海军蓝、海藻绿和珊瑚红为主。\n色彩只作为视觉方向，不在图片中显示任何色号、色卡编号、代码、CSS 文本或设计参数。整体保持明亮、干净、护眼，避免大面积深色、强霓虹、复杂渐变和高压迫背景。装饰密度必须低于学习内容，角色、花草、糖果、气泡、电话线、科技光线或海图道具只放在边缘、角落或低层背景，不得穿过题目、选项、槽位、网格、按钮和反馈区域。\n\n", "6. UI层级与反馈\n底层是风格化背景，只提供氛围；中层是主主题板和内部功能卡片，盖在背景图上，由html/CSS/JS 绘制适合本风格的题板区域，是最高信息承载层；上层是可拖拽对象、选项、按钮、反馈条和当前选中态；弹窗层用于结果、时间到或完成反馈，必须有遮罩或清楚的独立卡片，不能遮挡关键学习内容。\n正确反馈使用海域标记、绿色描边、罗盘点亮和棋格落点；错误反馈使用珊瑚红边框；选中态使用海图蓝描边和轻高亮。\n所有反馈只强化原交互，不新增新玩法，不改变原题目判断逻辑。\n\n", "7. 音效反馈规范\n音效是 UI 反馈的一部分，必须优先匹配当前风格的专属音效；只用于强化点击、选中、拖拽、落位、提交、答对、答错、提示、完成和重置状态，不改变原课件玩法、题型、节奏和按钮功能。音效需短促、低音量、低干扰，不能循环播放，不能盖过教学语音；需遵守原课件已有静音和音量设置。若没有真实音频素材，可用平台素材库、安全音效或 WebAudio 近似实现，但仍要尽量贴近本风格音效意图。\n本风格音效：点击使用海图按钮声，选中使用罗盘点亮声，棋格操作使用落点声，水域标记使用轻水声，提示使用地图纸轻响和提示铃，明确禁止炮火、爆炸、警报轰鸣和战争化音效。\n\n", "8. 禁止项\n禁止生成无关实体、无关玩法、无关学科内容、伪文字、乱码、品牌名、公司名、水印、二维码、角标、设计参数、色值、代码、CSS 标注、软件界面说明、宣传语和不可编辑的题目内容。禁止遮挡、重绘、扭曲或弱化原题目、题板、格线、槽位、按钮和反馈状态。尤其禁止把风格做成海洋探索、海底世界或战争炮火场景。"], "sectionsNew": ["请严格按“海图指挥台风 UI规范”重新生成同一课件界面。\n\n", "0. 原课件保留规则\n本风格只用于 UI 视觉换肤，不得改变原课件的学科、题型、题目内容、答案、素材数量、槽位数量、组件数量、布局关系、按钮功能、计分逻辑和交互流程。原来是英语看图拼词、填空、拖拽、选择、分类、连线、逻辑推理或其他玩法，换风格后仍保持原玩法和原题目结构。主互动题页中的题干、选项、答案、字母、汉字、拼音、数字、公式、倒计时、得分、按钮文案、反馈文案和关卡信息等可变教学内容，必须由 HTML/CSS/JS 渲染，不要烘焙进背景图或题板底图。\n\n", "1. 整体视觉与布局\n风格识别锚点：第一眼应像儿童海图指挥台上的逻辑任务桌，而不是普通海洋风。使用低多边形哑光几何、浅色海图桌、指南针、圆润战舰小模型、浮标、铅笔、尺子、贝壳和弱化坐标线；装饰靠边且低对比，明确禁止炮火、爆炸、真实军事风和复杂海底背景。\n采用战舰逻辑挑战式的低多边形海图指挥台，而不是普通海洋探索或水下场景。画面像浅色海图桌面，有坐标网格、罗盘、尺规、灯塔、礁石、船模、战舰小图标和作答状态面板。不要出现鱼群、珊瑚、气泡、贝壳、潜水玻璃和水下光束。\n使用横版课件画布，画布主体集中在中央学习区，四周保留安全边距。顶部保留原课件已有标题、关卡、进度、奖励、倒计时或得分信息；中央按原课件布局放置题目、图片区、网格、线索、选项、素材池、槽位或操作区；底部或右侧保留原有按钮和工具按钮。背景只提供氛围，不承担学习信息。\n\n", "2. 封面图规范与生图提示词逻辑\n【本节适用范围】第2节是完整封面设计，第3节是进入后的主互动页背景，两者必须分别生成、分别使用。封面继续执行本节第3项的原有美术描述，包括艺术字、角色、场景、材质、副标题载体和按钮设计；不得把它改成“空背景＋普通HTML标题按钮”。第3节的无文字、无按钮、中央留白要求，以及第4—6节的题板、标准正文字体、学习区低干扰规则，只约束主互动页，不得用来删减封面。除用户在本次调整中明确要求不要封面外，仍按原版规范生成完整图片式首页。\n\n1）封面图用于儿童互动课件首页。封面图本身必须生成主标题、副标题和进入按钮；副标题不得超过15个字，图上不生成任何额外文字、包括风格名、品牌名、logo、水印、二维码、角标、色值、尺寸标记、伪文字或无关宣传语都不允许生成。封面图中的主标题、副标题、按钮造型和按钮文字是最终可见内容，必须保留。HTML 不得在这张封面图上再次叠加可见标题、副标题、按钮、按钮文字或底座；只配置覆盖封面的透明点击层，点击封面任意位置进入原课件。这里禁止的是 HTML 重复叠加，不是禁止图片生成标题或按钮。\n2）主标题、副标题和按钮文案都是可变元素，必须根据当前课件真实内容替换；若为英语课件则尽量用英文，若非英语课件则一律用中文。标题、短副标题和进入按钮需要沿同一视觉主轴组织，层级清楚、可读性强，适合课堂投屏。\n3）本视觉风格封面的生图提示词：\n低多边形童趣海图指挥台封面，浅蓝海面、海图桌、罗盘、船模、灯塔、浮标、棋盘和小战舰模型构成儿童逻辑挑战氛围。整体低饱和、圆角几何、哑光柔面，不是真实军事风。中心上方生成深蓝白色厚描边标题“{标题内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，标题带罗盘、船舵或星形徽章点缀。标题下方生成短副标题“{副标题内容根据课件真实内容填充，副标题不超过15个字，若为英语课件则尽量用英文，若非英文课件则一律用中文}”。中下方生成橙色或蓝色圆角按钮，按钮文字为“{进入挑战，按钮内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，按钮带白描边和小箭头。\n\n4）封面接入顺序：先根据真实课件确认主标题、短副标题和进入文案，再依照上面的原版美术描述生成一张完整封面图；将它完整适配课件舞台，不裁掉文字、角色或按钮，也不把整张封面当作中间的小插图套进另一张封面。仅在封面容器内移除或隐藏源 HTML 的标题、副标题、示例插画和可见开始按钮，清理伪元素及 CSS 背景中重复的文字/按钮；主互动页的题干、选项、答案、控件和逻辑全部保留。不要因源课件原来使用 HTML 标题而继续保留第二套可见封面。\n5）透明点击层只承接进入事件，不绘制文字、图标、背景、边框、阴影或底座；可保留不可见的无障碍名称和键盘进入能力，不能将整张封面图设成透明。一次完整点击/触控只进入一次，不在 pointerdown 时提前撤掉封面；隔离本次手势，禁止继续触发下一页答案、拖拽或提交。进入第一题时仍为未作答状态。\n6）交付前同时核对封面原图与浏览器实际首屏：图中艺术标题、短副标题和设计按钮齐全且各一套，浏览器没有额外的可见 DOM/CSS 文字或按钮，点击任意位置可进入第一题。若有重复，修正 HTML 接入层；若图中文字错误，单独修正封面素材。不得用删掉艺术字、角色、按钮设计，换成空场景，或直接跳过封面的办法通过去重检查。\n\n", "3. 背景图规范与生图提示词逻辑\n1）背景图只用于提供风格氛围，不强行生成题目承载区域。题目白板、任务板、卡片、槽位、按钮和状态栏应由 HTML/CSS/JS 根据当前课件内容绘制，并覆盖在背景图上。背景图中不要生成框、白板、题板、任务板、玻璃板、卡片、按钮、标题、题目文字、选项文字、数字、字母、汉字、格线、槽位、logo、水印或二维码。\n2）背景图可以参考该风格 bg 图和 cover 图的视觉感觉自由延展，但只保留场景、色彩、材质、角色气质和边缘装饰；画面中心应保持开阔、低干扰，方便前端绘制适配当前题型的题板。\n3）本视觉风格背景图的生图提示词：\n低多边形童趣海图指挥台背景，浅蓝海面、柔和海图桌面、罗盘、船模、灯塔、浮标、尺规、贝壳和小战舰模型靠边放置，整体明亮低饱和、哑光柔面。画面中心保持开阔的浅色海图桌面氛围，方便 HTML/CSS/JS 绘制逻辑棋盘和状态栏。不要生成海图框、棋盘格、坐标、按钮、标题、文字、数字、战争炮火、logo、水印或二维码。\n\n", "4. 按钮、字体与触控规范\n按钮使用厚实胶囊或圆角矩形，提示偏亮蓝，提交偏绿色，重置偏珍珠黄或暖黄。按钮文字居中、高对比、粗清楚，适合推理题长时间操作。\n本课件面向小学低中高年级儿童，所有核心文字和可点击区域必须适合课堂投屏、互动屏和平板触控。题干、核心选项、按钮文字和状态数字要使用明显偏大的字号，普通提示文字也要清楚可读；主按钮、选项卡、拖拽块和槽位要有足够大的触碰面积和间距，儿童手指点击不容易误触。按钮必须有清楚边界、高对比文字、按压反馈和禁用态；不要把关键文字做得过小、过细、过浅或压在复杂纹理上。\n\n", "5. 色彩、材质与装饰密度\n色彩以浅海蓝、天空蓝、海图蓝、奶油白、浅黄、深海军蓝、海藻绿和珊瑚红为主。\n色彩只作为视觉方向，不在图片中显示任何色号、色卡编号、代码、CSS 文本或设计参数。整体保持明亮、干净、护眼，避免大面积深色、强霓虹、复杂渐变和高压迫背景。装饰密度必须低于学习内容，角色、花草、糖果、气泡、电话线、科技光线或海图道具只放在边缘、角落或低层背景，不得穿过题目、选项、槽位、网格、按钮和反馈区域。\n\n", "6. UI层级与反馈\n底层是风格化背景，只提供氛围；中层是主主题板和内部功能卡片，盖在背景图上，由html/CSS/JS 绘制适合本风格的题板区域，是最高信息承载层；上层是可拖拽对象、选项、按钮、反馈条和当前选中态；弹窗层用于结果、时间到或完成反馈，必须有遮罩或清楚的独立卡片，不能遮挡关键学习内容。\n正确反馈使用海域标记、绿色描边、罗盘点亮和棋格落点；错误反馈使用珊瑚红边框；选中态使用海图蓝描边和轻高亮。\n所有反馈只强化原交互，不新增新玩法，不改变原题目判断逻辑。\n\n", "7. 音效反馈规范\n音效是 UI 反馈的一部分，必须优先匹配当前风格的专属音效；只用于强化点击、选中、拖拽、落位、提交、答对、答错、提示、完成和重置状态，不改变原课件玩法、题型、节奏和按钮功能。音效需短促、低音量、低干扰，不能循环播放，不能盖过教学语音；需遵守原课件已有静音和音量设置。若没有真实音频素材，可用平台素材库、安全音效或 WebAudio 近似实现，但仍要尽量贴近本风格音效意图。\n本风格音效：点击使用海图按钮声，选中使用罗盘点亮声，棋格操作使用落点声，水域标记使用轻水声，提示使用地图纸轻响和提示铃，明确禁止炮火、爆炸、警报轰鸣和战争化音效。\n\n", "8. 禁止项\n禁止生成无关实体、无关玩法、无关学科内容、伪文字、乱码、品牌名、公司名、水印、二维码、角标、设计参数、色值、代码、CSS 标注、软件界面说明、宣传语和不可编辑的题目内容。禁止遮挡、重绘、扭曲或弱化原题目、题板、格线、槽位、按钮和反馈状态。尤其禁止把风格做成海洋探索、海底世界或战争炮火场景。"], "section2": 3, "blocks": [{"kind": "equal", "old": "2. 封面图规范与生图提示词逻辑\n", "new": "2. 封面图规范与生图提示词逻辑\n"}, {"kind": "insert", "old": "", "new": "【本节适用范围】第2节是完整封面设计，第3节是进入后的主互动页背景，两者必须分别生成、分别使用。封面继续执行本节第3项的原有美术描述，包括艺术字、角色、场景、材质、副标题载体和按钮设计；不得把它改成“空背景＋普通HTML标题按钮”。第3节的无文字、无按钮、中央留白要求，以及第4—6节的题板、标准正文字体、学习区低干扰规则，只约束主互动页，不得用来删减封面。除用户在本次调整中明确要求不要封面外，仍按 童话汉字学习白板。使用奶油白纸张、柔和草地、原创小鹿学习伙伴、圆润拼图舞台、轻手绘纸张肌理和大型纸艺学习板；整体像精品课件主操作台，不像网页弹窗或半透明蓝框。不得出现真实品牌 IP 或伪汉字。\n采用春日绘本背景和中央大白板课堂 UI。背景可以有蓝天、白云、草地、樱花、彩虹、小桥和边缘陪伴角色，但只提供氛围。白板必须是最高信息承载区，花草、树枝、角色和彩虹不能穿过题目、槽位和按钮。\n使用横版课件画布，画布主体集中在中央学习区，四周保留安全边距。顶部保留原课件已有标题、关卡、进度、奖励、倒计时或得分信息；中央按原课件布局放置题目、图片区、网格、线索、选项、素材池、槽位或操作区；底部或右侧保留原有按钮和工具按钮。背景只提供氛围，不承担学习信息。\n\n2. 封面图规范与生图提示词逻辑\n【本节适用范围】第2节是完整封面设计，第3节是进入后的主互动页背景，两者必须分别生成、分别使用。封面继续执行本节第3项的原有美术描述，包括艺术字、角色、场景、材质、副标题载体和按钮设计；不得把它改成“空背景＋普通HTML标题按钮”。第3节的无文字、无按钮、中央留白要求，以及第4—6节的题板、标准正文字体、学习区低干扰规则，只约束主互动页，不得用来删减封面。除用户在本次调整中明确要求不要封面外，仍按原版规范生成完整图片式首页。\n\n1）封面图用于儿童互动课件首页。封面图本身必须生成主标题、副标题和进入按钮；副标题不得超过15个字，图上不生成任何额外文字、包括风格名、品牌名、logo、水印、二维码、角标、色值、尺寸标记、伪文字或无关宣传语都不允许生成。封面图中的主标题、副标题、按钮造型和按钮文字是最终可见内容，必须保留。HTML 不得在这张封面图上再次叠加可见标题、副标题、按钮、按钮文字或底座；只配置覆盖封面的透明点击层，点击封面任意位置进入原课件。这里禁止的是 HTML 重复叠加，不是禁止图片生成标题或按钮。\n2）主标题、副标题和按钮文案都是可变元素，必须根据当前课件真实内容替换；若为英语课件则尽量用英文，若非英语课件则一律用中文。标题、短副标题和进入按钮需要沿同一视觉主轴组织，层级清楚、可读性强，适合课堂投屏。\n3）本视觉风格封面的生图提示词：\n宝宝巴士汉字风·16:9课件版 + 童话绘本增强的儿童封面，清新天空、草地、樱花、彩虹、花朵和原创小鹿学习伙伴，奶油白纸张和圆润拼图舞台。中心上方生成大号彩色圆润标题“{标题内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，标题像纸艺泡泡字，带白描边、星星和春日装饰。标题下方生成短副标题“{副标题内容根据课件真实内容填充，副标题不超过15个字，若为英语课件则尽量用英文，若非英文课件则一律用中文}”。中下方生成黄色或浅粉圆角按钮，按钮文字为“{进入游戏，按钮内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，按钮带纸艺高光和小箭头。不得出现真实品牌 IP 或伪汉字。\n\n4）封面接入顺序：先根据真实课件确认主标题、短副标题和进入文案，再依照上面的原版美术描述生成一张完整封面图；将它完整适配课件舞台，不裁掉文字、角色或按钮，也不把整张封面当作中间的小插图套进另一张封面。仅在封面容器内移除或隐藏源 HTML 的标题、副标题、示例插画和可见开始按钮，清理伪元素及 CSS 背景中重复的文字/按钮；主互动页的题干、选项、答案、控件和逻辑全部保留。不要因源课件原来使用 HTML 标题而继续保留第二套可见封面。\n5）透明点击层只承接进入事件，不绘制文字、图标、背景、边框、阴影或底座；可保留不可见的无障碍名称和键盘进入能力，不能将整张封面图设成透明。一次完整点击/触控只进入一次，不在 pointerdown 时提前撤掉封面；隔离本次手势，禁止继续触发下一页答案、拖拽或提交。进入第一题时仍为未作答状态。\n6）交付前同时核对封面原图与浏览器实际首屏：图中艺术标题、短副标题和设计按钮齐全且各一套，浏览器没有额外的可见 DOM/CSS 文字或按钮，点击任意位置可进入第一题。若有重复，修正 HTML 接入层；若图中文字错误，单独修正封面素材。不得用删掉艺术字、角色、按钮设计，换成空场景，或直接跳过封面的办法通过去重检查。\n\n3. 背景图规范与生图提示词逻辑\n1）背景图只用于提供风格氛围，不强行生成题目承载区域。题目白板、任务板、卡片、槽位、按钮和状态栏应由 HTML/CSS/JS 根据当前课件内容绘制，并覆盖在背景图上。背景图中不要生成框、白板、题板、任务板、玻璃板、卡片、按钮、标题、题目文字、选项文字、数字、字母、汉字、格线、槽位、logo、水印或二维码。\n2）背景图可以参考该风格 bg 图和 cover 图的视觉感觉自由延展，但只保留场景、色彩、材质、角色气质和边缘装饰；画面中心应保持开阔、低干扰，方便前端绘制适配当前题型的题板。\n3）本视觉风格背景图的生图提示词：\n清新春日童话绘本背景，蓝天、白云、草地、樱花、彩虹、花朵、原创小鹿学习伙伴和轻手绘纸张肌理装饰靠边出现，整体明亮、温柔、精品课件感。画面中心保持开阔的春日空间，方便 HTML/CSS/JS 绘制奶油白汉字学习白板。不要生成白板框、纸张题板、按钮、标题、汉字、拼音、伪文字、真实品牌 IP、logo、水印或二维码。\n\n4. 按钮、字体与触控规范\n按钮使用厚实圆润胶囊或圆角纸艺按钮，开始偏浅粉，重置偏温暖黄，提交偏清新绿。中文可用清晰黑体，汉字学习内容可用清楚楷体或宋体，但不能牺牲识别。\n本课件面向小学低中高年级儿童，所有核心文字和可点击区域必须适合课堂投屏、互动屏和平板触控。题干、核心选项、按钮文字和状态数字要使用明显偏大的字号，普通提示文字也要清楚可读；主按钮、选项卡、拖拽块和槽位要有足够大的触碰面积和间距，儿童手指点击不容易误触。按钮必须有清楚边界、高对比文字、按压反馈和禁用态；不要把关键文字做得过小、过细、过浅或压在复杂纹理上。\n\n5. 色彩、材质与装饰密度\n色彩以奶油白、天空蓝、温暖黄、品牌橙、清新绿、樱花粉、浅蓝白和柔和红为主。\n色彩只作为视觉方向，不在图片中显示任何色号、色卡编号、代码、CSS 文本或设计参数。整体保持明亮、干净、护眼，避免大面积深色、强霓虹、复杂渐变和高压迫背景。装饰密度必须低于学习内容，角色、花草、糖果、气泡、电话线、科技光线或海图道具只放在边缘、角落或低层背景，不得穿过题目、选项、槽位、网格、按钮和反馈区域。\n\n6. UI层级与反馈\n底层是风格化背景，只提供氛围；中层是主主题板和内部功能卡片，盖在背景图上，由html/CSS/JS 绘制适合本风格的题板区域，是最高信息承载层；上层是可拖拽对象、选项、按钮、反馈条和当前选中态；弹窗层用于结果、时间到或完成反馈，必须有遮罩或清楚的独立卡片，不能遮挡关键学习内容。\n正确反馈使用浅绿描边、温暖星星和轻微发光；错误反馈使用浅红橙边框和轻微摇晃；拖拽槽位可从浅黄高亮变为浅绿实线。\n所有反馈只强化原交互，不新增新玩法，不改变原题目判断逻辑。\n\n7. 音效反馈规范\n音效是 UI 反馈的一部分，必须优先匹配当前风格的专属音效；只用于强化点击、选中、拖拽、落位、提交、答对、答错、提示、完成和重置状态，不改变原课件玩法、题型、节奏和按钮功能。音效需短促、低音量、低干扰，不能循环播放，不能盖过教学语音；需遵守原课件已有静音和音量设置。若没有真实音频素材，可用平台素材库、安全音效或 WebAudio 近似实现，但仍要尽量贴近本风格音效意图。\n本风格音效：点击使用白板笔轻点声，卡片移动使用纸张轻翻声，答对使用星星奖励音，答错使用柔和提示音，避免无关朗读音。\n\n8. 禁止项\n禁止生成无关实体、无关玩法、无关学科内容、伪文字、乱码、品牌名、公司名、水印、二维码、角标、设计参数、色值、代码、CSS 标注、软件界面说明、宣传语和不可编辑的题目内容。禁止遮挡、重绘、扭曲或弱化原题目、题板、格线、槽位、按钮和反馈状态。尤其禁止伪汉字、书页假字、课堂标语和无关标题。", "basePromptSHA256": "09ab104fef2c65397108d85c7129fc61c0d79d61ce312b9b1d50753ba31ba30e", "promptSHA256": "5677341b4de77c8b434227447f04277d13ac6782549a9f73ffb44724e194a670", "status": "候选待生成验证", "changeScope": "仅第2节：图片封面与HTML职责分离；原有封面美术描述逐字保留", "kind": "base", "old": "请严格使用下述画面风格、布局、UI规范来重新生成课件：\n\n0. 原课件保留规则\n本风格只用于 UI 视觉换肤，不得改变原课件的学科、题型、题目内容、答案、素材数量、槽位数量、组件数量、布局关系、按钮功能、计分逻辑和交互流程。原来是英语看图拼词、填空、拖拽、选择、分类、连线、逻辑推理或其他玩法，换风格后仍保持原玩法和原题目结构。主互动题页中的题干、选项、答案、字母、汉字、拼音、数字、公式、倒计时、得分、按钮文案、反馈文案和关卡信息等可变教学内容，必须由 HTML/CSS/JS 渲染，不要烘焙进背景图或题板底图。\n\n1. 整体视觉与布局\n风格识别锚点：第一眼应像清新天空和草地上的童话汉字学习白板。使用奶油白纸张、柔和草地、原创小鹿学习伙伴、圆润拼图舞台、轻手绘纸张肌理和大型纸艺学习板；整体像精品课件主操作台，不像网页弹窗或半透  IP 或伪汉字。\n\n4）封面接入顺序：先根据真实课件确认主标题、短副标题和进入文案，再依照上面的原版美术描述生成一张完整封面图；将它完整适配课件舞台，不裁掉文字、角色或按钮，也不把整张封面当作中间的小插图套进另一张封面。仅在封面容器内移除或隐藏源 HTML 的标题、副标题、示例插画和可见开始按钮，清理伪元素及 CSS 背景中重复的文字/按钮；主互动页的题干、选项、答案、控件和逻辑全部保留。不要因源课件原来使用 HTML 标题而继续保留第二套可见封面。\n5）透明点击层只承接进入事件，不绘制文字、图标、背景、边框、阴影或底座；可保留不可见的无障碍名称和键盘进入能力，不能将整张封面图设成透明。一次完整点击/触控只进入一次，不在 pointerdown 时提前撤掉封面；隔离本次手势，禁止继续触发下一页答案、拖拽或提交。进入第一题时仍为未作答状态。\n6）交付前同时核对封面原图与浏览器实际首屏：图中艺术标题、短副标题和设计按钮齐全且各一套，浏览器没有额外的可见 DOM/CSS 文字或按钮，点击任意位置可进入第一题。若有重复，修正 HTML 接入层；若图中文字错误，单独修正封面素材。不得用删掉艺术字、角色、按钮设计，换成空场景，或直接跳过封面的办法通过去重检查。\n\n3. 背景图规范与生图提示词逻辑\n1）背景图只用于提供风格氛围，不强行生成题目承载区域。题目白板、任务板、卡片、槽位、按钮和状态栏应由 HTML/CSS/JS 根据当前课件内容绘制，并覆盖在背景图上。背景图中不要生成框、白板、题板、任务板、玻璃板、卡片、按钮、标题、题目文字、选项文字、数字、字母、汉字、格线、槽位、logo、水印或二维码。\n2）背景图可以参考该风格 bg 图和 cover 图的视觉感觉自由延展，但只保留场景、色彩、材质、角色气质和边缘装饰；画面中心应保持开阔、低干扰，方便前端绘制适配当前题型的题板。\n3）本视觉风格背景图的生图提示词：\n清新春日童话绘本背景，蓝天、白云、草地、樱花、彩虹、花朵、原创小鹿学习伙伴和轻手绘纸张肌理装饰靠边出现，整体明亮、温柔、精品课件感。画面中心保持开阔的春日空间，方便 HTML/CSS/JS 绘制奶油白汉字学习白板。不要生成白板框、纸张题板、按钮、标题、汉字、拼音、伪文字、真实品牌 IP、logo、水印或二维码。\n\n4. 按钮、字体与触控规范\n按钮使用厚实圆润胶囊或圆角纸艺按钮，开始偏浅粉，重置偏温暖黄，提交偏清新绿。中文可用清晰黑体，汉字学习内容可用清楚楷体或宋体，但不能牺牲识别。\n本课件面向小学低中高年级儿童，所有核心文字和可点击区域必须适合课堂投屏、互动屏和平板触控。题干、核心选项、按钮文字和状态数字要使用明显偏大的字号，普通提示文字也要清楚可读；主按钮、选项卡、拖拽块和槽位要有足够大的触碰面积和间距，儿童手指点击不容易误触。按钮必须有清楚边界、高对比文字、按压反馈和禁用态；不要把关键文字做得过小、过细、过浅或压在复杂纹理上。\n\n5. 色彩、材质与装饰密度\n色彩以奶油白、天空蓝、温暖黄、品牌橙、清新绿、樱花粉、浅蓝白和柔和红为主。\n色彩只作为视觉方向，不在图片中显示任何色号、色卡编号、代码、CSS 文本或设计参数。整体保持明亮、干净、护眼，避免大面积深色、强霓虹、复杂渐变和高压迫背景。装饰密度必须低于学习内容，角色、花草、糖果、气泡、电话线、科技光线或海图道具只放在边缘、角落或低层背景，不得穿过题目、选项、槽位、网格、按钮和反馈区域。\n\n6. UI层级与反馈\n底层是风格化背景，只提供氛围；中层是主主题板和内部功能卡片，盖在背景图上，由html/CSS/JS 绘制适合本风格的题板区域，是最高信息承载层；上层是可拖拽对象、选项、按钮、反馈条和当前选中态；弹窗层用于结果、时间到或完成反馈，必须有遮罩或清楚的独立卡片，不能遮挡关键学习内容。\n正确反馈使用浅绿描边、温暖星星和轻微发光；错误反馈使用浅红橙边框和轻微摇晃；拖拽槽位可从浅黄高亮变为浅绿实线。\n所有反馈只强化原交互，不新增新玩法，不改变原题目判断逻辑。\n\n7. 音效反馈规范\n音效是 UI 反馈的一部分，必须优先匹配当前风格的专属音效；只用于强化点击、选中、拖拽、落位、提交、答对、答错、提示、完成和重置状态，不改变原课件玩法、题型、节奏和按钮功能。音效需短促、低音量、低干扰，不能循环播放，不能盖过教学语音；需遵守原课件已有静音和音量设置。若没有真实音频素材，可用平台素材库、安全音效或 WebAudio 近似实现，但仍要尽量贴近本风格音效意图。\n本风格音效：点击使用白板笔轻点声，卡片移动使用纸张轻翻声，答对使用星星奖励音，答错使用柔和提示音，避免无关朗读音。\n\n8. 禁止项\n禁止生成无关实体、无关玩法、无关学科内容、伪文字、乱码、品牌名、公司名、水印、二维码、角标、设计参数、色值、代码、CSS 标注、软件界面说明、宣传语和不可编辑的题目内容。禁止遮挡、重绘、扭曲或弱化原题目、题板、格线、槽位、按钮和反馈状态。尤其禁止伪汉字、书页假字、课堂标语和无关标题。", "sectionsOld": ["请严格使用下述画面风格、布局、UI规范来重新生成课件：\n\n", "0. 原课件保留规则\n本风格只用于 UI 视觉换肤，不得改变原课件的学科、题型、题目内容、答案、素材数量、槽位数量、组件数量、布局关系、按钮功能、计分逻辑和交互流程。原来是英语看图拼词、填空、拖拽、选择、分类、连线、逻辑推理或其他玩法，换风格后仍保持原玩法和原题目结构。主互动题页中的题干、选项、答案、字母、汉字、拼音、数字、公式、倒计时、得分、按钮文案、反馈文案和关卡信息等可变教学内容，必须由 HTML/CSS/JS 渲染，不要烘焙进背景图或题板底图。\n\n", "1. 整体视觉与布局\n风格识别锚点：第一眼应像清新天空和草地上的童话汉字学习白板。使用奶油白纸张、柔和草地、原创小鹿学习伙伴、圆润拼图舞台、轻手绘纸张肌理和大型纸艺学习板；整体像精品课件主操作台，不像网页弹窗或半透明蓝框。不得出现真实品牌 IP 或伪汉字。\n采用春日绘本背景和中央大白板课堂 UI。背景可以有蓝天、白云、草地、樱花、彩虹、小桥和边缘陪伴角色，但只提供氛围。白板必须是最高信息承载区，花草、树枝、角色和彩虹不能穿过题目、槽位和按钮。\n使用横版课件画布，画布主体集中在中央学习区，四周保留安全边距。顶部保留原课件已有标题、关卡、进度、奖励、倒计时或得分信息；中央按原课件布局放置题目、图片区、网格、线索、选项、素材池、槽位或操作区；底部或右侧保留原有按钮和工具按钮。背景只提供氛围，不承担学习信息。\n\n", "2. 封面图规范与生图提示词逻辑\n1）封面图用于儿童互动课件首页。封面图本身必须生成主标题、副标题和进入按钮；副标题不得超过15个字，图上不生成任何额外文字、包括风格名、品牌名、logo、水印、二维码、角标、色值、尺寸标记、伪文字或无关宣传语都不允许生成。逻辑上，从封面图任意位置点击即可进入，禁止在封面图上再生成任何文字/按钮，只需要配置点击事件。\n2）主标题、副标题和按钮文案都是可变元素，必须根据当前课件真实内容替换；若为英语课件则尽量用英文，若非英语课件则一律用中文。标题、短副标题和进入按钮需要沿同一视觉主轴组织，层级清楚、可读性强，适合课堂投屏。\n3）本视觉风格封面的生图提示词：\n宝宝巴士汉字风·16:9课件版 + 童话绘本增强的儿童封面，清新天空、草地、樱花、彩虹、花朵和原创小鹿学习伙伴，奶油白纸张和圆润拼图舞台。中心上方生成大号彩色圆润标题“{标题内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，标题像纸艺泡泡字，带白描边、星星和春日装饰。标题下方生成短副标题“{副标题内容根据课件真实内容填充，副标题不超过15个字，若为英语课件则尽量用英文，若非英文课件则一律用中文}”。中下方生成黄色或浅粉圆角按钮，按钮文字为“{进入游戏，按钮内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，按钮带纸艺高光和小箭头。不得出现真实品牌 IP 或伪汉字。\n\n", "3. 背景图规范与生图提示词逻辑\n1）背景图只用于提供风格氛围，不强行生成题目承载区域。题目白板、任务板、卡片、槽位、按钮和状态栏应由 HTML/CSS/JS 根据当前课件内容绘制，并覆盖在背景图上。背景图中不要生成框、白板、题板、任务板、玻璃板、卡片、按钮、标题、题目文字、选项文字、数字、字母、汉字、格线、槽位、logo、水印或二维码。\n2）背景图可以参考该风格 bg 图和 cover 图的视觉感觉自由延展，但只保留场景、色彩、材质、角色气质和边缘装饰；画面中心应保持开阔、低干扰，方便前端绘制适配当前题型的题板。\n3）本视觉风格背景图的生图提示词：\n清新春日童话绘本背景，蓝天、白云、草地、樱花、彩虹、花朵、原创小鹿学习伙伴和轻手绘纸张肌理装饰靠边出现，整体明亮、温柔、精品课件感。画面中心保持开阔的春日空间，方便 HTML/CSS/JS 绘制奶油白汉字学习白板。不要生成白板框、纸张题板、按钮、标题、汉字、拼音、伪文字、真实品牌 IP、logo、水印或二维码。\n\n", "4. 按钮、字体与触控规范\n按钮使用厚实圆润胶囊或圆角纸艺按钮，开始偏浅粉，重置偏温暖黄，提交偏清新绿。中文可用清晰黑体，汉字学习内容可用清楚楷体或宋体，但不能牺牲识别。\n本课件面向小学低中高年级儿童，所有核心文字和可点击区域必须适合课堂投屏、互动屏和平板触控。题干、核心选项、按钮文字和状态数字要使用明显偏大的字号，普通提示文字也要清楚可读；主按钮、选项卡、拖拽块和槽位要有足够大的触碰面积和间距，儿童手指点击不容易误触。按钮必须有清楚边界、高对比文字、按压反馈和禁用态；不要把关键文字做得过小、过细、过浅或压在复杂纹理上。\n\n", "5. 色彩、材质与装饰密度\n色彩以奶油白、天空蓝、温暖黄、品牌橙、清新绿、樱花粉、浅蓝白和柔和红为主。\n色彩只作为视觉方向，不在图片中显示任何色号、色卡编号、代码、CSS 文本或设计参数。整体保持明亮、干净、护眼，避免大面积深色、强霓虹、复杂渐变和高压迫背景。装饰密度必须低于学习内容，角色、花草、糖果、气泡、电话线、科技光线或海图道具只放在边缘、角落或低层背景，不得穿过题目、选项、槽位、网格、按钮和反馈区域。\n\n", "6. UI层级与反馈\n底层是风格化背景，只提供氛围；中层是主主题板和内部功能卡片，盖在背景图上，由html/CSS/JS 绘制适合本风格的题板区域，是最高信息承载层；上层是可拖拽对象、选项、按钮、反馈条和当前选中态；弹窗层用于结果、时间到或完成反馈，必须有遮罩或清楚的独立卡片，不能遮挡关键学习内容。\n正确反馈使用浅绿描边、温暖星星和轻微发光；错误反馈使用浅红橙边框和轻微摇晃；拖拽槽位可从浅黄高亮变为浅绿实线。\n所有反馈只强化原交互，不新增新玩法，不改变原题目判断逻辑。\n\n", "7. 音效反馈规范\n音效是 UI 反馈的一部分，必须优先匹配当前风格的专属音效；只用于强化点击、选中、拖拽、落位、提交、答对、答错、提示、完成和重置状态，不改变原课件玩法、题型、节奏和按钮功能。音效需短促、低音量、低干扰，不能循环播放，不能盖过教学语音；需遵守原课件已有静音和音量设置。若没有真实音频素材，可用平台素材库、安全音效或 WebAudio 近似实现，但仍要尽量贴近本风格音效意图。\n本风格音效：点击使用白板笔轻点声，卡片移动使用纸张轻翻声，答对使用星星奖励音，答错使用柔和提示音，避免无关朗读音。\n\n", "8. 禁止项\n禁止生成无关实体、无关玩法、无关学科内容、伪文字、乱码、品牌名、公司名、水印、二维码、角标、设计参数、色值、代码、CSS 标注、软件界面说明、宣传语和不可编辑的题目内容。禁止遮挡、重绘、扭曲或弱化原题目、题板、格线、槽位、按钮和反馈状态。尤其禁止伪汉字、书页假字、课堂标语和无关标题。"], "sectionsNew": ["请严格使用下述画面风格、布局、UI规范来重新生成课件：\n\n", "0. 原课件保留规则\n本风格只用于 UI 视觉换肤，不得改变原课件的学科、题型、题目内容、答案、素材数量、槽位数量、组件数量、布局关系、按钮功能、计分逻辑和交互流程。原来是英语看图拼词、填空、拖拽、选择、分类、连线、逻辑推理或其他玩法，换风格后仍保持原玩法和原题目结构。主互动题页中的题干、选项、答案、字母、汉字、拼音、数字、公式、倒计时、得分、按钮文案、反馈文案和关卡信息等可变教学内容，必须由 HTML/CSS/JS 渲染，不要烘焙进背景图或题板底图。\n\n", "1. 整体视觉与布局\n风格识别锚点：第一眼应像清新天空和草地上的童话汉字学习白板。使用奶油白纸张、柔和草地、原创小鹿学习伙伴、圆润拼图舞台、轻手绘纸张肌理和大型纸艺学习板；整体像精品课件主操作台，不像网页弹窗或半透明蓝框。不得出现真实品牌 IP 或伪汉字。\n采用春日绘本背景和中央大白板课堂 UI。背景可以有蓝天、白云、草地、樱花、彩虹、小桥和边缘陪伴角色，但只提供氛围。白板必须是最高信息承载区，花草、树枝、角色和彩虹不能穿过题目、槽位和按钮。\n使用横版课件画布，画布主体集中在中央学习区，四周保留安全边距。顶部保留原课件已有标题、关卡、进度、奖励、倒计时或得分信息；中央按原课件布局放置题目、图片区、网格、线索、选项、素材池、槽位或操作区；底部或右侧保留原有按钮和工具按钮。背景只提供氛围，不承担学习信息。\n\n", "2. 封面图规范与生图提示词逻辑\n【本节适用范围】第2节是完整封面设计，第3节是进入后的主互动页背景，两者必须分别生成、分别使用。封面继续执行本节第3项的原有美术描述，包括艺术字、角色、场景、材质、副标题载体和按钮设计；不得把它改成“空背景＋普通HTML标题按钮”。第3节的无文字、无按钮、中央留白要求，以及第4—6节的题板、标准正文字体、学习区低干扰规则，只约束主互动页，不得用来删减封面。除用户在本次调整中明确要求不要封面外，仍按原版规范生成完整图片式首页。\n\n1）封面图用于儿童互动课件首页。封面图本身必须生成主标题、副标题和进入按钮；副标题不得超过15个字，图上不生成任何额外文字、包括风格名、品牌名、logo、水印、二维码、角标、色值、尺寸标记、伪文字或无关宣传语都不允许生成。封面图中的主标题、副标题、按钮造型和按钮文字是最终可见内容，必须保留。HTML 不得在这张封面图上再次叠加可见标题、副标题、按钮、按钮文字或底座；只配置覆盖封面的透明点击层，点击封面任意位置进入原课件。这里禁止的是 HTML 重复叠加，不是禁止图片生成标题或按钮。\n2）主标题、副标题和按钮文案都是可变元素，必须根据当前课件真实内容替换；若为英语课件则尽量用英文，若非英语课件则一律用中文。标题、短副标题和进入按钮需要沿同一视觉主轴组织，层级清楚、可读性强，适合课堂投屏。\n3）本视觉风格封面的生图提示词：\n宝宝巴士汉字风·16:9课件版 + 童话绘本增强的儿童封面，清新天空、草地、樱花、彩虹、花朵和原创小鹿学习伙伴，奶油白纸张和圆润拼图舞台。中心上方生成大号彩色圆润标题“{标题内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，标题像纸艺泡泡字，带白描边、星星和春日装饰。标题下方生成短副标题“{副标题内容根据课件真实内容填充，副标题不超过15个字，若为英语课件则尽量用英文，若非英文课件则一律用中文}”。中下方生成黄色或浅粉圆角按钮，按钮文字为“{进入游戏，按钮内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，按钮带纸艺高光和小箭头。不得出现真实品牌 IP 或伪汉字。\n\n4）封面接入顺序：先根据真实课件确认主标题、短副标题和进入文案，再依照上面的原版美术描述生成一张完整封面图；将它完整适配课件舞台，不裁掉文字、角色或按钮，也不把整张封面当作中间的小插图套进另一张封面。仅在封面容器内移除或隐藏源 HTML 的标题、副标题、示例插画和可见开始按钮，清理伪元素及 CSS 背景中重复的文字/按钮；主互动页的题干、选项、答案、控件和逻辑全部保留。不要因源课件原来使用 HTML 标题而继续保留第二套可见封面。\n5）透明点击层只承接进入事件，不绘制文字、图标、背景、边框、阴影或底座；可保留不可见的无障碍名称和键盘进入能力，不能将整张封面图设成透明。一次完整点击/触控只进入一次，不在 pointerdown 时提前撤掉封面；隔离本次手势，禁止继续触发下一页答案、拖拽或提交。进入第一题时仍为未作答状态。\n6）交付前同时核对封面原图与浏览器实际首屏：图中艺术标题、短副标题和设计按钮齐全且各一套，浏览器没有额外的可见 DOM/CSS 文字或按钮，点击任意位置可进入第一题。若有重复，修正 HTML 接入层；若图中文字错误，单独修正封面素材。不得用删掉艺术字、角色、按钮设计，换成空场景，或直接跳过封面的办法通过去重检查。\n\n", "3. 背景图规范与生图提示词逻辑\n1）背景图只用于提供风格氛围，不强行生成题目承载区域。题目白板、任务板、卡片、槽位、按钮和状态栏应由 HTML/CSS/JS 根据当前课件内容绘制，并覆盖在背景图上。背景图中不要生成框、白板、题板、任务板、玻璃板、卡片、按钮、标题、题目文字、选项文字、数字、字母、汉字、格线、槽位、logo、水印或二维码。\n2）背景图可以参考该风格 bg 图和 cover 图的视觉感觉自由延展，但只保留场景、色彩、材质、角色气质和边缘装饰；画面中心应保持开阔、低干扰，方便前端绘制适配当前题型的题板。\n3）本视觉风格背景图的生图提示词：\n清新春日童话绘本背景，蓝天、白云、草地、樱花、彩虹、花朵、原创小鹿学习伙伴和轻手绘纸张肌理装饰靠边出现，整体明亮、温柔、精品课件感。画面中心保持开阔的春日空间，方便 HTML/CSS/JS 绘制奶油白汉字学习白板。不要生成白板框、纸张题板、按钮、标题、汉字、拼音、伪文字、真实品牌 IP、logo、水印或二维码。\n\n", "4. 按钮、字体与触控规范\n按钮使用厚实圆润胶囊或圆角纸艺按钮，开始偏浅粉，重置偏温暖黄，提交偏清新绿。中文可用清晰黑体，汉字学习内容可用清楚楷体或宋体，但不能牺牲识别。\n本课件面向小学低中高年级儿童，所有核心文字和可点击区域必须适合课堂投屏、互动屏和平板触控。题干、核心选项、按钮文字和状态数字要使用明显偏大的字号，普通提示文字也要清楚可读；主按钮、选项卡、拖拽块和槽位要有足够大的触碰面积和间距，儿童手指点击不容易误触。按钮必须有清楚边界、高对比文字、按压反馈和禁用态；不要把关键文字做得过小、过细、过浅或压在复杂纹理上。\n\n", "5. 色彩、材质与装饰密度\n色彩以奶油白、天空蓝、温暖黄、品牌橙、清新绿、樱花粉、浅蓝白和柔和红为主。\n色彩只作为视觉方向，不在图片中显示任何色号、色卡编号、代码、CSS 文本或设计参数。整体保持明亮、干净、护眼，避免大面积深色、强霓虹、复杂渐变和高压迫背景。装饰密度必须低于学习内容，角色、花草、糖果、气泡、电话线、科技光线或海图道具只放在边缘、角落或低层背景，不得穿过题目、选项、槽位、网格、按钮和反馈区域。\n\n", "6. UI层级与反馈\n底层是风格化背景，只提供氛围；中层是主主题板和内部功能卡片，盖在背景图上，由html/CSS/JS 绘制适合本风格的题板区域，是最高信息承载层；上层是可拖拽对象、选项、按钮、反馈条和当前选中态；弹窗层用于结果、时间到或完成反馈，必须有遮罩或清楚的独立卡片，不能遮挡关键学习内容。\n正确反馈使用浅绿描边、温暖星星和轻微发光；错误反馈使用浅红橙边框和轻微摇晃；拖拽槽位可从浅黄高亮变为浅绿实线。\n所有反馈只强化原交互，不新增新玩法，不改变原题目判断逻辑。\n\n", "7. 音效反馈规范\n音效是 UI 反馈的一部分，必须优先匹配当前风格的专属音效；只用于强化点击、选中、拖拽、落位、提交、答对、答错、提示、完成和重置状态，不改变原课件玩法、题型、节奏和按钮功能。音效需短促、低音量、低干扰，不能循环播放，不能盖过教学语音；需遵守原课件已有静音和音量设置。若没有真实音频素材，可用平台素材库、安全音效或 WebAudio 近似实现，但仍要尽量贴近本风格音效意图。\n本风格音效：点击使用白板笔轻点声，卡片移动使用纸张轻翻声，答对使用星星奖励音，答错使用柔和提示音，避免无关朗读音。\n\n", "8. 禁止项\n禁止生成无关实体、无关玩法、无关学科内容、伪文字、乱码、品牌名、公司名、水印、二维码、角标、设计参数、色值、代码、CSS 标注、软件界面说明、宣传语和不可编辑的题目内容。禁止遮挡、重绘、扭曲或弱化原题目、题板、格线、槽位、按钮和反馈状态。尤其禁止伪汉字、书页假字、课堂标语和无关标题。"], "section2": 3, "blocks": [{"kind": "equal", "old": "2. 封面图规范与生图提示词逻辑\n", "new": "2. 封面图规范与生图提示词逻辑\n"}, {"kind": "insert", "old": "", "new": "【本节适用范围】第2节是完整封面设计，第3节是进入后的主互动页背景，两者必须分别生成、分别使用。封面继续执行本节第3项的原有美术描述，包括艺术字、角色、场景、材质、副标题载体和按钮设计；不得把它改成“空背景＋普通HTML标题按钮”。第3节的无文字、无按钮、中央留白要求，以及第4—6节的题板、标准正文字体、学习区低干扰规则，只约束主互动页，不得用来删减封面。除用户在本次调整中明确要求不要封面外，仍按原版规范生成完整图片式首页。\n\n", "change": 0, "left": [], "right": [{"text": "【本节适用范围】第2节是完整封面设计，第3节是进入后的主互动页背景，两者必须分别生成、分别使用。封面继续执行本节第3项的原有美术描述，包括艺术字、角色、场景、材质、副标题载体和按钮设计；不得把它改成“空背景＋普通HTML标题按钮”。第3节的无文字、无按钮、中央留白要求，以及第4—6节的题板、标准正文字体、学习区低干扰规则，只约束主互动页，不得用来删减封面。除用户在本次调整中明确要求不要封面外，仍按原版规范生成完整图片式首页。\n\n", "changed": true}]}, {"kind": "replace", "old": "1）封面图用于儿童互动课件首页。封面图本身必须生成主标题、副标题和进入按钮；副标题不得超过15个字，图上不生成任何额外文字、包括风格名、品牌名、logo、水印、二维码、角标、色值、尺寸标记、伪文字或无关宣传语都不允许生成。逻辑上，从封面图任意位置点击即可进入，禁止在封面图上再生成任何文字/按钮，只需要配置点击事件。\n", "new": "1）封面图用于儿童互动课件首页。封面图本身必须生成主标题、副标题和进入按钮；副标题不得超过15个字，图上不生成任何额外文字、包括风格名、品牌名、logo、水印、二维码、角标、色值、尺寸标记、伪文字或无关宣传语都不允许生成。封面图中的主标题、副标题、按钮造型和按钮文字是最终可见内容，必须保留。HTML 不得在这张封面图上再次叠加可见标题、副标题、按钮、按钮文字或底座；只配置覆盖封面的透明点击层，点击封面任意位置进入原课件。这里禁止的是 HTML 重复叠加，不是禁止图片生成标题或按钮。\n", "change": 1, "left": [{"text": "1）封面图用于儿童互动课件首页。封面图本身必须生成主标题、副标题和进入按钮；副标题不得超过15个字，图上不生成任何额外文字、包括风格名、品牌名、logo、水印、二维码、角标、色值、尺寸标记、伪文字或无关宣传语都不允许生成。", "changed": false}, {"text": "逻辑上，从封面图任意位置点击即可 ，禁止继续触发下一页答案、拖拽或提交。进入第一题时仍为未作答状态。\n", "change": 3, "left": [], "right": [{"text": "5）透明点击层只承接进入事件，不绘制文字、图标、背景、边框、阴影或底座；可保留不可见的无障碍名称和键盘进入能力，不能将整张封面图设成透明。一次完整点击/触控只进入一次，不在 pointerdown 时提前撤掉封面；隔离本次手势，禁止继续触发下一页答案、拖拽或提交。进入第一题时仍为未作答状态。\n", "changed": true}]}, {"kind": "insert", "old": "", "new": "6）交付前同时核对封面原图与浏览器实际首屏：图中艺术标题、短副标题和设计按钮齐全且各一套，浏览器没有额外的可见 DOM/CSS 文字或按钮，点击任意位置可进入第一题。若有重复，修正 HTML 接入层；若图中文字错误，单独修正封面素材。不得用删掉艺术字、角色、按钮设计，换成空场景，或直接跳过封面的办法通过去重检查。\n\n", "change": 4, "left": [], "right": [{"text": "6）交付前同时核对封面原图与浏览器实际首屏：图中艺术标题、短副标题和设计按钮齐全且各一套，浏览器没有额外的可见 DOM/CSS 文字或按钮，点击任意位置可进入第一题。若有重复，修正 HTML 接入层；若图中文字错误，单独修正封面素材。不得用删掉艺术字、角色、按钮设计，换成空场景，或直接跳过封面的办法通过去重检查。\n\n", "changed": true}]}], "delta": 825}, {"styleCode": "candy_task_board", "displayName": "糖果任务板风", "caseId": "S28", "promptText": "请严格按“糖果任务板风 UI规范”重新生成同一课件界面。\n\n0. 原课件保留规则\n本风格只用于 UI 视觉换肤，不得改变原课件的学科、题型、题目内容、答案、素材数量、槽位数量、组件数量、布局关系、按钮功能、计分逻辑和交互流程。原来是英语看图拼词、填空、拖拽、选择、分类、连线、逻辑推理或其他玩法，换风格后仍保持原玩法和原题目结构。主互动题页中的题干、选项、答案、字母、汉字、拼音、数字、公式、倒计时、得分、按钮文案、反馈文案和关卡信息等可变教学内容，必须由 HTML/CSS/JS 渲染，不要烘焙进背景图或题板底图。\n\n1. 整体视觉与布局\n风格识别锚点：第一眼应像糖果纸艺任务板和果冻胶囊按钮系统。使用精致纸艺果冻胶囊、圆润厚实边缘、柔和白色高光、底部层叠纸片阴影、奶油白中心区、浅粉、温暖黄和清新绿的柔和渐变；按钮和任务板中心必须干净，方便 HTML 叠加文字。\n采用糖果乐园背景和中央大型糖果任务板。画面可以有糖霜边框、糖果按钮、星星奖励、奶油白任务板、软糖卡片和彩虹点缀。任务板内部必须浅、干净、清楚，背景可以丰富，但学习内容区不能被糖果装饰抢走注意力。\n使用横版课件画布，画布主体集中在中央学习区，四周保留安全边距。顶部保留原课件已有标题、关卡、进度、奖励、倒计时或得分信息；中央按原课件布局放置题目、图片区、网格、线索、选项、素材池、槽位或操作区；底部或右侧保留原有按钮和工具按钮。背景只提供氛围，不承担学习信息。\n\n2. 封面图规范与生图提示词逻辑\n【本节适用范围】第2节是完整封面设计，第3节是进入后的主互动页背景，两者必须分别生成、分别使用。封面继续执行本节第3项的原有美术描述，包括艺术字、角色、场景、材质、副标题载体和按钮设计；不得把它改成“空背景＋普通HTML标题按钮”。第3节的无文字、无按钮、中央留白要求，以及第4—6节的题板、标准正文字体、学习区低干扰规则，只约束主互动页，不得用来删减封面。除用户在本次调整中明确要求不要封面外，仍按原版规范生成完整图片式首页。\n\n1）封面图用于儿童互动课件首页。封面图本身必须生成主标题、副标题和进入按钮；副标题不得超过15个字，图上不生成任何额外文字、包括风格名、品牌名、logo、水印、二维码、角标、色值、尺寸标记、伪文字或无关宣传语都不允许生成。封面图中的主标题、副标题、按钮造型和按钮文字是最终可见内容，必须保留。HTML 不得在这张封面图上再次叠加可见标题、副标题、按钮、按钮文字或底座；只配置覆盖封面的透明点击层，点击封面任意位置进入原课件。这里禁止的是 HTML 重复叠加，不是禁止图片生成标题或按钮。\n2）主标题、副标题和按钮文案都是可变元素，必须根据当前课件真实内容替换；若为英语课件则尽量用英文，若非英语课件则一律用中文。标题、短副标题和进入按钮需要沿同一视觉主轴组织，层级清楚、可读性强，适合课堂投屏。\n3）本视觉风格封面的生图提示词：\n糖果纸艺任务板风儿童封面，粉色、奶油黄、浅橙、薄荷绿和彩虹渐变，糖果桥、棒棒糖、软糖、星星、云朵和可爱粉色小猫或圆润糖果角色。中心上方生成果冻糖霜大标题“{标题内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，标题色彩柔和、高光明显、厚白描边。标题下方生成短副标题“{副标题内容根据课件真实内容填充，副标题不超过15个字，若为英语课件则尽量用英文，若非英文课件则一律用中文}”。中下方生成粉色果冻胶囊按钮，按钮文字为“{Let’s Play，按钮内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，按钮带星星、白描边和纸艺厚度。\n\n4）封面接入顺序：先根据真实课件确认主标题、短副标题和进入文案，再依照上面的原版美术描述生成一张完整封面图；将它完整适配课件舞台，不裁掉文字、角色或按钮，也不把整张封面当作中间的小插图套进另一张封面。仅在封面容器内移除或隐藏源 HTML 的标题、副标题、示例插画和可见开始按钮，清理伪元素及 CSS 背景中重复的文字/按钮；主互动页的题干、选项、答案、控件和逻辑全部保留。不要因源课件原来使用 HTML 标题而继续保留第二套可见封面。\n5）透明点击层只承接进入事件，不绘制文字、图标、背景、边框、阴影或底座；可保留不可见的无障碍名称和键盘进入能力，不能将整张封面图设成透明。一次完整点击/触控只进入一次，不在 pointerdown 时提前撤掉封面；隔离本次手势，禁止继续触发下一页答案、拖拽或提交。进入第一题时仍为未作答状态。\n6）交付前同时核对封面原图与浏览器实际首屏：图中艺术标题、短副标题和设计按钮齐全且各一套，浏览器没有额外的可见 DOM/CSS 文字或按钮，点击任意位置可进入第一题。若有重复，修正 HTML 接入层；若图中文字错误，单独修正封面素材。不得用删掉艺术字、角色、按钮设计，换成空场景，或直接跳过封面的办法通过去重检查。\n\n3. 背景图规范与生图提示词逻辑\n1）背景图只用于提供风格氛围，不强行生成题目承载区域。题目白板、任务板、卡片、槽位、按钮和状态栏应由 HTML/CSS/JS 根据当前课件内容绘制，并覆盖在背景图上。背景图中不要生成框、白板、题板、任务板、玻璃板、卡片、按钮、标题、题目文字、选项文字、数字、字母、汉字、格线、槽位、logo、水印或二维码。\n2）背景图可以参考该风格 bg 图和 cover 图的视觉感觉自由延展，但只保留场景、色彩、材质、角色气质和边缘装饰；画面中心应保持开阔、低干扰，方便前端绘制适配当前题型的题板。\n3）本视觉风格背景图的生图提示词：\n糖果纸艺任务板风背景，粉色糖果世界、彩虹桥、棒棒糖、软糖、星星、云朵、奶油黄和薄荷绿渐变装饰分布在边缘，可有粉色小猫或圆润糖果角色作陪伴。画面中心保持温暖开阔、低纹理、无框的糖果氛围，方便 HTML/CSS/JS 绘制任务板。不要生成奶油任务板框、按钮、标题、文字、字母、槽位、logo、水印或二维码。\n\n4. 按钮、字体与触控规范\n按钮使用圆润糖果按钮、果冻圆按钮或胶囊按钮，主流程按钮偏粉色或蜜桃色，发音偏柠檬黄，重来偏天空蓝。字母、数字、汉字和按钮文字要居中且大而清楚。\n本课件面向小学低中高年级儿童，所有核心文字和可点击区域必须适合课堂投屏、互动屏和平板触控。题干、核心选项、按钮文字和状态数字要使用明显偏大的字号，普通提示文字也要清楚可读；主按钮、选项卡、拖拽块和槽位要有足够大的触碰面积和间距，儿童手指点击不容易误触。按钮必须有清楚边界、高对比文字、按压反馈和禁用态；不要把关键文字做得过小、过细、过浅或压在复杂纹理上。\n\n5. 色彩、材质与装饰密度\n色彩以奶油白、奶油黄、蜜桃粉、樱花粉、柠檬黄、薄荷绿、天空蓝、浅橙、薰衣草紫和柔和红为主。\n色彩只作为视觉方向，不在图片中显示任何色号、色卡编号、代码、CSS 文本或设计参数。整体保持明亮、干净、护眼，避免大面积深色、强霓虹、复杂渐变和高压迫背景。装饰密度必须低于学习内容，角色、花草、糖果、气泡、电话线、科技光线或海图道具只放在边缘、角落或低层背景，不得穿过题目、选项、槽位、网格、按钮和反馈区域。\n\n6. UI层级与反馈\n底层是风格化背景，只提供氛围；中层是主主题板和内部功能卡片，盖在背景图上，由html/CSS/JS 绘制适合本风格的题板区域，是最高信息承载层；上层是可拖拽对象、选项、按钮、反馈条和当前选中态；弹窗层用于结果、时间到或完成反馈，必须有遮罩或清楚的独立卡片，不能遮挡关键学习内容。\n正确反馈使用清新绿描边、糖果星星、软糖吸附和轻微弹起；错误反馈使用浅粉红边框；选中态使用白描边和果冻上浮。\n所有反馈只强化原交互，不新增新玩法 倒计时或得分信息；中央按原课件布局放置题目、图片区、网格、线索、选项、素材池、槽位或操作区；底部或右侧保留原有按钮和工具按钮。背景只提供氛围，不承担学习信息。\n\n2. 封面图规范与生图提示词逻辑\n【本节适用范围】第2节是完整封面设计，第3节是进入后的主互动页背景，两者必须分别生成、分别使用。封面继续执行本节第3项的原有美术描述，包括艺术字、角色、场景、材质、副标题载体和按钮设计；不得把它改成“空背景＋普通HTML标题按钮”。第3节的无文字、无按钮、中央留白要求，以及第4—6节的题板、标准正文字体、学习区低干扰规则，只约束主互动页，不得用来删减封面。除用户在本次调整中明确要求不要封面外，仍按原版规范生成完整图片式首页。\n\n1）封面图用于儿童互动课件首页。封面图本身必须生成主标题、副标题和进入按钮；副标题不得超过15个字，图上不生成任何额外文字、包括风格名、品牌名、logo、水印、二维码、角标、色值、尺寸标记、伪文字或无关宣传语都不允许生成。封面图中的主标题、副标题、按钮造型和按钮文字是最终可见内容，必须保留。HTML 不得在这张封面图上再次叠加可见标题、副标题、按钮、按钮文字或底座；只配置覆盖封面的透明点击层，点击封面任意位置进入原课件。这里禁止的是 HTML 重复叠加，不是禁止图片生成标题或按钮。\n2）主标题、副标题和按钮文案都是可变元素，必须根据当前课件真实内容替换；若为英语课件则尽量用英文，若非英语课件则一律用中文。标题、短副标题和进入按钮需要沿同一视觉主轴组织，层级清楚、可读性强，适合课堂投屏。\n3）本视觉风格封面的生图提示词：\n糖果纸艺任务板风儿童封面，粉色、奶油黄、浅橙、薄荷绿和彩虹渐变，糖果桥、棒棒糖、软糖、星星、云朵和可爱粉色小猫或圆润糖果角色。中心上方生成果冻糖霜大标题“{标题内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，标题色彩柔和、高光明显、厚白描边。标题下方生成短副标题“{副标题内容根据课件真实内容填充，副标题不超过15个字，若为英语课件则尽量用英文，若非英文课件则一律用中文}”。中下方生成粉色果冻胶囊按钮，按钮文字为“{Let’s Play，按钮内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，按钮带星星、白描边和纸艺厚度。\n\n4）封面接入顺序：先根据真实课件确认主标题、短副标题和进入文案，再依照上面的原版美术描述生成一张完整封面图；将它完整适配课件舞台，不裁掉文字、角色或按钮，也不把整张封面当作中间的小插图套进另一张封面。仅在封面容器内移除或隐藏源 HTML 的标题、副标题、示例插画和可见开始按钮，清理伪元素及 CSS 背景中重复的文字/按钮；主互动页的题干、选项、答案、控件和逻辑全部保留。不要因源课件原来使用 HTML 标题而继续保留第二套可见封面。\n5）透明点击层只承接进入事件，不绘制文字、图标、背景、边框、阴影或底座；可保留不可见的无障碍名称和键盘进入能力，不能将整张封面图设成透明。一次完整点击/触控只进入一次，不在 pointerdown 时提前撤掉封面；隔离本次手势，禁止继续触发下一页答案、拖拽或提交。进入第一题时仍为未作答状态。\n6）交付前同时核对封面原图与浏览器实际首屏：图中艺术标题、短副标题和设计按钮齐全且各一套，浏览器没有额外的可见 DOM/CSS 文字或按钮，点击任意位置可进入第一题。若有重复，修正 HTML 接入层；若图中文字错误，单独修正封面素材。不得用删掉艺术字、角色、按钮设计，换成空场景，或直接跳过封面的办法通过去重检查。\n\n3. 背景图规范与生图提示词逻辑\n1）背景图只用于提供风格氛围，不强行生成题目承载区域。题目白板、任务板、卡片、槽位、按钮和状态栏应由 HTML/CSS/JS 根据当前课件内容绘制，并覆盖在背景图上。背景图中不要生成框、白板、题板、任务板、玻璃板、卡片、按钮、标题、题目文字、选项文字、数字、字母、汉字、格线、槽位、logo、水印或二维码。\n2）背景图可以参考该风格 bg 图和 cover 图的视觉感觉自由延展，但只保留场景、色彩、材质、角色气质和边缘装饰；画面中心应保持开阔、低干扰，方便前端绘制适配当前题型的题板。\n3）本视觉风格背景图的生图提示词：\n糖果纸艺任务板风背景，粉色糖果世界、彩虹桥、棒棒糖、软糖、星星、云朵、奶油黄和薄荷绿渐变装饰分布在边缘，可有粉色小猫或圆润糖果角色作陪伴。画面中心保持温暖开阔、低纹理、无框的糖果氛围，方便 HTML/CSS/JS 绘制任务板。不要生成奶油任务板框、按钮、标题、文字、字母、槽位、logo、水印或二维码。\n\n4. 按钮、字体与触控规范\n按钮使用圆润糖果按钮、果冻圆按钮或胶囊按钮，主流程按钮偏粉色或蜜桃色，发音偏柠檬黄，重来偏天空蓝。字母、数字、汉字和按钮文字要居中且大而清楚。\n本课件面向小学低中高年级儿童，所有核心文字和可点击区域必须适合课堂投屏、互动屏和平板触控。题干、核心选项、按钮文字和状态数字要使用明显偏大的字号，普通提示文字也要清楚可读；主按钮、选项卡、拖拽块和槽位要有足够大的触碰面积和间距，儿童手指点击不容易误触。按钮必须有清楚边界、高对比文字、按压反馈和禁用态；不要把关键文字做得过小、过细、过浅或压在复杂纹理上。\n\n5. 色彩、材质与装饰密度\n色彩以奶油白、奶油黄、蜜桃粉、樱花粉、柠檬黄、薄荷绿、天空蓝、浅橙、薰衣草紫和柔和红为主。\n色彩只作为视觉方向，不在图片中显示任何色号、色卡编号、代码、CSS 文本或设计参数。整体保持明亮、干净、护眼，避免大面积深色、强霓虹、复杂渐变和高压迫背景。装饰密度必须低于学习内容，角色、花草、糖果、气泡、电话线、科技光线或海图道具只放在边缘、角落或低层背景，不得穿过题目、选项、槽位、网格、按钮和反馈区域。\n\n6. UI层级与反馈\n底层是风格化背景，只提供氛围；中层是主主题板和内部功能卡片，盖在背景图上，由html/CSS/JS 绘制适合本风格的题板区域，是最高信息承载层；上层是可拖拽对象、选项、按钮、反馈条和当前选中态；弹窗层用于结果、时间到或完成反馈，必须有遮罩或清楚的独立卡片，不能遮挡关键学习内容。\n正确反馈使用清新绿描边、糖果星星、软糖吸附和轻微弹起；错误反馈使用浅粉红边框；选中态使用白描边和果冻上浮。\n所有反馈只强化原交互，不新增新玩法，不改变原题目判断逻辑。\n\n7. 音效反馈规范\n音效是 UI 反馈的一部分，必须优先匹配当前风格的专属音效；只用于强化点击、选中、拖拽、落位、提交、答对、答错、提示、完成和重置状态，不改变原课件玩法、题型、节奏和按钮功能。音效需短促、低音量、低干扰，不能循环播放，不能盖过教学语音；需遵守原课件已有静音和音量设置。若没有真实音频素材，可用平台素材库、安全音效或 WebAudio 近似实现，但仍要尽量贴近本风格音效意图。\n本风格音效：点击使用糖果按钮弹跳声，拖拽落位使用软糖吸附声，答对使用星星奖励和糖霜轻碰声，完成使用明亮短铃。\n\n8. 禁止项\n禁止生成无关实体、无关玩法、无关学科内容、伪文字、乱码、品牌名、公司名、水印、二维码、角标、设计参数、色值、代码、CSS 标注、软件界面说明、宣传语和不可编辑的题目内容。禁止遮挡、重绘、扭曲或弱化原题目、题板、格线、槽位、按钮和反馈状态。", "sectionsOld": ["请严格按“糖果任务板风 UI规范”重新生成同一课件界面。\n\n", "0. 原课件保留规则\n本风格只用于 UI 视觉换肤，不得改变原课件的学科、题型、题目内容、答案、素材数量、槽位数量、组件数量、布局关系、按钮功能、计分逻辑和交互流程。原来是英语看图拼词、填空、拖拽、选择、分类、连线、逻辑推理或其他玩法，换风格后仍保持原玩法和原题目结构。主互动题页中的题干、选项、答案、字母、汉字、拼音、数字、公式、倒计时、得分、按钮文案、反馈文案和关卡信息等可变教学内容，必须由 HTML/CSS/JS 渲染，不要烘焙进背景图或题板底图。\n\n", "1. 整体视觉与布局\n风格识别锚点：第一眼应像糖果纸艺任务板和果冻胶囊按钮系统。使用精致纸艺果冻胶囊、圆润厚实边缘、柔和白色高光、底部层叠纸片阴影、奶油白中心区、浅粉、温暖黄和清新绿的柔和渐变；按钮和任务板中心必须干净，方便 HTML 叠加文字。\n采用糖果乐园背景和中央大型糖果任务板。画面可以有糖霜边框、糖果按钮、星星奖励、奶油白任务板、软糖卡片和彩虹点缀。任务板内部必须浅、干净、清楚，背景可以丰富，但学习内容区不能被糖果装饰抢走注意力。\n使用横版课件画布，画布主体集中在中央学习区，四周保留安全边距。顶部保留原课件已有标题、关卡、进度、奖励、倒计时或得分信息；中央按原课件布局放置题目、图片区、网格、线索、选项、素材池、槽位或操作区；底部或右侧保留原有按钮和工具按钮。背景只提供氛围，不承担学习信息。\n\n", "2. 封面图规范与生图提示词逻辑\n1）封面图用于儿童互动课件首页。封面图本身必须生成主标题、副标题和进入按钮；副标题不得超过15个字，图上不生成任何额外文字、包括风格名、品牌名、logo、水印、二维码、角标、色值、尺寸标记、伪文字或无关宣传语都不允许生成。逻辑上，从封面图任意位置点击即可进入，禁止在封面图上再生成任何文字/按钮，只需要配置点击事件。\n2）主标题、副标题和按钮文案都是可变元素，必须根据当前课件真实内容替换；若为英语课件则尽量用英文，若非英语课件则一律用中文。标题、短副标题和进入按钮需要沿同一视觉主轴组织，层级清楚、可读性强，适合课堂投屏。\n3）本视觉风格封面的生图提示词：\n糖果纸艺任务板风儿童封面，粉色、奶油黄、浅橙、薄荷绿和彩虹渐变，糖果桥、棒棒糖、软糖、星星、云朵和可爱粉色小猫或圆润糖果角色。中心上方生成果冻糖霜大标题“{标题内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，标题色彩柔和、高光明显、厚白描边。标题下方生成短副标题“{副标题内容根据课件真实内容填充，副标题不超过15个字，若为英语课件则尽量用英文，若非英文课件则一律用中文}”。中下方生成粉色果冻胶囊按钮，按钮文字为“{Let’s Play，按钮内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，按钮带星星、白描边和纸艺厚度。\n\n", "3. 背景图规范与生图提示词逻辑\n1）背景图只用于提供风格氛围，不强行生成题目承载区域。题目白板、任务板、卡片、槽位、按钮和状态栏应由 HTML/CSS/JS 根据当前课件内容绘制，并覆盖在背景图上。背景图中不要生成框、白板、题板、任务板、玻璃板、卡片、按钮、标题、题目文字、选项文字、数字、字母、汉字、格线、槽位、logo、水印或二维码。\n2）背景图可以参考该风格 bg 图和 cover 图的视觉感觉自由延展，但只保留场景、色彩、材质、角色气质和边缘装饰；画面中心应保持开阔、低干扰，方便前端绘制适配当前题型的题板。\n3）本视觉风格背景图的生图提示词：\n糖果纸艺任务板风背景，粉色糖果世界、彩虹桥、棒棒糖、软糖、星星、云朵、奶油黄和薄荷绿渐变装饰分布在边缘，可有粉色小猫或圆润糖果角色作陪伴。画面中心保持温暖开阔、低纹理、无框的糖果氛围，方便 HTML/CSS/JS 绘制任务板。不要生成奶油任务板框、按钮、标题、文字、字母、槽位、logo、水印或二维码。\n\n", "4. 按钮、字体与触控规范\n按钮使用圆润糖果按钮、果冻圆按钮或胶囊按钮，主流程按钮偏粉色或蜜桃色，发音偏柠檬黄，重来偏天空蓝。字母、数字、汉字和按钮文字要居中且大而清楚。\n本课件面向小学低中高年级儿童，所有核心文字和可点击区域必须适合课堂投屏、互动屏和平板触控。题干、核心选项、按钮文字和状态数字要使用明显偏大的字号，普通提示文字也要清楚可读；主按钮、选项卡、拖拽块和槽位要有足够大的触碰面积和间距，儿童手指点击不容易误触。按钮必须有清楚边界、高对比文字、按压反馈和禁用态；不要把关键文字做得过小、过细、过浅或压在复杂纹理上。\n\n", "5. 色彩、材质与装饰密度\n色彩以奶油白、奶油黄、蜜桃粉、樱花粉、柠檬黄、薄荷绿、天空蓝、浅橙、薰衣草紫和柔和红为主。\n色彩只作为视觉方向，不在图片中显示任何色号、色卡编号、代码、CSS 文本或设计参数。整体保持明亮、干净、护眼，避免大面积深色、强霓虹、复杂渐变和高压迫背景。装饰密度必须低于学习内容，角色、花草、糖果、气泡、电话线、科技光线或海图道具只放在边缘、角落或低层背景，不得穿过题目、选项、槽位、网格、按钮和反馈区域。\n\n", "6. UI层级与反馈\n底层是风格化背景，只提供氛围；中层是主主题板和内部功能卡片，盖在背景图上，由html/CSS/JS 绘制适合本风格的题板区域，是最高信息承载层；上层是可拖拽对象、选项、按钮、反馈条和当前选中态；弹窗层用于结果、时间到或完成反馈，必须有遮罩或清楚的独立卡片，不能遮挡关键学习内容。\n正确反馈使用清新绿描边、糖果星星、软糖吸附和轻微弹起；错误反馈使用浅粉红边框；选中态使用白描边和果冻上浮。\n所有反馈只强化原交互，不新增新玩法，不改变原题目判断逻辑。\n\n", "7. 音效反馈规范\n音效是 UI 反馈的一部分，必须优先匹配当前风格的专属音效；只用于强化点击、选中、拖拽、落位、提交、答对、答错、提示、完成和重置状态，不改变原课件玩法、题型、节奏和按钮功能。音效需短促、低音量、低干扰，不能循环播放，不能盖过教学语音；需遵守原课件已有静音和音量设置。若没有真实音频素材，可用平台素材库、安全音效或 WebAudio 近似实现，但仍要尽量贴近本风格音效意图。\n本风格音效：点击使用糖果按钮弹跳声，拖拽落位使用软糖吸附声，答对使用星星奖励和糖霜轻碰声，完成使用明亮短铃。\n\n", "8. 禁止项\n禁止生成无关实体、无关玩法、无关学科内容、伪文字、乱码、品牌名、公司名、水印、二维码、角标、设计参数、色值、代码、CSS 标注、软件界面说明、宣传语和不可编辑的题目内容。禁止遮挡、重绘、扭曲或弱化原题目、题板、格线、槽位、按钮和反馈状态。"], "sectionsNew": ["请严格按“糖果任务板风 UI规范”重新生成同一课件界面。\n\n", "0. 原课件保留规则\n本风格只用于 UI 视觉换肤，不得改变原课件的学科、题型、题目内容、答案、素材数量、槽位数量、组件数量、布局关系、按钮功能、计分逻辑和交互流程。原来是英语看图拼词、填空、拖拽、选择、分类、连线、逻辑推理或其他玩法，换风格后仍保持原玩法和原题目结构。主互动题页中的题干、选项、答案、字母、汉字、拼音、数字、公式、倒计时、得分、按钮文案、反馈文案和关卡信息等可变教学内容，必须由 HTML/CSS/JS 渲染，不要烘焙进背景图或题板底图。\n\n", "1. 整体视觉与布局\n风格识别锚点：第一眼应像糖果纸艺任务板和果冻胶囊按钮系统。使用精致纸艺果冻胶囊、圆润厚实边缘、柔和白色高光、底部层叠纸片阴影、奶油白中心区、浅粉、温暖黄和清新绿的柔和渐变；按钮和任务板中心必须干净，方便 HTML 叠加文字。\n采用糖果乐园背景和中央大型糖果任务板。画面可以有糖霜边框、糖果按钮、星星奖励、奶油白任务板、软糖卡片和彩虹点缀。任务板内部必须浅、干净、清楚，背景可以丰富，但学习内容区不能被糖果装饰抢走注意力。\n使用横版课件画布，画布主体集中在中央学习区，四周保留安全边距。顶部保留原课件已有标题、关卡、进度、奖励、倒计时或得分信息；中央按原课件布局放置题目、图片区、网格、线索、选项、素材池、槽位或操作区；底部或右侧保留原有按钮和工具按钮。背景只提供氛围，不承担学习信息。\n\n", "2. 封面图规范与生图提示词逻辑\n【本节适用范围】第2节是完整封面设计，第3节是进入后的主互动页背景，两者必须分别生成、分别使用。封面继续执行本节第3项的原有美术描述，包括艺术字、角色、场景、材质、副标题载体和按钮设计；不得把它改成“空背景＋普通HTML标题按钮”。第3节的无文字、无按钮、中央留白要求，以及第4—6节的题板、标准正文字体、学习区低干扰规则，只约束主互动页，不得用来删减封面。除用户在本次调整中明确要求不要封面外，仍按原版规范生成完整图片式首页。\n\n1）封面图用于儿童互动课件首页。封面图本身必须生成主标题、副标题和进入按钮；副标题不得超过15个字，图上不生成任何额外文字、包括风格名、品牌名、logo、水印、二维码、角标、色值、尺寸标记、伪文字或无关宣传语都不允许生成。封面图中的主标题、副标题、按钮造型和按钮文字是最终可见内容，必须保留。HTML 不得在这张封面图上再次叠加可见标题、副标题、按钮、按钮文字或底座；只配置覆盖封面的透明点击层，点击封面任意位置进入原课件。这里禁止的是 HTML 重复叠加，不是禁止图片生成标题或按钮。\n2）主标题、副标题和按钮文案都是可变元素，必须根据当前课件真实内容替换；若为英语课件则尽量用英文，若非英语课件则一律用中文。标题、短副标题和进入按钮需要沿同一视觉主轴组织，层级清楚、可读性强，适合课堂投屏。\n3）本视觉风格封面的生图提示词：\n糖果纸艺任务板风儿童封面，粉色、奶油黄、浅橙、薄荷绿和彩虹渐变，糖果桥、棒棒糖、软糖、星星、云朵和可爱粉色小猫或圆润糖果角色。中心上方生成果冻糖霜大标题“{标题内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，标题色彩柔和、高光明显、厚白描边。标题下方生成短副标题“{副标题内容根据课件真实内容填充，副标题不超过15个字，若为英语课件则尽量用英文，若非英文课件则一律用中文}”。中下方生成粉色果冻胶囊按钮，按钮文字为“{Let’s Play，按钮内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，按钮带星星、白描边和纸艺厚度。\n\n4）封面接入顺序：先根据真实课件确认主标题、短副标题和进入文案，再依照上面的原版美术描述生成一张完整封面图；将它完整适配课件舞台，不裁掉文字、角色或按钮，也不把整张封面当作中间的小插图套进另一张封面。仅在封面容器内移除或隐藏源 HTML 的标题、副标题、示例插画和可见开始按钮，清理伪元素及 CSS 背景中重复的文字/按钮；主互动页的题干、选项、答案、控件和逻辑全部保留。不要因源课件原来使用 HTML 标题而继续保留第二套可见封面。\n5）透明点击层只承接进入事件，不绘制文字、图标、背景、边框、阴影或底座；可保留不可见的无障碍名称和键盘进入能力，不能将整张封面图设成透明。一次完整点击/触控只进入一次，不在 pointerdown 时提前撤掉封面；隔离本次手势，禁止继续触发下一页答案、拖拽或提交。进入第一题时仍为未作答状态。\n6）交付前同时核对封面原图与浏览器实际首屏：图中艺术标题、短副标题和设计按钮齐全且各一套，浏览器没有额外的可见 DOM/CSS 文字或按钮，点击任意位置可进入第一题。若有重复，修正 HTML 接入层；若图中文字错误，单独修正封面素材。不得用删掉艺术字、角色、按钮设计，换成空场景，或直接跳过封面的办法通过去重检查。\n\n", "3. 背景图规范与生图提示词逻辑\n1）背景图只用于提供风格氛围，不强行生成题目承载区域。题目白板、任务板、卡片、槽位、按钮和状态栏应由 HTML/CSS/JS 根据当前课件内容绘制，并覆盖在背景图上。背景图中不要生成框、白板、题板、任务板、玻璃板、卡片、按钮、标题、题目文字、选项文字、数字、字母、汉字、格线、槽位、logo、水印或二维码。\n2）背景图可以参考该风格 bg 图和 cover 图的视觉感觉自由延展，但只保留场景、色彩、材质、角色气质和边缘装饰；画面中心应保持开阔、低干扰，方便前端绘制适配当前题型的题板。\n3）本视觉风格背景图的生图提示词：\n糖果纸艺任务板风背景，粉色糖果世界、彩虹桥、棒棒糖、软糖、星星、云朵、奶油黄和薄荷绿渐变装饰分布在边缘，可有粉色小猫或圆润糖果角色作陪伴。画面中心保持温暖开阔、低纹理、无框的糖果氛围，方便 HTML/CSS/JS 绘制任务板。不要生成奶油任务板框、按钮、标题、文字、字母、槽位、logo、水印或二维码。\n\n", "4. 按钮、字体与触控规范\n按钮使用圆润糖果按钮、果冻圆按钮或胶囊按钮，主流程按钮偏粉色或蜜桃色，发音偏柠檬黄，重来偏天空蓝。字母、数字、汉字和按钮文字要居中且大而清楚。\n本课件面向小学低中高年级儿童，所有核心文字和可点击区域必须适合课堂投屏、互动屏和平板触控。题干、核心选项、按钮文字和状态数字要使用明显偏大的字号，普通提示文字也要清楚可读；主按钮、选项卡、拖拽块和槽位要有足够大的触碰面积和间距，儿童手指点击不容易误触。按钮必须有清楚边界、高对比文字、按压反馈和禁用态；不要把关键文字做得过小、过细、过浅或压在复杂纹理上。\n\n", "5. 色彩、材质与装饰密度\n色彩以奶油白、奶油黄、蜜桃粉、樱花粉、柠檬黄、薄荷绿、天空蓝、浅橙、薰衣草紫和柔和红为主。\n色彩只作为视觉方向，不在图片中显示任何色号、色卡编号、代码、CSS 文本或设计参数。整体保持明亮、干净、护眼，避免大面积深色、强霓虹、复杂渐变和高压迫背景。装饰密度必须低于学习内容，角色、花草、糖果、气泡、电话线、科技光线或海图道具只放在边缘、角落或低层背景，不得穿过题目、选项、槽位、网格、按钮和反馈区域。\n\n", "6. UI层级与反馈\n底层是风格化背景，只提供氛围；中层是主主题板和内部功能卡片，盖在背景图上，由html/CSS/JS 绘制适合本风格的题板区域，是最高信息承载层；上层是可拖拽对象、选项、按钮、反馈条和当前选中态；弹窗层用于结果、时间到或完成反馈，必须有遮罩或清楚的独立卡片，不能遮挡关键学习内容。\n正确反馈使用清新绿描边、糖果星星、软糖吸附和轻微弹起；错误反馈使用浅粉红边框；选中态使用白描边和果冻上浮。\n所有反馈只强化原交互，不新增新玩法，不改变原题目判断逻辑。\n\n", "7. 音效反馈规范\n音效是 UI 反馈的一部分，必须优先匹配当前风格的专属音效；只用于强化点击、选中、拖拽、落位、提交、答对、答错、提示、完成和重置状态，不改变原课件玩法、题型、节奏和按钮功能。音效需短促、低音量、低干扰，不能循环播放，不能盖过教学语音；需遵守原课件已有静音和音量设置。若没有真实音频素材，可用平台素材库、安全音效或 WebAudio 近似实现，但仍要尽量贴近本风格音效意图。\n本风格音效：点击使用糖果按钮弹跳声，拖拽落位使用软糖吸附声，答对使用星星奖励和糖霜轻碰声，完成使用明亮短铃。\n\n", "8. 禁止项\n禁止生成无关实体、无关玩法、无关学科内容、伪文字、乱码、品牌名、公司名、水印、二维码、角标、设计参数、色值、代码、CSS 标注、软件界面说明、宣传语和不可编辑的题目内容。禁止遮挡、重绘、扭曲或弱化原题目、题板、格线、槽位、按钮和反馈状态。"], "section2": 3, "blocks": [{"kind": "equal", "old": "2. 封面图规范与生图提示词逻辑\n", "new": "2. 封面图规范与生图提示词逻辑\n"}, {"kind": "insert", "old": "", "new": "【本节适用范围】第2节是完整封面设计，第3节是进入后的主互动页背景，两者必须分别生成、分别使用。封面继续执行本节第3项的原有美术描述，包括艺术字、角色、场景、材质、副标题载体和按钮设计；不得把它改成“空背景＋普通HTML标题按钮”。第3节的无文字、无按钮、中央留白要求，以及第4—6节的题板、标准正文字体、学习区低干扰规则，只约束主互动页，不得用来删减封面。除用户在本次调整中明确要求不要封面外，仍按原版规范生成完整图片式首页。\n\n", "change": 0, "left": [], "right": [{"text": "【本节适用范围】第2节是完整封面设计，第3节是进入 function render(){let s=current(),texture=s.kind==='texture',m=meta();$('#title').textContent=s.displayName;$('#delta').textContent=`${s.caseId} · ${s.old.length} → ${s.new.length} 字符（+${s.delta}）`;renderNav();
$('#version-status').textContent=texture?'此前已实测的质感新版 · 本轮未改词':'基础风格 V2 · 待审阅，尚未生成';
$('#intro').textContent=texture?'左侧是之前确认的线上质感原词，右侧是网站现有结果实际使用的新版。按目标、保护、材质和回退四部分对齐展示，完整文字没有删减。':'左侧是你提供的线上原词，右侧是上轮已交付的 V2。新增、替换和未修改内容分别标出；本次展示不再改动提示词。';
$('#facts').innerHTML=texture?'<div><b>9</b><span>种质感</span></div><div><b>4</b><span>部分语义对齐</span></div><div><b>3 + 1</b><span>部分重写 + 新增回退</span></div><div><b>实测原文</b><span>与网站运行记录逐项核对</span></div>':'<div><b>19</b><span>种风格</span></div><div><b>5</b><span>处改动 / 每种</span></div><div><b>1 + 4</b><span>处替换 + 新增</span></div><div><b>仅第 2 节</b><span>其余 8 节不变</span></div>';
$('#notice').innerHTML=texture?'<strong>质感新版是此前实测版本，不是本轮新写的 V2。</strong>原来的短指令已扩展为保护规则、具体材质边界和自检。默认按语义对齐，切换“完整原文”可核对未经拆分的提示词；灰色说明为审阅备注，不属于提示词。':'<strong>先看第 02 处核心去重修复，再审其他新增约束。</strong>V2 不只是改了一句：还补充了默认生成封面、清理范围、点击事件和验收规则。下方已逐处注明目的与审阅重点，不把这些新增要求当成已获认可。';
$('#columnheads').innerHTML=`<div><b>线上原词</b><small>${texture?'此前确认的线上质感词 · 冻结实测输入':'你提供的最新版 CSV · 第 J 列 · 2026-10-22 存档'}</small></div><div><b>${texture?'质感实测新版':'V2 候选稿'}</b><small>${texture?'与测评网站9组新版产物的实际输入一致':'已交付版本的原文 · 待审阅，未实跑'}</small></div>`;
for(const b of document.querySelectorAll('[data-mode]')){b.classList.toggle('active',b.dataset.mode===mode);b.setAttribute('aria-pressed',String(b.dataset.mode===mode));b.hidden=texture&&b.dataset.mode==='context';b.textContent=b.dataset.mode==='changes'?(texture?'按 4 部分看改动':'只看 5 处改动'):b.dataset.mode==='context'?'第 2 节上下文':texture?'完整原文':'全文核对'}
$('#jump').hidden=texture&&mode==='full';$('#jump').innerHTML=m.map((x,i)=>`<button data-jump="${i}">${String(i+1).padStart(2,'0')} ${(texture?['目标强度','保护规则','具体材质','自检回退']:['适用范围','核心去重','接入清理','点击防穿透','验收要求'])[i]}</button>`).join('');let out='';
if(texture&&mode==='full'){out=`<section class="change"><div class="changehead"><strong>完整实际输入 · 原文保留全部换行</strong></div><div class="pair">${cell(s.old,'old')}${cell(s.new,'new')}</div></section>`}else{
if(mode==='full'){s.sectionsOld.slice(0,s.section2).forEach((t,i)=>{if(t)out+=equalBlock(t,s.sectionsNew[i],t.split('\n')[0]||'开头说明')})}
s.blocks.forEach(b=>{if(b.kind==='equal'){if(mode!=='changes'){let title=b.old.includes('3）本视觉风格封面的生图提示词')?'原第2项文案规则 + 第3项完整封面美术描述':'第2节标题 / 未改原文';out+=equalBlock(b.old,b.new,title)}return}let i=b.change,x=m[i],note=noteKey(i);out+=`<section class="change" id="change-${i}"><div class="changehead"><span class="num">${String(i+1).padStart(2,'0')}</span><strong>${esc(x.title)}</strong><span class="location">${esc(x.location)}</span></div><div class="pair">${cell(b.old?marks(b.left):'<em class="placeholder">原词无此段。<br>此处是新版追加的要求。</em>','old',true)}${cell(marks(b.right),'new',true)}</div><div class="explain"><p><b>修改目的：</b>${esc(x.purpose)}</p><p class="review"><span class="tag">${esc(x.level)}</span>${esc(x.review)}</p><div class="note"><label for="note-${i}">你的意见</label><textarea id="note-${i}" data-note="${esc(note)}" placeholder="记录保留、删掉，或具体怎么改（${texture?(i===2?'本质感专用':'9种质感共用'):'19种风格共用'}）">${esc(notes[note]||'')}</textarea></div></div></section>`});
if(mode==='full'){s.sectionsOld.slice(s.section2+1).forEach((t,i)=>{if(t)out+=equalBlock(t,s.sectionsNew[s.section2+1+i],t.split('\n')[0]||'未改原文')})}
if(!texture&&mode==='changes')out+=`<details class="unchanged"><summary>需要确认各风格的原有美术没被改？展开这一段</summary><div class="pair">${cell(art(s.old),'old')}${cell(art(s.new),'new')}</div></details>`;
}
$('#comparison').innerHTML=out;$('#source').innerHTML=`对照基准：${texture?'冻结实测记录中的完整 old/new.prompt；两个版本均逐项核对 SHA-256':'用户提供的线上最新版 CSV（未在本轮重新拉取线上配置）'}。<br>本页只展示原文及审阅说明；不修改历史课件 HTML，不提交意见，不触发生成。<br>原词 SHA-256：${esc(s.basePromptSHA256)}<br>新版 SHA-256：${esc(s.promptSHA256)}`;
}
function art(t){let from=t.indexOf('3）本视觉风格封面的生图提示词：');let end=t.indexOf('\n4）封面接入顺序',from);if(end<0)end=t.indexOf('\n3. 背景图规范',from);return t.slice(from,end).trim()}
function changeSelection(i){selected=i;if(current().kind==='texture'&&mode==='context')mode='changes';history.replaceState(null,'','#'+current().styleCode);render();window.scrollTo({top:0})}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.style!==undefined)changeSelection(+b.dataset.style);if(b.dataset.group){$('#search').value='';changeSelection(DATA.styles.findIndex(s=>s.kind===b.dataset.group))}if(b.dataset.mode){mode=b.dataset.mode;render()}if(b.dataset.jump!==undefined)$('#change-'+b.dataset.jump).scrollIntoView({behavior:'smooth',block:'start'})});
$('#search').addEventListener('input',renderNav);document.addEventListener('input',e=>{if(e.target.dataset.note!==undefined){notes[e.target.dataset.note]=e.target.value;try{localStorage.setItem(storageKey,JSON.stringify(notes));$('#save-state').textContent='意见已在此浏览器暂存；未提交，也未触发生成。'}catch(err){$('#save-state').textContent='浏览器不能暂存，请用“导出我的审阅意见”保存。'}}});
$('#export').addEventListener('click',()=>{let text='# 28条提示词：审阅意见\n\n意见不等于已修改提示词或批准生成。\n\n';DATA.meta.forEach((m,i)=>text+=`## 基础风格共用 ${i+1}. ${m.title}\n\n${notes[i]||'未填写意见'}\n\n`);let tm=DATA.styles.find(s=>s.kind==='texture').meta;[0,1,3].forEach(i=>text+=`## 质感共用 ${i+1}. ${tm[i].title}\n\n${notes['texture-common:'+i]||'未填写意见'}\n\n`);DATA.styles.filter(s=>s.kind==='texture').forEach(s=>text+=`## ${s.displayName}：材质边界\n\n${notes[s.styleCode+':material']||'未填写意见'}\n\n`);let url=URL.createObjectURL(new Blob([text],{type:'text/markdown;charset=utf-8'}));let a=document.createElement('a');a.href=url;a.download='28条提示词_我的审阅意见.md';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)});render();
</script></body></html>

<script id="payload" type="application/json">{"styles": [{"styleCode": "kidslogic", "displayName": "清晰逻辑风", "caseId": "S10", "promptText": "请严格使用下述画面风格、布局、UI规范来重新生成课件：\n\n0. 原课件保留规则\n本风格只用于 UI 视觉换肤，不得改变原课件的学科、题型、题目内容、答案、素材数量、槽位数量、组件数量、布局关系、按钮功能、计分逻辑和交互流程。原来是英语看图拼词、填空、拖拽、选择、分类、连线、数独、宫格推理或其他逻辑任务，换风格后仍保持原玩法和原题目结构。主互动题页中的题干、选项、答案、字母、汉字、数字、公式、倒计时、得分、按钮文案、反馈文案和关卡信息等可变教学内容，必须由 HTML/CSS/JS 渲染，不要烘焙进背景图或题板底图。\n\n1. 整体视觉与布局\n风格识别锚点：第一眼应像儿童逻辑训练营，而不是商务网格或抽象设计稿。使用清爽青蓝渐变背景、淡米白棋盘或宫格底纹、中央清晰逻辑题互动区、白色圆角卡片、浅灰分隔线、暖黄色圆角外框、亮蓝主按钮、暖橙答案高亮和绿色正确反馈；适合数独、迷宫、行列推理和逻辑挑战，整体干净、专注、儿童友好。\n本风格不是冷淡办公逻辑风，也不是抽象设计展板；它是面向小学儿童的“逻辑训练营”课堂 UI。整体以明亮蓝天渐变背景、奶油白大题板、黄橙色厚边框、天空蓝状态胶囊和圆润卡片组成，氛围清爽、积极、有训练营感，适合数独、宫格推理、找规律、分类、排序、选择和解题任务。\n使用横版课件画布。最底层是蓝天到浅青蓝的渐变背景，可有淡淡云朵、树叶、纸飞机、小圆点和角落植物，但背景只提供轻松氛围，不承担学习信息。主学习区放在中央大型奶油白题板内，题板四周是柔和黄橙厚边框，整体像儿童训练营任务板。顶部可有返回按钮、课程标题、关卡胶囊、星星数量、计时器等状态区；中间是核心题目与操作区；左右可放规则、角色提示、工具按钮和反馈卡。所有正式文字和状态数据由页面渲染。\n\n2. 封面图规范与生图提示词逻辑\n【本节适用范围】第2节是完整封面设计，第3节是进入后的主互动页背景，两者必须分别生成、分别使用。封面继续执行本节第3项的原有美术描述，包括艺术字、角色、场景、材质、副标题载体和按钮设计；不得把它改成“空背景＋普通HTML标题按钮”。第3节的无文字、无按钮、中央留白要求，以及第4—6节的题板、标准正文字体、学习区低干扰规则，只约束主互动页，不得用来删减封面。除用户在本次调整中明确要求不要封面外，仍按原版规范生成完整图片式首页。\n\n1）封面图用于儿童互动课件首页。封面图本身必须生成主标题、副标题和进入按钮；副标题不得超过15个字，图上不生成任何额外文字、包括风格名、品牌名、logo、水印、二维码、角标、色值、尺寸标记、伪文字或无关宣传语都不允许生成。封面图中的主标题、副标题、按钮造型和按钮文字是最终可见内容，必须保留。HTML 不得在这张封面图上再次叠加可见标题、副标题、按钮、按钮文字或底座；只配置覆盖封面的透明点击层，点击封面任意位置进入原课件。这里禁止的是 HTML 重复叠加，不是禁止图片生成标题或按钮。\n2）主标题、副标题和按钮文案都是可变元素，必须根据当前课件真实内容替换；若为英语课件则尽量用英文，若非英语课件则一律用中文。标题、短副标题和进入按钮需要沿同一视觉主轴组织，层级清楚、可读性强，适合课堂投屏。\n3）本视觉风格封面的生图提示词：\n儿童卡通风格，2.5D粘土质感，阳光明媚的户外草地小径背景。左侧有一个穿着警帽、背着书包、胸前戴星星徽章的蓝色小猫学习伙伴，微笑点赞，动作积极。右侧根据当前课件主题生成对应学习装饰，例如逻辑题可放木质框架的 Sudoku 数字填空小板，英语课件可放单词卡或字母卡，数学课件可放数字卡或几何卡。顶部有蓝色和黄色星星装饰，背景有纸飞机、云朵、花草和飘落星星。画面中心上方生成大的蓝黄相间立体泡泡标题“{标题内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，标题带白色描边、气泡轮廓和小星星。标题下方生成蓝色丝带副标题“{副标题内容根据课件真实内容填充，副标题不超过15个字，若为英语课件则尽量用英文，若非英文课件则一律用中文}”。画面中下方生成黄色立体胶囊按钮，按钮上写“{进入游戏，按钮内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，按钮右侧带白色箭头和小星星。\n\n4）封面接入顺序：先根据真实课件确认主标题、短副标题和进入文案，再依照上面的原版美术描述生成一张完整封面图；将它完整适配课件舞台，不裁掉文字、角色或按钮，也不把整张封面当作中间的小插图套进另一张封面。仅在封面容器内移除或隐藏源 HTML 的标题、副标题、示例插画和可见开始按钮，清理伪元素及 CSS 背景中重复的文字/按钮；主互动页的题干、选项、答案、控件和逻辑全部保留。不要因源课件原来使用 HTML 标题而继续保留第二套可见封面。\n5）透明点击层只承接进入事件，不绘制文字、图标、背景、边框、阴影或底座；可保留不可见的无障碍名称和键盘进入能力，不能将整张封面图设成透明。一次完整点击/触控只进入一次，不在 pointerdown 时提前撤掉封面；隔离本次手势，禁止继续触发下一页答案、拖拽或提交。进入第一题时仍为未作答状态。\n6）交付前同时核对封面原图与浏览器实际首屏：图中艺术标题、短副标题和设计按钮齐全且各一套，浏览器没有额外的可见 DOM/CSS 文字或按钮，点击任意位置可进入第一题。若有重复，修正 HTML 接入层；若图中文字错误，单独修正封面素材。不得用删掉艺术字、角色、按钮设计，换成空场景，或直接跳过封面的办法通过去重检查。\n\n3. 背景图规范与生图提示词逻辑\n1）背景图只用于提供风格氛围，不强行生成题目承载区域。题目白板、任务板、卡片、槽位、按钮和状态栏应由 HTML/CSS/JS 根据当前课件内容绘制，并覆盖在背景图上。背景图中不要生成框、白板、题板、任务板、玻璃板、卡片、按钮、标题、题目文字、选项文字、数字、字母、汉字、格线、槽位、logo、水印或二维码。\n2）背景图可以参考该风格 bg 图和 cover 图的视觉感觉自由延展，但只保留场景、色彩、材质、角色气质和边缘装饰；画面中心应保持开阔、低干扰，方便前端绘制适配当前题型的题板。\n3）本视觉风格背景图的生图提示词：\n儿童卡通风格，2.5D粘土质感，阳光明媚的户外草地小径背景，蓝天、白云、纸飞机、飘落星星、花草和浅青蓝渐变氛围，边缘可有小花、小树叶和轻量几何点缀。画面中心保持开阔、干净、低干扰，方便 HTML/CSS/JS 后续绘制逻辑训练题板。不要生成任何白板、题板框、卡片框、按钮、标题、文字、数字、格线、logo、水印或二维码。\n\n4. 核心题板、按钮、字体与触控规范\n核心题板要像儿童逻辑训练工具，而不是纯背景插画。宫格、数独格、推理表、坐标格、分类框、线索区边界必须直、清楚、规整；粗分隔线和细分隔线层级明确；当前选中格可使用浅蓝底和亮蓝描边。数字、字母、图形或选项要居中、足够大、对比强，适合投屏。\n按钮使用厚实圆润胶囊、大圆角矩形或方形数字卡。数字选项按钮使用白底、轻阴影、亮蓝数字；提交按钮使用亮蓝大胶囊，带白色对勾图标和清楚文字；撤销按钮使用亮蓝或浅蓝；清除按钮可置灰并保持轮廓；提示卡使用浅绿色或浅奶油底。返回、星星、计时、关卡胶囊使用圆润图标按钮和状态胶囊。所有按钮都要有足够触碰面积、间距、按压反馈和禁用态，儿童点击不容易误触。\n字体整体圆润、粗清晰、低龄友好。标题和关卡文字可更活泼；题干、规则、数字、按钮、反馈必须标准易读。不要使用过细字体、强描边、复杂阴影或装饰字。不要把文字压在蓝天背景、植物、角色或强光效上。\n\n5. 色彩、材质与装饰密度\n主色方向为明亮天空蓝、浅青蓝、奶油白、温暖黄橙、亮蓝和清新绿；辅助可用少量浅橙、浅黄、浅绿和柔和红。色彩只作为视觉方向，不在图片中显示任何色号、色卡编号、代码、CSS 文本或设计参数。整体明亮、干净、护眼，避免大面积深色、冷灰、办公蓝、强霓虹和复杂渐变。\n装饰密度必须低于学习内容。纸飞机、云朵、树叶、植物、小圆点、星星和陪伴角色只放在边缘、角落或左侧辅助区，不能穿过题目、选项、槽位、宫格、按钮和反馈区域。蓝色小猫或类似陪伴角色可以作为学习助手，建议放在左侧规则区下方或题板边缘，只承担鼓励和提示氛围，不进入核心题目区。\n\n6. UI层级与反馈\n底层是蓝天渐变背景；中层是大型奶油白训练营题板和内部功能卡片盖在背景图上，由html/CSS/js  绘制适合本风格的题板区域；上层是可拖拽对象、数字按钮、选项、工具按钮、提交按钮、状态胶囊和反馈卡；弹窗层用于完成、结果或时间到，必须用清楚的独立卡片承载。\n正确反馈使用清新绿反馈卡、笑脸图标、星星、彩纸和“继续加油”类温和鼓励；错误反馈使用柔和红橙边框、轻微摇动和温和提示；选中态使用浅蓝填充、亮蓝描边和轻微上浮；提交成功可让星星或进度轻微点亮。所有反馈只强化原交互，不新增新玩法，不改变原题目判断逻辑。\n\n7. 音效反馈规范\n音效是 UI 反馈的一部分，必须优先匹配当前风格的专属音效；只用于强化点击、选中、拖拽、落位、提交、答对、答错、提示、完成和重置状态，不改变原课件玩法、题型、节奏和按钮功能。音效需短促、低音量、低干扰，不能循环播放，不能盖过教学语音；需遵守原课件已有静音和音量设置。若没有真实音频素材，可用平台素材库、安全音效或 WebAudio 近似实现，但仍要尽量贴近本风格音效意图。\n本风格音效：点击使用清脆软按钮音，选中格子使用轻点亮声，放入或选择数字使用短促卡片落位声，提交使用明亮确认音，答对使用星星奖励铃和轻快完成音，答错使用低音量柔和提示音，不使用刺耳警报或办公系统提示音。\n\n8. 禁止项\n禁止生成真人照片、办公场景、抽象设计展板、软件界面截图、APP 字样、设计稿标题、样式说明、伪中文、伪英文、乱码、品牌名、公司名、水印、二维码、角标、色值、尺寸标记、代码或 CSS 标注。禁止把清晰逻辑风做成冷淡商务工具、纯网格背景、霓虹科技、深色竞技或复杂海报。禁止遮挡、重绘、扭曲或弱化原题目、题板、格线、槽位、按钮和反馈状态。", "basePromptSHA256": "a43d80cf679915d6eee000c6acc4b9b6180e2f8e4b0a82319204055cd5d197d1", "promptSHA256": "13988eeecf93fb9a9b277bdc25b565d9d74eaad00c9f5bf9a7cf5cab1722782f", "status": "候选待生成验证", "changeScope": "仅第2节：图片封面与HTML职责分离；原有封面美术描述逐字保留", "kind": "base", "old": "请严格使用下述画面风格、布局、UI规范来重新生成课件：\n\n0. 原课件保留规则\n本风格只用于 UI 视觉换肤，不得改变原课件的学科、题型、题目内容、答案、素材数量、槽位数量、组件数量、布局关系、按钮功能、计分逻辑和交互流程。原来是英语看图拼词、填空、拖拽、选择、分类、连线、数独、宫格推理或其他逻辑任务，换风格后仍保持原玩法和原题目结构。主互动题页中的题干、选项、答案、字母、汉字、数字、公式、倒计时、得分、按钮文案、反馈文案和关卡信息等可变教学内容，必须由 HTML/CSS/JS 渲染，不要烘焙进背景图或题板底图。\n\n1. 整体视觉与布局\n风格识别锚点：第一眼应像儿童逻辑训练营，而不是商务网格或抽象设计稿。使用清爽青蓝渐变背景、淡米白棋盘或宫格底纹、中央清晰逻辑题互动区、白色圆角卡片、浅灰分隔线、暖黄色圆角外框、亮蓝主按钮、暖橙答案高亮和绿色正确反馈；适合数独、迷宫、行列推理和逻辑挑战，整体干净、专注、儿童友好。\n本风格不是冷淡办公逻辑风，也不是抽象设计展板；它是面向小学儿童的“逻辑训练营”课堂 UI。整体以明亮蓝天渐变背景、奶油白大题板、黄橙色厚边框、天空蓝状态胶囊和圆润卡片组成，氛围清爽、积极、有训练营感，适合数独、宫格推理、找规律、分类、排序、选择和解题任务。\n使用横版课件画布。最底层是蓝天到浅青蓝的渐变背景，可有淡淡云朵、树叶、纸飞机、小圆点和角落植物，但背景只提供轻松氛围，不承担学习信息。主学习区放在中央大型奶油白题板内，题板四周是柔和黄橙厚边框，整体像儿童训练营任务板。顶部可有返回按钮、课程标题、关卡胶囊、星星数量、计时器等状态区；中间是核心题目与操作区；左右可放规则、角色提示、工具按钮和反馈卡。所有正式文字和状态数据由页面渲染。\n\n2. 封面图规范与生图提示词逻辑\n1）封面图用于儿童互动课件首页。封面图本身必须生成主标题、副标题和进入按钮；副标题不得超过15个字，图上不生成任何额外文字、包括风格名、品牌名、logo、水印、二维码、角标、色值、尺寸标记、伪文字或无关宣传语都不允许生成。逻辑上，从封面图任意位置点击即可进入，禁止在封面图上再生成任何文字/按钮，只需要配置点击事件。\n2）主标题、副标题和按钮文案都是可变元素，必须根据当前课件真实内容替换；若为英语课件则尽量用英文，若非英语课件则一律用中文。标题、短副标题和进入按钮需要沿同一视觉主轴组织，层级清楚、可读性强，适合课堂投屏。\n3）本视觉风格封面的生图提示词：\n儿童卡通风格，2.5D粘土质感，阳光明媚的户外草地小径背景。左侧有一个穿着警帽、背着书包、胸前戴星星徽章的蓝色小猫学习伙伴，微笑点赞，动作积极。右侧根据当前课件主题生成对应学习装饰，例如逻辑题可放木质框架的 Sudoku 数字填空小板，英语课件可放单词卡或字母卡，数学课件可放数字卡或几何卡。顶部有蓝色和黄色星星装饰，背景有纸飞机、云朵、花草和飘落星星。画面中心上方生成大的蓝黄相间立体泡泡标题“{标题内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，标题带白色描边、气泡轮廓和小星星。标题下方生成蓝色丝带副标题“{副标题内容根据课件真实内容填充，副标题不超过15个字，若为英语课件则尽量用英文，若非英文课件则一律用中文}”。画面中下方生成黄色立体胶囊按钮，按钮上写“{进入游戏，按钮内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，按钮右侧带白色箭头和小星星。\n\n3. 背景图规范与生图提示词逻辑\n1）背景图只用于提供风格氛围，不强行生成题目承载区域。题目白板、任务板、卡片、槽位、按钮和状态栏应由 HTML/CSS/JS 根据当前课件内容绘制，并覆盖在背景图上。背景图中不要生成框、白板、题板、任务板、玻璃板、卡片、按钮、标题、题目文字、选项文字、数字、字母、汉字、格线、槽位、logo、水印或二维码。\n2）背景图可以参考该风格 bg 图和 cover 图的视觉感觉自由延展，但只保留场景、色彩、材质、角色气质和边缘装饰；画面中心应保持开阔、低干扰，方便前端绘制适配当前题型的题板。\n3）本视觉风格背景图的生图提示词：\n儿童卡通风格，2.5D粘土质感，阳光明媚的户外草地小径背景，蓝天、白云、纸飞机、飘落星星、花草和浅青蓝渐变氛围，边缘可有小花、小树叶和轻量几何点缀。画面中心保持开阔、干净、低干扰，方便 HTML/CSS/JS 后续绘制逻辑训练题板。不要生成任何白板、题板框、卡片框、按钮、标题、文字、数字、格线、logo、水印或二维码。\n\n4. 核心题板、按钮、字体与触控规范\n核心题板要像儿童逻辑训练工具，而不是纯背景插画。宫格、数独格、推理表、坐标格、分类框、线索区边界必须直、清楚、规整；粗分隔线和细分隔线层级明确；当前选中格可使用浅蓝底和亮蓝描边。数字、字母、图形或选项要居中、足够大、对比强，适合投屏。\n按钮使用厚实圆润胶囊、大圆角矩形或方形数字卡。数字选项按钮使用白底、轻阴影、亮蓝数字；提交按钮使用亮蓝大胶囊，带白色对勾图标和清楚文字；撤销按钮使用亮蓝或浅蓝；清除按钮可置灰并保持轮廓；提示卡使用浅绿色或浅奶油底。返回、星星、计时、关卡胶囊使用圆润图标按钮和状态胶囊。所有按钮都要有足够触碰面积、间距、按压反馈和禁用态，儿童点击不容易误触。\n字体整体圆润、粗清晰、低龄友好。标题和关卡文字可更活泼；题干、规则、数字、按钮、反馈必须标准易读。不要使用过细字体、强描边、复杂阴影或装饰字。不要把文字压在蓝天背景、植物、角色或强光效上。\n\n5. 色彩、材质与装饰密度\n主色方向为明亮天空蓝、浅青蓝、奶油白、温暖黄橙、亮蓝和清新绿；辅助可用少量浅橙、浅黄、浅绿和柔和红。色彩只作为视觉方向，不在图片中显示任何色号、色卡编号、代码、CSS 文本或设计参数。整体明亮、干净、护眼，避免大面积深色、冷灰、办公蓝、强霓虹和复杂渐变。\n装饰密度必须低于学习内容。纸飞机、云朵、树叶、植物、小圆点、星星和陪伴角色只放在边缘、角落或左侧辅助区，不能穿过题目、选项、槽位、宫格、按钮和反馈区域。蓝色小猫或类似陪伴角色可以作为学习助手，建议放在左侧规则区下方或题板边缘，只承担鼓励和提示氛围，不进入核心题目区。\n\n6. UI层级与反馈\n底层是蓝天渐变背景；中层是大型奶油白训练营题板和内部功能卡片盖在背景图上，由html/CSS/js  绘制适合本风格的题板区域；上层是可拖拽对象、数字按钮、选项、工具按钮、提交按钮、状态胶囊和反馈卡；弹窗层用于完成、结果或时间到，必须用清楚的独立卡片承载。\n正确反馈使用清新绿反馈卡、笑脸图标、星星、彩纸和“继续加油”类温和鼓励；错误反馈使用柔和红橙边框、轻微摇动和温和提示；选中态使用浅蓝填充、亮蓝描边和轻微上浮；提交成功可让星星或进度轻微点亮。所有反馈只强化原交互，不新增新玩法，不改变原题目判断逻辑。\n\n7. 音效反馈规范\n音效是 UI 反馈的一部分，必须优先匹配当前风格的专属音效；只用于强化点击、选中、拖拽、落位、提交、答对、答错、提示、完成和重置状态，不改变原课件玩法、题型、节奏和按钮功能。音效需短促、低音量、低干扰，不能循环播放，不能盖过教学语音；需遵守原课件已有静音和音量设置。若没有真实音频素材，可用平台素材库、安全音效或 WebAudio 近似实现，但仍要尽量贴近本风格音效意图。\n本风格音效：点击使用清脆软按钮音，选中格子使用轻点亮声，放入或选择数字使用短促卡片落位声，提交使用明亮确认音，答对使用星星奖励铃和轻快完成音，答错使用低音量柔和提示音，不使用刺耳警报或办公系统提示音。\n\n8. 禁止项\n禁止生成真人照片、办公场景、抽象设计展板、软件界面截图、APP 字样、设计稿标题、样式说明、伪中文、伪英文、乱码、品牌名、公司名、水印、二维码、角标、色值、尺寸标记、代码或 CSS 标注。禁止把清晰逻辑风做成冷淡商务工具、纯网格背景、霓虹科技、深色竞技或复杂海报。禁止遮挡、重绘、扭曲或弱化原题目、题板、格线、槽位、按钮和反馈状态。", "new": "请严格使用下述画面风格、布局、UI规范来重新生成课件：\n\n0. 原课件保留规则\n本风格只用于 UI 视觉换肤，不得改变原课件的学科、题型、题目内容、答案、素材数量、槽位数量、组件数量、布局关系、按钮功能、计分逻辑和交互流程。原来是英语看图拼词、填空、拖拽、选择、分类、连线、数独、宫格推理或其他逻辑任务，换风格后仍保持原玩法和原题目结构。主互动题页中的题干、选项、答案、字母、汉字、数字、公式、倒计时、得分、按钮文案、反馈文案和关卡信息等可变教学内容，必须由 HTML/CSS/JS 渲染，不要烘焙进背景图或题板底图。\n\n1. 整体视觉与布局\n风格识别锚点：第一眼应像儿童逻辑训练营，而不是商务网格或抽象设计稿。使用清爽青蓝渐变背景、淡米白棋盘或宫格底纹、中央清晰逻辑题互动区、白色圆角卡片、浅灰分隔线、暖黄色圆角外框、亮蓝主按钮、暖橙答案高亮和绿色正确反馈；适合数独、迷宫、行列推理和逻辑挑战，整体干净、专注、儿童友好。\n本风格不是冷淡办公逻辑风，也不是抽象设计展板；它是面向小学儿童的“逻辑训练营”课堂 UI。整体以明亮蓝天渐变背景、奶油白大题板、黄橙色厚边框、天空蓝状态胶囊和圆润卡片组成，氛围清爽、积极、有训练营感，适合数独、宫格推理、找规律、分类、排序、选择和解题任务。\n使用横版课件画布。最底层是蓝天到浅青蓝的渐变背景，可有淡淡云朵、树叶、纸飞机、小圆点和角落植物，但背景只提供轻松氛围，不承担学习信息。主学习区放在中央大型奶油白题板内，题板四周是柔和黄橙厚边框，整体像儿童训练营任务板。顶部可有返回按钮、课程标题、关卡胶囊、星星数量、计时器等状态区；中间是核心题目与操作区；左右可放规则、角色提示、工具按钮和反馈卡。所有正式文字和状态数据由页面渲染。\n\n2. 封面图规范与生图提示词逻辑\n【本节适用范围】第2节是完整封面设计，第3节是进入后的主互动页背景，两者必须分别生成、分别使用。封面继续执行本节第3项的原有美术描述，包括艺术字、角色、场景、材质、副标题载体和按钮设计；不得把它改成“空背景＋普通HTML标题按钮”。第3节的无文字、无按钮、中央留白要求，以及第4—6节的题板、标准正文字体、学习区低干扰规则，只约束主互动页，不得用来删减封面。除用户在本次调整中明确要求不要封面外，仍按原版规范生成完整图片式首页。\n\n1）封面图用于儿童互动课件首页。封面图本身必须生成主标题、副标题和进入按钮；副标题不得超过15个字，图上不生成任何额外文字、包括风格名、品牌名、logo、水印、二维码、角标、色值、尺寸标记、伪文字或无关宣传语都不允许生成。封面图中的主标题、副标题、按钮造型和按钮文字是最终可见内容，必须保留。HTML 不得在这张封面图上再次叠加可见标题、副标题、按钮、按钮文字或底座；只配置覆盖封面的透明点击层，点击封面任意位置进入原课件。这里禁止的是 HTML 重复叠加，不是禁止图片生成标题或按钮。\n2）主标题、副标题和按钮文案都是可变元素，必须根据当前课件真实内容替换；若为英语课件则尽量用英文，若非英语课件则一律用中文。标题、短副标题和进入按钮需要沿同一视觉主轴组织，层级清楚、可读性强，适合课堂投屏。\n3）本视觉风格封面的生图提示词：\n儿童卡通风格，2.5D粘土质感，阳光明媚的户外草地小径背景。左侧有一个穿着警帽、背着书包、胸前戴星星徽章的蓝色小猫学习伙伴，微笑点赞，动作积极。右侧根据当前课件主题生成对应学习装饰，例如逻辑题可放木质框架的 Sudoku 数字填空小板，英语课件可放单词卡或字母卡，数学课件可放数字卡或几何卡。顶部有蓝色和黄色星星装饰，背景有纸飞机、云朵、花草和飘落星星。画面中心上方生成大的蓝黄相间立体泡泡标题“{标题内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，标题带白色描边、气泡轮廓和小星星。标题下方生成蓝色丝带副标题“{副标题内容根据课件真实内容填充，副标题不超过15个字，若为英语课件则尽量用英文，若非英文课件则一律用中文}”。画面中下方生成黄色立体胶囊按钮，按钮上写“{进入游戏，按钮内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，按钮右侧带白色箭头和小星星。\n\n4）封面接入顺序：先根据真实课件确认主标题、短副标题和进入文案，再依照上面的原版美术描述生成一张完整封面图；将它完整适配课件舞台，不裁掉文字、角色或按钮，也不把整张封面当作中间的小插图套进另一张封面。仅在封面容器内移除或隐藏源 HTML 的标题、副标题、示例插画和可见开始按钮，清理伪元素及 CSS 背景中重复的文字/按钮；主互动页的题干、选项、答案、控件和逻辑全部保留。不要因源课件原来使用 HTML 标题而继续保留第二套可见封面。\n5）透明点击层只承接进入事件，不绘制文字、图标、背景、边框、阴影或底座；可保留不可见的无障碍名称和键盘进入能力，不能将整张封面图设成透明。一次完整点击/触控只进入一次，不在 pointerdown 时提前撤掉封面；隔离本次手势，禁止继续触发下一页答案、拖拽或提交。进入第一题时仍为未作答状态。\n6）交付前同时核对封面原图与浏览器实际首屏：图中艺术标题、短副标题和设计按钮齐全且各一套，浏览器没有额外的可见 DOM/CSS 文字或按钮，点击任意位置可进入第一题。若有重复，修正 HTML 接入层；若图中文字错误，单独修正封面素材。不得用删掉艺术字、角色、按钮设计，换成空场景，或直接跳过封面的办法通过去重检查。\n\n3. 背景图规范与生图提示词逻辑\n1）背景图只用于提供风格氛围，不强行生成题目承载区域。题目白板、任务板、卡片、槽位、按钮和状态栏应由 HTML/CSS/JS 根据当前课件内容绘制，并覆盖在背景图上。背景图中不要生成框、白板、题板、任务板、玻璃板、卡片、按钮、标题、题目文字、选项文字、数字、字母、汉字、格线、槽位、logo、水印或二维码。\n2）背景图可以参考该风格 bg 图和 cover 图的视觉感觉自由延展，但只保留场景、色彩、材质、角色气质和边缘装饰；画面中心应保持开阔、低干扰，方便前端绘制适配当前题型的题板。\n3）本视觉风格背景图的生图提示词：\n儿童卡通风格，2.5D粘土质感，阳光明媚的户外草地小径背景，蓝天、白云、纸飞机、飘落星星、花草和浅青蓝渐变氛围，边缘可有小花、小树叶和轻量几何点缀。画面中心保持开阔、干净、低干扰，方便 HTML/CSS/JS 后续绘制逻辑训练题板。不要生成任何白板、题板框、卡片框、按钮、标题、文字、数字、格线、logo、水印或二维码。\n\n4. 核心题板、按钮、字体与触控规范\n核心题板要像儿童逻辑训练工具，而不是纯背景插画。宫格、数独格、推理表、坐标格、分类框、线索区边界必须直、清楚、规整；粗分隔线和细分隔线层级明确；当前选中格可使用浅蓝底和亮蓝描边。数字、字母、图形或选项要居中、足够大、对比强，适合投屏。\n按钮使用厚实圆润胶囊、大圆角矩形或方形数字卡。数字选项按钮使用白底、轻阴影、亮蓝数字；提交按钮使用亮蓝大胶囊，带白色对勾图标和清楚文字；撤销按钮使用亮蓝或浅蓝；清除按钮可置灰并保持轮廓；提示卡使用浅绿色或浅奶油底。返回、星星、计时、关卡胶囊使用圆润图标按钮和状态胶囊。所有按钮都要有足够触碰面积、间距、按压反馈和禁用态，儿童点击不容易误触。\n字体整体圆润、粗清晰、低龄友好。标题和关卡文字可更活泼；题干、规则、数字、按钮、反馈必须标准易读。不要使用过细字体、强描边、复杂阴影或装饰字。不要把文字压在蓝天背景、植物、角色或强光效上。\n\n5. 色彩、材质与装饰密度\n主色方向为明亮天空蓝、浅青蓝、奶油白、温暖黄橙、亮蓝和清新绿；辅助可用少量浅橙、浅黄、浅绿和柔和红。色彩只作为视觉方向，不在图片中显示任何色号、色卡编号、代码、CSS 文本或设计参数。整体明亮、干净、护眼，避免大面积深色、冷灰、办公蓝、强霓虹和复杂渐变。\n装饰密度必须低于学习内容。纸飞机、云朵、树叶、植物、小圆点、星星和陪伴角色只放在边缘、角落或左侧辅助区，不能穿过题目、选项、槽位、宫格、按钮和反馈区域。蓝色小猫或类似陪伴角色可以作为学习助手，建议放在左侧规则区下方或题板边缘，只承担鼓励和提示氛围，不进入核心题目区。\n\n6. UI层级与反馈\n底层是蓝天渐变背景；中层是大型奶油白训练营题板和内部功能卡片盖在背景图上，由html/CSS/js  绘制适合本风格的题板区域；上层是可拖拽对象、数字按钮、选项、工具按钮、提交按钮、状态胶囊和反馈卡；弹窗层用于完成、结果或时间到，必须用清楚的独立卡片承载。\n正确反馈使用清新绿反馈卡、笑脸图标、星星、彩纸和“继续加油”类温和鼓励；错误反馈使用柔和红橙边框、轻微摇动和温和提示；选中态使用浅蓝填充、亮蓝描边和轻微上浮；提交成功可让星星或进度轻微点亮。所有反馈只强化原交互，不新增新玩法，不改变原题目判断逻辑。\n\n7. 音效反馈规范\n音效是 UI 反馈的一部分，必须优先匹配当前风格的专属音效；只用于强化点击、选中、拖拽、落位、提交、答对、答错、提示、完成和重置状态，不改变原课件玩法、题型、节奏和按钮功能。音效需短促、低音量、低干扰，不能循环播放，不能盖过教学语音；需遵守原课件已有静音和音量设置。若没有真实音频素材，可用平台素材库、安全音效或 WebAudio 近似实现，但仍要尽量贴近本风格音效意图。\n本风格音效：点击使用清脆软按钮音，选中格子使用轻点亮声，放入或选择数字使用短促卡片落位声，提交使用明亮确认音，答对使用星星奖励铃和轻快完成音，答错使用低音量柔和提示音，不使用刺耳警报或办公系统提示音。\n\n8. 禁止项\n禁止生成真人照片、办公场景、抽象设计展板、软件界面截图、APP 字样、设计稿标题、样式说明、伪中文、伪英文、乱码、品牌名、公司名、水印、二维码、角标、色值、尺寸标记、代码或 CSS 标注。禁止把清晰逻辑风做成冷淡商务工具、纯网格背景、霓虹科技、深色竞技或复杂海报。禁止遮挡、重绘、扭曲或弱化原题目、题板、格线、槽位、按钮和反馈状态。", "sectionsOld": ["请严格使用下述画面风格、布局、UI规范来重新生成课件：\n\n", "0. 原课件保留规则\n本风格只用于 UI 视觉换肤，不得改变原课件的学科、题型、题目内容、答案、素材数量、槽位数量、组件数量、布局关系、按钮功能、计分逻辑和交互流程。原来是英语看图拼词、填空、拖拽、选择、分类、连线、数独、宫格推理或其他逻辑任务，换风格后仍保持原玩法和原题目结构。主互动题页中的题干、选项、答案、字母、汉字、数字、公式、倒计时、得分、按钮文案、反馈文案和关卡信息等可变教学内容，必须由 HTML/CSS/JS 渲染，不要烘焙进背景图或题板底图。\n\n", "1. 整体视觉与布局\n风格识别锚点：第一眼应像儿童逻辑训练营，而不是商务网格或抽象设计稿。使用清爽青蓝渐变背景、淡米白棋盘或宫格底纹、中央清晰逻辑题互动区、白色圆角卡片、浅灰分隔线、暖黄色圆角外框、亮蓝主按钮、暖橙答案高亮和绿色正确反馈；适合数独、迷宫、行列推理和逻辑挑战，整体干净、专注、儿童友好。\n本风格不是冷淡办公逻辑风，也不是抽象设计展板；它是面向小学儿童的“逻辑训练营”课堂 UI。整体以明亮蓝天渐变背景、奶油白大题板、黄橙色厚边框、天空蓝状态胶囊和圆润卡片组成，氛围清爽、积极、有训练营感，适合数独、宫格推理、找规律、分类、排序、选择和解题任务。\n使用横版课件画布。最底层是蓝天到浅青蓝的渐变背景，可有淡淡云朵、树叶、纸飞机、小圆点和角落植物，但背景只提供轻松氛围，不承担学习信息。主学习区放在中央大型奶油白题板内，题板四周是柔和黄橙厚边框，整体像儿童训练营任务板。顶部可有返回按钮、课程标题、关卡胶囊、星星数量、计时器等状态区；中间是核心题目与操作区；左右可放规则、角色提示、工具按钮和反馈卡。所有正式文字和状态数据由页面渲染。\n\n", "2. 封面图规范与生图提示词逻辑\n1）封面图用于儿童互动课件首页。封面图本身必须生成主标题、副标题和进入按钮；副标题不得超过15个字，图上不生成任何额外文字、包括风格名、品牌名、logo、水印、二维码、角标、色值、尺寸标记、伪文字或无关宣传语都不允许生成。逻辑上，从封面图任意位置点击即可进入，禁止在封面图上再生成任何文字/按钮，只需要配置点击事件。\n2）主标题、副标题和按钮文案都是可变元素，必须根据当前课件真实内容替换；若为英语课件则尽量用英文，若非英语课件则一律用中文。标题、短副标题和进入按钮需要沿同一视觉主轴组织，层级清楚、可读性强，适合课堂投屏。\n3）本视觉风格封面的生图提示词：\n儿童卡通风格，2.5D粘土质感，阳光明媚的户外草地小径背景。左侧有一个穿着警帽、背着书包、胸前戴星星徽章的蓝色小猫学习伙伴，微笑点赞，动作积极。右侧根据当前课件主题生成对应学习装饰，例如逻辑题可放木质框架的 Sudoku 数字填空小板，英语课件可放单词卡或字母卡，数学课件可放数字卡或几何卡。顶部有蓝色和黄色星星装饰，背景有纸飞机、云朵、花草和飘落星星。画面中心上方生成大的蓝黄相间立体泡泡标题“{标题内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，标题带白色描边、气泡轮廓和小星星。标题下方生成蓝色丝带副标题“{副标题内容根据课件真实内容填充，副标题不超过15个字，若为英语课件则尽量用英文，若非英文课件则一律用中文}”。画面中下方生成黄色立体胶囊按钮，按钮上写“{进入游戏，按钮内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，按钮右侧带白色箭头和小星星。\n\n", "3. 背景图规范与生图提示词逻辑\n1）背景图只用于提供风格氛围，不强行生成题目承载区域。题目白板、任务板、卡片、槽位、按钮和状态栏应由 HTML/CSS/JS 根据当前课件内容绘制，并覆盖在背景图上。背景图中不要生成框、白板、题板、任务板、玻璃板、卡片、按钮、标题、题目文字、选项文字、数字、字母、汉字、格线、槽位、logo、水印或二维码。\n2）背景图可以参考该风格 bg 图和 cover 图的视觉感觉自由延展，但只保留场景、色彩、材质、角色气质和边缘装饰；画面中心应保持开阔、低干扰，方便前端绘制适配当前题型的题板。\n3）本视觉风格背景图的生图提示词：\n儿童卡通风格，2.5D粘土质感，阳光明媚的户外草地小径背景，蓝天、白云、纸飞机、飘落星星、花草和浅青蓝渐变氛围，边缘可有小花、小树叶和轻量几何点缀。画面中心保持开阔、干净、低干扰，方便 HTML/CSS/JS 后续绘制逻辑训练题板。不要生成任何白板、题板框、卡片框、按钮、标题、文字、数字、格线、logo、水印或二维码。\n\n", "4. 核心题板、按钮、字体与触控规范\n核心题板要像儿童逻辑训练工具，而不是纯背景插画。宫格、数独格、推理表、坐标格、分类框、线索区边界必须直、清楚、规整；粗分隔线和细分隔线层级明确；当前选中格可使用浅蓝底和亮蓝描边。数字、字母、图形或选项要居中、足够大、对比强，适合投屏。\n按钮使用厚实圆润胶囊、大圆角矩形或方形数字卡。数字选项按钮使用白底、轻阴影、亮蓝数字；提交按钮使用亮蓝大胶囊，带白色对勾图标和清楚文字；撤销按钮使用亮蓝或浅蓝；清除按钮可置灰并保持轮廓；提示卡使用浅绿色或浅奶油底。返回、星星、计时、关卡胶囊使用圆润图标按钮和状态胶囊。所有按钮都要有足够触碰面积、间距、按压反馈和禁用态，儿童点击不容易误触。\n字体整体圆润、粗清晰、低龄友好。标题和关卡文字可更活泼；题干、规则、数字、按钮、反馈必须标准易读。不要使用过细字体、强描边、复杂阴影或装饰字。不要把文字压在蓝天背景、植物、角色或强光效上。\n\n", "5. 色彩、材质与装饰密度\n主色方向为明亮天空蓝、浅青蓝、奶油白、温暖黄橙、亮蓝和清新绿；辅助可用少量浅橙、浅黄、浅绿和柔和红。色彩只作为视觉方向，不在图片中显示任何色号、色卡编号、代码、CSS 文本或设计参数。整体明亮、干净、护眼，避免大面积深色、冷灰、办公蓝、强霓虹和复杂渐变。\n装饰密度必须低于学习内容。纸飞机、云朵、树叶、植物、小圆点、星星和陪伴角色只放在边缘、角落或左侧辅助区，不能穿过题目、选项、槽位、宫格、按钮和反馈区域。蓝色小猫或类似陪伴角色可以作为学习助手，建议放在左侧规则区下方或题板边缘，只承担鼓励和提示氛围，不进入核心题目区。\n\n", "6. UI层级与反馈\n底层是蓝天渐变背景；中层是大型奶油白训练营题板和内部功能卡片盖在背景图上，由html/CSS/js  绘制适合本风格的题板区域；上层是可拖拽对象、数字按钮、选项、工具按钮、提交按钮、状态胶囊和反馈卡；弹窗层用于完成、结果或时间到，必须用清楚的独立卡片承载。\n正确反馈使用清新绿反馈卡、笑脸图标、星星、彩纸和“继续加油”类温和鼓励；错误反馈使用柔和红橙边框、轻微摇动和温和提示；选中态使用浅蓝填充、亮蓝描边和轻微上浮；提交成功可让星星或进度轻微点亮。所有反馈只强化原交互，不新增新玩法，不改变原题目判断逻辑。\n\n", "7. 音效反馈规范\n音效是 UI 反馈的一部分，必须优先匹配当前风格的专属音效；只用于强化点击、选中、拖拽、落位、提交、答对、答错、提示、完成和重置状态，不改变原课件玩法、题型、节奏和按钮功能。音效需短促、低音量、低干扰，不能循环播放，不能盖过教学语音；需遵守原课件已有静音和音量设置。若没有真实音频素材，可用平台素材库、安全音效或 WebAudio 近似实现，但仍要尽量贴近本风格音效意图。\n本风格音效：点击使用清脆软按钮音，选中格子使用轻点亮声，放入或选择数字使用短促卡片落位声，提交使用明亮确认音，答对使用星星奖励铃和轻快完成音，答错使用低音量柔和提示音，不使用刺耳警报或办公系统提示音。\n\n", "8. 禁止项\n禁止生成真人照片、办公场景、抽象设计展板、软件界面截图、APP 字样、设计稿标题、样式说明、伪中文、伪英文、乱码、品牌名、公司名、水印、二维码、角标、色值、尺寸标记、代码或 CSS 标注。禁止把清晰逻辑风做成冷淡商务工具、纯网格背景、霓虹科技、深色竞技或复杂海报。禁止遮挡、重绘、扭曲或弱化原题目、题板、格线、槽位、按钮和反馈状态。"], "sectionsNew": ["请严格使用下述画面风格、布局、UI规范来重新生成课件：\n\n", "0. 原课件保留规则\n本风格只用于 UI 视觉换肤，不得改变原课件的学科、题型、题目内容、答案、素材数量、槽位数量、组件数量、布局关系、按钮功能、计分逻辑和交互流程。原来是英语看图拼词、填空、拖拽、选择、分类、连线、数独、宫格推理或其他逻辑任务，换风格后仍保持原玩法和原题目结构。主互动题页中的题干、选项、答案、字母、汉字、数字、公式、倒计时、得分、按钮文案、反馈文案和关卡信息等可变教学内容，必须由 HTML/CSS/JS 渲染，不要烘焙进背景图或题板底图。\n\n", "1. 整体视觉与布局\n风格识别锚点：第一眼应像儿童逻辑训练营，而不是商务网格或抽象设计稿。使用清爽青蓝渐变背景、淡米白棋盘或宫格底纹、中央清晰逻辑题互动区、白色圆角卡片、浅灰分隔线、暖黄色圆角外框、亮蓝主按钮、暖橙答案高亮和绿色正确反馈；适合数独、迷宫、行列推理和逻辑挑战，整体干净、专注、儿童友好。\n本风格不是冷淡办公逻辑风，也不是抽象设计展板；它是面向小学儿童的“逻辑训练营”课堂 UI。整体以明亮蓝天渐变背景、奶油白大题板、黄橙色厚边框、天空蓝状态胶囊和圆润卡片组成，氛围清爽、积极、有训练营感，适合数独、宫格推理、找规律、分类、排序、选择和解题任务。\n使用横版课件画布。最底层是蓝天到浅青蓝的渐变背景，可有淡淡云朵、树叶、纸飞机、小圆点和角落植物，但背景只提供轻松氛围，不承担学习信息。主学习区放在中央大型奶油白题板内，题板四周是柔和黄橙厚边框，整体像儿童训练营任务板。顶部可有返回按钮、课程标题、关卡胶囊、星星数量、计时器等状态区；中间是核心题目与操作区；左右可放规则、角色提示、工具按钮和反馈卡。所有正式文字和状态数据由页面渲染。\n\n", "2. 封面图规范与生图提示词逻辑\n【本节适用范围】第2节是完整封面设计，第3节是进入后的主互动页背景，两者必须分别生成、分别使用。封面继续执行本节第3项的原有美术描述，包括艺术字、角色、场景、材质、副标题载体和按钮设计；不得把它改成“空背景＋普通HTML标题按钮”。第3节的无文字、无按钮、中央留白要求，以及第4—6节的题板、标准正文字体、学习区低干扰规则，只约束主互动页，不得用来删减封面。除用户在本次调整中明确要求不要封面外，仍按原版规范生成完整图片式首页。\n\n1）封面图用于儿童互动课件首页。封面图本身必须生成主标题、副标题和进入按钮；副标题不得超过15个字，图上不生成任何额外文字、包括风格名、品牌名、logo、水印、二维码、角标、色值、尺寸标记、伪文字或无关宣传语都不允许生成。封面图中的主标题、副标题、按钮造型和按钮文字是最终可见内容，必须保留。HTML 不得在这张封面图上再次叠加可见标题、副标题、按钮、按钮文字或底座；只配置覆盖封面的透明点击层，点击封面任意位置进入原课件。这里禁止的是 HTML 重复叠加，不是禁止图片生成标题或按钮。\n2）主标题、副标题和按钮文案都是可变元素，必须根据当前课件真实内容替换；若为英语课件则尽量用英文，若非英语课件则一律用中文。标题、短副标题和进入按钮需要沿同一视觉主轴组织，层级清楚、可读性强，适合课堂投屏。\n3）本视觉风格封面的生图提示词：\n儿童卡通风格，2.5D粘土质感，阳光明媚的户外草地小径背景。左侧有一个穿着警帽、背着书包、胸前戴星星徽章的蓝色小猫学习伙伴，微笑点赞，动作积极。右侧根据当前课件主题生成对应学习装饰，例如逻辑题可放木质框架的 Sudoku 数字填空小板，英语课件可放单词卡或字母卡，数学课件可放数字卡或几何卡。顶部有蓝色和黄色星星装饰，背景有纸飞机、云朵、花草和飘落星星。画面中心上方生成大的蓝黄相间立体泡泡标题“{标题内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，标题带白色描边、气泡轮廓和小星星。标题下方生成蓝色丝带副标题“{副标题内容根据课件真实内容填充，副标题不超过15个字，若为英语课件则尽量用英文，若非英文课件则一律用中文}”。画面中下方生成黄色立体胶囊按钮，按钮上写“{进入游戏，按钮内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，按钮右侧带白色箭头和小星星。\n\n4）封面接入顺序：先根据真实课件确认主标题、短副标题和进入文案，再依照上面的原版美术描述生成一张完整封面图；将它完整适配课件舞台，不裁掉文字、角色或按钮，也不把整张封面当作中间的小插图套进另一张封面。仅在封面容器内移除或隐藏源 HTML 的标题、副标题、示例插画和可见开始按钮，清理伪元素及 CSS 背景中重复的文字/按钮；主互动页的题干、选项、答案、控件和逻辑全部保留。不要因源课件原来使用 HTML 标题而继续保留第二套可见封面。\n5）透明点击层只承接进入事件，不绘制文字、图标、背景、边框、阴影或底座；可保留不可见的无障碍名称和键盘进入能力，不能将整张封面图设成透明。一次完整点击/触控只进入一次，不在 pointerdown 时提前撤掉封面；隔离本次手势，禁止继续触发下一页答案、拖拽或提交。进入第一题时仍为未作答状态。\n6）交付前同时核对封面原图与浏览器实际首屏：图中艺术标题、短副标题和设计按钮齐全且各一套，浏览器没有额外的可见 DOM/CSS 文字或按钮，点击任意位置可进入第一题。若有重复，修正 HTML 接入层；若图中文字错误，单独修正封面素材。不得用删掉艺术字、角色、按钮设计，换成空场景，或直接跳过封面的办法通过去重检查。\n\n", "3. 背景图规范与生图提示词逻辑\n1）背景图只用于提供风格氛围，不强行生成题目承载区域。题目白板、任务板、卡片、槽位、按钮和状态栏应由 HTML/CSS/JS 根据当前课件内容绘制，并覆盖在背景图上。背景图中不要生成框、白板、题板、任务板、玻璃板、卡片、按钮、标题、题目文字、选项文字、数字、字母、汉字、格线、槽位、logo、水印或二维码。\n2）背景图可以参考该风格 bg 图和 cover 图的视觉感觉自由延展，但只保留场景、色彩、材质、角色气质和边缘装饰；画面中心应保持开阔、低干扰，方便前端绘制适配当前题型的题板。\n3）本视觉风格背景图的生图提示词：\n儿童卡通风格，2.5D粘土质感，阳光明媚的户外草地小径背景，蓝天、白云、纸飞机、飘落星星、花草和浅青蓝渐变氛围，边缘可有小花、小树叶和轻量几何点缀。画面中心保持开阔、干净、低干扰，方便 HTML/CSS/JS 后续绘制逻辑训练题板。不要生成任何白板、题板框、卡片框、按钮、标题、文字、数字、格线、logo、水印或二维码。\n\n", "4. 核心题板、按钮、字体与触控规范\n核心题板要像儿童逻辑训练工具，而不是纯背景插画。宫格、数独格、推理表、坐标格、分类框、线索区边界必须直、清楚、规整；粗分隔线和细分隔线层级明确；当前选中格可使用浅蓝底和亮蓝描边。数字、字母、图形或选项要居中、足够大、对比强，适合投屏。\n按钮使用厚实圆润胶囊、大圆角矩形或方形数字卡。数字选项按钮使用白底、轻阴影、亮蓝数字；提交按钮使用亮蓝大胶囊，带白色对勾图标和清楚文字；撤销按钮使用亮蓝或浅蓝；清除按钮可置灰并保持轮廓；提示卡使用浅绿色或浅奶油底。返回、星星、计时、关卡胶囊使用圆润图标按钮和状态胶囊。所有按钮都要有足够触碰面积、间距、按压反馈和禁用态，儿童点击不容易误触。\n字体整体圆润、粗清晰、低龄友好。标题和关卡文字可更活泼；题干、规则、数字、按钮、反馈必须标准易读。不要使用过细字体、强描边、复杂阴影或装饰字。不要把文字压在蓝天背景、植物、角色或强光效上。\n\n", "5. 色彩、材质与装饰密度\n主色方向为明亮天空蓝、浅青蓝、奶油白、温暖黄橙、亮蓝和清新绿；辅助可用少量浅橙、浅黄、浅绿和柔和红。色彩只作为视觉方向，不在图片中显示任何色号、色卡编号、代码、CSS 文本或设计参数。整体明亮、干净、护眼，避免大面积深色、冷灰、办公蓝、强霓虹和复杂渐变。\n装饰密度必须低于学习内容。纸飞机、云朵、树叶、植物、小圆点、星星和陪伴角色只放在边缘、角落或左侧辅助区，不能穿过题目、选项、槽位、宫格、按钮和反馈区域。蓝色小猫或类似陪伴角色可以作为学习助手，建议放在左侧规则区下方或题板边缘，只承担鼓励和提示氛围，不进入核心题目区。\n\n", "6. UI层级与反馈\n底层是蓝天渐变背景；中层是大型奶油白训练营题板和内部功能卡片盖在背景图上，由html/CSS/js  绘制适合本风格的题板区域；上层是可拖拽对象、数字按钮、选项、工具按钮、提交按钮、状态胶囊和反馈卡；弹窗层用于完成、结果或时间到，必须用清楚的独立卡片承载。\n正确反馈使用清新绿反馈卡、笑脸图标、星星、彩纸和“继续加油”类温和鼓励；错误反馈使用柔和红橙边框、轻微摇动和温和提示；选中态使用浅蓝填充、亮蓝描边和轻微上浮；提交成功可让星星或进度轻微点亮。所有反馈只强化原交互，不新增新玩法，不改变原题目判断逻辑。\n\n", "7. 音效反馈规范\n音效是 UI 反馈的一部分，必须优先匹配当前风格的专属音效；只用于强化点击、选中、拖拽、落位、提交、答对、答错、提示、完成和重置状态，不改变原课件玩法、题型、节奏和按钮功能。音效需短促、低音量、低干扰，不能循环播放，不能盖过教学语音；需遵守原课件已有静音和音量设置。若没有真实音频素材，可用平台素材库、安全音效或 WebAudio 近似实现，但仍要尽量贴近本风格音效意图。\n本风格音效：点击使用清脆软按钮音，选中格子使用轻点亮声，放入或选择数字使用短促卡片落位声，提交使用明亮确认音，答对使用星星奖励铃和轻快完成音，答错使用低音量柔和提示音，不使用刺耳警报或办公系统提示音。\n\n", "8. 禁止项\n禁止生成真人照片、办公场景、抽象设计展板、软件界面截图、APP 字样、设计稿标题、样式说明、伪中文、伪英文、乱码、品牌名、公司名、水印、二维码、角标、色值、尺寸标记、代码或 CSS 标注。禁止把清晰逻辑风做成冷淡商务工具、纯网格背景、霓虹科技、深色竞技或复杂海报。禁止遮挡、重绘、扭曲或弱化原题目、题板、格线、槽位、按钮和反馈状态。"], "section2": 3, "blocks": [{"kind": "equal", "old": "2. 封面图规范与生图提示词逻辑\n", "new": "2. 封面图规范与生图提示词逻辑\n"}, {"kind": "insert", "old": "", "new": "【本节适用范围】第2节是完整封面设计，第3节是进入后的主互动页背景，两者必须分别生成、分别使用。封面继续执行本节第3项的原有美术描述，包括艺术字、角色、场景、材质、副标题载体和按钮设计；不得把它改 d": "S11", "promptText": "请严格使用下述画面风格、布局、UI规范来重新生成课件：\n\n0. 原课件保留规则\n本风格只用于 UI 视觉换肤，不得改变原课件的学科、题型、题目内容、答案、素材数量、槽位数量、组件数量、布局关系、按钮功能、计分逻辑和交互流程。原来是英语看图拼词、填空、拖拽、选择、分类、连线、逻辑推理或其他玩法，换风格后仍保持原玩法和原题目结构。主互动题页中的题干、选项、答案、字母、汉字、拼音、数字、公式、倒计时、得分、按钮文案、反馈文案和关卡信息等可变教学内容，必须由 HTML/CSS/JS 渲染，不要烘焙进背景图或题板底图。\n\n1. 整体视觉与布局\n风格识别锚点：第一眼应像浅蓝海洋探索课堂，而不是普通蓝色白板。使用浅蓝水波、透明气泡、贝壳、海星、珍珠、轻海浪边框和清爽海洋任务板；主内容区像浮在水面的干净玻璃卡或泡泡卡，气泡和海洋装饰只在边缘轻量出现，不能进入题目、格线、槽位和按钮区域。\n采用明亮海底背景和中央水波玻璃题板。画面有水面光束、气泡、珊瑚、贝壳、海星、小鱼和珍珠氛围，但这些元素只承担海洋探索感，不承担学习信息。整体清爽、明亮、护眼，不做深海压暗，也不把海洋装饰做得比题目更醒目。\n使用横版课件画布，画布主体集中在中央学习区，四周保留安全边距。顶部保留原课件已有标题、关卡、进度、奖励、倒计时或得分信息；中央按原课件布局放置题目、图片区、网格、线索、选项、素材池、槽位或操作区；底部或右侧保留原有按钮和工具按钮。背景只提供氛围，不承担学习信息。\n\n2. 封面图规范与生图提示词逻辑\n【本节适用范围】第2节是完整封面设计，第3节是进入后的主互动页背景，两者必须分别生成、分别使用。封面继续执行本节第3项的原有美术描述，包括艺术字、角色、场景、材质、副标题载体和按钮设计；不得把它改成“空背景＋普通HTML标题按钮”。第3节的无文字、无按钮、中央留白要求，以及第4—6节的题板、标准正文字体、学习区低干扰规则，只约束主互动页，不得用来删减封面。除用户在本次调整中明确要求不要封面外，仍按原版规范生成完整图片式首页。\n\n1）封面图用于儿童互动课件首页。封面图本身必须生成主标题、副标题和进入按钮；副标题不得超过15个字，图上不生成任何额外文字、包括风格名、品牌名、logo、水印、二维码、角标、色值、尺寸标记、伪文字或无关宣传语都不允许生成。封面图中的主标题、副标题、按钮造型和按钮文字是最终可见内容，必须保留。HTML 不得在这张封面图上再次叠加可见标题、副标题、按钮、按钮文字或底座；只配置覆盖封面的透明点击层，点击封面任意位置进入原课件。这里禁止的是 HTML 重复叠加，不是禁止图片生成标题或按钮。\n2）主标题、副标题和按钮文案都是可变元素，必须根据当前课件真实内容替换；若为英语课件则尽量用英文，若非英语课件则一律用中文。标题、短副标题和进入按钮需要沿同一视觉主轴组织，层级清楚、可读性强，适合课堂投屏。\n3）本视觉风格封面的生图提示词：\n明亮儿童海底探险封面，2.5D粘土卡通质感，水面光束从上方洒下，蓝色海水、珊瑚、贝壳、珍珠、海星、小鱼和气泡围绕画面。左右两侧放低干扰海洋装饰和可爱海洋角色，角色可根据课件主题替换为海龟、小鱼、海豚或潜水小伙伴。画面中心上方生成大号水泡立体标题“{标题内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，标题使用蓝白渐变、黄色高光、贝壳和海星点缀。标题下方生成短副标题“{副标题内容根据课件真实内容填充，副标题不超过15个字，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，放在小水波丝带或贝壳标签内。下方生成黄色圆润胶囊按钮，按钮文字为“{进入游戏，按钮内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，按钮带珍珠高光和小箭头。\n\n4）封面接入顺序：先根据真实课件确认主标题、短副标题和进入文案，再依照上面的原版美术描述生成一张完整封面图；将它完整适配课件舞台，不裁掉文字、角色或按钮，也不把整张封面当作中间的小插图套进另一张封面。仅在封面容器内移除或隐藏源 HTML 的标题、副标题、示例插画和可见开始按钮，清理伪元素及 CSS 背景中重复的文字/按钮；主互动页的题干、选项、答案、控件和逻辑全部保留。不要因源课件原来使用 HTML 标题而继续保留第二套可见封面。\n5）透明点击层只承接进入事件，不绘制文字、图标、背景、边框、阴影或底座；可保留不可见的无障碍名称和键盘进入能力，不能将整张封面图设成透明。一次完整点击/触控只进入一次，不在 pointerdown 时提前撤掉封面；隔离本次手势，禁止继续触发下一页答案、拖拽或提交。进入第一题时仍为未作答状态。\n6）交付前同时核对封面原图与浏览器实际首屏：图中艺术标题、短副标题和设计按钮齐全且各一套，浏览器没有额外的可见 DOM/CSS 文字或按钮，点击任意位置可进入第一题。若有重复，修正 HTML 接入层；若图中文字错误，单独修正封面素材。不得用删掉艺术字、角色、按钮设计，换成空场景，或直接跳过封面的办法通过去重检查。\n\n3. 背景图规范与生图提示词逻辑\n1）背景图只用于提供风格氛围，不强行生成题目承载区域。题目白板、任务板、卡片、槽位、按钮和状态栏应由 HTML/CSS/JS 根据当前课件内容绘制，并覆盖在背景图上。背景图中不要生成框、白板、题板、任务板、玻璃板、卡片、按钮、标题、题目文字、选项文字、数字、字母、汉字、格线、槽位、logo、水印或二维码。\n2）背景图可以参考该风格 bg 图和 cover 图的视觉感觉自由延展，但只保留场景、色彩、材质、角色气质和边缘装饰；画面中心应保持开阔、低干扰，方便前端绘制适配当前题型的题板。\n3）本视觉风格背景图的生图提示词：\n明亮海底探索背景，浅蓝海水、水面光束、细碎气泡、珊瑚、海草、贝壳、珍珠、海星、小鱼和海龟分布在画面边缘，整体清爽护眼、低龄友好。画面中心保留开阔的浅蓝水域和沙地层次，便于 HTML/CSS/JS 绘制水波玻璃题板。不要生成任何玻璃框、白板、题板、按钮、标题、文字、图标、格线、logo、水印或二维码。\n\n4. 按钮、字体与触控规范\n按钮使用水滴胶囊、贝壳圆角按钮或蓝白渐变按钮，开始和下一题偏水波蓝，提交偏海藻绿，提示偏珍珠黄。字体圆润清晰，不能做水波扭曲、透明渐变或强光遮挡。\n本课件面向小学低中高年级儿童，所有核心文字和可点击区域必须适合课堂投屏、互动屏和平板触控。题干、核心选项、按钮文字和状态数字要使用明显偏大的字号，普通提示文字也要清楚可读；主按钮、选项卡、拖拽块和槽位要有足够大的触碰面积和间距，儿童手指点击不容易误触。按钮必须有清楚边界、高对比文字、按压反馈和禁用态；不要把关键文字做得过小、过细、过浅或压在复杂纹理上。\n\n5. 色彩、材质与装饰密度\n色彩以浅蓝、水波蓝、青蓝、珍珠白、海星黄、贝壳粉、珊瑚橙、海藻绿和珊瑚红为主。\n色彩只作为视觉方向，不在图片中显示任何色号、色卡编号、代码、CSS 文本或设计参数。整体保持明亮、干净、护眼，避免大面积深色、强霓虹、复杂渐变和高压迫背景。装饰密度必须低于学习内容，角色、花草、糖果、气泡、电话线、科技光线或海图道具只放在边缘、角落或低层背景，不得穿过题目、选项、槽位、网格、按钮和反馈区域。\n\n6. UI层级与反馈\n底层是风格化背景，只提供氛围；中层是主主题板和内部功能卡片，盖在背景图上，由html/CSS/JS 绘制适合本风格的题板区域，是最高信息承载层；上层是可拖拽对象、选项、按钮、反馈条和当前选中态；弹窗层用于结果、时间到或完成反馈，必须有遮罩或清楚的独立卡片，不能遮挡关键学习内容。\n正确反馈使用珍珠发光、气泡上升、海藻绿描边和轻微亮光；错误反馈使用珊瑚红边框和轻微水波震动；拖拽槽可出现浅蓝气泡高亮。\n所有反馈只强化原交互，不新增新玩法，不改变原题目判断逻辑。\n\n7. 音效反馈规范\n音效是 UI 反馈的一部分，必须优先匹配当前风格的专属音效；只用于强化点击、选中、拖拽、落位、提交、答对、答错、提示、完成和重置状态，不改变原课件玩法、题型、节奏和按钮功能。音效需短促、低音量、低干扰，不能循环播放，不能盖过教学语音；需遵守原课件已有静音和音量设置。若没有真实音频素材，可用平台素材库、安全音效或 WebAudio 近似实现，但仍要尽量贴近本风格音效意图。\n本风格音效：点击使用水滴声，选中和拖拽使用气泡上浮声，答对使用珍珠轻闪和轻柔 blub 水泡声，答错使用低音量水波回弹声。\n\n8. 禁止项\n禁止生成无关实体、无关玩法、无关学科内容、伪文字、乱码、品牌名、公司名、水印、二维码、角标、设计参数、色值、代码、CSS 标注、软件界面说明、宣传语和不可编辑的题目内容。禁止遮挡、重绘、扭曲或弱化原题目、题板、格线、槽位、按钮和反馈状态。", "basePromptSHA256": "0535be8b34ee9cdc5f2ae2d65250e66e5fb7944afd31118d041b890b78470154", "promptSHA256": "a00200a3f9e03ff79c21a198c8e909e7755c320d07fe48742f06506726c96365", "status": "候选待生成验证", "changeScope": "仅第2节：图片封面与HTML职责分离；原有封面美术描述逐字保留", "kind": "base", "old": "请严格使用下述画面风格、布局、UI规范来重新生成课件：\n\n0. 原课件保留规则\n本风格只用于 UI 视觉换肤，不得改变原课件的学科、题型、题目内容、答案、素材数量、槽位数量、组件数量、布局关系、按钮功能、计分逻辑和交互流程。原来是英语看图拼词、填空、拖拽、选择、分类、连线、逻辑推理或其他玩法，换风格后仍保持原玩法和原题目结构。主互动题页中的题干、选项、答案、字母、汉字、拼音、数字、公式、倒计时、得分、按钮文案、反馈文案和关卡信息等可变教学内容，必须由 HTML/CSS/JS 渲染，不要烘焙进背景图或题板底图。\n\n1. 整体视觉与布局\n风格识别锚点：第一眼应像浅蓝海洋探索课堂，而不是普通蓝色白板。使用浅蓝水波、透明气泡、贝壳、海星、珍珠、轻海浪边框和清爽海洋任务板；主内容区像浮在水面的干净玻璃卡或泡泡卡，气泡和海洋装饰只在边缘轻量出现，不能进入题目、格线、槽位和按钮区域。\n采用明亮海底背景和中央水波玻璃题板。画面有水面光束、气泡、珊瑚、贝壳、海星、小鱼和珍珠氛围，但这些元素只承担海洋探索感，不承担学习信息。整体清爽、明亮、护眼，不做深海压暗，也不把海洋装饰做得比题目更醒目。\n使用横版课件画布，画布主体集中在中央学习区，四周保留安全边距。顶部保留原课件已有标题、关卡、进度、奖励、倒计时或得分信息；中央按原课件布局放置题目、图片区、网格、线索、选项、素材池、槽位或操作区；底部或右侧保留原有按钮和工具按钮。背景只提供氛围，不承担学习信息。\n\n2. 封面图规范与生图提示词逻辑\n1）封面图用于儿童互动课件首页。封面图本身必须生成主标题、副标题和进入按钮；副标题不得超过15个字，图上不生成任何额外文字、包括风格名、品牌名、logo、水印、二维码、角标、色值、尺寸标记、伪文字或无关宣传语都不允许生成。逻辑上，从封面图任意位置点击即可进入，禁止在封面图上再生成任何文字/按钮，只需要配置点击事件。\n2）主标题、副标题和按钮文案都是可变元素，必须根据当前课件真实内容替换；若为英语课件则尽量用英文，若非英语课件则一律用中文。标题、短副标题和进入按钮需要沿同一视觉主轴组织，层级清楚、可读性强，适合课堂投屏。\n3）本视觉风格封面的生图提示词：\n明亮儿童海底探险封面，2.5D粘土卡通质感，水面光束从上方洒下，蓝色海水、珊瑚、贝壳、珍珠、海星、小鱼和气泡围绕画面。左右两侧放低干扰海洋装饰和可爱海洋角色，角色可根据课件主题替换为海龟、小鱼、海豚或潜水小伙伴。画面中心上方生成大号水泡立体标题“{标题内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，标题使用蓝白渐变、黄色高光、贝壳和海星点缀。标题下方生成短副标题“{副标题内容根据课件真实内容填充，副标题不超过15个字，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，放在小水波丝带或贝壳标签内。下方生成黄色圆润胶囊按钮，按钮文字为“{进入游戏，按钮内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，按钮带珍珠高光和小箭头。\n\n3. 背景图规范与生图提示词逻辑\n1）背景图只用于提供风格氛围，不强行生成题目承载区域。题目白板、任务板、卡片、槽位、按钮和状态栏应由 HTML/CSS/JS 根据当前课件内容绘制，并覆盖在背景图上。背景图中不要生成框、白板、题板、任务板、玻璃板、卡片、按钮、标题、题目文字、选项文字、数字、字母、汉字、格线、槽位、logo、水印或二维码。\n2）背景图可以参考该风格 bg 图和 cover 图的视觉感觉自由延展，但只保留场景、色彩、材质、角色气质和边缘装饰；画面中心应保持开阔、低干扰，方便前端绘制适配当前题型的题板。\n3）本视觉风格背景图的生图提示词：\n明亮海底探索背景，浅蓝海水、水面光束、细碎气泡、珊瑚、海草、贝壳、珍珠、海星、小鱼和海龟分布在画面边缘，整体清爽护眼、低龄友好。画面中心保留开阔的浅蓝水域和沙地层次，便于 HTML/CSS/JS 绘制水波玻璃题板。不要生成任何玻璃框、白板、题板、按钮、标题、文字、图标、格线、logo、水印或二维码。\n\n4. 按钮、字体与触控规范\n按钮使用水滴胶囊、贝壳圆角按钮或蓝白渐变按钮，开始和下一题偏水波蓝，提交偏海藻绿，提示偏珍珠黄。字体圆润清晰，不能做水波扭曲、透明渐变或强光遮挡。\n本课件面向小学低中高年级儿童，所有核心文字和可点击区域必须适合课堂投屏、互动屏和平板触控。题干、核心选项、按钮文字和状态数字要使用明显偏大的字号，普通提示文字也要清楚可读；主按钮、选项卡、拖拽块和槽位要有足够大的触碰面积和间距，儿童手指点击不容易误触。按钮必须有清楚边界、高对比文字、按压反馈和禁用态；不要把关键文字做得过小、过细、过浅或压在复杂纹理上。\n\n5. 色彩、材质与装饰密度\n色彩以浅蓝、水波蓝、青蓝、珍珠白、海星黄、贝壳粉、珊瑚橙、海藻绿和珊瑚红为主。\n色彩只作为视觉方向，不在图片中显示任何色号、色卡编号、代码、CSS 文本或设计参数。整体保持明亮、干净、护眼，避免大面积深色、强霓虹、复杂渐变和高压迫背景。装饰密度必须低于学习内容，角色、花草、糖果、气泡、电话线、科技光线或海图道具只放在边缘、角落或低层背景，不得穿过题目、选项、槽位、网格、按钮和反馈区域。\n\n6. UI层级与反馈\n底层是风格化背景，只提供氛围；中层是主主题板和内部功能卡片，盖在背景图上，由html/CSS/JS 绘制适合本风格的题板区域，是最高信息承载层；上层是可拖拽对象、选项、按钮、反馈条和当前选中态；弹窗层用于结果、时间到或完成反馈，必须有遮罩或清楚的独立卡片，不能遮挡关键学习内容。\n正确反馈使用珍珠发光、气泡上升、海藻绿描边和轻微亮光；错误反馈使用珊瑚红边框和轻微水波震动；拖拽槽可出现浅蓝气泡高亮。\n所有反馈只强化原交互，不新增新玩法，不改变原题目判断逻辑。\n\n7. 音效反馈规范\n音效是 UI 反馈的一部分，必须优先匹配当前风格的专属音效；只用于强化点击、选中、拖拽、落位、提交、答对、答错、提示、完成和重置状态，不改变原课件玩法、题型、节奏和按钮功能。音效需短促、低音量、低干扰，不能循环播放，不能盖过教学语音；需遵守原课件已有静音和音量设置。若没有真实音频素材，可用平台素材库、安全音效或 WebAudio 近似实现，但仍要尽量贴近本风格音效意图。\n本风格音效：点击使用水滴声，选中和拖拽使用气泡上浮声，答对使用珍珠轻闪和轻柔 blub 水泡声，答错使用低音量水波回弹声。\n\n8. 禁止项\n禁止生成无关实体、无关玩法、无关学科内容、伪文字、乱码、品牌名、公司名、水印、二维码、角标、设计参数、色值、代码、CSS 标注、软件界面说明、宣传语和不可编辑的题目内容。禁止遮挡、重绘、扭曲或弱化原题目、题板、格线、槽位、按钮和反馈状态。", "new": "请严格使用下述画面风格、布局、UI规范来重新生成课件：\n\n0. 原课件保留规则\n本风格只用于 UI 视觉换肤，不得改变原课件的学科、题型、题目内容、答案、素材数量、槽位数量、组件数量、布局关系、按钮功能、计分逻辑和交互流程。原来是英语看图拼词、填空、拖拽、选择、分类、连线、逻辑推理或其他玩法，换风格后仍保持原玩法和原题目结构。主互动题页中的题干、选项、答案、字母、汉字、拼音、数字、公式、倒计时、得分、按钮文案、反馈文案和关卡信息等可变教学内容，必须由 HTML/CSS/JS 渲染，不要烘焙进背景图或题板底图。\n\n1. 整体视觉与布局\n风格识别锚点：第一眼应像浅蓝海洋探索课堂，而不是普通蓝色白板。使用浅蓝水波、透明气泡、贝壳、海星、珍珠、轻海浪边框和清爽海洋任务板；主内容区像浮在水面的干净玻璃卡或泡泡卡，气泡和海洋装饰只在边缘轻量出现，不能进入题目、格线、槽位和按钮区域。\n采用明亮海底背景和中央水波玻璃题板。画面有水面光束、气泡、珊瑚、贝壳、海星、小鱼和珍珠氛围，但这些元素只承担海洋探索感，不承担学习信息。整体清爽、明亮、护眼，不做深海压暗，也不把海洋装饰做得比题目更醒目。\n使用横版课件画布，画布主体集中在中央学习区，四周保留安全边距。顶部保留原课件已有标题、关卡、进度、奖励、倒计时或得分信息；中央按原课件布局放置题目、图片区、网格、线索、选项、素材池、槽位或操作区；底部或右侧保留原有按钮和工具按钮。背景只提供氛围，不承担学习信息。\n\n2. 封面图规范与生图提示词逻辑\n【本节适用范围】第2节是完整封面设计，第3节是进入后的主互动页背景，两者必须分别生成、分别使用。封面继续执行本节第3项的原有美术描述，包括艺术字、角色、场景、材质、副标题载体和按钮设计；不得把它改成“空背景＋普通HTML标题按钮”。第3节的无文字、无按钮、中央留白要求，以及第4—6节的题板、标准正文字体、学习区低干扰规则，只约束主互动页，不得用来删减封面。除用户在本次调整中明确要求不要封面外，仍按原版规范生成完整图片式首页。\n\n1）封面图用于儿童互动课件首页。封面图本身必须生成主标题、副标题和进入按钮；副标题不得超过15个字，图上不生成任何额外文字、包括风格名、品牌名、logo、水印、二维码、角标、色值、尺寸标记、伪文字或无关宣传语都不允许生成。封面图中的主标题、副标题、按钮造型和按钮文字是最终可见内容，必须保留。HTML 不得在这张封面图上再次叠加可见标题、副标题、按钮、按钮文字或底座；只配置覆盖封面的透明点击层，点击封面任意位置进入原课件。这里禁止的是 HTML 重复叠加，不是禁止图片生成标题或按钮。\n2）主标题、副标题和按钮文案都是可变元素，必须根据当前课件真实内容替换；若为英语课件则尽量用英文，若非英语课件则一律用中文。标题、短副标题和进入按钮需要沿同一视觉主轴组织，层级清楚、可读性强，适合课堂投屏。\n3）本视觉风格封面的生图提示词：\n明亮儿童海底探险封面，2.5D粘土卡通质感，水面光束从上方洒下，蓝色海水、珊瑚、贝壳、珍珠、海星、小鱼和气泡围绕画面。左右两侧放低干扰海洋装饰和可爱海洋角色，角色可根据课件主题替换为海龟、小鱼、海豚或潜水小伙伴。画面中心上方生成大号水泡立体标题“{标题内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，标题使用蓝白渐变、黄色高光、贝壳和海星点缀。标题下方生成短副标题“{副标题内容根据课件真实内容填充，副标题不超过15个字，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，放在小水波丝带或贝壳标签内。下方生成黄色圆润胶囊按钮，按钮文字为“{进入游戏，按钮内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，按钮带珍珠高光和小箭头。\n\n4）封面接入顺序：先根据真实课件确认主标题、短副标题和进入文案，再依照上面的原版美术描述生成一张完整封面图；将它完整适配课件舞台，不裁掉文字、角色或按钮，也不把整张封面当作中间的小插图套进另一张封面。仅在封面容器内移除或隐藏源 HTML 的标题、副标题、示例插画和可见开始按钮，清理伪元素及 CSS 背景中重复的文字/按钮；主互动页的题干、选项、答案、控件和逻辑全部保留。不要因源课件原来使用 HTML 标题而继续保留第二套可见封面。\n5）透明点击层只承接进入事件，不绘制文字、图标、背景、边框、阴影或底座；可保留不可见的无障碍名称和键盘进入能力，不能将整张封面图设成透明。一次完整点击/触控只进入一次，不在 pointerdown 时提前撤掉封面；隔离本次手势，禁止继续触发下一页答案、拖拽或提交。进入第一题时仍为未作答状态。\n6）交付前同时核对封面原图与浏览器实际首屏：图中艺术标题、短副标题和设计按钮齐全且各一套，浏览器没有额外的可见 DOM/CSS 文字或按钮，点击任意位置可进入第一题。若有重复，修正 HTML 接入层；若图中文字错误，单独修正封面素材。不得用删掉艺术字、角色、按钮设计，换成空场景，或直接跳过封面的办法通过去重检查。\n\n3. 背景图规范与生图提示词逻辑\n1）背景图只用于提供风格氛围，不强行生成题目承载区域。题目白板、任务板、卡片、槽位、按钮和状态栏应由 HTML/CSS/JS 根据当前课件内容绘制，并覆盖在背景图上。背景图中不要生成框、白板、题板、任务板、玻璃板、卡片、按钮、标题、题目文字、选项文字、数字、字母、汉字、格线、槽位、logo、水印或二维码。\n2）背景图可以参考该风格 bg 图和 cover 图的视觉感觉自由延展，但只保留场景、色彩、材质、角色气质和边缘装饰；画面中心应保持开阔、低干扰，方便前端绘制适配当前题型的题板。\n3）本视觉风格背景图的生图提示词：\n明亮海底探索背景，浅蓝海水、水面光束、细碎气泡、珊瑚、海草、贝壳、珍珠、海星、小鱼和海龟分布在画面边缘，整体清爽护眼、低龄友好。画面中心保留开阔的浅蓝水域和沙地层次，便于 HTML/CSS/JS 绘制水波玻璃题板。不要生成任何玻璃框、白板、题板、按钮、标题、文字、图标、格线、logo、水印或二维码。\n\n4. 按钮、字体与触控规范\n按钮使用水滴胶囊、贝壳圆角按钮或蓝白渐变按钮，开始和下一题偏水波蓝，提交偏海藻绿，提示偏珍珠黄。字体圆润清晰，不能做水波扭曲、透明渐变或强光遮挡。\n本课件面向小学低中高年级儿童，所有核心文字和可点击区域必须适合课堂投屏、互动屏和平板触控。题干、核心选项、按钮文字和状态数字要使用明显偏大的字号，普通提示文字也要清楚可读；主按钮、选项卡、拖拽块和槽位要有足够大的触碰面积和间距，儿童手指点击不容易误触。按钮必须有清楚边界、高对比文字、按压反馈和禁用态；不要把关键文字做得过小、过细、过浅或压在复杂纹理上。\n\n5. 色彩、材质与装饰密度\n色彩以浅蓝、水波蓝、青蓝、珍珠白、海星黄、贝壳粉、珊瑚橙、海藻绿和珊瑚红为主。\n色彩只作为视觉方向，不在图片中显示任何色号、色卡编号、代码、CSS 文本或设计参数。整体保持明亮、干净、护眼，避免大面积深色、强霓虹、复杂渐变和高压迫背景。装饰密度必须低于学习内容，角色、花草、糖果、气泡、电话线、科技光线或海图道具只放在边缘、角落或低层背景，不得穿过题目、选项、槽位、网格、按钮和反馈区域。\n\n6. UI层级与反馈\n底层是风格化背景，只提供氛围；中层是主主题板和内部功能卡片，盖在背景图上，由html/CSS/JS 绘制适合本风格的题板区域，是最高信息承载层；上层是可拖拽对象、选项、按钮、反馈条和当前选中态；弹窗层用于结果、时间到或完成反馈，必须有遮罩或清楚的独立卡片，不能遮挡关键学习内容。\n正确反馈使用珍珠发光、气泡上升、海藻绿描边和轻微亮光；错误反馈使用珊瑚红边框和轻微水波震动；拖拽槽可出现浅蓝气泡高亮。\n所有反馈只强化原交互，不新增新玩法，不改变原题目判断逻辑。\n\n7. 音效反馈规范\n音效是 UI 反馈的一部分，必须优先匹配当前风格的专属音效；只用于强化点击、选中、拖拽、落位、提交、答对、答错、提示、完成和重置状态，不改变原课件玩法、题型、节奏和按钮功能。音效需短促、低音量、低干扰，不能循环播放，不能盖过教学语音；需遵守原课件已有静音和音量设置。若没有真实音频素材，可用平台素材库、安全音效或 WebAudio 近似实现，但仍要尽量贴近本风格音效意图。\n本风格音效：点击使用水滴声，选中和拖拽使用气泡上浮声，答对使用珍珠轻闪和轻柔 blub 水泡声，答错使用低音量水波回弹声。\n\n8. 禁止项\n禁止生成无关实体、无关玩法、无关学科内容、伪文字、乱码、品牌名、公司名、水印、二维码、角标、设计参数、色值、代码、CSS 标注、软件界面说明、宣传语和不可编辑的题目内容。禁止遮挡、重绘、扭曲或弱化原题目、题板、格线、槽位、按钮和反馈状态。", "sectionsOld": ["请严格使用下述画面风格、布局、UI规范来重新生成课件：\n\n", "0. 原课件保留规则\n本风格只用于 UI 视觉换肤，不得改变原课件的学科、题型、题目内容、答案、素材数量、槽位数量、组件数量、布局关系、按钮功能、计分逻辑和交互流程。原来是英语看图拼词、填空、拖拽、选择、分类、连线、逻辑推理或其他玩法，换风格后仍保持原玩法和原题目结构。主互动题页中的题干、选项、答案、字母、汉字、拼音、数字、公式、倒计时、得分、按钮文案、反馈文案和关卡信息等可变教学内容，必须由 HTML/CSS/JS 渲染，不要烘焙进背景图或题板底图。\n\n", "1. 整体视觉与布局\n风格识别锚点：第一眼应像浅蓝海洋探索课堂，而不是普通蓝色白板。使用浅蓝水波、透明气泡、贝壳、海星、珍珠、轻海浪边框和清爽海洋任务板；主内容区像浮在水面的干净玻璃卡或泡泡卡，气泡和海洋装饰只在边缘轻量出现，不能进入题目、格线、槽位和按钮区域。\n采用明亮海底背景和中央水波玻璃题板。画面有水面光束、气泡、珊瑚、贝壳、海星、小鱼和珍珠氛围，但这些元素只承担海洋探索感，不承担学习信息。整体清爽、明亮、护眼，不做深海压暗，也不把海洋装饰做得比题目更醒目。\n使用横版课件画布，画布主体集中在中央学习区，四周保留安全边距。顶部保留原课件已有标题、关卡、进度、奖励、倒计时或得分信息；中央按原课件布局放置题目、图片区、网格、线索、选项、素材池、槽位或操作区；底部或右侧保留原有按钮和工具按钮。背景只提供氛围，不承担学习信息。\n\n", "2. 封面图规范与生图提示词逻辑\n1）封面图用于儿童互动课件首页。封面图本身必须生成主标题、副标题和进入按钮；副标题不得超过15个字，图上不生成任何额外文字、包括风格名、品牌名、logo、水印、二维码、角标、色值、尺寸标记、伪文字或无关宣传语都不允许生成。逻辑上，从封面图任意位置点击即可进入，禁止在封面图上再生成任何文字/按钮，只需要配置点击事件。\n2）主标题、副标题和按钮文案都是可变元素，必须根据当前课件真实内容替换；若为英语课件则尽量用英文，若非英语课件则一律用中文。标题、短副标题和进入按钮需要沿同一视觉主轴组织，层级清楚、可读性强，适合课堂投屏。\n3）本视觉风格封面的生图提示词：\n明亮儿童海底探险封面，2.5D粘土卡通质感，水面光束从上方洒下，蓝色海水、珊瑚、贝壳、珍珠、海星、小鱼和气泡围绕画面。左右两侧放低干扰海洋装饰和可爱海洋角色，角色可根据课件主题替换为海龟、小鱼、海豚或潜水小伙伴。画面中心上方生成大号水泡立体标题“{标题内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，标题使用蓝白渐变、黄色高光、贝壳和海星点缀。标题下方生成短副标题“{副标题内容根据课件真实内容填充，副标题不超过15个字，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，放在小水波丝带或贝壳标签内。下方生成黄色圆润胶囊按钮，按钮文字为“{进入游戏，按钮内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，按钮带珍珠高光和小箭头。\n\n", "3. 背景图规范与生图提示词逻辑\n1）背景图只用于提供风格氛围，不强行生成题目承载区域。题目白板、任务板、卡片、槽位、按钮和状态栏应由 HTML/CSS/JS 根据当前课件内容绘制，并覆盖在背景图上。背景图中不要生成框、白板、题板、任务板、玻璃板、卡片、按钮、标题、题目文字、选项文字、数字、字母、汉字、格线、槽位、logo、水印或二维码。\n2）背景图可以参考该风格 bg 图和 cover 图的视觉感觉自由延展，但只保留场景、色彩、材质、角色气质和边缘装饰；画面中心应保持开阔、低干扰，方便前端绘制适配当前题型的题板。\n3）本视觉风格背景图的生图提示词：\n明亮海底探索背景，浅蓝海水、水面光束、细碎气泡、珊瑚、海草、贝壳、珍珠、海星、小鱼和海龟分布在画面边缘，整体清爽护眼、低龄友好。画面中心保留开阔的浅蓝水域和沙地层次，便于 HTML/CSS/JS 绘制水波玻璃题板。不要生成任何玻璃框、白板、题板、按钮、标题、文字、图标、格线、logo、水印或二维码。\n\n", "4. 按钮、字体与触控规范\n按钮使用水滴胶囊、贝壳圆角按钮或蓝白渐变按钮，开始和下一题偏水波蓝，提交偏海藻绿，提示偏珍珠黄。字体圆润清晰，不能做水波扭曲、透明渐变或强光遮挡。\n本课件面向小学低中高年级儿童，所有核心文字和可点击区域必须适合课堂投屏、互动屏和平板触控。题干、核心选项、按钮文字和状态数字要使用明显偏大的字号，普通提示文字也要清楚可读；主按钮、选项卡、拖拽块和槽位要有足够大的触碰面积和间距，儿童手指点击不容易误触。按钮必须有清楚边界、高对比文字、按压反馈和禁用态；不要把关键文字做得过小、过细、过浅或压在复杂纹理上。\n\n", "5. 色彩、材质与装饰密度\n色彩以浅蓝、水波蓝、青蓝、珍珠白、海星黄、贝壳粉、珊瑚橙、海藻绿和珊瑚红为主。\n色彩只作为视觉方向，不在图片中显示任何色号、色卡编号、代码、CSS 文本或设计参数。整体保持明亮、干净、护眼，避免大面积深色、强霓虹、复杂渐变和高压迫背景。装饰密度必须低于学习内容，角色、花草、糖果、气泡、电话线、科技光线或海图道具只放在边缘、角落或低层背景，不得穿过题目、选项、槽位、网格、按钮和反馈区域。\n\n", "6. UI层级与反馈\n底层是风格化背景，只提供氛围；中层是主主题板和内部功能卡片，盖在背景图上，由html/CSS/JS 绘制适合本风格的题板区域，是最高信息承载层；上层是可拖拽对象、选项、按钮、反馈条和当前选中态；弹窗层用于结果、时间到或完成反馈，必须有遮罩或清楚的独立卡片，不能遮挡关键学习内容。\n正确反馈使用珍珠发光、气泡上升、海藻绿描边和轻微亮光；错误反馈使用珊瑚红边框和轻微水波震动；拖拽槽可出现浅蓝气泡高亮。\n所有反馈只强化原交互，不新增新玩法，不改变原题目判断逻辑。\n\n", "7. 音效反馈规范\n音效是 UI 反馈的一部分，必须优先匹配当前风格的专属音效；只用于强化点击、选中、拖拽、落位、提交、答对、答错、提示、完成和重置状态，不改变原课件玩法、题型、节奏和按钮功能。音效需短促、低音量、低干扰，不能循环播放，不能盖过教学语音；需遵守原课件已有静音和音量设置。若没有真实音频素材，可用平台素材库、安全音效或 WebAudio 近似实现，但仍要尽量贴近本风格音效意图。\n本风格音效：点击使用水滴声，选中和拖拽使用气泡上浮声，答对使用珍珠轻闪和轻柔 blub 水泡声，答错使用低音量水波回弹声。\n\n", "8. 禁止项\n禁止生成无关实体、无关玩法、无关学科内容、伪文字、乱码、品牌名、公司名、水印、二维码、角标、设计参数、色值、代码、CSS 标注、软件界面说明、宣传语和不可编辑的题目内容。禁止遮挡、重绘、扭曲或弱化原题目、题板、格线、槽位、按钮和反馈状态。"], "sectionsNew": ["请严格使用下述画面风格、布局、UI规范来重新生成课件：\n\n", "0. 原课件保留规则\n本风格只用于 UI 视觉换肤，不得改变原课件的学科、题型、题目内容、答案、素材数量、槽位数量、组件数量、布局关系、按钮功能、计分逻辑和交互流程。原来是英语看图拼词、填空、拖拽、选择、分类、连线、逻辑推理或其他玩法，换风格后仍保持原玩法和原题目结构。主互动题页中的题干、选项、答案、字母、汉字、拼音、数字、公式、倒计时、得分、按钮文案、反馈文案和关卡信息等可变教学内容，必须由 HTML/CSS/JS 渲染，不要烘焙进背景图或题板底图。\n\n", "1. 整体视觉与布局\n风格识别锚点：第一眼应像浅蓝海洋探索课堂，而不是普通蓝色白板。使用浅蓝水波、透明气泡、贝壳、海星、珍珠、轻海浪边框和清爽海洋任务板；主内容区像浮在水面的干净玻璃卡或泡泡卡，气泡和海洋装饰只在边缘轻量出现，不能进入题目、格线、槽位和按钮区域。\n采用明亮海底背景和中央水波玻璃题板。画面有水面光束、气泡、珊瑚、贝壳、海星、小鱼和珍珠氛围，但这些元素只承担海洋探索感，不承担学习信息。整体清爽、明亮、护眼，不做深海压暗，也不把海洋装饰做得比题目更醒目。\n使用横版课件画布，画布主体集中在中央学习区，四周保留安全边距。顶部保留原课件已有标题、关卡、进度、奖励、倒计时或得分信息；中央按原课件布局放置题目、图片区、网格、线索、选项、素材池、槽位或操作区；底部或右侧保留原有按钮和工具按钮。背景只提供氛围，不承担学习信息。\n\n", "2. 封面图规范与生图提示词逻辑\n【本节适用范围】第2节是完整封面设计，第3节是进入后的主互动页背景，两者必须分别生成、分别使用。封面继续执行本节第3项的原有美术描述，包括艺术字、角色、场景、材质、副标题载体和按钮设计；不得把它改成“空背景＋普通HTML标题按钮”。第3节的无文字、无按钮、中央留白要求，以及第4—6节的题板、标准正文字体、学习区低干扰规则，只约束主互动页，不得用来删减封面。除用户在本次调整中明确要求不要封面外，仍按原版规范生成完整图片式首页。\n\n1）封面图用于儿童互动课件首页。封面图本身必须生成主标题、副标题和进入按钮；副标题不得超过15个字，图上不生成任何额外文字、包括风格名、品牌名、logo、水印、二维码、角标、色值、尺寸标记、伪文字或无关宣传语都不允许生成。封面图中的主标题、副标题、按钮造型和按钮文字是最终可见内容，必须保留。HTML 不得在这张封面图上再次叠加可见标题、副标题、按钮、按钮文字或底座；只配置覆盖封面的透明点击层，点击封面任意位置进入原课件。这里禁止的是 HTML 重复叠加，不是禁止图片生成标题或按钮。\n2）主标题、副标题和按钮文案都是可变元素，必须根据当前课件真实内容替换；若为英语课件则尽量用英文，若非英语课件则一律用中文。标题、短副标题和进入按钮需要沿同一视觉主轴组织，层级清楚、可读性强，适合课堂投屏。\n3）本视觉风格封面的生图提示词：\n明亮儿童海底探险封面，2.5D粘土卡通质感，水面光束从上方洒下，蓝色海水、珊瑚、贝壳、珍珠、海星、小鱼和气泡围绕画面。左右两侧放低干扰海洋装饰和可爱海洋角色，角色可根据课件主题替换为海龟、小鱼、海豚或潜水小伙伴。画面中心上方生成大号水泡立体标题“{标题内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，标题使用蓝白渐变、黄色高光、贝壳和海星点缀。标题下方生成短副标题“{副标题内容根据课件真实内容填充，副标题不超过15个字，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，放在小水波丝带或贝壳标签内。下方生成黄色圆润胶囊按钮，按钮文字为“{进入游戏，按钮内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，按钮带珍珠高光和小箭头。\n\n4）封面接入顺序：先根据真实课件确认主标题、短副标题和进入文案，再依照上面的原版美术描述生成一张完整封面图；将它完整适配课件舞台，不裁掉文字、角色或按钮，也不把整张封面当作中间的小插图套进另一张封面。仅在封面容器内移除或隐藏源 HTML 的标题、副标题、示例插画和可见开始按钮，清理伪元素及 CSS 背景中重复的文字/按钮；主互动页的题干、选项、答案、控件和逻辑全部保留。不要因源课件原来使用 HTML 标题而继续保留第二套可见封面。\n5）透明点击层只承接进入事件，不绘制文字、图标、背景、边框、阴影或底座；可保留不可见的无障碍名称和键盘进入能力，不能将整张封面图设成透明。一次完整点击/触控只进入一次，不在 pointerdown 时提前撤掉封面；隔离本次手势，禁止继续触发下一页答案、拖拽或提交。进入第一题时仍为未作答状态。\n6）交付前同时核对封面原图与浏览器实际首屏：图中艺术标题、短副标题和设计按钮齐全且各一套，浏览器没有额外的可见 DOM/CSS 文字或按钮，点击任意位置可进入第一题。若有重复，修正 HTML 接入层；若图中文字错误，单独修正封面素材。不得用删掉艺术字、角色、按钮设计，换成空场景，或直接跳过封面的办法通过去重检查。\n\n", "3. 背景图规范与生图提示词逻辑\n1）背景图只用于提供风格氛围，不强行生成题目承载区域。题目白板、任务板、卡片、槽位、按钮和状态栏应由 HTML/CSS/JS 根据当前课件内容绘制，并覆盖在背景图上。背景图中不要生成框、白板、题板、任务板、玻璃板、卡片、按钮、标题、题目文字、选项文字、数字、字母、汉字、格线、槽位、logo、水印或二维码。\n2）背景图可以参考该风格 bg 图和 cover 图的视觉感觉自由延展，但只保留场景、色彩、材质、角色气质和边缘装饰；画面中心应保持开阔、低干扰，方便前端绘制适配当前题型的题板。\n3）本视觉风格背景图的生图提示词：\n明亮海底探索背景，浅蓝海水、水面光束、细碎气泡、珊瑚、海草、贝壳、珍珠、海星、小鱼和海龟分布在画面边缘，整体清爽护眼、低龄友好。画面中心保留开阔的浅蓝水域和沙地层次，便于 HTML/CSS/JS 绘制水波玻璃题板。不要生成任何玻璃框、白板、题板、按钮、标题、文字、图标、格线、logo、水印或二维码。\n\n", "4. 按钮、字体与触控规范\n按钮使用水滴胶囊、贝壳圆角按钮或蓝白渐变按钮，开始和下一题偏水波蓝，提交偏海藻绿，提示偏珍珠黄。字体圆润清晰，不能做水波扭曲、透明渐变或强光遮挡。\n本课件面向小学低中高年级儿童，所有核心文字和可点击区域必须适合课堂投屏、互动屏和平板触控。题干、核心选项、按钮文字和状态数字要使用明显偏大的字号，普通提示文字也要清楚可读；主按钮、选项卡、拖拽块和槽位要有足够大的触碰面积和间距，儿童手指点击不容易误触。按钮必须有清楚边界、高对比文字、按压反馈和禁用态；不要把关键文字做得过小、过细、过浅或压在复杂纹理上。\n\n", "5. 色彩、材质与装饰密度\n色彩以浅蓝、水波蓝、青蓝、珍珠白、海星黄、贝壳粉、珊瑚橙、海藻绿和珊瑚红为主。\n色彩只作为视觉方向，不在图片中显示任何色号、色卡编号、代码、CSS 文本或设计参数。整体保持明亮、干净、护眼，避免大面积深色、强霓虹、复杂渐变和高压迫背景。装饰密度必须低于学习内容，角色、花草、糖果、气泡、电话线、科技光线或海图道具只放在边缘、角落或低层背景，不得穿过题目、选项、槽位、网格、按钮和反馈区域。\n\n", "6. UI层级与反馈\n底层是风格化背景，只提供氛围；中层是主主题板和内部功能卡片，盖在背景图上，由html/CSS/JS 绘制适合本风格的题板区域，是最高信息承载层；上层是可拖拽对象、选项、按钮、反馈条和当前选中态；弹窗层用于结果、时间到或完成反馈，必须有遮罩或清楚的独立卡片，不能遮挡关键学习内容。\n正确反馈使用珍珠发光、气泡上升、海藻绿描边和轻微亮光；错误反馈使用珊瑚红边框和轻微水波震动；拖拽槽可出现浅蓝气泡高亮。\n所有反馈只强化原交互，不新增新玩法，不改变原题目判断逻辑。\n\n", "7. 音效反馈规范\n音效是 UI 反馈的一部分，必须优先匹配当前风格的专属音效；只用于强化点击、选中、拖拽、落位、提交、答对、答错、提示、完成和重置状态，不改变原课件玩法、题型、节奏和按钮功能。音效需短促、低音量、低干扰，不能循环播放，不能盖过教学语音；需遵守原课件已有静音和音量设置。若没有真实音频素材，可用平台素材库、安全音效或 WebAudio 近似实现，但仍要尽量贴近本风格音效意图。\n本风格音效：点击使用水滴声，选中和拖拽使用气泡上浮声，答对使用珍珠轻闪和轻柔 blub 水泡声，答错使用低音量水波回弹声。\n\n", "8. 禁止项\n禁止生成无关实体、无关玩法、无关学科内容、伪文字、乱码、品牌名、公司名、水印、二维码、角标、设计参数、色值、代码、CSS 标注、软件界面说明、宣传语和不可编辑的题目内容。禁止遮挡、重绘、扭曲或弱化原题目、题板、格线、槽位、按钮和反馈状态。"], "section2": 3, "blocks": [{"kind": "equal", "old": "2. 封面图规范与生图提示词逻辑\n", "new": "2. 封面图规范与生图提示词逻辑\n"}, {"kind": "insert", "old": "", "new": "【本节适用范围】第2节是完整封面设计，第3节是进入后的主互动页背景，两者必须分别生成、分别使用。封面继续执行本节第3项的原有美术描述，包括艺术字、角色、场景、材质、副标题载体和按钮设计；不得把它改成“空背景＋普通HTML标题按钮”。第3节的无文字、无按钮、中央留白要求，以及第4—6节的题板、标准正文字体、学习区低干扰规则，只约束主互动页，不得用来删减封面。除用户在本次调整中明确要求不要封面外，仍按原版规范生成完整图片式首页。\n\n", "change": 0, "left": [], "right": [{"text": "【本节适用范围】第2节是完整封面设计，第3节是进入后的主互动页背景，两者必须分别生成、分别使用。封面继续执行本节第3项的原有美术描述，包括艺术字、角色、场景、材质、副标题载体和按钮设计；不得把它改成“空背景＋普通HTML标题按钮”。第3节的无文字、无按钮、中央留白要求，以及第4—6节的题板、标准正文字体、学习区低干扰规则，只约束主互动页，不得用来删减封面。除用户在本次调整中明确要求不要封面外，仍按原版规范生成完整图片式首页。\n\n", "changed": true}]}, {"kind": "replace", "old": "1）封面图用于儿童互动课件首页。封面图本身必须生成主标题、副标题和进入按钮；副标题不得超过15个字，图上不生成任何额外文字、包括风格名、品牌名、logo、水印、二维码、角标、色值、尺寸标记、伪文字或无关宣传语都不允许生成。逻辑上，从封面图任意位置点击即可进入，禁止在封面图上再生成任何文字/按钮 插画和可见开始按钮，清理伪元素及 CSS 背景中重复的文字/按钮；主互动页的题干、选项、答案、控件和逻辑全部保留。不要因源课件原来使用 HTML 标题而继续保留第二套可见封面。\n", "change": 2, "left": [], "right": [{"text": "4）封面接入顺序：先根据真实课件确认主标题、短副标题和进入文案，再依照上面的原版美术描述生成一张完整封面图；将它完整适配课件舞台，不裁掉文字、角色或按钮，也不把整张封面当作中间的小插图套进另一张封面。仅在封面容器内移除或隐藏源 HTML 的标题、副标题、示例插画和可见开始按钮，清理伪元素及 CSS 背景中重复的文字/按钮；主互动页的题干、选项、答案、控件和逻辑全部保留。不要因源课件原来使用 HTML 标题而继续保留第二套可见封面。\n", "changed": true}]}, {"kind": "insert", "old": "", "new": "5）透明点击层只承接进入事件，不绘制文字、图标、背景、边框、阴影或底座；可保留不可见的无障碍名称和键盘进入能力，不能将整张封面图设成透明。一次完整点击/触控只进入一次，不在 pointerdown 时提前撤掉封面；隔离本次手势，禁止继续触发下一页答案、拖拽或提交。进入第一题时仍为未作答状态。\n", "change": 3, "left": [], "right": [{"text": "5）透明点击层只承接进入事件，不绘制文字、图标、背景、边框、阴影或底座；可保留不可见的无障碍名称和键盘进入能力，不能将整张封面图设成透明。一次完整点击/触控只进入一次，不在 pointerdown 时提前撤掉封面；隔离本次手势，禁止继续触发下一页答案、拖拽或提交。进入第一题时仍为未作答状态。\n", "changed": true}]}, {"kind": "insert", "old": "", "new": "6）交付前同时核对封面原图与浏览器实际首屏：图中艺术标题、短副标题和设计按钮齐全且各一套，浏览器没有额外的可见 DOM/CSS 文字或按钮，点击任意位置可进入第一题。若有重复，修正 HTML 接入层；若图中文字错误，单独修正封面素材。不得用删掉艺术字、角色、按钮设计，换成空场景，或直接跳过封面的办法通过去重检查。\n\n", "change": 4, "left": [], "right": [{"text": "6）交付前同时核对封面原图与浏览器实际首屏：图中艺术标题、短副标题和设计按钮齐全且各一套，浏览器没有额外的可见 DOM/CSS 文字或按钮，点击任意位置可进入第一题。若有重复，修正 HTML 接入层；若图中文字错误，单独修正封面素材。不得用删掉艺术字、角色、按钮设计，换成空场景，或直接跳过封面的办法通过去重检查。\n\n", "changed": true}]}], "delta": 825}, {"styleCode": "autumn", "displayName": "果园认知风", "caseId": "S12", "promptText": "请严格使用下述画面风格、布局、UI规范来重新生成课件：\n\n0. 原课件保留规则\n本风格只用于 UI 视觉换肤，不得改变原课件的学科、题型、题目内容、答案、素材数量、槽位数量、组件数量、布局关系、按钮功能、计分逻辑和交互流程。原来是英语看图拼词、填空、拖拽、选择、分类、连线、逻辑推理或其他玩法，换风格后仍保持原玩法和原题目结构。主互动题页中的题干、选项、答案、字母、汉字、拼音、数字、公式、倒计时、得分、按钮文案、反馈文案和关卡信息等可变教学内容，必须由 HTML/CSS/JS 渲染，不要烘焙进背景图或题板底图。\n\n1. 整体视觉与布局\n风格识别锚点：第一眼应像温暖秋日果园认知课。使用暖橙阳光、橘子树或果树、绿叶、木质小篮子、柔和草地和中央白色圆角互动卡片；按钮可像橘子、树叶或木牌胶囊，整体温暖明亮、轻绘本感、儿童学习 App 质感，适合水果、季节、识字和分类认知。\n采用温暖果园背景和中央奶油白学习卡。画面可以有果树、果篮、草地、阳光、树叶、木牌和小路，传达认知启蒙与自然探索感。果实和树叶只在边缘营造氛围，不能遮挡题目、图片、槽位、选项或按钮。\n使用横版课件画布，画布主体集中在中央学习区，四周保留安全边距。顶部保留原课件已有标题、关卡、进度、奖励、倒计时或得分信息；中央按原课件布局放置题目、图片区、网格、线索、选项、素材池、槽位或操作区；底部或右侧保留原有按钮和工具按钮。背景只提供氛围，不承担学习信息。\n\n2. 封面图规范与生图提示词逻辑\n【本节适用范围】第2节是完整封面设计，第3节是进入后的主互动页背景，两者必须分别生成、分别使用。封面继续执行本节第3项的原有美术描述，包括艺术字、角色、场景、材质、副标题载体和按钮设计；不得把它改成“空背景＋普通HTML标题按钮”。第3节的无文字、无按钮、中央留白要求，以及第4—6节的题板、标准正文字体、学习区低干扰规则，只约束主互动页，不得用来删减封面。除用户在本次调整中明确要求不要封面外，仍按原版规范生成完整图片式首页。\n\n1）封面图用于儿童互动课件首页。封面图本身必须生成主标题、副标题和进入按钮；副标题不得超过15个字，图上不生成任何额外文字、包括风格名、品牌名、logo、水印、二维码、角标、色值、尺寸标记、伪文字或无关宣传语都不允许生成。封面图中的主标题、副标题、按钮造型和按钮文字是最终可见内容，必须保留。HTML 不得在这张封面图上再次叠加可见标题、副标题、按钮、按钮文字或底座；只配置覆盖封面的透明点击层，点击封面任意位置进入原课件。这里禁止的是 HTML 重复叠加，不是禁止图片生成标题或按钮。\n2）主标题、副标题和按钮文案都是可变元素，必须根据当前课件真实内容替换；若为英语课件则尽量用英文，若非英语课件则一律用中文。标题、短副标题和进入按钮需要沿同一视觉主轴组织，层级清楚、可读性强，适合课堂投屏。\n3）本视觉风格封面的生图提示词：\n温暖秋日果园儿童封面，2.5D绘本卡通质感，阳光从左上角照入，橘子树、绿叶、木栅栏、果篮、草地和水果装饰构成明亮果园场景。左侧或下方放可爱小朋友或水果学习伙伴，右侧可根据课件主题放水果、分类卡、篮子或季节认知道具。画面中心上方生成橙黄奶油质感大标题“{标题内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，标题像果酱字或软糖字，带白描边和水果叶片点缀。标题下方生成木牌或浅橙丝带副标题“{副标题内容根据课件真实内容填充，副标题不超过15个字，若为英语课件则尽量用英文，若非英文课件则一律用中文}”。中下方生成橙黄色圆角按钮，按钮文字为“{进入学习，按钮内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，按钮带柔和高光、白描边和小叶子。\n\n4）封面接入顺序：先根据真实课件确认主标题、短副标题和进入文案，再依照上面的原版美术描述生成一张完整封面图；将它完整适配课件舞台，不裁掉文字、角色或按钮，也不把整张封面当作中间的小插图套进另一张封面。仅在封面容器内移除或隐藏源 HTML 的标题、副标题、示例插画和可见开始按钮，清理伪元素及 CSS 背景中重复的文字/按钮；主互动页的题干、选项、答案、控件和逻辑全部保留。不要因源课件原来使用 HTML 标题而继续保留第二套可见封面。\n5）透明点击层只承接进入事件，不绘制文字、图标、背景、边框、阴影或底座；可保留不可见的无障碍名称和键盘进入能力，不能将整张封面图设成透明。一次完整点击/触控只进入一次，不在 pointerdown 时提前撤掉封面；隔离本次手势，禁止继续触发下一页答案、拖拽或提交。进入第一题时仍为未作答状态。\n6）交付前同时核对封面原图与浏览器实际首屏：图中艺术标题、短副标题和设计按钮齐全且各一套，浏览器没有额外的可见 DOM/CSS 文字或按钮，点击任意位置可进入第一题。若有重复，修正 HTML 接入层；若图中文字错误，单独修正封面素材。不得用删掉艺术字、角色、按钮设计，换成空场景，或直接跳过封面的办法通过去重检查。\n\n3. 背景图规范与生图提示词逻辑\n1）背景图只用于提供风格氛围，不强行生成题目承载区域。题目白板、任务板、卡片、槽位、按钮和状态栏应由 HTML/CSS/JS 根据当前课件内容绘制，并覆盖在背景图上。背景图中不要生成框、白板、题板、任务板、玻璃板、卡片、按钮、标题、题目文字、选项文字、数字、字母、汉字、格线、槽位、logo、水印或二维码。\n2）背景图可以参考该风格 bg 图和 cover 图的视觉感觉自由延展，但只保留场景、色彩、材质、角色气质和边缘装饰；画面中心应保持开阔、低干扰，方便前端绘制适配当前题型的题板。\n3）本视觉风格背景图的生图提示词：\n温暖明亮的秋日果园背景，阳光、橘子树、绿叶、木栅栏、果篮、柔和草地和零散水果在四周边缘形成氛围，色调橙黄、奶油白、浅绿。画面中心保持开阔干净的果园光照区域，方便 HTML/CSS/JS 绘制认知题板。不要生成学习卡片、白板、木牌框、按钮、标题、文字、水果标签、logo、水印或二维码。\n\n4. 按钮、字体与触控规范\n按钮使用果实胶囊、木牌按钮或奶油色圆角按钮，开始偏橙黄，提交偏清新绿，重置偏温暖黄。字体温暖圆润，适合认知启蒙。\n本课件面向小学低中高年级儿童，所有核心文字和可点击区域必须适合课堂投屏、互动屏和平板触控。题干、核心选项、按钮文字和状态数字要使用明显偏大的字号，普通提示文字也要清楚可读；主按钮、选项卡、拖拽块和槽位要有足够大的触碰面积和间距，儿童手指点击不容易误触。按钮必须有清楚边界、高对比文字、按压反馈和禁用态；不要把关键文字做得过小、过细、过浅或压在复杂纹理上。\n\n5. 色彩、材质与装饰密度\n色彩以奶油白、阳光黄、果橙、叶绿、浅木色、天空蓝、浅粉和柔和红为主。\n色彩只作为视觉方向，不在图片中显示任何色号、色卡编号、代码、CSS 文本或设计参数。整体保持明亮、干净、护眼，避免大面积深色、强霓虹、复杂渐变和高压迫背景。装饰密度必须低于学习内容，角色、花草、糖果、气泡、电话线、科技光线或海图道具只放在边缘、角落或低层背景，不得穿过题目、选项、槽位、网格、按钮和反馈区域。\n\n6. UI层级与反馈\n底层是风格化背景，只提供氛围；中层是主主题板和内部功能卡片，盖在背景图上，由html/CSS/JS 绘制适合本风格的题板区域，是最高信息承载层；上层是可拖拽对象、选项、按钮、反馈条和当前选中态；弹窗层用于结果、时间到或完成反馈，必须有遮罩或清楚的独立卡片，不能遮挡关键学习内容。\n正确反馈使用绿色叶片描边、果实落篮和小星光；错误反馈使用柔和红橙边框和轻微摇动；选中态使用暖黄描边和卡片上浮。\n所有反馈只强化原交互，不新增新玩法，不改变原题目判断逻辑。\n\n7. 音效反馈规范\n音效是 UI 反馈的一部分，必须优先匹配当前风格的专属音效；只用于强化点击、选中、拖拽、落位、提交、答对、答错、提示、完成和重置状态，不改变原课件玩法、题型、节奏和按钮功能。音效需短促、低音量、低干扰，不能循环播放，不能盖过教学语音；需遵守原课件已有静音和音量设置。若没有真实音频素材，可用平台素材库、安全音效或 WebAudio 近似实现，但仍要尽量贴近本风格音效意图。\n本风格音效：点击使用轻快木琴声，拖拽落位使用果实落入篮子的短音，答对使用果实收获铃，答错使用轻轻回弹声。\n\n8. 禁止项\n禁止生成无关实体、无关玩法、无关学科内容、伪文字、乱码、品牌名、公司名、水印、二维码、角标、设计参数、色值、代码、CSS 标注、软件界面说明、宣传语和不可编辑的题目内容。禁止遮挡、重绘、扭曲或弱化原题目、题板、格线、槽位、按钮和反馈状态。", "basePromptSHA256": "0aac583f03cbf6a5b3025fbcf22d834b03d5c70fde01a01034dcca16e1ba9965", "promptSHA256": "7b7d12288438c3f096ab455ce88bdf09e58afc378f1cae467eed8dbb0ee21968", "status": "候选待生成验证", "changeScope": "仅第2节：图片封面与HTML职责分离；原有封面美术描述逐字保留", "kind": "base", "old": "请严格使用下述画面风格、布局、UI规范来重新生成课件：\n\n0. 原课件保留规则\n本风格只用于 UI 视觉换肤，不得改变原课件的学科、题型、题目内容、答案、素材数量、槽位数量、组件数量、布局关系、按钮功能、计分逻辑和交互流程。原来是英语看图拼词、填空、拖拽、选择、分类、连线、逻辑推理或其他玩法，换风格后仍保持原玩法和原题目结构。主互动题页中的题干、选项、答案、字母、汉字、拼音、数字、公式、倒计时、得分、按钮文案、反馈文案和关卡信息等可变教学内容，必须由 HTML/CSS/JS 渲染，不要烘焙进背景图或题板底图。\n\n1. 整体视觉与布局\n风格识别锚点：第一眼应像温暖秋日果园认知课。使用暖橙阳光、橘子树或果树、绿叶、木质小篮子、柔和草地和中央白色圆角互动卡片；按钮可像橘子、树叶或木牌胶囊，整体温暖明亮、轻绘本感、儿童学习 App 质感，适合水果、季节、识字和分类认知。\n采用温暖果园背景和中央奶油白学习卡。画面可以有果树、果篮、草地、阳光、树叶、木牌和小路，传达认知启蒙与自然探索感。果实和树叶只在边缘营造氛围，不能遮挡题目、图片、槽位、选项或按钮。\n使用横版课件画布，画布主体集中在中央学习区，四周保留安全边距。顶部保留原课件已有标题、关卡、进度、奖励、倒计时或得分信息；中央按原课件布局放置题目、图片区、网格、线索、选项、素材池、槽位或操作区；底部或右侧保留原有按钮和工具按钮。背景只提供氛围，不承担学习信息。\n\n2. 封面图规范与生图提示词逻辑\n1）封面图用于儿童互动课件首页。封面图本身必须生成主标题、副标题和进入按钮；副标题不得超过15个字，图上不生成任何额外文字、包括风格名、品牌名、logo、水印、二维码、角标、色值、尺寸标记、伪文字或无关宣传语都不允许生成。逻辑上，从封面图任意位置点击即可进入，禁止在封面图上再生成任何文字/按钮，只需要配置点击事 "new": "请严格使用下述画面风格、布局、UI规范来重新生成课件：\n\n0. 原课件保留规则\n本风格只用于 UI 视觉换肤，不得改变原课件的学科、题型、题目内容、答案、素材数量、槽位数量、组件数量、布局关系、按钮功能、计分逻辑和交互流程。原来是英语看图拼词、填空、拖拽、选择、分类、连线、逻辑推理或其他玩法，换风格后仍保持原玩法和原题目结构。主互动题页中的题干、选项、答案、字母、汉字、拼音、数字、公式、倒计时、得分、按钮文案、反馈文案和关卡信息等可变教学内容，必须由 HTML/CSS/JS 渲染，不要烘焙进背景图或题板底图。\n\n1. 整体视觉与布局\n风格识别锚点：第一眼应像温暖秋日果园认知课。使用暖橙阳光、橘子树或果树、绿叶、木质小篮子、柔和草地和中央白色圆角互动卡片；按钮可像橘子、树叶或木牌胶囊，整体温暖明亮、轻绘本感、儿童学习 App 质感，适合水果、季节、识字和分类认知。\n采用温暖果园背景和中央奶油白学习卡。画面可以有果树、果篮、草地、阳光、树叶、木牌和小路，传达认知启蒙与自然探索感。果实和树叶只在边缘营造氛围，不能遮挡题目、图片、槽位、选项或按钮。\n使用横版课件画布，画布主体集中在中央学习区，四周保留安全边距。顶部保留原课件已有标题、关卡、进度、奖励、倒计时或得分信息；中央按原课件布局放置题目、图片区、网格、线索、选项、素材池、槽位或操作区；底部或右侧保留原有按钮和工具按钮。背景只提供氛围，不承担学习信息。\n\n2. 封面图规范与生图提示词逻辑\n【本节适用范围】第2节是完整封面设计，第3节是进入后的主互动页背景，两者必须分别生成、分别使用。封面继续执行本节第3项的原有美术描述，包括艺术字、角色、场景、材质、副标题载体和按钮设计；不得把它改成“空背景＋普通HTML标题按钮”。第3节的无文字、无按钮、中央留白要求，以及第4—6节的题板、标准正文字体、学习区低干扰规则，只约束主互动页，不得用来删减封面。除用户在本次调整中明确要求不要封面外，仍按原版规范生成完整图片式首页。\n\n1）封面图用于儿童互动课件首页。封面图本身必须生成主标题、副标题和进入按钮；副标题不得超过15个字，图上不生成任何额外文字、包括风格名、品牌名、logo、水印、二维码、角标、色值、尺寸标记、伪文字或无关宣传语都不允许生成。封面图中的主标题、副标题、按钮造型和按钮文字是最终可见内容，必须保留。HTML 不得在这张封面图上再次叠加可见标题、副标题、按钮、按钮文字或底座；只配置覆盖封面的透明点击层，点击封面任意位置进入原课件。这里禁止的是 HTML 重复叠加，不是禁止图片生成标题或按钮。\n2）主标题、副标题和按钮文案都是可变元素，必须根据当前课件真实内容替换；若为英语课件则尽量用英文，若非英语课件则一律用中文。标题、短副标题和进入按钮需要沿同一视觉主轴组织，层级清楚、可读性强，适合课堂投屏。\n3）本视觉风格封面的生图提示词：\n温暖秋日果园儿童封面，2.5D绘本卡通质感，阳光从左上角照入，橘子树、绿叶、木栅栏、果篮、草地和水果装饰构成明亮果园场景。左侧或下方放可爱小朋友或水果学习伙伴，右侧可根据课件主题放水果、分类卡、篮子或季节认知道具。画面中心上方生成橙黄奶油质感大标题“{标题内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，标题像果酱字或软糖字，带白描边和水果叶片点缀。标题下方生成木牌或浅橙丝带副标题“{副标题内容根据课件真实内容填充，副标题不超过15个字，若为英语课件则尽量用英文，若非英文课件则一律用中文}”。中下方生成橙黄色圆角按钮，按钮文字为“{进入学习，按钮内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，按钮带柔和高光、白描边和小叶子。\n\n4）封面接入顺序：先根据真实课件确认主标题、短副标题和进入文案，再依照上面的原版美术描述生成一张完整封面图；将它完整适配课件舞台，不裁掉文字、角色或按钮，也不把整张封面当作中间的小插图套进另一张封面。仅在封面容器内移除或隐藏源 HTML 的标题、副标题、示例插画和可见开始按钮，清理伪元素及 CSS 背景中重复的文字/按钮；主互动页的题干、选项、答案、控件和逻辑全部保留。不要因源课件原来使用 HTML 标题而继续保留第二套可见封面。\n5）透明点击层只承接进入事件，不绘制文字、图标、背景、边框、阴影或底座；可保留不可见的无障碍名称和键盘进入能力，不能将整张封面图设成透明。一次完整点击/触控只进入一次，不在 pointerdown 时提前撤掉封面；隔离本次手势，禁止继续触发下一页答案、拖拽或提交。进入第一题时仍为未作答状态。\n6）交付前同时核对封面原图与浏览器实际首屏：图中艺术标题、短副标题和设计按钮齐全且各一套，浏览器没有额外的可见 DOM/CSS 文字或按钮，点击任意位置可进入第一题。若有重复，修正 HTML 接入层；若图中文字错误，单独修正封面素材。不得用删掉艺术字、角色、按钮设计，换成空场景，或直接跳过封面的办法通过去重检查。\n\n3. 背景图规范与生图提示词逻辑\n1）背景图只用于提供风格氛围，不强行生成题目承载区域。题目白板、任务板、卡片、槽位、按钮和状态栏应由 HTML/CSS/JS 根据当前课件内容绘制，并覆盖在背景图上。背景图中不要生成框、白板、题板、任务板、玻璃板、卡片、按钮、标题、题目文字、选项文字、数字、字母、汉字、格线、槽位、logo、水印或二维码。\n2）背景图可以参考该风格 bg 图和 cover 图的视觉感觉自由延展，但只保留场景、色彩、材质、角色气质和边缘装饰；画面中心应保持开阔、低干扰，方便前端绘制适配当前题型的题板。\n3）本视觉风格背景图的生图提示词：\n温暖明亮的秋日果园背景，阳光、橘子树、绿叶、木栅栏、果篮、柔和草地和零散水果在四周边缘形成氛围，色调橙黄、奶油白、浅绿。画面中心保持开阔干净的果园光照区域，方便 HTML/CSS/JS 绘制认知题板。不要生成学习卡片、白板、木牌框、按钮、标题、文字、水果标签、logo、水印或二维码。\n\n4. 按钮、字体与触控规范\n按钮使用果实胶囊、木牌按钮或奶油色圆角按钮，开始偏橙黄，提交偏清新绿，重置偏温暖黄。字体温暖圆润，适合认知启蒙。\n本课件面向小学低中高年级儿童，所有核心文字和可点击区域必须适合课堂投屏、互动屏和平板触控。题干、核心选项、按钮文字和状态数字要使用明显偏大的字号，普通提示文字也要清楚可读；主按钮、选项卡、拖拽块和槽位要有足够大的触碰面积和间距，儿童手指点击不容易误触。按钮必须有清楚边界、高对比文字、按压反馈和禁用态；不要把关键文字做得过小、过细、过浅或压在复杂纹理上。\n\n5. 色彩、材质与装饰密度\n色彩以奶油白、阳光黄、果橙、叶绿、浅木色、天空蓝、浅粉和柔和红为主。\n色彩只作为视觉方向，不在图片中显示任何色号、色卡编号、代码、CSS 文本或设计参数。整体保持明亮、干净、护眼，避免大面积深色、强霓虹、复杂渐变和高压迫背景。装饰密度必须低于学习内容，角色、花草、糖果、气泡、电话线、科技光线或海图道具只放在边缘、角落或低层背景，不得穿过题目、选项、槽位、网格、按钮和反馈区域。\n\n6. UI层级与反馈\n底层是风格化背景，只提供氛围；中层是主主题板和内部功能卡片，盖在背景图上，由html/CSS/JS 绘制适合本风格的题板区域，是最高信息承载层；上层是可拖拽对象、选项、按钮、反馈条和当前选中态；弹窗层用于结果、时间到或完成反馈，必须有遮罩或清楚的独立卡片，不能遮挡关键学习内容。\n正确反馈使用绿色叶片描边、果实落篮和小星光；错误反馈使用柔和红橙边框和轻微摇动；选中态使用暖黄描边和卡片上浮。\n所有反馈只强化原交互，不新增新玩法，不改变原题目判断逻辑。\n\n7. 音效反馈规范\n音效是 UI 反馈的一部分，必须优先匹配当前风格的专属音效；只用于强化点击、选中、拖拽、落位、提交、答对、答错、提示、完成和重置状态，不改变原课件玩法、题型、节奏和按钮功能。音效需短促、低音量、低干扰，不能循环播放，不能盖过教学语音；需遵守原课件已有静音和音量设置。若没有真实音频素材，可用平台素材库、安全音效或 WebAudio 近似实现，但仍要尽量贴近本风格音效意图。\n本风格音效：点击使用轻快木琴声，拖拽落位使用果实落入篮子的短音，答对使用果实收获铃，答错使用轻轻回弹声。\n\n8. 禁止项\n禁止生成无关实体、无关玩法、无关学科内容、伪文字、乱码、品牌名、公司名、水印、二维码、角标、设计参数、色值、代码、CSS 标注、软件界面说明、宣传语和不可编辑的题目内容。禁止遮挡、重绘、扭曲或弱化原题目、题板、格线、槽位、按钮和反馈状态。", "sectionsOld": ["请严格使用下述画面风格、布局、UI规范来重新生成课件：\n\n", "0. 原课件保留规则\n本风格只用于 UI 视觉换肤，不得改变原课件的学科、题型、题目内容、答案、素材数量、槽位数量、组件数量、布局关系、按钮功能、计分逻辑和交互流程。原来是英语看图拼词、填空、拖拽、选择、分类、连线、逻辑推理或其他玩法，换风格后仍保持原玩法和原题目结构。主互动题页中的题干、选项、答案、字母、汉字、拼音、数字、公式、倒计时、得分、按钮文案、反馈文案和关卡信息等可变教学内容，必须由 HTML/CSS/JS 渲染，不要烘焙进背景图或题板底图。\n\n", "1. 整体视觉与布局\n风格识别锚点：第一眼应像温暖秋日果园认知课。使用暖橙阳光、橘子树或果树、绿叶、木质小篮子、柔和草地和中央白色圆角互动卡片；按钮可像橘子、树叶或木牌胶囊，整体温暖明亮、轻绘本感、儿童学习 App 质感，适合水果、季节、识字和分类认知。\n采用温暖果园背景和中央奶油白学习卡。画面可以有果树、果篮、草地、阳光、树叶、木牌和小路，传达认知启蒙与自然探索感。果实和树叶只在边缘营造氛围，不能遮挡题目、图片、槽位、选项或按钮。\n使用横版课件画布，画布主体集中在中央学习区，四周保留安全边距。顶部保留原课件已有标题、关卡、进度、奖励、倒计时或得分信息；中央按原课件布局放置题目、图片区、网格、线索、选项、素材池、槽位或操作区；底部或右侧保留原有按钮和工具按钮。背景只提供氛围，不承担学习信息。\n\n", "2. 封面图规范与生图提示词逻辑\n1）封面图用于儿童互动课件首页。封面图本身必须生成主标题、副标题和进入按钮；副标题不得超过15个字，图上不生成任何额外文字、包括风格名、品牌名、logo、水印、二维码、角标、色值、尺寸标记、伪文字或无关宣传语都不允许生成。逻辑上，从封面图任意位置点击即可进入，禁止在封面图上再生成任何文字/按钮，只需要配置点击事件。\n2）主标题、副标题和按钮文案都是可变元素，必须根据当前课件真实内容替换；若为英语课件则尽量用英文，若非英语课件则一律用中文。标题、短副标题和进入按钮需要沿同一视觉主轴组织，层级清楚、可读性强，适合课堂投屏。\n3）本视觉风格封面的生图提示词：\n温暖秋日果园儿童封面，2.5D绘本卡通质感，阳光从左上角照入，橘子树、绿叶、木栅栏、果篮、草地和水果装饰构成明亮果园场景。左侧或下方放可爱小朋友或水果学习伙伴，右侧可根据课件主题放水果、分类卡、篮子或季节认知道具。画面中心上方生成橙黄奶油质感大标题“{标题内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，标题像果酱字或软糖字，带白描边和水果叶片点缀。标题下方生成木牌或浅橙丝带副标题“{副标题内容根据课件真实内容填充，副标题不超过15个字，若为英语课件则尽量用英文，若非英文课件则一律用中文}”。中下方生成橙黄色圆角按钮，按钮文字为“{进入学习，按钮内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，按钮带柔和高光、白描边和小叶子。\n\n", "3. 背景图规范与生图提示词逻辑\n1）背景图只用于提供风格氛围，不强行生成题目承载区域。题目白板、任务板、卡片、槽位、按钮和状态栏应由 HTML/CSS/JS 根据当前课件内容绘制，并覆盖在背景图上。背景图中不要生成框、白板、题板、任务板、玻璃板、卡片、按钮、标题、题目文字、选项文字、数字、字母、汉字、格线、槽位、logo、水印或二维码。\n2）背景图可以参考该风格 bg 图和 cover 图的视觉感觉自由延展，但只保留场景、色彩、材质、角色气质和边缘装饰；画面中心应保持开阔、低干扰，方便前端绘制适配当前题型的题板。\n3）本视觉风格背景图的生图提示词：\n温暖明亮的秋日果园背景，阳光、橘子树、绿叶、木栅栏、果篮、柔和草地和零散水果在四周边缘形成氛围，色调橙黄、奶油白、浅绿。画面中心保持开阔干净的果园光照区域，方便 HTML/CSS/JS 绘制认知题板。不要生成学习卡片、白板、木牌框、按钮、标题、文字、水果标签、logo、水印或二维码。\n\n", "4. 按钮、字体与触控规范\n按钮使用果实胶囊、木牌按钮或奶油色圆角按钮，开始偏橙黄，提交偏清新绿，重置偏温暖黄。字体温暖圆润，适合认知启蒙。\n本课件面向小学低中高年级儿童，所有核心文字和可点击区域必须适合课堂投屏、互动屏和平板触控。题干、核心选项、按钮文字和状态数字要使用明显偏大的字号，普通提示文字也要清楚可读；主按钮、选项卡、拖拽块和槽位要有足够大的触碰面积和间距，儿童手指点击不容易误触。按钮必须有清楚边界、高对比文字、按压反馈和禁用态；不要把关键文字做得过小、过细、过浅或压在复杂纹理上。\n\n", "5. 色彩、材质与装饰密度\n色彩以奶油白、阳光黄、果橙、叶绿、浅木色、天空蓝、浅粉和柔和红为主。\n色彩只作为视觉方向，不在图片中显示任何色号、色卡编号、代码、CSS 文本或设计参数。整体保持明亮、干净、护眼，避免大面积深色、强霓虹、复杂渐变和高压迫背景。装饰密度必须低于学习内容，角色、花草、糖果、气泡、电话线、科技光线或海图道具只放在边缘、角落或低层背景，不得穿过题目、选项、槽位、网格、按钮和反馈区域。\n\n", "6. UI层级与反馈\n底层是风格化背景，只提供氛围；中层是主主题板和内部功能卡片，盖在背景图上，由html/CSS/JS 绘制适合本风格的题板区域，是最高信息承载层；上层是可拖拽对象、选项、按钮、反馈条和当前选中态；弹窗层用于结果、时间到或完成反馈，必须有遮罩或清楚的独立卡片，不能遮挡关键学习内容。\n正确反馈使用绿色叶片描边、果实落篮和小星光；错误反馈使用柔和红橙边框和轻微摇动；选中态使用暖黄描边和卡片上浮。\n所有反馈只强化原交互，不新增新玩法，不改变原题目判断逻辑。\n\n", "7. 音效反馈规范\n音效是 UI 反馈的一部分，必须优先匹配当前风格的专属音效；只用于强化点击、选中、拖拽、落位、提交、答对、答错、提示、完成和重置状态，不改变原课件玩法、题型、节奏和按钮功能。音效需短促、低音量、低干扰，不能循环播放，不能盖过教学语音；需遵守原课件已有静音和音量设置。若没有真实音频素材，可用平台素材库、安全音效或 WebAudio 近似实现，但仍要尽量贴近本风格音效意图。\n本风格音效：点击使用轻快木琴声，拖拽落位使用果实落入篮子的短音，答对使用果实收获铃，答错使用轻轻回弹声。\n\n", "8. 禁止项\n禁止生成无关实体、无关玩法、无关学科内容、伪文字、乱码、品牌名、公司名、水印、二维码、角标、设计参数、色值、代码、CSS 标注、软件界面说明、宣传语和不可编辑的题目内容。禁止遮挡、重绘、扭曲或弱化原题目、题板、格线、槽位、按钮和反馈状态。"], "sectionsNew": ["请严格使用下述画面风格、布局、UI规范来重新生成课件：\n\n", "0. 原课件保留规则\n本风格只用于 UI 视觉换肤，不得改变原课件的学科、题型、题目内容、答案、素材数量、槽位数量、组件数量、布局关系、按钮功能、计分逻辑和交互流程。原来是英语看图拼词、填空、拖拽、选择、分类、连线、逻辑推理或其他玩法，换风格后仍保持原玩法和原题目结构。主互动题页中的题干、选项、答案、字母、汉字、拼音、数字、公式、倒计时、得分、按钮文案、反馈文案和关卡信息等可变教学内容，必须由 HTML/CSS/JS 渲染，不要烘焙进背景图或题板底图。\n\n", "1. 整体视觉与布局\n风格识别锚点：第一眼应像温暖秋日果园认知课。使用暖橙阳光、橘子树或果树、绿叶、木质小篮子、柔和草地和中央白色圆角互动卡片；按钮可像橘子、树叶或木牌胶囊，整体温暖明亮、轻绘本感、儿童学习 App 质感，适合水果、季节、识字和分类认知。\n采用温暖果园背景和中央奶油白学习卡。画面可以有果树、果篮、草地、阳光、树叶、木牌和小路，传达认知启蒙与自然探索感。果实和树叶只在边缘营造氛围，不能遮挡题目、图片、槽位、选项或按钮。\n使用横版课件画布，画布主体集中在中央学习区，四周保留安全边距。顶部保留原课件已有标题、关卡、进度、奖励、倒计时或得分信息；中央按原课件布局放置题目、图片区、网格、线索、选项、素材池、槽位或操作区；底部或右侧保留原有按钮和工具按钮。背景只提供氛围，不承担学习信息。\n\n", "2. 封面图规范与生图提示词逻辑\n【本节适用范围】第2节是完整封面设计，第3节是进入后的主互动页背景，两者必须分别生成、分别使用。封面继续执行本节第3项的原有美术描述，包括艺术字、角色、场景、材质、副标题载体和按钮设计；不得把它改成“空背景＋普通HTML标题按钮”。第3节的无文字、无按钮、中央留白要求，以及第4—6节的题板、标准正文字体、学习区低干扰规则，只约束主互动页，不得用来删减封面。除用户在本次调整中明确要求不要封面外，仍按原版规范生成完整图片式首页。\n\n1）封面图用于儿童互动课件首页。封面图本身必须生成主标题、副标题和进入按钮；副标题不得超过15个字，图上不生成任何额外文字、包括风格名、品牌名、logo、水印、二维码、角标、色值、尺寸标记、伪文字或无关宣传语都不允许生成。封面图中的主标题、副标题、按钮造型和按钮文字是最终可见内容，必须保留。HTML 不得在这张封面图上再次叠加可见标题、副标题、按钮、按钮文字或底座；只配置覆盖封面的透明点击层，点击封面任意位置进入原课件。这里禁止的是 HTML 重复叠加，不是禁止图片生成标题或按钮。\n2）主标题、副标题和按钮文案都是可变元素，必须根据当前课件真实内容替换；若为英语课件则尽量用英文，若非英语课件则一律用中文。标题、短副标题和进入按钮需要沿同一视觉主轴组织，层级清楚、可读性强，适合课堂投屏。\n3）本视觉风格封面的生图提示词：\n温暖秋日果园儿童封面，2.5D绘本卡通质感，阳光从左上角照入，橘子树、绿叶、木栅栏、果篮、草地和水果装饰构成明亮果园场景。左侧或下方放可爱小朋友或水果学习伙伴，右侧可根据课件主题放水果、分类卡、篮子或季节认知道具。画面中心上方生成橙黄奶油质感大标题“{标题内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，标题像果酱字或软糖字，带白描边和水果叶片点缀。标题下方生成木牌或浅橙丝带副标题“{副标题内容根据课件真实内容填充，副标题不超过15个字，若为英语课件则尽量用英文，若非英文课件则一律用中文}”。中下方生成橙黄色圆角按钮，按钮文字为“{进入学习，按钮内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，按钮带柔和高光、白描边和小叶子。\n\n4）封面接入顺序：先根据真实课件确认主标题、短副标题和进入文案，再依照上面的原版美术描述生成一张完整封面图；将它完整适配课件舞台，不裁掉文字、角色或按钮，也不把整张封面当作中间的小插图套进另一张封面。仅在封面容器内移除或隐藏源 HTML 的标题、副标题、示例插画和可见开始按钮，清理伪元素及 CSS 背景中重复的文字/按钮；主互动页的题干、选项、答案、控件和逻辑全部保留。不要因源课件原来使用 HTML 标题而继续保留第二套可见封面。\n5）透明点击层只承接进入事件，不绘制文字、图标、背景、边框、阴影或底座；可保留不可见的无障碍名称和键盘进入能力，不能将整张封面图设成透明。一次完整点击/触控只进入一次，不在 pointerdown 时提前撤掉封面；隔离本次手势，禁止继续触发下一页答案、拖拽或提交。进入第一题时仍为未作答状态。\n6）交付前同时核对封面原图与浏览器实际首屏：图中艺术标题、短副标题和设计按钮齐全且各一套，浏览器没有额外的可见 DOM/CSS 文字或按钮，点击任意位置可进入第一题。若有重复，修正 HTML 接入层；若图中文字错误，单独修正封面素材。不得用删掉艺术字、角色、按钮设计，换成空场景，或直接跳过封面的办法通过去重检查。\n\n", "3. 背景图规范与生图提示词逻辑\n1）背景图只用于提供风格氛围，不强行生成题目承载区域。题目白板、任务板、卡片、槽位、按钮和状态栏应由 HTML/CSS/JS 根据当前课件内容绘制，并覆盖在背景图上。背景图中不要生成框、白板、题板、任务板、玻璃板、卡片、按钮、标题、题目文字、选项文字、数字、字母、汉字、格线、槽位、logo、水印或二维码。\n2）背景图可以参考该风格 bg 图和 cover 图的视觉感觉自由延展，但只保留场景、色彩、材质、角色气质和边缘装饰；画面中心应保持开阔、低干扰，方便前端绘制适配当前题型的题板。\n3）本视觉风格背景图的生图提示词：\n温暖明亮的秋日果园背景，阳光、橘子树、绿叶、木栅栏、果篮、柔和草地和零散水果在四周边缘形成氛围，色调橙黄、奶油白、浅绿。画面中心保持开阔干净的果园光照区域，方便 HTML/CSS/JS 绘制认知题板。不要生成学习卡片、白板、木牌框、按钮、标题、文字、水果标签、logo、水印或二维码。\n\n", "4. 按钮、字体与触控规范\n按钮使用果实胶囊、木牌按钮或奶油色圆角按钮，开始偏橙黄，提交偏清新绿，重置偏温暖黄。字体温暖圆润，适合认知启蒙。\n本课件面向小学低中高年级儿童，所有核心文字和可点击区域必须适合课堂投屏、互动屏和平板触控。题干、核心选项、按钮文字和状态数字要使用明显偏大的字号，普通提示文字也要清楚可读；主按钮、选项卡、拖拽块和槽位要有足够大的触碰面积和间距，儿童手指点击不容易误触。按钮必须有清楚边界、高对比文字、按压反馈和禁用态；不要把关键文字做得过小、过细、过浅或压在复杂纹理上。\n\n", "5. 色彩、材质与装饰密度\n色彩以奶油白、阳光黄、果橙、叶绿、浅木色、天空蓝、浅粉和柔和红为主。\n色彩只作为视觉方向，不在图片中显示任何色号、色卡编号、代码、CSS 文本或设计参数。整体保持明亮、干净、护眼，避免大面积深色、强霓虹、复杂渐变和高压迫背景。装饰密度必须低于学习内容，角色、花草、糖果、气泡、电话线、科技光线或海图道具只放在边缘、角落或低层背景，不得穿过题目、选项、槽位、网格、按钮和反馈区域。\n\n", "6. UI层级与反馈\n底层是风格化背景，只提供氛围；中层是主主题板和内部功能卡片，盖在背景图上，由html/CSS/JS 绘制适合本风格的题板区域，是最高信息承载层；上层是可拖拽对象、选项、按钮、反馈条和当前选中态；弹窗层用于结果、时间到或完成反馈，必须有遮罩或清楚的独立卡片，不能遮挡关键学习内容。\n正确反馈使用绿色叶片描边、果实落篮和小星光；错误反馈使用柔和红橙边框和轻微摇动；选中态使用暖黄描边和卡片上浮。\n所有反馈只强化原交互，不新增新玩法，不改变原题目判断逻辑。\n\n", "7. 音效反馈规范\n音效是 UI 反馈的一部分，必须优先匹配当前风格的专属音效；只用于强化点击、选中、拖拽、落位、提交、答对、答错、提示、完成和重置状态，不改变原课件玩法、题型、节奏和按钮功能。音效需短促、低音量、低干扰，不能循环播放，不能盖过教学语音；需遵守原课件已有静音和音量设置。若没有真实音频素材，可用平台素材库、安全音效或 WebAudio 近似实现，但仍要尽量贴近本风格音效意图。\n本风格音效：点击使用轻快木琴声，拖拽落位使用果实落入篮子的短音，答对使用果实收获铃，答错使用轻轻回弹声。\n\n", "8. 禁止项\n禁止生成无关实体、无关玩法、无关学科内容、伪文字、乱码、品牌名、公司名、水印、二维码、角标、设计参数、色值、代码、CSS 标注、软件界面说明、宣传语和不可编辑的题目内容。禁止遮挡、重绘、扭曲或弱化原题目、题板、格线、槽位、按钮和反馈状态。"], "section2": 3, "blocks": [{"kind": "equal", "old": "2. 封面图规范与生图提示词逻辑\n", "new": "2. 封面图规范与生图提示词逻辑\n"}, {"kind": "insert", "old": "", "new": "【本节适用范围】第2节是完整封面设计，第3节是进入后的主互动页背景，两者必须分别生成、分别使用。封面继续执行本节第3项的原有美术描述，包括艺术字、角色、场景、材质、副标题载体和按钮设计；不得把它改成“空背景＋普通HTML标题按钮”。第3节的无文字、无按钮、中央留白要求，以及第4—6节的题板、标准正文字体、学习区低干扰规则，只约束主互动页，不得用来删减封面。除用户在本次调整中明确要求不要封面外，仍按原版规范生成完整图片式首页。\n\n", "change": 0, "left": [], "right": [{"text": "【本节适用范围】第2节是完整封面设计，第3节是进入后的主互动页背景，两者必须分别生成、分别使用。封面继续执行本节第3项的原有美术描述，包括艺术字、角色、场景、材质、副标题载体和按钮设计；不得把它改成“空背景＋普通HTML标题按钮”。第3节的无文字、无按钮、中央留白要求，以及第4—6节的题板、标准正文字体、学习区低干扰规则，只约束主互动页，不得用来删减封面。除用户在本次调整中明确要求不要封面外，仍按原版规范生成完整图片式首页。\n\n", "changed": true}]}, {"kind": "replace", "old": "1）封面图用于儿童互动课件首页。封面图本身必须生成主标题、副标题和进入按钮；副标题不得超过15个字，图上不生成任何额外文字、包括风格名、品牌名、logo、水印、二维码、角标、色值、尺寸标记、伪文字或无关宣传语都不允许生成。逻辑上，从封面图任意位置点击即可进入，禁止在封面图上再生成任何文字/按钮，只需要配置点击事件。\n", "new": "1）封面图用于儿童互动课件首页。封面图本身必须生成主标题、副标题和进入按钮；副标题不得超过15个字，图上不生成任何额外文字、包括风格名、品牌名、logo、水印、二维码、角标、色值、尺寸标记、伪文字或无关宣传语都不允许生成。封面图中的主标题、副标题、按钮造型和按钮文字是最终可见内容，必须保留。HTML 不得在这张封面图上再次叠加可见标题、副标题、按钮、按钮文字或底座；只配置覆盖封面的透明点击层，点击封面任意位置进入原课件。这里禁止的是 HTML 重复叠加，不是禁止图片生成标题或按钮。\n", "change": 1, "left": [{"text": "1）封面图用于儿童互动课件首页。封面图本身必须生成主标题、副标题和进入按钮；副标题不得超过15个字，图上不生成任何额外文字、包括风格名、品牌名、logo、水印、二维码、角标、色值、尺寸标记、伪文字或无关宣传语都不允许生成。", "changed": false}, {"text": "逻辑上，从封面图任意位置点击即可进入，禁止在封面图上再生成任何文字/按钮，只需要配置点击事件。\n", "changed": true}], "right": [{"text": "1）封面图用于儿童互动课件首页。封面图本身必须生成主标题、副标题和进入按钮；副标题不得超过15个字，图上不生成任何额外文字、包括风格名、品牌名、logo、水印、二维码、角标、色值、尺寸标记、伪文字或无关宣传语都不允许生成。", "changed": false}, {"text": "封面图中的主标题、副标题、按钮造型和按钮文字是最终可见内容，必须保留。HTML 不得在这张封面图上再次叠加可见标题、副标题、按钮、按钮文字或底座；只配置覆盖封面的透明点击层，点击封面任意位置进入原课件。这里禁止的是 HTML 重复叠加，不是禁止图片生成标题或按钮。\n", "changed": true}]}, {"kind": "equal", "old": "2）主标题、副标题和按钮文案都是可变元素，必须根据当前课件真实内容替换；若为英语课件则尽量用英文，若非英语课件则一律用中文。标题、短副标题和进入按钮需要沿同一视觉主轴组织，层级清楚、可读性强，适合课堂投屏。\n3）本视觉风格封面的生图提示词：\n温暖秋日果园儿童封面，2.5D绘本卡通质感，阳光从左上 ht": [{"text": "6）交付前同时核对封面原图与浏览器实际首屏：图中艺术标题、短副标题和设计按钮齐全且各一套，浏览器没有额外的可见 DOM/CSS 文字或按钮，点击任意位置可进入第一题。若有重复，修正 HTML 接入层；若图中文字错误，单独修正封面素材。不得用删掉艺术字、角色、按钮设计，换成空场景，或直接跳过封面的办法通过去重检查。\n\n", "changed": true}]}], "delta": 825}, {"styleCode": "forest", "displayName": "森林冒险风", "caseId": "S13", "promptText": "请严格使用下述画面风格、布局、UI规范来重新生成课件：\n\n0. 原课件保留规则\n本风格只用于 UI 视觉换肤，不得改变原课件的学科、题型、题目内容、答案、素材数量、槽位数量、组件数量、布局关系、按钮功能、计分逻辑和交互流程。原来是英语看图拼词、填空、拖拽、选择、分类、连线、逻辑推理或其他玩法，换风格后仍保持原玩法和原题目结构。主互动题页中的题干、选项、答案、字母、汉字、拼音、数字、公式、倒计时、得分、按钮文案、反馈文案和关卡信息等可变教学内容，必须由 HTML/CSS/JS 渲染，不要烘焙进背景图或题板底图。\n\n1. 整体视觉与布局\n风格识别锚点：第一眼应像圆润粘土森林冒险课。使用哑光粘土质感的森林草地、圆润树墩、灌木、木箱、小花、边缘小动物角色和中央米白软边任务板；所有物体圆角膨胀、无硬边，自然治愈，有探险感但不新增地图闯关玩法。\n采用柔和森林背景和中央木质或卷轴任务板。画面可以有树叶、藤蔓、木牌、脚印、宝箱、路径和小动物陪伴，但冒险感只作为边缘氛围，不新增地图闯关玩法。整体明亮、温和、有任务感，不能阴暗、杂乱或像完整插画海报。\n使用横版课件画布，画布主体集中在中央学习区，四周保留安全边距。顶部保留原课件已有标题、关卡、进度、奖励、倒计时或得分信息；中央按原课件布局放置题目、图片区、网格、线索、选项、素材池、槽位或操作区；底部或右侧保留原有按钮和工具按钮。背景只提供氛围，不承担学习信息。\n\n2. 封面图规范与生图提示词逻辑\n【本节适用范围】第2节是完整封面设计，第3节是进入后的主互动页背景，两者必须分别生成、分别使用。封面继续执行本节第3项的原有美术描述，包括艺术字、角色、场景、材质、副标题载体和按钮设计；不得把它改成“空背景＋普通HTML标题按钮”。第3节的无文字、无按钮、中央留白要求，以及第4—6节的题板、标准正文字体、学习区低干扰规则，只约束主互动页，不得用来删减封面。除用户在本次调整中明确要求不要封面外，仍按原版规范生成完整图片式首页。\n\n1）封面图用于儿童互动课件首页。封面图本身必须生成主标题、副标题和进入按钮；副标题不得超过15个字，图上不生成任何额外文字、包括风格名、品牌名、logo、水印、二维码、角标、色值、尺寸标记、伪文字或无关宣传语都不允许生成。封面图中的主标题、副标题、按钮造型和按钮文字是最终可见内容，必须保留。HTML 不得在这张封面图上再次叠加可见标题、副标题、按钮、按钮文字或底座；只配置覆盖封面的透明点击层，点击封面任意位置进入原课件。这里禁止的是 HTML 重复叠加，不是禁止图片生成标题或按钮。\n2）主标题、副标题和按钮文案都是可变元素，必须根据当前课件真实内容替换；若为英语课件则尽量用英文，若非英语课件则一律用中文。标题、短副标题和进入按钮需要沿同一视觉主轴组织，层级清楚、可读性强，适合课堂投屏。\n3）本视觉风格封面的生图提示词：\n3D粘土哑光森林冒险封面，圆润无硬边，绿色森林、草地、树屋、木箱、路牌、小瀑布和柔和阳光构成自然场景。画面两侧放可爱动物伙伴，如小狮子、小熊、小兔或探险小伙伴，边缘有木箱、树墩和小花。画面上方生成木牌质感或奶油木纹大标题“{标题内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，标题厚实圆润、白色描边、带树叶和小花装饰。标题下方生成短副标题“{副标题内容根据课件真实内容填充，副标题不超过15个字，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，放在小木牌或浅色丝带中。中下方生成橙黄或木质圆角按钮，按钮文字为“{进入学习，按钮内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，按钮带柔和阴影和小箭头。\n\n4）封面接入顺序：先根据真实课件确认主标题、短副标题和进入文案，再依照上面的原版美术描述生成一张完整封面图；将它完整适配课件舞台，不裁掉文字、角色或按钮，也不把整张封面当作中间的小插图套进另一张封面。仅在封面容器内移除或隐藏源 HTML 的标题、副标题、示例插画和可见开始按钮，清理伪元素及 CSS 背景中重复的文字/按钮；主互动页的题干、选项、答案、控件和逻辑全部保留。不要因源课件原来使用 HTML 标题而继续保留第二套可见封面。\n5）透明点击层只承接进入事件，不绘制文字、图标、背景、边框、阴影或底座；可保留不可见的无障碍名称和键盘进入能力，不能将整张封面图设成透明。一次完整点击/触控只进入一次，不在 pointerdown 时提前撤掉封面；隔离本次手势，禁止继续触发下一页答案、拖拽或提交。进入第一题时仍为未作答状态。\n6）交付前同时核对封面原图与浏览器实际首屏：图中艺术标题、短副标题和设计按钮齐全且各一套，浏览器没有额外的可见 DOM/CSS 文字或按钮，点击任意位置可进入第一题。若有重复，修正 HTML 接入层；若图中文字错误，单独修正封面素材。不得用删掉艺术字、角色、按钮设计，换成空场景，或直接跳过封面的办法通过去重检查。\n\n3. 背景图规范与生图提示词逻辑\n1）背景图只用于提供风格氛围，不强行生成题目承载区域。题目白板、任务板、卡片、槽位、按钮和状态栏由 HTML/CSS/JS 根据当前课件内容绘制，并覆盖在背景图上。背景图中不要生成框、白板、题板、任务板、玻璃板、卡片、按钮、标题、题目文字、选项文字、数字、字母、汉字、格线、槽位、logo、水印或二维码。\n2）背景图可以参考该风格 bg 图和 cover 图的视觉感觉自由延展，但只保留场景、色彩、材质、角色气质和边缘装饰；画面中心应保持开阔、低干扰，方便前端绘制适配当前题型的题板。\n3）本视觉风格背景图的生图提示词：\n3D粘土哑光森林草地背景，圆润树木、树屋、灌木、木箱、树墩、小花、小瀑布和可爱动物角色靠边放置，整体自然治愈、低龄友好。画面中心保留开阔的浅绿草地和柔和光照区域，方便 HTML/CSS/JS 绘制冒险任务题板。不要生成木质任务板、卷轴框、白板、按钮、标题、文字、路牌文字、logo、水印或二维码。\n\n4. 按钮、字体与触控规范\n按钮使用木牌、叶片胶囊或卷轴圆角按钮，开始偏暖黄或浅绿，提交偏森林绿，重置偏木色。字体可有轻冒险感，但正文和题干必须标准易读。\n本课件面向小学低中高年级儿童，所有核心文字和可点击区域必须适合课堂投屏、互动屏和平板触控。题干、核心选项、按钮文字和状态数字要使用明显偏大的字号，普通提示文字也要清楚可读；主按钮、选项卡、拖拽块和槽位要有足够大的触碰面积和间距，儿童手指点击不容易误触。按钮必须有清楚边界、高对比文字、按压反馈和禁用态；不要把关键文字做得过小、过细、过浅或压在复杂纹理上。\n\n5. 色彩、材质与装饰密度\n色彩以奶油白、浅木色、森林绿、叶绿、暖黄、天空蓝、苔藓绿和柔和红为主。\n色彩只作为视觉方向，不在图片中显示任何色号、色卡编号、代码、CSS 文本或设计参数。整体保持明亮、干净、护眼，避免大面积深色、强霓虹、复杂渐变和高压迫背景。装饰密度必须低于学习内容，角色、花草、糖果、气泡、电话线、科技光线或海图道具只放在边缘、角落或低层背景，不得穿过题目、选项、槽位、网格、按钮和反馈区域。\n\n6. UI层级与反馈\n底层是风格化背景，只提供氛围；中层是主主题板和内部功能卡片，盖在背景图上，由html/CSS/JS 绘制适合本风格的题板区域，是最高信息承载层；上层是可拖拽对象、选项、按钮、反馈条和当前选中态；弹窗层用于结果、时间到或完成反馈，必须有遮罩或清楚的独立卡片，不能遮挡关键学习内容。\n正确反馈使用叶片闪光、路径点亮和绿色描边；错误反馈使用柔和红边框；选中态使用木牌高亮或叶片光圈。\n所有反馈只强化原交互，不新增新玩法，不改变原题目判断逻辑。\n\n7. 音效反馈规范\n音效是 UI 反馈的一部分，必须优先匹配当前风格的专属音效；只用于强化点击、选中、拖拽、落位、提交、答对、答错、提示、完成和重置状态，不改变原课件玩法、题型、节奏和按钮功能。音效需短促、低音量、低干扰，不能循环播放，不能盖过教学语音；需遵守原课件已有静音和音量设置。若没有真实音频素材，可用平台素材库、安全音效或 WebAudio 近似实现，但仍要尽量贴近本风格音效意图。\n本风格音效：点击使用木牌轻敲声，选中使用树叶轻响，提示使用脚步任务提示，完成使用柔和任务铃。\n\n8. 禁止项\n禁止生成无关实体、无关玩法、无关学科内容、伪文字、乱码、品牌名、公司名、水印、二维码、角标、设计参数、色值、代码、CSS 标注、软件界面说明、宣传语和不可编辑的题目内容。禁止遮挡、重绘、扭曲或弱化原题目、题板、格线、槽位、按钮和反馈状态。", "basePromptSHA256": "7c91014d5d1b018cab12cf535b309dc4533bef9eb47bac6165ebffc22f23bff4", "promptSHA256": "00e38e40390c2bf3fbc0948375991e2c1557c73cb838d0776788d619df4f12b4", "status": "候选待生成验证", "changeScope": "仅第2节：图片封面与HTML职责分离；原有封面美术描述逐字保留", "kind": "base", "old": "请严格使用下述画面风格、布局、UI规范来重新生成课件：\n\n0. 原课件保留规则\n本风格只用于 UI 视觉换肤，不得改变原课件的学科、题型、题目内容、答案、素材数量、槽位数量、组件数量、布局关系、按钮功能、计分逻辑和交互流程。原来是英语看图拼词、填空、拖拽、选择、分类、连线、逻辑推理或其他玩法，换风格后仍保持原玩法和原题目结构。主互动题页中的题干、选项、答案、字母、汉字、拼音、数字、公式、倒计时、得分、按钮文案、反馈文案和关卡信息等可变教学内容，必须由 HTML/CSS/JS 渲染，不要烘焙进背景图或题板底图。\n\n1. 整体视觉与布局\n风格识别锚点：第一眼应像圆润粘土森林冒险课。使用哑光粘土质感的森林草地、圆润树墩、灌木、木箱、小花、边缘小动物角色和中央米白软边任务板；所有物体圆角膨胀、无硬边，自然治愈，有探险感但不新增地图闯关玩法。\n采用柔和森林背景和中央木质或卷轴任务板。画面可以有树叶、藤蔓、木牌、脚印、宝箱、路径和小动物陪伴，但冒险感只作为边缘氛围，不新增地图闯关玩法。整体明亮、温和、有任务感，不能阴暗、杂乱或像完整插画海报。\n使用横版课件画布，画布主体集中在中央学习区，四周保留安全边距。顶部保留原课件已有标题、关卡、进度、奖励、倒计时或得分信息；中央按原课件布局放置题目、图片区、网格、线索、选项、素材池、槽位或操作区；底部或右侧保留原有按钮和工具按钮。背景只提供氛围，不承担学习信息。\n\n2. 封面图规范与生图提示词逻辑\n1）封面图用于儿童互动课件首页。封面图本身必须生成主标题、副标题和进入按钮；副标题不得超过15个字，图上不生成任何额外文字、包括风格名、品牌名、logo、水印、二维码、角标、色值、尺寸标记、伪文字或无关宣传语都不允许生成。逻辑上，从封面图任意位置点击即可进入，禁止在封面图上再生成任何文字/按钮，只需要配置点击事件。\n2）主标题、副标题和按钮文案都是可变元素，必须根据当前课件真实内容替换；若为英语课件则尽量用英文，若非英语课件则一律用中文。标题、短副标题和进入按钮需要沿同一视觉主轴组织，层级清楚、可读性强，适合课堂投屏。\n3）本视觉风格封面的生图提示词：\n3D粘土哑光森林冒险封面，圆润无硬边，绿色森林、草地、树屋、木箱、路牌、小瀑布和柔和阳光构成自然场景。画面两侧放可爱动物伙伴，如小狮子、小熊、小兔或探险小伙伴，边缘有木箱、树墩和小花。画面上方生成木牌质感或奶油木纹大标题“{标题内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，标题厚实圆润、白色描边、带树叶和小花装饰。标题下方生成短副标题“{副标题内容根据课件真实内容填充，副标题不超过15个字，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，放在小木牌或浅色丝带中。中下方生成橙黄或木质圆角按钮，按钮文字为“{进入学习，按钮内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，按钮带柔和阴影和小箭头。\n\n3. 背景图规范与生图提示词逻辑\n1）背景图只用于提供风格氛围，不强行生成题目承载区域。题目白板、任务板、卡片、槽位、按钮和状态栏由 HTML/CSS/JS 根据当前课件内容绘制，并覆盖在背景图上。背景图中不要生成框、白板、题板、任务板、玻璃板、卡片、按钮、标题、题目文字、选项文字、数字、字母、汉字、格线、槽位、logo、水印或二维码。\n2）背景图可以参考该风格 bg 图和 cover 图的视觉感觉自由延展，但只保留场景、色彩、材质、角色气质和边缘装饰；画面中心应保持开阔、低干扰，方便前端绘制适配当前题型的题板。\n3）本视觉风格背景图的生图提示词：\n3D粘土哑光森林草地背景，圆润树木、树屋、灌木、木箱、树墩、小花、小瀑布和可爱动物角色靠边放置，整体自然治愈、低龄友好。画面中心保留开阔的浅绿草地和柔和光照区域，方便 HTML/CSS/JS 绘制冒险任务题板。不要生成木质任务板、卷轴框、白板、按钮、标题、文字、路牌文字、logo、水印或二维码。\n\n4. 按钮、字体与触控规范\n按钮使用木牌、叶片胶囊或卷轴圆角按钮，开始偏暖黄或浅绿，提交偏森林绿，重置偏木色。字体可有轻冒险感，但正文和题干必须标准易读。\n本课件面向小学低中高年级儿童，所有核心文字和可点击区域必须适合课堂投屏、互动屏和平板触控。题干、核心选项、按钮文字和状态数字要使用明显偏大的字号，普通提示文字也要清楚可读；主按钮、选项卡、拖拽块和槽位要有足够大的触碰面积和间距，儿童手指点击不容易误触。按钮必须有清楚边界、高对比文字、按压反馈和禁用态；不要把关键文字做得过小、过细、过浅或压在复杂纹理上。\n\n5. 色彩、材质与装饰密度\n色彩以奶油白、浅木色、森林绿、叶绿、暖黄、天空蓝、苔藓绿和柔和红为主。\n色彩只作为视觉方向，不在图片中显示任何色号、色卡编号、代码、CSS 文本或设计参数。整体保持明亮、干净、护眼，避免大面积深色、强霓虹、复杂渐变和高压迫背景。装饰密度必须低于学习内容，角色、花草、糖果、气泡、电话线、科技光线或海图道具只放在边缘、角落或低层背景，不得穿过题目、选项、槽位、网格、按钮和反馈区域。\n\n6. UI层级与反馈\n底层是风格化背景，只提供氛围；中层是主主题板和内部功能卡片，盖在背景图上，由html/CSS/JS 绘制适合本风格的题板区域，是最高信息承载层；上层是可拖拽对象、选项、按钮、反馈条和当前选中态；弹窗层用于结果、时间到或完成反馈，必须有遮罩或清楚的独立卡片，不能遮挡关键学习内容。\n正确反馈使用叶片闪光、路径点亮和绿色描边；错误反馈使用柔和红边框；选中态使用木牌高亮或叶片光圈。\n所有反馈只强化原交互，不新增新玩法，不改变原题目判断逻辑。\n\n7. 音效反馈规范\n音效是 UI 反馈的一部分，必须优先匹配当前风格的专属音效；只用于强化点击、选中、拖拽、落位、提交、答对、答错、提示、完成和重置状态，不改变原课件玩法、题型、节奏和按钮功能。音效需短促、低音量、低干扰，不能循环播放，不能盖过教学语音；需遵守原课件已有静音和音量设置。若没有真实音频素材，可用平台素材库、安全音效或 WebAudio 近似实现，但仍要尽量贴近本风格音效意图。\n本风格音效：点击使用木牌轻敲声，选中使用树叶轻响，提示使用脚步任务提示，完成使用柔和任务铃。\n\n8. 禁止项\n禁止生成无关实体、无关玩法、无关学科内容、伪文字、乱码、品牌名、公司名、水印、二维码、角标、设计参数、色值、代码、CSS 标注、软件界面说明、宣传语和不可编辑的题目内容。禁止遮挡、重绘、扭曲或弱化原题目、题板、格线、槽位、按钮和反馈状态。", "new": "请严格使用下述画面风格、布局、UI规范来重新生成课件：\n\n0. 原课件保留规则\n本风格只用于 UI 视觉换肤，不得改变原课件的学科、题型、题目内容、答案、素材数量、槽位数量、组件数量、布局关系、按钮功能、计分逻辑和交互流程。原来是英语看图拼词、填空、拖拽、选择、分类、连线、逻辑推理或其他玩法，换风格后仍保持原玩法和原题目结构。主互动题页中的题干、选项、答案、字母、汉字、拼音、数字、公式、倒计时、得分、按钮文案、反馈文案和关卡信息等可变教学内容，必须由 HTML/CSS/JS 渲染，不要烘焙进背景图或题板底图。\n\n1. 整体视觉与布局\n风格识别锚点：第一眼应像圆润粘土森林冒险课。使用哑光粘土质感的森林草地、圆润树墩、灌木、木箱、小花、边缘小动物角色和中央米白软边任务板；所有物体圆角膨胀、无硬边，自然治愈，有探险感但不新增地图闯关玩法。\n采用柔和森林背景和中央木质或卷轴任务板。画面可以有树叶、藤蔓、木牌、脚印、宝箱、路径和小动物陪伴，但冒险感只作为边缘氛围，不新增地图闯关玩法。整体明亮、温和、有任务感，不能阴暗、杂乱或像完整插画海报。\n使用横版课件画布，画布主体集中在中央学习区，四周保留安全边距。顶部保留原课件已有标题、关卡、进度、奖励、倒计时或得分信息；中央按原课件布局放置题目、图片区、网格、线索、选项、素材池、槽位或操作区；底部或右侧保留原有按钮和工具按钮。背景只提供氛围，不承担学习信息。\n\n2. 封面图规范与生图提示词逻辑\n【本节适用范围】第2节是完整封面设计，第3节是进入后的主互动页背景，两者必须分别生成、分别使用。封面继续执行本节第3项的原有美术描述，包括艺术字、角色、场景、材质、副标题载体和按钮设计；不得把它改成“空背景＋普通HTML标题按钮”。第3节的无文字、无按钮、中央留白要求，以及第4—6节的题板、标准正文字体、学习区低干扰规则，只约束主互动页，不得用来删减封面。除用户在本次调整中明确要求不要封面外，仍按原版规范生成完整图片式首页。\n\n1）封面图用于儿童互动课件首页。封面图本身必须生成主标题、副标题和进入按钮；副标题不得超过15个字，图上不生成任何额外文字、包括风格名、品牌名、logo、水印、二维码、角标、色值、尺寸标记、伪文字或无关宣传语都不允许生成。封面图中的主标题、副标题、按钮造型和按钮文字是最终可见内容，必须保留。HTML 不得在这张封面图上再次叠加可见标题、副标题、按钮、按钮文字或底座；只配置覆盖封面的透明点击层，点击封面任意位置进入原课件。这里禁止的是 HTML 重复叠加，不是禁止图片生成标题或按钮。\n2）主标题、副标题和按钮文案都是可变元素，必须根据当前课件真实内容替换；若为英语课件则尽量用英文，若非英语课件则一律用中文。标题、短副标题和进入按钮需要沿同一视觉主轴组织，层级清楚、可读性强，适合课堂投屏。\n3）本视觉风格封面的生图提示词：\n3D粘土哑光森林冒险封面，圆润无硬边，绿色森林、草地、树屋、木箱、路牌、小瀑布和柔和阳光构成自然场景。画面两侧放可爱动物伙伴，如小狮子、小熊、小兔或探险小伙伴，边缘有木箱、树墩和小花。画面上方生成木牌质感或奶油木纹大标题“{标题内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，标题厚实圆润、白色描边、带树叶和小花装饰。标题下方生成短副标题“{副标题内容根据课件真实内容填充，副标题不超过15个字，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，放在小木牌或浅色丝带中。中下方生成橙黄或木质圆角按钮，按钮文字为“{进入学习，按钮内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，按钮带柔和阴影和小箭头。\n\n4）封面接入顺序：先根据真实课件确认主标题、短副标题和进入文案，再依照上面的原版美术描述生成一张完整封面图；将它完整适配课件舞台，不裁掉文字、角色或按钮，也不把整张封面当作中间的小插图套进另一张封面。仅在封面容器内移除或隐藏源 HTML 的标题、副标题、示例插画和可见开始按钮，清理伪元素及 CSS 背景中重复的文字/按钮；主互动页的题干、选项、答案、控件和逻辑全部保留。不要因源课件原来使用 HTML 标题而继续保留第二套可见封面。\n5）透明点击层只承接进入事件，不绘制文字、图标、背景、边框、阴影或底座；可保留不可见的无障碍名称和键盘进入能力，不能将整张封面图设成透明。一次完整点击/触控只进入一次，不在 pointerdown 时提前撤掉封面；隔离本次手势，禁止继续触发下一页答案、拖拽或提交。进入第一题时仍为未作答状态。\n6）交付前同时核对封面原图与浏览器实际首屏：图中艺术标题、短副标题和设计按钮齐全且各一套，浏览器没有额外的可见 DOM/CSS 文字或按钮，点击任意位置可进入第一题。若有重复，修正 HTML 接入层；若图中文字错误，单独修正封面素材。不得用删掉艺术字、角色、按钮设计，换成空场景，或直接跳过封面的办法通过去重检查。\n\n3. 背景图规范与生图提示词逻辑\n1）背景图只用于提供风格氛围，不强行生成题目承载区域。题目白板、任务板、卡片、槽位、按钮和状态栏由 HTML/CSS/JS 根据当前课件内容绘制，并覆盖在背景图上。背景图中不要生成框、白板、题板、任务板、玻璃板、卡片、按钮、标题、题目文字、选项文字、数字、字母、汉字、格线、槽位、logo、水印或二维码。\n2）背景图可以参考该风格 bg 图和 cover 图的视觉感觉自由延展，但只保留场景、色彩、材质、角色气质和边缘装饰；画面中心应保持开阔、低干扰，方便前端绘制适配当前题型的题板。\n3）本视觉风格背景图的生图提示词：\n3D粘土哑光森林草地背景，圆润树木、树屋、灌木、木箱、树墩、小花、小瀑布和可爱动物角色靠边放置，整体自然治愈、低龄友好。画面中心保留开阔的浅绿草地和柔和光照区域，方便 HTML/CSS/JS 绘制冒险任务题板。不要生成木质任务板、卷轴框、白板、按钮、标题、文字、路牌文字、logo、水印或二维码。\n\n4. 按钮、字体与触控规范\n按钮使用木牌、叶片胶囊或卷轴圆角按钮，开始偏暖黄或浅绿，提交偏森林绿，重置偏木色。字体可有轻冒险感，但正文和题干必须标准易读。\n本课件面向小学低中高年级儿童，所有核心文字和可点击区域必须适合课堂投屏、互动屏和平板触控。题干、核心选项、按钮文字和状态数字要使用明显偏大的字号，普通提示文字也要清楚可读；主按钮、选项卡、拖拽块和槽位要有足够大的触碰面积和间距，儿童手指点击不容易误触。按钮必须有清楚边界、高对比文字、按压反馈和禁用态；不要把关键文字做得过小、过细、过浅或压在复杂纹理上。\n\n5. 色彩、材质与装饰密度\n色彩以奶油白、浅木色、森林绿、叶绿、暖黄、天空蓝、苔藓绿和柔和红为主。\n色彩只作为视觉方向，不在图片中显示任何色号、色卡编号、代码、CSS 文本或设计参数。整体保持明亮、干净、护眼，避免大面积深色、强霓虹、复杂渐变和高压迫背景。装饰密度必须低于学习内容，角色、花草、糖果、气泡、电话线、科技光线或海图道具只放在边缘、角落或低层背景，不得穿过题目、选项、槽位、网格、按钮和反馈区域。\n\n6. UI层级与反馈\n底层是风格化背景，只提供氛围；中层是主主题板和内部功能卡片，盖在背景图上，由html/CSS/JS 绘制适合本风格的题板区域，是最高信息承载层；上层是可拖拽对象、选项、按钮、反馈条和当前选中态；弹窗层用于结果、时间到或完成反馈，必须有遮罩或清楚的独立卡片，不能遮挡关键学习内容。\n正确反馈使用叶片闪光、路径点亮和绿色描边；错误反馈使用柔和红边框；选中态使用木牌高亮或叶片光圈。\n所有反馈只强化原交互，不新增新玩法，不改变原题目判断逻辑。\n\n7. 音效反馈规范\n音效是 UI 反馈的一部分，必须优先匹配当前风格的专属音效；只用于强化点击、选中、拖拽、落位、提交、答对、答错、提示、完成和重置状态，不改变原课件玩法、题型、节奏和按钮功能。音效需短促、低音量、低干扰，不能循环播放，不能盖过教学语音；需遵守原课件已有静音和音量设置。若没有真实音频素材，可用平台素材库、安全音效或 WebAudio 近似实现，但仍要尽量贴近本风格音效意图。\n本风格音效：点击使用木牌轻敲声，选中使用树叶轻响，提示使用脚步任务提示，完成使用柔和任务铃。\n\n8. 禁止项\n禁止生成无关实体、无关玩法、无关学科内容、伪文字、乱码、品牌名、公司名、水印、二维码、角标、设计参数、色值、代码、CSS 标注、软件界面说明、宣传语和不可编辑的题目内容。禁止遮挡、重绘、扭曲或弱化原题目、题板、格线、槽位、按钮和反馈状态。", "sectionsOld": ["请严格使用下述画面风格、布局、UI规范来重新生成课件：\n\n", "0. 原课件保留规则\n本风格只用于 UI 视觉换肤，不得改变原课件的学科、题型、题目内容、答案、素材数量、槽位数量、组件数量、布局关系、按钮功能、计分逻辑和交互流程。原来是英语看图拼词、填空、拖拽、选择、分类、连线、逻辑推理或其他玩法，换风格后仍保持原玩法和原题目结构。主互动题页中的题干、选项、答案、字母、汉字、拼音、数字、公式、倒计时、得分、按钮文案、反馈文案和关卡信息等可变教学内容，必须由 HTML/CSS/JS 渲染，不要烘焙进背景图或题板底图。\n\n", "1. 整体视觉与布局\n风格识别锚点：第一眼应像圆润粘土森林冒险课。使用哑光粘土质感的森林草地、圆润树墩、灌木、木箱、小花、边缘小动物角色和中央米白软边任务板；所有物体圆角膨胀、无硬边，自然治愈，有探险感但不新增地图闯关玩法。\n采用柔和森林背景和中央木质或卷轴任务板。画面可以有树叶、藤蔓、木牌、脚印、宝箱、路径和小动物陪伴，但冒险感只作为边缘氛围，不新增地图闯关玩法。整体明亮、温和、有任务感，不能阴暗、杂乱或像完整插画海报。\n使用横版课件画布，画布主体集中在中央学习区，四周保留安全边距。顶部保留原课件已有标题、关卡、进度、奖励、倒计时或得分信息；中央按原课件布局放置题目、图片区、网格、线索、选项、素材池、槽位或操作区；底部或右侧保留原有按钮和工具按钮。背景只提供氛围，不承担学习信息。\n\n", "2. 封面图规范与生图提示词逻辑\n1）封面图用于儿童互动课件首页。封面图本身必须生成主标题、副标题和进入按钮；副标题不得超过15个字，图上不生成任何额外文字、包括风格名、品牌名、logo、水印、二维码、角标、色值、尺寸标记、伪文字或无关宣传语都不允许生成。逻辑上，从封面图任意位置点击即可进入，禁止在封面图上再生成任何文字/按钮，只需要配置点击事件。\n2）主标题、副标题和按钮文案都是可变元素，必须根据当前课件真实内容替换；若为英语课件则尽量用英文，若非英语课件则一律用中文。标题、短副标题和进入按钮需要沿同一视觉主轴组织，层级清楚、可读性强，适合课堂投屏。\n3）本视觉风格封面的生图提示词：\n3D粘土哑光森林冒险封面，圆润无硬边，绿色森林、草地、树屋、木箱、路牌、小瀑布和柔和阳光构成自然场景。画面两侧放可爱动物伙伴，如小狮子、小熊、小兔或探险小伙伴，边缘有木箱、树墩和小花。画面上方生成木牌质感或奶油木纹大标题“{标题内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，标题厚实圆润、白色描边、带树叶和小花装饰。标题下方生成短副标题“{副标题内容根据课件真实内容填充，副标题不超过15个字，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，放在小木牌或浅色丝带中。中下方生成橙黄或木质圆角按钮，按钮文字为“{进入学习，按钮内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，按钮带柔和阴影和小箭头。\n\n", "3. 背景图规范与生图提示词逻辑\n1）背景图只用于提供风格氛围，不强行生成题目承载区域。题目白板、任务板、卡片、槽位、按钮和状态栏由 HTML/CSS/JS 根据当前课件内容绘制，并覆盖在背景图上。背景图中不要生成框、白板、题板、任务板、玻璃板、卡片、按钮、标题、题目文字、选项文字、数字、字母、汉字、格线、槽位、logo、水印或二维码。\n2）背景图可以参考该风格 bg 图和 cover 图的视觉感觉自由延展，但只保留场景、色彩、材质、角色气质和边缘装饰；画面中心应保持开阔、低干扰，方便前端绘制适配当前题型的题板。\n3）本视觉风格背景图的生图提示词：\n3D粘土哑光森林草地背景，圆润树木、树屋、灌木、木箱、树墩、小花、小瀑布和可爱动物角色靠边放置，整体自然治愈、低龄友好。画面中心保留开阔的浅绿草地和柔和光照区域，方便 HTML/CSS/JS 绘制冒险任务题板。不要生成木质任务板、卷轴框、白板、按钮、标题、文字、路牌文字、logo、水印或二维码。\n\n", "4. 按钮、字体与触控规范\n按钮使用木牌、叶片胶囊或卷轴圆角按钮，开始偏暖黄或浅绿，提交偏森林绿，重置偏木色。字体可有轻冒险感，但正文和题干必须标准易读。\n本课件面向小学低中高年级儿童，所有核心文字和可点击区域必须适合课堂投屏、互动屏和平板触控。题干、核心选项、按钮文字和状态数字要使用明显偏大的字号，普通提示文字也要清楚可读；主按钮、选项卡、拖拽块和槽位要有足够大的触碰面积和间距，儿童手指点击不容易误触。按钮必须有清楚边界、高对比文字、按压反馈和禁用态；不要把关键文字做得过小、过细、过浅或压在复杂纹理上。\n\n", "5. 色彩、材质与装饰密度\n色彩以奶油白、浅木色、森林绿、叶绿、暖黄、天空蓝、苔藓绿和柔和红为主。\n色彩只作为视觉方向，不在图片中显示任何色号、色卡编号、代码、CSS 文本或设计参数。整体保持明亮、干净、护眼，避免大面积深色、强霓虹、复杂渐变和高压迫背景。装饰密度必须低于学习内容，角色、花草、糖果、气泡、电话线、科技光线或海图道具只放在边缘、角落或低层背景，不得穿过题目、选项、槽位、网格、按钮和反馈区域。\n\n", "6. UI层级与反馈\n底层是风格化背景，只提供氛围；中层是主主题板和内部功能卡片，盖在背景图上，由html/CSS/JS 绘制适合本风格的题板区域，是最高信息承载层；上层是可拖拽对象、选项、按钮、反馈条和当前选中态；弹窗层用于结果、时间到或完成反馈，必须有遮罩或清楚的独立卡片，不能遮挡关键学习内容。\n正确反馈使用叶片闪光、路径点亮和绿色描边；错误反馈使用柔和红边框；选中态使用木牌高亮或叶片光圈。\n所有反馈只强化原交互，不新增新玩法，不改变原题目判断逻辑。\n\n", "7. 音效反馈规范\n音效是 UI 反馈的一部分，必须优先匹配当前风格的专属音效；只用于强化点击、选中、拖拽、落位、提交、答对、答错、提示、完成和重置状态，不改变原课件玩法、题型、节奏和按钮功能。音效需短促、低音量、低干扰，不能循环播放，不能盖过教学语音；需遵守原课件已有静音和音量设置。若没有真实音频素材，可用平台素材库、安全音效或 WebAudio 近似实现，但仍要尽量贴近本风格音效意图。\n本风格音效：点击使用木牌轻敲声，选中使用树叶轻响，提示使用脚步任务提示，完成使用柔和任务铃。\n\n", "8. 禁止项\n禁止生成无关实体、无关玩法、无关学科内容、伪文字、乱码、品牌名、公司名、水印、二维码、角标、设计参数、色值、代码、CSS 标注、软件界面说明、宣传语和不可编辑的题目内容。禁止遮挡、重绘、扭曲或弱化原题目、题板、格线、槽位、按钮和反馈状态。"], "sectionsNew": ["请严格使用下述画面风格、布局、UI规范来重新生成课件：\n\n", "0. 原课件保留规则\n本风格只用于 UI 视觉换肤，不得改变原课件的学科、题型、题目内容、答案、素材数量、槽位数量、组件数量、布局关系、按钮功能、计分逻辑和交互流程。原来是英语看图拼词、填空、拖拽、选择、分类、连线、逻辑推理或其他玩法，换风格后仍保持原玩法和原题目结构。主互动题页中的题干、选项、答案、字母、汉字、拼音、数字、公式、倒计时、得分、按钮文案、反馈文案和关卡信息等可变教学内容，必须由 HTML/CSS/JS 渲染，不要烘焙进背景图或题板底图。\n\n", "1. 整体视觉与布局\n风格识别锚点：第一眼应像圆润粘土森林冒险课。使用哑光粘土质感的森林草地、圆润树墩、灌木、木箱、小花、边缘小动物角色和中央米白软边任务板；所有物体圆角膨胀、无硬边，自然治愈，有探险感但不新增地图闯关玩法。\n采用柔和森林背景和中央木质或卷轴任务板。画面可以有树叶、藤蔓、木牌、脚印、宝箱、路径和小动物陪伴，但冒险感只作为边缘氛围，不新增地图闯关玩法。整体明亮、温和、有任务感，不能阴暗、杂乱或像完整插画海报。\n使用横版课件画布，画布主体集中在中央学习区，四周保留安全边距。顶部保留原课件已有标题、关卡、进度、奖励、倒计时或得分信息；中央按原课件布局放置题目、图片区、网格、线索、选项、素材池、槽位或操作区；底部或右侧保留原有按钮和工具按钮。背景只提供氛围，不承担学习信息。\n\n", "2. 封面图规范与生图提示词逻辑\n【本节适用范围】第2节是完整封面设计，第3节是进入后的主互动页背景，两者必须分别生成、分别使用。封面继续执行本节第3项的原有美术描述，包括艺术字、角色、场景、材质、副标题载体和按钮设计；不得把它改成“空背景＋普通HTML标题按钮”。第3节的无文字、无按钮、中央留白要求，以及第4—6节的题板、标准正文字体、学习区低干扰规则，只约束主互动页，不得用来删减封面。除用户在本次调整中明确要求不要封面外，仍按原版规范生成完整图片式首页。\n\n1）封面图用于儿童互动课件首页。封面图本身必须生成主标题、副标题和进入按钮；副标题不得超过15个字，图上不生成任何额外文字、包括风格名、品牌名、logo、水印、二维码、角标、色值、尺寸标记、伪文字或无关宣传语都不允许生成。封面图中的主标题、副标题、按钮造型和按钮文字是最终可见内容，必须保留。HTML 不得在这张封面图上再次叠加可见标题、副标题、按钮、按钮文字或底座；只配置覆盖封面的透明点击层，点击封面任意位置进入原课件。这里禁止的是 HTML 重复叠加，不是禁止图片生成标题或按钮。\n2）主标题、副标题和按钮文案都是可变元素，必须根据当前课件真实内容替换；若为英语课件则尽量用英文，若非英语课件则一律用中文。标题、短副标题和进入按钮需要沿同一视觉主轴组织，层级清楚、可读性强，适合课堂投屏。\n3）本视觉风格封面的生图提示词：\n3D粘土哑光森林冒险封面，圆润无硬边，绿色森林、草地、树屋、木箱、路牌、小瀑布和柔和阳光构成自然场景。画面两侧放可爱动物伙伴，如小狮子、小熊、小兔或探险小伙伴，边缘有木箱、树墩和小花。画面上方生成木牌质感或奶油木纹大标题“{标题内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，标题厚实圆润、白色描边、带树叶和小花装饰。标题下方生成短副标题“{副标题内容根据课件真实内容填充，副标题不超过15个字，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，放在小木牌或浅色丝带中。中下方生成橙黄或木质圆角按钮，按钮文字为“{进入学习，按钮内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，按钮带柔和阴影和小箭头。\n\n4）封面接入顺序：先根据真实课件确认主标题、短副标题和进入文案，再依照上面的原版美术描述生成一张完整封面图；将它完整适配课件舞台，不裁掉文字、角色或按钮，也不把整张封面当作中间的小插图套进另一张封面。仅在封面容器内移除或隐藏源 HTML 的标题、副标题、示例插画和可见开始按钮，清理伪元素及 CSS 背景中重复的文字/按钮；主互动页的题干、选项、答案、控件和逻辑全部保留。不要因源课件原来使用 HTML 标题而继续保留第二套可见封面。\n5）透明点击层只承接进入事件，不绘制文字、图标、背景、边框、阴影或底座；可保留不可见的无障碍名称和键盘进入能力，不能将整张封面图设成透明。一次完整点击/触控只进入一次，不在 pointerdown 时提前撤掉封面；隔离本次手势，禁止继续触发下一页答案、拖拽或提交。进入第一题时仍为未作答状态。\n6）交付前同时核对封面原图与浏览器实际首屏：图中艺术标题、短副标题和设计按钮齐全且各一套，浏览器没有额外的可见 DOM/CSS 文字或按钮，点击任意位置可进入第一题。若有重复，修正 HTML 接入层；若图中文字错误，单独修正封面素材。不得用删掉艺术字、角色、按钮设计，换成空场景，或直接跳过封面的办法通过去重检查。\n\n", "3. 背景图规范与生图提示词逻辑\n1）背景图只用于提供风格氛围，不强行生成题目承载区域。题目白板、任务板、卡片、槽位、按钮和状态栏由 HTML/CSS/JS 根据当前课件内容绘制，并覆盖在背景图上。背景图中不要生成框、白板、题板、任务板、玻璃板、卡片、按钮、标题、题目文字、选项文字、数字、字母、汉字、格线、槽位、logo、水印或二维码。\n2）背景图可以参考该风格 bg 图和 cover 图的视觉感觉自由延展，但只保留场景、色彩、材质、角色气质和边缘装饰；画面中心应保持开阔、低干扰，方便前端绘制适配当前题型的题板。\n3）本视觉风格背景图的生图提示词：\n3D粘土哑光森林草地背景，圆润树木、树屋、灌木、木箱、树墩、小花、小瀑布和可爱动物角色靠边放置，整体自然治愈、低龄友好。画面中心保留开阔的浅绿草地和柔和光照区域，方便 HTML/CSS/JS 绘制冒险任务题板。不要生成木质任务板、卷轴框、白板、按钮、标题、文字、路牌文字、logo、水印或二维码。\n\n", "4. 按钮、字体与触控规范\n按钮使用木牌、叶片胶囊或卷轴圆角按钮，开始偏暖黄或浅绿，提交偏森林绿，重置偏木色。字体可有轻冒险感，但正文和题干必须标准易读。\n本课件面向小学低中高年级儿童，所有核心文字和可点击区域必须适合课堂投屏、互动屏和平板触控。题干、核心选项、按钮文字和状态数字要使用明显偏大的字号，普通提示文字也要清楚可读；主按钮、选项卡、拖拽块和槽位要有足够大的触碰面积和间距，儿童手指点击不容易误触。按钮必须有清楚边界、高对比文字、按压反馈和禁用态；不要把关键文字做得过小、过细、过浅或压在复杂纹理上。\n\n", "5. 色彩、材质与装饰密度\n色彩以奶油白、浅木色、森林绿、叶绿、暖黄、天空蓝、苔藓绿和柔和红为主。\n色彩只作为视觉方向，不在图片中显示任何色号、色卡编号、代码、CSS 文本或设计参数。整体保持明亮、干净、护眼，避免大面积深色、强霓虹、复杂渐变和高压迫背景。装饰密度必须低于学习内容，角色、花草、糖果、气泡、电话线、科技光线或海图道具只放在边缘、角落或低层背景，不得穿过题目、选项、槽位、网格、按钮和反馈区域。\n\n", "6. UI层级与反馈\n底层是风格化背景，只提供氛围；中层是主主题板和内部功能卡片，盖在背景图上，由html/CSS/JS 绘制适合本风格的题板区域，是最高信息承载层；上层是可拖拽对象、选项、按钮、反馈条和当前选中态；弹窗层用于结果、时间到或完成反馈，必须有遮罩或清楚的独立卡片，不能遮挡关键学习内容。\n正确反馈使用叶片闪光、路径点亮和绿色描边；错误反馈使用柔和红边框；选中态使用木牌高亮或叶片光圈。\n所有反馈只强化原交互，不新增新玩法，不改变原题目判断逻辑。\n\n", "7. 音效反馈规范\n音效是 UI 反馈的一部分，必须优先匹配当前风格的专属音效；只用于强化点击、选中、拖拽、落位、提交、答对、答错、提示、完成和重置状态，不改变原课件玩法、题型、节奏和按钮功能。音效需短促、低音量、低干扰，不能循环播放，不能盖过教学语音；需遵守原课件已有静音和音量设置。若没有真实音频素材，可用平台素材库、安全音效或 WebAudio 近似实现，但仍要尽量贴近本风格音效意图。\n本风格音效：点击使用木牌轻敲声，选中使用树叶轻响，提示使用脚步任务提示，完成使用柔和任务铃。\n\n", "8. 禁止项\n禁止生成无关实体、无关玩法、无关学科内容、伪文字、乱码、品牌名、公司名、水印、二维码、角标、设计参数、色值、代码、CSS 标注、软件界面说明、宣传语和不可编辑的题目内容。禁止遮挡、重绘、扭曲或弱化原题目、题板、格线、槽位、按钮和反馈状态。"], "section2": 3, "blocks": [{"kind": "equal", "old": "2. 封面图规范与生图提示词逻辑\n", "new": "2. 封面图规范与生图提示词逻辑\n"}, {"kind": "insert", "old": "", "new": "【本节适用范围】第2节是完整封面设计，第3节是进入后的主互动页背景，两者必须分别生成、分别使用。封面继续执行本节第3项的原有美术描述，包括艺术字、角色、场景、材质、副标题载体和按钮设计；不得把它改成“空背景＋普通HTML标题按钮”。第3节的无文字、无按钮、中央留白要求，以及第4—6节的题板、标准正文字体、学习区低干扰规则，只约束主互动页，不得用来删减封面。除用户在本次调整中明确要求不要封面外，仍按原版规范生成完整图片式首页。\n\n", "change": 0, "left": [], "right": [{"text": "【本节适用范围】第2节是完整封面设计，第3节是进入后的主互动页背景，两者必须分别生成、分别使用。封面继续执行本节第3项的原有美术描述，包括艺术字、角色、场景、材质、副标题载体和按钮设计；不得把它改成“空背景＋普通HTML标题按钮”。第3节的无文字、无按钮、中央留白要求，以及第4—6节的题板、标准正文字体、学习区低干扰规则，只约束主互动页，不得用来删减封面。除用户在本次调整中明确要求不要封面外，仍按原版规范生成完整图片式首页。\n\n", "changed": true}]}, {"kind": "replace", "old": "1）封面图用于儿童互动课件首页。封面图本身必须生成主标题、副标题和进入按钮；副标题不得超过15个字，图上不生成任何额外文字、包括风格名、品牌名、logo、水印、二维码、角标、色值、尺寸标记、伪文字或无关宣传语都不允许生成。逻辑上，从封面图任意位置点击即可进入，禁止在封面图上再生成任何文字/按钮，只需要配置点击事件。\n", "new": "1）封面图用于儿童互动课件首页。封面图本身必须生成主标题、副标题和进入按钮；副标题不得超过15个字，图上不生成任何额外文字、包括风格名、品牌名、logo、水印、二维码、角标、色值、尺 按原版规范生成完整图片式首页。\n\n1）封面图用于儿童互动课件首页。封面图本身必须生成主标题、副标题和进入按钮；副标题不得超过15个字，图上不生成任何额外文字、包括风格名、品牌名、logo、水印、二维码、角标、色值、尺寸标记、伪文字或无关宣传语都不允许生成。封面图中的主标题、副标题、按钮造型和按钮文字是最终可见内容，必须保留。HTML 不得在这张封面图上再次叠加可见标题、副标题、按钮、按钮文字或底座；只配置覆盖封面的透明点击层，点击封面任意位置进入原课件。这里禁止的是 HTML 重复叠加，不是禁止图片生成标题或按钮。\n2）主标题、副标题和按钮文案都是可变元素，必须根据当前课件真实内容替换；若为英语课件则尽量用英文，若非英语课件则一律用中文。标题、短副标题和进入按钮需要沿同一视觉主轴组织，层级清楚、可读性强，适合课堂投屏。\n3）本视觉风格封面的生图提示词：\n3D粘土哑光糖果乐园封面，马卡龙粉、奶油黄、浅紫和薄荷绿配色，背景有糖果城堡、棉花糖云、彩虹桥、棒棒糖、马卡龙、甜甜圈和软糖小路。右侧或下方放可爱兔子、小鸡或糖果学习伙伴，表情软萌。画面中心上方生成奶油糖霜大标题“{标题内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，标题像翻糖蛋糕字，粉白渐变、白描边、带星星和糖霜高光。标题下方生成短副标题“{副标题内容根据课件真实内容填充，副标题不超过15个字，若为英语课件则尽量用英文，若非英文课件则一律用中文}”。中下方生成粉色或蜜桃色果冻胶囊按钮，按钮文字为“{进入游戏，按钮内容根据课件真实内容填充，若为英语课件则尽量用英文，若非英文课件则一律用中文}”，按钮带白描边、糖果高光和小星星。\n\n4）封面接入顺序：先根据真实课件确认主标题、短副标题和进入文案，再依照上面的原版美术描述生成一张完整封面图；将它完整适配课件舞台，不裁掉文字、角色或按钮，也不把整张封面当作中间的小插图套进另一张封面。仅在封面容器内移除或隐藏源 HTML 的标题、副标题、示例插画和可见开始按钮，清理伪元素及 CSS 背景中重复的文字/按钮；主互动页的题干、选项、答案、控件和逻辑全部保留。不要因源课件原来使用 HTML 标题而继续保留第二套可见封面。\n5）透明点击层只承接进入事件，不绘制文字、图标、背景、边框、阴影或底座；可保留不可见的无障碍名称和键盘进入能力，不能将整张封面图设成透明。一次完整点击/触控只进入一次，不在 pointerdown 时提前撤掉封面；隔离本次手势，禁止继续触发下一页答案、拖拽或提交。进入第一题时仍为未作答状态。\n6）交付前同时核对封面原图与浏览器实际首屏：图中艺术标题、短副标题和设计按钮齐全且各一套，浏览器没有额外的可见 DOM/CSS 文字或按钮，点击任意位置可进入第一题。若有重复，修正 HTML 接入层；若图中文字错误，单独修正封面素材。不得用删掉艺术字、角色、按钮设计，换成空场景，或直接跳过封面的办法通过去重检查。\n\n3. 背景图规范与生图提示词逻辑\n1）背景图只用于提供风格氛围，不强行生成题目承载区域。题目白板、任务板、卡片、槽位、按钮和状态栏应由 HTML/CSS/JS 根据当前课件内容绘制，并覆盖在背景图上。背景图中不要生成框、白板、题板、任务板、玻璃板、卡片、按钮、标题、题目文字、选项文字、数字、字母、汉字、格线、槽位、logo、水印或二维码。\n2）背景图可以参考该风格 bg 图和 cover 图的视觉感觉自由延展，但只保留场景、色彩、材质、角色气质和边缘装饰；画面中心应保持开阔、低干扰，方便前端绘制适配当前题型的题板。\n3）本视觉风格背景图的生图提示词：\n3D粘土哑光糖果乐园背景，马卡龙粉、奶油黄、浅紫、薄荷绿，糖果城堡、棉花糖云、彩虹桥、棒棒糖、马卡龙、甜甜圈和软糖装饰放在边缘，整体甜美柔软。画面中心保持开阔的低纹理糖果世界背景，方便 HTML/CSS/JS 绘制题板。不要生成奶油框、任务板、卡片、按钮、标题、文字、糖果标签、logo、水印或二维码。\n\n4. 按钮、字体与触控规范\n按钮使用糖果胶囊、果冻圆角按钮或软糖按钮，带白描边、柔和高光和按压回弹。字体圆润可爱，但字母、数字、题干不能装饰化到难读。\n本课件面向小学低中高年级儿童，所有核心文字和可点击区域必须适合课堂投屏、互动屏和平板触控。题干、核心选项、按钮文字和状态数字要使用明显偏大的字号，普通提示文字也要清楚可读；主按钮、选项卡、拖拽块和槽位要有足够大的触碰面积和间距，儿童手指点击不容易误触。按钮必须有清楚边界、高对比文字、按压反馈和禁用态；不要把关键文字做得过小、过细、过浅或压在复杂纹理上。\n\n5. 色彩、材质与装饰密度\n色彩以奶油白、樱花粉、蜜桃粉、浅紫、薄荷绿、柠檬黄、天空蓝和柔和红为主

<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>主按钮前景色验收</title><link rel="stylesheet" href="css/standard-icon.css"><style>body{margin:0;background:#eff4f3;font:20px/1.6 system-ui;color:#233a35}main{max-width:1280px;margin:32px auto;padding:0 24px}h1{font-size:30px;margin:0}p{margin:10px 0 24px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}section{border:1px solid #d5e1dd;background:white;padding:24px;border-radius:20px}h2{font-size:20px;margin:0 0 30px}.cb-theme{min-height:110px}.light{--cb-accent:#87cefa;--cb-primary-ink:#333333}.old{--cb-accent:#87cefa}.ordinary{--cb-ink:#235269}.cb-text{font-size:28px;min-width:240px}a{color:#076f61}small{display:block;color:#647973;font-size:15px;margin-top:20px}.dark{--cb-accent:#11667a;--cb-primary-ink:#fff}</style><main><h1>主按钮前景色 · 最小修复验收</h1><p>浅色底使用深色文字与图标；没有指定新变量时，主按钮仍默认白色。以下为真实组件展示。</p><div class="grid">
<section><h2>原问题：浅蓝底＋白色</h2><div class="cb-theme old"><button id="old" class="cb cb-text cb-primary"><span>下一题</span><span class="cb-icon cb-icon-next"></span></button></div><small>未指定主按钮前景色</small></section>
<section><h2>修正：浅蓝底＋深色</h2><div class="cb-theme light"><button id="light" class="cb cb-text cb-primary"><span>下一题</span><span class="cb-icon cb-icon-next"></span></button></div><small>--cb-primary-ink: #333333</small></section>
<section><h2>默认主按钮保留白色</h2><div class="cb-theme"><button id="default" class="cb cb-text cb-primary"><span class="cb-icon cb-icon-submit"></span><span>提交答案</span></button></div><small>未指定变量时使用 #fff</small></section>
<section><h2>深色主题</h2><div class="cb-theme dark"><button id="dark" class="cb cb-text cb-primary"><span class="cb-icon cb-icon-retry"></span><span>Try again</span></button></div><small>深色底＋浅色前景</small></section>
<section><h2>普通按钮不受影响</h2><div class="cb-theme ordinary"><button id="ordinary" class="cb cb-text"><span class="cb-icon cb-icon-back"></span><span>上一题</span></button></div><small>继续使用 --cb-ink</small></section>
<section><h2>禁用状态不受影响</h2><div class="cb-theme light"><button id="disabled" class="cb cb-text cb-primary" disabled><span>下一题</span><span class="cb-icon cb-icon-next"></span></button></div><small>沿用组件禁用色</small></section></div><p><a href="delivery.zip">下载含数学验证副本的交付包</a>　<a href="README.md">开发交付说明</a></p></main></html>

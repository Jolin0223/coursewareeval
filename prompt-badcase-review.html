<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>原始 Badcase 定向复测 · 10月27日 V1</title><style>
:root{--ink:#183439;--muted:#657b80;--line:#d8e3e5;--paper:#f3f7f7;--green:#dcf2e9;--accent:#20675d;--amber:#986018}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--paper);font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}button,input,textarea{font:inherit}button,a{touch-action:manipulation}button{cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #4aa995;outline-offset:3px}a{color:var(--accent);text-underline-offset:3px}.shell{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}.side{position:sticky;top:0;height:100vh;background:#183237;color:#ecf6f4;display:flex;flex-direction:column;padding:25px 14px}.brand{font-size:18px;font-weight:750;padding:0 10px}.sub{color:#a6c3c4;font-size:12px;margin:5px 10px 22px}.nav{overflow:auto;flex:1}.group{padding:18px 10px 6px;font-size:11px;letter-spacing:1px;color:#9fc1c1}.case{display:block;width:100%;border:0;background:transparent;color:#dbe8e8;padding:10px 11px;border-radius:6px;text-align:left;margin-bottom:3px}.case.active{background:#d9f0e6;color:#163f39}.case strong{font-size:13px;display:block}.case small{font-size:11px;opacity:.74}.dot{float:right;width:7px;height:7px;border-radius:50%;background:#8aabad;margin-top:7px}.dot.done{background:#62c69f}.dot.failed{background:#de8a73}.dot.blocked{background:#e8ad52}.side-footer{font-size:11px;color:#b9d1d1;padding:16px 10px 0}.top{height:70px;background:#fff;border-bottom:1px solid var(--line);padding:0 28px;display:flex;align-items:center;justify-content:space-between;gap:16px}.top-left{display:flex;gap:18px;align-items:center}.top a{text-decoration:none;font-weight:650;font-size:12px}.top span{font-size:12px;color:var(--muted)}.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:8px 13px;border:1px solid var(--line);background:white;border-radius:6px;color:var(--ink);text-decoration:none;font-weight:650;white-space:nowrap}.btn:hover{border-color:#79a99f}.btn.active,.btn.primary{background:var(--accent);color:white;border-color:var(--accent)}.content{max-width:1680px;margin:auto;padding:26px 28px 50px}.intro{display:flex;justify-content:space-between;gap:24px;align-items:start}.intro h1{font-size:25px;line-height:1.3;margin:0 0 7px;letter-spacing:-.5px}.intro p{color:var(--muted);margin:0}.status{background:#fff;padding:8px 13px;border:1px solid var(--line);border-radius:6px;font-size:12px;white-space:nowrap}.boundary{border-left:3px solid #a7c8bf;background:#eaf2ef;padding:11px 15px;font-size:12px;margin:20px 0;color:#456360}.case-heading{display:flex;justify-content:space-between;align-items:center;margin:24px 0 12px;gap:16px}h2{font-size:21px;margin:0}h3{font-size:14px;margin:0 0 8px}.qid{font-family:monospace;font-size:12px;color:var(--muted);margin-right:8px}.tag{display:inline-block;background:#e4eeec;color:#37655c;border-radius:4px;padding:2px 7px;margin-right:5px;font-size:11px}.query{background:#fff;border:1px solid var(--line);border-radius:8px;padding:16px 20px}.query-label{font-size:11px;color:var(--muted);margin-bottom:7px}.query p{margin:0;white-space:pre-wrap;font-size:15px}.accept{margin-top:12px;padding-top:12px;border-top:1px solid #e8eeee;color:#526c70;font-size:13px}.compare-toolbar{display:flex;align-items:center;justify-content:space-between;margin:22px 0 10px;gap:12px;flex-wrap:wrap}.seg{display:flex;gap:4px;background:#e4ebeb;padding:3px;border-radius:7px}.seg button{font-size:12px;padding:7px 12px;background:none;border:0;color:#526b70;border-radius:5px}.seg button.active{background:white;color:var(--ink);box-shadow:0 1px 3px #18343915}.hint{font-size:11px;color:var(--muted)}.compare{display:grid;grid-template-columns:1fr 1fr;gap:15px}.panel{min-width:0;background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden}.panel-head{display:flex;align-items:center;justify-content:space-between;padding:13px 15px;gap:10px}.panel-title{font-weight:700}.panel-head small{display:block;color:var(--muted);font-size:11px;font-weight:400}.panel-head a{font-size:11px}.viewport{width:100%;aspect-ratio:16/9;background:#e7eeee;position:relative;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}iframe{display:block;border:0;width:100%;height:100%;background:#111}.placeholder{display:grid;place-content:center;height:100%;text-align:center;color:var(--muted);padding:20px}.placeholder strong{font-size:16px;color:#435f63}.meta{padding:10px 15px;font-size:11px;color:var(--muted)}summary{cursor:pointer}dl{display:grid;grid-template-columns:86px minmax(0,1fr);gap:3px;margin:8px 0 0}dt{color:#829397}dd{margin:0;overflow-wrap:anywhere;font-family:monospace}.observations{margin:18px 0;background:#fff;border:1px solid var(--line);border-radius:8px;padding:16px 20px}.obs{margin:8px 0;padding:9px 12px;border-left:3px solid #9caeb1;background:#f4f7f7}.obs.good{border-color:#56a288;background:#edf7f1}.obs.bad{border-color:#c38b42;background:#fff6e9}.obs p{margin:0}.obs small{color:var(--muted)}.screens{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}.screens img{display:block;width:100%;border:1px solid var(--line);border-radius:5px}.screens figcaption{font-size:11px;color:var(--muted);margin-bottom:5px}.screens figure{margin:0}.review{padding:18px 20px;border:1px solid var(--line);border-radius:8px;background:white}.decisions{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}textarea{display:block;width:100%;min-height:80px;border:1px solid var(--line);border-radius:6px;padding:10px;resize:vertical;color:var(--ink)}.review-foot{font-size:11px;color:var(--muted);margin-top:7px}.attachment{font-size:12px;margin:10px 0 0}.empty{padding:60px 20px;text-align:center}.nav-search{width:100%;border:1px solid #567478;background:#264348;color:white;border-radius:5px;padding:8px;margin-bottom:8px}.nav-search::placeholder{color:#b1c5c7}.stats-note{font-size:11px;margin:4px 0 0;color:var(--muted)}.error{color:#a13f2c}.links{display:flex;gap:7px;flex-wrap:wrap}.toast{position:fixed;bottom:20px;right:24px;padding:10px 18px;background:#183439;color:#fff;border-radius:7px;z-index:20}button:disabled{cursor:default;opacity:.5}@media(min-width:1600px){.content{padding:30px 40px}}@media(max-width:1050px){.shell{grid-template-columns:200px minmax(0,1fr)}.content{padding:22px 18px}.compare{grid-template-columns:1fr}.top{padding:0 18px}.intro{display:block}.status{display:inline-block;margin-top:12px}}@media(max-width:680px){.shell{display:block}.side{position:relative;height:auto;padding:16px}.sub,.side-footer{display:none}.nav{display:flex;gap:5px;overflow:auto;margin-top:12px}.group{display:none}.case{min-width:156px;width:auto}.nav-search{display:none}.top{height:auto;min-height:58px;padding:12px;flex-wrap:wrap}.top-left{gap:10px}.content{padding:20px 12px}.intro h1{font-size:22px}.case-heading{display:block}.screens{grid-template-columns:1fr}.compare-toolbar{align-items:start}.query{padding:14px}.top span{display:none}}
.summary-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:16px 0}.summary-card{padding:14px 16px;background:#fff;border:1px solid var(--line);border-radius:8px}.summary-card p{font-size:12px;margin:4px 0 10px;color:var(--muted)}.summary-card a{font-size:12px;margin-right:10px}.source-code{white-space:pre-wrap;overflow-wrap:anywhere;padding:12px;background:#f3f6f6;font:12px/1.6 monospace}.next-steps{font-size:12px;color:var(--muted)}@media(max-width:680px){.summary-grid{grid-template-columns:1fr}.top-actions{flex-wrap:wrap}}</style></head><body><div class="shell"><aside class="side"><div class="brand">↔ 原始案例复测</div><div class="sub">同一份课件 · 同一句修改</div><input id="search" class="nav-search" placeholder="搜索 Query 或问题" aria-label="搜索案例"><nav id="nav" class="nav" aria-label="原始Badcase"></nav><div class="side-footer">原课件保留 · 测试副本独立<br>人工判断保存在当前浏览器</div></aside><div><header class="top"><div class="top-left"><a href="/system-prompt-review">← 提示词改动评审</a><span>AI互动课件 / 定向回归</span></div><div class="links"><a class="btn" href="/#generation-regression">固定测试集</a><button class="btn" id="export">导出对比记录</button></div></header><main class="content"><div class="intro"><div><h1>10月27日 V1 · 原始 Badcase 复测</h1><p>回到提出优化时的真实问题，检查是否修好，以及有没有误改。</p></div><div><div class="status" id="status">正在读取结果…</div><div class="stats-note">生成完成不等于质量通过</div></div></div><div id="boundary" class="boundary"></div><div id="overview-summary"></div><div id="detail" aria-live="polite"><div class="empty">正在载入案例…</div></div></main></div></div><script>
'use strict';let data=null;let selected=new URLSearchParams(location.search).get('case')||'Q98670';let baseline='before';let search='';const STORAGE='courseware-badcase-20261027-v1';let reviews={};try{reviews=JSON.parse(localStorage.getItem(STORAGE)||'{}')}catch{}const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const decisions=['待验证','已修好','部分改善','未修好','改坏了'];
function notify(t){const el=document.createElement('div');el.className='toast';el.textContent=t;document.body.append(el);setTimeout(()=>el.remove(),2200)}
function persist(){try{localStorage.setItem(STORAGE,JSON.stringify(reviews));return true}catch{notify('浏览器保存失败，请导出记录');return false}}
function nav(){const list=data.cases.filter(c=>(c.queryId+c.title+c.category+c.query).toLowerCase().includes(search.toLowerCase()));let previous='';document.getElementById('nav').innerHTML=list.map(c=>{const g=c.category!==previous?`<div class="group">${esc(c.category)}</div>`:'';previous=c.category;return g+`<button class="case ${selected===c.id?'active':''}" data-case="${esc(c.id)}" ${selected===c.id?'aria-current="true"':''}><i class="dot ${c.result?.status==='success'?'done':c.result?.status==='failed'?'failed':c.result?.status==='blocked'?'blocked':''}"></i><strong>${esc(c.title)}</strong><small>Query ${esc(c.queryId)} · ${esc(c.sampleType)}</small></button>`}).join('')||'<div class="sub">没有匹配案例</div>';document.querySelectorAll('[data-case]').forEach(b=>b.onclick=()=>{selected=b.dataset.case;const u=new URL(location.href);u.searchParams.set('case',selected);history.replaceState(null,'',u);render()})}
function panel(c,which){const current=which==='test';const v=current?c.result:which==='before'?c.before:c.historicalAfter;const url=current?v?.fileUrl:v?.file_url;const title=current?'本次测试修改后':which==='before'?'提出问题前的原版':'当时线上修改后的结果';const cid=current?v?.conversationId:c.originalConversationId;const mid=current?v?.generationMessageId:v?.assistant_message_id;const snap=current?v?.snapshotId:v?.snapshot_id;return `<section class="panel"><div class="panel-head"><div class="panel-title">${title}<small>${current?'测试环境 · 10月27日 V1':`历史线上 · V${esc(v?.version||'—')}`}</small></div>${url?`<a class="btn" href="${esc(url)}" target="_blank" rel="noopener">独立打开 ↗</a>`:''}</div><div class="viewport">${url?`<iframe src="${esc(url)}" title="${esc(c.title+' · '+title)}" loading="lazy" allow="fullscreen" sandbox="allow-scripts allow-same-origin"></iframe>`:`<div class="placeholder"><strong>${v?.status==='blocked'?'流程阻塞 · 未返回新课件':v?.status==='failed'?'本次未生成完成':'等待本次结果'}</strong><span>${esc(v?.error||'结果返回后更新，未完成不计作通过。')}</span></div>`}</div><div class="meta"><details><summary>会话 / 消息 / HTML版本</summary><dl><dt>会话ID</dt><dd>${esc(cid||'待返回')}</dd><dt>消息ID</dt><dd>${esc(mid||'待返回')}</dd><dt>HTML版本</dt><dd>${esc(snap||(v?.status==='blocked'?'无新版本':'待返回'))}</dd>${current?`<dt>副本一致性</dt><dd>${c.cloneIntegrity?.onlySdkHtmlDifference?'已核对：仅SDK与快照等环境信息不同':'待核对'}</dd>`:''}</dl></details></div></section>`}
function render(){const c=data.cases.find(c=>c.id===selected)||data.cases[0];selected=c.id;nav();const r=reviews[c.id]||{};const notes=c.observations||[];document.getElementById('detail').innerHTML=`<div class="case-heading"><h2><span class="qid">${esc(c.id)}</span>${esc(c.title)}</h2><div>${c.rules.map(x=>`<span class="tag">来源 ${esc(x)}</span>`).join('')}</div></div><section class="query"><div class="query-label">本轮原样提交的用户修改 · Query ${esc(c.queryId)}</div><p>${esc(c.query)}</p><div class="accept"><strong>重点看：</strong>${esc(c.acceptance)}</div>${c.uploadedImages?.length?`<p class="attachment">本轮原始附件：${c.uploadedImages.map((x,i)=>`<a href="${esc(x.imageUrl)}" target="_blank" rel="noopener">查看参考图 ${i+1} ↗</a>`).join(' · ')}</p>`:''}</section><div class="compare-toolbar"><div class="seg" role="group" aria-label="左侧对照版本"><button data-baseline="before" class="${baseline==='before'?'active':''}">问题原版</button><button data-baseline="historical" class="${baseline==='historical'?'active':''}">历史修改后</button></div><span class="hint">右侧固定为本次测试结果 · 可独立打开查看大图和操作</span></div><div class="compare">${panel(c,baseline)}${panel(c,'test')}</div><section class="observations"><h3>核验记录</h3>${c.checks?`<p class="hint">JS语法：${c.checks.syntaxErrors?.length?'发现异常':'通过'} · 音频解码：${c.checks.audioDecodeErrors?.length?'发现异常':c.checks.audioFiles?'通过':'无音频文件'} · 改动文件：${c.fileDiff?.changed?.length??'待核对'} 个（不含SDK注入差异）</p>`:''}${notes.length?notes.map(n=>`<div class="obs ${esc(n.tone||'')}"><p><strong>${esc(n.label)}：</strong>${esc(n.text)}</p>${n.scope?`<small>${esc(n.scope)}</small>`:''}</div>`).join(''):'<p class="hint">尚未完成运行核验。可以先对照预览，不能仅按生成成功判定问题已修复。</p>'}${c.screenshots?.length?`<details><summary>查看实测截图（同一浏览器尺寸）</summary><div class="screens" style="${c.screenshots.length===1?'grid-template-columns:1fr':''}">${c.screenshots.map(s=>`<figure><figcaption>${esc(s.label)}</figcaption><a href="${esc(s.url)}" target="_blank" rel="noopener"><img src="${esc(s.url)}" alt="${esc(s.label)}" loading="lazy"></a></figure>`).join('')}</div></details>`:''}${c.sourceEvidence?.length?`<details><summary>查看相关源码证据</summary>${c.sourceEvidence.map(e=>`<p class="hint">${esc(e.file)} · 第${e.start}–${e.end}行</p><pre class="source-code">${esc(e.text)}</pre>`).join('')}</details>`:''}${c.fileDiff?`<details><summary>查看改动文件</summary><p class="hint">文件变化仅用于排查修改范围，不直接代表误改。</p><div class="hint">修改：${esc(c.fileDiff.changed.join('、')||'无')}<br>新增：${esc(c.fileDiff.added.join('、')||'无')}<br>删除：${esc(c.fileDiff.removed.join('、')||'无')}</div></details>`:''}</section><section class="review"><h3>你的对比判断</h3><div class="decisions">${decisions.map(d=>`<button class="btn ${d===(r.decision||'待验证')?'active':''}" data-decision="${d}">${d}</button>`).join('')}</div><textarea id="review-note" aria-label="案例评审备注" placeholder="记录还没改好、改坏或希望保留的地方">${esc(r.note||'')}</textarea><div class="review-foot">仅保存在当前浏览器；可用右上角导出，不会自动修改课件或提示词。</div></section>`;document.querySelectorAll('[data-baseline]').forEach(b=>b.onclick=()=>{baseline=b.dataset.baseline;render()});document.querySelectorAll('[data-decision]').forEach(b=>b.onclick=()=>{reviews[c.id]={...reviews[c.id],decision:b.dataset.decision,updatedAt:new Date().toISOString()};persist();document.querySelectorAll('[data-decision]').forEach(x=>x.classList.toggle('active',x.dataset.decision===b.dataset.decision))});document.getElementById('review-note').oninput=e=>{reviews[c.id]={...reviews[c.id],note:e.target.value,updatedAt:new Date().toISOString()};persist()}}
document.getElementById('search').oninput=e=>{search=e.target.value;nav()};document.getElementById('export').onclick=()=>{if(!data)return;const blob=new Blob([JSON.stringify({exportedAt:new Date().toISOString(),data,reviews},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='10月27日V1-Badcase复测记录.json';a.click();URL.revokeObjectURL(url);notify('已导出对比记录')};
fetch('data/prompt-badcase-20261027.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}).then(d=>{data=d;document.getElementById('boundary').textContent=d.boundary;document.getElementById('status').textContent=`${d.successCount} 条返回结果 · ${d.blockedCount} 条阻塞 · ${d.failureCount} 条失败`;document.getElementById('overview-summary').innerHTML=`<div class="summary-grid">${d.summary.map(x=>`<section class="summary-card"><h3>${esc(x.title)}</h3><p>${esc(x.text)}</p>${x.cases.map(q=>`<a href="?case=${esc(q)}" data-jump="${esc(q)}">${esc(q)} ↘</a>`).join('')}</section>`).join('')}</div><details class="next-steps"><summary>后续优先检查什么</summary><ol>${d.nextSteps.map(x=>`<li>${esc(x)}</li>`).join('')}</ol><p>先定位问题所在环节，不据此继续堆叠大段提示词。</p></details>`;document.querySelectorAll('[data-jump]').forEach(a=>a.onclick=e=>{e.preventDefault();selected=a.dataset.jump;const u=new URL(location.href);u.searchParams.set('case',selected);history.replaceState(null,'',u);render();document.getElementById('detail').scrollIntoView({behavior:'smooth'})});render()}).catch(e=>{document.getElementById('status').textContent='数据读取失败';document.getElementById('detail').innerHTML='<div class="empty error">无法读取对照数据，请刷新后重试。</div>'});
</script></body></html>

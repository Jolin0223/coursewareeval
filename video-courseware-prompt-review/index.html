务端根据画面提示词、参考输入、时长和配音变化决定要生产的镜头视频；不要重复生产未变视频。新增资源使用不同于基础资源的局部 ID，所有引用和直接依赖均须完整、无重复、自引用或循环。\n\ncourse_instruction 可以按意见修改整课；scene_instruction 仅能修改 opinions 明确列出的 sceneId，基础大纲和章节元数据、其他场景的教学内容、资源引用和共享固定角色保持原值，不新增、删除或移动场景，只允许必要的整课衔接代码调整。若单场要求更换共享角色的音色或名称，保留原角色定义，为该场新增独立角色及必要的新配音。新增图片/音频的 sceneId 必须属于指定场景，关闭工具也必须属于指定场景，不能借分场入口修改整课工具。所有修改只影响新记录，绝不覆盖基础版本。只改变 H5 描述或引用时复用原镜头输入；改变 pictureDescription 是明确视频生产变化，不得静默保留旧成品意图。\n\n合并修改时继承基础版本的学段、教学目标、视觉基准、重复主体身份及声音映射，只在教师本次授权范围内改变。新的媒体描述需带完整适用约束，引用真实可用的基础资源；依赖、台词、配音引用和镜头内容按实际变化联动，不能只换文本却继续使用表达旧内容的资源。教师明确要求的身份、风格或教学变化应落实到授权范围，不被原基准阻止；分场修改仍遵守现有共享资源与其他场景保护规则，不顺带扩展成整课重生成。内容只涉及H5时复用未变媒体；保持完整草稿与稳定身份，所有修改形成新记录。\u003cspan class=\"add-mark\">\n\n字体按使用场景选择准确font-family，由平台既有程序处理资源打包和引用；不新增字体下载或在线加载逻辑，不猜文件路径。\n英语单词默认用&quot;Heinemann Roman&quot;，加粗用&quot;Heinemann Bold&quot;；人教版/人教手写体用&quot;Italic Adjust&quot;，对应四线三格用&quot;Italic JX Four Four Adjust&quot;；苏教版/苏教手写体用&quot;shuangyu-SU&quot;，对应四线三格用&quot;shuangyu-SU-line&quot;；cake系列用&quot;EnglishCake&quot;，对应四线三格用&quot;EnglishCake4Line&quot;。仅指定四线三格时用&quot;Italic JX Four Four Adjust&quot;，只应用于需书写线的区域。字体名称保留大小写、空格和连字符；不为加粗更换教材字形。非英语普通文字、必要中文及数字用&quot;方正准圆简体&quot;，加粗用&quot;方正粗圆简体&quot;；汉字注音另按注音规则。\n汉字需要拼音注音时，只输出汉字原文，整段使用 &quot;方正楷体拼音字库01&quot; 并留足行高；不得用 ruby/rt、独立拼音文本、数组转换、伪元素或手动空格重复注音。此规则仅针对汉字注音，不禁止教学目标本身为拼音字母或音节时的独立拼音内容；该类内容使用已确认教材规范及可用字体。多音字或字形不能由现有字体正确表达时回到内容/字体核验，不编造读音。\n英语课件的标题、指令、按钮、反馈默认英文，用户明确要求中文或双语时调整；非英语课件操作说明默认中文，保留教学所需英文、数字与算式。\u003c/span>", "hunks": [{"kind": "insert", "old": "", "new": "\u003cspan class=\"add-mark\">\n修改仅在授权的新建、重做或对应范围应用默认；未涉及的已确认风格、声音、素材和交互保持。\n\n视觉与教学要求：\n未指定画风时，采用儿童友好的3D Q版动画质感：圆润立体造型、柔和光影、克制的材质细节；不要求实时三维引擎。用户指定风格、已确认方案及真实教学资料优先，按学段调整比例和装饰，不把小学全部幼儿化。视频、图片与H5统一主辅色、材质、光照、角色身份和关键道具结构；题板、按钮、进度与反馈复用同套主题元素，内容区保持低干扰，功能符号保持清楚。\n\n整课封面：新建视频互动课件默认使用16:9精美整图，用户明确不要或指定其他形式时按其要求。将本课实际主标题、短副标题（中文不超过15字，英文用短语）、进入按钮造型及文案各一套生成到图中；语言、角色、关键道具和画风与课程一致，构图有主次、文字清楚、边缘留安全区，不加无关文字、Logo、水印或尺寸标记。\n整图完整适配舞台，不裁切、不套进另一张封面；HTML不重复叠加可见标题、副标题或按钮。全封面共用一个透明进入热区，任意位置完成有效轻触释放或Enter/空格后进入一次，取消不进入，防重复与 r/type/h5/shots/assetRefs 全部字段；保留仍使用的基础场景和镜头的稳定身份，不把未改场景重新编号。场景 type 使用 video/h5/mixed，h5 仅有 contentDescription，纯 video 的 h5 为 null，纯 h5 的 shots 为 []。shot 包含 shotId/order/pictureDescription/durationSeconds/referenceImageIds/referenceAudioIds/firstFrameAssetId/lastFrameAssetId/dub；每项 dub 含 speakerId/text/audioAssetId。引用已有资源时只使用基础真实 assetId。\n3. htmlRequirements：本次明确的 HTML 行为或工具修改要求，无额外行为修改为 &quot;&quot;；不能写“保持不变”来制造修改。关闭工具须明确写出目录 key 和关闭后的行为。\n4. closedTeacherTools：仅可列出历史教师工具的关闭键，无关闭为 []；固定 _course/scene-navigation 禁止关闭，不得编造工具身份。\n\ndraft.speakers 每项仅含 speakerId/name/voiceName；完整保留基础资源仍关联的角色定义，已有角色复用固定音色，新增音色只能来自 voiceCatalog.names。修改配音正文或音色时，须给出新的配音要求和新的 audioAssetId，不能继续把旧音频当成新台词。\ndraft.assets 只列本次实际新增的图片和配音生产要求，保留 images/audios/videos 三个数组；不重复规划基础可用资源，不提交它们的 URL、路径、尺寸、实际时长或成功状态。\nimages 每项仅含 assetId/sceneId/name/dependencyAssetIds/imageType/origin/description/sourceMaterialId；imageType 使用 scene_material/character_portrait/video_reference；新增图片 origin 必须为 generated，description 非空，sourceMaterialId 为 null。dependencyAssetIds 表示实际生成来源，不表示 H5 引用范围。\naudios 每项仅含 assetId/sceneId/name/dependencyAssetIds/origin/description/text/speakerId；origin 为 generated，text 是完整新台词，与镜头 dub 一致，speakerId 必须存在。\nvideos 必须为 []，服务端根据画面提示词、参考输入、时长和配音变化决定要生产的镜头视频；不要重复生产未变视频。新增资源使用不同于基础资源的局部 ID，所有引用和直接依赖均须完整、无重复、自引用或循环。\n\ncourse_instruction 可以按意见修改整课；scene_instruction 仅能修改 opinions 明确列出的 sceneId，基础大纲和章节元数据、其他场景的教学内容、资源引用和共享固定角色保持原值，不新增、删除或移动场景，只允许必要的整课衔接代码调整。若单场要求更换共享角色的音色或名称，保留原角色定义，为该场新增独立角色及必要的新配音。新增图片/音频的 sceneId 必须属于指定场景，关闭工具也必须属于指定场景，不能借分场入口修改整课工具。所有修改只影响新记录，绝不覆盖基础版本。只改变 H5 描述或引用时复用原镜头输入；改变 pictureDescription 是明确视频生产变化，不得静默保留旧成品意图。\n\n合并修改时继承基础版本的学段、教学目标、视觉基准、重复主体身份及声音映射，只在教师本次授权范围内改变。新的媒体描述需带完整适用约束，引用真实可用的基础资源；依赖、台词、配音引用和镜头内容按实际变化联动，不能只换文本却继续使用表达旧内容的资源。教师明确要求的身份、风格或教学变化应落实到授权范围，不被原基准阻止；分场修改仍遵守现有共享资源与其他场景保护规则，不顺带扩展成整课重生成。内容只涉及H5时复用未变媒体；保持完整草稿与稳定身份，所有修改形成新记录。\n\n字体按使用场景选择准确font-family，由平台既有程序处理资源打包和引用；不新增字体下载或在线加载逻辑，不猜文件路径。\n英语单词默认用&quot;Heinemann Roman&quot;，加粗用&quot;Heinemann Bold&quot;； <script>
'use strict';
const D=JSON.parse(document.querySelector('#data').textContent),$=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KEY='vc-prompt-merge-'+D.revision;let decisions={},notes={},page=location.hash.slice(1)||'overview',baseline='dev',view='full',timer;
const allowed=D.files.map(f=>f.id),baseLabel=()=>baseline==='dev'?'开发11月13日':'上一版r7';
function validRecord(x){return x&&x.revision===D.revision&&x.decisions&&typeof x.decisions==='object'&&!Array.isArray(x.decisions)&&x.notes&&typeof x.notes==='object'&&!Array.isArray(x.notes)&&Object.entries(x.decisions).every(([k,v])=>allowed.includes(k)&&['accept','reject'].includes(v))&&Object.entries(x.notes).every(([k,v])=>allowed.includes(k)&&typeof v==='string')}
try{const x=JSON.parse(localStorage.getItem(KEY)||'null');if(validRecord(x)){decisions=x.decisions;notes=x.notes}}catch{}
function record(){return {revision:D.revision,baseline:'开发2026-11-13',candidate:'11月13日自适应补充r8',decisions,notes,notice:'评审记录；保留基线指开发11月13日。下载包不会按逐项决定重新拼装，评审不代表配置已经更新。'}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(record()));$('#save-status').textContent='评审记录已保存'}catch{$('#save-status').textContent='保存失败，请导出记录'}}
function toast(t){$('#toast').textContent=t;clearTimeout(timer);timer=setTimeout(()=>$('#toast').textContent='',5000)}
function download(n,t){const u=URL.createObjectURL(new Blob([t],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=u;a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(u),2500)}
function status(f){return decisions[f.id]==='accept'?'已采纳':decisions[f.id]==='reject'?'保留开发11月13日':f.dev===f.final?'未改':'待评审'}
function nav(){const btn=(id,t,s='')=>`<button data-page="${id}" class="${page===id?'selected':''}" ${page===id?'aria-current="page"':''}><span>${esc(t)}</span>${s?`<em>${esc(s)}</em>`:''}</button>`;$('#nav').innerHTML=btn('overview','评审总览')+'<div class="group">创建链路 · 当前使用</div>'+D.files.filter(f=>/^P[1-7]$/.test(f.id)).map(f=>btn(f.id,`${f.id} ${f.name}`,status(f))).join('')+'<div class="group">修改链路 · 当前使用</div>'+D.files.filter(f=>f.id==='R1').map(f=>btn(f.id,`${f.id} ${f.name}`,status(f))).join('')+'<div class="group">锁定 · 代码固定追加</div>'+D.files.filter(f=>f.id==='M1').map(f=>btn(f.id,`${f.id} ${f.name}`,'原文保持')).join('')+'<div class="group">旧链路 · 仅兼容</div>'+D.files.filter(f=>f.id==='P8').map(f=>btn(f.id,`${f.id} ${f.name}`,status(f))).join('')}
function overview(){return `<span class="tag">默认对照开发基线；可切换上一版r7</span><span class="tag warn">配置待接入 · 生成效果待验证</span><h1>补齐画布适配与实际音色目录</h1><p><a href="合并说明与工程联动.md">修订说明与工程联动清单</a> · <a href="开发改动保留清单.md">开发改动逐项核对</a></p><p class="muted">创建用 P1–P7；当前修改用 R1；P8 单独保留为旧链路兼容。每份都是完整提示词，可直接复制或下载，不依赖在其他环节出现过的规则。</p><div class="stats"><span><b>${D.files.length}</b>份完整提示词</span><span><b>${D.files.filter(f=>f.id!=='P8'&&f.id!=='M1').length}</b>份用于当前链路</span><span><b>${Object.keys(decisions).length}/${D.files.length}</b>份已记录评审决定</span></div><section class="card"><ul class="summary">${D.summary.map((s,i)=>`<li><span class="number">${String(i+1).padStart(2,'0')}</span><div>${esc(s)}</div></li>`).join('')}</ul></section><div class="callout"><strong>全文内直接标记改动</strong><p>默认看“开发11月13日 → 11月13日自适应补充r8”，也可切换“上一版r7 → 11月13日自适应补充r8”。红色删除线是移除或替换，绿色是新增，灰色是保留内容。</p></div><section class="card"><ul class="stage-list">${D.files.map(f=>`<li><div><strong>${esc(f.id+' '+f.name)}</strong><small>${esc(f.route||f.key||'')}</small></div><button data-page="${esc(f.id)}">看全文对照</button></li>`).join('')}</ul></section><p class="small muted">本页的采纳、保留和备注只记录评审决定。顶部 ZIP 始终是完整修订版，不会按零散决定自动拼接不同协议。与旧评审页记录分开保存；导入只接受相同版本。</p>`}
function pair(diff,empty){return `<div class="diff"><div><div class="label">${baseLabel()} · 改前全文</div><pre class="old">${diff.old||`<span class="placeholder">${esc(empty||'（这一版没有此提示词）')}</span>`}</pre></div><div><div class="label">11月13日自适应补充r8 · 改后全文</div><pre class="new">${diff.new||'<span class="placeholder">（本次移除此段）</span>'}</pre></div></div>`}
const legend='<div class="legend"><span class="del-mark">红色删除线：删除或替换前</span><span class="add-mark">绿色：新增或替换后</span><span>灰色：保留原文</span></div>';
function file(f){const diff=baseline==='dev'?f.diffDev:f.diffPrevious;const isLegacy=f.id==='P8';const initial=`${f.id==='M1'?'<span class="tag warn">代码固定追加 · 原文锁定</span>':isLegacy?'<span class="tag warn">旧链路兼容 · 当前修改流程不调用</span>':f.id==='R1'?'<span class="tag">当前修改链路 · SYSTEM 常量</span>':'<span class="tag">当前创建链路</span>'}<h1>${esc(f.id+' '+f.name)}</h1><p class="muted">${esc(f.reason)}</p><div class="route">${esc(f.filename)}<br>${esc(f.key||'无配置键 · 替换源码 SYSTEM')}<br>${esc(f.route||'')}</div><div class="sticky"><div class="baseline"><label for="baseline">对照基线</label><select id="baseline"><option value="dev" ${baseline==='dev'?'selected':''}>开发11月13日 → 11月13日自适应补充r8</option><option value="previous" ${baseline==='previous'?'selected':''}>上一版r7 → 11月13日自适应补充r8</option></select><button class="review-jump" id="jump-review">填写本环节评审</button></div><div class="toolbar">${[['full','完整提示词对照'],['changes','只看改动'],['plain','完整修订文本']].map(([v,t])=>`<button data-view="${v}" class="${view===v?'selected':''}">${t}</button>`).join('')}<button id="first-change">跳到首处改动</button><button id="copy">复制完整修订版</button><button id="txt">下载完整 TXT</button></div></div>`;
let content='';if(view==='full')content=`<section class="card full-prompt">${legend}${false?'<p class="inline-note">此前交付没有独立 R1，左侧为空；这里全部标绿只表示相对此基线新增，不表示开发11月13日也没有这些规则。</p>':''}${pair(diff)}</section>`;else if(view==='plain')content=`<section class="card"><div class="label">最终完整文本 · 无对照标记</div><pre class="plain">${esc(f.final)}</pre></section>`;else content=diff.hunks.length?diff.hunks.map((h,i)=>`<section class="card changes"><div class="changehead"><strong>改动 ${i+1} · ${h.kind==='insert'?'新增':h.kind==='delete'?'删除':'替换'}</strong><span class="muted">未改内容已折叠</span></div>${pair(h,'（基线没有此段）')}</section>`).join(''):'<section class="card"><div class="cardbody">与当前选择的基线完全一致，没有改动。可切换“完整提示词对照”阅读全文。</div></section>';
return initial+content+`<section class="card review-box" id="stage-review"><div class="cardbody"><h2>本环节评审</h2><p class="muted small">决定作用于11月13日自适应补充r8；“保留开发11月13日”始终指开发基线，与上方查看的对照基线无关。部分采纳请在备注中说明。</p><div class="toolbar">${[['pending','待评审'],['accept','采纳11月13日自适应补充r8'],['reject','保留开发11月13日']].map(([v,t])=>`<button data-decision="${v}" class="${(decisions[f.id]||'pending')===v?'selected':''}">${t}</button>`).join('')}</div><label class="note-label" for="note">评审备注</label><textarea id="note" placeholder="记录需要调整的具体条款…">${esc(notes[f.id]||'')}</textarea></div></section>`}
function render(){if(!['overview',...allowed].includes(page))page='overview';nav();$('#main').innerHTML=page==='overview'?overview():file(D.files.find(f=>f.id===page));$('#zip').href=D.zip}
function go(p){page=p;view='full';document.body.classList.remove('nav-open');$('#toggle-nav').setAttribute('aria-expanded','false');$('#toggle-nav').textContent='展开环节导航';history.replaceState(null,'','#'+p);render();scrollTo(0,0)}
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.page)go(b.dataset.page);else if(b.dataset.view){view=b.dataset.view;render()}else if(b.dataset.decision){if(b.dataset.decision==='pending')delete decisions[page];else decisions[page]=b.dataset.decision;save();const y=scrollY;render();scrollTo(0,y)}else if(b.id==='toggle-nav'){const open=document.body.classList.toggle('nav-open');b.setAttribute('aria-expanded',String(open));b.textContent=open?'收起环节导航':'展开环节导航'}else if(b.id==='first-change'){if(view!=='full'){view='full';render()}const change=$('.full-prompt pre .add-mark,.full-prompt pre .del-mark');if(change)change.scrollIntoView({behavior:'auto',block:'center'});else toast('与当前基线一致，没有改动')}else if(b.id==='jump-review')$('#stage-review').scrollIntoView({behavior:'auto',block:'start'});else if(b.id==='record')download('视频互动课件_11月13日自适应补充r8_评审记录.json',JSON.stringify(record(),null,2));else if(b.id==='import')$('#upload').click();else if(b.id==='txt'){const f=D.files.find(f=>f.id===page);download(f.filename,f.final)}else if(b.id==='copy'){try{await navigator.clipboard.writeText(D.files.find(f=>f.id===page).final);toast('已复制完整修订版，含所有未改内容')}catch{toast('复制不可用，请使用“下载完整 TXT”')}}});
document.addEventListener('input',e=>{if(e.target.id==='note'){notes[page]=e.target.value;save()}});
document.addEventListener('change',e=>{if(e.target.id==='baseline'){baseline=e.target.value;render()}});
$('#upload').addEventListener('change',async e=>{try{const f=e.target.files[0];if(!f)return;const x=JSON.parse(await f.text());if(x.revision!==D.revision)throw Error('版本不匹配，未导入；请在对应版本评审页查看原记录。');if(!validRecord(x))throw Error('记录格式或环节内容不合法，未导入。');decisions=x.decisions;notes=x.notes;save();render();toast('评审记录已恢复')}catch(err){toast(err.message)}e.target.value=''});
window.addEventListener('hashchange',()=>{page=location.hash.slice(1)||'overview';view='full';render();scrollTo(0,0)});
render();window.__mergeReview={data:D,record};
</script></body></html>

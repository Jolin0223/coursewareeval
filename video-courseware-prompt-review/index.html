；不能因其含文字或采用真实画面就一律排除。需要动态改变或判定的内容优先由H5控制；纯视频中的必要教学内容须由可验证媒体能力承载，不虚构合成能力，也不擅自把纯视频改成交互课。\n混合场景在现有 h5.contentDescription 写明媒体结束、跳过、进入操作及反馈后的状态与衔接；pictureDescription 只包含可执行的镜头内容。预留区域、机位与运动范围按实际交互选择，只有需要稳定叠加时才限制镜头，不将固定机位推广为全部视频的规则。\n\n\u003cspan class=\"del-mark\">按教学表达需要安排说话者及出镜方式，不强制每课同时存在旁白和角色。相同声音身份保持稳定，audios[].text、speakerId、镜头 dub 与参考音频对应；shots[].dub 是数组，每个元素是一段配音，含 speakerId、text、audioAssetId，一条镜头有多段台词就写多个元素。角色可以按课程需要讲解，但画面中的说话者必须与声音归属一致。画外音不应无故驱动其他角色持续说话，精确口型只在输入能力明确支持时规划，不把参考音频等同可靠口型同步。\n\u003c/span>镜头描述明确主要动作及衔接状态，台词量、动作时间、停顿和镜头时长共同适配教学节奏及冻结能力；不以强制加速或丢失关键内容迁就时长。规划阶段不编造TTS实际时长，生成后由媒体链路校验实际音频与成片，不能仅靠描述宣称同步。\n\n一、先在整课范围内统一设计，再拆分场景\n读取已确认outline.designStyle、教师需求与各用途材料，确定本课的主题、年龄、视觉表现、重复主体及H5组件。已明确的设计必须执行；未明确的实现细节只做一次全课统一选择，不逐场自由取样、不改写确认大纲。具体选择必须落到下述实际输出文本中，不能只在内部想过或写“同上”。如果本课没有叙事人物，统一学习对象、环境和组件即可。\n先确定角色/道具的固定外形、服装或结构、颜色、比例、材质，以及允许变化；再确定视频与H5共用的表现方式、配色用途、光照、线条/轮廓和细节密度；再把适合本课的少量主题元素分配到题板、选项、按钮边框、进度或反馈。装饰与功能分开，正文区域空净、功能图标可识别，不以统一风格改变真实教材图的事实信息。\n输出协议没有全局视觉对象，不新增visualSystem/styleId/componentTasks等字段，也不改章节content。全课设计来自outline.designStyle；本阶段补全的具体选择分别写入每份相关images[].description、shots[].pictureDescription和h5.contentDescription。每份文本都展开本资源适用的特征，不能引用模型看不到的“其他提示词”。相同主题元素、主体和组件的描述必须一致，使用同一实际基准资源；不把整套无关UI规则复制到视频镜头描述。\n二、规划基准资产与真实依赖\n当前是规划阶段，不调用生成工具，不宣称新母版已生成或通过审核。先复用输入中可采用且适用的已有资产；没有合适基准且确有跨素材复用需要时，在本次assets中规划必要的角色/道具/组件基准节点，再规划依赖其产物的派生节点。通过dependencyAssetIds表达真实直接生成来源，保持唯一生产归属和无环依赖；基准与派生都可在本轮完整方案中定义，实际生产由后续流程按依赖执行。仅风格相似不要求无关资源互相依赖，不把图像、道具和背景互相引用成环。\n引用已有或本轮定义的真实assetId，不能把未生成的新资源写成已有成品URL。派生图明确保留与改变的部分；图生视频引用实际所需的场景/角色成图，遵守参考数量与冻结能力。参考数量不足时先规划经基准派生的合适场景合成参考，不偷偷丢掉人物或道具身份参考，也不假装供应商有锁帧能力。图片依赖用于生产，assetRefs用于显示/播放，两者不可混用。\n\n三、主题组件及场景资源\n题板与控件也属于全课视觉资产，不是素材完成后临时拼装的通用白板。按本课实际需要确定组件种类；在type=h5或mixed场景的h5.contentDescription中写明组件的稳定语义名称、外形/材质/色彩/主题装饰、文字安全区、正常/选中/不可用/反馈状态及实现方式。没有需要的组件不主动添加。\n可由代码稳定表达的圆角、边框、几何装饰、标准图标和状态效果，规划为同一套CSS/SVG组件复用；需要复杂造型、纹理或主题雕饰的题板/道具，规划独立组件基准图片，以合法scene_material类型生产，外部透明、组件实体保留、文字区域空净。相同组件跨场景引用同一assetId；确需尺寸/造型变体时复用适用基准并明确变化，不独立重画。题目、答案、进度数值与文字由H5真实文本叠加。所有H5使用的实际媒体都通过合法assetRefs声明；仅用于生成的参考图不因存在依赖而自动在界面显示。\n纯环境背景不包含题板/选项/按钮，并不禁止H5前景使用有主题设计的独立题板。视频实际出现的环境、角色、道具共享适用设计；界面组件不必出现在视频里，不能为了同风格把整张界面截图、按钮或题板当作无关镜头参考，造成UI进入视频。\n\n按用途区分H5背景/封面、H5独立前景素材、完整教学资料和视频整帧参考。在现有 images[].description 中写明用途、主体、构图、透明要求及不可出现的内容，不新增JSON字段或枚举。H5非背景图/封面图默认按独立前景素材生产：角色、道具、食物、选项图、可操作物等须为真实Alpha透明底且边缘干净，主体完整不截断，周围不带环境、方形底、白底、棋盘格或无关文字。PNG后缀不等于已经抠图；写“透明背景”也不代表生产完成。需要平台执行透明生成或抠图，并验证实际Alpha后才能交给H5；无此能力时明确资源阻断，不能用CSS混合模式、滤镜或白底相近冒充抠图。\n完整教学资料在教学确需且已确认完整呈现时可保留本底，但应作为整张资料呈现，不冒充可独立操作的道具。视频整帧参考、纯视频画面和封面可以保留完整背景，不对整帧机械抠图。需要不同交互项时分别规划独立资源，或使用明确可定位的图集裁切；禁止把同一张多对象拼图直接复制给多个不同答案。\nH5纯背景只提供情境氛围：默认16:9全幅，内容/操作区连续、低细节、低对比，装饰放边缘或远景，不烘焙文字、题干、答案、选项、控件、需要移走的道具或会被当成可操作项的对象。纯背景不得用中央大主体、边框、面板、卡片或分割线抢占承载区；H5层可按实际可读性加承载面板。观察型教学资料和视频场景不是纯背景，必要的教学对象应保留，并明确其承担的任务；不可借此把互动题目重新烘焙进背景。\n对跨素材/跨镜头重复的角色、关键道具、场景和组件，沿用输入中已确认且适用的视觉基准；缺少基准时规划待生成的单一基准及派生依赖，不称其已经生成或通过核验，记录稳定外形、比例、轮廓、颜色、服装/结构、材质和相对尺度；允许表情、姿势、视角、受教学要求驱动的状态变化，不允许无依据换脸、换物种、换服装、换道具结构或换画法。先复用现有可用基准，确需新基准则先规划基准节点与派生依赖；生成与实际核验由后续素材流程完成。派生图片的 dependencyAssetIds 必须引用真实基准ID；图生视频在 referenceImageIds/firstFrameAssetId/lastFrameAssetId 中传入实际适用图片。描述须展开本次所需稳定特征与风格，不只写“同上”“保持一致”。参考图是实际生成输入，不能只写名字；其存在也不等于已经验证一致。通用规则不固定某个角色、配色或餐车，更不强制无人物课程引入主角。\n画面风格统一到线条、造型比例、材质、色彩关系、光照和细节密度，而非每张图独立追求华丽。幼儿与低年级采用易辨认轮廓、亲和表情、简洁层次和温和情境，避免写实威吓、压迫光照及过密装饰；具体美术服从已确认年龄与风格，高年级不套幼儿造型。背景、前景、视频与H5控件使用同一课的视觉基准。\n四、场景教学与媒体交接\n混合或情境交互在 h5.contentDescription 写清“操作对象→初始位置→目标位置/区域→有效操作→判定→反馈→完成后状态”，用同一逻辑画布及归一化位置或明确相对锚点描述。叠加在媒体上的对象必须与可见目标位置相符；需要稳定叠加时保证镜头/背景可对齐，若有裁切须考虑object-fit、偏移及缩放。被拿走的对象不能仍烘焙在底图，放入目标的对象应确实出现在目标中；背景装饰不承担命中判定。静态截图不能证明拖拽判题，必须规划实际实现。\n每个视频场景及同场各镜头切换，都规划进入时立即可见的封面/静帧和等待状态；在现有图片description写明适用的sceneId/shotId及展示条件，通过display用途的assetRefs引用。若复用上一镜头的可用画面，写明适用状态和保留条件，不把开场封面无条件套到后续所有镜头；可复用已确认、适合展示的参考图，缺少时通过现有图片资源类型规划，禁止只规划黑底播放按钮。图片生产不依赖尚未生成的未来视频。视频生成后如平台具有抽帧能力可另行提供真实首帧，但不编造已抽出的地址。h5.contentDescription 对混合场景写清进入、等待、播放、暂停、视频结束、互动、重入的画面；纯视频仍保持h5=null；封面的展示用途及对应场景/镜头写入封面图片description，并通过现有assetRefs的合法展示用途引用，由组装环节读取。pictureDescription只写实际视频画面和动作，不写播放器按钮、等待界面或加载策略，不新增协议字段。封面/静帧与视频、H5的主体身份和状态相接。\n资源选择与职责：优先复用当前输入中已确认可采用的真实素材，不能用文件名或风格参考推断可采用教学内容。复杂插画和角色/道具按图片资源生产；普通几何形状、标准按钮图标、动态文字与需改变颜色/状态的图形优先在H5中用文本、CSS或SVG实现，不为了有图而把可控内容生成为位图。单个可操作图标只包含一个语义对象，不把多对象合成一图后直接当多个选项。\n声音按实际教学需求规划：需要人声朗读、讲解或角色台词时，通过现有audios定义提供完整可朗读text与有效speakerId，并按可用音色生成；禁止用浏览器默认语音或空音频冒充已交付配音。纯点击/成功反馈音效不伪造为TTS文本；仅在当前能力允许且本课需要时由H5实现，用户要求无声则不增加声音。每项实际使用的图片/音频写明用途、场景引用及触发时机；视频已有声音不得重复叠播其参考配音。只使用当前视频课件JSON字段，不能输出普通H5的imageTasks/audioTasks/codeTasks/reportMetrics旧协议。\n\n五、H5文字与操作要求\n\u003cspan class=\"del-mark\">学科\u003c/span>字体\u003cspan class=\"del-mark\">与界面语言是业务约束，不因画面风格改变。规定字体资源为 https://iteachcdn.xdf.cn/mmcw/\u003c/span>font\u003cspan class=\"del-mark\">/\u003c/span>f\u003cspan class=\"del-mark\">ontV\u003c/span>a\u003cspan class=\"del-mark\">r.css 。优先复\u003c/span>用\u003cspan class=\"del-mark\">宿主已明确提供的同一\u003c/span>字体\u003cspan class=\"del-mark\">；否则按当前运行契约允许的方式引用该CSS\u003c/span>或\u003cspan class=\"del-mark\">任务提供的等价授权地址。不虚构宿主已\u003c/span>加载，不\u003cspan class=\"del-mark\">绕过明确的外链限制，不自行换用未经确认的字体\u003c/span>。\u003cspan class=\"del-mark\">字体CSS属于样式依赖，不是scenePlan中的教学图片/音频/视频，不给link/style伪造assetId，也不为引入字体新增媒体资源。实际加载是否成功由运行检查确认，不能仅因资源表里没有字体CSS就判为媒体引用非法。\u003c/span>英语\u003cspan class=\"del-mark\">/双语故事表演的\u003c/span>单词默认\u003cspan class=\"del-mark\">使\u003c/span>用\u003cspan class=\"del-mark\"> \u003c/span>&quot;Heinemann Roman&quot;，加粗\u003cspan class=\"del-mark\">使\u003c/span>用\u003cspan class=\"del-mark\"> \u003c/span>&quot;Heinemann Bold&quot;；\u003cspan class=\"del-mark\">明确\u003c/span>人教版\u003cspan class=\"del-mark\">使\u003c/span>用\u003cspan class=\"del-mark\"> \u003c/span>&quot;Italic Adjust&quot;，\u003cspan class=\"del-mark\">明确\u003c/span>苏教版\u003cspan class=\"del-mark\">使\u003c/span>用\u003cspan class=\"del-mark\"> \u003c/span>&quot;shuangyu-SU&quot;，\u003cspan class=\"del-mark\">明确\u003c/span>四线三格时\u003cspan class=\"del-mark\">，仅需要四线三格的文字区域使\u003c/span>用\u003cspan class=\"del-mark\"> \u003c/span>&quot;Italic JX Four Four Adjust&quot;，\u003cspan class=\"del-mark\">不覆盖其他\u003c/span>区域\u003cspan class=\"del-mark\">；其余文字区域按已指定教材版本\u003c/span>字体\u003cspan class=\"del-mark\">或学科默认\u003c/span>字\u003cspan class=\"del-mark\">体，常规/\u003c/span>加粗\u003cspan class=\"del-mark\">按对应可用字形处理，不为实现加粗\u003c/span>换\u003cspan class=\"del-mark\">回另一\u003c/span>教材字形\u003cspan class=\"del-mark\">。这些是资源CSS中的真实 font-family，不能写成未经注册的横杠别名\u003c/span>。非英语普通文字、必要\u003cspan class=\"del-mark\">的\u003c/span>中文\u003cspan class=\"del-mark\">和\u003c/span>数字\u003cspan class=\"del-mark\">使\u003c/span>用\u003cspan class=\"del-mark\"> \u003c/span>&quot;方正准圆简体&quot;\u003cspan class=\"del-mark\"> / \u003c/span>&quot;方正粗圆简体&quot;。英语课件可见标题、指令、按钮、反馈、进度标签及素材中文字默认英文；用户明确要求中文或双语才调整。非英语课件操作与说明默认中文，保留教学要求的英文、数字和算式。按钮用短文案单行，不添加未经要求的括号翻译。\n汉字需要拼音注音时，只输出汉字原文，整段使用 &quot;方正楷体拼音字库01&quot; 并留足行高；不得用 ruby/rt、独立拼音文本、数组转换、伪元素或手动空格重复注音。此规则仅针对汉字注音，不禁止教学目标本身为拼音字母或音节时的独立拼音内容；该类内容使用已确认教材规范及可用字体。多音字或字形不能由现有字体正确表达时回到内容/字体核验，不编造读音。\n字形是教学对象时，H5使用规范字体的真实文本，图像只承担卡壳或非文字插图；不能把模型随机画出的字母、汉字、数字当成规范字形。需要媒体内呈现时使用已核验字形素材及平台实际支持的可控呈现方式；原始教材或观察资料可保留必要文字，但须核验内容。仅修改body字体不能修正已烘焙在图片/视频中的错误字形。\n\n默认以1920×1080的16:9逻辑画布组织H5，等比适配不同屏幕。任一操作状态下，题干、全部操作项、必要反馈和主按钮都在可见画布内，无横纵滚动和遮挡；不要以压缩成普通网页16/18/20px正文来塞入内容，优先简化指令、分步或调整布局。默认逻辑字号：主标题56–72px、题干40–56px、选项36–56px、英文单词/重点词52–76px、英文短句36–56px、主按钮30–48px、反馈36–48px、进度标签36–56px、辅助标签24–48px；注音的视觉尺寸以28–56px及不裁切为参考，不另生成一层拼音。幼儿园小班至小学二年级的核心文字按需要增加4–10px，不把全部元素等比例放大。\n常用图标按钮建议96×96px、图标48–78px；播放/暂停建议112×112px、图标52–84px；重试/下一步建议宽220–280px高88–96px；其他图标按钮热区一般不小于88×88px，离画布边缘建议至少40px，相邻按钮间距建议至少24px。数值指逻辑画布尺度，缩放后仍需验证真实设备可辨认和可点按，不能因满足数值而挤压题目。\n只生成流程需要的真实有效控件，不因规则列举就主动添加首页、退出等按钮；常见功能采用明确且一致的标准图标与短文案，不用难辨识的角色或装饰物代替控件。学前和低年级每屏一个主要任务，短指令、明显可操作物、未要求无声且教学需要人声时规划关键题干配音及播放入口；明确无声时提供清楚的文字、图形或示范提示；答错就地温和反馈、立即重试，不因一次误触重置整关。单题反馈不弹阻断弹窗；需要整段完成反馈时用风格一致的界面及有效关闭/重试操作，不使用 alert/confirm/prompt。学段未知时先采用易读、大热区、短步骤的可用性兜底，不据此把美术风格设为幼儿风。\n核心交互同时适配PC网页、PC内嵌Chrome和移动/学习机触控。拖拽、连线等优先统一Pointer Events，正确处理指针捕获、释放、pointercancel及屏幕坐标到逻辑坐标的转换；不把hover、右键、双击、快捷键或HTML原生拖拽设为唯一完成方式。触控时仅在必要操作区域阻止滚动，保持其他控件可用。仅在非none模式、教学需要录音且宿主缺少该能力时给清楚提示；none模式不显示录音或学习机提示。不无限加载、不伪造结果，仍遵守学生录音模式和VcCourseware协议。\n自定义拖拽的图片设置draggable=false；记录活动pointerId并只处理对应指针。除pointerup/pointercancel外，lostpointercapture、窗口失焦、场景stop和鼠标buttons为0时均结束或取消拖拽，释放捕获并恢复可继续操作的状态；一次操作只提交一次结果。完成上报只使用任务实际允许的metrics和VcCourseware接口，不搬入其他课件的SDK调用或自行规定指标数量。\n\n六、输出前自检\n先建立一份全课唯一的ID清单，再输出完整方案；这是内部核对，不新增输出字段。chapterId逐字沿用outline；本轮新增sceneId、shotId、assetId、speakerId可按现有协议创建唯一且稳定的ID，定义一次后所有引用逐字一致。新规划ID不表示媒体已生成，后续HTML阶段只能使用交付清单中的真实资源。\n依次核对：\n1. 顶层只有chapters、speakers、assets；chapters逐一覆盖outline章节且不多不少，每项只有chapterId、scenes；场景只用规定字段，每章order从1连续编号。列表始终是数组，不把空数组写成null或字符串；只有协议明确可空的标量/对象才使用null。\n2. type、imageType、origin、purpose及voiceName只取本次输入提供的可用值；描述中的“封面”“角色基准”“题板”不作为新枚举。文中scene_material仅在输入图片类型允许时使用，否则选择输入中适用的现有类型，不自造编码。纯视频h5=null且shots非空；纯H5的shots=[]且h5有contentDescription；mixed两者均有。\n3. 资源ID跨images/audios/videos唯一，sceneId指向实际存在的唯一生产归属场景；跨场复用只增加引用，不重复定义。assetRefs每项仅assetId、purpose，且仅引用本课已定义的图片或音频。生产参考不等于H5展示，不把未来视频写入assetRefs。\n4. 每个shot恰好对应一个assets.videos定义，shotId一致。合并referenceImageIds与非空firstFrameAssetId/lastFrameAssetId后去重，连同referenceAudioIds，必须恰好组成对应视频的dependencyAssetIds；这些引用必须存在且类型正确，并满足当前模型限制。图片和音频不依赖未来视频；任何依赖不得自引用、重复或成环。\n5. dub始终为数组；每项speakerId、text、audioAssetId与对应音频定义一致，audioAssetId同时在该镜头referenceAudioIds中。没有配音时使用空数组，不制造空音频或无效speaker；不凭文字估算声称实际时长已验证。\n6. 逐场核对教学目的、组件复用、透明前景、主体基准、封面、交互坐标与完成条件。每份生产描述只写本资源必需的具体身份、风格、构图和变化，不整段复制平台规则；简单组件优先复用代码样式，不为每个状态重复新增图片。\n所有检查在输出前完成。只输出一个完整JSON对象，不输出Markdown围栏、思考过程、自检报告、资源URL、成功状态或附加字段；不得用省略号或“其余同上”代替章节与资源。\n\n声音需求与录音模式分别判断：requirement明确无配音、无音效或完全无声时，按其范围不增加相应声音和无效播放入口，用文字/图形/示范表达必要信息；不能因低龄默认规则强加声音。学生录音模式与课程旁白分别判断，none不表示禁止旁白；none下仍执行无录音入口、无评测面板规则。规划阶段不要求新音频已经存在；大纲只确定本课人声需要，场景方案按现有协议复用适用的真实音频或规划完整text、有效speaker及触发要求。新定义是待生成要求，不称已经可播放；后续交付与播放须使用实际成功资源，不能用空文件、浏览器默认TTS或伪造成功音频填缺口。\n\n对每个实际引用的参考图，在当前description或pictureDescription中说明它约束的是身份、风格、空间构图还是组件外观，以及不应继承的背景/文字/其他人物。referenceImageIds中的各图不能互相给出冲突的同一主体造型；选择已确认基准及与目标状态适用的派生图，不同时把冲突旧版本当参考。视觉角色与speakers中的声音身份使用一致名称并在镜头描述中明确对应关系；没有发声的可见角色不为了视觉身份登记而强行新增speakers，speakers结构不加字段。\n\n录音与评测边界：学生录音模式为 none 时，不规划或保留录音调用、麦克风入口、录音按钮、波形、录音计时及“按住说话”“开始录音”“重新录音”“录音太短”等文案，也不展示分数、星级、正确率等评测面板；开口任务使用点击选择或朗读后点“读完啦”等不采集音频的完成方式。可保留依据真实点击/操作的温和对错与完成反馈，教学内容中的数字和非评分装饰不属于评测结果。none 不显示学习机录音能力提示；只有非 none 模式且确需录音而缺少真实宿主能力时才显示该提示。该规则不禁止本课需要的旁白，也不改变宿主已有的合法学习结果提交协议，不授权虚构指标。\n本阶段学生录音模式读取输入的 selectedVoiceMode，不自行改变已确认模式；HTML阶段映射为任务中的voiceMode。", "new": "你负责为已确认教学大纲的各章节生成场景、镜头和互动设计。输出必须遵守本次输入及系统固定约束中的字段、枚举、引用关系和冻结能力；教学与视觉要求写入已有文本字段，不能扩展JSON协议。以下所说“基准”“封面”“透明”“主题组件”均为资源用途或描述，不是新增字段、资源分组或枚举。\n\u003cspan class=\"add-mark\">\n视觉与教学要求：\n未指定画风时，采用儿童友好的3D Q版动画质感：圆润立体造型、柔和光影、克制的材质细节；不要求实时三维引擎。用户指定风格、已确认方案及真实教学资料优先，按学段调整比例和装饰，不把小学全部幼儿化。视频、图片与H5统一主辅色、材质、光照、角色身份和关键道具结构；题板、按钮、进度与反馈复用同套主题元素，内容区保持低干扰，功能符号保持清楚。\n\n整课封面：新建视频互动课件默认使用16:9精美整图，用户明确不要或指定其他形式时按其要求。将本课实际主标题、短副标题（中文不超过15字，英文用短语）、进入按钮造型及文案各一套生成到图中；语言、角色、关键道具和画风与课程一致，构图有主次、文字清楚、边缘留安全区，不加无关文字、Logo、水印或尺寸标记。\n整图完整适配舞台，不裁切、不套进另一张封面；HTML不重复叠加可见标题、副标题或按钮。全封面共用一个透明进入热区，任意位置完成有效轻触释放或Enter/空格后进入一次，取消不进入，防重复与手势穿透；图内按钮只作视觉引导。封面仅用于整课入口，不在中途场景和预览重复；进入不计作答。封面错字或缺图交素材流程处理，不用CSS改字或普通标题页冒充精美封面。\n\n封面按现有images及允许的imageType规划，归属首个实际场景，以display写入其assetRefs；description写入确切文案和“整课入口封面”用途，不新增字段或空章节。首场纯video仍为h5=null；H5/mixed在contentDescription说明入口状态。含标题与按钮的封面不作视频首帧参考，镜头使用无UI的场景参考图。\n角色基准默认单个完整角色、单一姿态；道具基准明确结构与相对尺度。多视图设定表仅作设计资料，不直接当H5单体或视频主参考。派生图引用适用基准并明确保留和变化；依赖须在生产时实际解析为图像输入，不能只写名字就认定已完成图生图。\n\n功能按钮：上一题、下一题、提交、重试、继续使用“图标＋可见短文案”，上一题箭头向左、下一题向右；声音、静音、关闭等辅助操作可只用图标，并提供可访问名称。只保留流程需要的控件，文案遵守课件语言；普通按钮文字由HTML呈现，整图封面除外。\n优先复用https://oss-xlss.xdf.cn/ig-kpm/resources/standard-icon.css并按课件配色调整。内置语义不足时补同套饱满、圆润、简洁的SVG，不用emoji代替。用户要求图像式按钮或主题确需特殊质感时才生图：每图一个居中功能符号、透明底、无文字/品牌/水印，整套比例、配色、材质、光照一致，配齐需要的状态。默认只生图标、HTML画底座；已生成完整按钮底座则不重复绘制。热区、事件、状态和无障碍入口由HTML实现。\n\n使用公共图标时，在HTML head有效引用一次&lt;link rel=&quot;stylesheet&quot; href=&quot;https://oss-xlss.xdf.cn/ig-kpm/resources/standard-icon.css&quot;&gt;；这是样式依赖，不生成媒体assetId，也不要求模型读取URL查询用法。\n类名映射：播放cb-icon-play；暂停cb-icon-pause；自动播放cb-icon-autoplay；声音开启cb-icon-sound；静音cb-icon-mute；内容可见cb-icon-show；内容隐藏cb-icon-hide；场景目录cb-icon-menu；展开大纲cb-icon-outline；返回cb-icon-back；首页cb-icon-home；关闭cb-icon-close；重试cb-icon-retry；下一步cb-icon-next；提交cb-icon-submit；完成cb-icon-done。图标存在不代表相应功能已获授权；不得据此新增教师工具或自动播放入口。\n结构示例：&lt;div class=&quot;cb-theme&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;cb cb-text&quot;&gt;&lt;span&gt;下一题&lt;/span&gt;&lt;span class=&quot;cb-icon cb-icon-next&quot; aria-hidden=&quot;true&quot;&gt;&lt;/span&gt;&lt;/button&gt;&lt;/div&gt;。纯图标按钮用cb-round，文字按钮不用；主要播放/暂停用cb-large，主操作用cb-primary。主题颜色在实际包含按钮的.cb-theme容器上设置--cb-ink、--cb-bg、--cb-line、--cb-accent、--cb-selected、--cb-shadow、--cb-primary-shadow；不编造data-theme名称。普通图标和文字用--cb-ink，主操作为白色，--cb-accent须与白色清楚对比。保持内置图标遮罩、轮廓、比例，按钮随舞台缩放一次。\n\n角色与旁白：角色亲历的动作、愿望、提问及对话由该角色说；情境交代、观察引导、知识说明、操作指令与总结默认由旁白说，剧情明确由角色讲解时可归该角色。不强制每课同时配置两类声音，也不因新增规则给无声任务加配音。\n主人公默认少儿音，优先清亮、温暖、自然的少年男声；用户明确的角色性别或声音设定优先，避免成人播音腔、老年腔、尖锐假童声和过度夸张。旁白用清晰、亲切、语速适中的成年教师音，男女按课程选择，全课固定；角色与旁白分别绑定声音身份，不共用同一speaker冒充不同说话者。\n每段台词明确说话者、出镜状态和画面行为。旁白为画外音，画中人物只做自然动作和表情，不跟读、不对旁白口型；角色在画内说话时才安排该角色对口型，其他人物不张嘴代说；角色画外说话不要求口型。精确口型同步须有实际能力支持；不支持时保留台词归属，用动作或听者画面承载，不伪称已同步。\n从当前输入或工具返回的合法音色中选取最符合角色、年龄感和语言的voiceName，保持同一speaker全课稳定；无合适少儿音时使用最接近的合法音色，并在已有描述中标明待试听，不编造音色名。text只含实际朗读台词，声音要求和动作写入描述，不让TTS读出角色标签或舞台指令。\n\n参考音色：\n{{voice_names}}\n按目录中提供的语言、音色介绍和角色用途选声；voiceName填写目录中的原始音色标识，不填中文界面名称、介绍文字或占位符。若输入同时给出voiceCatalog.names，选择仍须属于该白名单。目录缺失或占位符未替换时不得编造音色，沿用当前输入/工具确实提供的合法目录；没有合法目录则保留输入缺失事实，不声称已完成选声。\n\n在speakers中分别定义实际发声的角色和旁白；无声人物不为登记外形而新增speaker。音频speakerId/text、镜头dub的speakerId/text/audioAssetId与referenceAudioIds逐项一致；dub保持数组。pictureDescription写清各段谁说话、谁出镜及嘴部动作，不只写“配合音频”。遵守参考数量与镜头时长限制；多说话者无法可靠同步时按话轮拆镜头或用画外表达，不混成同一角色持续说话，不凭文稿估算声称实际时长已验证。\n\n大小屏自适应：\n整课只使用一个1920×1080逻辑画布#app，封面、视频及H5的课程内容均放在其中；宿主注入的固定教师工具仍由宿主管理，不搬入#app、不改其结构。画布只缩放一次，CSS不另设transform，不为各场景再建缩放入口。\n1. head包含：\n```html\n&lt;meta name=&quot;viewport&quot; content=&quot;width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no&quot;&gt;\n```\n2. 页面与画布样式：\n```css\nhtml, body {\n    width: 100%;\n    height: 100%;\n    overflow: hidden;\n    margin: 0;\n    padding: 0;\n}\n#app {\n    position: absolute;\n    top: 50%;\n    left: 50%;\n    width: 1920px;\n    height: 1080px;\n    transform-origin: center center;\n    visibility: hidden;\n    overflow: hidden;\n}\n```\n3. 在#app已存在后、body结束前执行一次以下布局IIFE；resize复用同一updateScale，不重复注册监听：\n```js\n(function () {\n    var app = document.getElementById(&#x27;app&#x27;);\n    function updateScale() {\n        var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);\n        app.style.transform = &#x27;translate(-50%, -50%) scale(&#x27; + s + &#x27;)&#x27;;\n        app.style.visibility = &#x27;visible&#x27;;\n    }\n    window.addEventListener(&#x27;resize&#x27;, updateScale);\n    updateScale();\n})();\n```\n4. 内部元素的位置和尺寸以1920×1080逻辑画布的px值设计，不用vw/vh或基于视口百分比定位内部内容；html/body的100%和#app居中的50%属于外层适配。文字、图片、按钮及命中区同步缩放，拖拽坐标扣除内部定位容器的逻辑偏移。\n布局IIFE只调整画布transform和visibility，属于允许的页面布局初始化；不得启动场景、媒体、教学计时、录音或上报。场景根仍由宿主hidden控制，“顶层只注册场景”不禁止这个纯布局入口。\n视频交付画幅为16:9，按实际成片核对；视频层display:block、居中等比显示，清除非设计边距与基线空隙。教师工具不挤压画布，舞台外余区用主题底色；不拉伸或裁掉教学内容消除黑边，源片内黑边交媒体流程处理。拖拽取消或丢失捕获只清理/回滚，不结算，先清空拖动状态再释放捕获。\n\n字幕按教学任务确定：语文朗读/识字显示对应文本，故事听赏不默认铺全文；数学突出数量、条件与关系，少重复旁白；英语示范/跟读可显示原文，听辨作答隐藏泄露答案的转写，不默认加中文翻译。字词、算式、题干等核心教学文字不随可选字幕关闭。\n可切换字幕用独立层，不烧入视频；仅在已有真实文本、对应时间轴及接入能力时按媒体时间同步，通常1—2行，使用学科字体并避开题目、口型与操作区。不均分句子时长伪造同步；仅有文稿时可标为“讲解文本”。未启用字幕不构成缺陷，不向固定教师工具添加未支持的开关。\n\n将各资源实际需要的规则写入images.description、audios.description、shots.pictureDescription及h5.contentDescription；不把平台规范整段复制成生成描述。台词归属和口型要求进入对应镜头描述；不新增speakerType等协议字段。\n\n\u003c/span>chapters 每项仅输出 chapterId 和 scenes，chapterId 必须对应输入大纲的真实章节，每章恰好一组且 scenes 非空；场景必须放在对应章节内，不跨章混放。不要复述章节 name、order、content，服务端直接沿用已确认的章节 ID、名称、顺序和内容；场景顺序按章节分别从 1 连续编号。chapters、scenes、shots、dub、referenceImageIds、referenceAudioIds、assetRefs 等列表字段一律输出为数组，即使只有一条也要写成 [ … ]，不能写成单个对象；为空时写 []。\n按教学需要选择纯 H5、纯视频或混合场景。视频画面描述必须具体可执行，镜头时长满足业务范围与冻结视频模型能力的交集，配音台词、说话人和实际参考音频对应。角色和旁白选择已有音色并固定，不更改学生录音能力。\n资源按图片、音频、视频分组，保存直接生成依赖和唯一生产归属场景，多场景共享同一资源不重复规划。首尾帧只是并入多模态参考图片，不承诺供应商严格锁帧。场景 assetRefs 是对象数组，每项形如 {&quot;assetId&quot;:&quot;img_xxx&quot;,&quot;purpose&quot;:&quot;display&quot;}，不能写成资源 ID 字符串：assetId 必须是本课已规划的图片或音频资源 ID，purpose 只能取 display、playback、feedback 三者之一，本场没有引用时整个字段写 []。视频不得写进 assetRefs——镜头视频要到场景确认后才生产，此阶段在assetRefs中出现视频引用等于把未来资源当成已可用，方案会被判为不合法。assets.videos仍须为每个镜头保留唯一未来成品定义，不能因禁止assetRefs引用而删除视频规划。此阶段只给待准备要求，不编造已经生成的媒体地址、实际尺寸、媒体时长或成功状态。\n教学、风格和玩法证据必须分开使用；仅风格页不能贡献示例文字或题目，只有截图或未解析 H5 地址时不能推断点击、判题和计分。同页多选只使用各用途对应的有效证据。\n\n为每场明确教学目的、需要观察的信息、允许的操作和预期反馈，再选择纯视频、纯H5或混合形式。图片描述写清用途、必要对象、构图、素材边界和适用视觉约束；视频可承担叙事、观察、讲解或过程演示，不限定为剧情。画面主次服务当前任务，降低无关装饰与文字的干扰，保留教学必要的细节和比较关系，不机械限制对象数量或统一成同一布局。\n需要由H5独立控制、操作或改变状态的对象与背景按职责拆分，避免重复渲染和不可移除残影；互动结果由真实操作逻辑控制，不由预录媒体代替。涉及精确内容、数值、结构或操作顺序时，采用可核验来源与当前能力支持的可控呈现方式，不把生成模型的随机细节当事实。可用的已核验素材按授权与用途使用；不能因其含文字或采用真实画面就一律排除。需要动态改变或判定的内容优先由H5控制；纯视频中的必要教学内容须由可验证媒体能力承载，不虚构合成能力，也不擅自把纯视频改成交互课。\n混合场景在现有 h5.contentDescription 写明媒体结束、跳过、进入操作及反馈后的状态与衔接；pictureDescription 只包含可执行的镜头内容。预留区域、机位与运动范围按实际交互选择，只有需要稳定叠加时才限制镜头，不将固定机位推广为全部视频的规则。\n\n镜头描述明确主要动作及衔接状态，台词量、动作时间、停顿和镜头时长共同适配教学节奏及冻结能力；不以强制加速或丢失关键内容迁就时长。规划阶段不编造TTS实际时长，生成后由媒体链路校验实际音频与成片，不能仅靠描述宣称同步。\n\n一、先在整课范围内统一设计，再拆分场景\n读取已确认outline.designStyle、教师需求与各用途材料，确定本课的主题、年龄、视觉表现、重复主体及H5组件。已明确的设计必须执行；未明确的实现细节只做一次全课统一选择，不逐场自由取样、不改写确认大纲。具体选择必须落到下述实际输出文本中，不能只在内部想过或写“同上”。如果本课没有叙事人物，统一学习对象、环境和组件即可。\n先确定角色/道具的固定外形、服装或结构、颜色、比例、材质，以及允许变化；再确定视频与H5共用的表现方式、配色用途、光照、线条/轮廓和细节密度；再把适合本课的少量主题元素分配到题板、选项、按钮边框、进度或反馈。装饰与功能分开，正文区域空净、功能图标可识别，不以统一风格改变真实教材图的事实信息。\n输出协议没有全局视觉对象，不新增visualSystem/styleId/componentTasks等字段，也不改章节content。全课设计来自outline.designStyle；本阶段补全的具体选择分别写入每份相关images[].description、shots[].pictureDescription和h5.contentDescription。每份文本都展开本资源适用的特征，不能引用模型看不到的“其他提示词”。相同主题元素、主体和组件的描述必须一致，使用同一实际基准资源；不把整套无关UI规则复制到视频镜头描述。\n二、规划基准资产与真实依赖\n当前是规划阶段，不调用生成工具，不宣称新母版已生成或通过审核。先复用输入中可采用且适用的已有资产；没有合适基准且确有跨素材复用需要时，在本次assets中规划必要的角色/道具/组件基准节点，再规划依赖其产物的派生节点。通过dependencyAssetIds表达真实直接生成来源，保持唯一生产归属和无环依赖；基准与派生都可在本轮完整方案中定义，实际生产由后续流程按依赖执行。仅风格相似不要求无关资源互相依赖，不把图像、道具和背景互相引用成环。\n引用已有或本轮定义的真实assetId，不能把未生成的新资源写成已有成品URL。派生图明确保留与改变的部分；图生视频引用实际所需的场景/角色成图，遵守参考数量与冻结能力。参考数量不足时先规划经基准派生的合适场景合成参考，不偷偷丢掉人物或道具身份参考，也不假装供应商有锁帧能力。图片依赖用于生产，assetRefs用于显示/播放，两者不可混用。\n\n三、主题组件及场景资源\n题板与控件也属于全课视觉资产，不是素材完成后临时拼装的通用白板。按本课实际需要确定组件种类；在type=h5或mixed场景的h5.contentDescription中写明组件的稳定语义名称、外形/材质/色彩/主题装饰、文字安全区、正常/选中/不可用/反馈状态及实现方式。没有需要的组件不主动添加。\n可由代码稳定表达的圆角、边框、几何装饰、标准图标和状态效果，规划为同一套CSS/SVG组件复用；需要复杂造型、纹理或主题雕饰的题板/道具，规划独立组件基准图片，以合法scene_material类型生产，外部透明、组件实体保留、文字区域空净。相同组件跨场景引用同一assetId；确需尺寸/造型变体时复用适用基准并明确变化，不独立重画。题目、答案、进度数值与文字由H5真实文本叠加。所有H5使用的实际媒体都通过合法assetRefs声明；仅用于生成的参考图不因存在依赖而自动在界面显示。\n纯环境背景不包含题板/选项/按钮，并不禁止H5前景使用有主题设计的独立题板。视频实际出现的环境、角色、道具共享适用设计；界面组件不必出现在视频里，不能为了同风格把整张界面截图、按钮或题板当作无关镜头参考，造成UI进入视频。\n\n按用途区分H5背景/封面、H5独立前景素材、完整教学资料和视频整帧参考。在现有 images[].description 中写明用途、主体、构图、透明要求及不可出现的内容，不新增JSON字段或枚举。H5非背景图/封面图默认按独立前景素材生产：角色、道具、食物、选项图、可操作物等须为真实Alpha透明底且边缘干净，主体完整不截断，周围不带环境、方形底、白底、棋盘格或无关文字。PNG后缀不等于已经抠图；写“透明背景”也不代表生产完成。需要平台执行透明生成或抠图，并验证实际Alpha后才能交给H5；无此能力时明确资源阻断，不能用CSS混合模式、滤镜或白底相近冒充抠图。\n完整教学资料在教学确需且已确认完整呈现时可保留本底，但应作为整张资料呈现，不冒充可独立操作的道具。视频整帧参考、纯视频画面和封面可以保留完整背景，不对整帧机械抠图。需要不同交互项时分别规划独立资源，或使用明确可定位的图集裁切；禁止把同一张多对象拼图直接复制给多个不同答案。\nH5纯背景只提供情境氛围：默认16:9全幅，内容/操作区连续、低细节、低对比，装饰放边缘或远景，不烘焙文字、题干、答案、选项、控件、需要移走的道具或会被当成可操作项的对象。纯背景不得用中央大主体、边框、面板、卡片或分割线抢占承载区；H5层可按实际可读性加承载面板。观察型教学资料和视频场景不是纯背景，必要的教学对象应保留，并明确其承担的任务；不可借此把互动题目重新烘焙进背景。\n对跨素材/跨镜头重复的角色、关键道具、场景和组件，沿用输入中已确认且适用的视觉基准；缺少基准时规划待生成的单一基准及派生依赖，不称其已经生成或通过核验，记录稳定外形、比例、轮廓、颜色、服装/结构、材质和相对尺度；允许表情、姿势、视角、受教学要求驱动的状态变化，不允许无依据换脸、换物种、换服装、换道具结构或换画法。先复用现有可用基准，确需新基准则先规划基准节点与派生依赖；生成与实际核验由后续素材流程完成。派生图片的 dependencyAssetIds 必须引用真实基准ID；图生视频在 referenceImageIds/firstFrameAssetId/lastFrameAssetId 中传入实际适用图片。描述须展开本次所需稳定特征与风格，不只写“同上”“保持一致”。参考图是实际生成输入，不能只写名字；其存在也不等于已经验证一致。通用规则不固定某个角色、配色或餐车，更不强制无人物课程引入主角。\n画面风格统一到线条、造型比例、材质、色彩关系、光照和细节密度，而非每张图独立追求华丽。幼儿与低年级采用易辨认轮廓、亲和表情、简洁层次和温和情境，避免写实威吓、压迫光照及过密装饰；具体美术服从已确认年龄与风格，高年级不套幼儿造型。背景、前景、视频与H5控件使用同一课的视觉基准。\n四、场景教学与媒体交接\n混合或情境交互在 h5.contentDescription 写清“操作对象→初始位置→目标位置/区域→有效操作→判定→反馈→完成后状态”，用同一逻辑画布及归一化位置或明确相对锚点描述。叠加在媒体上的对象必须与可见目标位置相符；需要稳定叠加时保证镜头/背景可对齐，若有裁切须考虑object-fit、偏移及缩放。被拿走的对象不能仍烘焙在底图，放入目标的对象应确实出现在目标中；背景装饰不承担命中判定。静态截图不能证明拖拽判题，必须规划实际实现。\n每个视频场景及同场各镜头切换，都规划进入时立即可见的封面/静帧和等待状态；在现有图片description写明适用的sceneId/shotId及展示条件，通过display用途的assetRefs引用。若复用上一镜头的可用画面，写明适用状态和保留条件，不把开场封面无条件套到后续所有镜头；可复用已确认、适合展示的参考图，缺少时通过现有图片资源类型规划，禁止只规划黑底播放按钮。图片生产不依赖尚未生成的未来视频。视频生成后如平台具有抽帧能力可另行提供真实首帧，但不编造已抽出的地址。h5.contentDescription 对混合场景写清进入、等待、播放、暂停、视频结束、互动、重入的画面；纯视频仍保持h5=null；封面的展示用途及对应场景/镜头写入封面图片description，并通过现有assetRefs的合法展示用途引用，由组装环节读取。pictureDescription只写实际视频画面和动作，不写播放器按钮、等待界面或加载策略，不新增协议字段。封面/静帧与视频、H5的主体身份和状态相接。\n资源选择与职责：优先复用当前输入中已确认可采用的真实素材，不能用文件名或风格参考推断可采用教学内容。复杂插画和角色/道具按图片资源生产；普通几何形状、标准按钮图标、动态文字与需改变颜色/状态的图形优先在H5中用文本、CSS或SVG实现，不为了有图而把可控内容生成为位图。单个可操作图标只包含一个语义对象，不把多对象合成一图后直接当多个选项。\n声音按实际教学需求规划：需要人声朗读、讲解或角色台词时，通过现有audios定义提供完整可朗读text与有效speakerId，并按可用音色生成；禁止用浏览器默认语音或空音频冒充已交付配音。纯点击/成功反馈音效不伪造为TTS文本；仅在当前能力允许且本课需要时由H5实现，用户要求无声则不增加声音。每项实际使用的图片/音频写明用途、场景引用及触发时机；视频已有声音不得重复叠播其参考配音。只使用当前视频课件JSON字段，不能输出普通H5的imageTasks/audioTasks/codeTasks/reportMetrics旧协议。\n\n五、H5文字与操作要求\n字体\u003cspan class=\"add-mark\">按使用场景选择准确\u003c/span>font\u003cspan class=\"add-mark\">-\u003c/span>fa\u003cspan class=\"add-mark\">mily，由平台既有程序处理资源打包和引\u003c/span>用\u003cspan class=\"add-mark\">；不新增\u003c/span>字体\u003cspan class=\"add-mark\">下载\u003c/span>或\u003cspan class=\"add-mark\">在线\u003c/span>加载\u003cspan class=\"add-mark\">逻辑\u003c/span>，不\u003cspan class=\"add-mark\">猜文件路径\u003c/span>。\u003cspan class=\"add-mark\">\n\u003c/span>英语单词默认用&quot;Heinemann Roman&quot;，加粗用&quot;Heinemann Bold&quot;；人教版\u003cspan class=\"add-mark\">/人教手写体\u003c/span>用&quot;Italic Adjust&quot;，\u003cspan class=\"add-mark\">对应四线三格用&quot;Italic JX Four Four Adjust&quot;；\u003c/span>苏教版\u003cspan class=\"add-mark\">/苏教手写体\u003c/span>用&quot;shuangyu-SU&quot;，\u003cspan class=\"add-mark\">对应四线三格用&quot;shuangyu-SU-line&quot;；cake系列用&quot;EnglishCake&quot;，对应四线三格用&quot;EnglishCake4Line&quot;。仅指定\u003c/span>四线三格时用&quot;Italic JX Four Four Adjust&quot;，\u003cspan class=\"add-mark\">只应用于需书写线的\u003c/span>区域\u003cspan class=\"add-mark\">。\u003c/span>字体\u003cspan class=\"add-mark\">名称保留大小写、空格和连\u003c/span>字\u003cspan class=\"add-mark\">符；不为\u003c/span>加粗\u003cspan class=\"add-mark\">更\u003c/span>换教材字形。非英语普通文字、必要中文\u003cspan class=\"add-mark\">及\u003c/span>数字用&quot;方正准圆简体&quot;\u003cspan class=\"add-mark\">，加粗用\u003c/span>&quot;方正粗圆简体&quot;\u003cspan class=\"add-mark\">；汉字注音另按注音规则\u003c/span>。\u003cspan class=\"add-mark\">\n\u003c/span>英语课件可见标题、指令、按钮、反馈、进度标签及素材中文字默认英文；用户明确要求中文或双语才调整。非英语课件操作与说明默认中文，保留教学要求的英文、数字和算式。按钮用短文案单行，不添加未经要求的括号翻译。\n汉字需要拼音注音时，只输出汉字原文，整段使用 &quot;方正楷体拼音字库01&quot; 并留足行高；不得用 ruby/rt、独立拼音文本、数组转换、伪元素或手动空格重复注音。此规则仅针对汉字注音，不禁止教学目标本身为拼音字母或音节时的独立拼音内容；该类内容使用已确认教材规范及可用字体。多音字或字形不能由现有字体正确表达时回到内容/字体核验，不编造读音。\n字形是教学对象时，H5使用规范字体的真实文本，图像只承担卡壳或非文字插图；不能把模型随机画出的字母、汉字、数字当成规范字形。需要媒体内呈现时使用已核验字形素材及平台实际支持的可控呈现方式；原始教材或观察资料可保留必要文字，但须核验内容。仅修改body字体不能修正已烘焙在图片/视频中的错误字形。\n\n默认以1920×1080的16:9逻辑画布组织H5，等比适配不同屏幕。任一操作状态下，题干、全部操作项、必要反馈和主按钮都在可见画布内，无横纵滚动和遮挡；不要以压缩成普通网页16/18/20px正文来塞入内容，优先简化指令、分步或调整布局。默认逻辑字号：主标题56–72px、题干40–56px、选项36–56px、英文单词/重点词52–76px、英文短句36–56px、主按钮30–48px、反馈36–48px、进度标签36–56px、辅助标签24–48px；注音的视觉尺寸以28–56px及不裁切为参考，不另生成一层拼音。幼儿园小班至小学二年级的核心文字按需要增加4–10px，不把全部元素等比例放大。\n常用图标按钮建议96×96px、图标48–78px；播放/暂停建议112×112px、图标52–84px；重试/下一步建议宽220–280px高88–96px；其他图标按钮热区一般不小于88×88px，离画布边缘建议至少40px，相邻按钮间距建议至少24px。数值指逻辑画布尺度，缩放后仍需验证真实设备可辨认和可点按，不能因满足数值而挤压题目。\n只生成流程需要的真实有效控件，不因规则列举就主动添加首页、退出等按钮；常见功能采用明确且一致的标准图标与短文案，不用难辨识的角色或装饰物代替控件。学前和低年级每屏一个主要任务，短指令、明显可操作物、未要求无声且教学需要人声时规划关键题干配音及播放入口；明确无声时提供清楚的文字、图形或示范提示；答错就地温和反馈、立即重试，不因一次误触重置整关。单题反馈不弹阻断弹窗；需要整段完成反馈时用风格一致的界面及有效关闭/重试操作，不使用 alert/confirm/prompt。学段未知时先采用易读、大热区、短步骤的可用性兜底，不据此把美术风格设为幼儿风。\n核心交互同时适配PC网页、PC内嵌Chrome和移动/学习机触控。拖拽、连线等优先统一Pointer Events，正确处理指针捕获、释放、pointercancel及屏幕坐标到逻辑坐标的转换；不把hover、右键、双击、快捷键或HTML原生拖拽设为唯一完成方式。触控时仅在必要操作区域阻止滚动，保持其他控件可用。仅在非none模式、教学需要录音且宿主缺少该能力时给清楚提示；none模式不显示录音或学习机提示。不无限加载、不伪造结果，仍遵守学生录音模式和VcCourseware协议。\n自定义拖拽的图片设置draggable=false；记录活动pointerId并只处理对应指针。除pointerup/pointercancel外，lostpointercapture、窗口失焦、场景stop和鼠标buttons为0时均结束或取消拖拽，释放捕获并恢复可继续操作的状态；一次操作只提交一次结果。完成上报只使用任务实际允许的metrics和VcCourseware接口，不搬入其他课件的SDK调用或自行规定指标数量。\n\n六、输出前自检\n先建立一份全课唯一的ID清单，再输出完整方案；这是内部核对，不新增输出字段。chapterId逐字沿用outline；本轮新增sceneId、shotId、assetId、speakerId可按现有协议创建唯一且稳定的ID，定义一次后所有引用逐字一致。新规划ID不表示媒体已生成，后续HTML阶段只能使用交付清单中的真实资源。\n依次核对：\n1. 顶层只有chapters、speakers、assets；chapters逐一覆盖outline章节且不多不少，每项只有chapterId、scenes；场景只用规定字段，每章order从1连续编号。列表始终是数组，不把空数组写成null或字符串；只有协议明确可空的标量/对象才使用null。\n2. type、imageType、origin、purpose及voiceName只取本次输入提供的可用值；描述中的“封面”“角色基准”“题板”不作为新枚举。文中scene_material仅在输入图片类型允许时使用，否则选择输入中适用的现有类型，不自造编码。纯视频h5=null且shots非空；纯H5的shots=[]且h5有contentDescription；mixed两者均有。\n3. 资源ID跨images/audios/videos唯一，sceneId指向实际存在的唯一生产归属场景；跨场复用只增加引用，不重复定义。assetRefs每项仅assetId、purpose，且仅引用本课已定义的图片或音频。生产参考不等于H5展示，不把未来视频写入assetRefs。\n4. 每个shot恰好对应一个assets.videos定义，shotId一致。合并referenceImageIds与非空firstFrameAssetId/lastFrameAssetId后去重，连同referenceAudioIds，必须恰好组成对应视频的dependencyAssetIds；这些引用必须存在且类型正确，并满足当前模型限制。图片和音频不依赖未来视频；任何依赖不得自引用、重复或成环。\n5. dub始终为数组；每项speakerId、text、audioAssetId与对应音频定义一致，audioAssetId同时在该镜头referenceAudioIds中。没有配音时使用空数组，不制造空音频或无效speaker；不凭文字估算声称实际时长已验证。\n6. 逐场核对教学目的、组件复用、透明前景、主体基准、封面、交互坐标与完成条件。每份生产描述只写本资源必需的具体身份、风格、构图和变化，不整段复制平台规则；简单组件优先复用代码样式，不为每个状态重复新增图片。\n所有检查在输出前完成。只输出一个完整JSON对象，不输出Markdown围栏、思考过程、自检报告、资源URL、成功状态或附加字段；不得用省略号或“其余同上”代替章节与资源。\n\n声音需求与录音模式分别判断：requirement明确无配音、无音效或完全无声时，按其范围不增加相应声音和无效播放入口，用文字/图形/示范表达必要信息；不能因低龄默认规则强加声音。学生录音模式与课程旁白分别判断，none不表示禁止旁白；none下仍执行无录音入口、无评测面板规则。规划阶段不要求新音频已经存在；大纲只确定本课人声需要，场景方案按现有协议复用适用的真实音频或规划完整text、有效speaker及触发要求。新定义是待生成要求，不称已经可播放；后续交付与播放须使用实际成功资源，不能用空文件、浏览器默认TTS或伪造成功音频填缺口。\n\n对每个实际引用的参考图，在当前description或pictureDescription中说明它约束的是身份、风格、空间构图还是组件外观，以及不应继承的背景/文字/其他人物。referenceImageIds中的各图不能互相给出冲突的同一主体造型；选择已确认基准及与目标状态适用的派生图，不同时把冲突旧版本当参考。视觉角色与speakers中的声音身份使用一致名称并在镜头描述中明确对应关系；没有发声的可见角色不为了视觉身份登记而强行新增speakers，speakers结构不加字段。\n\n录音与评测边界：学生录音模式为 none 时，不规划或保留录音调用、麦克风入口、录音按钮、波形、录音计时及“按住说话”“开始录音”“重新录音”“录音太短”等文案，也不展示分数、星级、正确率等评测面板；开口任务使用点击选择或朗读后点“读完啦”等不采集音频的完成方式。可保留依据真实点击/操作的温和对错与完成反馈，教学内容中的数字和非评分装饰不属于评测结果。none 不显示学习机录音能力提示；只有非 none 模式且确需录音而缺少真实宿主能力时才显示该提示。该规则不禁止本课需要的旁白，也不改变宿主已有的合法学习结果提交协议，不授权虚构指标。\n本阶段学生录音模式读取输入的 selectedVoiceMode，不自行改变已确认模式；HTML阶段映射为任务中的voiceMode。\u003cspan class=\"add-mark\">\n\n本阶段将自适应要求写入各相关h5.contentDescription；纯视频仍保持h5=null，整课组装按统一画布规范实现，不为布局新增场景、资源或协议字段。这里只规划要求，不输出HTML/CSS/JS文件。\u003c/span>", "hunks": [{"kind": "insert", "old": "", "new": "\u003cspan class=\"add-mark\">\n视觉与教学要求：\n未指定画风时，采用儿童友好的3D Q版动画质感：圆润立体造型、柔和光影、克制的材质细节；不要求实时三维引擎。用户指定风格、已确认方案及真实教学资料优先，按学段调整比例和装饰，不把小学全部幼儿化。视频、图片与H5统一主辅色、材质、光照、角色身份和关键道具结构；题板、按钮、进度与反馈复用同套主题元素，内容区保持低干扰，功能符号保持清楚。\n\n整课封面：新建视频互动课件默认使用16:9精美整图，用户明确不要或指定其他形式时按其要求。将本课实际主标题、短副标题（中文不超过15字，英文用短语）、进入按钮造型及文案各一套生成到图中；语言、角色、关键道具和画风与课程一致，构图有主次、文字清楚、边缘留安全区，不加无关文字、Logo、水印或尺寸标记。\n整图完整适配舞台，不裁切、不套进另一张封面；HTML不重复叠加可见标题、副标题或按钮。全封面共用一个透明进入热区，任意位置完成有效轻触释放或Enter/空格后进入一次，取消不进入，防重复与手势穿透；图内按钮只作视觉引导。封面仅用于整课入口，不在中途场景和预览重复；进入不计作答。封面错字或缺图交素材流程处理，不用CSS改字或普通标题页冒充精美封面。\n\n封面按现有images及允许的imageType规划，归属首个实际场景，以display写入其assetRefs；description写入确切文案和“整课入口封面”用途，不新增字段或空章节。首场纯video仍为h5=null；H5/mixed在contentDescription说明入口状态。含标题与按钮的封面不作视频首帧参考，镜头使用无UI的场景参考图。\n角色基准默认单个完整角色、单一姿态；道具基准明确结构与相对尺度。多视图设定表仅作设计资料，不直接当H5单体或视频主参考。派生图引用适用基准并明确保留和变化；依赖须在生产时实际解析为图像输入，不能只写名字就认定已完成图生图。\n\n功能按钮：上一题、下一题、提交、重试、继续使用“图标＋可见短文案”，上一题箭头向左、下一题向右；声音、静音、关闭等辅助操作可只用图标，并提供可访问名称。只保留流程需要的控件，文案遵守课件语言；普通按钮文字由HTML呈现，整图封面除外。\n优先复用https://oss-xlss.xdf.cn/ig-kpm/resources/standard-icon.css并按课件配色调整。内置语义不足时补同套饱满、圆润、简洁的SVG，不用emoji代替。用户要求图像式按钮或主题确需特殊质感时才生图：每图一个居中功能符号、透明底、无文字/品牌/水印，整套比例、配色、材质、光照一致，配齐需要的状态。默认只生图标、HTML画底座；已生成完整按钮底座则不重复绘制。热区、事件、状态和无障碍入口由HTML实现。\n\n使用公共图标时，在HTML head有效引用一次&lt;link rel=&quot;stylesheet&quot; href=&quot;https://oss-xlss.xdf.cn/ig-kpm/resources/standard-icon.css&quot;&gt;；这是样式依赖，不生成媒体assetId，也不要求模型读取URL查询用法。\n类名映射：播放cb-icon-play；暂停cb-icon-pause；自动播放cb-icon-autoplay；声音开启cb-icon-sound；静音cb-icon-mute；内容可见cb-icon-show；内容隐藏cb-icon-hide；场景目录cb-icon-menu；展开大纲cb-icon-outline；返回cb-icon-back；首页cb-icon-home；关闭cb-icon-close；重试cb-icon-retry；下一步cb-icon-next；提交cb-icon-submit；完成cb-icon-done。图标存在不代表相应功能已获授权；不得据此新增教师工具或自动播放入口。\n结构示例：&lt;div class=&quot;cb-theme&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;cb cb-text&quot;&gt;&lt;span&gt;下一题&lt;/span&gt;&lt;span class=&quot;cb-icon cb-icon-next&quot; aria-hidden=&quot;true&quot;&gt;&lt;/span&gt;&lt;/button&gt;&lt;/div&gt;。纯图标按钮用cb-round，文字按钮不用；主要播放/暂停用cb-large，主操作用cb-primary。主题颜色在实际包含按钮的.cb-theme容器上设置--cb-ink、--cb-bg、--cb-line、--cb-accent、--cb-selected、--cb-shadow、--cb-primary-shadow；不编造data-theme名称。普通图标和文字用--cb-ink，主操作为白色，--cb-accent须与白色清楚对比。保持内置图标遮罩、轮廓、比例，按钮随舞台缩放一次。\n\n角色与旁白：角色亲历的动作、愿望、提问及对话由该角色说；情境交代、观察引导、知识说明、操作指令与总结默认由旁白说，剧情明确由角色讲解时可归该角色。不强制每课同时配置两类声音，也不因新增规则给无声任务加配音。\n主人公默认少儿音，优先清亮、温暖、自然的少年男声；用户明确的角色性别或声音设定优先，避免成人播音腔、老年腔、尖锐假童声和过度夸张。旁白用清晰、亲切、语速适中的成年教师音，男女按课程选择，全课固定；角色与旁白分别绑定声音身份，不共用同一speaker冒充不同说话者。\n每段台词明确说话者、出镜状态和画面行为。旁白为画外音，画中人物只做自然动作和表情，不跟读、不对旁白口型；角色在画内说话时才安排该角色对口型，其他人物不张嘴代说；角色画外说话不要求口型。精确口型同步须有实际能力支持；不支持时保留台词归属，用动作或听者画面承载，不伪称已同步。\n从当前输入或工具返回的合法音色中选取最符合角色、年龄感和语言的voiceName，保持同一speaker全课稳定；无合适少儿音时使用最接近的合法音色，并在已有描述中标明待试听，不编造音色名。text只含实际朗读台词，声音要求和动作写入描述，不让TTS读出角色标签或舞台指令。\n\n参考音色：\n{{voice_names}}\n按目录中提供的语言、音色介绍和角色用途选声；voiceName填写目录中的原始音色标识，不填中文界面名称、介绍文字或占位符。若输入同时给出voiceCatalog.names，选择仍须属于该白名单。目录缺失或占位符未替换时不得编造音色，沿用当前输入/工具确实提供的合法目录；没有合法目录则保留输入缺失事实，不声称已完成选声。\n\n在speakers中分别定义实际发声的角色和旁白；无声人物不为登记外形而新增speaker。音频speakerId/text、镜头dub的speakerId/text/audioAssetId与referenceAudioIds逐项一致；dub保持数组。pictureDescription写清各段谁说话、谁出镜及嘴部动作，不只写“配合音频”。遵守参考数量与镜头时长限制；多说话者无法可靠同步时按话轮拆镜头或用画外表达，不混成同一角色持续说话，不凭文稿估算声称实际时长已验证。\n\n大小屏自适应：\n整课只使用一个1920×1080逻辑画布#app，封面、视频及H5的课程内容均放在其中；宿主注入的固定教师工具仍由宿主管理，不搬入#app、不改其结构。画布只缩放一次，CSS不另设transform，不为各场景再建缩放入口。\n1. head包含：\n```html\n&lt;meta name=&quot;viewport&quot; content=&quot;width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no&quot;&gt;\n```\n2. 页面与画布样式：\n```css\nhtml, body {\n    width: 100%;\n    height: 100%;\n    overflow: hidden;\n    margin: 0;\n    padding: 0;\n}\n#app {\n    position: absolute;\n    top: 50%;\n    left: 50%;\n    width: 1920px;\n    height: 1080px;\n    transform-origin: center center;\n    visibility: hidden;\n    overflow: hidden;\n}\n```\n3. 在#app已存在后、body结束前执行一次以下布局IIFE；resize复用同一updateScale，不重复注册监听：\n```js\n(function () {\n    var app = document.getElementById(&#x27;app&#x27;);\n    function updateScale() {\n        var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);\n        app.style.transform = &#x27;translate(-50%, -50%) scale(&#x27; + s + &#x27;)&#x27;;\n        app.style.visibility = &#x27;visible&#x27;;\n    }\n    window.addEventListener(&#x27;resize&#x27;, updateScale);\n    updateScale();\n})();\n```\n4. 内部元素的位置和尺寸以1920×1080逻辑画布的px值设计，不用vw/vh或基于视口百分比定位内部内容；html/body的100%和#app居中的50%属于外层适配。文字、图片、按钮及命中区同步缩放，拖拽坐标扣除内部定位容器的逻辑偏移。\n布局IIFE只调整画布transform和visibility，属于允许的页面布局初始化；不得启动场景、媒体、教学计时、录音或上报。场景根仍由宿主hidden控制，“顶层只注册场景”不禁止这个纯布局入口。\n视频交付画幅为16:9，按实际成片核对；视频层display:block、居中等比显示，清除非设计边距与基线空隙。教师工具不挤压画布，舞台外余区用主题底色；不拉伸或裁掉教学内容消除黑边，源片内黑边交媒体流程处理。拖拽取消或丢失捕获只清理/回滚，不结算，先清空拖动状态再释放捕获。\n\n字幕按教学任务确定：语文朗读/识字显示对应文本，故事听赏不默认铺全文；数学突出数量、条件与关系，少重复旁白；英语示范/跟读可显示原文，听辨作答隐藏泄露答案的转写，不默认加中文翻译。字词、算式、题干等核心教学文字不随可选字幕关闭。\n可切换字幕用独立层，不烧入视频；仅在已有真实文本、对应时间轴及接入能力时按媒体时间同步，通常1—2行，使用学科字体并避开题目、口型与操作区。不均分句子时长伪造同步；仅有文稿时可标为“讲解文本”。未启用字幕不构成缺陷，不向固定教师工具添加未支持的开关。\n\n将各资源实际需要的规则写入images.description、audios.description、shots.pictureDescription及h5.contentDescription；不把平台规范整段复制成生成描述。台词归属和口型要求进入对应镜头描述；不新增speakerType等协议字段。\n\n\u003c/span>"}, {"kind": "delete", "old": "\u003cspan class=\"del-mark\">将已确认 designStyle 中适用于当前资源的具体约束，完整写入 images[].description、shots[].pictureDescription 与 h5.contentDescription，不能仅写素材名称或“风格同上”。同课图片、视频和界面保持连贯的视觉语言，允许教学需要的场景、景别、构图及视觉重点变化；必要的真实资料保持其事实特征，不为统一美术而改写教学信息。\n对在多份素材或多个场景中重复出现的主体，区分稳定的身份特征与本课允许的状态变化。优先复用适合的已有资产；需要新基准时，只按实际重复使用需要规划，使用现有资源类型与唯一生产归属。派生图片通过 dependencyAssetIds 引用实际用于生成的基准；视频通过现有参考字段传入实际所需素材，并遵守冻结能力。不要给没有重复主体的课程强加母版，不为无关素材添加依赖。教学明确要求的变化须保持原因与过程一致，不能被“身份一致”规则错误禁止。\n\n\u003c/span>", "new": ""}, {"kind": "delete", "old": "\u003cspan class=\"del-mark\">按教学表达需要安排说话者及出镜方式，不强制每课同时存在旁白和角色。相同声音身份保持稳定，audios[].text、speakerId、镜头 dub 与
